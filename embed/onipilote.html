function assigneeRow(label,userId,roleId,clientId){
  const u=teammate(userId);
  return '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--paper)" onclick="openAssignModal(\''+clientId+'\',\''+roleId+'\')" style="cursor:pointer">'+
    (u?'<div class="av" style="width:26px;height:26px;font-size:10px;border-radius:6px;background:linear-gradient(135deg,var(--gold),var(--goldD));color:#FFF;display:flex;align-items:center;justify-content:center;font-family:var(--SF);font-weight:700">'+escapeHtml(u.avatar||initials(u.name))+'</div>':'<div style="width:26px;height:26px;border-radius:6px;background:var(--paper);border:1px dashed var(--linen2);display:flex;align-items:center;justify-content:center;color:var(--stone)">+</div>')+
    '<div style="flex:1;min-width:0;cursor:pointer" onclick="openAssignModal(\''+clientId+'\',\''+roleId+'\')"><div style="font-family:var(--SS);font-size:11.5px;color:var(--text);font-weight:600">'+escapeHtml(u?u.name:'Non assigné')+'</div><div style="font-family:var(--SS);font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--stone);font-weight:600">'+escapeHtml(label)+'</div></div></div>';
}

function setClientTab(cid,tab){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;cl._tab=tab;
  document.querySelectorAll('.tabs .tab').forEach(b=>b.classList.remove('active'));
  const idx=['etapes','timeline','tasks','docs','comm','sav'].indexOf(tab);
  document.querySelectorAll('.tabs .tab')[idx]?.classList.add('active');
  renderClientTab(cl,tab);
}

function renderClientTab(cl,tab){
  const body=document.getElementById('cli-tab-body');if(!body)return;
  if(tab==='etapes'){
    let h='<div class="card"><div class="card-h"><div><div class="card-title">Sous-étapes de ce client</div><div class="card-sub">Cliquez pour faire avancer ou revenir en arrière</div></div></div>';
    PIPELINE.forEach(p=>{
      h+='<div style="margin-bottom:18px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div style="width:26px;height:26px;border-radius:6px;background:'+p.color+';color:#FFF;font-family:var(--SF);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px">'+p.id+'</div><div style="font-family:var(--SF);font-size:15px;font-weight:700;color:var(--ink)">'+escapeHtml(p.name)+'</div><div style="font-family:var(--SS);font-size:10px;color:var(--stone);margin-left:auto;letter-spacing:0.06em;text-transform:uppercase">'+escapeHtml(p.role)+'</div></div><div class="substage-grid">';
      p.substages.forEach(sb=>{
        const cur=cl.stage===sb.id;
        const phNum=parseFloat(getPhase(cl.stage).id);const pNum=parseFloat(p.id);
        const subNum=parseFloat(sb.id);const clNum=parseFloat(cl.stage||'1.1');
        const done=clNum>subNum;
        h+='<div class="substage-row '+(cur?'current':done?'done':'')+'" onclick="updateStage(\''+cl.id+'\',\''+sb.id+'\')"><div class="substage-check"></div><div class="substage-num">'+sb.id+'</div><div class="substage-lbl">'+escapeHtml(sb.name)+'</div></div>';
      });
      h+='</div></div>';
    });
    h+='</div>';
    body.innerHTML=h;
  }
  else if(tab==='timeline'){
    const acts=[...(cl.history||[]).map(h=>({...h,type:h.type||'stage'})),...(cl.notes||[]).map(n=>({type:'note',at:n.at,by:n.by,body:n.body})),...(cl.communications||[]).map(co=>({type:'comm',at:co.at,by:co.by,body:co.subject||co.body,channel:co.channel}))].sort((a,b)=>new Date(b.at)-new Date(a.at));
    let h='<div class="card"><div class="card-h"><div><div class="card-title">Activité complète</div><div class="card-sub">Tout l\'historique du client en un coup d\'œil</div></div><button class="btn sm" onclick="openNoteModal(\''+cl.id+'\')">+ Note</button></div>';
    h+=acts.length?'<div class="timeline">'+acts.map(it=>{
      const author=teammate(it.by)?.name||'Système';
      let title='Activité',body=it.body||'';
      if(it.type==='stage'){title='Étape : '+it.from+' → '+it.to;body=it.note||'';}
      else if(it.type==='note'){title='Note interne';}
      else if(it.type==='comm'){title=(it.channel==='sms'?'📱 SMS envoyé':'✉ Email envoyé');}
      else if(it.type==='create'){title='Client créé';}
      return '<div class="tl-item'+(it.type==='create'||it.type==='stage'?' system':'')+'"><div class="tl-time">'+fmtDateTime(it.at)+' · '+relTime(it.at)+'</div><div class="tl-title">'+escapeHtml(title)+'</div>'+(body?'<div class="tl-body">'+escapeHtml(body)+'</div>':'')+'<div class="tl-author">par '+escapeHtml(author)+'</div></div>';
    }).join('')+'</div>':'<div class="empty"><div class="empty-ico">∅</div>Pas encore d\'activité.</div>';
    h+='</div>';
    body.innerHTML=h;
  }
  else if(tab==='tasks'){
    const tasks=cl.tasks||[];
    let h='<div class="card"><div class="card-h"><div><div class="card-title">Tâches</div><div class="card-sub">'+tasks.filter(t=>!t.done).length+' en cours sur '+tasks.length+' total</div></div><button class="btn primary sm" onclick="openTaskModal(\''+cl.id+'\')">+ Tâche</button></div>';
    h+=tasks.length?'<div style="display:flex;flex-direction:column;gap:7px">'+tasks.sort((a,b)=>(a.done?1:0)-(b.done?1:0)).map(renderTaskRowDetail).join('')+'</div>':'<div class="empty"><div class="empty-ico">✓</div>Aucune tâche.</div>';
    h+='</div>';
    body.innerHTML=h;
  }
  else if(tab==='docs'){
    const docs=cl.documents||[];
    let h='<div class="card"><div class="card-h"><div><div class="card-title">Documents</div><div class="card-sub">Devis, contrats, plans, photos chantier, PV…</div></div><button class="btn primary sm" onclick="openDocModal(\''+cl.id+'\')">+ Document</button></div>';
    h+=docs.length?'<div style="display:flex;flex-direction:column;gap:8px">'+docs.map(d=>{
      const ext=(d.name||'').split('.').pop().toUpperCase().slice(0,4)||'DOC';
      return '<div class="doc"><div class="doc-ico">'+escapeHtml(ext)+'</div><div class="doc-info"><div class="doc-name">'+escapeHtml(d.name||'Document')+'</div><div class="doc-meta">'+fmtDate(d.at)+(d.size?' · '+d.size:'')+(d.tag?' · '+escapeHtml(d.tag):'')+'</div></div><button class="btn ghost xs" onclick="deleteDoc(\''+cl.id+'\',\''+d.id+'\')" aria-label="Supprimer le document">✕</button></div>';
    }).join('')+'</div>':'<div class="empty"><div class="empty-ico">📄</div>Aucun document. Glissez vos fichiers ou cliquez sur <strong>+ Document</strong>.</div>';
    h+='</div>';
    body.innerHTML=h;
  }
  else if(tab==='comm'){
    const comms=cl.communications||[];
    let h='<div class="card"><div class="card-h"><div><div class="card-title">Communications</div><div class="card-sub">Emails, SMS, appels — tout l\'échange avec ce client</div></div><div style="display:flex;gap:6px"><button class="btn primary sm" onclick="openSendCommModal(\''+cl.id+'\',\'email\')">✉ Email</button><button class="btn sm" onclick="openSendCommModal(\''+cl.id+'\',\'sms\')">📱 SMS</button></div></div>';
    h+=comms.length?'<div style="display:flex;flex-direction:column;gap:9px">'+comms.sort((a,b)=>new Date(b.at)-new Date(a.at)).map(co=>{
      const ico=co.channel==='sms'?'📱':co.channel==='call'?'📞':'✉';
      return '<div class="card" style="padding:14px 16px;box-shadow:none;border-color:var(--linen)"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px"><div style="font-family:var(--SS);font-size:12.5px;font-weight:700;color:var(--ink)">'+ico+' '+escapeHtml(co.subject||co.channel.toUpperCase())+'</div><div style="font-family:var(--SS);font-size:10.5px;color:var(--stone)">'+fmtDateTime(co.at)+'</div></div><div style="font-family:var(--SS);font-size:12px;color:var(--text);line-height:1.55;white-space:pre-wrap">'+escapeHtml((co.body||'').slice(0,400))+(co.body&&co.body.length>400?'…':'')+'</div></div>';
    }).join('')+'</div>':'<div class="empty"><div class="empty-ico">✉</div>Aucune communication.</div>';
    h+='</div>';
    body.innerHTML=h;
  }
  else if(tab==='sav'){
    const sav=cl.sav||{tickets:[],garanties:null};
    let h='<div class="card"><div class="card-h"><div><div class="card-title">SAV & Garanties</div><div class="card-sub">Tickets en cours et suivi des garanties</div></div><button class="btn primary sm" onclick="openTicketModal(\''+cl.id+'\')">+ Ticket SAV</button></div>';
    /* Garanties */
    if(sav.garanties&&sav.garanties.start){
      const start=new Date(sav.garanties.start);
      const now=new Date();
      const yrs=(now-start)/(86400000*365.25);
      h+='<div class="split" style="margin-bottom:14px">';
      h+=garCard('GPA · 1 an','gpa',start,1,yrs);
      h+=garCard('Biennale · 2 ans','bien',start,2,yrs);
      h+='</div>';
      h+=garCard('Décennale · 10 ans','dec',start,10,yrs);
    } else {
      h+='<div class="card glass" style="padding:14px;margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><strong>Garanties non démarrées.</strong> <span style="color:var(--text2);font-size:12px">Démarrent automatiquement à la signature du PV de réception (étape 5.3).</span></div><button class="btn ghost sm" onclick="startGaranties(\''+cl.id+'\')">Démarrer manuellement</button></div></div>';
    }
    /* Tickets */
    h+='<div class="rule"></div><div style="font-family:var(--SF);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:10px">Tickets SAV</div>';
    const tk=sav.tickets||[];
    h+=tk.length?'<div style="display:flex;flex-direction:column;gap:7px">'+tk.map(t=>{
      const stCls=t.status==='open'?'b-red':t.status==='wip'?'b-blue':'b-green';
      const stLbl=t.status==='open'?'Ouvert':t.status==='wip'?'En cours':'Résolu';
      return '<div class="task"><div style="flex:1"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span class="badge '+stCls+'">'+stLbl+'</span><span style="font-family:var(--SS);font-size:13px;font-weight:700;color:var(--ink)">'+escapeHtml(t.title)+'</span></div><div style="font-family:var(--SS);font-size:11.5px;color:var(--text2);line-height:1.5">'+escapeHtml(t.description||'')+'</div><div style="font-family:var(--SS);font-size:10.5px;color:var(--stone);margin-top:5px">Créé '+fmtDate(t.at)+(t.assignee?' · Assigné à '+escapeHtml(teammate(t.assignee)?.name||'?'):'')+'</div></div><button class="btn ghost xs" onclick="cycleTicket(\''+cl.id+'\',\''+t.id+'\')">→</button></div>';
    }).join('')+'</div>':'<div class="empty"><div class="empty-ico">🛡</div>Aucun ticket SAV.</div>';
    h+='</div>';
    body.innerHTML=h;
  }
}

function garCard(label,kind,start,years,curYrs){
  const pct=Math.min(100,Math.max(0,(curYrs/years)*100));
  const remDays=Math.max(0,Math.floor((years*365.25-curYrs*365.25)));
  const expired=curYrs>years;
  return '<div class="gar '+kind+'"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><div style="font-family:var(--SS);font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--stone)">'+escapeHtml(label)+'</div><div style="font-family:var(--SF);font-size:15px;font-weight:700;color:var(--ink);margin-top:3px">'+(expired?'Expirée':remDays+' jours restants')+'</div></div><div style="font-family:var(--SF);font-size:18px;font-weight:700;color:var(--gold)">'+pct.toFixed(0)+'%</div></div><div class="gar-prog"><div style="width:'+pct+'%"></div></div><div style="font-family:var(--SS);font-size:10px;color:var(--stone);margin-top:5px">Démarre : '+fmtDate(start.toISOString())+' · Fin : '+fmtDate(new Date(start.getTime()+years*365.25*86400000).toISOString())+'</div></div>';
}

function renderTaskRowDetail(t){
  const overdue=t.due&&new Date(t.due)<new Date()&&!t.done;
  const ass=teammate(t.assignee)?.name||'Non assigné';
  const cid=t._cid||S.selectedClientId;
  return '<div class="task'+(t.done?' done':'')+'"><div class="task-check" role="checkbox" aria-checked="'+(t.done?'true':'false')+'" tabindex="0" onclick="toggleTask(\''+cid+'\',\''+t.id+'\')"></div><div class="task-info"><div class="task-title">'+escapeHtml(t.title)+'</div>'+(t.body?'<div style="font-family:var(--SS);font-size:11.5px;color:var(--text2);margin-top:3px;line-height:1.5">'+escapeHtml(t.body)+'</div>':'')+'<div class="task-meta"><span>'+escapeHtml(ass)+'</span>'+(t.due?'<span>·</span><span style="'+(overdue?'color:var(--red);font-weight:700':'')+'">'+(overdue?'En retard · ':'')+fmtDate(t.due)+'</span>':'')+'</div></div><button class="btn ghost xs" onclick="deleteTask(\''+cid+'\',\''+t.id+'\')" aria-label="Supprimer la tâche">✕</button></div>';
}

/* ═══════════════════════════════════════════════════════
   VIEW : TASKS
   ═══════════════════════════════════════════════════════ */
function renderTasks(c){
  const tasks=allTasks();
  const open=tasks.filter(t=>!t.done);
  const done=tasks.filter(t=>t.done);
  const overdue=open.filter(t=>t.due&&new Date(t.due)<new Date());

  const k=document.createElement('div');k.className='kpis';
  k.innerHTML=
    kpiCard('À faire',open.length,'tâches en cours','check')+
    kpiCard('En retard',overdue.length,'à traiter en priorité','warn',overdue.length>0?'down':'')+
    kpiCard('Terminées',done.length,'cette semaine','trend','','up');
  c.appendChild(k);

  const card=document.createElement('div');card.className='card';
  card.innerHTML='<div class="card-h"><div><div class="card-title">Toutes les tâches</div><div class="card-sub">'+tasks.length+' au total · '+open.length+' à faire</div></div></div>'+(tasks.length?'<div style="display:flex;flex-direction:column;gap:7px">'+tasks.map(t=>renderTaskRow(t)).join('')+'</div>':'<div class="empty"><div class="empty-ico">✓</div>Aucune tâche dans toute l\'équipe.</div>');
  c.appendChild(card);
}

/* ═══════════════════════════════════════════════════════
   VIEW : COMMUNICATIONS
   ═══════════════════════════════════════════════════════ */
function renderComm(c){
  const all=[];
  S.clients.forEach(cl=>(cl.communications||[]).forEach(co=>all.push({...co,clientId:cl.id,clientName:clientFullName(cl)})));
  all.sort((a,b)=>new Date(b.at)-new Date(a.at));

  const card=document.createElement('div');card.className='card';
  card.innerHTML='<div class="card-h"><div><div class="card-title">Toutes les communications</div><div class="card-sub">Emails et SMS envoyés depuis OniPilote</div></div></div>'+(all.length?'<div style="display:flex;flex-direction:column;gap:9px">'+all.map(co=>'<div class="card" style="padding:14px 16px;box-shadow:none;border-color:var(--linen);cursor:pointer" onclick="openClient(\''+co.clientId+'\')"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px"><div><span class="badge b-gold">'+co.channel.toUpperCase()+'</span> <span style="font-family:var(--SS);font-size:13px;font-weight:700;color:var(--ink);margin-left:4px">'+escapeHtml(co.subject||'')+'</span></div><div style="font-family:var(--SS);font-size:10.5px;color:var(--stone)">'+fmtDateTime(co.at)+'</div></div><div style="font-family:var(--SS);font-size:11.5px;color:var(--gold);font-weight:600;margin-bottom:5px">'+escapeHtml(co.clientName)+'</div><div style="font-family:var(--SS);font-size:12px;color:var(--text);line-height:1.55;white-space:pre-wrap">'+escapeHtml((co.body||'').slice(0,300))+(co.body&&co.body.length>300?'…':'')+'</div></div>').join('')+'</div>':'<div class="empty"><div class="empty-ico">✉</div>Aucune communication encore. Ouvrez un client pour envoyer un email ou SMS.</div>');
  c.appendChild(card);
}

/* ═══════════════════════════════════════════════════════
   VIEW : SAV
   ═══════════════════════════════════════════════════════ */
function renderSAV(c){
  const allTickets=[];
  const allGaranties=[];
  S.clients.forEach(cl=>{
    (cl.sav?.tickets||[]).forEach(t=>allTickets.push({...t,clientId:cl.id,clientName:clientFullName(cl)}));
    if(cl.sav?.garanties?.start)allGaranties.push({clientId:cl.id,clientName:clientFullName(cl),start:cl.sav.garanties.start});
  });
  const open=allTickets.filter(t=>t.status==='open'||t.status==='wip');

  const k=document.createElement('div');k.className='kpis';
  k.innerHTML=
    kpiCard('Tickets ouverts',open.length,allTickets.length+' total','warn')+
    kpiCard('Sous garantie',allGaranties.length,'clients couverts','shield')+
    kpiCard('GPA actives',allGaranties.filter(g=>(new Date()-new Date(g.start))/(86400000*365.25)<1).length,'< 1 an depuis PV','trend');
  c.appendChild(k);

  const tk=document.createElement('div');tk.className='card';
  tk.innerHTML='<div class="card-h"><div><div class="card-title">Tickets SAV ouverts</div><div class="card-sub">À traiter en priorité</div></div></div>'+(open.length?'<div style="display:flex;flex-direction:column;gap:8px">'+open.map(t=>'<div class="task" onclick="openClient(\''+t.clientId+'\')" style="cursor:pointer"><div style="flex:1"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span class="badge '+(t.status==='open'?'b-red':'b-blue')+'">'+(t.status==='open'?'Ouvert':'En cours')+'</span><span style="font-family:var(--SS);font-size:13px;font-weight:700;color:var(--ink)">'+escapeHtml(t.title)+'</span></div><div style="font-family:var(--SS);font-size:11.5px;color:var(--gold);font-weight:600">'+escapeHtml(t.clientName)+'</div></div></div>').join('')+'</div>':'<div class="empty"><div class="empty-ico">🛡</div>Aucun ticket ouvert.</div>');
  c.appendChild(tk);

  const gar=document.createElement('div');gar.className='card';
  gar.innerHTML='<div class="card-h"><div><div class="card-title">Suivi garanties</div><div class="card-sub">GPA / biennale / décennale par client</div></div></div>';
  if(!allGaranties.length){gar.innerHTML+='<div class="empty"><div class="empty-ico">🛡</div>Aucune garantie active. Les garanties démarrent à la signature du PV (5.3).</div>';}
  else{
    let h='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Client</th><th>Démarrage</th><th>GPA</th><th>Biennale</th><th>Décennale</th></tr></thead><tbody>';
    allGaranties.forEach(g=>{
      const st=new Date(g.start);
      const yrs=(Date.now()-st)/(86400000*365.25);
      const gpaPct=Math.min(100,(yrs/1)*100);
      const bienPct=Math.min(100,(yrs/2)*100);
      const decPct=Math.min(100,(yrs/10)*100);
      h+='<tr onclick="openClient(\''+g.clientId+'\')"><td style="font-weight:700">'+escapeHtml(g.clientName)+'</td><td style="font-size:12px;color:var(--stone)">'+fmtDate(g.start)+'</td>'+
        '<td>'+(yrs<1?'<div style="display:flex;align-items:center;gap:7px;font-size:11.5px"><div style="width:60px;height:5px;background:var(--linen);border-radius:3px;overflow:hidden"><div style="width:'+gpaPct+'%;height:100%;background:var(--gold)"></div></div>'+gpaPct.toFixed(0)+'%</div>':'<span class="badge b-stone">Expirée</span>')+'</td>'+
        '<td>'+(yrs<2?'<div style="display:flex;align-items:center;gap:7px;font-size:11.5px"><div style="width:60px;height:5px;background:var(--linen);border-radius:3px;overflow:hidden"><div style="width:'+bienPct+'%;height:100%;background:var(--blue)"></div></div>'+bienPct.toFixed(0)+'%</div>':'<span class="badge b-stone">Expirée</span>')+'</td>'+
        '<td>'+(yrs<10?'<div style="display:flex;align-items:center;gap:7px;font-size:11.5px"><div style="width:60px;height:5px;background:var(--linen);border-radius:3px;overflow:hidden"><div style="width:'+decPct+'%;height:100%;background:var(--green)"></div></div>'+decPct.toFixed(0)+'%</div>':'<span class="badge b-stone">Expirée</span>')+'</td>'+
        '</tr>';
    });
    h+='</tbody></table></div>';
    gar.innerHTML+=h;
  }
  c.appendChild(gar);
}

/* ═══════════════════════════════════════════════════════
   VIEW : STATS — KPIs, performance équipe, indicateurs business
   ═══════════════════════════════════════════════════════ */
function renderStats(c){
  renderStatsRdvOrigine(c); /* RDV par période + origine des contacts (en tête) */
  const clients = S.clients||[];
  const team = S.team||[];
  const tasks = S.tasks||[];

  // KPIs globaux
  const totalClients = clients.length;
  const won = clients.filter(cl=>cl.stage && (cl.stage.startsWith('5')||cl.stage.startsWith('6'))).length;
  const inChantier = clients.filter(cl=>cl.stage && cl.stage.startsWith('4')).length;
  const inCommercial = clients.filter(cl=>cl.stage && cl.stage.startsWith('2')).length;
  const totalRevenue = clients.reduce((s,c)=>s+(Number(c.value)||0),0);
  const wonRevenue = clients.filter(cl=>cl.stage && (cl.stage.startsWith('5')||cl.stage.startsWith('6'))).reduce((s,c)=>s+(Number(c.value)||0),0);
  const avgDealSize = totalClients>0?Math.round(totalRevenue/totalClients):0;
  const conversionRate = totalClients>0?Math.round((won/totalClients)*100):0;
  const tasksOpen = tasks.filter(t=>!t.done).length;
  const tasksDone = tasks.filter(t=>t.done).length;

  // Distribution par phase
  const phaseLabels = ['Accueil','Commercial','Préparation','Chantier','Réception','SAV'];
  const phaseDist = [1,2,3,4,5,6].map(n=>clients.filter(cl=>cl.stage && cl.stage.startsWith(String(n))).length);
  const phaseColors = ['#7BB6C9','#E0A872','#B5A283','#6E92BD','#8FB388','#C97C7C'];
  const maxPhase = Math.max(1, ...phaseDist);

  // Top performers (équipe)
  const teamStats = team.map(t=>{
    const myClients = clients.filter(cl=>cl.assignedTo===t.id);
    const mySigned = myClients.filter(cl=>cl.stage && (cl.stage.startsWith('5')||cl.stage.startsWith('6'))).length;
    const myRevenue = myClients.filter(cl=>cl.stage && (cl.stage.startsWith('5')||cl.stage.startsWith('6'))).reduce((s,c)=>s+(Number(c.value)||0),0);
    return {...t, clients:myClients.length, signed:mySigned, revenue:myRevenue};
  }).sort((a,b)=>b.signed-a.signed);

  // Helper format
  const fmt = (n)=>{
    if(n>=1000000) return (n/1000000).toFixed(1)+' M€';
    if(n>=1000) return Math.round(n/1000)+' k€';
    return n+' €';
  };

  // KPI cards
  const kpiCard = (title,value,sub,color)=>{
    return '<div class="card" style="padding:18px 20px"><div style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin-bottom:6px">'+title+'</div>'+
    '<div style="font-family:var(--SF);font-style:normal;font-size:34px;font-weight:700;color:'+(color||'var(--ink)')+';line-height:1">'+value+'</div>'+
    (sub?'<div style="font-size:11px;color:var(--mute);margin-top:4px">'+sub+'</div>':'')+'</div>';
  };

  let h = '';

  // Première rangée KPIs principaux
  h += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px">';
  h += kpiCard('Clients total', totalClients, '+'+won+' signés', 'var(--ink)');
  h += kpiCard('CA généré', fmt(wonRevenue), 'sur '+fmt(totalRevenue)+' pipeline', '#4A9C77');
  h += kpiCard('Taux conversion', conversionRate+' %', won+' signatures sur '+totalClients+' clients', '#E0A872');
  h += kpiCard('Panier moyen', fmt(avgDealSize), 'tous clients confondus', 'var(--gold)');
  h += '</div>';

  // 2ème rangée : KPIs secondaires
  h += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px">';
  h += kpiCard('En chantier', inChantier, 'projets actifs', '#6E92BD');
  h += kpiCard('En négociation', inCommercial, 'phase commerciale', '#E0A872');
  h += kpiCard('Tâches ouvertes', tasksOpen, tasksDone+' terminées', '#7DDB94');
  h += kpiCard('Équipe', team.length, team.filter(t=>t.role==='commercial').length+' commerciaux', 'var(--ink)');
  h += '</div>';

  // Distribution par phase (graphique en barres simple)
  h += '<div class="card" style="margin-bottom:18px"><div class="card-h"><div><div class="card-title">Distribution clients par phase</div><div class="card-sub">Vue d\'ensemble du pipeline ('+totalClients+' clients)</div></div></div>';
  h += '<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:14px">';
  phaseDist.forEach((cnt,i)=>{
    const pct = (cnt/maxPhase)*100;
    h += '<div style="text-align:center">'+
      '<div style="height:140px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:10px">'+
        '<div style="width:60px;height:'+pct+'%;min-height:'+(cnt>0?14:2)+'px;background:linear-gradient(180deg,'+phaseColors[i]+'BB,'+phaseColors[i]+'44);border-radius:6px 6px 2px 2px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;color:#fff;font-weight:800;font-size:14px;font-family:var(--SF);font-style:normal;box-shadow:0 4px 12px '+phaseColors[i]+'40">'+(cnt>0?cnt:'')+'</div>'+
      '</div>'+
      '<div style="font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:0.8px;font-weight:700">'+phaseLabels[i]+'</div>'+
    '</div>';
  });
  h += '</div></div>';

  // Top performers
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px">';

  // Classement équipe
  h += '<div class="card"><div class="card-h"><div><div class="card-title">Classement équipe</div><div class="card-sub">Top performers par signatures</div></div></div>';
  if(teamStats.length===0){
    h += '<div style="padding:30px;text-align:center;color:var(--mute);font-style:normal">Ajoutez des membres dans Équipe pour voir le classement.</div>';
  } else {
    h += '<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">';
    teamStats.slice(0,8).forEach((t,i)=>{
      const medals=['🥇','🥈','🥉'];
      const medal = i<3?medals[i]:'#'+(i+1);
      h += '<div style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;background:'+(i<3?'rgba(212,162,76,0.08)':'transparent')+';border:1px solid var(--linen)">'+
        '<div style="width:32px;text-align:center;font-size:18px;font-weight:800;color:'+(i<3?'var(--gold)':'var(--mute)')+'">'+medal+'</div>'+
        '<div style="flex:1">'+
          '<div style="font-weight:700;color:var(--ink);font-size:14px">'+escapeHtml(t.name||'—')+'</div>'+
          '<div style="font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:0.5px">'+escapeHtml(t.role||'')+' · '+t.clients+' clients</div>'+
        '</div>'+
        '<div style="text-align:right">'+
          '<div style="font-family:var(--SF);font-style:normal;font-size:18px;font-weight:700;color:#4A9C77">'+t.signed+' <span style="font-size:11px;color:var(--mute);font-style:normal">sign.</span></div>'+
          '<div style="font-size:11px;color:var(--mute)">'+fmt(t.revenue)+'</div>'+
        '</div>'+
      '</div>';
    });
    h += '</div>';
  }
  h += '</div>';

  // Activité récente
  h += '<div class="card"><div class="card-h"><div><div class="card-title">Activité récente</div><div class="card-sub">Évolutions des 30 derniers jours</div></div></div>';
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">';
  h += '<div style="padding:14px;background:#F7F2E8;border-radius:8px;text-align:center"><div style="font-family:var(--SF);font-style:normal;font-size:32px;font-weight:700;color:#4A9C77;line-height:1">'+won+'</div><div style="font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:0.8px;font-weight:700;margin-top:4px">Signatures</div></div>';
  h += '<div style="padding:14px;background:#F7F2E8;border-radius:8px;text-align:center"><div style="font-family:var(--SF);font-style:normal;font-size:32px;font-weight:700;color:#E0A872;line-height:1">'+(totalClients-won)+'</div><div style="font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:0.8px;font-weight:700;margin-top:4px">Pipeline</div></div>';
  h += '<div style="padding:14px;background:#F7F2E8;border-radius:8px;text-align:center"><div style="font-family:var(--SF);font-style:normal;font-size:32px;font-weight:700;color:#6E92BD;line-height:1">'+inChantier+'</div><div style="font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:0.8px;font-weight:700;margin-top:4px">Chantiers actifs</div></div>';
  h += '<div style="padding:14px;background:#F7F2E8;border-radius:8px;text-align:center"><div style="font-family:var(--SF);font-style:normal;font-size:32px;font-weight:700;color:#C97C7C;line-height:1">'+(clients.filter(cl=>cl.stage && cl.stage.startsWith('6')).length)+'</div><div style="font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:0.8px;font-weight:700;margin-top:4px">SAV / Garanties</div></div>';
  h += '</div></div>';

  h += '</div>';

  // Note utilisateur
  h += '<div class="card" style="background:linear-gradient(135deg,rgba(212,162,76,0.08),rgba(212,162,76,0.02));border-color:rgba(212,162,76,0.25)"><div style="display:flex;gap:14px;align-items:flex-start"><div style="font-size:20px;color:var(--gold)">✦</div><div><div style="font-weight:700;color:var(--ink);margin-bottom:4px">À propos de ces statistiques</div><div style="font-size:12.5px;color:var(--mute);line-height:1.55">Les KPIs sont calculés en temps réel depuis vos clients, équipe et tâches. Les chantiers actifs incluent toutes les phases en cours sauf Réception et SAV. Le taux de conversion compte les clients ayant atteint Réception ou SAV par rapport au total.</div></div></div></div>';

  c.innerHTML = h;
}

  });

/* ═══════════════════════════════════════════════════════
   VIEW : SETTINGS
   ═══════════════════════════════════════════════════════ */
/* ═══ Éditeur d'étapes du suivi — fonctions ═══════════════════════════
   Toutes les mutations passent par S.pipeline (= PIPELINE), saveLocal()
   après chaque modif, puis renderSettings est rerenderé via setView/render.
   Les garde-fous (clients sur étape, etc.) bloquent les pertes de données. */
function _countClientsOnSubstage(subId){
  return (S.clients||[]).filter(c => !c.archived && c.stage === subId).length;
}
function _countClientsOnPhase(phaseId){
  const ph = PIPELINE.find(p => p.id === phaseId);
  if(!ph) return 0;
  const ids = new Set(ph.substages.map(s=>s.id));
  return (S.clients||[]).filter(c => !c.archived && ids.has(c.stage)).length;
}
function _persistPipeline(){
  try{ saveLocal(); }catch(_){}
  /* Re-render vue courante. Le pipeline éditeur est dans Settings, on rerender Settings. */
  try{ render(); }catch(_){}
}
window.pp_renamePhase = function(phaseId, val){
  const p = PIPELINE.find(x=>x.id===phaseId); if(!p) return;
  p.name = String(val||'').trim() || p.name;
  _persistPipeline();
};
window.pp_setPhaseRole = function(phaseId, val){
  const p = PIPELINE.find(x=>x.id===phaseId); if(!p) return;
  p.role = String(val||'').trim();
  _persistPipeline();
};
window.pp_setPhaseColor = function(phaseId, val){
  const p = PIPELINE.find(x=>x.id===phaseId); if(!p) return;
  if(/^#[0-9a-fA-F]{6}$/.test(val)) p.color = val;
  _persistPipeline();
};
window.pp_setPhaseIcon = function(phaseId, val){
  const p = PIPELINE.find(x=>x.id===phaseId); if(!p) return;
  p.icon = String(val||'').trim() || 'flag';
  _persistPipeline();
};
window.pp_movePhase = function(phaseId, delta){
  const i = PIPELINE.findIndex(x=>x.id===phaseId); if(i<0) return;
  const j = i + delta;
  if(j<0 || j>=PIPELINE.length) return;
  const [item] = PIPELINE.splice(i,1);
  PIPELINE.splice(j,0,item);
  _persistPipeline();
};
window.pp_removePhase = function(phaseId){
  if(PIPELINE.length<=1){ alert('Vous devez garder au moins une phase.'); return; }
  const used = _countClientsOnPhase(phaseId);
  if(used>0){
    if(!confirm(used+' client(s) sont actuellement sur cette phase. Les supprimer la perdra leur étape. Continuer ?')) return;
  }
  const i = PIPELINE.findIndex(x=>x.id===phaseId); if(i<0) return;
  PIPELINE.splice(i,1);
  _persistPipeline();
};
window.pp_addPhase = function(){
  const id = _newId('ph');
  PIPELINE.push({id, name:'Nouvelle phase', role:'', color:PIPELINE_COLORS[PIPELINE.length % PIPELINE_COLORS.length], icon:'flag', substages:[{id:_newId('sub'), name:'Étape'}]});
  _persistPipeline();
};
window.pp_renameSubstage = function(subId, val){
  for(const p of PIPELINE){
    const s = p.substages.find(x=>x.id===subId);
    if(s){ s.name = String(val||'').trim() || s.name; _persistPipeline(); return; }
  }
};
window.pp_moveSubstage = function(subId, delta){
  for(const p of PIPELINE){
    const i = p.substages.findIndex(x=>x.id===subId);
    if(i>=0){
      const j = i + delta;
      if(j<0 || j>=p.substages.length) return;
      const [item] = p.substages.splice(i,1);
      p.substages.splice(j,0,item);
      _persistPipeline();
      return;
    }
  }
};
window.pp_removeSubstage = function(subId){
  const used = _countClientsOnSubstage(subId);
  if(used>0){
    if(!confirm(used+' client(s) sont actuellement sur cette étape. Continuer ?')) return;
  }
  for(const p of PIPELINE){
    const i = p.substages.findIndex(x=>x.id===subId);
    if(i>=0){
      if(p.substages.length<=1){ alert('Une phase doit avoir au moins une étape.'); return; }
      p.substages.splice(i,1);
      _persistPipeline();
      return;
    }
  }
};
window.pp_addSubstage = function(phaseId){
  const p = PIPELINE.find(x=>x.id===phaseId); if(!p) return;
  p.substages.push({id:_newId('sub'), name:'Nouvelle étape'});
  _persistPipeline();

const ABANDON_RAISONS=['Financement','Terrains','Concurrence','Ancien','Divers'];
const STATUT_META={abandonne:{lbl:'🚫 Abandonné',col:'#A63C3C'},signe:{lbl:'✍️ Signé',col:'#4A7C59'},archive:{lbl:'📦 Archivé',col:'#8C8070'}};
function statutBadgeHtml(cl){
  const m=STATUT_META[cl.statut];if(!m)return '';
  let extra='';
  if(cl.statut==='abandonne'&&cl.abandonRaison)extra=' · '+cl.abandonRaison;
  if(cl.statut==='signe'&&cl.signeDate)extra=' · '+fmtDate(cl.signeDate);
  if(cl.statut==='archive'&&cl.archiveDate)extra=' · '+fmtDate(cl.archiveDate);
  return '<span class="badge" style="background:'+m.col+'22;color:'+m.col+'">'+m.lbl+extra+'</span>';
}
function fmtDate(d){try{return new Date(d).toLocaleDateString('fr-FR');}catch(e){return d||'';}}
function rdvCardHtml(cl){
  const rdvs=(cl.rdvs||[]).slice().sort((a,b)=>a.n-b.n);
  return '<div class="card" style="padding:18px"><div style="font-family:var(--SS);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--stone);font-weight:700;margin-bottom:10px">Rendez-vous</div>'+
    (rdvs.length?rdvs.map(r=>
      '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--paper)">'+
      '<span class="badge" style="background:var(--gold)22;color:var(--goldD,#A9863F);min-width:34px;text-align:center">R'+r.n+'</span>'+
      '<input type="date" value="'+(r.date||'')+'" onchange="setRdvDate(\''+cl.id+'\','+r.n+',this.value)" style="flex:1;border:1px solid var(--paper);border-radius:6px;padding:5px 7px;font-size:12px"/>'+
      '<button class="btn ghost sm" style="padding:3px 8px" onclick="delRdv(\''+cl.id+'\','+r.n+')">✕</button></div>'
    ).join(''):'<div style="font-size:12px;color:var(--stone);padding:4px 0">Aucun rendez-vous noté.</div>')+
    '<button class="btn sm" style="width:100%;margin-top:10px" onclick="addRdv(\''+cl.id+'\')">+ Ajouter un RDV (R'+((rdvs[rdvs.length-1]?.n||0)+1)+')</button></div>';
}
function addRdv(cid){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  cl.rdvs=cl.rdvs||[];
  const n=(cl.rdvs.length?Math.max(...cl.rdvs.map(r=>r.n)):0)+1;
  cl.rdvs.push({n:n,date:new Date().toISOString().slice(0,10),at:new Date().toISOString()});
  (cl.history=cl.history||[]).push({type:'note',at:new Date().toISOString(),by:'me',body:'RDV R'+n+' planifié'});
  cl.lastUpdated=new Date().toISOString();saveLocal();render();
}
function setRdvDate(cid,n,v){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  const r=(cl.rdvs||[]).find(x=>x.n===n);if(r){r.date=v;cl.lastUpdated=new Date().toISOString();saveLocal();}
}
function delRdv(cid,n){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  cl.rdvs=(cl.rdvs||[]).filter(x=>x.n!==n);saveLocal();render();
}
function statutCardHtml(cl){
  const s=cl.statut||'actif';
  let h='<div class="card" style="padding:18px"><div style="font-family:var(--SS);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--stone);font-weight:700;margin-bottom:10px">Statut du client</div>';

    h+='<div style="margin-bottom:10px">'+statutBadgeHtml(cl)+'</div>';

    h+='<button class="btn sm ghost" style="width:100%;justify-content:flex-start" onclick="archiveClient(\''+cl.id+'\')">📦 Archiver (fin de réception)</button>';

}
function openSigneModal(cid){

    actions:'<button class="btn" onclick="closeModal()">Annuler</button><button class="btn gold" onclick="confirmSigne(\''+cid+'\')">✍️ Confirmer la signature</button>'});

function confirmSigne(cid){

}
function openAbandonModal(cid){

function confirmAbandon(cid){

function archiveClient(cid){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  cl.statut='archive';cl.archiveDate=new Date().toISOString().slice(0,10);
  (cl.history=cl.history||[]).push({type:'note',at:new Date().toISOString(),by:'me',body:'📦 Client archivé (réception terminée)'});
  cl.lastUpdated=new Date().toISOString();saveLocal();toast('Client archivé 📦');render();

function reactivateClient(cid){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  cl.statut='actif';
  (cl.history=cl.history||[]).push({type:'note',at:new Date().toISOString(),by:'me',body:'↩ Client réactivé'});

/* ═══════════════════════════════════════════════════════
   STATS : RDV PAR PÉRIODE (+ comparaison) & ORIGINE DES CONTACTS
   ═══════════════════════════════════════════════════════ */
function _rdvInPeriod(d1,d2){
  let tot=0;const parN={};
  S.clients.forEach(cl=>(cl.rdvs||[]).forEach(r=>{
    if(!r.date)return;
    if(d1&&r.date<d1)return;if(d2&&r.date>d2)return;
    tot++;parN['R'+r.n]=(parN['R'+r.n]||0)+1;
  }));
  return {tot,parN};
}
function setStatsRdvField(k,v){S.statsRdv=S.statsRdv||{};S.statsRdv[k]=v;saveLocal();render();}
function renderStatsRdvOrigine(c){
  const sr=S.statsRdv||{};
  const today=new Date();const m0=new Date(today.getFullYear(),today.getMonth(),1).toISOString().slice(0,10);
  const a1=sr.a1||m0,a2=sr.a2||today.toISOString().slice(0,10);
  const A=_rdvInPeriod(a1,a2);
  const hasB=sr.b1&&sr.b2;const B=hasB?_rdvInPeriod(sr.b1,sr.b2):null;
  const dateInp=(k,v)=>'<input type="date" value="'+(v||'')+'" onchange="setStatsRdvField(\''+k+'\',this.value)" style="border:1px solid var(--paper);border-radius:6px;padding:5px 7px;font-size:12px"/>';
  const card=document.createElement('div');card.className='card';
  let h='<div class="card-h"><div><div class="card-title">📅 Rendez-vous par période</div><div class="card-sub">Sélectionne une période, et compare avec une autre si besoin</div></div></div>';
  h+='<div style="display:flex;gap:18px;flex-wrap:wrap">';
  h+='<div style="flex:1;min-width:260px"><div style="font-family:var(--SS);font-size:11px;font-weight:700;color:var(--stone);margin-bottom:6px">PÉRIODE A</div>'+
     '<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px">'+dateInp('a1',a1)+' → '+dateInp('a2',a2)+'</div>'+
     '<div style="font-family:var(--SF);font-size:30px;font-weight:800;color:var(--ink)">'+A.tot+' <span style="font-size:13px;color:var(--stone);font-weight:600">RDV</span></div>'+
     '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">'+Object.keys(A.parN).sort().map(k=>'<span class="badge" style="background:var(--gold)22;color:var(--goldD,#A9863F)">'+k+' : '+A.parN[k]+'</span>').join('')+'</div></div>';
  h+='<div style="flex:1;min-width:260px"><div style="font-family:var(--SS);font-size:11px;font-weight:700;color:var(--stone);margin-bottom:6px">PÉRIODE B (comparaison)</div>'+
     '<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px">'+dateInp('b1',sr.b1)+' → '+dateInp('b2',sr.b2)+'</div>'+
     (B?('<div style="font-family:var(--SF);font-size:30px;font-weight:800;color:var(--ink)">'+B.tot+' <span style="font-size:13px;color:var(--stone);font-weight:600">RDV</span></div>'+
        '<div style="margin-top:6px;font-size:13px;font-weight:700;color:'+(A.tot>=B.tot?'#4A7C59':'#A63C3C')+'">'+(A.tot>=B.tot?'▲ +':'▼ ')+(A.tot-B.tot)+' RDV ('+(B.tot?Math.round((A.tot-B.tot)/B.tot*100):'∞')+'%) en période A vs B</div>')
       :'<div style="font-size:12px;color:var(--stone)">Renseigne les 2 dates pour comparer.</div>')+'</div>';
  h+='</div>';
  card.innerHTML=h;c.appendChild(card);

  /* Origine des contacts — signés ou pas */
  const srcMap={};
  S.clients.forEach(cl=>{
    const src=cl.source||'Non renseigné';
    srcMap[src]=srcMap[src]||{tot:0,signes:0};
    srcMap[src].tot++;if(cl.statut==='signe'||cl.statut==='archive')srcMap[src].signes++;
  });
  const rows=Object.keys(srcMap).sort((a,b)=>srcMap[b].tot-srcMap[a].tot);
  const card2=document.createElement('div');card2.className='card';
  let h2='<div class="card-h"><div><div class="card-title">🧭 Origine des contacts</div><div class="card-sub">Tous les clients, signés ou pas — d\'où viennent-ils ?</div></div></div>';
  h2+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Origine</th><th>Contacts</th><th>Signés</th><th>Non signés</th><th>Taux de signature</th></tr></thead><tbody>';
  rows.forEach(srcK=>{
    const o=srcMap[srcK];const taux=o.tot?Math.round(o.signes/o.tot*100):0;
    h2+='<tr><td style="font-weight:700;color:var(--ink)">'+escapeHtml(srcK)+'</td><td>'+o.tot+'</td><td style="color:#4A7C59;font-weight:700">'+o.signes+'</td><td>'+(o.tot-o.signes)+'</td>'+
        '<td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;max-width:120px;height:6px;background:var(--paper);border-radius:99px;overflow:hidden"><div style="width:'+taux+'%;height:100%;background:linear-gradient(90deg,var(--gold),var(--goldD,#A9863F))"></div></div><span style="font-family:var(--SF);font-weight:700">'+taux+'%</span></div></td></tr>';
  });
  h2+='</tbody></table></div>';
  card2.innerHTML=h2;c.appendChild(card2);
}

const FONDS_DEFAUT=[
  {libelle:'Ouverture du chantier',pct:15},
  {libelle:'Achèvement des fondations',pct:10},

function setFonds(cid,i,key,val){

function saveClient(id){
  const data={
    nom:document.getElementById('m-nom').value.trim(),
    prenom:document.getElementById('m-prenom').value.trim(),
    raisonSociale:document.getElementById('m-rs').value.trim(),
    email:document.getElementById('m-email').value.trim(),
    tel:document.getElementById('m-tel').value.trim(),
    localisation:document.getElementById('m-loc').value.trim(),
    adresse:document.getElementById('m-adr').value.trim(),
    typeProjet:document.getElementById('m-type').value.trim(),
    budgetEstime:parseFloat(document.getElementById('m-budget').value)||0,
    source:document.getElementById('m-source').value,
    secteurRecherche:document.getElementById('m-secteur').value.trim(),
    commentaire:document.getElementById('m-comm').value.trim()
  };
  if(!data.nom&&!data.raisonSociale){toast('Nom ou raison sociale requis','err');return;}
  const now=new Date().toISOString();
  if(id){
    const cl=S.clients.find(x=>x.id===id);if(!cl)return;
    Object.assign(cl,data,{lastUpdated:now});
  } else {
    S.clients.push({
      id:uid(),...data,
      stage:'1.2',createdAt:now,lastUpdated:now,
      history:[{type:'create',at:now,by:'me',note:'Fiche client créée'}],
      notes:[],tasks:[],documents:[],communications:[],
      sav:{tickets:[],garanties:null}
    });
  }
  saveAll();closeModal();render();toast(id?'Client modifié':'Client créé');
}

/* Stage update */
function updateStage(cid,newStage){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  if(cl.stage===newStage)return;
  const oldStage=cl.stage;
  const now=new Date().toISOString();
  cl.history=cl.history||[];
  cl.history.push({type:'stage',from:oldStage,to:newStage,at:now,by:'me',note:'Étape mise à jour'});
  cl.stage=newStage;cl.lastUpdated=now;
  /* Démarre auto les garanties à la signature PV (5.3) */
  if(newStage==='5.3'&&!(cl.sav?.garanties?.start)){
    cl.sav=cl.sav||{tickets:[]};cl.sav.garanties={start:now};
    toast('Garanties GPA / biennale / décennale démarrées automatiquement');
  }
  saveAll();render();
}

function openTransferModal(cid){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  const cur=cl.stage;
  const ph=getPhase(cur);
  const idx=ph.substages.findIndex(s=>s.id===cur);
  const next=idx<ph.substages.length-1?ph.substages[idx+1]:(PIPELINE[parseInt(ph.id)]?PIPELINE[parseInt(ph.id)].substages[0]:null);
  if(!next){toast('Déjà à la dernière étape');return;}
  showModal({
    title:'Faire avancer le client',
    body:'<div style="margin-bottom:14px"><div style="font-family:var(--SS);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--stone);font-weight:600;margin-bottom:6px">Étape suivante</div><div style="font-family:var(--SF);font-size:18px;font-weight:700;color:var(--gold)">'+next.id+' · '+escapeHtml(next.name)+'</div></div><div><label class="fl">Note de passation (optionnelle)</label><textarea id="t-note" placeholder="Ex : Client veut bois et carrelage gris, RDV terrain mardi 14h…"></textarea></div>',
    actions:'<button class="btn" onclick="closeModal()">Annuler</button><button class="btn gold" onclick="confirmTransfer(\''+cid+'\',\''+next.id+'\')">→ Faire avancer</button>'
  });
}

function confirmTransfer(cid,newStage){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  const note=document.getElementById('t-note').value.trim();
  const now=new Date().toISOString();
  cl.history=cl.history||[];
  cl.history.push({type:'stage',from:cl.stage,to:newStage,at:now,by:'me',note:note||'Transfert manuel'});
  cl.stage=newStage;cl.lastUpdated=now;
  if(newStage==='5.3'&&!(cl.sav?.garanties?.start)){cl.sav=cl.sav||{tickets:[]};cl.sav.garanties={start:now};}
  saveAll();closeModal();render();toast('Client transféré à l\'étape '+newStage);
}

function applyTemplate(tplId,cid){
  const t=S.templates.find(x=>x.id===tplId);const cl=S.clients.find(x=>x.id===cid);
  if(!t||!cl)return;
  const repl=s=>(s||'').replace(/\{\{prenom\}\}/g,cl.prenom||'').replace(/\{\{nom\}\}/g,cl.nom||'').replace(/\{\{projet\}\}/g,cl.typeProjet||'').replace(/\{\{date\}\}/g,fmtDate(new Date().toISOString()));
  if(t.type==='email'&&document.getElementById('c-subj'))document.getElementById('c-subj').value=repl(t.subject);
  document.getElementById('c-body').value=repl(t.body);
}
function sendComm(cid,channel){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  const body=document.getElementById('c-body').value.trim();if(!body){toast('Message vide','err');return;}
  const subject=channel==='email'?(document.getElementById('c-subj')?.value||''):'';
  cl.communications=cl.communications||[];
  cl.communications.push({id:uid(),at:new Date().toISOString(),by:'me',channel,subject,body,direction:'out'});
  cl.lastUpdated=new Date().toISOString();
  saveAll();closeModal();render();toast(channel==='email'?'Email envoyé':'SMS envoyé');
}

function importJson(ev){
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(d&&typeof d==='object'&&Array.isArray(d.clients)){
        S=Object.assign(S,d);
        if(!Array.isArray(S.team))S.team=[];
        if(!Array.isArray(S.templates))S.templates=[];
        saveAll();render();toast('Import réussi');
      }else{
        toast('Fichier invalide : structure attendue manquante','err');
      }
    }catch(e){toast('Fichier invalide','err');}
  };
  r.onerror=()=>toast('Lecture du fichier échouée','err');
  try{r.readAsText(f);}catch(e){toast('Lecture du fichier échouée','err');}
}
function resetData(){
  if(!confirm('Tout effacer ? Cette action est irréversible.'))return;
  S.clients=[];S.templates=[];S.team=[];saveAll();render();toast('Données réinitialisées');
}

<script id="oniq-user-info-listener">
/* ═══ User-card auto-fill via postMessage parent ONIQ ═══
   Le parent envoie {type:'oniq-user-info', user:{company, avatar, role, isAdmin, isCommercial}}
   L'app met à jour #user-av / #user-name / #user-role */
(function(){
  function applyUser(u){
    if(!u)return;
    var av=document.getElementById('user-av');
    var nm=document.getElementById('user-name');
    var rl=document.getElementById('user-role');
    var name=(u.company||u.name||'Mon entreprise').toString();
    var initials=u.avatar||name.split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase()||'??';
    var role=u.isAdmin?'Admin':u.isCommercial?'Commercial':(u.role==='client'?'Client':(u.role||'Gérant'));
    if(av){
      if(u.companyLogo){
        av.innerHTML='<img src="'+u.companyLogo+'" alt="'+name.replace(/"/g,'')+'" style="width:100%;height:100%;object-fit:contain;display:block"/>';
        av.style.background='#FBF9F3';
        av.style.padding='3px';
        av.style.boxSizing='border-box';
        av.style.overflow='hidden';
      } else {
        av.textContent=initials;
        av.style.background='';av.style.padding='';
      }
    }
    if(nm)nm.textContent=name;
    if(rl)rl.textContent=role.toUpperCase();
  }
  /* Demande au parent dès l'ouverture */
  try{window.parent.postMessage({type:'oniq-user-info-request'},'*');}catch(e){}
  /* Écoute les réponses */
  window.addEventListener('message',function(evt){
    try{
      if(!evt||!evt.data||typeof evt.data!=='object'||!evt.data.type)return;
      if(evt.data.type==='oniq-user-info'&&evt.data.user&&typeof evt.data.user==='object')applyUser(evt.data.user);
    }catch(e){}

<!-- ═══════════════════════════════════════════════════════════════════
     ONIPILOTE — Mobile JS (camera, voice, tasks-today, FAB)
     Tout est isolé sous window.* — ne touche à aucune fonction existante
     ═══════════════════════════════════════════════════════════════════ -->
<script id="onipilote-mobile-js">
(function(){
  'use strict';

  /* ───────── Helpers locaux (n'écrasent rien) ───────── */
  function _toast(msg, kind){
    try {
      if (typeof window.toast === 'function') return window.toast(msg, kind);
    } catch(e){}
    /* Fallback */
    var w = document.getElementById('toast-wrap');
    if (!w) { console.log('[OniPilote]', msg); return; }
    var t = document.createElement('div');
    t.className = 'toast';
    t.style.cssText = 'background:#16120D;color:#FFF;padding:11px 16px;border-radius:8px;margin-top:8px;font-family:Inter,sans-serif;font-size:13px;box-shadow:0 18px 46px -10px rgba(10,10,8,0.30);';
    t.textContent = msg;
    w.appendChild(t);
    setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(function(){ t.remove(); }, 320); }, 2600);
  }

  function _esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

  function _clientName(id){
    try {
      var cs = (window.S && Array.isArray(window.S.clients)) ? window.S.clients : [];
      var c = cs.find(function(x){ return String(x.id) === String(id); });
      if (!c) return 'Client #' + id;
      if (typeof window.clientFullName === 'function') return window.clientFullName(c);
      return (c.nom || c.name || c.raison || c.prenom || ('Client #' + id));
    } catch(e){ return 'Client #' + id; }
  }

  function _isMobile(){ return window.matchMedia && window.matchMedia('(max-width: 780px)').matches; }

  /* ───────── 1. Photo capture ───────── */
  window.captureClientPhoto = function(clientId){
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.setAttribute('capture', 'environment');
    inp.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;';
    document.body.appendChild(inp);

    inp.addEventListener('change', function(){
      var f = inp.files && inp.files[0];
      if (!f) { try { document.body.removeChild(inp); } catch(e){} return; }
      var reader = new FileReader();
      reader.onload = function(ev){
        var dataUrl = ev.target.result;
        var key = 'onipilote_photos_' + (clientId == null ? 'general' : clientId);
        var arr = [];
        try {
          var raw = localStorage.getItem(key);
          if (raw) arr = JSON.parse(raw) || [];
          if (!Array.isArray(arr)) arr = [];
        } catch(e){ arr = []; }
        arr.push({
          ts: Date.now(),
          name: f.name || 'photo.jpg',
          size: f.size || 0,
          type: f.type || 'image/jpeg',
          data: dataUrl
        });
        try { localStorage.setItem(key, JSON.stringify(arr)); }
        catch(e){
          _toast('Stockage plein : impossible de sauvegarder la photo', 'err');
          try { document.body.removeChild(inp); } catch(_){ }
          return;
        }
        _toast('Photo ajoutée à ' + _clientName(clientId));
        try { document.body.removeChild(inp); } catch(_){ }
        if (typeof window.renderPipeline === 'function' && typeof window.render === 'function') {
          try { window.render(); } catch(_){}
        }
      };
      reader.onerror = function(){
        _toast('Erreur de lecture de la photo', 'err');
        try { document.body.removeChild(inp); } catch(_){ }
      };
      reader.readAsDataURL(f);
    }, { once: true });

    /* Trigger sur la prochaine frame */
    setTimeout(function(){ inp.click(); }, 0);
  };

  /* ───────── 2. Note vocale (Web Speech API) ───────── */
  window.startVoiceNote = function(clientId){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR){
      alert('Microphone non disponible sur ce navigateur. Utilisez Chrome.');
      return;
    }
    var rec;
    try { rec = new SR(); } catch(e){
      alert('Microphone non disponible sur ce navigateur. Utilisez Chrome.');
      return;
    }
    rec.lang = 'fr-FR';
    rec.continuous = false;
    rec.interimResults = false;
    rec.maxAlternatives = 1;

    _toast('Écoute… parlez maintenant');

    rec.onresult = function(ev){
      var transcript = '';
      try { transcript = ev.results[0][0].transcript || ''; } catch(_){}
      transcript = (transcript || '').trim();
      if (!transcript){
        _toast('Aucune voix détectée', 'err');
        return;
      }
      var key = 'onipilote_notes_' + (clientId == null ? 'general' : clientId);
      var arr = [];
      try {
        var raw = localStorage.getItem(key);
        if (raw) arr = JSON.parse(raw) || [];
        if (!Array.isArray(arr)) arr = [];
      } catch(e){ arr = []; }
      arr.push({ ts: Date.now(), text: transcript, source: 'voice' });
      try { localStorage.setItem(key, JSON.stringify(arr)); }
      catch(e){ _toast('Stockage plein', 'err'); return; }
      var firstLine = transcript.split(/[\n\r]/)[0].slice(0, 60);
      _toast('Note ajoutée : ' + firstLine);
    };
    rec.onerror = function(ev){
      var msg = 'Erreur micro';
      if (ev && ev.error){
        if (ev.error === 'not-allowed') msg = 'Accès microphone refusé';
        else if (ev.error === 'no-speech') msg = 'Aucune voix détectée';
        else if (ev.error === 'audio-capture') msg = 'Pas de micro disponible';
        else msg = 'Erreur micro : ' + ev.error;
      }
      _toast(msg, 'err');
    };
    try { rec.start(); }
    catch(e){ _toast('Impossible de démarrer l\'enregistrement', 'err'); }
  };

  /* ───────── 3. Tasks-today (mobile component) ───────── */
  var TASKS_KEY = 'onipilote_tasks_today_v1';

  function _loadTasks(){
    try {
      var raw = localStorage.getItem(TASKS_KEY);
      if (!raw) return null;
      var v = JSON.parse(raw);
      return Array.isArray(v) ? v : null;
    } catch(e){ return null; }
  }
  function _saveTasks(arr){
    try { localStorage.setItem(TASKS_KEY, JSON.stringify(arr || [])); } catch(e){}
  }

  function _seedFromClients(){
    /* Génère une liste d'exemples si rien en stockage et qu'on a des clients */
    var out = [];
    try {
      var cs = (window.S && Array.isArray(window.S.clients)) ? window.S.clients : [];
      cs.slice(0, 4).forEach(function(c, idx){
        out.push({
          id: 'tt-' + c.id + '-1',
          clientId: c.id,
          clientName: _clientName(c.id),
          label: idx % 2 === 0 ? 'Contrôler l\'avancement sur site' : 'Photo avant fin de phase',
          done: false
        });
      });
    } catch(e){}
    return out;
  }

  window.renderTasksToday = function(){
    var host = document.getElementById('tasks-today');
    if (!host) return;
    if (!_isMobile()) { host.innerHTML = ''; return; }
    var tasks = _loadTasks();
    if (!tasks){
      tasks = _seedFromClients();
      _saveTasks(tasks);
    }
    var remaining = tasks.filter(function(t){ return !t.done; }).length;
    if (!tasks.length){
      host.innerHTML =
        '<div class="tt-hdr"><div class="tt-title">Tâches du jour</div><div class="tt-count">0</div></div>' +
        '<div class="tt-empty">Aucune tâche pour aujourd\'hui.</div>';
      return;
    }
    /* Group par client */
    var groups = {};
    tasks.forEach(function(t){
      var k = String(t.clientId == null ? '_' : t.clientId);
      if (!groups[k]) groups[k] = { name: t.clientName || _clientName(t.clientId), items: [] };
      groups[k].items.push(t);
    });
    var html = '';
    html += '<div class="tt-hdr"><div class="tt-title">Tâches du jour</div><div class="tt-count">' + remaining + ' restantes</div></div>';
    Object.keys(groups).forEach(function(k){
      var g = groups[k];
      html += '<div class="tt-group">';
      html += '<div class="tt-group-name">' + _esc(g.name) + '</div>';
      g.items.forEach(function(t){
        html += '<div class="tt-task' + (t.done ? ' done' : '') + '" data-task-id="' + _esc(t.id) + '">';
        html += '<input type="checkbox" ' + (t.done ? 'checked' : '') + ' onchange="window._toggleTaskToday(\'' + _esc(t.id) + '\', this.checked)" aria-label="Marquer terminée"/>';
        html += '<div class="tt-lbl">' + _esc(t.label || '') + '<span class="tt-client">' + _esc(g.name) + '</span></div>';
        html += '<div class="tt-actions">';
        html += '<button class="tt-action" onclick="window.captureClientPhoto(\'' + _esc(t.clientId) + '\')" aria-label="Photo">📷</button>';
        html += '<button class="tt-action" onclick="window.startVoiceNote(\'' + _esc(t.clientId) + '\')" aria-label="Note vocale">🎤</button>';
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';
    });
    host.innerHTML = html;
  };

  window._toggleTaskToday = function(id, checked){
    var tasks = _loadTasks() || [];
    var found = false;
    tasks = tasks.map(function(t){
      if (String(t.id) === String(id)){ t.done = !!checked; found = true; }
      return t;
    });
    if (found){
      _saveTasks(tasks);
      window.renderTasksToday();
    }
  };

  /* ───────── 4. Bottom nav handler ───────── */
  window.mobileNavGo = function(target){
    /* Sync visual active state */
    var btns = document.querySelectorAll('#bottom-nav .bn-btn');
    btns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-view') === target); });
    if (target === 'tasks'){
      if (typeof window.setView === 'function') {
        try { window.setView('tasks'); } catch(_){}
      }
      window.renderTasksToday();
    } else if (target === 'pipeline'){
      if (typeof window.setView === 'function') { try { window.setView('pipeline'); } catch(_){} }
    } else if (target === 'clients'){
      if (typeof window.setView === 'function') { try { window.setView('clients'); } catch(_){} }
    } else if (target === 'photos'){
      /* Vue rapide photos : on liste les photos en localStorage */
      _showPhotosOverview();
    }
  };

  function _showPhotosOverview(){
    var keys = [];
    try {
      for (var i=0; i<localStorage.length; i++){
        var k = localStorage.key(i);
        if (k && k.indexOf('onipilote_photos_') === 0) keys.push(k);
      }
    } catch(e){}
    var total = 0;
    var byClient = [];
    keys.forEach(function(k){
      try {
        var arr = JSON.parse(localStorage.getItem(k) || '[]');
        if (Array.isArray(arr) && arr.length){
          var cid = k.replace('onipilote_photos_', '');
          byClient.push({ cid: cid, count: arr.length, last: arr[arr.length-1] });
          total += arr.length;
        }
      } catch(e){}
    });
    var c = document.getElementById('content');
    if (!c) return;
    var html = '<div style="padding:4px 0 12px"><div style="font-family:var(--SF);font-style:normal;font-weight:700;font-size:26px;color:var(--ink)">Photos</div><div style="font-size:13px;color:var(--text2);margin-top:4px">' + total + ' photos · ' + byClient.length + ' client(s)</div></div>';
    if (!byClient.length){
      html += '<div style="padding:30px 14px;text-align:center;color:var(--stone);font-style:normal">Aucune photo enregistrée. Utilisez le bouton 📷 pour en ajouter.</div>';
    } else {
      html += '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">';
      byClient.forEach(function(b){
        var name = _clientName(b.cid);
        html += '<div style="background:var(--surf);border:1px solid var(--linen);border-radius:10px;overflow:hidden;box-shadow:var(--sh2)">';
        if (b.last && b.last.data){
          html += '<div style="aspect-ratio:1/1;background:#000 center/cover no-repeat url(' + b.last.data.replace(/"/g,'') + ')"></div>';
        } else {
          html += '<div style="aspect-ratio:1/1;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--stone);font-size:32px">📷</div>';
        }
        html += '<div style="padding:8px 10px"><div style="font-size:12.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + _esc(name) + '</div><div style="font-size:11px;color:var(--gold);font-weight:700">' + b.count + ' photo' + (b.count>1?'s':'') + '</div></div>';
        html += '</div>';
      });
      html += '</div>';
    }
    c.innerHTML = html;
  }

  /* ───────── 5. FAB handlers ───────── */
  window.fabCapturePhoto = function(){
    var cid = (window.S && window.S.currentClient) ? window.S.currentClient : 'general';
    window.captureClientPhoto(cid);
  };
  window.fabStartVoice = function(){
    var cid = (window.S && window.S.currentClient) ? window.S.currentClient : 'general';
    window.startVoiceNote(cid);
  };

  /* ───────── 6. Sidebar backdrop ───────── */
  window.closeMobileSide = function(){
    var s = document.getElementById('side');
    if (s) s.classList.remove('open');
    document.body.classList.remove('mobile-side-open');
  };

  /* Watch sidebar state pour activer backdrop */
  function _wireSideObserver(){
    var s = document.getElementById('side');
    if (!s || !window.MutationObserver) return;
    var mo = new MutationObserver(function(){
      var open = s.classList.contains('open');
      document.body.classList.toggle('mobile-side-open', open && _isMobile());
    });
    mo.observe(s, { attributes: true, attributeFilter: ['class'] });
  }

  /* ───────── 7. Bottom-nav active state sync avec S.view ───────── */
  function _syncBottomNavActive(){
    if (!_isMobile()) return;
    var v = (window.S && window.S.view) || 'pipeline';
    var map = { tasks: 'tasks', pipeline: 'pipeline', clients: 'clients' };
    var target = map[v] || null;
    var btns = document.querySelectorAll('#bottom-nav .bn-btn');
    btns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-view') === target); });
  }

  /* ───────── 8. Init au load ───────── */
  function _init(){
    _wireSideObserver();
    _syncBottomNavActive();
    if (_isMobile()) {
      try { window.renderTasksToday(); } catch(e){}
    }
    /* Re-sync après les renders éventuels */
    if (typeof window.addEventListener === 'function'){
      window.addEventListener('resize', function(){
        _syncBottomNavActive();
        try { window.renderTasksToday(); } catch(e){}
      });
    }
    /* Re-render tasks-today after S changes (poll léger : 1×/sec pendant 10s) */
    var ticks = 0;
    var iv = setInterval(function(){
      ticks++;
      _syncBottomNavActive();
      if (_isMobile()) { try { window.renderTasksToday(); } catch(e){} }
      if (ticks > 8) clearInterval(iv);
    }, 1200);
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    /* Slight delay to let app init first */
    setTimeout(_init, 200);
  }
})();
</script>
