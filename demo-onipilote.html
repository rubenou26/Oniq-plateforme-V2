  const k=document.createElement('div');k.className='kpis';k.innerHTML=
    kpiCard('Clients actifs',active,'Total : '+total,'users','accent')+
    kpiCard('Pipeline €',fmtEUR(pipeVal),'Potentiel cumulé','euro')+
    kpiCard('Taux conversion',conv+'%',won+' clients gagnés','trend')+
    kpiCard('Clients en dérive',overdue,'> 21 jours sans update','warn',overdue>0?'down':'');
  c.appendChild(k);

  /* ═══ FRISE DE PROGRESSION — vue d'un coup d'œil de tous les clients ═══ */
  const frieze=document.createElement('div');frieze.className='card frieze-card';
  frieze.innerHTML=renderFrieze(cs.filter(x=>!x.archived));
  c.appendChild(frieze);

  /* ═══ PIPELINE DÉTAILLÉE — 6 phases × toutes les sous-étapes ═══ */
  const pipe=document.createElement('div');pipe.className='card';
  pipe.innerHTML=renderDetailedPipeline(cs.filter(x=>!x.archived));
  c.appendChild(pipe);

  /* Activité récente */
  const acts=collectActivities(8);
  const a=document.createElement('div');a.className='card';
  a.innerHTML='<div class="card-h"><div><div class="card-title">Activité récente</div><div class="card-sub">Dernières actions sur tous les clients</div></div></div>'+
    (acts.length?'<div class="timeline">'+acts.map(renderActivityItem).join('')+'</div>':'<div class="empty"><div class="empty-ico">⊕</div>Aucune activité — créez votre premier client.</div>');
  c.appendChild(a);

  /* Tâches du jour */
  const tasks=allTasks().filter(t=>!t.done).slice(0,8);
  const tk=document.createElement('div');tk.className='card';
  tk.innerHTML='<div class="card-h"><div><div class="card-title">Tâches en cours</div><div class="card-sub">Les '+tasks.length+' premières tâches non terminées</div></div><button class="btn ghost sm" onclick="setView(\'tasks\')">Tout voir</button></div>'+
    (tasks.length?'<div style="display:flex;flex-direction:column;gap:7px">'+tasks.map(renderTaskRow).join('')+'</div>':'<div class="empty"><div class="empty-ico">✓</div>Toutes les tâches sont terminées.</div>');
  c.appendChild(tk);
}

/* ═══════════════════════════════════════════════════════
   FRISE DE PROGRESSION
   Une ligne = un client. Track horizontale avec les 38 sous-étapes
   regroupées par 6 phases (couleurs). Marker à la position actuelle.
   ═══════════════════════════════════════════════════════ */
function renderFrieze(clients){
  if(!clients.length){
    return '<div class="card-h"><div><div class="card-title">Frise de progression</div><div class="card-sub">Vue panoramique de tous vos clients sur le pipeline</div></div></div><div class="empty"><div class="empty-ico">⊕</div>Aucun client. Créez-en un pour voir la frise.</div>';
  }
  /* Total des sous-étapes pour calculer les positions */
  const totalSubs=PIPELINE.reduce((s,p)=>s+p.substages.length,0);
  /* Zones de couleur de chaque phase (proportionnelles au nombre de sous-étapes) */
  let cumPct=0;
  const phaseZones=PIPELINE.map(p=>{
    const w=(p.substages.length/totalSubs)*100;
    const z={phase:p,start:cumPct,width:w};
    cumPct+=w;
    return z;
  });
  /* Trie les clients par progression (les plus avancés en haut) */
  const sorted=[...clients].sort((a,b)=>{
    const pa=stagePct(a.stage),pb=stagePct(b.stage);
    return pb-pa;
  });

  let h='<div class="card-h"><div><div class="card-title">Frise de progression</div><div class="card-sub">'+clients.length+' client(s) — vue d\'ensemble immédiate · cliquez sur une ligne pour ouvrir la fiche</div></div>';
  /* Légende des phases */
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">';
  PIPELINE.forEach(p=>{
    h+='<div style="display:flex;align-items:center;gap:5px;font-family:var(--SS);font-size:10px;color:var(--text2);font-weight:600"><span style="width:9px;height:9px;border-radius:2px;background:'+p.color+'"></span><span>'+p.id+'</span></div>';
  });
  h+='</div></div>';

  /* En-tête de phases au-dessus de la frise */
  h+='<div style="margin-top:6px;display:grid;grid-template-columns:200px 1fr 92px;gap:14px;align-items:center;padding:0 4px">';
  h+='<div style="font-family:var(--SS);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--stone);font-weight:700">Client</div>';
  h+='<div style="position:relative;height:20px">';
  phaseZones.forEach(({phase,start,width})=>{
    h+='<div style="position:absolute;left:'+start+'%;width:'+width+'%;text-align:center;font-family:var(--SS);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:'+phase.color+';font-weight:700;line-height:1.2">'+phase.id+'. '+phase.name+'</div>';
  });
  h+='</div>';
  h+='<div style="font-family:var(--SS);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--stone);font-weight:700;text-align:right">Ancienneté</div>';
  h+='</div>';

  /* Lignes clients */
  h+='<div style="display:flex;flex-direction:column;gap:5px;margin-top:10px">';
  sorted.forEach(cl=>{
    const ph=getPhase(cl.stage);
    const sub=getSubstage(cl.stage);
    const pct=stagePct(cl.stage);
    const days=daysAt(cl.lastUpdated||cl.createdAt);
    let ageColor='var(--stone)',ageWeight='500';
    if(days>21){ageColor='var(--red)';ageWeight='700';}
    else if(days>10){ageColor='var(--attente)';ageWeight='600';}
    h+='<div class="frieze-row" onclick="openClient(\''+cl.id+'\')" style="display:grid;grid-template-columns:200px 1fr 92px;gap:14px;align-items:center;padding:9px 8px;border-radius:8px;cursor:pointer;transition:background .15s ease,box-shadow .15s ease">';
    /* Nom client */
    h+='<div style="display:flex;align-items:center;gap:9px;min-width:0">';
    h+='<div style="width:28px;height:28px;border-radius:6px;background:var(--av-bg);color:var(--av-fg);font-family:var(--f-mono);font-size:10.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+escapeHtml(initials(clientFullName(cl)))+'</div>';
    h+='<div style="min-width:0;flex:1"><div style="font-family:var(--SS);font-size:12.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escapeHtml(clientFullName(cl))+'</div><div style="font-family:var(--f-mono);color:var(--faible);font-size:10.5px;line-height:1.3;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+sub.id+' · '+escapeHtml(sub.name).slice(0,22)+'</div></div>';
    h+='</div>';
    /* Track */
    h+='<div style="position:relative;height:30px;display:flex;align-items:center">';
    /* Background : zones de phases (couleurs pleines pour passé, atténuées pour futur) */
    h+='<div style="position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:8px;border-radius:4px;display:flex;overflow:hidden;background:var(--surface-2)">';
    const currPhaseIdx=PIPELINE.findIndex(p=>p.id===ph.id);
    phaseZones.forEach(({phase,width},pIdx)=>{
      let opacity='0.18';
      if(pIdx<currPhaseIdx)opacity='1';
      else if(pIdx===currPhaseIdx)opacity='0.55';
      h+='<div style="width:'+width+'%;background:'+phase.color+';opacity:'+opacity+'"></div>';
    });
    h+='</div>';
    /* Marker actuel */
    h+='<div style="position:absolute;left:'+pct+'%;top:50%;transform:translate(-50%,-50%);z-index:2"><div style="width:14px;height:14px;border-radius:50%;background:'+ph.color+';border:2.5px solid var(--surface);box-shadow:0 0 0 1.5px '+ph.color+'"></div></div>';
    h+='</div>';
    /* Ancienneté */
    h+='<div style="text-align:right;font-family:var(--SS);font-family:var(--f-mono);font-size:11px;color:'+ageColor+';font-weight:'+ageWeight+'">'+(days===0?'auj.':days+' j')+(days>21?' ⚠':'')+'</div>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function stagePct(stageId){
  /* Position en % d'une sous-étape sur l'ensemble du pipeline */
  if(!stageId)return 0;
  const totalSubs=PIPELINE.reduce((s,p)=>s+p.substages.length,0);
  let count=0;
  for(const p of PIPELINE){
    for(const s of p.substages){
      if(s.id===stageId){
        return ((count+0.5)/totalSubs)*100;
      }
      count++;
    }
  }
  return 0;
}

/* ═══════════════════════════════════════════════════════
   PIPELINE DÉTAILLÉE — 6 phases × toutes les sous-étapes,
   avec mini-avatars des clients positionnés exactement.
   ═══════════════════════════════════════════════════════ */
function renderDetailedPipeline(clients){
  let h='<div class="card-h"><div><div class="card-title">Pipeline détaillée</div><div class="card-sub">Toutes les phases ET sous-étapes — vous voyez où chaque client en est précisément</div></div><button class="btn ghost sm" onclick="setView(\'pipeline\')">Vue Kanban</button></div>';
  h+='<div style="display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:12px;margin-top:6px;overflow-x:auto;padding-bottom:6px">';

  PIPELINE.forEach(phase=>{
    const phaseClients=clients.filter(cl=>getPhase(cl.stage).id===phase.id);
    h+='<div style="display:flex;flex-direction:column;gap:8px">';
    /* Header de phase */
    h+='<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:'+phase.color+'14;border:1px solid '+phase.color+'40">';
    h+='<div style="width:24px;height:24px;border-radius:6px;background:'+phase.color+';color:#FFF;font-family:var(--f-mono);font-size:11.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+phase.id+'</div>';
    h+='<div style="flex:1;min-width:0"><div style="font-family:var(--SF);font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.1">'+escapeHtml(phase.name)+'</div><div style="font-family:var(--SS);font-size:9px;color:var(--stone);letter-spacing:0.06em;text-transform:uppercase;font-weight:600;margin-top:1px">'+escapeHtml(phase.role)+'</div></div>';
    h+='<div style="background:var(--surface);color:var(--texte);font-family:var(--f-mono);font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--filet-fort)">'+phaseClients.length+'</div>';
    h+='</div>';

    /* Liste des sous-étapes */
    phase.substages.forEach(sub=>{
      const subClients=clients.filter(cl=>cl.stage===sub.id);
      const hasClients=subClients.length>0;
      h+='<div class="substage-mini" style="padding:7px 10px;border-radius:6px;background:'+(hasClients?'var(--surf)':'transparent')+';border:1px solid '+(hasClients?'var(--linen)':'transparent')+';display:flex;flex-direction:column;gap:5px;cursor:'+(hasClients?'pointer':'default')+';transition:border-color .15s ease,background .15s ease;'+(hasClients?'':'opacity:0.55')+'"';
      if(hasClients)h+=' onmouseenter="this.style.borderColor=\''+phase.color+'66\'" onmouseleave="this.style.borderColor=\'var(--linen)\'"';
      h+='>';
      h+='<div style="display:flex;align-items:center;justify-content:space-between;gap:6px">';
      h+='<div style="display:flex;align-items:center;gap:6px;min-width:0;flex:1"><span style="font-family:var(--f-mono);color:'+phase.color+';font-size:10.5px;flex-shrink:0">'+sub.id+'</span><span style="font-family:var(--SS);font-size:11px;color:var(--text);font-weight:'+(hasClients?'600':'500')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escapeHtml(sub.name)+'</span></div>';
      if(hasClients)h+='<span style="background:'+phase.color+';color:#FFF;font-family:var(--f-mono);font-size:9.5px;padding:1px 6px;border-radius:8px;flex-shrink:0">'+subClients.length+'</span>';
      h+='</div>';
      /* Mini avatars de clients */
      if(hasClients){
        h+='<div style="display:flex;flex-wrap:wrap;gap:3px;padding-left:3px">';
        subClients.slice(0,8).forEach(cl=>{
          const days=daysAt(cl.lastUpdated||cl.createdAt);
          const isLate=days>14;
          h+='<div onclick="event.stopPropagation();openClient(\''+cl.id+'\')" title="'+escapeHtml(clientFullName(cl))+' — '+days+'j" style="width:22px;height:22px;border-radius:5px;background:var(--av-bg);color:var(--av-fg);font-family:var(--f-mono);font-size:8.5px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1.5px solid '+(isLate?'var(--red)':'var(--surface)')+'">'+escapeHtml(initials(clientFullName(cl)))+'</div>';
        });
        if(subClients.length>8)h+='<div style="width:22px;height:22px;border-radius:5px;background:var(--paper);color:var(--stone);font-family:var(--SS);font-weight:700;font-size:9px;display:flex;align-items:center;justify-content:center;border:1px solid var(--linen)">+'+(subClients.length-8)+'</div>';
        h+='</div>';
      }
      h+='</div>';
    });
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function kpiCard(label,val,trend,ico,extra,arrow){
  const icoSvg={
    users:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>',
    euro:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 7c-3-3-9-3-12 0-3 3-3 7 0 10 3 3 9 3 12 0M6 11h7M6 15h7"/></svg>',
    trend:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><polyline points="14 7 21 7 21 14"/></svg>',
    warn:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
  };
  return '<div class="kpi'+(extra==='accent'?' accent':'')+'"><div class="kpi-head"><div class="kpi-label">'+label+'</div><div class="kpi-icon">'+(icoSvg[ico]||'')+'</div></div><div class="kpi-val">'+val+'</div>'+(trend?'<div class="kpi-trend '+(arrow||'')+'">'+trend+'</div>':'')+'</div>';

function collectActivities(limit){
  const all=[];
  S.clients.forEach(c=>{
    (c.history||[]).forEach(h=>all.push({...h,clientId:c.id,clientName:clientFullName(c)}));
    (c.notes||[]).forEach(n=>all.push({type:'note',at:n.at,by:n.by,body:n.body,clientId:c.id,clientName:clientFullName(c)}));
    (c.communications||[]).forEach(co=>all.push({type:'comm',at:co.at,by:co.by,body:co.subject||co.body,clientId:c.id,clientName:clientFullName(c),channel:co.channel}));
  });
  return all.sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,limit||10);
}

function renderActivityItem(it){
  const author=teammate(it.by)?.name||'Système';
  const cliLink='<a onclick="openClient(\''+it.clientId+'\')" style="color:var(--gold);font-weight:600;cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--goldB)">'+escapeHtml(it.clientName)+'</a>';
  let title='Activité',body=it.body||'';
  if(it.type==='stage'){title='Étape : '+it.from+' → '+it.to;body=it.note||'';}
  else if(it.type==='note'){title='Note';}
  else if(it.type==='comm'){title=(it.channel==='sms'?'SMS':'E-mail');}
  else if(it.type==='create'){title='Client créé';}
  return '<div class="tl-item'+(it.type==='create'||it.type==='stage'?' system':'')+'"><div class="tl-time">'+relTime(it.at)+'</div><div class="tl-title">'+escapeHtml(title)+' · '+cliLink+'</div>'+(body?'<div class="tl-body">'+escapeHtml(body)+'</div>':'')+'<div class="tl-author">par '+escapeHtml(author)+'</div></div>';
}

function allTasks(){
  const all=[];
  S.clients.forEach(c=>(c.tasks||[]).forEach(t=>all.push({...t,clientId:c.id,clientName:clientFullName(c)})));
  return all.sort((a,b)=>(a.due||'9999')<(b.due||'9999')?-1:1);
}

function renderTaskRow(t){
  const overdue=t.due&&new Date(t.due)<new Date()&&!t.done;
  const ass=teammate(t.assignee)?.name||'Non assigné';
  return '<div class="task'+(t.done?' done':'')+'" onclick="openClient(\''+t.clientId+'\')" style="cursor:pointer"><div class="task-check" onclick="event.stopPropagation();toggleTask(\''+t.clientId+'\',\''+t.id+'\')"></div><div class="task-info"><div class="task-title">'+escapeHtml(t.title)+'</div><div class="task-meta"><span class="cli">'+escapeHtml(t.clientName)+'</span><span>·</span><span>'+escapeHtml(ass)+'</span>'+(t.due?'<span>·</span><span class="date'+(overdue?' late':'')+'">'+(overdue?'En retard · ':'')+fmtDate(t.due)+'</span>':'')+'</div></div></div>';
}

/* ═══════════════════════════════════════════════════════
   VIEW : PIPELINE (Kanban)
   ═══════════════════════════════════════════════════════ */
/* Mapping rôle ID → phases de pipeline qui les concernent */
const ROLE_PHASES={
  all:['1','2','3','4','5','6'],
  secretaire:['1','6'],            /* Accueil + SAV (cf. PIPELINE id:6 role: SAV/Secrétariat) */
  commercial:['2','5'],             /* Commercial + Réception (Commercial+Chef) */
  conducteur:['3'],                 /* Préparation */
  chef:['4','5'],                   /* Chantier + Réception (Commercial+Chef) */
  sav:['6'],                        /* SAV & Garanties */
  compta:['2','5']                  /* Devis (2.7) + Solde encaissé (5.5) */
};

function renderPipeline(c){
  const filterRole=S.filters.role||'all';
  const allowedPhases=ROLE_PHASES[filterRole]||ROLE_PHASES.all;
  const visiblePhases=PIPELINE.filter(p=>allowedPhases.includes(p.id));

  /* Filtres */
  const fb=document.createElement('div');fb.className='card glass';
  /* On compte uniquement les clients dans les phases visibles pour la stat */
  const visibleClients=S.clients.filter(x=>!x.archived&&allowedPhases.includes(getPhase(x.stage).id));
  const visibleSum=visibleClients.reduce((s,x)=>s+(x.budgetEstime||0),0);
  fb.innerHTML='<div class="actionbar" style="margin:0"><div class="chips" style="margin:0">'+
    chip('Tout','all',filterRole==='all','setRoleFilter(\'all\')')+
    ROLES.filter(r=>r.id!=='gerant').map(r=>chip(r.label,r.id,filterRole===r.id,'setRoleFilter(\''+r.id+'\')')).join('')+
    '</div><div style="display:flex;gap:8px"><span class="statpill"><span class="lbl">Total :</span> '+visibleClients.length+'</span><span class="statpill"><span class="lbl">Pipeline :</span> '+fmtEUR(visibleSum)+'</span></div></div>';
  c.appendChild(fb);

  /* Sous-titre contextuel selon le rôle */
  if(filterRole!=='all'){
    const r=ROLES.find(x=>x.id===filterRole);
    const ctx=document.createElement('div');
    ctx.className='ctx-note';
    const phaseNames=visiblePhases.map(p=>p.name).join(' · ');
    ctx.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;color:var(--signal)"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span><strong style="color:var(--ink)">Vue '+escapeHtml(r.label)+'</strong> — phases concernées : <strong class="ph">'+escapeHtml(phaseNames)+'</strong></span>';
    c.appendChild(ctx);
  }

  const wrap=document.createElement('div');wrap.className='pipeline';
  visiblePhases.forEach(phase=>{
    const cs=S.clients.filter(cl=>{
      if(cl.archived)return false;
      if(getPhase(cl.stage).id!==phase.id)return false;
      if(S.filters.search){const q=S.filters.search.toLowerCase();if(!(clientFullName(cl)+' '+(cl.email||'')+' '+(cl.tel||'')).toLowerCase().includes(q))return false;}
      return true;
    });
    const sum=cs.reduce((s,x)=>s+(x.budgetEstime||0),0);
    const col=document.createElement('div');col.className='col';
    let h='<div class="col-h"><div class="col-h-l"><div class="col-num">'+phase.id+'</div><div style="min-width:0"><div class="col-title">'+phase.name+'</div><div class="col-meta">'+phase.role+'</div></div></div><div class="col-count">'+cs.length+'</div></div>';
    h+='<div class="col-body">';
    if(!cs.length)h+='<div class="col-empty">Aucun client à cette phase.</div>';
    cs.forEach(cl=>h+=renderClientCard(cl));
    if(sum>0)h+='<div class="col-sum">'+fmtEUR(sum)+'</div>';
    h+='</div>';
    col.innerHTML=h;
    wrap.appendChild(col);
  });
  c.appendChild(wrap);
}

function chip(label,val,active,handler){return '<button class="chip'+(active?' active':'')+'" onclick="'+handler+'">'+escapeHtml(label)+'</button>';}
function setRoleFilter(r){S.filters.role=r;render();}

function renderClientCard(cl){
  const ph=getPhase(cl.stage);
  const sub=getSubstage(cl.stage);
  const days=daysAt(cl.lastUpdated||cl.createdAt);
  let ageCls='';if(days>21)ageCls=' danger';else if(days>10)ageCls=' warn';
  const com=teammate(cl.assignedCommercial);
  const chef=teammate(cl.assignedChef);
  const avs=[];if(com)avs.push(com);if(chef&&chef!==com)avs.push(chef);
  let h='<div class="cli-card" onclick="openClient(\''+cl.id+'\')">';
  h+='<div class="cli-card-h"><div class="cli-name">'+escapeHtml(clientFullName(cl))+'</div>';
  if(cl.budgetEstime)h+='<div class="cli-amount">'+fmtEUR(cl.budgetEstime)+'</div>';
  h+='</div>';
  h+='<div class="cli-meta">';
  if(cl.typeProjet)h+='<div class="cli-meta-row"><span class="lbl">Projet :</span> '+escapeHtml(cl.typeProjet)+'</div>';
  if(cl.localisation)h+='<div class="cli-meta-row"><span class="lbl">Lieu :</span> '+escapeHtml(cl.localisation)+'</div>';
  h+='</div>';
  h+='<div class="cli-foot"><div class="cli-stage-pill"><span class="cli-stage-num">'+sub.id+'</span>'+escapeHtml(sub.name)+'</div>';
  h+='<div style="display:flex;align-items:center;gap:8px"><span class="cli-age'+ageCls+'">'+(days===0?'aujourd\'hui':days+' j')+'</span>';
  if(avs.length)h+='<div class="av-stack">'+avs.map(u=>'<div class="av" title="'+escapeHtml(u.name)+'">'+escapeHtml(u.avatar||initials(u.name))+'</div>').join('')+'</div>';
  h+='</div></div>';
  h+='</div>';
  return h;
}

/* ═══════════════════════════════════════════════════════
   VIEW : CLIENTS LIST
   ═══════════════════════════════════════════════════════ */
function renderClients(c){
  const fb=document.createElement('div');fb.className='card glass';
  fb.innerHTML='<div class="actionbar" style="margin:0"><div><div class="card-title" style="font-size:16px">Tous les clients</div><div class="card-sub">'+S.clients.length+' au total</div></div><button class="btn primary sm" onclick="openClientModal()">+ Nouveau</button></div>';
  c.appendChild(fb);

  /* Filtres par statut : actifs / signés / inactifs (abandons) / archivés */
  const stFilter=S.filters.clientStatut||'actifs';
  const stCount=k=>S.clients.filter(cl=>{
    const s=cl.statut||'actif';
    if(k==='actifs')return s!=='abandonne'&&s!=='archive';
    if(k==='signes')return s==='signe';
    if(k==='inactifs')return s==='abandonne';
    if(k==='archives')return s==='archive';
    return true;
  }).length;
  const chips=document.createElement('div');
  chips.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 14px';
  chips.innerHTML=[['actifs','Actifs'],['signes','Signés'],['inactifs','Inactifs (abandons)'],['archives','Archivés'],['tous','Tous']].map(([k,lbl])=>
    '<button class="btn sm'+(stFilter===k?' gold':' ghost')+'" onclick="setClientStatutFilter(\''+k+'\')">'+lbl+' · '+stCount(k)+'</button>'
  ).join('');
  c.appendChild(chips);

  const cs=S.clients.filter(cl=>{
    const s=cl.statut||'actif';
    if(stFilter==='actifs'&&(s==='abandonne'||s==='archive'))return false;
    if(stFilter==='signes'&&s!=='signe')return false;
    if(stFilter==='inactifs'&&s!=='abandonne')return false;
    if(stFilter==='archives'&&s!=='archive')return false;
    if(S.filters.search){const q=S.filters.search.toLowerCase();if(!(clientFullName(cl)+' '+(cl.email||'')+' '+(cl.tel||'')).toLowerCase().includes(q))return false;}
    return true;
  }).sort((a,b)=>new Date(b.lastUpdated||b.createdAt)-new Date(a.lastUpdated||a.createdAt));

  if(!cs.length){
    const e=document.createElement('div');e.className='card';
    e.innerHTML='<div class="empty"><div class="empty-ico">⊕</div>Aucun client. Cliquez sur <strong>+ Nouveau client</strong> pour commencer.</div>';
    c.appendChild(e);return;
  }

  const w=document.createElement('div');w.className='tbl-wrap';
  let h='<table class="tbl"><thead><tr><th>Client</th><th>Phase</th><th>Sous-étape</th><th class="num">Budget</th><th>Commercial</th><th>Maj</th></tr></thead><tbody>';
  cs.forEach(cl=>{
    const ph=getPhase(cl.stage);const sub=getSubstage(cl.stage);
    const com=teammate(cl.assignedCommercial);
    const days=daysAt(cl.lastUpdated||cl.createdAt);
    h+='<tr onclick="openClient(\''+cl.id+'\')">';
    h+='<td><div style="display:flex;align-items:center;gap:10px"><div class="avatar" style="width:32px;height:32px;font-size:11px;border-radius:7px">'+escapeHtml(initials(clientFullName(cl)))+'</div><div><div style="font-weight:600;font-size:13.5px">'+escapeHtml(clientFullName(cl))+'</div><div style="font-size:11.5px;color:var(--faible)">'+escapeHtml(cl.raisonSociale||cl.email||cl.tel||'—')+'</div></div></div></td>';
    h+='<td><span class="badge" style="background:'+ph.color+'22;color:'+ph.color+'">'+ph.id+'. '+ph.name+'</span>'+(cl.statut&&cl.statut!=='actif'?' '+statutBadgeHtml(cl):'')+'</td>';
    h+='<td style="font-size:12px;color:var(--text2)"><span style="font-family:var(--f-mono);color:var(--texte);margin-right:4px">'+sub.id+'</span> '+escapeHtml(sub.name)+'</td>';
    h+='<td class="num">'+(cl.budgetEstime?fmtEUR(cl.budgetEstime):'—')+'</td>';
    h+='<td>'+(com?'<div style="display:flex;align-items:center;gap:7px"><div class="av" style="width:24px;height:24px;font-size:9.5px;border-radius:50%;background:var(--av-bg);color:var(--av-fg);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono)">'+escapeHtml(com.avatar||initials(com.name))+'</div><span style="font-size:12.5px;white-space:nowrap">'+escapeHtml(com.name)+'</span></div>':'<span style="color:var(--faible);font-size:12px">non assigné</span>')+'</td>';
    h+='<td style="color:var(--faible);font-size:12px;white-space:nowrap">'+(days<=1?'aujourd\'hui':'il y a '+days+' j')+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table>';
  w.innerHTML=h;
  c.appendChild(w);
}

/* ═══════════════════════════════════════════════════════
   VIEW : CLIENT DETAIL
   ═══════════════════════════════════════════════════════ */
function renderClientDetail(c){
  const cl=S.clients.find(x=>x.id===S.selectedClientId);
  if(!cl){c.innerHTML='<div class="card"><div class="empty">Client introuvable.</div></div>';return;}
  const ph=getPhase(cl.stage);const sub=getSubstage(cl.stage);

  /* Action bar */
  const ab=document.createElement('div');ab.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap';
  ab.innerHTML='<button class="btn ghost sm" onclick="setView(\'clients\')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Retour</button><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="openSendCommModal(\''+cl.id+'\',\'email\')">Envoyer un e-mail</button><button class="btn sm" onclick="openSendCommModal(\''+cl.id+'\',\'sms\')">SMS</button><button class="btn primary sm" onclick="openTransferModal(\''+cl.id+'\')">→ Faire avancer</button></div>';
  c.appendChild(ab);

  /* Hero */
  const hero=document.createElement('div');hero.className='client-hero';
  hero.innerHTML='<div class="hero-row"><div class="hero-av">'+escapeHtml(initials(clientFullName(cl)))+'</div><div class="hero-info"><div class="hero-name">'+escapeHtml(clientFullName(cl))+'</div><div class="hero-sub">'+
    (cl.raisonSociale?'<span>'+escapeHtml(cl.raisonSociale)+'</span><span class="sep">·</span>':'')+(cl.email?'<span>'+escapeHtml(cl.email)+'</span>':'')+
    (cl.tel?'<span class="sep">·</span><span style="font-family:var(--f-mono);font-size:12.5px">'+escapeHtml(cl.tel)+'</span>':'')+
    (cl.localisation?'<span class="sep">·</span><span>'+escapeHtml(cl.localisation)+'</span>':'')+
    (cl.budgetEstime?'<span class="sep">·</span><span class="montant">'+fmtEUR(cl.budgetEstime)+'</span>':'')+
    (cl.secteurRecherche?'<span class="sep">·</span><span>Secteur : '+escapeHtml(cl.secteurRecherche)+'</span>':'')+
    (cl.statut&&cl.statut!=='actif'?'<span class="sep">·</span>'+statutBadgeHtml(cl):'')+
    '</div></div><button class="btn ghost sm" onclick="openClientModal(\''+cl.id+'\')">Modifier</button></div>'+
    (cl.commentaire?'<div style="margin-top:10px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--filet);border-radius:8px;font-size:12.5px;color:var(--attenue);white-space:pre-wrap">'+escapeHtml(cl.commentaire)+'</div>':'');
  /* Stage progress */
  hero.innerHTML+='<div class="stage-bar">'+PIPELINE.map(p=>{
    const phNum=parseFloat(ph.id);const pNum=parseFloat(p.id);
    const cls=phNum>pNum?'done':(phNum===pNum?'current':'');
    return '<div class="stage-step '+cls+'" onclick="updateStage(\''+cl.id+'\',\''+p.id+'.1\')"><div class="stage-dot">'+p.id+'</div><div class="stage-lbl">'+escapeHtml(p.name)+'</div></div>';
  }).join('')+'</div>';
  c.appendChild(hero);

  /* Detail layout: tabs + side */
  const det=document.createElement('div');det.className='detail';

  /* LEFT: Tabs */
  const left=document.createElement('div');
  left.innerHTML='<div class="tabs">'+
    ['etapes','timeline','tasks','docs','comm','sav'].map(t=>{
      const labels={etapes:'Étapes',timeline:'Activité',tasks:'Tâches ('+(cl.tasks||[]).filter(t=>!t.done).length+')',docs:'Documents ('+(cl.documents||[]).length+')',comm:'Communications',sav:'SAV'};
      const active=cl._tab===t||(!cl._tab&&t==='etapes');
      return '<button class="tab'+(active?' active':'')+'" onclick="setClientTab(\''+cl.id+'\',\''+t+'\')">'+labels[t]+'</button>';
    }).join('')+'</div><div id="cli-tab-body"></div>';
  det.appendChild(left);

  /* RIGHT: Side */
  const right=document.createElement('div');right.className='detail-side';
  right.innerHTML=
    '<div class="card" style="padding:18px"><div style="font-family:var(--SS);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--stone);font-weight:700;margin-bottom:10px">Phase actuelle</div><div style="font-size:19px;font-weight:600;line-height:1.2">'+ph.id+'. '+escapeHtml(ph.name)+'</div><div style="font-family:var(--SS);font-size:11.5px;color:var(--text2);margin-top:4px">'+escapeHtml(ph.role)+'</div><div class="rule"></div><div style="font-family:var(--SS);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--stone);font-weight:700;margin-bottom:6px">Sous-étape</div><div style="font-size:14px;font-weight:600;color:var(--signal)"><span style="font-family:var(--f-mono)">'+sub.id+'</span> · '+escapeHtml(sub.name)+'</div><div style="font-family:var(--SS);font-size:11.5px;color:var(--text2);margin-top:6px">Depuis '+daysAt(cl.lastUpdated||cl.createdAt)+' jour(s)</div></div>'+
    '<div class="card" style="padding:18px"><div style="font-family:var(--SS);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--stone);font-weight:700;margin-bottom:11px">Affectations</div>'+
      assigneeRow('Commercial',cl.assignedCommercial,'commercial',cl.id)+
      assigneeRow('Conducteur',cl.assignedConducteur,'conducteur',cl.id)+
      assigneeRow('Chef de chantier',cl.assignedChef,'chef',cl.id)+
      assigneeRow('SAV',cl.assignedSAV,'sav',cl.id)+
    '</div>'+
    '<div class="card" style="padding:18px"><div style="font-family:var(--SS);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--stone);font-weight:700;margin-bottom:11px">Liens externes</div>'+
      '<button class="btn sm" style="width:100%;margin-bottom:6px;justify-content:flex-start" onclick="__demoPost({type:\'oniq-open-app\',app:\'metrimanager\'},\'*\')">Ouvrir dans OniMetri (devis)</button>'+
      '<button class="btn sm" style="width:100%;margin-bottom:6px;justify-content:flex-start" onclick="__demoPost({type:\'oniq-open-app\',app:\'batimanager\'},\'*\')">Ouvrir dans BatiManager (chantier)</button>'+
      '<button class="btn sm" style="width:100%;justify-content:flex-start" onclick="__demoPost({type:\'oniq-open-app\',app:\'onicompta\'},\'*\')">Ouvrir dans OniCompta (factures)</button>'+
    '</div>';
  /* Rendez-vous (R1, R2…) + Statut (abandon / signé / archivé) */
  right.innerHTML+=rdvCardHtml(cl)+statutCardHtml(cl);
  det.appendChild(right);

  c.appendChild(det);

  /* Render active tab */
  setTimeout(()=>renderClientTab(cl,cl._tab||'etapes'),0);
}

function assigneeRow(label,userId,roleId,clientId){
  const u=teammate(userId);
  return '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--paper)" onclick="openAssignModal(\''+clientId+'\',\''+roleId+'\')" style="cursor:pointer">'+
    (u?'<div class="av" style="width:26px;height:26px;font-size:9.5px;border-radius:50%;background:var(--av-bg);color:var(--av-fg);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono)">'+escapeHtml(u.avatar||initials(u.name))+'</div>':'<div style="width:26px;height:26px;border-radius:50%;border:1px dashed var(--filet-fort);display:flex;align-items:center;justify-content:center;color:var(--faible)">+</div>')+
    '<div style="flex:1;min-width:0;cursor:pointer" onclick="openAssignModal(\''+clientId+'\',\''+roleId+'\')"><div style="font-size:12.5px;font-weight:500">'+escapeHtml(u?u.name:'Non assigné')+'</div><div style="font-family:var(--SS);font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--stone);font-weight:600">'+escapeHtml(label)+'</div></div></div>';
}

function setClientTab(cid,tab){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;cl._tab=tab;
  document.querySelectorAll('.tabs .tab').forEach(b=>b.classList.remove('active'));
  const idx=['etapes','timeline','tasks','docs','comm','sav'].indexOf(tab);
  document.querySelectorAll('.tabs .tab')[idx]?.classList.add('active');
  renderClientTab(cl,tab);
}

function renderClientTab(cl,tab){
  const body=document.getElementById('cli-tab-body');if(!body)return;
  if(tab==='etapes'){
    let h='<div class="card"><div class="card-h"><div><div class="card-title">Sous-étapes de ce client</div><div class="card-sub">Cliquez pour faire avancer ou revenir en arrière</div></div></div>';
    PIPELINE.forEach(p=>{
      h+='<div style="margin-bottom:18px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div class="phase-sq" style="background:'+p.color+'">'+p.id+'</div><div style="font-size:14.5px;font-weight:600">'+escapeHtml(p.name)+'</div><div style="font-family:var(--f-mono);font-size:9.5px;color:var(--faible);margin-left:auto;letter-spacing:0.1em;text-transform:uppercase">'+escapeHtml(p.role)+'</div></div><div class="substage-grid">';
      p.substages.forEach(sb=>{
        const cur=cl.stage===sb.id;
        const phNum=parseFloat(getPhase(cl.stage).id);const pNum=parseFloat(p.id);
        const subNum=parseFloat(sb.id);const clNum=parseFloat(cl.stage||'1.1');
        const done=clNum>subNum;
        h+='<div class="substage-row '+(cur?'current':done?'done':'')+'" onclick="updateStage(\''+cl.id+'\',\''+sb.id+'\')"><div class="substage-check"></div><div class="substage-num">'+sb.id+'</div><div class="substage-lbl">'+escapeHtml(sb.name)+'</div></div>';
      });
      h+='</div></div>';
    });
    h+='</div>';
    body.innerHTML=h;
  }
  else if(tab==='timeline'){
    const acts=[...(cl.history||[]).map(h=>({...h,type:h.type||'stage'})),...(cl.notes||[]).map(n=>({type:'note',at:n.at,by:n.by,body:n.body})),...(cl.communications||[]).map(co=>({type:'comm',at:co.at,by:co.by,body:co.subject||co.body,channel:co.channel}))].sort((a,b)=>new Date(b.at)-new Date(a.at));
    let h='<div class="card"><div class="card-h"><div><div class="card-title">Activité complète</div><div class="card-sub">Tout l\'historique du client en un coup d\'œil</div></div><button class="btn sm" onclick="openNoteModal(\''+cl.id+'\')">+ Note</button></div>';
    h+=acts.length?'<div class="timeline">'+acts.map(it=>{
      const author=teammate(it.by)?.name||'Système';
      let title='Activité',body=it.body||'';
      if(it.type==='stage'){title='Étape : '+it.from+' → '+it.to;body=it.note||'';}
      else if(it.type==='note'){title='Note interne';}
      else if(it.type==='comm'){title=(it.channel==='sms'?'SMS':'E-mail');}
      else if(it.type==='create'){title='Client créé';}
      return '<div class="tl-item'+(it.type==='create'||it.type==='stage'?' system':'')+'"><div class="tl-time">'+fmtDateTime(it.at)+' · '+relTime(it.at)+'</div><div class="tl-title">'+escapeHtml(title)+'</div>'+(body?'<div class="tl-body">'+escapeHtml(body)+'</div>':'')+'<div class="tl-author">par '+escapeHtml(author)+'</div></div>';
    }).join('')+'</div>':'<div class="empty"><div class="empty-ico">∅</div>Pas encore d\'activité.</div>';
    h+='</div>';
    body.innerHTML=h;
  }
  else if(tab==='tasks'){
    const tasks=cl.tasks||[];
    let h='<div class="card"><div class="card-h"><div><div class="card-title">Tâches</div><div class="card-sub">'+tasks.filter(t=>!t.done).length+' en cours sur '+tasks.length+' total</div></div><button class="btn primary sm" onclick="openTaskModal(\''+cl.id+'\')">+ Tâche</button></div>';
    h+=tasks.length?'<div style="display:flex;flex-direction:column;gap:7px">'+tasks.sort((a,b)=>(a.done?1:0)-(b.done?1:0)).map(renderTaskRowDetail).join('')+'</div>':'<div class="empty"><div class="empty-ico">✓</div>Aucune tâche.</div>';
    h+='</div>';
    body.innerHTML=h;
  }
  else if(tab==='docs'){
    const docs=cl.documents||[];
    let h='<div class="card"><div class="card-h"><div><div class="card-title">Documents</div><div class="card-sub">Devis, contrats, plans, photos chantier, PV…</div></div><button class="btn primary sm" onclick="openDocModal(\''+cl.id+'\')">+ Document</button></div>';
    h+=docs.length?'<div style="display:flex;flex-direction:column;gap:8px">'+docs.map(d=>{
      const ext=(d.name||'').split('.').pop().toUpperCase().slice(0,4)||'DOC';
      return '<div class="doc"><div class="doc-ico">'+escapeHtml(ext)+'</div><div class="doc-info"><div class="doc-name">'+escapeHtml(d.name||'Document')+'</div><div class="doc-meta">'+fmtDate(d.at)+(d.size?' · '+d.size:'')+(d.tag?' · '+escapeHtml(d.tag):'')+'</div></div><button class="btn ghost xs" onclick="deleteDoc(\''+cl.id+'\',\''+d.id+'\')" aria-label="Supprimer le document">✕</button></div>';
    }).join('')+'</div>':'<div class="empty"><div class="empty-ico">▤</div>Aucun document. Glissez vos fichiers ou cliquez sur <strong>+ Document</strong>.</div>';
    h+='</div>';
    body.innerHTML=h;
  }
  else if(tab==='comm'){
    const comms=cl.communications||[];
    let h='<div class="card"><div class="card-h"><div><div class="card-title">Communications</div><div class="card-sub">Emails, SMS, appels — tout l\'échange avec ce client</div></div><div style="display:flex;gap:6px"><button class="btn primary sm" onclick="openSendCommModal(\''+cl.id+'\',\'email\')">E-mail</button><button class="btn sm" onclick="openSendCommModal(\''+cl.id+'\',\'sms\')">SMS</button></div></div>';
    h+=comms.length?'<div style="display:flex;flex-direction:column;gap:9px">'+comms.sort((a,b)=>new Date(b.at)-new Date(a.at)).map(co=>{
      const ico='<span class="badge b-gold" style="margin-right:4px">'+(co.channel==='sms'?'SMS':co.channel==='call'?'APPEL':'E-MAIL')+'</span>';
      return '<div class="card" style="padding:14px 16px;box-shadow:none;border-color:var(--linen)"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px"><div style="font-size:13px;font-weight:600">'+ico+' '+escapeHtml(co.subject||(co.direction==='in'?'Message reçu':'Message envoyé'))+'</div><div style="font-family:var(--f-mono);font-size:10.5px;color:var(--faible);white-space:nowrap">'+fmtDateTime(co.at)+'</div></div><div style="font-family:var(--SS);font-size:12px;color:var(--text);line-height:1.55;white-space:pre-wrap">'+escapeHtml((co.body||'').slice(0,400))+(co.body&&co.body.length>400?'…':'')+'</div></div>';
    }).join('')+'</div>':'<div class="empty"><div class="empty-ico">✉</div>Aucune communication.</div>';
    h+='</div>';
    body.innerHTML=h;
  }
  else if(tab==='sav'){
    const sav=cl.sav||{tickets:[],garanties:null};
    let h='<div class="card"><div class="card-h"><div><div class="card-title">SAV & Garanties</div><div class="card-sub">Tickets en cours et suivi des garanties</div></div><button class="btn primary sm" onclick="openTicketModal(\''+cl.id+'\')">+ Ticket SAV</button></div>';
    /* Garanties */
    if(sav.garanties&&sav.garanties.start){
      const start=new Date(sav.garanties.start);
      const now=new Date();
      const yrs=(now-start)/(86400000*365.25);
      h+='<div class="split" style="margin-bottom:14px">';
      h+=garCard('GPA · 1 an','gpa',start,1,yrs);
      h+=garCard('Biennale · 2 ans','bien',start,2,yrs);
      h+='</div>';
      h+=garCard('Décennale · 10 ans','dec',start,10,yrs);
    } else {
      h+='<div class="card glass" style="padding:14px;margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><strong>Garanties non démarrées.</strong> <span style="color:var(--text2);font-size:12px">Démarrent automatiquement à la signature du PV de réception (étape 5.3).</span></div><button class="btn ghost sm" onclick="startGaranties(\''+cl.id+'\')">Démarrer manuellement</button></div></div>';
    }
    /* Tickets */
    h+='<div class="rule"></div><div style="font-size:14.5px;font-weight:600;margin-bottom:10px">Tickets SAV</div>';
    const tk=sav.tickets||[];
    h+=tk.length?'<div style="display:flex;flex-direction:column;gap:7px">'+tk.map(t=>{
      const stCls=t.status==='open'?'b-red':t.status==='wip'?'b-blue':'b-green';
      const stLbl=t.status==='open'?'Ouvert':t.status==='wip'?'En cours':'Résolu';
      return '<div class="task"><div style="flex:1"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span class="badge '+stCls+'">'+stLbl+'</span><span style="font-size:13.5px;font-weight:500">'+escapeHtml(t.title)+'</span></div><div style="font-family:var(--SS);font-size:11.5px;color:var(--text2);line-height:1.5">'+escapeHtml(t.description||'')+'</div><div style="font-family:var(--SS);font-size:10.5px;color:var(--stone);margin-top:5px">Créé '+fmtDate(t.at)+(t.assignee?' · Assigné à '+escapeHtml(teammate(t.assignee)?.name||'?'):'')+'</div></div><button class="btn ghost xs" onclick="cycleTicket(\''+cl.id+'\',\''+t.id+'\')">→</button></div>';
    }).join('')+'</div>':'<div class="empty"><div class="empty-ico">◇</div>Aucun ticket SAV.</div>';
    h+='</div>';
    body.innerHTML=h;
  }
}

function garCard(label,kind,start,years,curYrs){
  const pct=Math.min(100,Math.max(0,(curYrs/years)*100));
  const remDays=Math.max(0,Math.floor((years*365.25-curYrs*365.25)));
  const expired=curYrs>years;
  return '<div class="gar '+kind+'"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><div style="font-family:var(--SS);font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--stone)">'+escapeHtml(label)+'</div><div style="font-size:14.5px;font-weight:600;margin-top:3px">'+(expired?'Expirée':'<span style="font-family:var(--f-mono)">'+remDays+'</span> jours restants')+'</div></div><div style="font-family:var(--f-mono);font-size:16px;color:var(--texte)">'+pct.toFixed(0)+'%</div></div><div class="gar-prog"><div style="width:'+pct+'%"></div></div><div style="font-family:var(--f-mono);font-size:10.5px;color:var(--faible);margin-top:6px">Démarre : '+fmtDate(start.toISOString())+' · Fin : '+fmtDate(new Date(start.getTime()+years*365.25*86400000).toISOString())+'</div></div>';
}

function renderTaskRowDetail(t){
  const overdue=t.due&&new Date(t.due)<new Date()&&!t.done;
  const ass=teammate(t.assignee)?.name||'Non assigné';
  const cid=t._cid||S.selectedClientId;
  return '<div class="task'+(t.done?' done':'')+'"><div class="task-check" role="checkbox" aria-checked="'+(t.done?'true':'false')+'" tabindex="0" onclick="toggleTask(\''+cid+'\',\''+t.id+'\')"></div><div class="task-info"><div class="task-title">'+escapeHtml(t.title)+'</div>'+(t.body?'<div style="font-family:var(--SS);font-size:11.5px;color:var(--text2);margin-top:3px;line-height:1.5">'+escapeHtml(t.body)+'</div>':'')+'<div class="task-meta"><span>'+escapeHtml(ass)+'</span>'+(t.due?'<span>·</span><span class="date'+(overdue?' late':'')+'">'+(overdue?'En retard · ':'')+fmtDate(t.due)+'</span>':'')+'</div></div><button class="btn ghost xs" onclick="deleteTask(\''+cid+'\',\''+t.id+'\')" aria-label="Supprimer la tâche">✕</button></div>';
}

/* ═══════════════════════════════════════════════════════
   VIEW : TASKS
   ═══════════════════════════════════════════════════════ */
function renderTasks(c){
  const tasks=allTasks();
  const open=tasks.filter(t=>!t.done);
  const done=tasks.filter(t=>t.done);
  const overdue=open.filter(t=>t.due&&new Date(t.due)<new Date());

  const k=document.createElement('div');k.className='kpis';
  k.innerHTML=
    kpiCard('À faire',open.length,'tâches en cours','check')+
    kpiCard('En retard',overdue.length,'à traiter en priorité','warn',overdue.length>0?'down':'')+
    kpiCard('Terminées',done.length,'cette semaine','trend','','up');
  c.appendChild(k);

  const card=document.createElement('div');card.className='card';
  card.innerHTML='<div class="card-h"><div><div class="card-title">Toutes les tâches</div><div class="card-sub">'+tasks.length+' au total · '+open.length+' à faire</div></div></div>'+(tasks.length?'<div style="display:flex;flex-direction:column;gap:7px">'+tasks.map(t=>renderTaskRow(t)).join('')+'</div>':'<div class="empty"><div class="empty-ico">✓</div>Aucune tâche dans toute l\'équipe.</div>');
  c.appendChild(card);
}

   VIEW : COMMUNICATIONS
   ═══════════════════════════════════════════════════════ */
function renderComm(c){
  const all=[];
  S.clients.forEach(cl=>(cl.communications||[]).forEach(co=>all.push({...co,clientId:cl.id,clientName:clientFullName(cl)})));
  all.sort((a,b)=>new Date(b.at)-new Date(a.at));

  c.appendChild(card);
}

/* ═══════════════════════════════════════════════════════
   VIEW : SAV
   ═══════════════════════════════════════════════════════ */
function renderSAV(c){
  const allTickets=[];
  const allGaranties=[];
  S.clients.forEach(cl=>{
    (cl.sav?.tickets||[]).forEach(t=>allTickets.push({...t,clientId:cl.id,clientName:clientFullName(cl)}));
    if(cl.sav?.garanties?.start)allGaranties.push({clientId:cl.id,clientName:clientFullName(cl),start:cl.sav.garanties.start});
  });
  const open=allTickets.filter(t=>t.status==='open'||t.status==='wip');

  const k=document.createElement('div');k.className='kpis';
  k.innerHTML=
    kpiCard('Tickets ouverts',open.length,allTickets.length+' total','warn')+
    kpiCard('Sous garantie',allGaranties.length,'clients couverts','shield')+
    kpiCard('GPA actives',allGaranties.filter(g=>(new Date()-new Date(g.start))/(86400000*365.25)<1).length,'< 1 an depuis PV','trend');
  c.appendChild(k);

  const tk=document.createElement('div');tk.className='card';
  tk.innerHTML='<div class="card-h"><div><div class="card-title">Tickets SAV ouverts</div><div class="card-sub">À traiter en priorité</div></div></div>'+(open.length?'<div style="display:flex;flex-direction:column;gap:8px">'+open.map(t=>'<div class="task" onclick="openClient(\''+t.clientId+'\')" style="cursor:pointer"><div style="flex:1"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span class="badge '+(t.status==='open'?'b-red':'b-blue')+'">'+(t.status==='open'?'Ouvert':'En cours')+'</span><span style="font-size:13.5px;font-weight:500">'+escapeHtml(t.title)+'</span></div><div style="font-size:12px;color:var(--signal)">'+escapeHtml(t.clientName)+'</div></div></div>').join('')+'</div>':'<div class="empty"><div class="empty-ico">◇</div>Aucun ticket ouvert.</div>');
  c.appendChild(tk);

  const gar=document.createElement('div');gar.className='card';
  gar.innerHTML='<div class="card-h"><div><div class="card-title">Suivi garanties</div><div class="card-sub">GPA / biennale / décennale par client</div></div></div>';
  if(!allGaranties.length){gar.innerHTML+='<div class="empty"><div class="empty-ico">◇</div>Aucune garantie active. Les garanties démarrent à la signature du PV (5.3).</div>';}
  else{
    let h='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Client</th><th>Démarrage</th><th>GPA</th><th>Biennale</th><th>Décennale</th></tr></thead><tbody>';
    allGaranties.forEach(g=>{
      const st=new Date(g.start);
      const yrs=(Date.now()-st)/(86400000*365.25);
      const gpaPct=Math.min(100,(yrs/1)*100);
      const bienPct=Math.min(100,(yrs/2)*100);
      const decPct=Math.min(100,(yrs/10)*100);
      h+='<tr onclick="openClient(\''+g.clientId+'\')"><td style="font-weight:700">'+escapeHtml(g.clientName)+'</td><td style="font-family:var(--f-mono);font-size:12px;color:var(--attenue)">'+fmtDate(g.start)+'</td>'+
        '<td>'+(yrs<1?'<div style="display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px"><div class="bar-mini"><div style="width:'+gpaPct+'%;background:var(--signal)"></div></div>'+gpaPct.toFixed(0)+'%</div>':'<span class="badge b-stone">Expirée</span>')+'</td>'+
        '<td>'+(yrs<2?'<div style="display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px"><div class="bar-mini"><div style="width:'+bienPct+'%;background:var(--attenue)"></div></div>'+bienPct.toFixed(0)+'%</div>':'<span class="badge b-stone">Expirée</span>')+'</td>'+
        '<td>'+(yrs<10?'<div style="display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px"><div class="bar-mini"><div style="width:'+decPct+'%;background:var(--ok)"></div></div>'+decPct.toFixed(0)+'%</div>':'<span class="badge b-stone">Expirée</span>')+'</td>'+
        '</tr>';
    });
    h+='</tbody></table></div>';
    gar.innerHTML+=h;
  }
  c.appendChild(gar);
}

/* ═══════════════════════════════════════════════════════
   VIEW : STATS — KPIs, performance équipe, indicateurs business
   ═══════════════════════════════════════════════════════ */
function renderStats(c){
  renderStatsRdvOrigine(c); /* RDV par période + origine des contacts (en tête) */
  const clients = S.clients||[];
  const team = S.team||[];
  const tasks = (S.tasks&&S.tasks.length)?S.tasks:allTasks(); /* démo : S.tasks n'est jamais alimenté, on lit les tâches des fiches */

  // KPIs globaux
  const totalClients = clients.length;
  const won = clients.filter(cl=>cl.stage && (cl.stage.startsWith('5')||cl.stage.startsWith('6'))).length;
  const inChantier = clients.filter(cl=>cl.stage && cl.stage.startsWith('4')).length;
  const inCommercial = clients.filter(cl=>cl.stage && cl.stage.startsWith('2')).length;
  const totalRevenue = clients.reduce((s,c)=>s+(Number(c.value)||0),0);
  const wonRevenue = clients.filter(cl=>cl.stage && (cl.stage.startsWith('5')||cl.stage.startsWith('6'))).reduce((s,c)=>s+(Number(c.value)||0),0);
  const avgDealSize = totalClients>0?Math.round(totalRevenue/totalClients):0;
  const conversionRate = totalClients>0?Math.round((won/totalClients)*100):0;
  const tasksOpen = tasks.filter(t=>!t.done).length;
  const tasksDone = tasks.filter(t=>t.done).length;

  // Distribution par phase
  const phaseLabels = ['Accueil','Commercial','Préparation','Chantier','Réception','SAV'];
  const phaseDist = [1,2,3,4,5,6].map(n=>clients.filter(cl=>cl.stage && cl.stage.startsWith(String(n))).length);
  const phaseColors = PIPELINE.slice(0,6).map(p=>p.color);
  const maxPhase = Math.max(1, ...phaseDist);

  // Top performers (équipe)
  const teamStats = team.map(t=>{
    const myClients = clients.filter(cl=>cl.assignedTo===t.id);
    const mySigned = myClients.filter(cl=>cl.stage && (cl.stage.startsWith('5')||cl.stage.startsWith('6'))).length;
    const myRevenue = myClients.filter(cl=>cl.stage && (cl.stage.startsWith('5')||cl.stage.startsWith('6'))).reduce((s,c)=>s+(Number(c.value)||0),0);
    return {...t, clients:myClients.length, signed:mySigned, revenue:myRevenue};
  }).sort((a,b)=>b.signed-a.signed);

  // Helper format
  const fmt = (n)=>{
    if(n>=1000000) return (n/1000000).toFixed(1)+' M€';
    if(n>=1000) return Math.round(n/1000)+' k€';
    return n+' €';
  };

  // KPI cards
  const kpiCard = (title,value,sub,color)=>{
    return '<div class="kpi"><div class="kpi-label" style="margin-bottom:10px">'+title+'</div>'+
    '<div class="kpi-val" style="color:'+(color||'var(--texte)')+'">'+value+'</div>'+
    (sub?'<div class="kpi-trend">'+sub+'</div>':'')+'</div>';
  };

  let h = '';

  // Première rangée KPIs principaux
  h += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px">';
  h += kpiCard('Clients total', totalClients, '+'+won+' signés', 'var(--ink)');
  h += kpiCard('CA généré', fmt(wonRevenue), 'sur '+fmt(totalRevenue)+' pipeline', 'var(--ok)');
  h += kpiCard('Taux conversion', conversionRate+' %', won+' signatures sur '+totalClients+' clients', 'var(--texte)');
  h += kpiCard('Panier moyen', fmt(avgDealSize), 'tous clients confondus', 'var(--texte)');
  h += '</div>';

  // 2ème rangée : KPIs secondaires
  h += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px">';
  h += kpiCard('En chantier', inChantier, 'projets actifs', 'var(--signal)');
  h += kpiCard('En négociation', inCommercial, 'phase commerciale', 'var(--texte)');
  h += kpiCard('Tâches ouvertes', tasksOpen, tasksDone+' terminées', 'var(--texte)');
  h += kpiCard('Équipe', team.length, team.filter(t=>t.role==='commercial').length+' commerciaux', 'var(--ink)');
  h += '</div>';

  // Distribution par phase (graphique en barres simple)
  h += '<div class="card" style="margin-bottom:18px"><div class="card-h"><div><div class="card-title">Distribution clients par phase</div><div class="card-sub">Vue d\'ensemble du pipeline ('+totalClients+' clients)</div></div></div>';
  h += '<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:14px">';
  phaseDist.forEach((cnt,i)=>{
    const pct = (cnt/maxPhase)*100;
    h += '<div style="text-align:center">'+
      '<div style="height:140px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:10px">'+
        '<div style="width:60px;height:'+pct+'%;min-height:'+(cnt>0?14:2)+'px;background:'+phaseColors[i]+';border-radius:5px 5px 2px 2px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;color:#fff;font-size:12.5px;font-family:var(--f-mono)">'+(cnt>0?cnt:'')+'</div>'+
      '</div>'+
      '<div style="font-family:var(--f-mono);font-size:9.5px;color:var(--faible);text-transform:uppercase;letter-spacing:0.1em">'+phaseLabels[i]+'</div>'+
    '</div>';
  });
  h += '</div></div>';

  // Top performers
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px">';

  // Classement équipe
  h += '<div class="card"><div class="card-h"><div><div class="card-title">Classement équipe</div><div class="card-sub">Top performers par signatures</div></div></div>';
  if(teamStats.length===0){
    h += '<div style="padding:30px;text-align:center;color:var(--faible)">Ajoutez des membres dans Équipe pour voir le classement.</div>';
  } else {
    h += '<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">';
    teamStats.slice(0,8).forEach((t,i)=>{
      const medals=['#1','#2','#3'];
      const medal = i<3?medals[i]:'#'+(i+1);
      h += '<div style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;background:'+(i<3?'var(--surface-2)':'transparent')+';border:1px solid var(--filet)">'+
        '<div style="width:32px;text-align:center;font-family:var(--f-mono);font-size:13px;color:'+(i<3?'var(--signal)':'var(--faible)')+'">'+medal+'</div>'+
        '<div style="flex:1">'+
          '<div style="font-weight:600;font-size:13.5px">'+escapeHtml(t.name||'—')+'</div>'+
          '<div style="font-family:var(--f-mono);font-size:10px;color:var(--faible);text-transform:uppercase;letter-spacing:0.08em">'+escapeHtml(t.role||'')+' · '+t.clients+' clients</div>'+
        '</div>'+
        '<div style="text-align:right">'+
          '<div style="font-family:var(--f-mono);font-size:16px;color:var(--ok)">'+t.signed+' <span style="font-size:10.5px;color:var(--faible)">sign.</span></div>'+
          '<div style="font-family:var(--f-mono);font-size:11px;color:var(--attenue)">'+fmt(t.revenue)+'</div>'+
        '</div>'+
      '</div>';
    });
    h += '</div>';
  }
  h += '</div>';

  // Activité récente
  h += '<div class="card"><div class="card-h"><div><div class="card-title">Activité récente</div><div class="card-sub">Évolutions des 30 derniers jours</div></div></div>';
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">';
  h += '<div style="padding:14px;background:var(--surface-2);border:1px solid var(--filet);border-radius:10px;text-align:center"><div style="font-family:var(--f-mono);font-size:26px;color:var(--ok);line-height:1">'+won+'</div><div style="font-family:var(--f-mono);font-size:9.5px;color:var(--faible);text-transform:uppercase;letter-spacing:0.1em;margin-top:6px">Signatures</div></div>';
  h += '<div style="padding:14px;background:var(--surface-2);border:1px solid var(--filet);border-radius:10px;text-align:center"><div style="font-family:var(--f-mono);font-size:26px;color:var(--texte);line-height:1">'+(totalClients-won)+'</div><div style="font-family:var(--f-mono);font-size:9.5px;color:var(--faible);text-transform:uppercase;letter-spacing:0.1em;margin-top:6px">Pipeline</div></div>';
  h += '<div style="padding:14px;background:var(--surface-2);border:1px solid var(--filet);border-radius:10px;text-align:center"><div style="font-family:var(--f-mono);font-size:26px;color:var(--signal);line-height:1">'+inChantier+'</div><div style="font-family:var(--f-mono);font-size:9.5px;color:var(--faible);text-transform:uppercase;letter-spacing:0.1em;margin-top:6px">Chantiers actifs</div></div>';
  h += '<div style="padding:14px;background:var(--surface-2);border:1px solid var(--filet);border-radius:10px;text-align:center"><div style="font-family:var(--f-mono);font-size:26px;color:var(--attenue);line-height:1">'+(clients.filter(cl=>cl.stage && cl.stage.startsWith('6')).length)+'</div><div style="font-family:var(--f-mono);font-size:9.5px;color:var(--faible);text-transform:uppercase;letter-spacing:0.1em;margin-top:6px">SAV / Garanties</div></div>';
  h += '</div></div>';

  h += '</div>';

  // Note utilisateur
  h += '<div class="card"><div style="display:flex;gap:14px;align-items:flex-start"><div style="font-size:16px;color:var(--signal)">✦</div><div><div style="font-weight:600;margin-bottom:4px">À propos de ces statistiques</div><div style="font-size:12.5px;color:var(--mute);line-height:1.55">Les KPIs sont calculés en temps réel depuis vos clients, équipe et tâches. Les chantiers actifs incluent toutes les phases en cours sauf Réception et SAV. Le taux de conversion compte les clients ayant atteint Réception ou SAV par rapport au total.</div></div></div></div>';

  c.insertAdjacentHTML('beforeend', h); /* démo : ne pas écraser les cartes RDV / origine ajoutées en tête */
}

/* ═══════════════════════════════════════════════════════
   VIEW : TEAM
   ═══════════════════════════════════════════════════════ */
function renderTeam(c){
  const card=document.createElement('div');card.className='card';
  card.innerHTML='<div class="card-h"><div><div class="card-title">Équipe</div><div class="card-sub">Membres avec leur rôle et leur charge actuelle</div></div><button class="btn primary sm" onclick="openTeamModal()">+ Membre</button></div>';
  let h='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Membre</th><th>Rôle</th><th>Email</th><th class="num">Charge</th><th></th></tr></thead><tbody>';
  S.team.forEach(u=>{
    const myClients=S.clients.filter(cl=>!cl.archived&&(cl.assignedCommercial===u.id||cl.assignedConducteur===u.id||cl.assignedChef===u.id||cl.assignedSAV===u.id||cl.assignedSecretaire===u.id)).length;
    const role=ROLES.find(r=>r.id===u.role)||{label:u.role,color:'#6F7A8E'};
    h+='<tr><td><div style="display:flex;align-items:center;gap:10px"><div class="av" style="width:30px;height:30px;font-size:10.5px;border-radius:50%;background:var(--av-bg);color:var(--av-fg);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono)">'+escapeHtml(u.avatar||initials(u.name))+'</div><div style="font-weight:600">'+escapeHtml(u.name)+'</div></div></td><td><span class="badge" style="background:'+role.color+'22;color:'+role.color+'">'+escapeHtml(role.label)+'</span></td><td style="font-size:12px;color:var(--text2)">'+escapeHtml(u.email||'')+'</td><td class="num">'+myClients+' client(s)</td><td><button class="btn ghost xs" onclick="deleteTeammate(\''+u.id+'\')" aria-label="Supprimer le membre">✕</button></td></tr>';
  });
  h+='</tbody></table></div>';
  card.innerHTML+=h;
  c.appendChild(card);
}

/* ═══════════════════════════════════════════════════════
   VIEW : SETTINGS
   ═══════════════════════════════════════════════════════ */
/* ═══ Éditeur d'étapes du suivi — fonctions ═══════════════════════════
   Toutes les mutations passent par S.pipeline (= PIPELINE), saveLocal()
   après chaque modif, puis renderSettings est rerenderé via setView/render.
   Les garde-fous (clients sur étape, etc.) bloquent les pertes de données. */
function _countClientsOnSubstage(subId){
  return (S.clients||[]).filter(c => !c.archived && c.stage === subId).length;
}
function _countClientsOnPhase(phaseId){
  const ph = PIPELINE.find(p => p.id === phaseId);
  if(!ph) return 0;
  const ids = new Set(ph.substages.map(s=>s.id));
  return (S.clients||[]).filter(c => !c.archived && ids.has(c.stage)).length;
}
function _persistPipeline(){
  try{ saveLocal(); }catch(_){}
  /* Re-render vue courante. Le pipeline éditeur est dans Settings, on rerender Settings. */
  try{ render(); }catch(_){}
}
window.pp_renamePhase = function(phaseId, val){
  const p = PIPELINE.find(x=>x.id===phaseId); if(!p) return;
  p.name = String(val||'').trim() || p.name;
  _persistPipeline();
};
window.pp_setPhaseRole = function(phaseId, val){
  const p = PIPELINE.find(x=>x.id===phaseId); if(!p) return;
  p.role = String(val||'').trim();
  _persistPipeline();
};
window.pp_setPhaseColor = function(phaseId, val){
  const p = PIPELINE.find(x=>x.id===phaseId); if(!p) return;
  if(/^#[0-9a-fA-F]{6}$/.test(val)) p.color = val;
  _persistPipeline();
};
window.pp_setPhaseIcon = function(phaseId, val){
  const p = PIPELINE.find(x=>x.id===phaseId); if(!p) return;
  p.icon = String(val||'').trim() || 'flag';
  _persistPipeline();
};
window.pp_movePhase = function(phaseId, delta){
  const i = PIPELINE.findIndex(x=>x.id===phaseId); if(i<0) return;
  const j = i + delta;
  if(j<0 || j>=PIPELINE.length) return;
  const [item] = PIPELINE.splice(i,1);
  PIPELINE.splice(j,0,item);
  _persistPipeline();
};
window.pp_removePhase = function(phaseId){
  if(PIPELINE.length<=1){ alert('Vous devez garder au moins une phase.'); return; }
  const used = _countClientsOnPhase(phaseId);
  if(used>0){
    if(!confirm(used+' client(s) sont actuellement sur cette phase. Les supprimer la perdra leur étape. Continuer ?')) return;
  }
  const i = PIPELINE.findIndex(x=>x.id===phaseId); if(i<0) return;
  PIPELINE.splice(i,1);
  _persistPipeline();
};
window.pp_addPhase = function(){
  const id = _newId('ph');
  PIPELINE.push({id, name:'Nouvelle phase', role:'', color:PIPELINE_COLORS[PIPELINE.length % PIPELINE_COLORS.length], icon:'flag', substages:[{id:_newId('sub'), name:'Étape'}]});
  _persistPipeline();
};
window.pp_renameSubstage = function(subId, val){
  for(const p of PIPELINE){
    const s = p.substages.find(x=>x.id===subId);
    if(s){ s.name = String(val||'').trim() || s.name; _persistPipeline(); return; }
  }
};
window.pp_moveSubstage = function(subId, delta){
  for(const p of PIPELINE){
    const i = p.substages.findIndex(x=>x.id===subId);
    if(i>=0){
      const j = i + delta;
      if(j<0 || j>=p.substages.length) return;
      const [item] = p.substages.splice(i,1);
      p.substages.splice(j,0,item);
      _persistPipeline();
      return;
    }
  }
};
window.pp_removeSubstage = function(subId){
  const used = _countClientsOnSubstage(subId);
  if(used>0){
    if(!confirm(used+' client(s) sont actuellement sur cette étape. Continuer ?')) return;
  }
  for(const p of PIPELINE){
    const i = p.substages.findIndex(x=>x.id===subId);
    if(i>=0){
      if(p.substages.length<=1){ alert('Une phase doit avoir au moins une étape.'); return; }
      p.substages.splice(i,1);
      _persistPipeline();
      return;
    }
  }
};
window.pp_addSubstage = function(phaseId){
  const p = PIPELINE.find(x=>x.id===phaseId); if(!p) return;
  p.substages.push({id:_newId('sub'), name:'Nouvelle étape'});
  _persistPipeline();
};
window.pp_resetPipeline = function(){
  if(!confirm('Restaurer les étapes par défaut (modèle bâtiment) ? Toutes vos personnalisations seront perdues. Les clients déjà placés sur une étape personnalisée garderont leur identifiant mais ne seront plus reliés à une étape valide.')) return;
  S.pipeline = JSON.parse(JSON.stringify(PIPELINE_DEFAULTS));
  PIPELINE = S.pipeline;
  try{ window.PIPELINE = PIPELINE; }catch(_){}
  _persistPipeline();
};

const ABANDON_RAISONS=['Financement','Terrains','Concurrence','Ancien','Divers'];
const STATUT_META={abandonne:{lbl:'Abandonné',col:'#B0655C'},signe:{lbl:'Signé',col:'#23906A'},archive:{lbl:'Archivé',col:'#6F7A8E'}};
function statutBadgeHtml(cl){
  const m=STATUT_META[cl.statut];if(!m)return '';
  let extra='';
  if(cl.statut==='abandonne'&&cl.abandonRaison)extra=' · '+cl.abandonRaison;

  if(cl.statut==='archive'&&cl.archiveDate)extra=' · '+fmtDate(cl.archiveDate);

function fmtDate(d){try{return new Date(d).toLocaleDateString('fr-FR');}catch(e){return d||'';}}
function rdvCardHtml(cl){

    '<button class="btn sm" style="width:100%;margin-top:10px" onclick="addRdv(\''+cl.id+'\')">+ Ajouter un RDV (R'+((rdvs[rdvs.length-1]?.n||0)+1)+')</button></div>';
}
function addRdv(cid){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  cl.rdvs=cl.rdvs||[];
  const n=(cl.rdvs.length?Math.max(...cl.rdvs.map(r=>r.n)):0)+1;
  cl.rdvs.push({n:n,date:new Date().toISOString().slice(0,10),at:new Date().toISOString()});
  (cl.history=cl.history||[]).push({type:'note',at:new Date().toISOString(),by:'me',body:'RDV R'+n+' planifié'});
  cl.lastUpdated=new Date().toISOString();saveLocal();render();
}
function setRdvDate(cid,n,v){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  const r=(cl.rdvs||[]).find(x=>x.n===n);if(r){r.date=v;cl.lastUpdated=new Date().toISOString();saveLocal();}
}
function delRdv(cid,n){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  cl.rdvs=(cl.rdvs||[]).filter(x=>x.n!==n);saveLocal();render();
}

/* ═══════════════════════════════════════════════════════
   STATS : RDV PAR PÉRIODE (+ comparaison) & ORIGINE DES CONTACTS
   ═══════════════════════════════════════════════════════ */
function _rdvInPeriod(d1,d2){
  let tot=0;const parN={};
  S.clients.forEach(cl=>(cl.rdvs||[]).forEach(r=>{
    if(!r.date)return;
    if(d1&&r.date<d1)return;if(d2&&r.date>d2)return;
    tot++;parN['R'+r.n]=(parN['R'+r.n]||0)+1;
  }));
  return {tot,parN};
}
function setStatsRdvField(k,v){S.statsRdv=S.statsRdv||{};S.statsRdv[k]=v;saveLocal();render();}
function renderStatsRdvOrigine(c){
  const sr=S.statsRdv||{};
  const today=new Date();const m0=new Date(today.getFullYear(),today.getMonth(),1).toISOString().slice(0,10);
  const a1=sr.a1||m0,a2=sr.a2||today.toISOString().slice(0,10);
  const A=_rdvInPeriod(a1,a2);
  const hasB=sr.b1&&sr.b2;const B=hasB?_rdvInPeriod(sr.b1,sr.b2):null;
  const dateInp=(k,v)=>'<input type="date" value="'+(v||'')+'" onchange="setStatsRdvField(\''+k+'\',this.value)" style="border:1px solid var(--paper);border-radius:6px;padding:5px 7px;font-size:12px"/>';
  const card=document.createElement('div');card.className='card';
  let h='<div class="card-h"><div><div class="card-title">Rendez-vous par période</div><div class="card-sub">Sélectionne une période, et compare avec une autre si besoin</div></div></div>';
  h+='<div style="display:flex;gap:18px;flex-wrap:wrap">';
  h+='<div style="flex:1;min-width:260px"><div class="fl">Période A</div>'+
     '<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px">'+dateInp('a1',a1)+' → '+dateInp('a2',a2)+'</div>'+
     '<div style="font-family:var(--f-mono);font-size:26px">'+A.tot+' <span style="font-size:12px;color:var(--faible)">RDV</span></div>'+
     '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">'+Object.keys(A.parN).sort().map(k=>'<span class="badge b-signal">'+k+' : '+A.parN[k]+'</span>').join('')+'</div></div>';
  h+='<div style="flex:1;min-width:260px"><div class="fl">Période B (comparaison)</div>'+
     '<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px">'+dateInp('b1',sr.b1)+' → '+dateInp('b2',sr.b2)+'</div>'+
     (B?('<div style="font-family:var(--f-mono);font-size:26px">'+B.tot+' <span style="font-size:12px;color:var(--faible)">RDV</span></div>'+
        '<div style="margin-top:6px;font-size:13px;font-weight:700;color:'+(A.tot>=B.tot?'var(--ok)':'var(--retard)')+'">'+(A.tot>=B.tot?'▲ +':'▼ ')+(A.tot-B.tot)+' RDV ('+(B.tot?Math.round((A.tot-B.tot)/B.tot*100):'∞')+'%) en période A vs B</div>')
       :'<div style="font-size:12px;color:var(--stone)">Renseigne les 2 dates pour comparer.</div>')+'</div>';
  h+='</div>';
  card.innerHTML=h;c.appendChild(card);

  /* Origine des contacts — signés ou pas */
  const srcMap={};
  S.clients.forEach(cl=>{
    const src=cl.source||'Non renseigné';
    srcMap[src]=srcMap[src]||{tot:0,signes:0};
    srcMap[src].tot++;if(cl.statut==='signe'||cl.statut==='archive')srcMap[src].signes++;
  });
  const rows=Object.keys(srcMap).sort((a,b)=>srcMap[b].tot-srcMap[a].tot);
  const card2=document.createElement('div');card2.className='card';
  let h2='<div class="card-h"><div><div class="card-title">Origine des contacts</div><div class="card-sub">Tous les clients, signés ou pas — d\'où viennent-ils ?</div></div></div>';

  rows.forEach(srcK=>{
    const o=srcMap[srcK];const taux=o.tot?Math.round(o.signes/o.tot*100):0;
    h2+='<tr><td style="font-weight:500">'+escapeHtml(srcK)+'</td><td class="num">'+o.tot+'</td><td class="num" style="color:var(--ok)">'+o.signes+'</td><td class="num">'+(o.tot-o.signes)+'</td>'+
        '<td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;max-width:120px;height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden"><div style="width:'+taux+'%;height:100%;background:var(--signal)"></div></div><span style="font-family:var(--f-mono);font-size:12px">'+taux+'%</span></div></td></tr>';
  });
  h2+='</tbody></table></div>';
  card2.innerHTML=h2;c.appendChild(card2);
}

function adminClients(){return S.clients.filter(cl=>(cl.statut||'actif')!=='abandonne');}

function adminSet(cid,key,val){

function setFonds(cid,i,key,val){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  const a=adminGet(cl);if(!a.appels||!a.appels[i])return;
  a.appels[i][key]=val;cl.lastUpdated=new Date().toISOString();saveLocal();
  if(key==='pct'||key==='paye')render();
}
function addFondsRow(cid){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  const a=adminGet(cl);a.appels=a.appels||[];
  a.appels.push({libelle:'Nouvelle étape',pct:0,date:'',paye:false});saveLocal();render();
}
function delFondsRow(cid,i){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  const a=adminGet(cl);a.appels.splice(i,1);saveLocal();render();
}

function saveClient(id){
  const data={
    nom:document.getElementById('m-nom').value.trim(),
    prenom:document.getElementById('m-prenom').value.trim(),
    raisonSociale:document.getElementById('m-rs').value.trim(),
    email:document.getElementById('m-email').value.trim(),
    tel:document.getElementById('m-tel').value.trim(),
    localisation:document.getElementById('m-loc').value.trim(),
    adresse:document.getElementById('m-adr').value.trim(),
    typeProjet:document.getElementById('m-type').value.trim(),
    budgetEstime:parseFloat(document.getElementById('m-budget').value)||0,
    source:document.getElementById('m-source').value,
    secteurRecherche:document.getElementById('m-secteur').value.trim(),
    commentaire:document.getElementById('m-comm').value.trim()
  };
  if(!data.nom&&!data.raisonSociale){toast('Nom ou raison sociale requis','err');return;}
  const now=new Date().toISOString();
  if(id){
    const cl=S.clients.find(x=>x.id===id);if(!cl)return;
    Object.assign(cl,data,{lastUpdated:now});
  } else {
    S.clients.push({
      id:uid(),...data,
      stage:'1.2',createdAt:now,lastUpdated:now,
      history:[{type:'create',at:now,by:'me',note:'Fiche client créée'}],
      notes:[],tasks:[],documents:[],communications:[],
      sav:{tickets:[],garanties:null}
    });
  }
  saveAll();closeModal();render();toast(id?'Client modifié':'Client créé');
}

/* Stage update */
function updateStage(cid,newStage){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  if(cl.stage===newStage)return;
  const oldStage=cl.stage;
  const now=new Date().toISOString();
  cl.history=cl.history||[];
  cl.history.push({type:'stage',from:oldStage,to:newStage,at:now,by:'me',note:'Étape mise à jour'});
  cl.stage=newStage;cl.lastUpdated=now;
  /* Démarre auto les garanties à la signature PV (5.3) */
  if(newStage==='5.3'&&!(cl.sav?.garanties?.start)){
    cl.sav=cl.sav||{tickets:[]};cl.sav.garanties={start:now};
    toast('Garanties GPA / biennale / décennale démarrées automatiquement');
  }
  saveAll();render();
}

function openTransferModal(cid){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  const cur=cl.stage;
  const ph=getPhase(cur);
  const idx=ph.substages.findIndex(s=>s.id===cur);
  const next=idx<ph.substages.length-1?ph.substages[idx+1]:(PIPELINE[parseInt(ph.id)]?PIPELINE[parseInt(ph.id)].substages[0]:null);
  if(!next){toast('Déjà à la dernière étape');return;}
  showModal({
    title:'Faire avancer le client',
    body:'<div style="margin-bottom:14px"><div class="fl">Étape suivante</div><div style="font-size:17px;font-weight:600;color:var(--signal)"><span style="font-family:var(--f-mono)">'+next.id+'</span> · '+escapeHtml(next.name)+'</div></div><div><label class="fl">Note de passation (optionnelle)</label><textarea id="t-note" placeholder="Ex : Client veut bois et carrelage gris, RDV terrain mardi 14h…"></textarea></div>',
    actions:'<button class="btn" onclick="closeModal()">Annuler</button><button class="btn gold" onclick="confirmTransfer(\''+cid+'\',\''+next.id+'\')">→ Faire avancer</button>'
  });
}

function confirmTransfer(cid,newStage){
  const cl=S.clients.find(x=>x.id===cid);if(!cl)return;
  const note=document.getElementById('t-note').value.trim();
  const now=new Date().toISOString();
  cl.history=cl.history||[];
  cl.history.push({type:'stage',from:cl.stage,to:newStage,at:now,by:'me',note:note||'Transfert manuel'});
  cl.stage=newStage;cl.lastUpdated=now;
  if(newStage==='5.3'&&!(cl.sav?.garanties?.start)){cl.sav=cl.sav||{tickets:[]};cl.sav.garanties={start:now};}
  saveAll();closeModal();render();toast('Client transféré à l\'étape '+newStage);
}

function importJson(ev){
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(d&&typeof d==='object'&&Array.isArray(d.clients)){
        S=Object.assign(S,d);
        if(!Array.isArray(S.team))S.team=[];
        if(!Array.isArray(S.templates))S.templates=[];
        saveAll();render();toast('Import réussi');
      }else{
        toast('Fichier invalide : structure attendue manquante','err');
      }
    }catch(e){toast('Fichier invalide','err');}
  };
  r.onerror=()=>toast('Lecture du fichier échouée','err');
  try{r.readAsText(f);}catch(e){toast('Lecture du fichier échouée','err');}
}
function resetData(){
  if(!confirm('Tout effacer ? Cette action est irréversible.'))return;
  S.clients=[];S.templates=[];S.team=[];saveAll();render();toast('Données réinitialisées');
}

<script id="oniq-user-info-listener">
/* ═══ User-card auto-fill via postMessage parent ONIQ ═══
   Le parent envoie {type:'oniq-user-info', user:{company, avatar, role, isAdmin, isCommercial}}
   L'app met à jour #user-av / #user-name / #user-role */
(function(){
  function applyUser(u){
    if(!u)return;
    var av=document.getElementById('user-av');
    var nm=document.getElementById('user-name');
    var rl=document.getElementById('user-role');
    var name=(u.company||u.name||'Mon entreprise').toString();
    var initials=u.avatar||name.split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase()||'??';
    var role=u.isAdmin?'Admin':u.isCommercial?'Commercial':(u.role==='client'?'Client':(u.role||'Gérant'));
    if(av){
      if(u.companyLogo){
        av.innerHTML='<img src="'+u.companyLogo+'" alt="'+name.replace(/"/g,'')+'" style="width:100%;height:100%;object-fit:contain;display:block"/>';
        av.style.background='var(--surface-2)';
        av.style.padding='3px';
        av.style.boxSizing='border-box';
        av.style.overflow='hidden';
      } else {
        av.textContent=initials;
        av.style.background='';av.style.padding='';
      }
    }
    if(nm)nm.textContent=name;
    if(rl)rl.textContent=role.toUpperCase();
  }
  /* Demande au parent dès l'ouverture */
  try{__demoPost({type:'oniq-user-info-request'},'*');}catch(e){}
  /* Écoute les réponses */
  window.addEventListener('message',function(evt){
    try{
      if(!evt||!evt.data||typeof evt.data!=='object'||!evt.data.type)return;
      if(evt.data.type==='oniq-user-info'&&evt.data.user&&typeof evt.data.user==='object')applyUser(evt.data.user);
    }catch(e){}
  });
  /* Expose pour test manuel */
  try{window.applyOniqUserInfo=applyUser;}catch(e){}
})();

</script>

<!-- Couches CSS d'origine remplacées par la feuille « oniq-demo-charte » (en-tête). -->
<!-- ═══════════════════════════════════════════════════════════════════
