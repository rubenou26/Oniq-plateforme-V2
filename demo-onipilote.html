<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>ONIQ. OniPilote — démo</title>
<script>
/* Thème : clé du CRM (oq-theme, même origine), sinon préférence système. */
(function(){var t=null;try{t=localStorage.getItem('oq-theme');}catch(e){}
if(t!=='dark'&&t!=='light'){try{t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}catch(e){t='dark';}}
document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style id="oniq-demo-charte">
/* ═══════════════════════════════════════════════════════════════════
   ONIQ. OniPilote — démo
   Charte ONIQ : fond bleu-noir (ou clair), filets d'un pixel,
   monochrome sauf pour le sens, un seul accent (--signal).
   Instrument Sans pour le texte, JetBrains Mono pour les chiffres,
   les références et les étiquettes en capitales.
   ═══════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── Tokens : sombre par défaut ── */
:root{
  --fond:#08090C; --surface:#0E1116; --surface-2:#141922; --survol:#171D26;
  --filet:#1B212B; --filet-fort:#2A3341;
  --texte:#EAEDF2; --attenue:#8B94A5; --faible:#59616F;
  --signal:#7FA8FF; --signal-r:127,168,255;
  --ok:#5FD3A6; --ok-r:95,211,166;
  --attente:#E0B15C; --attente-r:224,177,92;
  --retard:#E8796B; --retard-r:232,121,107;
  --voile:rgba(0,0,0,.62);
  --ombre-modale:0 24px 60px -24px rgba(0,0,0,.7);
  --demo-h:32px;
  --side-w:240px;
  --f-texte:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --fond:#F7F8FA; --surface:#FFFFFF; --surface-2:#F1F3F6; --survol:#EDF0F4;
  --filet:#E3E7ED; --filet-fort:#CFD5DE;
  --texte:#0B0E13; --attenue:#586274; --faible:#8B94A5;
  --signal:#2B5FD9; --signal-r:43,95,217;
  --ok:#17805C; --ok-r:23,128,92;
  --attente:#96701C; --attente-r:150,112,28;
  --retard:#B5443A; --retard-r:181,68,58;
  --voile:rgba(11,14,19,.38);
  --ombre-modale:0 24px 60px -28px rgba(11,14,19,.35);
  color-scheme:light;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme]){
    --fond:#F7F8FA; --surface:#FFFFFF; --surface-2:#F1F3F6; --survol:#EDF0F4;
    --filet:#E3E7ED; --filet-fort:#CFD5DE;
    --texte:#0B0E13; --attenue:#586274; --faible:#8B94A5;
    --signal:#2B5FD9; --signal-r:43,95,217;
    --ok:#17805C; --ok-r:23,128,92;
    --attente:#96701C; --attente-r:150,112,28;
    --retard:#B5443A; --retard-r:181,68,58;
    --voile:rgba(11,14,19,.38);
    color-scheme:light;
  }
}

/* ── Anciens noms de variables → alias des tokens ONIQ
      (le JavaScript d'origine fabrique du HTML avec ces noms) ── */
:root,:root[data-theme="light"]{
  --bg:var(--fond); --bg2:var(--fond); --surf:var(--surface); --surf2:var(--surface-2);
  --linen:var(--filet); --linen2:var(--filet-fort); --paper:var(--surface-2);
  --gold:var(--signal); --goldD:var(--signal); --goldL:var(--signal);
  --goldDim:rgba(var(--signal-r),.12); --goldB:rgba(var(--signal-r),.35);
  --ink:var(--texte); --ink2:var(--texte); --text:var(--texte); --text2:var(--attenue);
  --stone:var(--faible); --sand:var(--faible); --mute:var(--attenue);
  --green:var(--ok); --greenL:rgba(var(--ok-r),.12);
  --red:var(--retard); --redL:rgba(var(--retard-r),.12);
  --blue:var(--signal); --blueL:rgba(var(--signal-r),.12);
  --warn:var(--attente); --warnL:rgba(var(--attente-r),.12);
  --av-bg:rgba(var(--signal-r),.14); --av-fg:var(--signal);
  --SF:var(--f-texte); --SS:var(--f-texte);
  --sh1:none; --sh2:none; --sh3:none; --sh4:var(--ombre-modale); --sh5:var(--ombre-modale);
  --ease:cubic-bezier(.22,.8,.22,1); --easeOut:cubic-bezier(.16,.84,.34,1);
}

html,body{margin:0;padding:0}
html{background:var(--fond)}
body{font-family:var(--f-texte);background:var(--fond);color:var(--texte);min-height:100vh;
  font-size:14px;line-height:1.55;letter-spacing:-.004em;-webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;padding-top:var(--demo-h)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-texte);font-weight:600;letter-spacing:-.02em;color:var(--texte);line-height:1.2}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
a{color:var(--signal)}
.num,.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
::selection{background:rgba(var(--signal-r),.28);color:var(--texte)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--filet-fort);border-radius:4px}

/* ═════════ Bandeau démo ═════════ */
.demo-bar{position:fixed;top:0;left:0;right:0;height:var(--demo-h);z-index:400;
  display:flex;align-items:center;gap:14px;padding:0 14px;
  background:var(--surface);border-bottom:1px solid var(--filet);font-size:12px;color:var(--attenue)}
.demo-bar .demo-tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--texte);white-space:nowrap}
.demo-bar .demo-tag i{width:6px;height:6px;border-radius:50%;background:var(--attente);display:inline-block}
.demo-bar .demo-ent{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.demo-bar .demo-sp{flex:1}
.demo-bar button{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:6px;
  background:transparent;border:1px solid var(--filet);color:var(--attenue);cursor:pointer;font-size:11.5px;white-space:nowrap}
.demo-bar button:hover{color:var(--texte);border-color:var(--filet-fort);background:var(--survol)}
.demo-bar button svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.demo-bar .demo-burger{display:none}
.demo-bar .lbl{display:inline}
.demo-bar .i-lune{display:none}
:root[data-theme="light"] .demo-bar .i-lune{display:block}
:root[data-theme="light"] .demo-bar .i-soleil{display:none}

/* ═════════ Structure ═════════ */
.hdr{display:none !important}
.app{min-height:calc(100vh - var(--demo-h))}
.app-body{display:block;min-height:calc(100vh - var(--demo-h))}
.main{margin-left:var(--side-w);min-width:0;display:flex;flex-direction:column;min-height:calc(100vh - var(--demo-h))}

/* ═════════ Rail latéral ═════════ */
.side{position:fixed;top:var(--demo-h);left:0;bottom:0;width:var(--side-w);z-index:60;
  display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--filet);overflow:visible}
.side-brand{padding:18px 18px 15px;border-bottom:1px solid var(--filet);flex:none}
.side-brand .mot{font-size:15.5px;font-weight:700;letter-spacing:-.03em;color:var(--texte);white-space:nowrap}
.side-brand .mot b{color:var(--signal);font-weight:700}
.side-brand .mot span{color:var(--attenue);font-weight:600;margin-left:4px}
.side-brand .sous{margin-top:6px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faible)}
.side-nav{flex:1;overflow-y:auto;padding:6px 12px 14px;display:flex;flex-direction:column;gap:2px}
.nav-section{display:flex;align-items:center;gap:9px;padding:16px 8px 7px;font-family:var(--f-mono);
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faible)}
.nav-section::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--filet),transparent)}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:8px 11px;border-radius:10px;
  background:transparent;border:1px solid transparent;color:var(--attenue);font-size:13.5px;text-align:left;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s}
.nav-item .ico{width:17px;display:inline-flex;justify-content:center;opacity:.65;flex:none}
.nav-item:hover{background:var(--survol);color:var(--texte)}
.nav-item:hover .ico{opacity:1}
.nav-item.active{color:var(--texte);font-weight:500;border-color:rgba(var(--signal-r),.22);
  background:linear-gradient(90deg,rgba(var(--signal-r),.15),rgba(var(--signal-r),.04))}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--signal)}
.nav-item.active .ico{opacity:1;color:var(--signal)}
.side-actions{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--filet);flex:none}
.side-action{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:9px;
  background:transparent;border:1px solid var(--filet);color:var(--attenue);cursor:pointer;
  font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.side-action:hover{color:var(--texte);border-color:var(--filet-fort);background:var(--survol)}
.side-action-lbl{line-height:1}
.side-foot{padding:10px 12px 14px;flex:none}
.user-card{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--surface-2);border:1px solid var(--filet);border-radius:11px;min-width:0}
.user-card #user-name{color:var(--texte) !important;font-family:var(--f-texte) !important}
.user-card #user-role{color:var(--faible) !important;font-family:var(--f-mono) !important;font-weight:500 !important}
.avatar{width:32px;height:32px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--av-bg);color:var(--av-fg);font-family:var(--f-mono);font-weight:500;font-size:11.5px;overflow:hidden}

/* Export */
.export-menu{position:relative}
.export-dropdown{position:absolute;bottom:calc(100% + 8px);left:0;min-width:270px;display:none;z-index:500;
  background:var(--surface);border:1px solid var(--filet-fort);border-radius:12px;overflow:hidden;box-shadow:var(--ombre-modale)}
.export-section-hdr{padding:10px 14px 7px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faible);border-bottom:1px solid var(--filet)}
.export-section-hdr+.export-item{border-top:0}
.export-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 14px;background:transparent;border:0;border-top:1px solid var(--filet);text-align:left;cursor:pointer;color:var(--texte)}
.export-item:hover{background:var(--survol)}
.export-item .tag{width:40px;flex:none;text-align:center;padding:4px 0;border-radius:6px;border:1px solid var(--filet-fort);
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;color:var(--attenue)}
.export-item .t{display:block;font-size:13px;font-weight:500}
.export-item .s{display:block;font-size:11.5px;color:var(--faible);margin-top:1px}

/* ═════════ Barre de titre ═════════ */
.subbar{position:sticky;top:var(--demo-h);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;
  min-height:64px;padding:10px 28px;background:color-mix(in srgb,var(--fond) 86%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--filet)}
.subbar-title{display:flex;flex-direction:column;gap:2px;min-width:0}
.subbar-h{font-size:17px;font-weight:600;letter-spacing:-.02em;color:var(--texte);line-height:1.2}
.subbar-sub{font-size:12.5px;color:var(--faible)}
.subbar-tools{display:flex;align-items:center;gap:12px;flex:none}
.subbar-search{position:relative;width:280px;max-width:34vw}
.subbar-search svg{color:var(--faible) !important}
.subbar-search input{width:100%;padding:8px 12px 8px 33px;background:var(--surface);border:1px solid var(--filet);border-radius:8px;font-size:13px;color:var(--texte)}
.subbar-search input:focus{outline:none;border-color:var(--signal);background:var(--surface-2)}
.subbar-search input::placeholder{color:var(--faible)}
.hdr-sync{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faible);white-space:nowrap}
.hdr-sync-dot{width:6px;height:6px;border-radius:50%;background:var(--faible)}
.hdr-sync.saving{color:var(--attente)} .hdr-sync.saving .hdr-sync-dot{background:var(--attente)}
.hdr-sync.saved{color:var(--ok)} .hdr-sync.saved .hdr-sync-dot{background:var(--ok)}

.content{flex:1;width:100%;max-width:1480px;margin:0 auto;padding:24px 28px 56px;display:flex;flex-direction:column;gap:18px}

/* ═════════ Boutons ═════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:8px;
  background:var(--surface);border:1px solid var(--filet-fort);color:var(--texte);cursor:pointer;
  font-size:13px;font-weight:500;line-height:1.3;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover{background:var(--survol);border-color:var(--filet-fort)}
.btn.primary,.btn.gold{background:var(--texte);color:var(--fond);border-color:var(--texte);font-weight:600}
.btn.primary:hover,.btn.gold:hover{background:var(--texte);opacity:.88}
.btn.ghost{background:transparent;border-color:var(--filet);color:var(--attenue)}
.btn.ghost:hover{color:var(--texte);border-color:var(--filet-fort);background:var(--survol)}
.btn.danger{color:var(--retard);border-color:rgba(var(--retard-r),.4);background:transparent}
.btn.danger:hover{background:rgba(var(--retard-r),.1)}
.btn.danger-plein{background:var(--retard);border-color:var(--retard);color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.xs{padding:3px 8px;font-size:11.5px;border-radius:6px;gap:5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ═════════ Champs ═════════ */
.fi,input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--filet);border-radius:8px;
  background:var(--surface-2);color:var(--texte);font-size:13.5px;transition:border-color .15s}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--signal)}
input[type=color]{padding:2px;background:var(--surface-2) !important}
input[type=date]{font-family:var(--f-mono);font-size:12.5px}
input::placeholder,textarea::placeholder{color:var(--faible)}
.fi:hover,input:hover,select:hover,textarea:hover{border-color:var(--filet-fort)}
.fi:focus,input:focus,select:focus,textarea:focus{outline:none;border-color:var(--signal)}
textarea{resize:vertical;min-height:84px;line-height:1.55}
.fl{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faible);margin-bottom:6px;font-weight:400}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
/* Les champs posés en ligne dans les tableaux et fiches (styles inline d'origine) */
.content input,.content select{border-color:var(--filet) !important;background:var(--surface-2) !important;color:var(--texte) !important}
.content input:focus,.content select:focus{border-color:var(--signal) !important}

/* ═════════ Cartes ═════════ */
.card{position:relative;background:var(--surface);border:1px solid var(--filet);border-radius:12px;padding:20px 22px}
.card .card{background:var(--surface);border-color:var(--filet)}
.card.glass{background:var(--surface)}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.card-title{font-size:15.5px;font-weight:600;letter-spacing:-.015em;color:var(--texte);line-height:1.3}
.card-sub{font-size:12.5px;color:var(--faible);margin-top:3px;line-height:1.5}
.rule{height:1px;background:var(--filet);margin:14px 0;border:0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--filet);border-radius:12px;padding:16px 18px}
.kpi.accent{border-color:rgba(var(--signal-r),.38)}
.kpi-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kpi-label{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faible)}
.kpi.accent .kpi-label{color:var(--signal)}
.kpi-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;border:1px solid var(--filet);color:var(--attenue)}
.kpi-val{font-family:var(--f-mono);font-size:26px;font-weight:500;letter-spacing:-.03em;color:var(--texte);line-height:1.05;font-variant-numeric:tabular-nums}
.kpi-trend{font-size:12px;color:var(--attenue);margin-top:8px}
.kpi-trend.up{color:var(--ok)} .kpi-trend.down{color:var(--retard)}

/* Pastilles de stat, puces de filtre */
.statpill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;background:var(--surface-2);border:1px solid var(--filet);
  font-family:var(--f-mono);font-size:12px;color:var(--texte);white-space:nowrap}
.statpill .lbl{color:var(--faible);font-family:var(--f-texte);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;padding:6px 12px;border-radius:20px;background:transparent;border:1px solid var(--filet);
  color:var(--attenue);font-size:12.5px;cursor:pointer;transition:all .15s}
.chip:hover{color:var(--texte);border-color:var(--filet-fort)}
.chip.active{background:var(--texte);color:var(--fond);border-color:var(--texte);font-weight:500}
.actionbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ctx-note{padding:10px 14px;border:1px solid rgba(var(--signal-r),.3);background:rgba(var(--signal-r),.06);border-radius:10px;
  font-size:12.5px;color:var(--attenue);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctx-note strong{color:var(--texte)} .ctx-note .ph{color:var(--signal)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;border:1px solid transparent;
  font-size:11px;font-weight:500;letter-spacing:.02em;white-space:nowrap;line-height:1.5}
.badge.b-gold{color:var(--signal);border-color:rgba(var(--signal-r),.35);background:rgba(var(--signal-r),.1);font-family:var(--f-mono);font-size:10px;letter-spacing:.08em}
.badge.b-green{color:var(--ok);border-color:rgba(var(--ok-r),.4);background:rgba(var(--ok-r),.1)}
.badge.b-red{color:var(--retard);border-color:rgba(var(--retard-r),.4);background:rgba(var(--retard-r),.1)}
.badge.b-blue{color:var(--attente);border-color:rgba(var(--attente-r),.4);background:rgba(var(--attente-r),.1)}
.badge.b-stone{color:var(--attenue);border-color:var(--filet);background:var(--surface-2)}
.badge.b-signal{color:var(--signal);border-color:rgba(var(--signal-r),.35);background:rgba(var(--signal-r),.1);font-family:var(--f-mono)}

/* ═════════ Tableaux ═════════ */
.tbl-wrap{background:var(--surface);border:1px solid var(--filet);border-radius:12px;overflow:auto}
.card .tbl-wrap{border-radius:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:10px 16px;text-align:left;font-family:var(--f-mono);font-size:11px;font-weight:400;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faible);border-bottom:1px solid var(--filet);white-space:nowrap;background:var(--surface)}
.tbl td{padding:11px 16px;border-bottom:1px solid var(--filet);color:var(--texte);vertical-align:middle}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr[onclick]{cursor:pointer}
.tbl tbody tr:hover{background:var(--survol)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl th.num,.tbl td.num{text-align:right;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ═════════ Pipeline Kanban ═════════ */
.pipeline{display:grid;grid-template-columns:repeat(6,minmax(236px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--filet);border-radius:12px;display:flex;flex-direction:column;min-height:560px;min-width:0}
.col-h{padding:12px 14px;border-bottom:1px solid var(--filet);display:flex;justify-content:space-between;align-items:center;gap:8px}
.col-h-l{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.col-num{width:22px;height:22px;flex:none;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-mono);font-size:11px;color:var(--attenue);border:1px solid var(--filet-fort);background:var(--surface)}
.col-title{font-size:13.5px;font-weight:600;color:var(--texte);line-height:1.2}
.col-meta{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faible);margin-top:2px}
.col-count{font-family:var(--f-mono);font-size:11px;color:var(--texte);padding:1px 8px;border-radius:20px;border:1px solid var(--filet-fort);min-width:24px;text-align:center}
.col-body{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.col-empty{padding:18px 10px;text-align:center;color:var(--faible);font-size:12px}
.col-sum{margin-top:auto;padding:9px 6px 2px;border-top:1px solid var(--filet);font-family:var(--f-mono);font-size:12px;color:var(--attenue);text-align:right}
.cli-card{position:relative;background:var(--surface);border:1px solid var(--filet);border-radius:10px;padding:11px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.cli-card:hover{border-color:var(--filet-fort);background:var(--survol)}
.cli-card::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--signal);opacity:0;transition:opacity .15s}
.cli-card:hover::before{opacity:1}
.cli-card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;padding-right:12px}
.cli-name{font-size:13px;font-weight:600;color:var(--texte);flex:1;min-width:0;line-height:1.3;overflow-wrap:anywhere}
.cli-amount{font-family:var(--f-mono);font-size:12px;color:var(--texte);white-space:nowrap}
.cli-meta{font-size:12px;color:var(--attenue);line-height:1.45;display:flex;flex-direction:column;gap:2px}
.cli-meta-row{display:flex;gap:6px;min-width:0}
.cli-meta-row .lbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faible);padding-top:2px;flex:none}
.cli-foot{margin-top:9px;padding-top:8px;border-top:1px solid var(--filet);display:flex;justify-content:space-between;align-items:center;gap:6px}
.cli-stage-pill{font-size:11.5px;color:var(--attenue);display:flex;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cli-stage-num{font-family:var(--f-mono);font-size:10px;color:var(--texte);padding:0 5px;border:1px solid var(--filet-fort);border-radius:4px;margin-right:6px;flex:none}
.cli-age{font-family:var(--f-mono);font-size:10.5px;color:var(--faible);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.cli-age.warn{color:var(--attente)} .cli-age.danger{color:var(--retard)}
.cli-age.warn::before,.cli-age.danger::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.av-stack{display:inline-flex}
.av-stack .av{width:20px;height:20px;border-radius:50%;background:var(--av-bg);color:var(--av-fg);font-family:var(--f-mono);font-size:8.5px;
  display:flex;align-items:center;justify-content:center;border:1.5px solid var(--surface);margin-left:-5px}
.av-stack .av:first-child{margin-left:0}

/* ═════════ Fiche client ═════════ */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}
.detail>*{min-width:0}
.detail-side{display:flex;flex-direction:column;gap:12px}
.detail-side .card{padding:16px 18px}
.client-hero{background:var(--surface);border:1px solid var(--filet);border-radius:12px;padding:22px 24px}
.hero-row{display:flex;align-items:center;gap:18px}
.hero-av{width:56px;height:56px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--av-bg);color:var(--av-fg);font-family:var(--f-mono);font-size:19px;font-weight:500}
.hero-info{flex:1;min-width:0}
.hero-name{font-size:23px;font-weight:600;letter-spacing:-.025em;color:var(--texte);line-height:1.15}
.hero-sub{font-size:13px;color:var(--attenue);margin-top:6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hero-sub .sep{color:var(--filet-fort)}
.hero-sub .montant{font-family:var(--f-mono);color:var(--texte)}
.stage-bar{display:flex;align-items:flex-start;margin-top:22px}
.stage-step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;cursor:pointer;min-width:0}
.stage-step:not(:last-child)::after{content:"";position:absolute;top:13px;left:50%;width:100%;height:1px;background:var(--filet-fort)}
.stage-step.done:not(:last-child)::after{background:var(--signal)}
.stage-dot{position:relative;z-index:1;width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--filet-fort);font-family:var(--f-mono);font-size:11px;color:var(--faible);transition:border-color .15s}
.stage-step:hover .stage-dot{border-color:var(--signal)}
.stage-step.done .stage-dot{background:var(--signal);border-color:var(--signal);color:var(--fond)}
.stage-step.current .stage-dot{border-color:var(--signal);color:var(--signal);box-shadow:0 0 0 4px rgba(var(--signal-r),.16)}
.stage-lbl{margin-top:8px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faible);text-align:center;line-height:1.3}
.stage-step.done .stage-lbl,.stage-step.current .stage-lbl{color:var(--texte)}
.substage-grid{display:flex;flex-direction:column;gap:6px}
.substage-row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;border:1px solid var(--filet);background:var(--surface);cursor:pointer;transition:background .15s,border-color .15s}
.substage-row:hover{background:var(--survol);border-color:var(--filet-fort)}
.substage-row.current{border-color:rgba(var(--signal-r),.5);background:rgba(var(--signal-r),.08)}
.substage-row.done{opacity:.72}
.substage-check{width:18px;height:18px;flex:none;border-radius:5px;border:1.5px solid var(--filet-fort);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--fond)}
.substage-row.current .substage-check{border-color:var(--signal);background:rgba(var(--signal-r),.25)}
.substage-row.done .substage-check{background:var(--ok);border-color:var(--ok)}
.substage-row.done .substage-check::before{content:"✓";font-weight:700}
.substage-num{font-family:var(--f-mono);font-size:11.5px;color:var(--faible);min-width:34px}
.substage-row.current .substage-num{color:var(--signal)}
.substage-lbl{flex:1;font-size:13px;color:var(--texte)}
.substage-row.current .substage-lbl{font-weight:600}
.phase-sq{width:24px;height:24px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:#fff}

/* Onglets */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--filet);margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 14px;background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
  font-size:13px;color:var(--attenue);cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--texte)}
.tab.active{color:var(--texte);border-bottom-color:var(--signal);font-weight:500}

/* Fil d'activité */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--filet-fort)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-22px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:1.5px solid var(--signal)}
.tl-item.system::before{background:var(--filet-fort);border-color:var(--filet-fort)}
.tl-time{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;color:var(--faible)}
.tl-title{font-size:13.5px;font-weight:500;color:var(--texte);margin-top:2px}
.tl-title a{color:var(--signal) !important;border-bottom:0 !important}
.tl-body{font-size:13px;color:var(--attenue);margin-top:6px;padding:9px 12px;background:var(--surface-2);border:1px solid var(--filet);border-radius:8px;line-height:1.55}
.tl-author{font-size:12px;color:var(--faible);margin-top:5px}

/* Tâches */
.task{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border:1px solid var(--filet);border-radius:10px;background:var(--surface);transition:background .15s,border-color .15s}
.task:hover{background:var(--survol);border-color:var(--filet-fort)}
.task.done{opacity:.55}
.task-check{width:18px;height:18px;flex:none;margin-top:1px;border-radius:5px;border:1.5px solid var(--filet-fort);background:var(--surface-2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--fond)}
.task-check:hover{border-color:var(--signal)}
.task.done .task-check{background:var(--ok);border-color:var(--ok)}
.task.done .task-check::before{content:"✓"}
.task-info{flex:1;min-width:0}
.task-title{font-size:13.5px;font-weight:500;color:var(--texte);line-height:1.4}
.task.done .task-title{text-decoration:line-through;color:var(--faible)}
.task-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px;font-size:12px;color:var(--faible)}
.task-meta .cli{color:var(--signal)}
.task-meta .date{font-family:var(--f-mono);font-size:11.5px}
.task-meta .late{color:var(--retard)}

/* Documents, mini-cartes, garanties */
.doc{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--filet);border-radius:10px;background:var(--surface)}
.doc:hover{border-color:var(--filet-fort)}
.doc-ico{width:38px;height:38px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--filet-fort);
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.04em;color:var(--attenue)}
.doc-info{flex:1;min-width:0}
.doc-name{font-size:13px;font-weight:500;color:var(--texte);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-meta{font-size:11.5px;color:var(--faible);margin-top:2px}
.mc{padding:14px 16px;border:1px solid var(--filet);border-radius:10px;background:var(--surface-2)}
.mc-l{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faible);margin-bottom:6px}
.mc-v{font-size:16px;font-weight:600;color:var(--texte)}
.mc-s{font-size:12px;color:var(--attenue);margin-top:4px;line-height:1.5}
.gar{padding:14px 16px;border:1px solid var(--filet);border-radius:10px;background:var(--surface);border-left-width:2px}
.gar.gpa{border-left-color:var(--signal)} .gar.bien{border-left-color:var(--attenue)} .gar.dec{border-left-color:var(--ok)}
.gar-prog{height:4px;background:var(--surface-2);border-radius:2px;margin-top:10px;overflow:hidden}
.gar-prog>div{height:100%;background:var(--signal);border-radius:2px}
.gar.bien .gar-prog>div{background:var(--attenue)} .gar.dec .gar-prog>div{background:var(--ok)}
.bar-mini{width:64px;height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;flex:none}
.bar-mini>div{height:100%;border-radius:2px}

/* État vide */
.empty{padding:40px 20px;text-align:center;color:var(--faible);font-size:13px;line-height:1.6}
.empty-ico{font-size:22px;color:var(--filet-fort);margin-bottom:10px;font-family:var(--f-mono)}

/* Frise */
.frieze-card .frieze-row{transition:background .12s}
.frieze-card .frieze-row:hover{background:var(--survol)}
.frieze-track{background:var(--surface-2) !important}
.substage-mini:hover{background:var(--survol) !important}

/* Formulaires en ligne */
.frow{display:grid;grid-template-columns:148px 1fr;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--filet)}
.frow-l{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faible)}
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.member-av{width:44px;height:44px;border-radius:10px;background:var(--av-bg);color:var(--av-fg);font-family:var(--f-mono);display:flex;align-items:center;justify-content:center}
.pill-new{display:inline-flex;padding:1px 7px;border-radius:20px;border:1px solid rgba(var(--signal-r),.4);color:var(--signal);font-family:var(--f-mono);font-size:9px;letter-spacing:.1em}

/* ═════════ Fenêtres ═════════ */
.modal-bg{position:fixed;inset:0;z-index:600;display:none;align-items:center;justify-content:center;padding:22px;background:var(--voile);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal-bg.open{display:flex}
.modal{width:min(620px,96vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--filet-fort);border-radius:14px;box-shadow:var(--ombre-modale)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--filet);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-title{font-size:15.5px;font-weight:600;color:var(--texte)}
.modal-close{background:none;border:0;width:30px;height:30px;border-radius:7px;color:var(--faible);cursor:pointer;font-size:16px}
.modal-close:hover{background:var(--survol);color:var(--texte)}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 20px;border-top:1px solid var(--filet);display:flex;justify-content:flex-end;gap:8px}
.modal-demo-note{margin-top:12px;font-size:12px;color:var(--faible);display:flex;gap:8px;align-items:center}
.modal-demo-note::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--attente);flex:none}

/* Hub de synchronisation */
.sync-back{position:fixed;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;padding:22px;background:var(--voile);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sync-back .modal{width:min(900px,96vw)}
.sync-head{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--filet)}
.sync-head .t{font-size:15.5px;font-weight:600}
.sync-head .s{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faible);margin-top:2px}
.sync-body{flex:1;overflow-y:auto;padding:18px 20px;background:var(--fond)}
.sync-map{display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:wrap;padding:16px;margin-bottom:16px;border:1px dashed var(--filet-fort);border-radius:12px}
.sync-node{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:110px;text-align:center}
.sync-node .rond{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--filet-fort);background:var(--surface);color:var(--attenue)}
.sync-node.hub .rond{border-color:var(--signal);color:var(--signal);font-weight:700}
.sync-node .n{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--attenue)}
.sync-node.off{opacity:.4}
.sync-link{flex:1;min-width:30px;max-width:110px;height:1px;border-top:1px dashed var(--signal);opacity:.6}
.sync-app{background:var(--surface);border:1px solid var(--filet);border-radius:12px;margin-bottom:12px;overflow:hidden}
.sync-app-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--filet);flex-wrap:wrap}
.sync-app-h .ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:1px solid var(--filet-fort);color:var(--attenue);flex:none}
.sync-app-h .nm{font-size:14px;font-weight:600}
.sync-app-h .sb{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faible);margin-top:1px}
.sync-etat{font-family:var(--f-mono);font-size:10.5px;display:inline-flex;align-items:center;gap:6px;color:var(--faible)}
.sync-etat i{width:6px;height:6px;border-radius:50%;background:var(--faible);display:inline-block}
.sync-etat.on{color:var(--ok)} .sync-etat.on i{background:var(--ok)}
.sync-flow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--filet)}
.sync-flow:last-child{border-bottom:0}
.sync-flow.off{opacity:.45}
.sync-flow .dir{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--filet-fort);color:var(--signal);flex:none}
.sync-flow .l{font-size:13px;font-weight:500}
.sync-flow .d{font-size:12px;color:var(--attenue);margin-top:2px;line-height:1.45}
.sync-flow .m{font-family:var(--f-mono);font-size:10.5px;color:var(--faible);margin-top:4px}
.sync-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--filet);font-size:12px;color:var(--faible);flex-wrap:wrap}

/* ═════════ Toasts ═════════ */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:900;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:10px;background:var(--surface-2);border:1px solid var(--filet-fort);
  color:var(--texte);font-size:13px;box-shadow:var(--ombre-modale);max-width:380px;animation:toastIn .22s var(--easeOut)}
.toast .ico{color:var(--signal)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ═════════ Planning (Gantt) ═════════ */
.gantt-wrap{background:var(--surface);border:1px solid var(--filet);border-radius:12px;padding:20px 22px}
.gantt-year-nav{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.gantt-year-nav button{background:var(--surface);border:1px solid var(--filet-fort);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--texte);line-height:1.2}
.gantt-year-nav button:hover{background:var(--survol)}
.gantt-year-display{font-family:var(--f-mono);font-size:18px;color:var(--texte);padding:0 6px}
.gantt-stats{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--attenue);flex-wrap:wrap}
.gantt-stats b{color:var(--texte);font-family:var(--f-mono);font-weight:500}
.gantt-scroll{overflow-x:auto;padding-top:22px}
.gantt-inner{min-width:980px;position:relative}
.gantt-header{display:grid;grid-template-columns:180px repeat(12,1fr);border-bottom:1px solid var(--filet);padding-bottom:8px;margin-bottom:10px}
.gantt-corner,.gantt-month-lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faible)}
.gantt-month-lbl{text-align:center;border-left:1px solid var(--filet)}
.gantt-body{position:relative}
.gantt-row{display:grid;grid-template-columns:180px repeat(12,1fr);height:40px;position:relative;align-items:center;border-bottom:1px solid var(--filet)}
.gantt-row:last-child{border-bottom:0}
.gantt-row:hover{background:var(--survol)}
.gantt-cell{height:100%;border-left:1px solid var(--filet)}
.gantt-client-lbl{font-weight:500;color:var(--texte);padding-right:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px;display:flex;flex-direction:column;justify-content:center;height:100%}
.gantt-client-lbl .sub{font-weight:400;color:var(--faible);font-size:11px;margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.gantt-bar{position:absolute;height:22px;top:9px;border-radius:5px;cursor:pointer;display:flex;align-items:center;padding:0 8px;
  color:#fff;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2;transition:filter .15s}
.gantt-bar:hover{filter:brightness(1.12)}
.gantt-bar.prospection{background:#6F7A8E} .gantt-bar.commercial{background:#4A76E0}

.gantt-tooltip{position:fixed;display:none;background:var(--surface-2);color:var(--texte);border:1px solid var(--filet-fort);padding:10px 13px;border-radius:9px;font-size:12px;z-index:950;pointer-events:none;max-width:280px;line-height:1.5;box-shadow:var(--ombre-modale)}
.gantt-tooltip b{color:var(--texte);font-weight:600}
.gantt-tooltip .ttp-phase{display:inline-block;padding:1px 7px;border-radius:4px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;margin:5px 0}
.gantt-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--filet)}
.gantt-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--attenue)}
.gantt-legend-dot{width:10px;height:10px;border-radius:3px}
.gantt-empty{padding:70px 24px;text-align:center;color:var(--faible)}
.gantt-empty h3{font-size:16px;font-weight:600;color:var(--texte);margin-bottom:8px}

/* ═════════ Assistant IA (réponses simulées en démo) ═════════ */
.ai-score-dot{position:absolute;top:10px;right:9px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px var(--surface);cursor:help;z-index:2}
.ai-score-dot.ok{background:var(--ok)} .ai-score-dot.mid{background:var(--attente)} .ai-score-dot.low{background:var(--retard)}
.ai-score-dot.loading{background:var(--filet-fort);animation:aiPulse 1.2s ease-in-out infinite}
.ai-score-dot.na{background:var(--faible)}
@keyframes aiPulse{0%,100%{opacity:.5}50%{opacity:1}}
.ai-score-tip{position:absolute;top:24px;right:6px;z-index:50;background:var(--surface-2);color:var(--texte);border:1px solid var(--filet-fort);
  font-size:11.5px;line-height:1.45;padding:8px 10px;border-radius:8px;max-width:230px;width:max-content;box-shadow:var(--ombre-modale);
  opacity:0;pointer-events:none;transform:translateY(-3px);transition:opacity .15s,transform .15s}
.ai-score-dot:hover + .ai-score-tip{opacity:1;transform:none}
.btn-ai{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;
  background:var(--surface);border:1px solid var(--filet-fort);color:var(--texte);transition:background .15s,border-color .15s}
.btn-ai:hover{background:var(--survol);border-color:rgba(var(--signal-r),.5)}
.btn-ai .ai-spark{color:var(--signal);font-size:12px;line-height:1}
.btn-ai.solid{background:var(--texte);color:var(--fond);border-color:var(--texte)}
.btn-ai.solid .ai-spark{color:var(--fond)}
.btn-ai.solid:hover{opacity:.88;background:var(--texte)}
.ai-next-bar{margin-top:auto;padding:8px 0 0;border-top:1px dashed var(--filet-fort);display:flex}
.ai-next-bar .btn-ai{width:100%;justify-content:center;background:transparent}
.ai-modal-bd{position:fixed;inset:0;z-index:700;background:var(--voile);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:22px}
.ai-modal{background:var(--surface);border:1px solid var(--filet-fort);border-radius:14px;box-shadow:var(--ombre-modale);width:100%;max-width:660px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column}
.ai-modal.wide{max-width:880px}
.ai-modal-h{padding:16px 20px;border-bottom:1px solid var(--filet);display:flex;align-items:center;justify-content:space-between;gap:12px}
.ai-modal-h h1{margin:0;font-size:17px;font-weight:600;color:var(--texte);line-height:1.25}
.ai-modal-h .ai-sub{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);margin-bottom:3px}
.ai-modal-close{background:transparent;border:1px solid var(--filet);border-radius:8px;width:30px;height:30px;font-size:17px;color:var(--attenue);cursor:pointer}
.ai-modal-close:hover{background:var(--survol);color:var(--texte)}
.ai-modal-b{padding:18px 20px;overflow-y:auto;flex:1;color:var(--texte);font-size:13.5px;line-height:1.6}
.ai-modal-b p{margin:0 0 10px}
.ai-modal-b h3{margin:16px 0 6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--signal);font-weight:400}
.ai-modal-b h3:first-child{margin-top:0}
.ai-modal-b ul{margin:0 0 10px;padding-left:18px}
.ai-modal-b li{margin-bottom:4px}
.ai-modal-b strong{color:var(--texte);font-weight:600}
.ai-modal-f{padding:12px 20px 16px;border-top:1px solid var(--filet);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ai-demo-mention{font-size:11.5px;color:var(--faible);margin-top:12px;padding-top:10px;border-top:1px dashed var(--filet)}
.ai-skel{display:flex;flex-direction:column;gap:10px}
.ai-skel .ln{height:10px;border-radius:4px;background:linear-gradient(90deg,var(--surface-2),var(--survol),var(--surface-2));background-size:200% 100%;animation:aiSkel 1.3s linear infinite}
.ai-skel .ln.w70{width:70%} .ai-skel .ln.w90{width:92%} .ai-skel .ln.w50{width:48%}
@keyframes aiSkel{0%{background-position:200% 0}100%{background-position:-200% 0}}
.ai-reply-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:680px){.ai-reply-grid{grid-template-columns:1fr 1fr 1fr}}
.ai-reply-card{border:1px solid var(--filet);border-radius:10px;padding:12px;background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.ai-reply-card:hover{border-color:rgba(var(--signal-r),.55)}
.ai-reply-card .tone{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--signal)}
.ai-reply-card .body{font-size:12.5px;line-height:1.55;color:var(--texte);white-space:pre-wrap}
.ai-prio-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
@media(min-width:860px){.ai-prio-grid{grid-template-columns:1fr 1fr 1fr}}
.ai-prio-col{border:1px solid var(--filet);border-radius:12px;background:var(--surface-2);overflow:hidden;display:flex;flex-direction:column}
.ai-prio-h{padding:10px 12px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--filet);border-top:2px solid var(--faible)}
.ai-prio-col.urgent .ai-prio-h{color:var(--retard);border-top-color:var(--retard)}
.ai-prio-col.important .ai-prio-h{color:var(--attente);border-top-color:var(--attente)}
.ai-prio-col.flex .ai-prio-h{color:var(--signal);border-top-color:var(--signal)}
.ai-prio-b{padding:10px;display:flex;flex-direction:column;gap:7px}
.ai-prio-item{border:1px solid var(--filet);border-radius:8px;padding:9px 10px;background:var(--surface);font-size:12.5px;line-height:1.45}
.ai-prio-item .ai-prio-t{font-weight:600;color:var(--texte);margin-bottom:2px}
.ai-prio-item .ai-prio-c{font-size:11.5px;color:var(--signal);margin-bottom:2px}
.ai-prio-item .ai-prio-why{font-size:11.5px;color:var(--attenue)}
.ai-muted{color:var(--attenue);font-size:12px;margin-bottom:12px}
.ai-err{padding:14px;border:1px solid rgba(var(--retard-r),.4);background:rgba(var(--retard-r),.08);border-radius:10px;color:var(--retard);font-size:13px;line-height:1.5}
@media print{
  body *{visibility:hidden}
  .ai-print,.ai-print *{visibility:visible}
  .ai-print{position:absolute;left:0;top:0;width:100%;padding:20mm;background:#fff;color:#000}
  .ai-modal-h,.ai-modal-f{display:none !important}
}

/* ═════════ Mobile : éléments masqués sur grand écran ═════════ */
.mobile-backdrop,#bottom-nav,#tasks-today,#fab-photo,#fab-voice{display:none}
.fab svg,.tt-action svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tt-action svg{width:16px;height:16px}

/* ═════════ Responsive ═════════ */
@media (max-width:1240px){
  .detail{grid-template-columns:1fr}
  .detail-side{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
}
@media (max-width:1100px){

  .subbar-search{width:220px}
}
@media (max-width:900px){

  .split{grid-template-columns:1fr}
}
@media (max-width:780px){
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}

  .subbar{padding:10px 14px;min-height:56px}

  .subbar-search{width:auto;flex:1;max-width:none}
  .content{padding:14px 14px 40px;gap:14px}
  .card{padding:16px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi-val{font-size:21px}
  .pipeline{grid-template-columns:repeat(6,minmax(230px,1fr))}
  .hero-row{flex-wrap:wrap}
  .stage-bar{overflow-x:auto;padding-bottom:4px}
  .stage-step{min-width:74px}
  [style*="grid-template-columns:repeat(4,1fr)"]{grid-template-columns:1fr 1fr !important}
  [style*="grid-template-columns:repeat(6,1fr)"]{grid-template-columns:repeat(3,1fr) !important}
  [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr !important}
  .frieze-card [style*="grid-template-columns:200px"]{grid-template-columns:120px 1fr 48px !important}
  input,select,textarea{font-size:16px}
  #bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;padding-bottom:env(safe-area-inset-bottom,0px);
    background:var(--surface);border-top:1px solid var(--filet);z-index:80;justify-content:space-around}
  #bottom-nav .bn-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:transparent;border:0;cursor:pointer;color:var(--faible);font-size:10.5px}
  #bottom-nav .bn-ico{font-size:19px;line-height:1}
  #bottom-nav .bn-btn.active{color:var(--signal)}
  #bottom-nav .bn-lbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
  #tasks-today{display:block;margin:0 14px 14px;padding:14px;background:var(--surface);border:1px solid var(--filet);border-radius:12px}
  #tasks-today:empty{display:none}
  #tasks-today .tt-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  #tasks-today .tt-title{font-size:15px;font-weight:600}
  #tasks-today .tt-count{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--signal)}
  #tasks-today .tt-group{margin-bottom:10px}
  #tasks-today .tt-group-name{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faible);padding:6px 0;border-bottom:1px solid var(--filet);margin-bottom:6px}
  #tasks-today .tt-task{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--filet)}
  #tasks-today .tt-task:last-child{border-bottom:0}
  #tasks-today .tt-task input{width:20px;height:20px;flex:none}
  #tasks-today .tt-task.done .tt-lbl{text-decoration:line-through;color:var(--faible)}
  #tasks-today .tt-lbl{flex:1;font-size:13.5px;line-height:1.35}
  #tasks-today .tt-client{display:block;font-size:11.5px;color:var(--signal);margin-top:2px}
  #tasks-today .tt-actions{display:flex;gap:6px}
  #tasks-today .tt-action{width:36px;height:36px;border-radius:8px;background:var(--surface-2);border:1px solid var(--filet);color:var(--attenue);cursor:pointer;display:flex;align-items:center;justify-content:center}
  #tasks-today .tt-empty{text-align:center;padding:16px;color:var(--faible);font-size:13px}
  #fab-photo,#fab-voice{display:flex;position:fixed;right:16px;width:52px;height:52px;border-radius:50%;align-items:center;justify-content:center;cursor:pointer;z-index:90;
    background:var(--texte);color:var(--fond);border:1px solid var(--texte)}
  #fab-photo{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  #fab-voice{bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--texte);border-color:var(--filet-fort)}
  .toast-wrap{bottom:80px;right:12px;left:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

<script id="oniq-demo-bridge">
/* ═══════════════════════════════════════════════════════════════════
   MODE DÉMO — pont de remplacement du parent ONIQ
   L'application d'origine dialoguait avec la plateforme (app.html) par
   window.parent.postMessage : sauvegarde cloud, profil utilisateur,
   proxy IA Mistral, ouverture des autres logiciels, support…
   Ici, chaque appel est traité localement : aucune requête ne part,
   rien ne bloque, et les réponses sont simulées après un court délai.
   ═══════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  var PREFIX = 'oniq-demo-onipilote-';
  window.__DEMO_PREFIX = PREFIX;

  var DEMO_USER = {
    email:'direction@batidrome.example', company:'Démo — Bâti Drôme', name:'Démo — Bâti Drôme',
    avatar:'BD', companyLogo:null, role:'Gérant', isAdmin:false, isCommercial:false, isAuthed:true
  };
  var APPS = {metrimanager:'OniMetri', batimanager:'BatiManager', onicompta:'OniCompta'};

  function emit(data, delay){
    setTimeout(function(){
      try{ window.dispatchEvent(new MessageEvent('message', {data:data})); }catch(e){}
    }, delay || 0);
  }
  function note(msg){ try{ if(typeof window.toast === 'function') window.toast(msg); }catch(e){} }

  /* Remplace __demoPost(...) dans tout le code d'origine. */
  window.__demoPost = function(msg){
    try{
      if(!msg || typeof msg !== 'object') return;
      switch(msg.type){
        case 'onipilote-load':            /* l'état local de la démo fait foi */
          return;
        case 'onipilote-save':
          emit({type:'onipilote-save-ok', key:msg.key}, 300);
          return;
        case 'oniq-user-info-request':
          emit({type:'oniq-user-info', user:DEMO_USER}, 40);
          return;
        case 'bati-mistral-request':
          demoAI(msg);
          return;
        case 'oniq-open-app':
          note((APPS[msg.app] || 'Ce logiciel') + ' : disponible dans la version installée');
          return;
        default:
          /* oniq-cross-sync, routes internes, fermeture, support : sans objet en démo */
          return;
      }
    }catch(e){ /* jamais bloquant */ }
  };

  /* ───────────────────────────────────────────────────────────────
     Assistant IA simulé : réponses pré-écrites construites à partir
     des données fictives contenues dans la requête.
     ─────────────────────────────────────────────────────────────── */
  var MENTION = '\n\nDémo — réponse simulée à partir des données fictives. La version installée interroge le modèle IA sur vos vraies données.';

  function hash(s){ var h = 0; s = String(s||''); for(var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; } return Math.abs(h); }
  function line(prompt, label){
    var m = prompt.match(new RegExp('^' + label + '\\s*:\\s*(.+)$', 'm'));
    return m ? m[1].trim() : '';
  }
  function eur(n){ n = Number(n)||0; return n ? n.toLocaleString('fr-FR') + ' €' : 'non chiffré'; }
  function stageLabel(id){
    try{ var s = window.getSubstage ? window.getSubstage(id) : null; if(s) return id + ' · ' + s.name; }catch(e){}
    return id || '—';
  }
  function parseStage(id){ var p = String(id||'1.1').split('.'); return {maj:parseInt(p[0],10)||1, min:parseInt(p[1],10)||1}; }

  function aiLead(prompt){
    var nom = line(prompt, 'Nom'), st = parseStage(line(prompt, 'Phase'));
    var dm = prompt.match(/Dernière maj: il y a (\d+)/); var days = dm ? parseInt(dm[1],10) : 5;
    var score, reason;
    if(st.maj === 1){ score = 42 + st.min*4; reason = 'Premier contact : besoin à qualifier avant tout chiffrage'; }
    else if(st.maj === 2 && st.min <= 5){ score = 56 + st.min*3; reason = 'Projet en cours de cadrage, bon niveau d\'engagement'; }
    else if(st.maj === 2 && st.min <= 7){ score = 74 + (st.min-6)*5; reason = 'Devis entre ses mains : relancer sous 48 h'; }
    else if(st.maj === 2 && st.min === 8){ score = 64; reason = 'Relance en cours, réponse du client attendue'; }
    else if(st.maj === 2 && st.min === 9){ score = 86; reason = 'Négociation active, signature probable ce mois-ci'; }
    else if(st.maj === 2){ score = 95; reason = 'Contrat signé : préparer le lancement du dossier'; }
    else { score = 97; reason = 'Client signé, suivi de réalisation en cours'; }
    if(st.maj <= 2 && st.min < 10){
      if(days > 21){ score -= 28; reason = 'Aucun échange depuis ' + days + ' jours : risque de perte'; }
      else if(days > 10){ score -= 9; reason += ' — silence de ' + days + ' jours'; }
    }
    score = Math.max(8, Math.min(99, score + (hash(nom) % 7) - 3));
    return JSON.stringify({score:score, reason:reason});
  }

  function aiNext(prompt){
    var ph = (prompt.match(/phase pipeline "([^"]+)"/) || [])[1] || 'cette phase';
    var rows = [];
    prompt.replace(/^- (.+?)(?: \((\d+)€\))?(?:, maj il y a (\d+)j)?$/gm, function(_, n, b, d){ rows.push({n:n, b:+b||0, d:+d||0}); return _; });
    if(!rows.length) return 'Aucun client dans la phase **' + ph + '** : profitez-en pour relancer les prospects de la phase précédente.' + MENTION;
    function poids(r){ return (r.d > 7 ? 1e12 + r.d*1e7 : 0) + r.b; }
    rows.sort(function(a,b){ return poids(b) - poids(a); });
    var t = rows[0];
    var why = t.d > 7 ? 'le dossier est sans nouvelles depuis ' + t.d + ' jours' : 'c\'est le plus gros potentiel de la colonne (' + eur(t.b) + ')';
    var act = {
      'Accueil':'l\'appeler pour qualifier le besoin (budget, délai, terrain) puis l\'affecter à un commercial',
      'Commercial':'l\'appeler ce matin, reformuler les points bloquants du devis et proposer un rendez-vous cette semaine',
      'Préparation':'faire le point avec le conducteur de travaux sur les autorisations et les commandes en attente',
      'Chantier':'caler une visite de chantier et envoyer au client un point d\'avancement avec photos',
      'Réception':'fixer la date de levée des réserves et préparer l\'appel du solde',
      'SAV & Garanties':'traiter le ticket ouvert et confirmer au client la date d\'intervention'
    }[ph] || 'le contacter aujourd\'hui et fixer la prochaine étape par écrit';
    var txt = '**Priorité du jour : ' + t.n + '.** ' + why.charAt(0).toUpperCase() + why.slice(1) + '.\n\n'
      + 'Action concrète : ' + act + '.';
    if(rows.length > 1) txt += '\n\nEnsuite : ' + rows.slice(1,3).map(function(r){ return r.n; }).join(', ') + '.';
    return txt + MENTION;
  }

  function snap(prompt){
    var o = {nom:line(prompt,'Nom'), phase:line(prompt,'Phase'), budget:line(prompt,'Budget estimé'),
      projet:line(prompt,'Projet'), lieu:line(prompt,'Lieu'), tasks:[], comms:[], days:0};
    var dm = prompt.match(/Dernière maj: il y a (\d+)/); o.days = dm ? +dm[1] : 0;
    var sec = prompt.split(/Tâches ouvertes[^\n]*\n/)[1] || '';
    sec.split(/\n/).forEach(function(l){ var m = l.match(/^\s+- (.+)$/); if(m && !/^\[/.test(m[1])) o.tasks.push(m[1]); });
    var sc = prompt.split(/Dernières communications:\n/)[1] || '';
    sc.split(/\n/).forEach(function(l){ var m = l.match(/^\s+- \[(\w+)\] (.*?) — (.*)$/); if(m) o.comms.push({c:m[1], s:m[2], b:m[3]}); });
    o.tasks = o.tasks.filter(function(t){ return o.comms.every(function(c){ return t.indexOf(c.s) < 0; }); });
    return o;
  }
  function chan(c){ return c === 'sms' ? 'SMS' : c === 'call' ? 'appel' : 'e-mail'; }

  function aiSummary(prompt){
    var o = snap(prompt);
    var t = '**Situation actuelle**\n\n' + o.nom + ' — ' + (o.projet || 'projet à préciser') + (o.lieu ? ', ' + o.lieu : '')
      + '. Budget estimé : ' + eur(o.budget.replace(/[^\d]/g,'')) + '. Dossier à l\'étape ' + stageLabel(o.phase)
      + (o.days ? ', dernière mise à jour il y a ' + o.days + ' jour(s)' : '') + '.\n\n**Historique récent**\n\n';
    t += o.comms.length ? o.comms.map(function(c){ return '- ' + chan(c.c) + ' : ' + (c.s || c.b.slice(0,80)); }).join('\n')
                        : '- Aucun échange écrit enregistré récemment.';
    t += '\n\n**À traiter / Pending**\n\n';
    t += o.tasks.length ? o.tasks.map(function(x){ return '- ' + x; }).join('\n') : '- Aucune tâche ouverte : planifier la prochaine action.';
    if(o.days > 14) t += '\n- Reprendre contact : aucun mouvement depuis ' + o.days + ' jours.';
    return t + MENTION;
  }

  function aiBriefing(prompt){
    var o = snap(prompt), st = parseStage(o.phase);
    var enjeu = st.maj === 1 ? 'qualifier le besoin et le budget' : st.maj === 2 ? 'lever les derniers freins et obtenir la signature'
      : st.maj <= 4 ? 'rassurer sur le planning et la qualité d\'exécution' : 'clôturer proprement et préparer les garanties';
    return '### Profil & projet\n- ' + o.nom + (o.lieu ? ' — ' + o.lieu : '') + '\n- Projet : ' + (o.projet || 'à préciser')
      + '\n- Budget annoncé : ' + eur(o.budget.replace(/[^\d]/g,''))
      + '\n\n### Statut pipeline\n- Étape ' + stageLabel(o.phase) + (o.days ? ' (depuis ' + o.days + ' j)' : '')
      + '\n- Enjeu du rendez-vous : ' + enjeu
      + '\n\n### Points à valider en RDV\n- Calendrier souhaité et contraintes d\'accès au terrain\n- Mode de financement (prêt, apport, aides MaPrimeRénov\' le cas échéant)\n- Choix des finitions qui pèsent sur le prix (menuiseries, revêtements, chauffage)'
      + '\n\n### Risques / objections probables\n- Comparaison avec un devis concurrent moins cher\n- Inquiétude sur les délais en période chargée'
      + (o.tasks.length ? '\n- Point en suspens : ' + o.tasks[0] : '')
      + '\n\n### Argumentaire clé\n- Un interlocuteur unique du devis à la réception, suivi visible étape par étape\n- Artisans locaux, garanties décennale et parfait achèvement suivies dans l\'outil\n- Engagement écrit sur le planning et points d\'avancement photo chaque semaine'
      + MENTION;
  }

  function aiReplies(prompt){
    var cli = (line(prompt, 'Client') || '').replace(/^(M\.|Mme)\s+/, '');
    var prenom = cli.split(' ')[0] || '';
    var subj = line(prompt, 'Sujet') || 'votre projet';
    return JSON.stringify({replies:[
      {tone:'Chaleureux', body:'Bonjour ' + prenom + ',\n\nMerci pour votre message ! Je regarde cela avec l\'équipe et je vous rappelle dès demain pour en parler de vive voix. Belle journée à vous.'},
      {tone:'Direct', body:'Bonjour ' + prenom + ',\n\nBien reçu. Je vous envoie une réponse complète sur « ' + subj.slice(0,60) + ' » d\'ici vendredi. Seriez-vous disponible mardi matin pour un point rapide ?'},
      {tone:'Cadré pro', body:'Bonjour ' + prenom + ',\n\nNous accusons réception de votre demande. Votre chargé d\'affaires vous transmettra sous 48 h ouvrées les éléments demandés, ainsi qu\'une proposition de rendez-vous.\n\nCordialement.'}
    ]});
  }

  function aiPrio(prompt){
    var today = new Date(); today.setHours(0,0,0,0);
    var out = {urgent:[], important:[], flex:[]};
    prompt.replace(/^\d+\. \[id=([^\]]+)\] "([^"]*)" \| client=([^|\n]+)(?:\| échéance=(\d{4}-\d{2}-\d{2}))?(?:[^\n]*phase=([\d.]+))?[^\n]*$/gm,
      function(_, id, title, cli, due, phase){
        var d = due ? Math.round((new Date(due + 'T00:00:00') - today)/86400000) : null;
        var st = parseStage(phase);
        if(d !== null && d <= 0) out.urgent.push({id:id, why: d < 0 ? 'En retard de ' + (-d) + ' j — à traiter en premier' : 'Échéance aujourd\'hui'});
        else if((d !== null && d <= 7) || (st.maj === 2 && st.min >= 6)) out.important.push({id:id, why: d !== null ? 'Échéance dans ' + d + ' j, impact direct sur le CA' : 'Devis en jeu : fort impact business'});
        else out.flex.push({id:id, why: d !== null ? 'Échéance dans ' + d + ' j' : 'Sans échéance fixée'});
        return _;
      });
    ['urgent','important','flex'].forEach(function(k){ out[k] = out[k].slice(0,8); });
    return JSON.stringify(out);
  }

  function demoAI(msg){
    var prompt = '';
    try{ prompt = msg.payload.messages[0].content || ''; }catch(e){}
    var txt;
    try{
      if(/Évalue la chaleur/.test(prompt)) txt = aiLead(prompt);
      else if(/phase pipeline "/.test(prompt)) txt = aiNext(prompt);
      else if(/résumé synthétique/.test(prompt)) txt = aiSummary(prompt);
      else if(/briefing 1 page/.test(prompt)) txt = aiBriefing(prompt);
      else if(/propositions de réponses/.test(prompt)) txt = aiReplies(prompt);
      else if(/Priorise les tâches/.test(prompt)) txt = aiPrio(prompt);
      else txt = 'Réponse de démonstration : l\'assistant IA est disponible dans la version installée.';
    }catch(e){ txt = 'Réponse de démonstration indisponible pour cette demande.'; }
    var fast = /Évalue la chaleur/.test(prompt);
    emit({type:'bati-mistral-response', reqId:msg.reqId, result:{content:[{type:'text', text:txt}]}},
         (fast ? 250 : 650) + (hash(msg.reqId) % 500));
  }

  /* ───────────────────────────────────────────────────────────────
     Réinitialisation de la démo
     ─────────────────────────────────────────────────────────────── */
  window.__demoReset = function(){
    if(!confirm('Réinitialiser la démo ? Toutes les modifications faites pendant la présentation seront effacées.')) return;
    /* Bloque toute réécriture de l'état (sauvegarde différée, beforeunload) pendant le rechargement */
    window.__demoResetting = true;
    try{ window.saveLocal = function(){}; }catch(e){}
    try{
      var _set = Storage.prototype.setItem;
      Storage.prototype.setItem = function(k){ if(window.__demoResetting && String(k).indexOf(PREFIX) === 0) return; return _set.apply(this, arguments); };
    }catch(e){}
    try{
      var ks = [];
      for(var i=0;i<localStorage.length;i++){ var k = localStorage.key(i); if(k && k.indexOf(PREFIX) === 0) ks.push(k); }
      ks.forEach(function(k){ localStorage.removeItem(k); });
    }catch(e){}
    location.reload();
  };

  /* ───────────────────────────────────────────────────────────────
     Thème jour / nuit — même clé que le CRM (oq-theme, même origine)
     ─────────────────────────────────────────────────────────────── */
  window.__demoToggleTheme = function(){
    var cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    var nxt = cur === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', nxt);
    try{ localStorage.setItem('oq-theme', nxt); }catch(e){}
  };
  window.addEventListener('storage', function(e){
    if(e.key === 'oq-theme' && (e.newValue === 'dark' || e.newValue === 'light')) document.documentElement.setAttribute('data-theme', e.newValue);
  });
  try{
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(ev){
      var stored = null; try{ stored = localStorage.getItem('oq-theme'); }catch(e){}
      if(stored !== 'dark' && stored !== 'light') document.documentElement.setAttribute('data-theme', ev.matches ? 'light' : 'dark');
    });
  }catch(e){}
})();
</script>

window.__DEMO_TEAM = [

window.__demoSeed = function(){

  /* D(-3,10) = il y a 3 jours à 10 h ; dd(5) = date AAAA-MM-JJ dans 5 jours */
  function D(n, h, m){ var d = new Date(now + n*DAY); d.setHours(h == null ? 10 : h, m || 0, 0, 0); if(d.getTime() > now && n <= 0) d = new Date(now - 20*60000); return d.toISOString(); }

  function cmp(a, b){ var x = a.split('.'), y = b.split('.'); return (+x[0] - +y[0]) || (+x[1] - +y[1]); }

      typeProjet:o.projet, budgetEstime:o.budget, value:o.budget, source:o.source, stage:o.stage,
      createdAt:D(-o.cree, 9, 15), lastUpdated:D(-o.maj, 16, 40),
      assignedCommercial:o.com || null, assignedTo:o.com || null,
      assignedConducteur:o.cond || null, assignedChef:o.chef || null, assignedSAV:o.savu || null,

    };

window.addEventListener('message',function(evt){
  try{
    if(!evt||!evt.data||typeof evt.data!=='object'||!evt.data.type)return;
    if(evt.data.type==='onipilote-cloud-data'&&evt.data.data){
      /* Race-safe : si une sauvegarde locale est en attente (debounce actif),
         on ignore le payload cloud pour éviter d'écraser les modifs locales. */
      if(_saveCloudT){return;}
      try{
        const d=typeof evt.data.data==='string'?JSON.parse(evt.data.data):evt.data.data;
        if(d&&typeof d==='object'&&Array.isArray(d.clients)){
          S=Object.assign(S,d);
          _syncPipelineRef();
          saveLocal();render();
          setSyncState('saved','Chargé depuis le cloud');
          setTimeout(()=>setSyncState('idle','Données locales'),2400);
        }
      }catch(e){}
    }

    if(evt.data.type==='onipilote-save-error'){setSyncState('idle','⚠ Erreur cloud — local OK');}
  }catch(err){/* silencieux : message externe mal formé */}
});

  if(state)el.classList.add(state);

  if(lbl)lbl.textContent=msg||labels[state]||'';
}

function ensureSyncCfg(){
  if(!S.syncCfg){S.syncCfg=JSON.parse(JSON.stringify(SYNC_DEFAULTS));}

  Object.keys(SYNC_DEFAULTS).forEach(k=>{
    if(!S.syncCfg[k])S.syncCfg[k]=JSON.parse(JSON.stringify(SYNC_DEFAULTS[k]));
    else{
      const have=new Set((S.syncCfg[k].flows||[]).map(f=>f.id));

function runSyncApp(appKey){
  const cfg=ensureSyncCfg();const app=cfg[appKey];if(!app||!app.enabled)return;
  const lg=SYNC_LOGOS[appKey];if(!lg)return;

  try{
    payload={
      source:'onipilote',target:appKey,
      clients:Array.isArray(S.clients)?S.clients:[],
      team:Array.isArray(S.team)?S.team:[],
      affaires:(S.clients||[]).map(c=>({clientId:c.id,nom:clientFullName(c),budget:c.budgetEstime,phase:getPhase(c.stage).id,sub:c.stage})),
      ts:Date.now(),
      flows:(app.flows||[]).filter(f=>!f.disabled).map(f=>f.id)
    };
  }catch(e){setSyncState('idle','⚠ Erreur sync payload');return;}
  try{__demoPost({type:'oniq-cross-sync',from:'onipilote',target:appKey,data:payload},'*');}catch(e){}
  app.lastSync=new Date().toISOString();
  app.flows.forEach(f=>{if(!f.disabled)f.lastSync=app.lastSync;});
  saveLocal();
  setTimeout(()=>{
    setSyncState('saved','✓ '+lg.name+' synchronisé');
    toast('Données poussées vers '+lg.name,'ok');

    if(body){body.innerHTML=renderSyncModalBody(cfg);bindSyncBody(cfg);}
    setTimeout(()=>setSyncState('idle','Données locales'),2400);

}

/* ───────── HELPERS ───────── */
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmtEUR(n){if(!n&&n!==0)return '—';return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);}
function fmtDate(iso){if(!iso)return '—';try{return new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return iso;}}
function fmtDateTime(iso){if(!iso)return '—';try{return new Date(iso).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}}
function relTime(iso){if(!iso)return '—';const d=new Date(iso);const diff=Math.floor((Date.now()-d)/1000);if(diff<60)return 'à l\'instant';if(diff<3600)return 'il y a '+Math.floor(diff/60)+' min';if(diff<86400)return 'il y a '+Math.floor(diff/3600)+' h';if(diff<86400*7)return 'il y a '+Math.floor(diff/86400)+' j';return fmtDate(iso);}
function daysAt(iso){if(!iso)return 0;return Math.floor((Date.now()-new Date(iso))/86400000);}
function initials(name){if(!name)return '??';return name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function escapeHtml(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getPhase(stageId){
  if(!stageId)return PIPELINE[0];
  /* 1) compat anciens IDs "2.7" → préfixe "2" est l'id de la phase. */
  const dotPrefix = String(stageId).split('.')[0];
  let p = PIPELINE.find(x=>x.id===dotPrefix);
  if(p) return p;
  /* 2) lookup générique : phase contenant cette sous-étape. */
  p = PIPELINE.find(x => x.substages && x.substages.some(s => s.id === stageId));
  return p || PIPELINE[0];
}
function getSubstage(stageId){const ph=getPhase(stageId);return ph.substages.find(s=>s.id===stageId)||ph.substages[0];}
function teammate(id){return S.team.find(u=>u.id===id);}
function clientFullName(c){return [c.civilite||'',c.prenom||'',c.nom||''].filter(Boolean).join(' ').trim()||(c.raisonSociale||'(sans nom)');}

function toast(msg,kind){
  const w=document.getElementById('toast-wrap');
  const t=document.createElement('div');t.className='toast';
  t.innerHTML='<span class="ico">'+(kind==='err'?'⚠':'✦')+'</span><span>'+escapeHtml(msg)+'</span>';
  w.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320);},2600);
}
