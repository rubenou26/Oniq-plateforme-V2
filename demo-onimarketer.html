<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ONIQ. OniMarketer — Démo</title>
<!--
  OniMarketer — version de démonstration (id « onimarketer »).
  Refonte à la charte ONIQ (celle de oniq.online et du CRM) :
    · tokens --fond / --surface / --filet / --texte / --signal…, thème sombre et clair
    · Instrument Sans (texte) + JetBrains Mono (chiffres, références, étiquettes)
    · accent unique --signal ; vert / ambre / rouge réservés aux états
  Mode démo :
    · aucun appel réseau vers Supabase : la couche de persistance est remplacée par un
      client local (mémoire + localStorage, clés « oniq-demo-onimarketer-* ») qui expose
      la même interface que supabase-js (from().select().order().insert().update()…)
    · données fictives d'un constructeur de maisons de la Drôme (« Bâti Drôme »)
    · les actions qui dépendaient d'un service externe affichent un message simulé
-->
<script>
/* Thème appliqué avant le rendu. Ordre : clé du CRM « oq-theme » (même origine),
   sinon préférence du système. */
(function(){
  var t = null;
  try { t = localStorage.getItem('oq-theme'); } catch(e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  /* ════════════════════════════════════════════════════════════
     TOKENS ONIQ — sombre par défaut, clair via data-theme
     ════════════════════════════════════════════════════════════ */
  :root{
    --fond:#08090C; --surface:#0E1116; --surface-2:#141922; --survol:#171D26;
    --filet:#1B212B; --filet-fort:#2A3341;
    --texte:#EAEDF2; --attenue:#8B94A5; --faible:#59616F;
    --signal:#7FA8FF; --signal-r:127,168,255;
    --ok:#5FD3A6; --ok-r:95,211,166;
    --attente:#E0B15C; --attente-r:224,177,92;
    --retard:#E8796B; --retard-r:232,121,107;
    --voile:rgba(0,0,0,.6);

    --sans:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sb-w:236px;
    --bar-h:30px;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --fond:#F7F8FA; --surface:#FFFFFF; --surface-2:#F1F3F6; --survol:#EDF0F4;
      --filet:#E3E7ED; --filet-fort:#CFD5DE;
      --texte:#0B0E13; --attenue:#586274; --faible:#8B94A5;
      --signal:#2B5FD9; --signal-r:43,95,217;
      --ok:#17805C; --ok-r:23,128,92;
      --attente:#96701C; --attente-r:150,112,28;
      --retard:#B5443A; --retard-r:181,68,58;
      --voile:rgba(11,14,19,.38);
    }
  }
  :root[data-theme="light"]{
    --fond:#F7F8FA; --surface:#FFFFFF; --surface-2:#F1F3F6; --survol:#EDF0F4;
    --filet:#E3E7ED; --filet-fort:#CFD5DE;
    --texte:#0B0E13; --attenue:#586274; --faible:#8B94A5;
    --signal:#2B5FD9; --signal-r:43,95,217;
    --ok:#17805C; --ok-r:23,128,92;
    --attente:#96701C; --attente-r:150,112,28;
    --retard:#B5443A; --retard-r:181,68,58;
    --voile:rgba(11,14,19,.38);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--texte); background:var(--fond);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; letter-spacing:-.004em;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .mono{font-family:var(--mono)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--filet-fort);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:13px;color:var(--texte)}
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}

  /* ════════════════════════════════════════════════════════════
     BANDEAU DÉMO
     ════════════════════════════════════════════════════════════ */
  .demo-bar{
    flex:0 0 var(--bar-h); height:var(--bar-h);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:0 12px 0 16px; background:var(--surface); border-bottom:1px solid var(--filet);
    font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--faible); white-space:nowrap; overflow:hidden;
  }
  .demo-bar .lab{display:flex; align-items:center; gap:8px; min-width:0; overflow:hidden; text-overflow:ellipsis}
  .demo-bar .lab b{color:var(--attenue); font-weight:500}
  .demo-bar .pt{width:6px; height:6px; border-radius:50%; background:var(--signal); flex:none}
  .demo-bar .outils{display:flex; align-items:center; gap:6px; flex:none}
  .demo-bar button{
    display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 9px;
    border:1px solid var(--filet); border-radius:6px; color:var(--attenue);
    font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    transition:color .15s, border-color .15s;
  }
  .demo-bar button:hover{color:var(--texte); border-color:var(--filet-fort)}
  .demo-bar button svg{width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
  .demo-bar .i-lune{display:none}
  :root[data-theme="light"] .demo-bar .i-lune{display:block}
  :root[data-theme="light"] .demo-bar .i-soleil{display:none}

  .app{display:flex; flex:1; min-height:0; overflow:hidden}

  /* ════════════════════════════════════════════════════════════
     BARRE LATÉRALE
     ════════════════════════════════════════════════════════════ */
  .side{
    width:var(--sb-w); flex:0 0 var(--sb-w);
    background:var(--surface); border-right:1px solid var(--filet);
    display:flex; flex-direction:column; position:relative; z-index:5; min-height:0;
  }
  .side-head{padding:18px 18px 15px; border-bottom:1px solid var(--filet)}
  .wordmark{font-size:15.5px; font-weight:700; letter-spacing:-.03em; line-height:1.2; white-space:nowrap}
  .wordmark .pt{color:var(--signal)}
  .wordmark .app-nm{color:var(--attenue); font-weight:600; margin-left:3px}
  .wordmark-sub{
    margin-top:7px; font-family:var(--mono); font-size:9.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--faible);
  }

  .side-nav{flex:1; padding:6px 12px 14px; display:flex; flex-direction:column; gap:1px; overflow-y:auto; min-height:0}
  .side-nav::-webkit-scrollbar{width:6px}
  .nav-section{
    display:flex; align-items:center; gap:9px; padding:16px 8px 7px;
    font-family:var(--mono); font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--faible);
  }
  .nav-section::after{content:''; flex:1; height:1px; background:var(--filet)}
  .nav-section:first-child{padding-top:10px}
  .nav-item{
    position:relative; display:flex; align-items:center; gap:11px; width:100%;
    padding:8px 11px; border-radius:9px; border:1px solid transparent;
    color:var(--attenue); font-size:13.5px; text-align:left;
    transition:background .16s, color .16s, border-color .16s;
  }
  .nav-item:hover{background:var(--survol); color:var(--texte)}
  .nav-item.active{
    color:var(--texte); font-weight:500; background:rgba(var(--signal-r),.10);
    border-color:rgba(var(--signal-r),.22);
  }
  .nav-item.active::before{
    content:''; position:absolute; left:-12px; top:8px; bottom:8px; width:3px;
    border-radius:0 3px 3px 0; background:var(--signal);
  }
  .nav-item .ico{width:17px; height:17px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; opacity:.62}
  .nav-item:hover .ico{opacity:1}
  .nav-item.active .ico{color:var(--signal); opacity:1}
  .nav-item .ico svg{stroke-width:1.6}
  .nav-item .lbl{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .nav-item .soon{
    font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase;
    padding:1px 7px; border-radius:20px; border:1px solid var(--filet); color:var(--faible);
  }

  .side-actions{display:flex; gap:4px; padding:8px 10px; border-top:1px solid var(--filet)}
  .side-action{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    padding:8px 4px; border-radius:8px; border:1px solid transparent; color:var(--faible);
    font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase;
    transition:background .16s, color .16s, border-color .16s;
  }
  .side-action:hover{background:var(--survol); color:var(--texte); border-color:var(--filet)}

  .side-foot{padding:10px 12px 14px; border-top:1px solid var(--filet)}
  .user-card{
    display:flex; align-items:center; gap:10px; min-width:0;
    background:var(--surface-2); border:1px solid var(--filet); border-radius:11px; padding:9px 11px;
  }
  .avatar{
    width:28px; height:28px; border-radius:50%; flex-shrink:0; display:grid; place-items:center;
    font-size:11px; font-weight:600; color:var(--fond); background:var(--signal); letter-spacing:.02em;
  }
  .user-info{flex:1; min-width:0; overflow:hidden}
  .user-name{font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .user-role{font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--faible); margin-top:1px}

  /* ════════════════════════════════════════════════════════════
     ZONE PRINCIPALE
     ════════════════════════════════════════════════════════════ */
  .main{flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; background:var(--fond)}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    min-height:64px; padding:12px 28px; border-bottom:1px solid var(--filet); background:var(--fond);
  }
  .tb-eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--faible); margin-bottom:3px}
  .tb-title{font-size:19px; font-weight:600; letter-spacing:-.02em; line-height:1.2}
  #tbActions{display:flex; gap:8px; flex-wrap:wrap}
  .content{flex:1; overflow-y:auto; padding:26px 28px 60px}
  .wrap{max-width:1180px; margin:0 auto}

  /* Boutons */
  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:8px 14px;
    border-radius:8px; font-size:13px; font-weight:500; white-space:nowrap;
    background:var(--surface); border:1px solid var(--filet-fort); color:var(--texte);
    transition:background .15s, border-color .15s, opacity .15s;
  }
  .btn:hover{background:var(--survol)}
  .btn-primary{background:var(--texte); color:var(--fond); border-color:var(--texte); font-weight:600}
  .btn-primary:hover{background:var(--texte); opacity:.88}
  .btn-ghost{}
  .btn-sm{font-size:12px; padding:5px 10px}
  .btn-block{width:100%; justify-content:center}
  .btn svg{width:14px; height:14px}

  /* KPI */
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:24px}
  .kpi{background:var(--surface); border:1px solid var(--filet); border-radius:12px; padding:17px 18px; min-width:0}
  .kpi-l{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--faible); margin-bottom:10px}
  .kpi-v{font-family:var(--mono); font-weight:500; font-size:24px; letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
  .kpi-v.accent{color:var(--signal)}
  .kpi-t{font-size:12px; margin-top:8px; color:var(--attenue)}
  .kpi-t.up{color:var(--ok)} .kpi-t.down{color:var(--retard)}

  .grid2{display:grid; grid-template-columns:1.5fr 1fr; gap:16px}
  .grid2 > *{min-width:0}
  .card{background:var(--surface); border:1px solid var(--filet); border-radius:12px; padding:20px 22px}
  .card-t{font-weight:600; font-size:15px; letter-spacing:-.01em; margin-bottom:3px}
  .card-sub{font-size:12.5px; color:var(--attenue); margin-bottom:16px; line-height:1.55}
  .scroll-x{overflow-x:auto}

  .sec-h{margin:26px 0 12px}
  .sec-h .t{font-weight:600; font-size:15.5px; letter-spacing:-.015em}
  .sec-h .s{font-size:12.5px; color:var(--attenue); margin-top:3px}

  /* Barres */
  .bars{display:flex; flex-direction:column; gap:12px}
  .bar-row{display:grid; grid-template-columns:138px 1fr 58px; align-items:center; gap:12px}
  .bar-lab{font-size:12.5px; color:var(--texte); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .bar-track{height:6px; background:var(--surface-2); border-radius:20px; overflow:hidden}
  .bar-fill{height:100%; border-radius:20px; background:var(--signal)}
  .bar-val{font-family:var(--mono); font-size:12px; color:var(--attenue); text-align:right; font-variant-numeric:tabular-nums}

  /* Fil d'activité */
  .feed{display:flex; flex-direction:column}
  .feed-i{display:flex; gap:11px; padding:10px 0; border-bottom:1px solid var(--filet)}
  .feed-i:last-child{border-bottom:none}
  .feed-dot{width:7px; height:7px; border-radius:50%; margin-top:6px; flex:0 0 7px}
  .feed-tx{font-size:13px}
  .feed-tx b{font-weight:600}
  .feed-ti{font-family:var(--mono); font-size:10.5px; color:var(--faible); margin-top:2px}

  /* Pipeline */
  .pipe-stats{display:flex; gap:28px; margin-bottom:20px; flex-wrap:wrap}
  .pstat b{font-family:var(--mono); font-size:21px; font-weight:500; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
  .pstat b.accent{color:var(--signal)}
  .pstat span{display:block; margin-top:2px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--faible)}
  .board{display:flex; gap:12px; overflow-x:auto; padding-bottom:14px; align-items:flex-start}
  .col{flex:0 0 244px; background:var(--surface-2); border:1px solid var(--filet); border-radius:11px; padding:10px; min-height:120px}
  .col-h{display:flex; align-items:center; justify-content:space-between; padding:4px 6px 10px}
  .col-h .nm{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--attenue); display:flex; align-items:center; gap:8px}
  .col-h .ct{font-family:var(--mono); font-size:11px; color:var(--attenue); background:var(--surface); border:1px solid var(--filet); padding:0 8px; border-radius:20px}
  .col-stripe{width:7px; height:7px; border-radius:50%}
  .col-empty{font-size:12px; color:var(--faible); padding:10px 6px; text-align:center}
  .lead{
    background:var(--surface); border:1px solid var(--filet); border-radius:9px;
    padding:11px 12px; margin-bottom:8px; cursor:grab; transition:border-color .12s;
  }
  .lead:hover{border-color:var(--filet-fort)}
  .lead.dragging{opacity:.4}
  .lead-nm{font-weight:600; font-size:13.5px; display:flex; align-items:center; justify-content:space-between; gap:6px}
  .lead-meta{font-size:12px; color:var(--attenue); margin-top:3px}
  .lead-tags{display:flex; gap:5px; margin-top:9px; flex-wrap:wrap}
  .tag{
    display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
    padding:2px 8px; border-radius:20px; border:1px solid var(--filet); background:var(--surface-2); color:var(--attenue);
    white-space:nowrap;
  }
  .tag.bud{color:var(--texte); text-transform:none; letter-spacing:0}
  .lead-mv{display:flex; gap:4px; margin-top:9px}
  .mv{font-family:var(--mono); font-size:12px; line-height:1; color:var(--attenue); padding:4px 8px; border-radius:6px; border:1px solid var(--filet); background:var(--surface-2); cursor:pointer}
  .mv:hover{background:var(--texte); color:var(--fond); border-color:var(--texte)}
  .col.drop{outline:1px dashed var(--signal); outline-offset:-3px; background:rgba(var(--signal-r),.06)}

  /* Pastilles d'état */
  .chip{
    display:inline-block; font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:.06em;
    text-transform:uppercase; padding:2px 9px; border-radius:20px; border:1px solid; white-space:nowrap; line-height:1.6;
  }
  .e-ok{color:var(--ok); border-color:rgba(var(--ok-r),.4); background:rgba(var(--ok-r),.1)}
  .e-att{color:var(--attente); border-color:rgba(var(--attente-r),.4); background:rgba(var(--attente-r),.1)}
  .e-ret{color:var(--retard); border-color:rgba(var(--retard-r),.4); background:rgba(var(--retard-r),.1)}
  .e-sig{color:var(--signal); border-color:rgba(var(--signal-r),.4); background:rgba(var(--signal-r),.1)}
  .e-neu{color:var(--attenue); border-color:var(--filet); background:var(--surface-2)}

  /* Tableaux */
  .tbl{width:100%; border-collapse:collapse; font-size:13px; margin-top:4px}
  .tbl th{
    padding:9px 10px; text-align:left; border-bottom:1px solid var(--filet); white-space:nowrap;
    font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--faible);
  }
  .tbl td{padding:11px 10px; border-bottom:1px solid var(--filet); vertical-align:middle}
  .tbl tbody tr:last-child td{border-bottom:none}
  .tbl tbody tr{transition:background .14s}
  .tbl tbody tr:hover{background:var(--survol)}
  .tbl .n{text-align:right; font-family:var(--mono); font-size:12.5px; font-variant-numeric:tabular-nums; white-space:nowrap}
  .tbl .c{text-align:center}
  .tbl .r{text-align:right}
  .tbl .sec{color:var(--attenue)}
  .tbl .date{font-family:var(--mono); font-size:11.5px; color:var(--attenue); white-space:nowrap}
  .strong{font-weight:600}
  .em{color:var(--signal)}

  /* Lignes-cartes (listes des modules) */
  .rc{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--filet); border-radius:11px;
    padding:13px 16px; margin-bottom:8px; transition:border-color .14s;
  }
  .rc:hover{border-color:var(--filet-fort)}
  .rc.muted{opacity:.55}
  .rc-main{flex:1 1 220px; min-width:0}
  .rc-t{font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .rc-s{font-size:12px; color:var(--attenue); margin-top:3px}
  .rc-s.mono{font-size:11.5px}
  .rc-s.ell{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rc-end{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end}
  .stripe{width:3px; align-self:stretch; border-radius:2px; flex:none}
  .sq{
    width:36px; height:36px; border-radius:8px; flex:none; display:grid; place-items:center;
    background:var(--surface-2); border:1px solid var(--filet); color:var(--attenue);
    font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.04em;
  }
  .sq svg{width:16px; height:16px}
  .metrics{display:flex; gap:20px; flex-wrap:wrap}
  .metric{text-align:right; min-width:48px}
  .metric .l{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faible)}
  .metric .v{font-family:var(--mono); font-size:13.5px; font-weight:500; font-variant-numeric:tabular-nums; margin-top:1px}
  .metric.ctr{text-align:center}
  .metric.big .v{font-size:17px}
  .v.ok{color:var(--ok)} .v.att{color:var(--attente)} .v.ret{color:var(--retard)} .v.faible{color:var(--faible)} .v.em{color:var(--signal)}
  .actions-row{margin-top:11px; display:flex; gap:8px; flex-wrap:wrap}
  .rc-block{display:block}
  .rc-block .rc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap}

  /* Apporteurs */
  .app-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
  .app-card{background:var(--surface); border:1px solid var(--filet); border-radius:12px; padding:18px 20px}
  .app-card.off{opacity:.6}
  .app-head{display:flex; align-items:center; gap:13px; margin-bottom:13px}
  .ini{
    width:40px; height:40px; border-radius:9px; flex-shrink:0; display:grid; place-items:center;
    background:var(--surface-2); border:1px solid var(--filet-fort); color:var(--texte);
    font-family:var(--mono); font-weight:500; font-size:13px;
  }
  .app-nm{font-weight:600; font-size:15px; line-height:1.25}
  .app-org{font-size:12px; color:var(--attenue); margin-top:2px}
  .app-tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
  .app-stats{display:grid; grid-template-columns:repeat(3,1fr); padding:11px 0; border-top:1px solid var(--filet); border-bottom:1px solid var(--filet); margin-bottom:11px}
  .app-stats > div{text-align:center}
  .app-stats > div + div{border-left:1px solid var(--filet)}
  .app-stats .v{font-family:var(--mono); font-weight:500; font-size:16px; font-variant-numeric:tabular-nums}
  .app-stats .l{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faible); margin-top:2px}
  .app-contact{display:flex; gap:12px; font-size:12px; color:var(--attenue); align-items:center}
  .app-contact span{display:inline-flex; align-items:center; gap:6px; min-width:0}
  .app-contact .ell{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block}
  .app-contact .tel{font-family:var(--mono); font-size:11.5px; white-space:nowrap}
  .app-contact svg{width:13px; height:13px; flex:none; opacity:.7}

  /* Formulaires (simulateur / configurateur) */
  .ctl{display:flex; flex-direction:column; gap:16px}
  .ctl-l{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--faible); margin-bottom:6px}
  .range-row{display:flex; align-items:center; gap:12px}
  .range-row input[type=range]{flex:1; accent-color:var(--signal)}
  .range-v{font-family:var(--mono); font-weight:500; font-size:15px; min-width:96px; text-align:right; font-variant-numeric:tabular-nums}
  .inp{width:100%; padding:9px 11px; border:1px solid var(--filet); border-radius:8px; background:var(--surface-2); color:var(--texte)}
  .inp:focus{outline:none; border-color:var(--signal)}
  .seg{display:flex; gap:8px}
  .seg .btn{flex:1; justify-content:center}
  .opt{
    display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:6px; cursor:pointer;
    border:1px solid var(--filet); border-radius:8px; transition:border-color .14s, background .14s;
  }
  .opt:hover{border-color:var(--filet-fort)}
  .opt.on{border-color:rgba(var(--signal-r),.5); background:rgba(var(--signal-r),.07)}
  .opt input{accent-color:var(--signal); margin:0}
  .opt .p{font-family:var(--mono); font-size:12px; color:var(--attenue)}
  .opt.on .p{color:var(--signal)}
  .model-row{padding:11px 0; border-bottom:1px solid var(--filet); display:flex; justify-content:space-between; align-items:center; gap:12px}
  .model-row .px{font-family:var(--mono); font-weight:500; font-variant-numeric:tabular-nums}
  .recap{background:var(--surface-2); border-color:var(--filet-fort); display:flex; flex-direction:column; justify-content:space-between}
  .recap-l{display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:4px 0}
  .recap-l b{font-family:var(--mono); font-weight:500; font-variant-numeric:tabular-nums}
  .recap-sep{height:1px; background:var(--filet-fort); margin:10px 0}
  .recap-tot{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
  .recap-tot span{font-weight:600; font-size:14px}
  .recap-tot b{font-family:var(--mono); font-weight:500; font-size:22px; letter-spacing:-.03em; color:var(--signal)}

  /* Canaux / agences / parcours */
  .channels{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px}
  .channel{border:1px solid var(--filet); border-radius:10px; padding:10px 14px; background:var(--surface-2)}
  .channel.off{background:transparent}
  .channel b{display:block; font-size:13px; font-weight:600; margin-bottom:6px}
  .agences{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; margin-bottom:8px}
  .ag-note{font-family:var(--mono); font-weight:500; font-size:22px; letter-spacing:-.03em; text-align:right}
  .stars{letter-spacing:1px; color:var(--texte); font-size:12.5px}
  .stars .off{color:var(--filet-fort)}
  .review{padding:9px 0; border-top:1px solid var(--filet)}
  .review q{display:block; font-size:12.5px; line-height:1.45; quotes:'« ' ' »'}
  .journey{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  .step{display:inline-flex; align-items:center; gap:7px; background:var(--surface-2); border:1px solid var(--filet); padding:3px 10px; border-radius:20px; font-size:12px}
  .step small{font-family:var(--mono); font-size:10.5px; color:var(--faible)}
  .arrow{color:var(--faible); font-size:12px}
  .scorebar{width:64px; height:5px; background:var(--surface-2); border-radius:20px; overflow:hidden}
  .scorebar i{display:block; height:100%; border-radius:20px}
  .method{display:flex; flex-direction:column; gap:9px; margin-top:6px; font-size:12.5px; color:var(--attenue)}
  .method b{color:var(--texte); font-weight:600}

  /* Module « à venir » (conservé) */
  .soon-panel{text-align:center; max-width:620px; margin:30px auto; padding:44px 30px; background:var(--surface); border:1px solid var(--filet); border-radius:14px}
  .soon-ic-wrap{width:56px; height:56px; margin:0 auto 14px; background:var(--surface-2); border:1px solid var(--filet-fort); border-radius:12px; display:grid; place-items:center; color:var(--signal)}
  .soon-panel h2{font-size:22px; font-weight:600; letter-spacing:-.02em; margin-bottom:6px}
  .soon-tag{display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faible); border:1px solid var(--filet); padding:3px 12px; border-radius:20px; margin-bottom:16px}
  .soon-panel p{font-size:14px; color:var(--attenue); line-height:1.65; margin-bottom:20px}
  .soon-feats{display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:left; margin-top:10px}
  .soon-feat{display:flex; gap:9px; align-items:flex-start; font-size:12.5px}
  .soon-feat .ck{color:var(--signal); font-family:var(--mono); flex:0 0 auto}

  /* Fenêtres modales */
  .ov{position:fixed; inset:0; background:var(--voile); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; padding:20px; z-index:9999}
  .ov.show{display:flex}
  .modal{background:var(--surface); border:1px solid var(--filet-fort); border-radius:14px; width:min(480px,96vw); max-height:90vh; overflow-y:auto; box-shadow:0 12px 32px rgba(0,0,0,.18); animation:pop .22s var(--ease)}
  @keyframes pop{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  .modal-h{padding:17px 22px; border-bottom:1px solid var(--filet)}
  .modal-h h3{font-size:15.5px; font-weight:600; letter-spacing:-.01em}
  .modal-b{padding:20px 22px}
  .modal-b p{font-size:13.5px; color:var(--attenue); line-height:1.6}
  .fld{margin-bottom:13px}
  .fld label{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--faible); margin-bottom:6px}
  .fld input,.fld select{width:100%; padding:9px 11px; border:1px solid var(--filet); border-radius:8px; background:var(--surface-2); color:var(--texte); font-size:13.5px}
  .fld input::placeholder{color:var(--faible)}
  .fld input:focus,.fld select:focus{outline:none; border-color:var(--signal)}
  .fld-row{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  .modal-f{padding:14px 22px; border-top:1px solid var(--filet); display:flex; gap:9px; justify-content:flex-end}

  /* Message éphémère */
  .toasts{position:fixed; right:18px; bottom:18px; z-index:10000; display:flex; flex-direction:column; gap:8px; align-items:flex-end; pointer-events:none}
  .toast{
    display:flex; align-items:flex-start; gap:10px; max-width:380px; pointer-events:auto;
    background:var(--surface); border:1px solid var(--filet-fort); border-radius:10px; padding:11px 14px;
    font-size:13px; line-height:1.45; box-shadow:0 6px 18px rgba(0,0,0,.14);
    animation:pop .22s var(--ease);
  }
  .toast .pt{width:7px; height:7px; border-radius:50%; background:var(--signal); margin-top:6px; flex:none}
  .toast.ok .pt{background:var(--ok)}
  .toast.out{opacity:0; transform:translateY(6px); transition:opacity .25s, transform .25s}

  /* ════════════════════════════════════════════════════════════
     RESPONSIVE — tablette (1024) puis téléphone
     ════════════════════════════════════════════════════════════ */
  @media(max-width:1100px){
    .content{padding:22px 22px 50px}
    .topbar{padding:12px 22px}
    .grid2{grid-template-columns:1fr 1fr}
  }
  @media(max-width:900px){
    body{overflow:auto}
    .app{flex-direction:column; overflow:visible}
    .side{width:auto; flex:none; flex-direction:row; align-items:center; border-right:none; border-bottom:1px solid var(--filet)}
    .side-head{border-bottom:none; border-right:1px solid var(--filet); padding:12px 14px; flex:none}
    .wordmark-sub{display:none}
    .side-nav{flex-direction:row; overflow-x:auto; padding:8px 10px; gap:4px}
    .nav-section,.side-actions,.side-foot{display:none}
    .nav-item{white-space:nowrap; width:auto; padding:7px 10px}
    .nav-item.active::before{display:none}
    .main{overflow:visible}
    .content{overflow:visible}
    .grid2{grid-template-columns:1fr}
    .kpis{grid-template-columns:1fr 1fr}
    .bar-row{grid-template-columns:110px 1fr 52px}
  }
  @media(max-width:560px){
    .content{padding:18px 14px 50px}
    .topbar{padding:12px 14px}
    .fld-row,.soon-feats{grid-template-columns:1fr}
    .demo-bar .lab .long{display:none}
    .demo-bar .txt{display:none}
    .metrics{gap:14px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>

const DEMO = {

function notify(msg, kind){
  const box = document.getElementById('toasts'); if(!box) return;
  const t = document.createElement('div');
  t.className = 'toast' + (kind==='ok' ? ' ok' : '');
  t.innerHTML = '<span class="pt"></span><span></span>';
  t.lastChild.textContent = msg;
  box.appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(), 300); }, 3600);
}
const INSTALLED = 'Disponible dans la version installée.';

function askConfirm(title, msg, okLabel){
  return new Promise(resolve=>{
    const ov = document.getElementById('ovConfirm');
    document.getElementById('cfT').textContent = title;
    document.getElementById('cfMsg').textContent = msg;
    const yes = document.getElementById('cfYes'), no = document.getElementById('cfNo');
    yes.textContent = okLabel || 'Confirmer';
    const done = v => { ov.classList.remove('show'); yes.onclick = no.onclick = ov.onclick = null; resolve(v); };
    yes.onclick = () => done(true);
    no.onclick  = () => done(false);
    ov.onclick  = e => { if(e.target === ov) done(false); };
    ov.classList.add('show');
    setTimeout(()=>yes.focus(), 30);
  });
}

function currentTheme(){ return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
function setTheme(t, save){
  document.documentElement.setAttribute('data-theme', t);
  if (save) { try { localStorage.setItem('oq-theme', t); } catch(e) {} }
}
/* Le CRM (même origine) peut changer le thème pendant que la démo est ouverte. */
window.addEventListener('storage', e=>{ if(e.key==='oq-theme' && (e.newValue==='dark'||e.newValue==='light')) setTheme(e.newValue, false); });
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: light)');
  const onMq = () => { let s=null; try{ s = localStorage.getItem('oq-theme'); }catch(e){} if(s!=='dark'&&s!=='light') setTheme(mq.matches?'light':'dark', false); };
  if (mq.addEventListener) mq.addEventListener('change', onMq);
}

const DemoSupabase = (function(){
  const KEY = DEMO.prefix + 'db';
  let db = null;
  const clone = o => JSON.parse(JSON.stringify(o));
  function load(){
    if (db) return;
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const d = JSON.parse(raw); if (d && d.v === DEMO.version && d.tables) { db = d; return; } }
    } catch(e) {}
    db = demoSeed(); persist();
  }
  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {} }
  function nextId(t){ db.seq[t] = (db.seq[t]||0) + 1; return db.seq[t]; }

  function from(table){
    const st = {op:'select', vals:null, filters:[], order:null, limit:null, single:false};
    function run(){
      try {
        const rows = db.tables[table];
        if (!rows) return {data:null, error:{message:'relation "'+table+'" does not exist'}};
        const match = r => st.filters.every(f=>f(r));
        const now = new Date().toISOString();
        if (st.op === 'insert'){
          const list = (Array.isArray(st.vals) ? st.vals : [st.vals]).map(v=>{
            const row = Object.assign({id:nextId(table), created_at:now}, v);
            if (table==='om_radar_signaux' && !row.detected_at) row.detected_at = now;
            if (['om_leads','om_apporteurs','om_commissions','om_seo_pages'].includes(table)) row.updated_at = now;
            rows.push(row); return row;
          });
          persist();
          const out = clone(list);
          return {data: st.single ? out[0] : out, error:null};
        }
        if (st.op === 'update'){
          const hit = rows.filter(match);
          hit.forEach(r=>{ Object.assign(r, st.vals); if ('updated_at' in r) r.updated_at = now; });
          persist();
          const out = clone(hit);
          return {data: st.single ? (out[0]||null) : out, error:null};
        }
        if (st.op === 'delete'){
          const keep = rows.filter(r=>!match(r));
          const gone = rows.length - keep.length;
          db.tables[table] = keep; persist();
          return {data:null, error:null, count:gone};
        }
        let out = rows.filter(match);
        if (st.order){
          const {col, asc} = st.order;
          out = out.slice().sort((a,b)=> (a[col] > b[col] ? 1 : a[col] < b[col] ? -1 : 0) * (asc ? 1 : -1));
        }
        if (st.limit != null) out = out.slice(0, st.limit);
        out = clone(out);
        return {data: st.single ? (out[0]||null) : out, error:null};
      } catch(err) {
        return {data:null, error:{message:String(err && err.message || err)}};
      }
    }
    const q = {
      select(){ return q; },
      insert(v){ st.op='insert'; st.vals=v; return q; },
      update(v){ st.op='update'; st.vals=v; return q; },
      delete(){ st.op='delete'; return q; },
      eq(c,v){ st.filters.push(r=>r[c]===v); return q; },
      in(c,vs){ st.filters.push(r=>(vs||[]).includes(r[c])); return q; },
      order(c,o){ st.order={col:c, asc:!(o && o.ascending===false)}; return q; },
      limit(n){ st.limit=n; return q; },
      single(){ st.single=true; return q; },
      then(ok, ko){ return Promise.resolve().then(run).then(ok, ko); },
    };
    return q;
  }
  return {
    createClient(){ load(); return {from}; },
    reset(){
      try { Object.keys(localStorage).filter(k=>k.indexOf(DEMO.prefix)===0).forEach(k=>localStorage.removeItem(k)); } catch(e) {}
      db = demoSeed(); persist();
    },
  };
})();

   noms en snake_case côté SQL, on convertit pour rester compatible

const fmtMonth = d => { if(!d) return ''; const x = new Date(d); return isNaN(x) ? d : x.toLocaleDateString('fr-FR',{month:'short', year:'numeric'}); };
const fmtDate  = d => { if(!d) return ''; const x = new Date(d); return isNaN(x) ? d : x.toLocaleDateString('fr-FR'); };
const mapLeadFromDB        = r => ({id:r.id, name:r.name, email:r.email||'', tel:r.tel||'', src:r.src||'', bud:r.bud||'', zone:r.zone||'', stage:r.stage||'new', apporteur_id:r.apporteur_id||null});
const mapApporteurFromDB   = r => ({id:r.id, nm:r.nm, org:r.org||'', type:r.type, tel:r.tel||'', email:r.email||'', com:r.com||'', status:r.status||'actif', leads:0, signed:0, due:0});
const mapCommissionFromDB  = (r, appByid) => ({id:r.id, appNm:(appByid[r.apporteur_id]||{}).nm||'?', client:r.client_name, ccmi:r.ccmi_amount, com:r.com_amount, dec:r.deblocage_date||'', etat:r.status==='payée'?'payée':'à verser', payDate:r.paid_date||null, apporteur_id:r.apporteur_id, lead_id:r.lead_id||null});
const mapRadarFromDB       = r => ({id:r.id, type:r.type, zone:r.zone, sig:r.signal_info||'', terrain:r.terrain_size||'', score:r.score||0, st:r.score>=80?'chaud':r.score>=50?'tiède':'froid', date:r.detected_at?(new Date(r.detected_at)).toLocaleDateString('fr-FR'):'', status:r.status});

/* Charge l'état depuis le stockage (mêmes requêtes que la version Supabase). */
async function loadFromSupabase(){
  if (!SB_READY) return false;
  try {
    const [leads, apps, comms, parr, fill, radar] = await Promise.all([
      SB.from('om_leads').select('*').order('created_at',{ascending:false}),
      SB.from('om_apporteurs').select('*').order('created_at',{ascending:false}),
      SB.from('om_commissions').select('*').order('created_at',{ascending:false}),
      SB.from('om_parrains').select('*').order('created_at',{ascending:false}),
      SB.from('om_filleuls').select('*'),
      SB.from('om_radar_signaux').select('*').order('detected_at',{ascending:false}).limit(50),
    ]);
    if (leads.data) LEADS = leads.data.map(mapLeadFromDB);
    if (apps.data)  APPORTEURS = apps.data.map(mapApporteurFromDB);
    if (comms.data) {
      const appByid = Object.fromEntries(APPORTEURS.map(a=>[a.id,a]));
      COMMISSIONS = comms.data.map(r=>mapCommissionFromDB(r, appByid));
      // Stats apporteurs : leads apportés + signés + commission cumulée
      APPORTEURS.forEach(a=>{
        const cs = COMMISSIONS.filter(c=>c.apporteur_id===a.id);
        // leads apportés = dossiers commissionnés + leads encore dans le pipeline
        const open = LEADS.filter(l=>l.apporteur_id===a.id && !cs.some(c=>c.lead_id===l.id)).length;
        a.leads  = cs.length + open;
        a.signed = cs.filter(c=>c.ccmi>0).length;
        a.due    = cs.filter(c=>c.etat==='à verser').reduce((s,c)=>s+c.com,0);
      });
    }
    if (parr.data) PARRAINS = parr.data.map(p=>({
      id:p.id, nm:p.client_name, livre:fmtMonth(p.livraison_date), ref:p.ref_code||'',
      filleuls: (fill.data||[]).filter(f=>f.parrain_id===p.id).map(f=>({
        id:f.id, nm:f.nm, etat:f.etat, prime:f.prime||0, date:fmtMonth(f.signed_date||f.created_at)
      }))
    }));
    if (radar.data && radar.data.length) RADAR_SIG = radar.data.map(mapRadarFromDB);
    return true;
  } catch(e){ console.error('[OM] chargement stockage démo:', e); return false; }
}

/* ════════════════════════ CONVERSION — pipeline de leads ════════════════════════ */
function viewLeads(){
  const total = LEADS.length;
  const active = LEADS.filter(l=>!['sign','lost'].includes(l.stage)).length;
  const signed = LEADS.filter(l=>l.stage==='sign').length;
  const conv = total? Math.round(signed/total*100):0;
  const stats = `
    <div class="pipe-stats">
      <div class="pstat"><b>${total}</b><span>Total leads</span></div>
      <div class="pstat"><b>${active}</b><span>En cours</span></div>
      <div class="pstat"><b>${signed}</b><span>Signés</span></div>
      <div class="pstat"><b class="accent">${conv}%</b><span>Conversion</span></div>
    </div>`;
  const cols = STAGES.map(s=>{
    const list = LEADS.filter(l=>l.stage===s.id);
    const cards = list.map(l=>leadCard(l)).join('') || `<div class="col-empty">—</div>`;
    return `
      <div class="col" data-stage="${s.id}">
        <div class="col-h">
          <div class="nm"><span class="col-stripe" style="background:${s.c}"></span>${s.nm}</div>
          <div class="ct">${list.length}</div>
        </div>
        ${cards}
      </div>`;
  }).join('');
  return stats + `<div class="board">${cols}</div>`;
}

function leadCard(l){
  const idx = STAGES.findIndex(s=>s.id===l.stage);
  const prev = idx>0 ? `<span class="mv" role="button" tabindex="0" title="Reculer" onclick="move(${l.id},-1)">←</span>` : '';
  const next = idx<STAGES.length-1 ? `<span class="mv" role="button" tabindex="0" title="Avancer" onclick="move(${l.id},1)">→</span>` : '';
  return `
  <div class="lead" draggable="true" data-id="${l.id}">
    <div class="lead-nm">${esc(l.name)}</div>
    <div class="lead-meta">${esc(l.zone)}</div>
    <div class="lead-tags"><span class="tag">${esc(l.src)}</span><span class="tag bud">${esc(l.bud)}</span></div>
    <div class="lead-mv">${prev}${next}</div>
  </div>`;
}
function move(id, dir){
  const l = LEADS.find(x=>x.id===id); if(!l) return;
  const idx = STAGES.findIndex(s=>s.id===l.stage);
  const ni = Math.min(Math.max(idx+dir,0),STAGES.length-1);
  l.stage = STAGES[ni].id;
  sbUpdateLeadStage(l.id, l.stage);   // persistance en arrière-plan (non bloquant)
  renderView();
}

let dragId = null;
function bindDnD(){
  document.querySelectorAll('.lead').forEach(el=>{
    el.addEventListener('dragstart',e=>{ dragId=+el.dataset.id; el.classList.add('dragging'); });
    el.addEventListener('dragend',e=>{ el.classList.remove('dragging'); dragId=null; });
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{ e.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave',e=>col.classList.remove('drop'));
    col.addEventListener('drop',e=>{
      e.preventDefault(); col.classList.remove('drop');
      const l = LEADS.find(x=>x.id===dragId);
      if(l){ l.stage = col.dataset.stage; sbUpdateLeadStage(l.id, l.stage); renderView(); }
    });
  });
  /* Clavier : Entrée / Espace sur les flèches ← → */
  document.querySelectorAll('.mv').forEach(b=>b.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); b.click(); } }));
}

     pour primo-accédant, plafonné selon revenus. Ici approximation lisible. */

/* — Lead scoring : score prédictif ———————————————————— */
function viewScore(){
  /* Scoring simulé sur les LEADS existants : on génère un score basé sur stage + source. */
  const scoreOf = l => {
    let s = 30;
    if (l.stage==='qual') s += 35;
    if (l.stage==='rdv')  s += 50;
    if (l.stage==='sign') s += 70;
    if (l.stage==='cont') s += 15;
    if (l.bud==='> 400 k€') s += 12;
    if (l.bud==='300–400 k€') s += 8;
    if (l.src==='Configurateur' || l.src==='Simulateur PTZ') s += 7;
    return Math.min(s, 99);
  };
  const scored = LEADS.map(l => ({...l, score:scoreOf(l)})).filter(l=>!['sign','lost'].includes(l.stage)).sort((a,b)=>b.score-a.score);
  const chauds = scored.filter(l=>l.score>=70).length;
  const tiedes = scored.filter(l=>l.score>=40 && l.score<70).length;
  const froids = scored.filter(l=>l.score<40).length;
  const kpis = kpiRow([
    {l:'Leads scorés', v:scored.length},
    {l:'Chauds (≥70)', v:chauds, accent:true, t:'à appeler aujourd’hui'},
    {l:'Tièdes (40-69)', v:tiedes, t:'à nourrir'},
    {l:'Froids (<40)', v:froids, t:'à requalifier'},
  ]);
  const rows = scored.map(l=>{
    const c = l.score>=70?'red':l.score>=40?'amber':'stone';
    return `
    <div class="rc">
      <div class="rc-main"><div class="rc-t">${esc(l.name)}</div><div class="rc-s">${esc(l.zone)}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag">${esc(l.src)}</span><span class="tag bud">${esc(l.bud)}</span></div>
      <div class="metric"><div class="l">Score</div>
        <div style="display:flex;align-items:center;gap:9px;justify-content:flex-end;margin-top:2px"><div class="scorebar"><i style="width:${l.score}%;background:${toneVar(c)}"></i></div><span class="v ${toneCls(c)}" style="font-size:15px">${l.score}</span></div>
      </div>
      ${chip(l.score>=70?'Chaud — rappeler maintenant':l.score>=40?'tiède':'froid', c)}
    </div>`;
  }).join('');
  return kpis + sectionTitle('Top des leads à activer', 'Modèle IA entraîné sur vos signatures précédentes — alerte « moment idéal »') + rows;
}

        <th>Apporteur</th><th>Client signé</th><th class="r">Montant CCMI</th>
        <th class="r">Commission</th><th>Dates</th><th class="r">Statut</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}
async function commPay(){
  const aVerser = COMMISSIONS.filter(c=>c.etat==='à verser');
  if(!aVerser.length){ notify('Aucune commission en attente'); return; }
  const total = aVerser.reduce((s,c)=>s+c.com,0);
  if(!(await askConfirm('Paiement groupé', 'Confirmer le paiement SEPA groupé de '+aVerser.length+' commissions ('+fmtEur(total)+') ?', 'Confirmer le paiement'))) return;
  const today = new Date().toISOString().slice(0,10);
  const dbIds = aVerser.map(c=>c.id).filter(id=>typeof id === 'number');
  await sbMarkCommissionsPaid(dbIds, today);
  aVerser.forEach(c=>{ c.etat='payée'; c.payDate=today; });
  APPORTEURS.forEach(a=>{ if(aVerser.some(c=>c.apporteur_id===a.id)) a.due = COMMISSIONS.filter(c=>c.apporteur_id===a.id && c.etat==='à verser').reduce((s,c)=>s+c.com,0); });
  renderView();
  notify(aVerser.length+' commissions marquées payées — virement SEPA groupé simulé (démo).','ok');
}

/* — Parrainage : programme parrain ———————————————————— */
let PARRAINS = [];   // rempli depuis om_parrains + om_filleuls
function viewParrain(){
  const totalFilleuls = PARRAINS.reduce((s,p)=>s+p.filleuls.length,0);
  const signes = PARRAINS.reduce((s,p)=>s+p.filleuls.filter(f=>f.etat==='signé').length, 0);
  const primesVersees = PARRAINS.reduce((s,p)=>s+p.filleuls.reduce((ss,f)=>ss+f.prime,0), 0);
  const taux = totalFilleuls? Math.round(signes/totalFilleuls*100):0;
  const kpis = kpiRow([
    {l:'Parrains actifs', v:PARRAINS.length},
    {l:'Filleuls en cours', v:totalFilleuls, accent:true, t:`${signes} signés`},
    {l:'Taux signature', v:taux+' %', t:'▲ 3× le taux moyen'},
    {l:'Primes versées', v:fmtEur(primesVersees), t:'cumul 12 mois'},
  ]);
  const etatColor = e => ({'signé':'green','visite agence':'amber','lien cliqué':'blue','lien envoyé':'stone'})[e] || 'stone';
  const cards = PARRAINS.map(p=>{
    const filleulsHtml = p.filleuls.map(f=>`
      <div class="model-row">
        <div><div style="font-weight:500;font-size:13px">${esc(f.nm)}</div><div class="feed-ti">${f.date}</div></div>
        <div style="display:flex;gap:8px;align-items:center">${chip(f.etat, etatColor(f.etat))}${f.prime?`<span class="mono strong" style="font-size:12.5px">+${fmtEur(f.prime)}</span>`:''}</div>
      </div>`).join('');
    return `
    <div class="card" style="padding:16px 18px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:12px;flex-wrap:wrap">
        <div>
          <div class="app-nm">${esc(p.nm)}</div>

      </div>
      ${filleulsHtml}
    </div>`;
  }).join('');
  return kpis + sectionTitle('Vos meilleurs parrains', 'Vos clients livrés deviennent vos meilleurs apporteurs — prime à la signature du CCMI parrainé') + cards;
}

/* — Attribution multi-touch ——————————————————————— */
const ATTRIB_CONV = [
  {nm:'Famille Teyssier',     sign:dayAgo(38), valeur:247000, parcours:[{c:'Parrainage',j:'-160j'},{c:'Configurateur',j:'-134j'},{c:'WhatsApp',j:'-91j'},{c:'Visite chantier',j:'-31j'}], canalPrim:'Parrainage'},
  {nm:'Léa & Hugo Chaix',     sign:dayAgo(46), valeur:268000, parcours:[{c:'Apporteur (Laurent V.)',j:'-205j'},{c:'Configurateur',j:'-171j'},{c:'Email nurturing',j:'-140j'},{c:'JPO Valence',j:'-88j'},{c:'RDV agence',j:'-35j'}], canalPrim:'Apporteur'},
  {nm:'Antoine Delorme',      sign:dayAgo(60), valeur:238000, parcours:[{c:'Google Ads',j:'-228j'},{c:'Simulateur PTZ',j:'-201j'},{c:'Email nurturing',j:'-156j'},{c:'Apporteur (Julien R.)',j:'-80j'},{c:'RDV agence',j:'-26j'}], canalPrim:'Google Ads'},
  {nm:'Sophie & Marc Imbert', sign:dayAgo(82), valeur:289000, parcours:[{c:'Meta/Insta',j:'-187j'},{c:'Reel terrain',j:'-176j'},{c:'Chatbot IA',j:'-145j'},{c:'JPO Montélimar',j:'-67j'}], canalPrim:'Meta/Insta'},
];
function viewAttrib(){
  const total = ATTRIB_CONV.length;
  const ca = ATTRIB_CONV.reduce((s,c)=>s+c.valeur,0);
  const touchAvg = fmtDec(ATTRIB_CONV.reduce((s,c)=>s+c.parcours.length,0)/total, 1);
  const cycleAvg = Math.round(ATTRIB_CONV.reduce((s,c)=>{
    const first = parseInt(c.parcours[0].j); return s + Math.abs(first);
  },0)/total);
  const byCanal = {};
  ATTRIB_CONV.forEach(c=>c.parcours.forEach(p=>{byCanal[p.c]=(byCanal[p.c]||0)+c.valeur/c.parcours.length;}));
  const sorted = Object.entries(byCanal).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxC = sorted[0][1];
  const kpis = kpiRow([
    {l:'Signatures attribuées', v:total},
    {l:'CA attribué', v:fmtK(ca), accent:true},
    {l:'Touchpoints moyens', v:touchAvg, t:'avant signature'},
    {l:'Cycle moyen', v:cycleAvg+' j', t:'≈ '+(cycleAvg/30).toFixed(0)+' mois'},
  ]);
  const bars = sorted.map(([k,v])=>`
    <div class="bar-row">
      <div class="bar-lab">${k}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxC*100)}%"></div></div>
      <div class="bar-val">${fmtK(v)}</div>
    </div>`).join('');
  const journeys = ATTRIB_CONV.map(c=>`
    <div class="rc rc-block">
      <div class="rc-top" style="align-items:center;margin-bottom:11px">
        <div><b>${c.nm}</b> <span class="rc-s mono" style="margin-left:8px">signé ${fmtDate(c.sign)}</span></div>
        <div class="rc-end">${chip(c.canalPrim,'neutral')}<b class="mono" style="font-weight:500">${fmtEur(c.valeur)}</b></div>
      </div>
      <div class="journey">${c.parcours.map((p,i)=>`<span class="step"><b>${p.c}</b><small>${p.j}</small></span>${i<c.parcours.length-1?'<span class="arrow">→</span>':''}`).join('')}</div>
    </div>`).join('');
  return kpis + `
  <div class="grid2">
    <div class="card">
      <div class="card-t">CA attribué par canal</div>
      <div class="card-sub">Modèle multi-touch — chaque canal du parcours reçoit sa part du CA signé</div>
      <div class="bars" style="margin-top:14px">${bars}</div>
    </div>
    <div class="card">
      <div class="card-t">Méthodologie</div>
      <div class="card-sub">Le cycle CCMI dure 6 à 18 mois — l’attribution au « dernier clic » classique est aveugle. Ici, on garde la trace de TOUTES les interactions pour donner sa juste valeur à chaque canal.</div>
      <div class="method">
        <div><b>Premier touch</b> · ${ATTRIB_CONV[0].parcours[0].c}</div>
        <div><b>Dernier touch</b> · ${ATTRIB_CONV[0].parcours[ATTRIB_CONV[0].parcours.length-1].c}</div>
        <div><b>Modèle utilisé</b> · linéaire (uniforme entre touchpoints)</div>
        <div><b>Cycle moyen</b> · <span class="mono">${cycleAvg}</span> jours</div>
      </div>
    </div>
  </div>
  ${sectionTitle('Parcours détaillés des signataires')}
  ${journeys}`;
}

/* — ROI marketing par canal ——————————————————————— */
const ROI_CANAUX = [
  {canal:'SEO local',     invest:1200,  leads:48, signes:6, ca:1488000, panMoy:248000},
  {canal:'Google Ads',    invest:14500, leads:73, signes:8, ca:1720000, panMoy:215000},
  {canal:'Meta / Insta',  invest:8400,  leads:47, signes:4, ca:856000,  panMoy:214000},
  {canal:'TikTok',        invest:2200,  leads:14, signes:1, ca:198000,  panMoy:198000},
  {canal:'Apporteurs',    invest:11200, leads:21, signes:6, ca:1430000, panMoy:238000},
  {canal:'Parrainage',    invest:2000,  leads:9,  signes:3, ca:740000,  panMoy:247000},
  {canal:'Salons / JPO',  invest:6500,  leads:38, signes:5, ca:1180000, panMoy:236000},
  {canal:'Chatbot IA',    invest:880,   leads:62, signes:4, ca:920000,  panMoy:230000},
];
function viewRoi(){
  const t = ROI_CANAUX.reduce((a,r)=>({inv:a.inv+r.invest, l:a.l+r.leads, s:a.s+r.signes, ca:a.ca+r.ca}),{inv:0,l:0,s:0,ca:0});
  const cpl = t.l? Math.round(t.inv/t.l):0;
  const cpa = t.s? Math.round(t.inv/t.s):0;
  const roas = (t.ca/t.inv).toFixed(0);
  const kpis = kpiRow([
    {l:'Investissement marketing', v:fmtEur(t.inv)},
    {l:'CA généré', v:fmtK(t.ca), accent:true},
    {l:'ROAS portefeuille', v:roas+'×', t:'▲ +5× vs M-3'},
    {l:'Coût par signature', v:fmtEur(cpa), t:'CPL : '+fmtEur(cpl)},
  ]);
  const enriched = ROI_CANAUX.map(r=>({
    ...r,
    cpl: r.leads? Math.round(r.invest/r.leads) : 0,
    cps: r.signes? Math.round(r.invest/r.signes) : 0,
    roas: r.invest? (r.ca/r.invest).toFixed(0) : 0,
  })).sort((a,b)=>b.roas-a.roas);
  const rows = enriched.map(r=>`
    <tr>
      <td class="strong">${r.canal}</td>
      <td class="n">${fmtEur(r.invest)}</td>
      <td class="n">${r.leads}</td>
      <td class="n">${fmtEur(r.cpl)}</td>
      <td class="n strong">${r.signes}</td>
      <td class="n">${fmtEur(r.cps)}</td>
      <td class="n">${fmtK(r.ca)}</td>
      <td class="n" style="color:${r.roas>=50?'var(--ok)':r.roas>=20?'var(--texte)':'var(--attente)'}">${r.roas}×</td>
    </tr>`).join('');
  return kpis + `
  <div class="card scroll-x">
    <div class="card-t">ROI par canal d’acquisition</div>
    <div class="card-sub">Triés par ROAS décroissant — sur la base des 30 derniers jours d’investissement et des signatures attribuées sur 12-18 mois.</div>
    <table class="tbl">
      <thead><tr>
        <th>Canal</th><th class="r">Invest.</th><th class="r">Leads</th><th class="r">CPL</th>
        <th class="r">Signés</th><th class="r">CPS</th><th class="r">CA</th><th class="r">ROAS</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

/* ════════════════════════ MODALE LEAD ════════════════════════ */
function openModal(){ document.getElementById('ov').classList.add('show'); setTimeout(()=>document.getElementById('f-name').focus(), 30); }
function closeModal(){ document.getElementById('ov').classList.remove('show'); }
async function saveLead(){
  const v = id=>document.getElementById(id).value.trim();
  const name = v('f-name');
  if(!name){ document.getElementById('f-name').focus(); return; }
  const lead = { name, email:v('f-email'), tel:v('f-tel'),
                 src:v('f-src'), bud:v('f-bud'),
                 zone:v('f-zone')||'Projet à préciser', stage:'new' };
  /* Persistance dans le stockage de démo ; sinon ID local de repli. */
  const dbId = await sbInsertLead(lead);
  lead.id = dbId || (++seq);
  LEADS.unshift(lead);
  ['f-name','f-email','f-tel','f-zone'].forEach(i=>document.getElementById(i).value='');
  closeModal();
  if(current!=='leads') go('leads'); else renderView();
}
document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeModal(); });
document.getElementById('ovApp').addEventListener('click',e=>{ if(e.target.id==='ovApp') closeAppModal(); });
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(document.getElementById('ov').classList.contains('show')) closeModal();
  if(document.getElementById('ovApp').classList.contains('show')) closeAppModal();
  if(document.getElementById('ovConfirm').classList.contains('show')) document.getElementById('cfNo').click();
});

(async function boot(){
  /* 1) Stockage local de démo (instantané, sans réseau) puis chargement des tables om_*. */
  try{
    const ok = await initSupabase();
    if (ok) await loadFromSupabase();
  } catch(e){ console.warn('[OM] démarrage stockage démo:', e); }
  /* 2) Écran repris après un rechargement (ex. réinitialisation). */
  try { const v = sessionStorage.getItem(DEMO.prefix+'vue'); if (v && FLAT[v]) current = v; } catch(e) {}
  renderNav();
  renderView();
})();
