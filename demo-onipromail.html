<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ONIQ. OniPromail — Démo</title>
<!--
  ╔══════════════════════════════════════════════════════════════════╗
  ║  OniPromail · démo autonome (charte ONIQ)                        ║
  ║  Extrait du client OniPromail embarqué dans la plateforme ONIQ   ║
  ║  (ONIPROMAIL_DATA_URL, version « envoi réel Resend + domaine »). ║
  ║  Vanilla JS, fichier unique, aucun backend.                      ║
  ║  Données : localStorage « oniq-demo-onipromail-state »           ║
  ║  Pont parent (Supabase / Resend / Mistral) → simulé localement.  ║
  ╚══════════════════════════════════════════════════════════════════╝
-->
<script>
/* Thème : oq-theme (clé du CRM, même origine) puis prefers-color-scheme. */
(function(){
  var t=null;
  try{ t=localStorage.getItem('oq-theme'); }catch(e){}
  if(t!=='dark' && t!=='light'){
    t=(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  }
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════════════════════════════
   ONIPROMAIL — charte ONIQ (oniq.online / CRM)
   Sobre, technique, filets d'un pixel, monochrome sauf pour le sens.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --bandeau:30px; --rail:248px; --barre:62px;
  --fond:#08090C; --surface:#0E1116; --surface-2:#141922; --survol:#171D26;
  --filet:#1B212B; --filet-fort:#2A3341;
  --texte:#EAEDF2; --attenue:#8B94A5; --faible:#59616F;
  --signal:#7FA8FF; --signal-r:127,168,255;
  --ok:#5FD3A6; --ok-r:95,211,166;
  --attente:#E0B15C; --attente-r:224,177,92;
  --retard:#E8796B; --retard-r:232,121,107;
  --ombre-modale:0 24px 60px -24px rgba(0,0,0,.6);
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme]){
    --fond:#F7F8FA; --surface:#FFFFFF; --surface-2:#F1F3F6; --survol:#EDF0F4;
    --filet:#E3E7ED; --filet-fort:#CFD5DE;
    --texte:#0B0E13; --attenue:#586274; --faible:#8B94A5;
    --signal:#2B5FD9; --signal-r:43,95,217;
    --ok:#17805C; --ok-r:23,128,92;
    --attente:#96701C; --attente-r:150,112,28;
    --retard:#B5443A; --retard-r:181,68,58;
    --ombre-modale:0 24px 60px -28px rgba(11,14,19,.28);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --fond:#F7F8FA; --surface:#FFFFFF; --surface-2:#F1F3F6; --survol:#EDF0F4;
  --filet:#E3E7ED; --filet-fort:#CFD5DE;
  --texte:#0B0E13; --attenue:#586274; --faible:#8B94A5;
  --signal:#2B5FD9; --signal-r:43,95,217;
  --ok:#17805C; --ok-r:23,128,92;
  --attente:#96701C; --attente-r:150,112,28;
  --retard:#B5443A; --retard-r:181,68,58;
  --ombre-modale:0 24px 60px -28px rgba(11,14,19,.28);
  color-scheme:light;
}
:root{
  /* Catégories IA : la couleur ne dit que le sens (urgence, argent, affaire, client) */
  --cat-urgent:var(--retard); --cat-client:var(--signal); --cat-devis:var(--ok); --cat-facture:var(--attente);
  --cat-fournisseur:var(--attenue); --cat-newsletter:var(--faible); --cat-interne:var(--attenue);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font:400 14px/1.55 var(--sans);background:var(--fond);color:var(--texte);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.004em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--signal);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-weight:600;letter-spacing:-.02em;color:var(--texte);line-height:1.2}
::selection{background:rgba(var(--signal-r),.28)}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--filet-fort);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
svg.i{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ═══ Bandeau démo ═══ */
.demo-band{position:fixed;top:0;left:0;right:0;height:var(--bandeau);z-index:70;
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;
  background:var(--surface);border-bottom:1px solid var(--filet);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--attenue)}
.demo-band .txt{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap;overflow:hidden}
.demo-band .pt{width:6px;height:6px;border-radius:50%;background:var(--attente);flex:none}
.demo-band .sec{font-family:var(--sans);font-size:12px;letter-spacing:0;text-transform:none;color:var(--faible);overflow:hidden;text-overflow:ellipsis}
.demo-band button{flex:none;background:none;border:1px solid var(--filet);border-radius:6px;padding:3px 9px;cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--attenue);transition:color .15s,border-color .15s}
.demo-band button:hover{color:var(--texte);border-color:var(--filet-fort)}

/* ═══ Charpente ═══ */
.hdr-sync-hidden{display:none!important}
.app-body{padding-left:var(--rail);padding-top:var(--bandeau);min-height:100vh}
.side{position:fixed;top:var(--bandeau);left:0;bottom:0;width:var(--rail);z-index:40;
  background:var(--surface);border-right:1px solid var(--filet);
  display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.side::-webkit-scrollbar{width:6px}
.marque{padding:17px 18px 15px;border-bottom:1px solid var(--filet);display:flex;align-items:baseline;gap:8px;min-width:0}
.marque .mot{font-size:16px;font-weight:700;letter-spacing:-.03em;color:var(--texte)}
.marque .mot i{font-style:normal;color:var(--signal)}
.marque .nom{font-size:15px;font-weight:500;letter-spacing:-.02em;color:var(--attenue)}

.side-nav{flex:1;padding:10px 12px 12px;display:flex;flex-direction:column;gap:1px}
.nav-section{display:flex;align-items:center;gap:9px;margin:14px 2px 6px;
  font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faible);white-space:nowrap}
.nav-section::after{content:"";flex:1;height:1px;background:var(--filet)}

.btn-compose{margin:4px 0 6px;padding:10px 14px;border-radius:8px;border:1px solid var(--texte);
  background:var(--texte);color:var(--fond);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:600;transition:opacity .15s}
.btn-compose:hover{opacity:.88}

.nav-item,.cat-item{position:relative;display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:8px 11px;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;
  color:var(--attenue);font-size:13.5px;transition:background .16s,color .16s,border-color .16s}
.nav-item .ico{width:16px;display:inline-flex;align-items:center;justify-content:center;flex:none;opacity:.7}
.nav-item .ico svg{width:16px;height:16px}
.nav-item .lbl,.cat-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item:hover,.cat-item:hover{background:var(--survol);color:var(--texte)}
.nav-item:hover .ico{opacity:1}
.nav-item.active,.cat-item.active{color:var(--texte);font-weight:500;
  border-color:rgba(var(--signal-r),.22);background:rgba(var(--signal-r),.09)}
.nav-item.active::before,.cat-item.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:var(--signal)}
.nav-item.active .ico{opacity:1;color:var(--signal)}
.nav-item .count{flex:none;font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums;
  background:rgba(var(--signal-r),.12);border:1px solid rgba(var(--signal-r),.3);border-radius:20px;padding:0 7px;color:var(--signal)}
.nav-item .count.hidden{display:none}
.nav-item .count.neutre{background:var(--surface-2);border-color:var(--filet);color:var(--attenue)}
.cat-item{padding:6px 11px;font-size:13px}
.cat-dot{width:8px;height:8px;border-radius:50%;flex:none}
.cat-dot.creux{background:transparent!important;border:1.5px solid currentColor}
.cat-item .cnt{font-family:var(--mono);font-size:10.5px;color:var(--faible)}

/* Sélecteur de boîtes (alias) */
.alias-switcher{margin:4px 0 8px;border:1px solid var(--filet);border-radius:10px;background:var(--surface-2);overflow:hidden}
.alias-switcher>button{width:100%;text-align:left;padding:9px 11px;background:none;border:none;display:flex;align-items:center;gap:10px;cursor:pointer}
.as-av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:600;color:var(--fond);background:var(--signal)}
.as-av.tout{background:var(--surface);color:var(--attenue);border:1px solid var(--filet-fort);font-size:13px}
.as-main{flex:1;min-width:0}
.as-name{font-size:12.5px;font-weight:600;color:var(--texte);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-mail{font-family:var(--mono);font-size:10px;color:var(--faible);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-chev{color:var(--faible);transition:transform .2s;display:inline-flex}
.as-chev.open{transform:rotate(180deg)}
.as-list{border-top:1px solid var(--filet);background:var(--surface)}
.as-opt{width:100%;text-align:left;padding:8px 11px;background:none;border:none;border-left:2px solid transparent;cursor:pointer;
  display:flex;align-items:center;gap:9px;font-size:12px;color:var(--attenue)}
.as-opt:hover{background:var(--survol);color:var(--texte)}
.as-opt.on{border-left-color:var(--signal);background:rgba(var(--signal-r),.07);color:var(--texte)}
.as-opt .as-ic{display:inline-flex;color:var(--faible)}
.as-opt.on .as-ic{color:var(--signal)}
.as-opt .as-t{flex:1;min-width:0}
.as-opt .as-t b{display:block;font-weight:600;color:var(--texte);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-opt .as-t span{display:block;font-family:var(--mono);font-size:9.5px;color:var(--faible);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-opt .as-n{font-family:var(--mono);font-size:10px;color:var(--faible)}
.as-opt .as-n.nl{color:var(--signal)}

/* Actions rapides + pied */
.side-actions{display:flex;gap:4px;margin:6px 12px 4px;padding:4px;border-radius:9px;border:1px solid var(--filet)}
.side-action{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 4px;border-radius:6px;
  background:transparent;border:1px solid transparent;color:var(--attenue);cursor:pointer;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;transition:background .15s,color .15s}
.side-action:hover{background:var(--survol);color:var(--texte)}
.side-foot{padding:12px 12px 14px;border-top:1px solid var(--filet);display:flex;flex-direction:column;gap:8px}
.user-card{display:flex;align-items:center;gap:10px;min-width:0;background:var(--surface-2);border:1px solid var(--filet);border-radius:11px;padding:9px 11px}
.avatar{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-size:11.5px;font-weight:600;color:var(--fond);background:var(--signal)}
#user-name{font-size:12.5px;font-weight:600;color:var(--texte);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#user-mail{font-family:var(--mono);font-size:10px;color:var(--faible);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.side-btn{width:100%;display:flex;align-items:center;gap:9px;cursor:pointer;text-align:left;
  color:var(--attenue);background:transparent;border:1px solid var(--filet);border-radius:9px;padding:7px 11px;font-size:12.5px;transition:color .15s,border-color .15s}
.side-btn:hover{color:var(--texte);border-color:var(--filet-fort)}
.side-btn .i-lune{display:none}
:root[data-theme="light"] .side-btn .i-lune{display:block}
:root[data-theme="light"] .side-btn .i-soleil{display:none}

/* ═══ Colonne principale ═══ */
.main{display:flex;flex-direction:column;min-width:0;width:100%}
.subbar{position:sticky;top:var(--bandeau);z-index:20;min-height:var(--barre);
  display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 28px;
  background:color-mix(in srgb,var(--fond) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--filet)}
.subbar-l{display:flex;align-items:center;gap:12px;min-width:0}
.subbar-title{display:flex;flex-direction:column;gap:1px;min-width:0}
.subbar-h{font-size:17px;font-weight:600;letter-spacing:-.02em;color:var(--texte);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subbar-sub{font-size:12.5px;color:var(--faible);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subbar-search{position:relative;display:flex;align-items:center;flex:1;max-width:320px;min-width:180px}
.subbar-search svg{position:absolute;left:11px;width:15px;height:15px;color:var(--faible);pointer-events:none}
.subbar-search input{width:100%;background:var(--surface);border:1px solid var(--filet);border-radius:8px;
  padding:8px 12px 8px 33px;font-size:13.5px;color:var(--texte);outline:none;transition:border-color .15s,background .15s}
.subbar-search input:focus{border-color:var(--signal);background:var(--surface-2)}
.subbar-search input::placeholder{color:var(--faible)}
.subbar-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.rt{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faible);border:1px solid var(--filet);border-radius:20px;padding:4px 10px}
.pastille{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none;animation:respire 2.6s ease-out infinite}
@keyframes respire{0%{box-shadow:0 0 0 0 rgba(var(--ok-r),.5)}70%{box-shadow:0 0 0 7px rgba(var(--ok-r),0)}100%{box-shadow:0 0 0 0 rgba(var(--ok-r),0)}}
.subbar-sync{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faible)}
.subbar-sync .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--faible)}
.subbar-sync.saving{color:var(--signal)}
.subbar-sync.saving .sync-dot{background:var(--signal);animation:pulse 1.2s linear infinite}
.subbar-sync.saved{color:var(--ok)}
.subbar-sync.saved .sync-dot{background:var(--ok)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.subbar-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;cursor:pointer;
  border:1px solid var(--texte);background:var(--texte);color:var(--fond);font-size:13.5px;font-weight:600;transition:opacity .15s}
.subbar-btn:hover{opacity:.88}
.hdr-burger{display:none;align-items:center;justify-content:center;width:36px;height:36px;flex:none;border-radius:8px;
  background:var(--surface);border:1px solid var(--filet-fort);color:var(--texte);cursor:pointer}
.side-scrim{display:none;position:fixed;inset:var(--bandeau) 0 0 0;background:rgba(0,0,0,.45);z-index:35}
.side-scrim.open{display:block}

.content{padding:22px 28px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}

/* ═══ Boutons ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 13px;border-radius:8px;
  border:1px solid var(--filet-fort);background:var(--surface);color:var(--texte);cursor:pointer;
  font-size:13px;font-weight:500;white-space:nowrap;line-height:1.3;text-decoration:none;transition:border-color .15s,background .15s,color .15s,opacity .15s}
.btn:hover{background:var(--survol);text-decoration:none}
.btn.primary{background:var(--texte);color:var(--fond);border-color:var(--texte);font-weight:600}
.btn.primary:hover{opacity:.88;background:var(--texte)}
.btn.accent{color:var(--signal);border-color:rgba(var(--signal-r),.4);background:rgba(var(--signal-r),.07)}
.btn.accent:hover{background:rgba(var(--signal-r),.14)}
.btn.ghost{background:transparent;border-style:dashed;color:var(--attenue)}
.btn.ghost:hover{border-style:solid;color:var(--texte)}
.btn.danger{color:var(--retard);border-color:rgba(var(--retard-r),.4)}
.btn.danger:hover{background:rgba(var(--retard-r),.08)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:default}

/* ═══ Champs ═══ */
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--filet);border-radius:8px;background:var(--surface-2);
  font-size:13.5px;color:var(--texte);outline:none;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--filet-fort)}
input:focus,select:focus,textarea:focus{border-color:var(--signal);box-shadow:0 0 0 3px rgba(var(--signal-r),.16)}
input::placeholder,textarea::placeholder{color:var(--faible)}
input[readonly]{color:var(--attenue);font-family:var(--mono);font-size:12.5px}
textarea{resize:vertical;min-height:84px;line-height:1.6}
.fl,.field label{display:block;font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--faible);margin-bottom:6px}
.field{margin-bottom:13px}
.field textarea{min-height:200px}
.row-fields{display:flex;gap:12px;flex-wrap:wrap}
.row-fields .field{flex:1;min-width:160px}

/* ═══ Vue courrier : liste / détail ═══ */
.mail{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;
  height:calc(100vh - var(--bandeau) - var(--barre) - 50px);min-height:460px}
.mlist,.mdet{background:var(--surface);border:1px solid var(--filet);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;min-height:0;min-width:0}
.mlist-h{padding:13px 16px;border-bottom:1px solid var(--filet);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mlist-h-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mlist-h-title{font-size:14.5px;font-weight:600;color:var(--texte)}
.mlist-h-cnt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faible)}
.filtre-camp{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--signal);
  border:1px solid rgba(var(--signal-r),.35);background:rgba(var(--signal-r),.08);border-radius:20px;padding:2px 4px 2px 10px}
.filtre-camp button{background:none;border:none;color:inherit;cursor:pointer;width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.filtre-camp button:hover{background:rgba(var(--signal-r),.18)}
.chips{display:flex;gap:6px;padding:9px 14px;border-bottom:1px solid var(--filet);overflow-x:auto;flex-wrap:nowrap}
.chips::-webkit-scrollbar{height:0}
.chip{flex:none;padding:4px 11px;border-radius:20px;background:transparent;border:1px solid var(--filet);font-size:12px;color:var(--attenue);cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
.chip:hover{border-color:var(--filet-fort);color:var(--texte)}
.chip.active{background:rgba(var(--signal-r),.1);border-color:rgba(var(--signal-r),.4);color:var(--signal);font-weight:500}
.mlist-body{flex:1;overflow-y:auto;min-height:0}
.mitem{position:relative;padding:12px 16px 12px 16px;border-bottom:1px solid var(--filet);cursor:pointer;
  display:grid;grid-template-columns:34px minmax(0,1fr);gap:11px;align-items:flex-start;transition:background .14s}
.mitem:hover{background:var(--survol)}
.mitem.selected{background:rgba(var(--signal-r),.08)}
.mitem.selected::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--signal)}
.mitem.nouveau{animation:arrivee 3.2s var(--ease)}
@keyframes arrivee{0%,35%{background:rgba(var(--signal-r),.18)}100%{background:transparent}}
.mitem:focus-visible{outline-offset:-2px}
.mav{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--surface-2);border:1px solid var(--filet);color:var(--attenue);font-size:12px;font-weight:600;letter-spacing:.02em}
.e-info{min-width:0;overflow:hidden}
.e-row1{display:flex;align-items:center;gap:6px;margin-bottom:1px}
.e-from{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;color:var(--attenue)}
.e-subject{font-size:13px;color:var(--attenue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.mitem.unread .e-from,.mitem.unread .e-subject{color:var(--texte);font-weight:600}
.mitem.unread .e-row1::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--signal);flex:none}
.e-date{font-family:var(--mono);font-size:10.5px;color:var(--faible);flex-shrink:0}
.e-snippet{font-size:12px;color:var(--faible);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.45}
.e-row2{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.star{font-size:14px;line-height:1;color:var(--faible);cursor:pointer;padding:0 2px;background:none;border:none;transition:color .15s}
.star.on{color:var(--signal)}
.star:hover{color:var(--texte)}

.cat-pill,.client-tag,.camp-tag,.trk{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;padding:1px 8px;border-radius:20px;border:1px solid;white-space:nowrap;line-height:1.6}
.cat-pill.urgent{color:var(--retard);border-color:rgba(var(--retard-r),.4);background:rgba(var(--retard-r),.1)}
.cat-pill.client{color:var(--signal);border-color:rgba(var(--signal-r),.4);background:rgba(var(--signal-r),.1)}
.cat-pill.devis{color:var(--ok);border-color:rgba(var(--ok-r),.4);background:rgba(var(--ok-r),.1)}
.cat-pill.facture{color:var(--attente);border-color:rgba(var(--attente-r),.4);background:rgba(var(--attente-r),.1)}
.cat-pill.fournisseur,.cat-pill.newsletter,.cat-pill.interne{color:var(--attenue);border-color:var(--filet-fort);background:var(--surface-2)}
.client-tag{color:var(--attenue);border-color:var(--filet-fort);background:transparent;text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:11px}
.camp-tag{color:var(--signal);border-color:rgba(var(--signal-r),.3);background:transparent;text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:11px;cursor:pointer}
.trk{color:var(--faible);border-color:var(--filet)}
.trk.ok{color:var(--ok);border-color:rgba(var(--ok-r),.35)}
.trk.sig{color:var(--signal);border-color:rgba(var(--signal-r),.35)}
.attach-pill{font-family:var(--mono);font-size:10.5px;color:var(--faible);display:inline-flex;align-items:center;gap:3px}
.attach-pill svg{width:12px;height:12px}
.empty{padding:44px 20px;text-align:center;color:var(--faible);font-size:13.5px;line-height:1.6}
.empty .gros{font-size:15px;color:var(--attenue);margin-bottom:6px;font-weight:500}
.empty a{cursor:pointer}

/* Détail */
.mdet-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 28px;text-align:center}
.mdet-empty-mark{width:56px;height:56px;border-radius:12px;border:1px solid var(--filet-fort);color:var(--faible);
  display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.mdet-empty-title{font-size:17px;font-weight:600;color:var(--texte);margin-bottom:6px;letter-spacing:-.02em}
.mdet-empty-sub{font-size:13px;color:var(--faible);max-width:46ch;line-height:1.6}
.mdet-h{padding:18px 22px;border-bottom:1px solid var(--filet);display:flex;flex-direction:column;gap:8px}
.mdet-back{display:none;align-self:flex-start}
.mdet-subj{font-size:19px;font-weight:600;color:var(--texte);line-height:1.3;letter-spacing:-.02em}
.mdet-from{display:flex;align-items:center;gap:11px}
.mdet-from .name{font-weight:600;color:var(--texte);font-size:13.5px}
.mdet-from .mail-addr{font-family:var(--mono);color:var(--faible);font-size:11.5px}
.mdet-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--attenue)}
.mdet-meta .quand{font-family:var(--mono);font-size:11px;color:var(--faible)}
.mdet-actions{display:flex;gap:7px;flex-wrap:wrap;padding:11px 22px;border-bottom:1px solid var(--filet)}
.mdet-body{padding:22px;flex:1;overflow-y:auto;font-size:14.5px;line-height:1.72;color:var(--texte);white-space:pre-wrap;word-break:break-word}
.mdet-attach{padding:14px 22px;border-top:1px solid var(--filet);background:var(--surface-2)}
.attach-title{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--faible);margin-bottom:9px}
.attach-card{display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;background:var(--surface);border:1px solid var(--filet);margin:0 8px 6px 0;cursor:default}
.attach-icon{width:32px;height:32px;border-radius:6px;border:1px solid var(--filet-fort);color:var(--attenue);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em}
.attach-name{font-size:12.5px;font-weight:500;color:var(--texte);display:block}
.attach-size{font-family:var(--mono);font-size:10.5px;color:var(--faible)}
.suivi{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 22px;border-bottom:1px solid var(--filet);background:var(--surface-2)}
.suivi .et{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--faible)}
.suivi .et i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--filet-fort);flex:none}
.suivi .et.fait{color:var(--texte)}
.suivi .et.fait i{background:var(--ok);border-color:var(--ok)}
.suivi .et b{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--faible)}
.suivi .ref{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faible)}

/* ═══ Cartes / paramètres ═══ */
.settings-grid{display:grid;grid-template-columns:1fr;gap:16px;max-width:940px}
.card{background:var(--surface);border:1px solid var(--filet);border-radius:12px;padding:20px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:600;color:var(--texte);letter-spacing:-.015em}
.card-sub{font-size:13px;color:var(--attenue);margin-top:4px;line-height:1.6}
.card-sub strong{color:var(--texte);font-weight:600}
.frow{display:grid;grid-template-columns:140px 1fr;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--filet)}
.frow:last-child{border-bottom:none}
.frow-l{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faible)}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 11px;border-radius:20px;border:1px solid;white-space:nowrap}
.status-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status-pill.ok{color:var(--ok);border-color:rgba(var(--ok-r),.4);background:rgba(var(--ok-r),.1)}
.status-pill.pending{color:var(--attente);border-color:rgba(var(--attente-r),.4);background:rgba(var(--attente-r),.1)}
.status-pill.ko{color:var(--attenue);border-color:var(--filet);background:var(--surface-2)}
.tbl-scroll{overflow-x:auto;border:1px solid var(--filet);border-radius:10px;margin-top:14px}
.dns-tbl,.tbl{width:100%;border-collapse:collapse;font-size:13px}
.dns-tbl th,.dns-tbl td,.tbl th,.tbl td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--filet);vertical-align:middle}
.dns-tbl th,.tbl th{font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--faible);background:var(--surface)}
.dns-tbl tbody tr:last-child td,.tbl tbody tr:last-child td{border-bottom:none}
.dns-tbl tbody tr:hover,.tbl tbody tr:hover{background:var(--survol)}
.dns-tbl td{font-size:12.5px}
.dns-tbl td.t{font-family:var(--mono);font-size:11.5px;color:var(--attenue)}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.n{font-size:12.5px}
.tbl td.nom{min-width:240px}
.tbl td .sec{display:block;font-size:12px;color:var(--faible);margin-top:1px}
.tbl tr.sel td{background:rgba(var(--signal-r),.07)}
.tbl tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--signal)}
.tbl tbody tr{cursor:default}
.tbl tbody tr[data-camp]{cursor:pointer}
.dns-copy{font-family:var(--mono);font-size:11.5px;color:var(--texte);cursor:pointer;background:var(--surface-2);border:1px solid var(--filet);
  padding:3px 8px;border-radius:6px;display:inline-block;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.dns-copy:hover{border-color:var(--signal)}
.dns-status{margin-top:10px;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.5;border:1px solid}
.dns-status.ok{background:rgba(var(--ok-r),.08);color:var(--ok);border-color:rgba(var(--ok-r),.35)}
.dns-status.pending{background:rgba(var(--attente-r),.08);color:var(--attente);border-color:rgba(var(--attente-r),.35)}
.alias-row{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--filet);border-radius:9px;margin-top:8px;background:var(--surface-2)}
.alias-row .alias{font-family:var(--mono);font-size:12.5px;color:var(--texte);flex:1;min-width:0}
.alias-row .target{font-size:12px;color:var(--faible)}
.toggle{width:36px;height:20px;border-radius:20px;background:var(--filet-fort);position:relative;cursor:pointer;flex-shrink:0;border:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--attenue);transition:transform .2s var(--ease),background .2s}
.toggle.on{background:var(--signal)}
.toggle.on::after{transform:translateX(16px);background:var(--surface)}
.toggle-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--filet)}
.toggle-row:last-child{border-bottom:none}
.toggle-row .lbl{font-size:13.5px;font-weight:500;color:var(--texte)}
.toggle-row .desc{font-size:12.5px;color:var(--faible);margin-top:2px;line-height:1.5}

/* ═══ Fenêtre modale ═══ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  z-index:100;display:none;align-items:center;justify-content:center;padding:22px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--filet-fort);border-radius:14px;width:min(740px,96vw);max-height:90vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--ombre-modale)}
.modal-h{padding:15px 20px;border-bottom:1px solid var(--filet);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-title{font-size:15.5px;font-weight:600;color:var(--texte)}
.modal-close{background:none;border:none;width:30px;height:30px;border-radius:7px;color:var(--faible);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--survol);color:var(--texte)}
.modal-body{padding:18px 20px;overflow-y:auto;flex:1}
.modal-foot{padding:13px 20px;border-top:1px solid var(--filet);display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}
.compose-tools{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 14px;border-bottom:1px solid var(--filet);margin-bottom:14px}
.tool-btn{padding:4px 11px;border-radius:20px;background:transparent;border:1px solid var(--filet-fort);color:var(--attenue);font-size:12px;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
.tool-btn:hover{color:var(--texte);background:var(--survol)}
.tool-btn.accent{color:var(--signal);border-color:rgba(var(--signal-r),.4)}
.tool-btn.accent:hover{background:rgba(var(--signal-r),.1)}
.sig-preview{background:var(--surface-2);border:1px dashed var(--filet-fort);border-radius:9px;padding:10px 13px;font-size:12.5px;color:var(--attenue);white-space:pre-wrap;line-height:1.55}
.send-err{margin-top:10px;padding:10px 12px;border:1px solid rgba(var(--retard-r),.4);background:rgba(var(--retard-r),.08);color:var(--retard);border-radius:8px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.from-line{display:flex;align-items:center;gap:8px}
.from-line select{font-family:var(--mono);font-size:12.5px}

/* ═══ Toasts & accusé d'envoi ═══ */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;max-width:calc(100vw - 40px)}
.toast{background:var(--surface-2);color:var(--texte);border:1px solid var(--filet-fort);border-radius:10px;padding:10px 15px;font-size:13px;
  box-shadow:var(--ombre-modale);display:flex;align-items:center;gap:10px;min-width:220px;max-width:380px;pointer-events:auto;animation:toastIn .3s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.receipt{width:340px;max-width:100%;background:var(--surface);border:1px solid var(--filet-fort);border-radius:12px;box-shadow:var(--ombre-modale);pointer-events:auto;animation:toastIn .3s var(--ease);overflow:hidden}
.receipt-h{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--filet)}
.receipt-h .ok-ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--ok-r),.14);color:var(--ok);flex:none}
.receipt-h b{flex:1;font-size:13.5px;font-weight:600}
.receipt-h button{background:none;border:none;color:var(--faible);cursor:pointer;font-size:15px;line-height:1}
.receipt-b{padding:10px 14px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 10px;font-size:12.5px}
.receipt-b span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faible);padding-top:2px}
.receipt-b div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--texte)}
.receipt-b .m{font-family:var(--mono);font-size:11.5px}
.receipt-t{display:flex;justify-content:space-between;gap:6px;padding:10px 14px 12px;border-top:1px solid var(--filet)}
.receipt-t .et{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;font-size:11px;color:var(--faible)}
.receipt-t .et i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--filet-fort)}
.receipt-t .et b{font-family:var(--mono);font-weight:400;font-size:10px}
.receipt-t .et.fait{color:var(--texte)}
.receipt-t .et.fait i{background:var(--ok);border-color:var(--ok)}
.receipt-t .et.encours i{border-color:var(--signal);animation:pulse 1.1s linear infinite}
.receipt-f{padding:0 14px 12px}

/* ═══ Blocs CRM (campagnes) ═══ */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--filet);border-radius:12px;padding:16px 18px}
.kpi .lib{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faible)}
.kpi .val{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.03em;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1}
.kpi .note{font-size:12.5px;color:var(--attenue);margin-top:8px}
.kpi.bleu .val{color:var(--signal)} .kpi.vert .val{color:var(--ok)}
.panneau{background:var(--surface);border:1px solid var(--filet);border-radius:12px;min-width:0}
.panneau>header{padding:14px 18px;border-bottom:1px solid var(--filet);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panneau>header h2{font-size:14.5px;font-weight:600;margin:0}
.panneau>header .aide{font-size:12.5px;color:var(--faible)}
.panneau .corps{padding:18px}
.panneau .tbl th:first-child,.panneau .tbl td:first-child{padding-left:18px}
.panneau .tbl th:last-child,.panneau .tbl td:last-child{padding-right:18px}
.duo{display:grid;gap:16px}
.duo>*{min-width:0}
@media(min-width:1180px){.duo{grid-template-columns:1fr 1.25fr}}
.etat{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;padding:2px 9px;border-radius:20px;border:1px solid;white-space:nowrap;text-transform:uppercase}
.e-ok{color:var(--ok);border-color:rgba(var(--ok-r),.4);background:rgba(var(--ok-r),.1)}
.e-att{color:var(--attente);border-color:rgba(var(--attente-r),.4);background:rgba(var(--attente-r),.1)}
.e-ret{color:var(--retard);border-color:rgba(var(--retard-r),.4);background:rgba(var(--retard-r),.1)}
.e-sig{color:var(--signal);border-color:rgba(var(--signal-r),.4);background:rgba(var(--signal-r),.1)}
.e-neu{color:var(--attenue);border-color:var(--filet);background:var(--surface-2)}
.funnel{display:flex;flex-direction:column;gap:14px}
.fr-row{display:grid;grid-template-columns:112px minmax(0,1fr) 92px;gap:12px;align-items:center}
.fr-row .l{font-size:13px;color:var(--attenue)}
.fr-row .v{text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--texte);white-space:nowrap}
.fr-row .v small{color:var(--faible);font-size:11px;margin-left:5px}
.barre-p{height:6px;border-radius:20px;background:var(--surface-2);overflow:hidden}
.barre-p i{display:block;height:100%;border-radius:20px;background:var(--signal);transition:width .5s var(--ease)}
.barre-p.neutre i{background:var(--faible)}
.barre-p.att i{background:var(--attenue)}
.barre-p.vert i{background:var(--ok)}
.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 18px;border-bottom:1px solid var(--filet)}
.step:last-child{border-bottom:none}
.step .jour{font-family:var(--mono);font-size:11px;color:var(--attenue);border:1px solid var(--filet-fort);border-radius:6px;padding:3px 0;text-align:center}
.step b{display:block;font-size:13.5px;font-weight:500}
.step .obj{font-size:12.5px;color:var(--faible);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .chiffres{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--faible)}
.step .chiffres span b{display:inline;font-family:var(--mono);font-weight:500;font-size:12.5px;color:var(--texte);margin-right:4px}
.step .prog{margin-top:9px}
.step .prog .barre-p{height:5px}
.step .prog .t{font-family:var(--mono);font-size:10.5px;color:var(--signal);margin-top:5px}
.camp-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ═══ Assistant de configuration (onboarding) ═══ */
#opm-onboard{position:fixed;inset:0;z-index:9000}
#opm-onboard .opm-onb-wrap{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:22px}
#opm-onboard .opm-onb-card{background:var(--surface);border:1px solid var(--filet-fort);border-radius:14px;width:min(520px,96vw);padding:26px 28px 22px;box-shadow:var(--ombre-modale);animation:toastIn .3s var(--ease)}
#opm-onboard .opm-onb-card-wide{width:min(620px,96vw)}

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   OniPromail — application single-file vanilla JS (démo autonome)
   Storage     : localStorage clé oniq-demo-onipromail-state
   Pont parent : remplacé par demoBridge() — aucun appel réseau
   IA          : bati-mistral-request → réponses simulées (demoAI)
═══════════════════════════════════════════════════════════════════════*/

const STORE_KEY = 'oniq-demo-onipromail-state';
const DEMO_VERSION = 3;

/* ───────── ÉTAT GLOBAL ───────── */
function freshState(){
  return {
    demoVersion: DEMO_VERSION,
    user: { name:'', email:'', company:'', role:'', phone:'', site:'', linkedin:'' },
    _isAuthed: null,
    _allowDemo: false,
    messages: [], drafts: [], sent: [], trash: [], spam: [],
    contacts: [], signatures: [], templates: {},
    campaigns: [],
    settings: {
      domain: '', domainVerified: false, domainRecords: [], domainStatus: '', aliases: [],
      autoReply: { enabled:false, message:'' }, forwardTo: '',
      apiKey: '', aiCategorize: true, aiSignature: true
    },
    aliases: [],
    ui: { folder:'inbox', category:null, quick:'all', selectedId:null, search:'', currentAlias:null, aliasDropdownOpen:false,
          campaignId:null, campaignFilter:null, flashId:null }
  };
}
let S = freshState();

/* ───────── PERSISTENCE ───────── */
let _resetting = false;
function saveLocal(){
  if(_resetting) return;
  try{
    const copy = Object.assign({}, S, { ui: Object.assign({}, S.ui, { flashId:null, search:'' }) });
    localStorage.setItem(STORE_KEY, JSON.stringify(copy));
  }catch(e){}
}
let _saveT;
function saveCloud(){
  /* En démo : enregistrement local uniquement (le parent n'existe pas). */
  saveLocal();
  setSync('saving');
  if(_saveT) clearTimeout(_saveT);
  _saveT = setTimeout(()=>{
    parentPost({type:'onipromail-save',key:STORE_KEY,value:'(local)'});
    setSync('saved');
  }, 700);
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && typeof d==='object' && d.demoVersion===DEMO_VERSION){ S = deepMerge(S, d); return true; }
    }
  }catch(e){}
  return false;
}
function loadCloud(){ parentPost({type:'onipromail-load',key:STORE_KEY}); }
function deepMerge(a,b){
  if(!b) return a;
  const out = Array.isArray(a)? a.slice() : Object.assign({}, a);
  for(const k in b){
    if(b[k] && typeof b[k]==='object' && !Array.isArray(b[k]) && a[k] && typeof a[k]==='object' && !Array.isArray(a[k])){
      out[k] = deepMerge(a[k], b[k]);
    } else {
      out[k] = b[k];
    }
  }
  return out;
}
window.addEventListener('beforeunload', ()=>{ saveLocal(); });
window.addEventListener('message', function(evt){
  try{
    if(!evt || !evt.data || typeof evt.data!=='object' || !evt.data.type) return;
    if(evt.data.type==='onipromail-cloud-data' && evt.data.data){
      const d = typeof evt.data.data==='string' ? JSON.parse(evt.data.data) : evt.data.data;
      if(d && typeof d==='object'){ S = deepMerge(S, d); renderAll(); }
    } else if(evt.data.type==='oniq-cross-sync' && evt.data.contacts){
      S.contacts = evt.data.contacts; saveLocal(); renderAll();
    }
  }catch(e){}
});

/* ════════════════════════════════════════════════════════════════════
   PONT DÉMO — remplace window.parent.postMessage(…)
   Chaque message qui partait vers la plateforme (Supabase, Resend,
   Mistral, OniPilote, OniCompta) reçoit ici une réponse simulée,
   renvoyée à l'application comme si elle venait du parent.
   ════════════════════════════════════════════════════════════════════ */
function toApp(data, delay){
  setTimeout(()=>{
    try{ window.dispatchEvent(new MessageEvent('message',{data:data})); }
    catch(e){ console.warn('[démo] dispatch', e); }
  }, delay||0);
}
function parentPost(msg){
  try{ demoBridge(msg); }catch(e){ console.warn('[démo] pont', e); }
}
function demoBridge(msg){
  if(!msg || !msg.type) return;
  switch(msg.type){
    case 'onipromail-save':
    case 'onipromail-load':
    case 'onipromail-update-email':
    case 'onipromail-delete-email':
    case 'onipromail-to-onicompta':
    case 'onipromail-to-onipilote':
    case 'oniq-internal-route':
    case 'oniq-close-software':
      return; /* rien à faire : tout vit en local */
    case 'onipromail-fetch-emails':
      return; /* la boîte de démo est déjà chargée localement */
    case 'onipromail-fetch-aliases':
      toApp({type:'onipromail-aliases-data', aliases: DEMO_ALIASES.map(a=>Object.assign({},a))}, 120);
      return;
    case 'onipromail-send-email':
      demoSimulateSend(msg);
      return;
    case 'onipromail-domain-setup':
      demoSimulateDomain(msg);
      return;
    case 'bati-mistral-request':
      toApp({type:'bati-mistral-response', reqId:msg.reqId, result:{content: demoAI(msg.payload)}}, 650 + Math.random()*900);
      return;
    default:
      return;
  }
}

/* ───────── MISTRAL VIA PARENT (simulé) ───────── */
function callMistral(payload, timeoutMs){
  timeoutMs = timeoutMs || 30000;
  return new Promise((resolve,reject)=>{
    const reqId = 'mreq-' + Math.random().toString(36).substr(2,9);
    const handler = (evt)=>{
      if(!evt.data || evt.data.type!=='bati-mistral-response' || evt.data.reqId!==reqId) return;
      window.removeEventListener('message', handler);
      clearTimeout(timer);
      if(evt.data.error) reject(new Error(evt.data.error));
      else resolve(evt.data.result);
    };
    const timer = setTimeout(()=>{
      window.removeEventListener('message', handler);
      reject(new Error('Timeout Mistral'));
    }, timeoutMs);
    window.addEventListener('message', handler);
    try{ parentPost({type:'bati-mistral-request', reqId, payload}); }
    catch(e){ window.removeEventListener('message', handler); clearTimeout(timer); reject(e); }
  });
}

/* ───────── HELPERS ───────── */
function uid(){ return 'm_' + Date.now().toString(36) + Math.random().toString(36).substr(2,5); }
function esc(s){ s=String(s==null?'':s); return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){
  if(!name) return '?';
  const parts = String(name).replace(/[—–-]/g,' ').trim().split(/\s+/).filter(p=>/[A-Za-zÀ-ÿ]/.test(p)).slice(0,2);
  return parts.map(p=>p[0]||'').join('').toUpperCase() || '?';
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  const now = new Date();
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const diff = (now - d) / 86400000;
  if(diff < 7 && diff > 0) return d.toLocaleDateString('fr-FR',{weekday:'short'});
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
}
function fmtDateLong(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) +
         ' à ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function fmtHeure(iso){
  const d = new Date(iso); if(isNaN(d.getTime())) return '';
  return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function fmtN(n){ return Number(n||0).toLocaleString('fr-FR'); }
function fmtPct(n,d){ if(!d) return '—'; return (n/d*100).toLocaleString('fr-FR',{maximumFractionDigits:1}) + ' %'; }
function snippet(body, n){
  n = n || 110;
  const t = String(body||'').replace(/\s+/g,' ').trim();
  return t.length > n ? t.substr(0, n) + '…' : t;
}
function showToast(msg){
  const wrap = document.getElementById('toast-wrap');
  if(!wrap) return;
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s ease'; setTimeout(()=>t.remove(), 320); }, 2600);
}
function copyText(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>showToast('Copié'),()=>fallbackCopy(text));
    } else fallbackCopy(text);
  }catch(e){ fallbackCopy(text); }

const CAT_LABELS = {
  urgent:      { label:'Urgent',      color:'var(--cat-urgent)',     keywords:/(urgent|asap|d[èe]s\s+que\s+possible|aujourd'hui|imm[ée]diat)/i },
  client:      { label:'Client',      color:'var(--cat-client)',     keywords:/(prospect|premier\s+contact|demande\s+d'info|d[ée]couvert\s+votre|votre\s+site|nouveau\s+client|client)/i },
  devis:       { label:'Devis',       color:'var(--cat-devis)',      keywords:/(devis|estimation|chiffrage|cotation|proposition\s+commerciale|bon\s+pour\s+accord)/i },
  facture:     { label:'Facture',     color:'var(--cat-facture)',    keywords:/(facture|invoice|n[°o]\s?fa|montant\s+ttc|[àa]\s+r[ée]gler|paiement|[ée]ch[ée]ance|relance|cotisation)/i },
  fournisseur: { label:'Fournisseur', color:'var(--cat-fournisseur)',keywords:/(commande|livraison|fournisseur|stock|bon\s+de\s+commande|bdc|n[ée]goce|location\s+mat[ée]riel)/i },
  newsletter:  { label:'Newsletter',  color:'var(--cat-newsletter)', keywords:/(newsletter|d[ée]sabonner|unsubscribe|lettre\s+d'info|actu\s+du\s+mois)/i },
  interne:     { label:'Interne',     color:'var(--cat-interne)',    keywords:/(interne|[ée]quipe|coll[èe]gue|service|rh|paye)/i }
};

function classifyHeuristic(msg){
  const t = ((msg.subject||'') + ' ' + (msg.body||'') + ' ' + (msg.from||'')).toLowerCase();
  for(const k of ['urgent','facture','devis','fournisseur','newsletter','client','interne']){
    if(CAT_LABELS[k].keywords.test(t)) return k;
  }
  return 'client';
}

async function classifyWithAI(msg){
  if(!S.settings.aiCategorize) return classifyHeuristic(msg);
  try{
    const prompt = `Tu es un classificateur d'emails B2B BTP. Réponds UNIQUEMENT par un mot parmi : urgent | client | devis | facture | fournisseur | newsletter | interne.

DE: ${msg.from}
SUJET: ${msg.subject}
CORPS: ${(msg.body||'').slice(0,400)}

Catégorie :`;
    const result = await callMistral({ messages:[{role:'user',content:prompt}], temperature:0.1 }, 15000);
    const txt = (result && (result.content || result.text || result)) || '';
    const m = String(txt).toLowerCase().match(/(urgent|client|devis|facture|fournisseur|newsletter|interne)/);
    return m ? m[1] : classifyHeuristic(msg);
  }catch(e){
    return classifyHeuristic(msg);
  }
}

function nowMinus(hours){
  const d = new Date(); d.setTime(d.getTime() - hours*3600000); return d.toISOString();
}
function nowPlus(hours){ return nowMinus(-hours); }
function nextWorkday9(minDays){
  const d = new Date(); d.setDate(d.getDate() + (minDays||1)); d.setHours(9,0,0,0);
  while(d.getDay()===0 || d.getDay()===6) d.setDate(d.getDate()+1);

}

/* Construit l'HTML du switcher de boîtes (placé en haut de la barre latérale) */
function buildAliasSwitcherHTML(){
  const aliases = S.aliases || [];
  if(!aliases.length) return '';
  const current = S.ui.currentAlias;
  const allCount = S.messages.length;
  const currentLabel = current ? ((aliases.find(a => a.alias === current)||{}).display_name || current) : 'Toutes les boîtes';
  const currentEmail = current || `${aliases.length} adresses`;

  let html = `<div class="alias-switcher">
    <button type="button" onclick="toggleAliasDropdown()" aria-expanded="${S.ui.aliasDropdownOpen?'true':'false'}">
      <div class="as-av ${current?'':'tout'}">${current ? esc(current.split('@')[0].replace(/[^a-z]/gi,'').slice(0,2).toUpperCase()) : '∞'}</div>
      <div class="as-main">
        <div class="as-name">${esc(currentLabel)}</div>
        <div class="as-mail">${esc(currentEmail)}</div>
      </div>
      <span class="as-chev ${S.ui.aliasDropdownOpen?'open':''}">${gIco('chevron')}</span>
    </button>`;

  if(S.ui.aliasDropdownOpen){
    html += `<div class="as-list">`;
    html += `<button type="button" class="as-opt ${!current?'on':''}" onclick="setCurrentAlias(null)">
      <span class="as-ic">∞</span><span class="as-t"><b>Toutes les boîtes</b><span>${aliases.length} adresses</span></span>
      <span class="as-n">${allCount}</span></button>`;
    for(const a of aliases){
      const isActive = current === a.alias;
      const cnt = S.messages.filter(m => (m.to||'').toLowerCase() === a.alias.toLowerCase()).length;
      const unread = S.messages.filter(m => (m.to||'').toLowerCase() === a.alias.toLowerCase() && !m.read).length;
      html += `<button type="button" class="as-opt ${isActive?'on':''}" onclick="setCurrentAlias('${esc(a.alias)}')">
        <span class="as-ic">${a.is_shared?gIco('users'):gIco('user')}</span>
        <span class="as-t"><b>${esc(a.display_name||a.alias.split('@')[0])}</b><span>${esc(a.alias)}</span></span>
        <span class="as-n ${unread>0?'nl':''}">${cnt}${unread>0?' ('+unread+')':''}</span>
      </button>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

/* Mapper une row Supabase `emails` vers le format OniPromail */
function _mapEmailRow(r){
  return {
    id: r.id,
    from: r.from_name || r.from_address,
    fromEmail: r.from_address,
    to: r.to_address,
    subject: r.subject || '(sans sujet)',
    body: r.body_text || (r.body_html ? r.body_html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim() : ''),
    bodyHtml: r.body_html || '',
    date: r.email_date,
    category: r.ai_category || 'normal',
    read: !!r.is_read,
    starred: !!r.is_starred,
    folder: r.folder || 'inbox',
    attachments: r.attachments || [],
    clientLink: r.client_link || null,
    campaign: r.campaign_id || null
  };
}

window.addEventListener('message', function(evt){
  if(!evt.data) return;

  if(evt.data.type === 'oniq-user-info' && evt.data.user){
    const u = evt.data.user;
    if(u.email)   S.user.email   = u.email;
    if(u.name)    S.user.name    = u.name;
    if(u.company) S.user.company = u.company;
    if(u.role)    S.user.role    = u.role;
    S._isAuthed = (u.isAuthed === true);
    saveLocal();
    renderAll();
    maybeShowOnboarding();
    return;
  }

  /* Liste des aliases accessibles (switcher multi-boîtes) */
  if(evt.data.type === 'onipromail-aliases-data'){
    if(evt.data.error){ console.warn('[onipromail] Erreur fetch aliases:', evt.data.error); return; }
    S.aliases = evt.data.aliases || [];
    renderSidenav();
    return;
  }

  /* Fetch initial : liste complète */
  if(evt.data.type === 'onipromail-emails-data'){
    if(evt.data.error){ console.warn('[onipromail] Erreur récupération emails :', evt.data.error); return; }
    const rows = evt.data.emails || [];
    if(!rows.length){ if(S._allowDemo) return; S.messages = []; renderAll(); return; }
    S.messages = rows.map(_mapEmailRow);
    renderAll();
    return;
  }

  /* TEMPS RÉEL : nouvel e-mail poussé instantanément */
  if(evt.data.type === 'onipromail-new-email' && evt.data.email){
    const msg = _mapEmailRow(evt.data.email);
    if(!S.messages.some(m => m.id === msg.id)){
      S.messages = [msg, ...S.messages];
      S.ui.flashId = msg.id;
      setTimeout(()=>{ if(S.ui.flashId===msg.id) S.ui.flashId=null; }, 4000);
      saveCloud();
      renderAll();
      showToast('Nouveau message : '+(msg.from||msg.fromEmail));
    }
    return;
  }

  /* TEMPS RÉEL : mise à jour d'un e-mail existant (lu / important / dossier) */
  if(evt.data.type === 'onipromail-update-email-evt' && evt.data.email){
    const updated = _mapEmailRow(evt.data.email);
    const idx = S.messages.findIndex(m => m.id === updated.id);
    if(idx >= 0){ S.messages[idx] = updated; renderAll(); }
    return;
  }

  /* TEMPS RÉEL : suppression d'un e-mail */
  if(evt.data.type === 'onipromail-delete-email-evt' && evt.data.id){
    const before = S.messages.length;
    S.messages = S.messages.filter(m => m.id !== evt.data.id);
    if(S.messages.length !== before) renderAll();
    return;
  }
});

function getCurrentList(){
  const f = S.ui.folder;
  let list = [];
  if(f==='inbox') list = S.messages.slice();
  else if(f==='drafts') list = S.drafts.slice();
  else if(f==='sent') list = S.sent.slice();
  else if(f==='trash') list = S.trash.slice();
  else if(f==='spam') list = S.spam.slice();
  else if(f==='starred') list = S.messages.filter(m=>m.starred);
  /* Filtre multi-boîtes */
  if(S.ui.currentAlias && f!=='drafts'){
    const a = S.ui.currentAlias.toLowerCase();
    list = list.filter(m => (f==='sent' ? (m.fromEmail||'') : (m.to||'')).toLowerCase() === a);
  }
  if(S.ui.category) list = list.filter(m=>m.category===S.ui.category);
  if(S.ui.campaignFilter) list = list.filter(m=>m.campaign===S.ui.campaignFilter);
  if(S.ui.quick==='unread') list = list.filter(m=>m.read===false);
  else if(S.ui.quick==='attach') list = list.filter(m=>m.attachments && m.attachments.length>0);
  else if(S.ui.quick==='starred') list = list.filter(m=>m.starred);
  if(S.ui.search){
    const q = S.ui.search.toLowerCase();
    list = list.filter(m=>(
      String(m.from||'').toLowerCase().includes(q) ||
      String(m.fromEmail||m.to||'').toLowerCase().includes(q) ||
      String(m.to||'').toLowerCase().includes(q) ||
      String(m.subject||'').toLowerCase().includes(q) ||
      String(m.body||'').toLowerCase().includes(q) ||
      String(m.clientLink||'').toLowerCase().includes(q)
    ));
  }
  list.sort((a,b)=> new Date(b.date) - new Date(a.date));
  return list;
}

function trackPills(m){
  const t = m.track; if(!t) return '';
  if(t.replied) return `<span class="trk sig">Répondu</span>`;
  if(t.opened) return `<span class="trk ok">Ouvert</span>`;
  if(t.delivered) return `<span class="trk ok">Délivré</span>`;
  if(t.accepted) return `<span class="trk">Envoyé</span>`;
  return '';
}

function renderList(){
  const body = document.getElementById('mlist-body');
  const cnt = document.getElementById('mlist-cnt');
  const chips = document.getElementById('mchips');
  if(!body) return;
  if(chips) chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.dataset.quick===S.ui.quick));
  const list = getCurrentList();
  if(cnt) cnt.textContent = list.length + ' message' + (list.length>1?'s':'');
  const mailEl = document.getElementById('mail');
  if(mailEl) mailEl.classList.toggle('has-sel', !!S.ui.selectedId);
  if(list.length===0){
    if(S.ui.currentAlias && S.messages.length > 0){
      body.innerHTML = '<div class="empty"><div class="gros">Aucun message pour <span class="mono">' + esc(S.ui.currentAlias) + '</span></div>'
        + '<a onclick="setCurrentAlias(null)">Voir toutes les boîtes</a></div>';
    } else if(S.ui.search){
      body.innerHTML = '<div class="empty"><div class="gros">Aucun résultat</div>Aucun message ne correspond à « ' + esc(S.ui.search) + ' ».</div>';
    } else {
      body.innerHTML = '<div class="empty">Aucun message ici.</div>';
    }
  } else {
    const folder = S.ui.folder;
    const isOutbox = (folder==='sent' || folder==='drafts');
    body.innerHTML = list.map(m=>{
      const displayName = isOutbox ? ('À : ' + (m.to||'')) : (m.from||'');
      const cat = m.category && CAT_LABELS[m.category];
      const hasAttach = m.attachments && m.attachments.length>0;
      const camp = m.campaign ? campById(m.campaign) : null;
      return `<div class="mitem ${m.read===false?'unread':''} ${S.ui.selectedId===m.id?'selected':''} ${S.ui.flashId===m.id?'nouveau':''}" data-id="${esc(m.id)}" role="button" tabindex="0" aria-label="${esc(displayName+' — '+(m.subject||''))}">
        <div class="mav">${esc(initials(isOutbox ? (m.to||'').split('@')[0].replace(/[._-]/g,' ') : displayName))}</div>
        <div class="e-info">
          <div class="e-row1">
            <span class="e-from">${esc(displayName)}</span>
            ${isOutbox?'':`<button type="button" class="star ${m.starred?'on':''}" data-star="${esc(m.id)}" title="Marquer comme important" aria-label="Marquer comme important" aria-pressed="${m.starred?'true':'false'}">${m.starred?'★':'☆'}</button>`}
            <span class="e-date">${esc(fmtDate(m.date))}</span>
          </div>
          <div class="e-subject">${esc(m.subject||'(sans objet)')}</div>
          <div class="e-snippet">${esc(snippet(m.body))}</div>
          <div class="e-row2">
            ${cat ? `<span class="cat-pill ${m.category}">${cat.label}</span>` : ''}
            ${folder==='sent' ? trackPills(m) : ''}
            ${hasAttach ? `<span class="attach-pill">${gIco('clip')} ${m.attachments.length}</span>` : ''}
            ${camp ? `<span class="camp-tag" title="Réponse à la campagne « ${esc(camp.name)} »">↳ ${esc(camp.short)}</span>` : ''}
            ${m.clientLink ? `<span class="client-tag" title="Client OniPilote">OniPilote · ${esc(m.clientLink)}</span>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  if(!body.__clickBound){
    body.__clickBound = true;
    body.addEventListener('click', e=>{
      const star = e.target.closest('[data-star]');
      if(star){
        e.stopPropagation();
        const m = findMsgById(star.dataset.star);
        if(m){ m.starred = !m.starred; syncEmailFlag(m.id,{is_starred:m.starred}); saveCloud(); renderSidenav(); renderList(); }
        return;
      }
      const row = e.target.closest('.mitem');
      if(!row) return;
      S.ui.selectedId = row.dataset.id;
      renderList();
      renderDetail();
    });
    body.addEventListener('keydown', e=>{
      if(e.key!=='Enter' && e.key!==' ') return;
      const row = e.target.closest('.mitem'); if(!row || e.target.closest('[data-star]')) return;
      e.preventDefault();
      S.ui.selectedId = row.dataset.id; renderList(); renderDetail();
      const b = document.querySelector('#mdet .mdet-actions .btn'); if(b) b.focus();
    });
  }
}

function findMsgById(id){
  for(const l of [S.messages, S.drafts, S.sent, S.trash, S.spam]){
    const m = l.find(x=>x.id===id); if(m) return m;
  }
  return null;
}
function findMsgListById(id){
  if(S.messages.find(m=>m.id===id)) return S.messages;
  if(S.drafts.find(m=>m.id===id)) return S.drafts;
  if(S.sent.find(m=>m.id===id)) return S.sent;
  if(S.trash.find(m=>m.id===id)) return S.trash;
  if(S.spam.find(m=>m.id===id)) return S.spam;
  return null;
}

      ${isDraft ? `<button type="button" class="btn primary" data-act="continue">${gIco('drafts')} Continuer la rédaction</button>` : ''}
      ${!isDraft ? `<button type="button" class="btn" data-act="forward">${gIco('forward')} Transférer</button>` : ''}
      ${!isDraft ? `<button type="button" class="btn" data-act="archive">${gIco('archive')} Archiver</button>` : ''}
      <button type="button" class="btn danger" data-act="delete">${gIco('trash')} Supprimer</button>
      ${hasFacturePJ ? `<button type="button" class="btn accent" data-act="to-compta">${gIco('bolt')} Envoyer vers OniCompta</button>` : ''}
      ${(isDevis||isProspect) && !isDraft && !isSent ? `<button type="button" class="btn accent" data-act="to-pilote">${gIco('bolt')} Créer fiche client OniPilote</button>` : ''}
      ${!isDraft && !isSent ? `<button type="button" class="btn ghost" data-act="ai-reply">✦ IA suggère un brouillon</button>` : ''}
    </div>
    ${isSent ? suiviHTML(m) : ''}
    <div class="mdet-body">${esc(m.body||'')}</div>
    ${(m.attachments && m.attachments.length>0) ? `
      <div class="mdet-attach">
        <div class="attach-title">Pièces jointes (${m.attachments.length})</div>
        ${m.attachments.map(a=>`
          <span class="attach-card" title="Aperçu disponible dans la version installée">
            <span class="attach-icon">${esc((a.type||'').toUpperCase().slice(0,3) || 'PJ')}</span>
            <span><span class="attach-name">${esc(a.name)}</span><span class="attach-size">${esc(a.size||'')}</span></span>
          </span>`).join('')}
      </div>` : ''}
  `;

  if(folder==='inbox' || folder==='starred'){
    if(m.read===false){
      m.read = true;
      syncEmailFlag(m.id,{is_read:true});
      saveCloud();
      renderSidenav();
      const row = document.querySelector('.mitem[data-id="'+(window.CSS&&CSS.escape?CSS.escape(m.id):m.id)+'"]');
      if(row) row.classList.remove('unread');
    }
  }
  pane.querySelectorAll('[data-act]').forEach(btn=>{
    btn.addEventListener('click', ()=>handleDetailAction(btn.dataset.act, m));
  });
  const oc = pane.querySelector('[data-open-camp]');
  if(oc) oc.addEventListener('click', ()=>openCampaign(oc.dataset.openCamp));
}

/* ═══════════════════════ ACTIONS DÉTAIL ═══════════════════════ */
async function handleDetailAction(act, m){
  if(act==='reply'){
    openCompose({ to:(S.ui.folder==='sent'? m.to : m.fromEmail)||'', subject: /^re\s*:/i.test(m.subject||'') ? m.subject : 'Re: '+(m.subject||''),
      body:'\n\n--- Message original ---\n'+(m.body||''), fromAlias: S.ui.folder==='sent' ? m.fromEmail : m.to, campaign:m.campaign||null });
  } else if(act==='forward'){
    openCompose({ to:'', subject:'Tr: '+(m.subject||''), body:'\n\n--- Message transféré ---\nDe: '+(m.from||'')+' <'+(m.fromEmail||'')+'>\n'+(m.body||'') });
  } else if(act==='continue'){
    openCompose({ to:m.to||'', cc:m.cc||'', bcc:m.bcc||'', subject:m.subject||'', body:m.body||'', _draftId:m.id, campaign:m.campaign||null });
  } else if(act==='archive'){
    showToast('Archivé');
  } else if(act==='delete'){
    deleteMessage(m.id);
  } else if(act==='to-compta'){
    sendToCompta(m);
  } else if(act==='to-pilote'){
    sendToPilote(m);
  } else if(act==='ai-reply'){
    aiDraftReply(m);
  } else if(act==='summarize'){
    if(typeof window.aiEmailSummarize==='function') window.aiEmailSummarize(m.id);
  }
}

function deleteMessage(id){
  const list = findMsgListById(id);
  if(!list) return;
  const idx = list.findIndex(m=>m.id===id);
  if(idx<0) return;
  if(list===S.trash){
    list.splice(idx,1);
    showToast('Supprimé définitivement');
  } else {
    const m = list.splice(idx,1)[0];
    S.trash.unshift(m);
    showToast('Déplacé vers la corbeille');
  }
  syncEmailDelete(id);
  S.ui.selectedId = null;
  saveCloud();
  renderAll();
}

function sendToCompta(m){
  parentPost({ type:'onipromail-to-onicompta', data:{ from:m.from, fromEmail:m.fromEmail, subject:m.subject, date:m.date, attachments:m.attachments } });
  showToast('Facture transmise à OniCompta (démo — sans envoi réel)');
}
function sendToPilote(m){
  parentPost({ type:'onipromail-to-onipilote', data:{ name:m.from, email:m.fromEmail, source:'OniPromail', note:'Issu de l\'email : ' + (m.subject||''), date:m.date } });
  showToast('Fiche client envoyée vers OniPilote (démo)');
}

async function aiDraftReply(m){
  showToast('✦ IA rédige un brouillon…');
  try{
    const prompt = `Tu es l'assistant email du dirigeant d'une entreprise BTP française. Rédige une réponse professionnelle, courte et chaleureuse, à l'email ci-dessous. Vouvoiement de mise. Pas de signature.

DE: ${m.from} <${m.fromEmail||''}>
SUJET: ${m.subject}
CORPS: ${(m.body||'').slice(0,1500)}

Réponse :`;
    const result = await callMistral({messages:[{role:'user',content:prompt}], temperature:0.5}, 25000);
    const txt = (result && (result.content || result.text || result)) || 'Bonjour,\n\nMerci pour votre message. Je reviens rapidement vers vous.\n\nCordialement,';
    openCompose({ to: m.fromEmail||'', subject: /^re\s*:/i.test(m.subject||'') ? m.subject : 'Re: '+(m.subject||''), body: String(txt).trim() + '\n\n', fromAlias:m.to, campaign:m.campaign||null });
    showToast('Brouillon IA prêt');
  }catch(e){
    const fallback = `Bonjour,\n\nMerci pour votre message. Je prends note de votre demande et reviens vers vous d'ici 48h avec une réponse détaillée.\n\nCordialement,\n`;
    openCompose({ to:m.fromEmail||'', subject:'Re: '+(m.subject||''), body: fallback, fromAlias:m.to });
    showToast('Mode hors-ligne — brouillon par défaut');
  }
}

/* ═══════════════════════ FENÊTRE DE RÉDACTION ═══════════════════════ */
let composeCtx = null;

}

  modal.innerHTML = `
    <div class="modal-h">
      <div class="modal-title">${composeCtx._draftId ? 'Brouillon' : 'Nouveau message'}</div>

    </div>

      <div class="compose-tools">

        ${Object.keys(TEMPLATES).map(k=>`<button type="button" class="tool-btn" data-tpl="${k}">${esc(TEMPLATES[k].label)}</button>`).join('')}

        </div>
        <div class="field"><label for="cTo">À</label><input id="cTo" type="email" value="${esc(opts.to||'')}" placeholder="destinataire@exemple.fr"/></div>
      </div>
      <div class="row-fields">
        <div class="field"><label for="cCc">Cc</label><input id="cCc" type="text" value="${esc(opts.cc||'')}"/></div>
        <div class="field"><label for="cBcc">Cci</label><input id="cBcc" type="text" value="${esc(opts.bcc||'')}"/></div>

        <button type="button" class="btn ghost" onclick="discardCompose()">Annuler</button>
        <button type="button" class="btn" onclick="saveDraft()">${gIco('save')} Brouillon</button>
      </div>
      <button type="button" class="btn primary" id="cSendBtn" onclick="sendMessage()">${gIco('send')} Envoyer</button>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('open');
  updateSigPreview();
  document.getElementById('cFrom').addEventListener('change', updateSigPreview);
  document.getElementById('toolAIDraft').addEventListener('click', aiSuggestDraft);
  document.getElementById('toolAISignature').addEventListener('click', aiAdaptSignature);
  document.getElementById('toolSmartReply').addEventListener('click', ()=>{ if(typeof window.aiSmartReplyEmail==='function') window.aiSmartReplyEmail(); });
  modal.querySelectorAll('[data-tpl]').forEach(b=>b.addEventListener('click', ()=>applyTemplate(b.dataset.tpl)));
  setTimeout(()=>{ const t=document.getElementById(opts.to ? 'cBody' : 'cTo'); if(t){ t.focus(); if(t.id==='cBody') t.setSelectionRange(0,0); } }, 50);
