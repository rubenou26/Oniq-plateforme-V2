function closeModal(){
  document.getElementById('modal-bg').classList.remove('open');
  composeCtx = null;
  if(_pendingSend){ /* l'envoi en cours continue, l'accusé s'affichera */ }
}
function discardCompose(){
  if(composeCtx && composeCtx._draftId){
    const i = S.drafts.findIndex(d=>d.id===composeCtx._draftId);
    if(i>=0) S.drafts.splice(i,1);
    S.ui.selectedId = null;
    saveCloud();
  }
  closeModal();
  renderAll();
}

function updateSigPreview(){
  const el = document.getElementById('sigPreview');
  if(!el) return;
  el.textContent = buildSignatureForCurrentAlias();
}
/* Signature adaptée à la boîte expéditrice */
function buildSignatureForCurrentAlias(){
  const sel = document.getElementById('cFrom');
  const cur = (sel && sel.value) || (S.ui && S.ui.currentAlias);
  if(cur && cur !== S.user.email){
    const a = (S.aliases||[]).find(x=>x.alias===cur);
    const domain = cur.split('@')[1] || '';
    let company = a && a.display_name ? a.display_name.replace(/^contact\s+/i,'').trim() : '';
    if(!company) company = (domain.split('.')[0]||'').toUpperCase();
    return `— ${S.user.name||'Vous'}\n${S.user.role||'Direction'} · ${company}\n${cur}\n${S.user.site||domain}`;
  }
  return (S.signatures && S.signatures[0] && S.signatures[0].content) || `— ${S.user.name}\n${S.user.role} · ${S.user.company}\n${S.user.email}\n${S.user.site||''}`;
}

function applyTemplate(key){
  const tpl = TEMPLATES[key];
  if(!tpl) return;
  const sBox = document.getElementById('cSubject');
  const bBox = document.getElementById('cBody');
  if(sBox && !sBox.value) sBox.value = tpl.subject;
  if(bBox){ bBox.value = tpl.body + '\n\n'; bBox.focus(); }
  showToast('Modèle "' + tpl.label + '" appliqué');
}

async function aiSuggestDraft(){
  const to = (document.getElementById('cTo').value || '').trim();
  const subj = (document.getElementById('cSubject').value || '').trim();
  if(!to && !subj){ showToast('Renseignez le destinataire ou le sujet'); return; }
  showToast('✦ IA génère un brouillon…');
  try{
    const prompt = `Tu es l'assistant email d'un dirigeant d'entreprise BTP française. Rédige un email professionnel court et chaleureux. Vouvoiement. Pas de signature.

DESTINATAIRE: ${to}
SUJET: ${subj || '(à proposer)'}

Si le sujet est vide, propose-en un en première ligne sous la forme "Sujet: ...". Puis le corps.`;
    const result = await callMistral({messages:[{role:'user',content:prompt}], temperature:0.6}, 25000);
    let txt = String((result && (result.content || result.text || result)) || '').trim();
    const sm = txt.match(/^Sujet\s*:\s*(.+)$/m);
    if(sm){
      const sb = document.getElementById('cSubject'); if(sb) sb.value = sm[1].trim();
      txt = txt.replace(/^Sujet\s*:\s*.+$/m,'').trim();
    }
    const bb = document.getElementById('cBody'); if(bb) bb.value = txt + '\n\n';
    showToast('Brouillon IA inséré');
  }catch(e){
    showToast('IA indisponible — mode hors-ligne');
  }
}

async function aiAdaptSignature(){
  if(!S.settings.aiSignature){ showToast('Activez « Adapter au destinataire » dans les Paramètres'); return; }
  const to = (document.getElementById('cTo').value || '').trim();
  if(!to){ showToast('Renseignez le destinataire'); return; }
  showToast('✦ IA adapte la signature…');
  try{
    const prompt = `Adapte cette signature email selon le contexte du destinataire. Reste sobre, français, professionnel. Format brut, pas de markdown.

SIGNATURE BASE:
— ${S.user.name}
${S.user.role} · ${S.user.company}
${S.user.email}
${S.user.phone || ''}
${S.user.site || ''}
${S.user.linkedin ? 'LinkedIn: '+S.user.linkedin : ''}

DESTINATAIRE: ${to}

Variante adaptée (3-6 lignes) :`;
    const result = await callMistral({messages:[{role:'user',content:prompt}], temperature:0.4}, 20000);
    const txt = String((result && (result.content || result.text || result)) || '').trim();
    if(txt){
      const body = document.getElementById('cBody');
      if(body) body.value = body.value.replace(/\n*— [\s\S]*$/,'').trimEnd() + '\n\n' + txt + '\n';
      showToast('Signature adaptée');
    }
  }catch(e){
    showToast('IA indisponible');
  }
}

/* ───────── ENVOI (pont send-reply → Resend, simulé en démo) ───────── */
let _pendingSend = null;
let _sendTimeout = null;
function _resetSendBtn(){ const b=document.getElementById('cSendBtn'); if(b){ b.disabled=false; b.innerHTML = b.dataset.label || (gIco('send')+' Envoyer'); } }
function showSendError(msg){ const e=document.getElementById('cSendErr'); if(e){ e.textContent=msg; e.style.display='block'; } else { showToast(msg); } }

function sendMessage(){
  const to = (document.getElementById('cTo').value || '').trim();
  const cc = (document.getElementById('cCc').value || '').trim();
  const bcc = (document.getElementById('cBcc').value || '').trim();
  const subj = (document.getElementById('cSubject').value || '').trim();
  const body = document.getElementById('cBody').value || '';
  if(!to){ showToast('Destinataire manquant'); return; }
  if(!subj){ showToast('Sujet manquant'); return; }
  if(_pendingSend) return; /* anti double-envoi */

  let finalBody = body;
  const sig = buildSignatureForCurrentAlias();
  if(sig && !body.includes(sig.split('\n')[0])) finalBody = body.trimEnd() + '\n\n' + sig;

  const fromSel = document.getElementById('cFrom');
  const fromAlias = (fromSel && fromSel.value) || defaultFromAlias();

  const _btn=document.getElementById('cSendBtn');
  if(_btn){ _btn.disabled=true; _btn.dataset.label=_btn.innerHTML; _btn.textContent='Envoi…'; }
  const _ep=document.getElementById('cSendErr'); if(_ep){ _ep.style.display='none'; _ep.textContent=''; }
  showToast('Envoi en cours…');
  _pendingSend = { to, cc, bcc, subj, finalBody, fromAlias, draftId: composeCtx && composeCtx._draftId, campaign: composeCtx && composeCtx.campaign };
  if(_sendTimeout) clearTimeout(_sendTimeout);
  _sendTimeout = setTimeout(()=>{
    _pendingSend=null; _resetSendBtn();
    showSendError('Délai dépassé (30 s) — le serveur n\'a pas répondu.');
  }, 30000);
  parentPost({type:'onipromail-send-email',from_alias:fromAlias,to:to,cc:cc||null,bcc:bcc||null,subject:subj,body:finalBody});
}
window.addEventListener('message',function(evt){
  if(!evt.data || evt.data.type!=='onipromail-send-email-result') return;
  if(_sendTimeout){ clearTimeout(_sendTimeout); _sendTimeout=null; }
  if(evt.data.ok && _pendingSend){
    const p=_pendingSend;
    if(p.draftId){ const i=S.drafts.findIndex(d=>d.id===p.draftId); if(i>=0)S.drafts.splice(i,1); if(S.ui.selectedId===p.draftId) S.ui.selectedId=null; }
    const now = new Date().toISOString();
    const item = {id:uid(),to:p.to,cc:p.cc,bcc:p.bcc,from:S.user.name,fromEmail:p.fromAlias,subject:p.subj,body:p.finalBody,date:now,
      category:classifyHeuristic({from:p.to,subject:p.subj,body:p.finalBody}), campaign:p.campaign||null,
      ref: evt.data.id || null, track:{accepted:now, delivered:null, opened:null, replied:null}};
    S.sent.unshift(item);
    _pendingSend=null;
    closeModal(); saveCloud(); renderAll();
    showToast('✓ Message envoyé');
    showReceipt(item);
    demoAfterSend(item);
  }else{
    _pendingSend=null; _resetSendBtn();
    showSendError('Échec de l\'envoi : '+(evt.data.error||'erreur inconnue'));
  }
});

function saveDraft(){
  const to = (document.getElementById('cTo').value || '').trim();
  const cc = (document.getElementById('cCc').value || '').trim();
  const bcc = (document.getElementById('cBcc').value || '').trim();
  const subj = (document.getElementById('cSubject').value || '').trim();
  const body = document.getElementById('cBody').value || '';
  if(!to && !subj && !body.trim()){ closeModal(); return; }
  let draft;
  if(composeCtx && composeCtx._draftId) draft = S.drafts.find(d=>d.id===composeCtx._draftId);
  if(!draft){ draft = { id: uid() }; S.drafts.unshift(draft); }
  Object.assign(draft, { to, cc, bcc, subject:subj, body, date: new Date().toISOString(), from:'Vous',
    category: classifyHeuristic({from:to, subject:subj, body}), campaign: composeCtx && composeCtx.campaign || null });
  closeModal();
  saveCloud();
  showToast('Brouillon enregistré');
  renderAll();
}

/* ───────── ACCUSÉ D'ENVOI (carte visuelle, se met à jour en direct) ───────── */
const _receipts = {};
function showReceipt(item){
  const wrap = document.getElementById('toast-wrap'); if(!wrap) return;
  const el = document.createElement('div');
  el.className = 'receipt';
  el.setAttribute('role','status');
  el.innerHTML = `
    <div class="receipt-h"><span class="ok-ic">${gIco('check').replace('class="i"','class="i" style="width:12px;height:12px;stroke-width:2.4"')}</span><b>Message envoyé</b><button type="button" aria-label="Fermer l'accusé">✕</button></div>
    <div class="receipt-b">
      <span>De</span><div class="m">${esc(item.fromEmail)}</div>
      <span>À</span><div class="m">${esc(item.to)}</div>
      <span>Objet</span><div>${esc(item.subject)}</div>
      <span>Réf.</span><div class="m">${esc(item.ref||'—')}</div>
    </div>
    <div class="receipt-t">
      <div class="et fait" data-k="accepted"><i></i>Accepté<b>${esc(fmtHeure(item.track.accepted))}</b></div>
      <div class="et encours" data-k="delivered"><i></i>Délivré<b>—</b></div>
      <div class="et" data-k="opened"><i></i>Ouvert<b>—</b></div>
      <div class="et" data-k="replied"><i></i>Réponse<b>—</b></div>
    </div>
    <div class="receipt-f" hidden><button type="button" class="btn sm" data-open-reply>Ouvrir la réponse</button></div>`;
  el.querySelector('.receipt-h button').addEventListener('click', ()=>{ el.remove(); delete _receipts[item.id]; });
  wrap.appendChild(el);
  _receipts[item.id] = el;
  el._timer = setTimeout(()=>{ if(el.isConnected){ el.remove(); delete _receipts[item.id]; } }, 45000);
}
function receiptStep(id, key, iso){
  const el = _receipts[id]; if(!el) return;
  const order = ['accepted','delivered','opened','replied'];
  const et = el.querySelector('[data-k="'+key+'"]'); if(!et) return;
  et.classList.remove('encours'); et.classList.add('fait');
  const b = et.querySelector('b'); if(b) b.textContent = fmtHeure(iso);
  const next = order[order.indexOf(key)+1];
  if(next){ const n = el.querySelector('[data-k="'+next+'"]'); if(n && !n.classList.contains('fait')) n.classList.add('encours'); }
}

/* ═══════════════════════ PARAMÈTRES ═══════════════════════ */
function runDomainSetup(){
  const dom=(S.settings.domain||'').trim();
  if(!dom){ showToast('Saisissez votre domaine d\'abord'); return; }
  if(S.settings._domainChecking) return;
  const action=(S.settings.domainRecords && S.settings.domainRecords.length)?'verify':'setup';
  S.settings._domainChecking=true;
  showToast(action==='setup'?'Configuration du domaine…':'Vérification DNS…');
  const b=document.getElementById('btnVerifyDomain'); if(b){ b.disabled=true; b.textContent='En cours…'; }
  parentPost({type:'onipromail-domain-setup',domain:dom,action:action});
}
window.addEventListener('message',function(evt){
  if(!evt.data || evt.data.type!=='onipromail-domain-setup-result') return;
  S.settings._domainChecking=false;
  const r=evt.data.result;
  if(r && r.ok){
    S.settings.domainRecords = r.records||[];
    S.settings.domainStatus = r.status||'';
    S.settings.domainVerified = !!r.verified;
    S.settings._domainHint = r.hint||'';
    saveCloud();
    showToast(r.verified?'Domaine vérifié ✓':'DNS récupérés — ajoutez-les puis revérifiez');
  }else{
    S.settings._domainHint = evt.data.error || (r&&r.error) || 'Échec de la vérification';
    showToast('Domaine : '+(evt.data.error||(r&&r.error)||'erreur'));
  }
  if(S.ui.folder==='settings') renderContent();
});

  const verified = S.settings.domainVerified;
  const recs = (S.settings.domainRecords||[]);

  const aliases = (S.settings.aliases||[]).map(a=>`
    <div class="alias-row">
      <span class="alias">${esc(a.name)}@${esc(dom||'votredomaine.fr')}</span>
      <span class="target">→ ${esc(a.target||'principal')}</span>
      <button type="button" class="btn danger sm" data-alias-rm="${esc(a.name)}">Supprimer</button>
    </div>`).join('');

function bindSettings(){
  const $ = id=>document.getElementById(id);
  $('setDomain') && $('setDomain').addEventListener('change', e=>{
    const v = e.target.value.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/\/$/,'');
    if(v === S.settings.domain) return;
    S.settings.domain = v;
    S.settings.domainVerified = false;
    S.settings.domainRecords = [];
    S.settings.domainStatus = '';
    S.settings._domainHint = '';
    saveCloud();
    renderAll();
  });
  $('btnVerifyDomain') && $('btnVerifyDomain').addEventListener('click', runDomainSetup);
  $('btnWizard') && $('btnWizard').addEventListener('click', ()=>renderOnboarding('choose'));
  document.querySelectorAll('.dns-copy').forEach(c=>c.addEventListener('click', ()=>copyText(c.dataset.copy)));

  $('btnAddAlias') && $('btnAddAlias').addEventListener('click', ()=>{
    const v = (($('newAlias')||{}).value||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');
    if(!v) return;
    if(!S.settings.aliases.find(a=>a.name===v)){
      S.settings.aliases.push({ name:v, target:'principal' });
      saveCloud(); renderAll();
      showToast('Alias '+v+'@'+(S.settings.domain||'votredomaine.fr')+' créé');
    }
  });
  document.querySelectorAll('[data-alias-rm]').forEach(b=>{
    b.addEventListener('click', ()=>{
      S.settings.aliases = S.settings.aliases.filter(a=>a.name!==b.dataset.aliasRm);
      saveCloud(); renderAll();
    });
  });

  ['setName','setRole','setCompany','setPhone','setSite','setLinkedin'].forEach(id=>{
    const el = $(id); if(!el) return;
    el.addEventListener('blur', ()=>{
      const k = id.replace('set','').toLowerCase();
      S.user[k] = el.value.trim();
      saveCloud();
      renderSidenav();
    });
  });
  $('btnSaveSig') && $('btnSaveSig').addEventListener('click', ()=>{
    if(!S.signatures[0]) S.signatures.push({id:'default',name:'Signature standard',content:''});
    S.signatures[0].content = `— ${S.user.name||'Vous'}\n${S.user.role||''} · ${S.user.company||''}\n${S.user.email}${S.user.phone? '\nTél : '+S.user.phone:''}${S.user.site?'\n'+S.user.site:''}${S.user.linkedin?'\nLinkedIn: '+S.user.linkedin:''}`.replace(/\n+$/,'');
    saveCloud();
    showToast('Signature enregistrée');
  });
  $('togAISig') && $('togAISig').addEventListener('click', ()=>{ S.settings.aiSignature = !S.settings.aiSignature; saveCloud(); renderAll(); });
  $('togAICat') && $('togAICat').addEventListener('click', ()=>{ S.settings.aiCategorize = !S.settings.aiCategorize; saveCloud(); renderAll(); });
  $('togAuto') && $('togAuto').addEventListener('click', ()=>{
    S.settings.autoReply = S.settings.autoReply || {};
    S.settings.autoReply.enabled = !S.settings.autoReply.enabled;
    saveCloud(); renderAll();
  });
  $('setAutoMsg') && $('setAutoMsg').addEventListener('blur', e=>{ S.settings.autoReply = S.settings.autoReply || {}; S.settings.autoReply.message = e.target.value; saveCloud(); });
  $('setForward') && $('setForward').addEventListener('blur', e=>{ S.settings.forwardTo = e.target.value.trim(); saveCloud(); });
  $('btnGenApi') && $('btnGenApi').addEventListener('click', ()=>{
    S.settings.apiKey = 'opm_' + Math.random().toString(36).substr(2,12) + Math.random().toString(36).substr(2,12);
    saveCloud(); renderAll();
    showToast('Nouvelle clé API générée');
  });
}

function syncNow(){
  setSync('saving');
  saveLocal();
  fetchEmailsFromCloud();
  setTimeout(()=>{ setSync('saved'); showToast('Boîte à jour — aucun nouveau message sur le serveur de démo'); }, 700);
}
function openHelp(){
  showToast('OniPromail · 7 catégories IA · 5 modèles · multi-boîtes · campagnes · DNS Resend/Cloudflare');
}
function exportData(){
  try{
    const blob = new Blob([JSON.stringify({messages:S.messages, sent:S.sent, drafts:S.drafts, campaigns:S.campaigns}, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'onipromail-demo-export-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 200);
    showToast('Export téléchargé');
  }catch(e){ showToast('Export impossible'); }
}
function onSearch(q){
  S.ui.search = String(q||'');
  if(S.ui.folder === 'settings' || S.ui.folder === 'campaigns'){
    if(S.ui.search){ S.ui.folder = 'inbox'; S.ui.selectedId = null; renderAll(); }
    return;
  }
  renderList();
}

/* ════════════════════════════════════════════════════════════════════
   CAMPAGNES — prospection par e-mail (séquences + relances)
   Écran ajouté pour la démo : statistiques d'envoi, d'ouverture,
   de réponse et de rendez-vous, reliées aux réponses de la boîte.
   ════════════════════════════════════════════════════════════════════ */
const CAMP_STATUS = { running:['En cours','e-ok'], done:['Terminée','e-neu'], scheduled:['Programmée','e-att'], paused:['En pause','e-att'] };
const STEP_STATUS = { done:['Envoyée','e-ok'], scheduled:['Programmée','e-att'], sending:['Envoi…','e-sig'] };
const RCP_STATUS  = { rdv:['RDV','e-ok'], replied:['Répondu','e-sig'], opened:['Ouvert','e-neu'], sent:['Envoyé','e-neu'], auto:['Absent','e-att'], unsub:['Désinscrit','e-att'], bounced:['Rebond','e-ret'] };
function campSent(c){ return c.steps.reduce((a,s)=>a+(s.sent||0),0); }
function openCampaign(id){ S.ui.folder='campaigns'; S.ui.campaignId=id; S.ui.selectedId=null; S.ui.category=null; renderAll(); saveLocal(); }

function renderCampaignsHTML(){
  const cs = S.campaigns || [];
  const sel = campById(S.ui.campaignId) || cs[0];
  const tot = cs.reduce((a,c)=>({contacts:a.contacts+c.contacts, sent:a.sent+campSent(c), opened:a.opened+c.opened, replied:a.replied+c.replied, meetings:a.meetings+c.meetings}),{contacts:0,sent:0,opened:0,replied:0,meetings:0});
  let html = `
    <div class="kpis" aria-label="Indicateurs de prospection">
      <div class="kpi"><div class="lib">Contacts ciblés</div><div class="val">${fmtN(tot.contacts)}</div><div class="note">${cs.length} campagnes</div></div>
      <div class="kpi"><div class="lib">E-mails envoyés</div><div class="val" data-kpi="sent">${fmtN(tot.sent)}</div><div class="note">séquences et relances</div></div>
      <div class="kpi"><div class="lib">Ouverts</div><div class="val" data-kpi="opened">${fmtN(tot.opened)}</div><div class="note">${fmtPct(tot.opened, tot.contacts)} des contacts</div></div>
      <div class="kpi bleu"><div class="lib">Réponses</div><div class="val" data-kpi="replied">${fmtN(tot.replied)}</div><div class="note">${fmtPct(tot.replied, tot.contacts)} de taux de réponse</div></div>
      <div class="kpi vert"><div class="lib">Rendez-vous</div><div class="val">${fmtN(tot.meetings)}</div><div class="note">${fmtPct(tot.meetings, tot.replied)} des réponses</div></div>
    </div>

    <section class="panneau">
      <header><div><h2>Campagnes</h2><div class="aide">Cliquez sur une ligne pour voir la séquence et les destinataires</div></div>
        <button type="button" class="btn sm" data-camp-act="new">${gIco('plus')} Nouvelle campagne</button></header>
      <div class="tbl-scroll" style="border:none;border-radius:0;margin:0">
      <table class="tbl">
        <thead><tr><th>Campagne</th><th class="col-exp">Expéditeur</th><th>Statut</th><th class="n">Envoyés</th><th class="n">Ouverts</th><th class="n">Réponses</th><th class="n">RDV</th></tr></thead>
        <tbody>
          ${cs.map(c=>{ const st = CAMP_STATUS[c.status]||['—','e-neu']; return `
          <tr data-camp="${esc(c.id)}" class="${sel&&sel.id===c.id?'sel':''}" tabindex="0">
            <td class="nom"><b style="font-weight:500">${esc(c.name)}</b><span class="sec">${esc(c.audience)}</span></td>
            <td class="mono col-exp" style="font-size:11.5px;color:var(--attenue)">${esc(c.from)}</td>
            <td><span class="etat ${st[1]}">${st[0]}</span></td>
            <td class="n">${fmtN(campSent(c))}</td>
            <td class="n">${fmtN(c.opened)} <span class="sec" style="display:inline">${fmtPct(c.opened,c.contacts)}</span></td>
            <td class="n">${fmtN(c.replied)} <span class="sec" style="display:inline">${fmtPct(c.replied,c.contacts)}</span></td>
            <td class="n">${fmtN(c.meetings)}</td>
          </tr>`; }).join('')}
        </tbody>
      </table>
      </div>
    </section>`;
  if(sel) html += renderCampaignDetail(sel);
  return html;
}

function renderCampaignDetail(c){
  const st = CAMP_STATUS[c.status]||['—','e-neu'];
  const next = c.steps.find(s=>s.state==='scheduled');
  const sending = c.steps.find(s=>s.state==='sending');
  const inbox = S.messages.filter(m=>m.campaign===c.id).length;
  const bar = (lbl, n, cls, note)=>`<div class="fr-row"><span class="l">${lbl}</span><div class="barre-p ${cls}"><i style="width:${c.contacts? Math.max(1.5, n/c.contacts*100):0}%"></i></div><span class="v">${fmtN(n)}<small>${note}</small></span></div>`;
  return `
    <section class="panneau" id="camp-detail">
      <header>
        <div><h2>${esc(c.name)} <span class="etat ${st[1]}" style="margin-left:6px;vertical-align:2px">${st[0]}</span></h2>
          <div class="aide">${esc(c.audience)} · envoi depuis <span class="mono">${esc(c.from)}</span></div></div>
        <div class="camp-actions">
          <button type="button" class="btn sm" data-camp-act="replies">${gIco('inbox')} Voir les réponses${inbox?` (${inbox})`:''}</button>
          ${next ? `<button type="button" class="btn sm primary" data-camp-act="send-next">${gIco('send')} Envoyer « ${esc(next.label)} » maintenant</button>` : ''}
          ${!next && !sending ? `<button type="button" class="btn sm" data-camp-act="duplicate">Dupliquer</button>` : ''}
        </div>
      </header>
      <div class="duo" style="padding:18px">
        <div>
          <div class="fl" style="margin-bottom:12px">Entonnoir</div>
          <div class="funnel">
            ${bar('Contacts', c.contacts, 'neutre', '100 %')}
            ${bar('Ouverts', c.opened, 'att', fmtPct(c.opened,c.contacts))}
            ${bar('Réponses', c.replied, '', fmtPct(c.replied,c.contacts))}
            ${bar('Rendez-vous', c.meetings, 'vert', fmtPct(c.meetings,c.contacts))}
          </div>
          <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--faible)">
            <span><b class="mono" style="color:var(--texte);font-weight:500">${fmtN(campSent(c))}</b> e-mails envoyés</span>
            <span><b class="mono" style="color:var(--texte);font-weight:500">${fmtN(c.bounced)}</b> rebonds</span>
            <span><b class="mono" style="color:var(--texte);font-weight:500">${fmtN(c.unsub)}</b> désinscriptions</span>
          </div>
        </div>
        <div style="border:1px solid var(--filet);border-radius:10px;overflow:hidden">
          <ul class="steps">
            ${c.steps.map(s=>{ const ss = STEP_STATUS[s.state]||['—','e-neu']; const tgt = s.target||s.sent; return `
            <li class="step">
              <span class="jour">J+${s.day}</span>
              <div style="min-width:0">
                <b>${esc(s.label)}</b>
                <div class="obj" title="${esc(s.subject)}">${esc(s.subject)}</div>
                ${s.state==='scheduled' ? `<div class="chiffres"><span>${esc(fmtDateLong(s.date))}</span><span><b>${fmtN(s.target)}</b>destinataires sans réponse</span></div>` : ''}
                ${s.state==='sending' ? `<div class="prog"><div class="barre-p"><i data-step-bar="${esc(c.id)}-${esc(s.key)}" style="width:${tgt? (s.progress||0)/tgt*100:0}%"></i></div><div class="t" data-step-txt="${esc(c.id)}-${esc(s.key)}">${fmtN(s.progress||0)} / ${fmtN(tgt)} envoyés</div></div>` : ''}
                ${s.state==='done' ? `<div class="chiffres"><span><b>${fmtN(s.sent)}</b>envoyés</span><span><b>${fmtN(s.opened)}</b>ouvertures</span><span><b>${fmtN(s.replied)}</b>réponses</span><span>${esc(fmtDate(s.date))}</span></div>` : ''}
              </div>
              <span class="etat ${ss[1]}">${ss[0]}</span>
            </li>`; }).join('')}
          </ul>
        </div>
      </div>
      <div style="border-top:1px solid var(--filet)">
        <div style="padding:14px 18px 4px" class="fl">Destinataires — ${c.recipients.length} derniers sur ${fmtN(c.contacts)}</div>
        <div class="tbl-scroll" style="border:none;border-radius:0;margin:0">
        <table class="tbl">
          <thead><tr><th>Contact</th><th>Organisation</th><th>Adresse</th><th>Statut</th><th class="n">Dernière activité</th></tr></thead>
          <tbody>
            ${c.recipients.map(r=>{ const rs = RCP_STATUS[r.status]||['—','e-neu']; return `
            <tr><td>${esc(r.name)}</td><td>${esc(r.org)}<span class="sec">${esc(r.city)}</span></td>
              <td class="mono" style="font-size:11.5px;color:var(--attenue)">${esc(r.email)}</td>
              <td><span class="etat ${rs[1]}">${rs[0]}</span></td>
              <td class="n" style="color:var(--attenue)">${esc(fmtDate(r.last))}</td></tr>`; }).join('')}
          </tbody>
        </table>
        </div>
      </div>

function campSendNextStep(c){
  const st = c.steps.find(s=>s.state==='scheduled'); if(!st) return;
  st.state = 'sending'; st.progress = 0;
  renderContent();
  showToast('Envoi de « '+st.label+' » à '+fmtN(st.target)+' destinataires (simulé)');
  const total = st.target;
  let n = 0;
  const iv = setInterval(()=>{
    n = Math.min(total, n + Math.ceil(total/16));
    st.progress = n;
    const b = document.querySelector('[data-step-bar="'+c.id+'-'+st.key+'"]');
    const t = document.querySelector('[data-step-txt="'+c.id+'-'+st.key+'"]');
    if(b) b.style.width = (n/total*100)+'%';
    if(t) t.textContent = fmtN(n)+' / '+fmtN(total)+' envoyés';
    if(n>=total){
      clearInterval(iv);
      st.state='done'; st.sent=total; st.date=new Date().toISOString(); delete st.progress;
      saveCloud(); campRefresh();
      showToast('✓ « '+st.label+' » envoyée — '+fmtN(total)+' e-mails acceptés');
      campAfterSend(c, st);
    }
  }, 190);
}

      rdv:'Bonjour,\n\nJe vous propose de fixer une visite sur place afin d\'examiner votre projet. Seriez-vous disponible mardi ou jeudi prochain, en matinée ?\n\nDans l\'attente de votre retour,',
      devis:'Bonjour,\n\nSuite à notre échange, je vous prie de trouver ci-joint notre proposition chiffrée. Elle détaille les travaux, le planning prévisionnel et les conditions de règlement.\n\nJe reste à votre disposition pour en parler de vive voix,',
      facture:'Bonjour,\n\nVeuillez trouver ci-joint notre facture correspondant aux travaux réalisés. Je vous remercie par avance pour votre règlement à échéance.\n\nCordialement,',
      general:'Bonjour,\n\nJe me permets de revenir vers vous au sujet de votre projet. Nous serions ravis de vous accompagner : pouvons-nous convenir d\'un court échange téléphonique cette semaine ?\n\nBien cordialement,'
    };
    return pre + (B[topic] || B.general) + (dest ? '' : '');
  }
  return 'Bonjour,\n\nMerci pour votre message. Je reviens vers vous rapidement.\n\nCordialement,';
}

/* ═══════════════════════════════════════════════════════════════════════
   ASSISTANT DE CONFIGURATION (onboarding)
   En démo : le compte est déjà configuré ; l'assistant s'ouvre depuis
   Paramètres › Domaine personnalisé. L'écran « se connecter / créer un
   compte ONIQ » de l'original est retiré (pas de connexion en démo).
   ═══════════════════════════════════════════════════════════════════════ */
function maybeShowOnboarding(){
  if(S._isAuthed === null) return;
  const hasDomain   = !!(S.settings && S.settings.domain && String(S.settings.domain).trim());
  const hasAliases  = !!(S.aliases && S.aliases.length);
  const hasExternal = !!(S.settings && S.settings.externalEmail && String(S.settings.externalEmail).trim());
  if(hasDomain || hasAliases || hasExternal){ hideOnboarding(); return; }
  renderOnboarding('choose');
}
function hideOnboarding(){
  const el = document.getElementById('opm-onboard'); if(el) el.remove();
  document.body.style.overflow = '';
  if(_onbKey){ document.removeEventListener('keydown', _onbKey); _onbKey = null; }
}
let _onbKey = null;
function renderOnboarding(step){
  let el = document.getElementById('opm-onboard');
  if(!el){ el = document.createElement('div'); el.id = 'opm-onboard'; document.body.appendChild(el); }
  document.body.style.overflow = 'hidden';
  if(!_onbKey){ _onbKey = (e)=>{ if(e.key==='Escape') hideOnboarding(); }; document.addEventListener('keydown', _onbKey); }
  const safeEmail = esc(S.user.email || '');

  if(step === 'choose'){
    el.innerHTML = ''
      + '<div class="opm-onb-wrap" role="dialog" aria-modal="true" aria-labelledby="opm-onb-title">'
      +   '<div class="opm-onb-card opm-onb-card-wide">'
      +     '<div class="opm-onb-eyebrow">OniPromail · Première utilisation</div>'
      +     '<div id="opm-onb-title" class="opm-onb-title">Comment voulez-vous démarrer ?</div>'
      +     '<p class="opm-onb-sub">Connecté en tant que <strong>' + (safeEmail || 'utilisateur') + '</strong>. Choisissez l\'une des deux options pour activer votre boîte mail pro :</p>'
      +     '<div class="opm-onb-choices">'
      +       '<button type="button" class="opm-onb-choice" data-act="goto-new">'
      +         '<div class="opm-onb-choice-ic"><svg class="i" style="width:24px;height:24px" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>'
      +         '<div class="opm-onb-choice-body"><div class="opm-onb-choice-h">Créer un nouveau domaine e-mail</div>'
      +         '<div class="opm-onb-choice-d">Vous avez un nom de domaine (ex : votre-entreprise.fr) que vous souhaitez utiliser pour vos e-mails. Nous vous afficherons les DNS à configurer.</div></div>'
      +         '<div class="opm-onb-choice-go">→</div>'
      +       '</button>'
      +       '<button type="button" class="opm-onb-choice" data-act="goto-connect">'
      +         '<div class="opm-onb-choice-ic"><svg class="i" style="width:24px;height:24px" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></div>'
      +         '<div class="opm-onb-choice-body"><div class="opm-onb-choice-h">Connecter un e-mail existant</div>'
      +         '<div class="opm-onb-choice-d">Vous avez déjà une adresse pro (Google Workspace, Outlook 365, IONOS, OVH…). Nous la connectons à OniPromail pour profiter du tri IA et des signatures.</div></div>'
      +         '<div class="opm-onb-choice-go">→</div>'
      +       '</button>'
      +     '</div>'
      +     '<div class="opm-onb-actions" style="margin-top:6px"><button type="button" class="opm-btn opm-btn-ghost" data-act="later">Plus tard — découvrir l\'app d\'abord</button></div>'
      +   '</div>'
      + '</div>';
  }
  else if(step === 'connect-existing'){
    el.innerHTML = ''
      + '<div class="opm-onb-wrap" role="dialog" aria-modal="true" aria-labelledby="opm-onb-title">'
      +   '<div class="opm-onb-card">'
      +     '<div class="opm-onb-eyebrow">OniPromail · Connecter</div>'
      +     '<div id="opm-onb-title" class="opm-onb-title">Connectons votre e-mail pro existant.</div>'
      +     '<p class="opm-onb-sub">Indiquez l\'adresse e-mail que vous utilisez actuellement (Google Workspace, Outlook 365, IONOS, OVH, etc.). Vous pourrez finaliser la connexion (mot de passe, IMAP) depuis les Réglages.</p>'
      +     '<div class="opm-onb-field">'
      +       '<label for="opm-onb-existing">Adresse e-mail pro existante</label>'
      +       '<input id="opm-onb-existing" type="email" placeholder="contact@votre-entreprise.fr" autocomplete="email"/>'
      +       '<div class="opm-onb-hint" id="opm-onb-existing-hint">Le serveur sera détecté automatiquement à partir du domaine.</div>'
      +     '</div>'
      +     '<div class="opm-onb-actions">'
      +       '<button type="button" class="opm-btn opm-btn-ghost" data-act="back-choose">← Retour</button>'
      +       '<button type="button" class="opm-btn opm-btn-primary" data-act="save-existing">Continuer →</button>'
      +     '</div>'
      +   '</div>'
      + '</div>';
  }
  else {
    el.innerHTML = ''
      + '<div class="opm-onb-wrap" role="dialog" aria-modal="true" aria-labelledby="opm-onb-title">'
      +   '<div class="opm-onb-card">'
      +     '<div class="opm-onb-eyebrow">OniPromail · Nouveau domaine</div>'
      +     '<div id="opm-onb-title" class="opm-onb-title">Configurez votre domaine e-mail.</div>'
      +     '<p class="opm-onb-sub">Indiquez le domaine que vous souhaitez utiliser pour vos e-mails pro (ex : votre-entreprise.fr). Nous vous afficherons les DNS à configurer.</p>'
      +     '<div class="opm-onb-field">'
      +       '<label for="opm-onb-domain">Domaine</label>'
      +       '<input id="opm-onb-domain" type="text" placeholder="votre-entreprise.fr" autocomplete="off"/>'
      +       '<div class="opm-onb-hint">Pas encore de domaine ? Vous pourrez en réserver un depuis les Réglages.</div>'
      +     '</div>'
      +     '<div class="opm-onb-actions">'
      +       '<button type="button" class="opm-btn opm-btn-ghost" data-act="back-choose">← Retour</button>'
      +       '<button type="button" class="opm-btn opm-btn-primary" data-act="save-domain">Continuer →</button>'
      +     '</div>'
      +   '</div>'
      + '</div>';
  }
  const focusable = el.querySelector('input') || el.querySelector('button');
  if(focusable) setTimeout(()=>focusable.focus(), 30);
  el.querySelector('.opm-onb-wrap').addEventListener('click', e=>{ if(e.target.classList.contains('opm-onb-wrap')) hideOnboarding(); });

  el.querySelectorAll('[data-act]').forEach(function(btn){
    btn.addEventListener('click', function(){
      const act = btn.getAttribute('data-act');
      if(act === 'goto-new'){ renderOnboarding('configure'); }
      else if(act === 'goto-connect'){ renderOnboarding('connect-existing'); }
      else if(act === 'back-choose'){ renderOnboarding('choose'); }
      else if(act === 'save-domain'){
        const inp = document.getElementById('opm-onb-domain');
        const d = inp ? inp.value.trim().toLowerCase() : '';
        if(!d || !/^[a-z0-9.-]+\.[a-z]{2,}$/.test(d)){ if(inp){ inp.classList.add('err'); inp.focus(); } return; }
        S.settings.domain = d; S.settings.domainVerified = false; S.settings.domainRecords = []; S.settings.domainStatus = ''; S.settings._domainHint = '';
        saveCloud(); hideOnboarding(); setFolder('settings');
        showToast('Domaine enregistré — lancez « Configurer / vérifier »');
      } else if(act === 'save-existing'){
        const inp = document.getElementById('opm-onb-existing');
        const v = inp ? inp.value.trim().toLowerCase() : '';
        if(!v || !/^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/.test(v)){
          if(inp){ inp.classList.add('err'); inp.focus(); }
          const hint = document.getElementById('opm-onb-existing-hint');
          if(hint){ hint.textContent = 'Adresse e-mail invalide.'; hint.classList.add('err'); }
          return;
        }
        S.settings.externalEmail = v;
        const dom = v.split('@')[1] || '';
        if(dom && dom !== S.settings.domain){ S.settings.domain = dom; S.settings.domainVerified = false; S.settings.domainRecords = []; S.settings._domainHint=''; }
        saveCloud(); hideOnboarding(); setFolder('settings');
      } else if(act === 'later'){ hideOnboarding(); }
    });
  });
}

/* ═══════════════════════ THÈME & RÉINITIALISATION ═══════════════════════ */
function currentTheme(){ return document.documentElement.getAttribute('data-theme')==='light' ? 'light' : 'dark'; }
function updateThemeLabel(){ const l = document.getElementById('lbl-theme'); if(l) l.textContent = currentTheme()==='light' ? 'Thème nuit' : 'Thème jour'; }
function toggleTheme(){
  const t = currentTheme()==='light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('oq-theme', t); }catch(e){}
  updateThemeLabel();
}
window.addEventListener('storage', e=>{
  if(e.key==='oq-theme' && (e.newValue==='dark' || e.newValue==='light')){ document.documentElement.setAttribute('data-theme', e.newValue); updateThemeLabel(); }
});
try{
  const mq = window.matchMedia('(prefers-color-scheme: light)');
  const onMq = ()=>{ let t=null; try{ t=localStorage.getItem('oq-theme'); }catch(_){}
    if(t!=='dark' && t!=='light'){ document.documentElement.setAttribute('data-theme', mq.matches?'light':'dark'); updateThemeLabel(); } };
  if(mq.addEventListener) mq.addEventListener('change', onMq); else if(mq.addListener) mq.addListener(onMq);
}catch(e){}
function resetDemo(){
  _resetting = true;
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  location.reload();
}

/* ═══════════════════════ INIT ═══════════════════════ */
(function init(){
  const had = loadLocal();
  if(!had || !S.messages || !S.messages.length) seedDemoData();
  S._isAuthed = true; S._allowDemo = true;
  S.ui.search = ''; S.ui.aliasDropdownOpen = false;
  loadCloud();
  saveLocal();
  renderAll();
  fetchEmailsFromCloud();
  fetchAliasesFromCloud();
  setSync('idle');
  updateThemeLabel();
  document.getElementById('btn-theme').addEventListener('click', toggleTheme);
  document.getElementById('btn-reset').addEventListener('click', resetDemo);
  setInterval(function(){ if(document.visibilityState==='visible') fetchEmailsFromCloud(); }, 300000);

  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){
      const bg = document.getElementById('modal-bg');
      if(bg && bg.classList.contains('open')) closeModal();
      else closeSide();
    }
  });

  /* Tri IA en arrière-plan (messages sans catégorie) */
  setTimeout(async ()=>{
    if(!S.settings.aiCategorize) return;
    let dirty = false;
    for(const m of S.messages){
      if(!m.category || m.category==='normal'){ try{ m.category = await classifyWithAI(m); dirty = true; }catch(_){} }
    }
    if(dirty){ saveCloud(); renderAll(); }
  }, 800);

  scheduleLiveEmail();
  maybeShowOnboarding();
})();
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   ONIPROMAIL · IA INTÉGRÉE — 1) Résumé e-mail 3 lignes  2) 3 réponses
   suggérées (court / formel / détaillé) + signature contextuelle.
   Les boutons sont intégrés directement au rendu (détail, rédaction).
   ═══════════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  const TIMEOUT_MS = 10000;

  function aipCallMistral(prompt){
    return new Promise((resolve,reject)=>{
      const reqId = 'promail-ia-' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
      const handler = (e)=>{
        if(!e.data || e.data.type !== 'bati-mistral-response' || e.data.reqId !== reqId) return;
        window.removeEventListener('message', handler);
        clearTimeout(timer);
        if(e.data.error){ reject(new Error(e.data.error)); return; }
        const r = e.data.result || {};
        let text = '';
        if(r.content && Array.isArray(r.content) && r.content[0] && r.content[0].text) text = r.content[0].text;
        else if(typeof r.content === 'string') text = r.content;
        else if(typeof r.text === 'string') text = r.text;
        else if(typeof r === 'string') text = r;
        resolve(String(text||'').trim());
      };
      const timer = setTimeout(()=>{ window.removeEventListener('message', handler); reject(new Error('Délai IA dépassé (10 s)')); }, TIMEOUT_MS);
      window.addEventListener('message', handler);
      try{ parentPost({ type:'bati-mistral-request', reqId, payload:{ model:'mistral-small-latest', messages:[{role:'user', content: prompt}] } }); }
      catch(err){ window.removeEventListener('message', handler); clearTimeout(timer); reject(err); }
    });
  }

  function aipDetectAudience(toEmail){
    const to = String(toEmail||'').toLowerCase().trim();
    if(!to) return 'unknown';
    let myDomain = '';
    try{ if(S && S.user && S.user.email){ const m = S.user.email.match(/@(.+)$/); if(m) myDomain = m[1].toLowerCase(); } }catch(_){}
    const toDomain = (to.match(/@(.+)$/)||[])[1] || '';
    if(myDomain && toDomain && toDomain === myDomain) return 'interne';
    return 'client';
  }
  function aipEsc(s){ s = String(s||''); return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const head = (title, extra)=>`<div class="aip-sumcard-h"><span style="color:var(--signal);font-size:12px">✦</span><span class="aip-sumcard-title">${title}</span>${extra||''}<button type="button" class="aip-sumcard-close" title="Fermer" aria-label="Fermer">✕</button></div>`;

  /* 1) RÉSUMÉ E-MAIL — 3 lignes */
  window.aiEmailSummarize = async function aiEmailSummarize(messageId){
    const id = messageId || (S && S.ui && S.ui.selectedId);
    if(!id){ showToast('Aucun e-mail sélectionné'); return; }
    const m = findMsgById(id);
    if(!m){ showToast('E-mail introuvable'); return; }
    const pane = document.getElementById('mdet');
    if(!pane) return;
    const old = pane.querySelector('.aip-sumcard'); if(old) old.remove();
    const anchor = pane.querySelector('.mdet-actions') || pane.querySelector('.mdet-h');
    const card = document.createElement('div');
    card.className = 'aip-sumcard';
    card.setAttribute('aria-live','polite');
    card.innerHTML = head('Résumé IA en 3 lignes', '<span class="aip-sumcard-badge">Mistral</span>') + '<div class="aip-skel"></div><div class="aip-skel w80"></div><div class="aip-skel w65"></div>';
    if(anchor && anchor.nextSibling) anchor.parentNode.insertBefore(card, anchor.nextSibling); else pane.appendChild(card);
    card.querySelector('.aip-sumcard-close').addEventListener('click', ()=>card.remove());

    const subject = String(m.subject||'(sans objet)');
    const from = String(m.from||'')+' <'+String(m.fromEmail||'')+'>';
    const body = String(m.body||'').slice(0, 4500);
    let threadCtx = '';
    try{
      const root = subject.replace(/^(re|tr|fwd|fw)\s*:\s*/i,'').trim().toLowerCase();
      const related = S.messages.filter(x=> x && x.id!==m.id && (String(x.subject||'').replace(/^(re|tr|fwd|fw)\s*:\s*/i,'').trim().toLowerCase() === root)).slice(0,3);
      if(related.length) threadCtx = '\n\nMessages précédents du fil :\n' + related.map(x=>'— ' + (x.from||'') + ' : ' + String(x.body||'').slice(0,400)).join('\n');
    }catch(_){}
    const prompt =
`Tu es l'assistant email d'un dirigeant d'entreprise BTP française. Résume cet email en EXACTEMENT 3 lignes courtes :
ligne 1 = l'essence du message ;
ligne 2 = les actions attendues (ou « Aucune action attendue ») ;
ligne 3 = l'urgence/délai (ou « Pas d'urgence »).
Pas de préambule, pas de salutation. Une ligne = une phrase.

DE : ${from}
SUJET : ${subject}

CORPS :
${body}${threadCtx}`;
    try{
      const txt = await aipCallMistral(prompt.replace(/^DE : /m,'DE: ').replace(/^SUJET : /m,'SUJET: ').replace(/^CORPS :/m,'CORPS:'));
      if(!txt) throw new Error('Réponse vide');
      const lines = txt.split(/\r?\n/).map(s=>s.replace(/^[-•◆*\d\.\)\s]+/,'').trim()).filter(Boolean).slice(0,3);
      const items = lines.length ? lines : [txt];
      card.innerHTML = head('Résumé IA en 3 lignes', '<span class="aip-sumcard-badge">Mistral</span>') + `<ul>${items.map(l=>'<li>'+aipEsc(l)+'</li>').join('')}</ul>`;
    }catch(err){
      card.innerHTML = head('Résumé IA indisponible') + `<div class="aip-err">${aipEsc(err && err.message || 'Erreur IA')}</div>`;
    }
    card.querySelector('.aip-sumcard-close').addEventListener('click', ()=>card.remove());
  };

  /* 2) SMART REPLY — 3 brouillons (court / formel / détaillé) */
  window.aiSmartReplyEmail = async function aiSmartReplyEmail(){
    const bodyEl = document.getElementById('cBody');
    const toEl = document.getElementById('cTo');
    const subjEl = document.getElementById('cSubject');
    if(!bodyEl){ showToast('Fenêtre de rédaction introuvable'); return; }
    const to = (toEl && toEl.value || '').trim();
    const subj = (subjEl && subjEl.value || '').trim();
    const existing = (bodyEl.value || '').trim();
    const audience = aipDetectAudience(to);
    let box = document.getElementById('aipSrBox'); if(box) box.remove();
    box = document.createElement('div');
    box.id = 'aipSrBox';
    box.className = 'aip-srbox';
    const lbl = s=> s==='court'?'Court':s==='formel'?'Formel':'Détaillé';
    box.innerHTML = `
      <div class="aip-srbox-h"><span style="color:var(--signal);font-size:12px">✦</span><span class="aip-srbox-title">3 réponses suggérées</span>
        <span class="aip-sumcard-badge">Mistral</span><button type="button" class="aip-srbox-close" title="Fermer" aria-label="Fermer">✕</button></div>
      <div class="aip-sr-stack">
        ${['court','formel','detaille'].map(s=>`<div class="aip-sr-card" data-style="${s}" role="button" tabindex="0"><span class="aip-sr-tag">${lbl(s)}</span><div class="aip-sr-prev"><span class="aip-skel"></span><span class="aip-skel w60"></span></div></div>`).join('')}
      </div>`;
    const bodyField = bodyEl.closest('.field') || bodyEl.parentNode;
    bodyField.parentNode.insertBefore(box, bodyField);
    box.querySelector('.aip-srbox-close').addEventListener('click', ()=>box.remove());
    const styles = [
      {key:'court',    instr:'Réponse TRÈS courte (2-3 phrases max), directe, polie, vouvoiement.'},
      {key:'formel',   instr:'Réponse formelle, structurée, vouvoiement soutenu, formule de politesse complète.'},
      {key:'detaille', instr:'Réponse détaillée (un paragraphe développé), explicative, professionnelle, vouvoiement.'}
    ];
    const ctxLines = [];
    ctxLines.push('DESTINATAIRE: ' + (to||'(non renseigné)') + ' (contexte : ' + (audience==='interne'?'collègue interne':'client/externe') + ')');
    ctxLines.push('SUJET: ' + (subj||'(à proposer)'));
    if(existing){
      const om = existing.match(/--- Message original ---\s*([\s\S]+)$/i);
      if(om) ctxLines.push('MESSAGE ORIGINAL:\n' + om[1].trim().slice(0,2000));
      else ctxLines.push('BROUILLON ACTUEL:\n' + existing.slice(0,1500));
    }
    const baseCtx = ctxLines.join('\n');
    const cards = box.querySelectorAll('.aip-sr-card');
    styles.forEach((st, idx)=>{
      const card = cards[idx];
      const prompt = `Tu es l'assistant email d'un dirigeant d'entreprise BTP française. Rédige UNE réponse email professionnelle.
Style : ${st.instr}
Pas de salutation excessive, pas de signature (signature ajoutée séparément).
Renvoie UNIQUEMENT le corps du mail, sans préfixe ni guillemets.

${baseCtx}`;
      aipCallMistral(prompt).then(txt=>{
        const clean = String(txt||'').replace(/^["'`]+|["'`]+$/g,'').trim();
        if(!clean) throw new Error('Vide');
        card.innerHTML = `<span class="aip-sr-tag">${lbl(st.key)}</span><div class="aip-sr-prev">${aipEsc(clean)}</div><div class="aip-sr-hint">Cliquer pour insérer · survoler pour voir le texte complet</div>`;
        card.title = clean;
        const ins = ()=>aipInsertReply(clean, audience);
        card.addEventListener('click', ins);
        card.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); ins(); } });
      }).catch(err=>{
        card.innerHTML = `<span class="aip-sr-tag">${lbl(st.key)}</span><div class="aip-sr-prev" style="color:var(--retard)">Indisponible (${aipEsc(err.message||'erreur')})</div>`;
      });
    });
  };

  function aipInsertReply(text, audience){
    const body = document.getElementById('cBody');
    if(!body) return;
    let sig = '';
    try{
      if(audience === 'interne'){ sig = '\n\n— ' + (S.user && S.user.name || ''); }
      else {
        const parts = [];
        if(S.user){
          parts.push('— ' + (S.user.name||''));
          if(S.user.role || S.user.company) parts.push((S.user.role||'') + (S.user.company?' · '+S.user.company:''));
          if(S.user.email) parts.push(S.user.email);
          if(S.user.phone) parts.push(S.user.phone);
        }
        sig = '\n\n' + parts.filter(Boolean).join('\n');
      }
    }catch(_){}
    const orig = body.value.match(/\n*--- Message original ---[\s\S]*$/);
    body.value = text + sig + (orig ? '\n' + orig[0] : '');
    body.focus();
    const box = document.getElementById('aipSrBox'); if(box) box.remove();
    showToast('Réponse insérée');
  }
})();
</script>
