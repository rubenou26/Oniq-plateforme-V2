/* Le PDF rejoint le stockage, puis la file d'envoi par son adresse :
   la file reste légère, et le document survit au message. */
async function deposerDevisPdf(fichier,nom){
  var chemin='devis/'+Date.now()+'-'+nom.replace(/[^A-Za-z0-9._-]/g,'_');
  var r=await appelle(URL_BASE+'/storage/v1/object/documents/'+encodeURIComponent(chemin),{
    method:'POST',
    headers:{'apikey':CLE,'Authorization':'Bearer '+(jeton||CLE),
             'Content-Type':'application/pdf','x-upsert':'true'},
    body:fichier});
  if(!r.ok)throw new Error(await r.text());
  return URL_BASE+'/storage/v1/object/public/documents/'+encodeURIComponent(chemin);
}

/* ══ Le devis, depuis la qualification ═════════════════════════════
   Le bouton que le commercial cherche en raccrochant. Il ouvre le
   chiffrage calculé, le laisse corriger ce qu'il veut, puis
   enregistre le devis et le met en file d'envoi.

   Un devis dont un poste n'a pas de prix ne part pas. Il s'enregistre
   en brouillon, et le commercial voit lequel manque. Envoyer un
   montant faux coûte plus cher que d'envoyer une heure plus tard. */
async function devisAuto(p){
  /* Une seule fenêtre pour écrire et pour chiffrer. Le devis vit dans
     le message : les séparer obligeait à composer deux fois, et le
     commercial finissait par tout refaire à la main. */
  mailRapide(p,true);
}


/* Le corps du mail de devis. Le détail chiffré y est en clair : un
   client qui doit ouvrir une pièce jointe pour connaître son prix
   repousse la lecture, et un devis repoussé est un devis perdu. */


/* ══ Le chiffrage automatique ══════════════════════════════════════
   Un devis part sous trente minutes : c'est ce qu'on promet au
   téléphone. Impossible à tenir en ressaisissant vingt lignes. Donc
   la qualification produit le devis, et le commercial corrige plutôt
   qu'il ne compose.

   Deux principes, et ils comptent plus que le calcul lui-même :

   Les prix ne sont pas dans ce fichier. Ils sont dans ls_catalogue,
   trouvés par leur `role`. Le jour où un tarif change, ou qu'un
   logiciel s'ajoute, personne ne redéploie l'application.

   Ce qui n'a pas de prix ne prend pas de prix. Un poste dont on
   ignore le tarif sort en « à chiffrer », visible, dans le
   devis. Un zéro silencieux ferait signer une affaire à perte, et
   c'est exactement ce qu'un chiffrage automatique fait de pire. */

var CATALOGUE=null;
async function catalogue(){
  if(CATALOGUE)return CATALOGUE;
  try{ CATALOGUE=await lire('ls_catalogue','select=*&actif=eq.true&limit=200'); }
  catch(e){ CATALOGUE=[]; }
  return CATALOGUE;
}
function art(cat,role){
  return cat.filter(function(x){ return x.role===role; })[0]||null;
}
function eur(n){
  return (Math.round(n*100)/100).toLocaleString('fr-FR',
    {minimumFractionDigits:2,maximumFractionDigits:2})+' €';
}

/* Le chiffrage d'un appel. ONIQ facture le logiciel, puis sa
   maintenance chaque mois. Trois familles, et la qualification dit
   laquelle : l'adaptation d'un de nos logiciels (le logiciel est
   gratuit, son adaptation ne l'est pas), un projet sur mesure (un
   forfait par type d'outil, plus ce qui s'y ajoute), ou un audit
   d'automatisation. Les options se proposent à zéro : le client voit
   le prix, le commercial passe la quantité à 1 s'il la vend. */
var ROLE_PROJET={'Outil métier ciblé':'sm_outil','Application de gestion':'sm_appli',
  'ERP par modules':'sm_erp','Application mobile ou portail':'sm_mobile'};
/* Ce que chaque forfait couvre déjà, en domaines. Au-delà, un module
   supplémentaire par domaine : c'est ce qui évite l'avenant. */
var MODULES_COMPRIS={sm_outil:1,sm_appli:3,sm_erp:3,sm_mobile:2};

function chiffrer(r,cat){
  var L=[], manques=[], notes=[], provisoires=[];
  var users=Math.max(1,Number(r.nb_utilisateurs)||1);

  /* Le quatrième argument s'ajoute à la désignation du catalogue. Il
     sert à dire ce que l'article est ICI, dans ce devis-là : une
     option qu'on propose, un module de plus. Le catalogue reste
     générique, la ligne du devis est parlante. */
  function pousser(role,qte,libelle,suffixe,puForce){
    var a=art(cat,role);
    if(!a){ manques.push((libelle||role)+' : aucun article ne porte ce rôle dans le catalogue'); return; }
    var des=a.designation+(suffixe?' '+suffixe:'');
    var pu=puForce!=null?puForce:Number(a.pv_ht);
    if(!Number(pu)&&qte!==0){
      manques.push((libelle||a.designation)+' : prix absent du catalogue');
      L.push({designation:des,reference:a.reference,unite:a.unite,
              qte:qte,pu:0,total:0,a_chiffrer:true});
      return;
    }
    L.push({designation:des,reference:a.reference,unite:a.unite,
            qte:qte,pu:Math.round(pu*100)/100,total:Math.round(pu*qte*100)/100,
            a_confirmer:!!a.a_confirmer});
    if(a.a_confirmer&&qte!==0){ var nm=roleLib(role); if(provisoires.indexOf(nm)<0)provisoires.push(nm); }
  }

  var itf=(Array.isArray(r.interfaces)?r.interfaces:[]).length;

  /* La maintenance suit toute livraison : ONIQ facture le logiciel, puis
     son abonnement de maintenance. Chiffrée sur douze mois, le prix
     unitaire est celui d'un mois. */
  function maintenance(){ pousser('pilotage',12,'Maintenance','(par mois, dès la mise en service)'); }

  if(veutLogiciel(r)){
    var lg=Array.isArray(r.logiciels)?r.logiciels:[];
    if(!lg.length)notes.push('Aucun logiciel coché dans la qualification : ajoutez son adaptation depuis le catalogue.');
    /* Nos logiciels sont gratuits : ce qui se facture, c'est de les
       adapter à l'entreprise, une ligne par logiciel. */
    lg.forEach(function(nom){
      var avant=L.length;
      pousser('lg_adaptation',1,'Adaptation — '+nom);
      /* « Adaptation d'un logiciel ONIQ » devient « Adaptation de
         BatiManager » : le client lit ce qu'il a vu en démo. */
      if(L.length>avant){ var d=L[L.length-1].designation, de=/^[aeiouyéAEIOUYÉ]/.test(nom)?'d’':'de ';
        L[L.length-1].designation=/d[’']un logiciel ONIQ/.test(d)?d.replace(/d[’']un logiciel ONIQ/,de+nom):d+' — '+nom; }
    });
    if(r.reprise==='Oui, beaucoup'||r.reprise==='Un peu')pousser('reprise',1,'Reprise des données');
    if(itf)pousser('interface',itf,'Interfaçages');
    pousser('formation',Math.max(1,Math.ceil(users/10)),'Formation');
    maintenance();
    notes.push('Le logiciel lui-même n’est pas facturé : on chiffre son adaptation, la mise en service et la maintenance.');
  }
  else if(veutSurMesure(r)){
    var t=projetRetenu(r), role=ROLE_PROJET[t];
    pousser(role,1,t);
    if(!r.type_projet||r.type_projet==='Je ne sais pas')
      notes.push('Type d’outil non tranché au téléphone : chiffré comme « '+t+' » d’après le nombre de domaines. À confirmer à la maquette.');
    var m=Math.max(1,Number(r.nb_modules)||1), en_plus=m-(MODULES_COMPRIS[role]||1);
    if(en_plus>0){
      if(role==='sm_erp')
        notes.push(m+' domaines : la première vague en couvre trois. Les suivants se chiffrent en deuxième vague, '
          +'une fois le premier en service — ne les mettez pas dans ce devis.');
      else pousser('sm_module',en_plus,'Modules supplémentaires','('+en_plus+' au-delà du forfait)');
    }
    if(r.mobile==='Oui'&&role!=='sm_mobile')
      pousser('sm_mobile',0,'Version terrain','(option : équipes sur le terrain)');
    if(r.ia==='Oui')pousser('sm_ia',1,'Intelligence artificielle');
    if(itf)pousser('interface',itf,'Interfaçages');
    if(r.reprise==='Oui, beaucoup'||r.reprise==='Un peu')pousser('reprise',1,'Reprise des données');
    pousser('formation',Math.max(1,Math.ceil(users/10)),'Formation');
    maintenance();
    notes.push('Le forfait couvre le cadrage, la maquette, la construction, les tests et la documentation. '
      +'Le code livré appartient au client.');
    notes.push('La maquette interactive est offerte : elle part avant le devis ferme, ne la chiffrez pas.');
  }
  else if(veutSite(r)){
    pousser(r.type_site_web==='Site e-commerce'?'sm_ecom':'sm_site',1,r.type_site_web||'Site vitrine');
    if(itf)pousser('interface',itf,'Interfaçages');
    maintenance();
  }
  else if(veutAuto(r)){
    pousser('audit_auto',1,'Audit d’automatisation');
    var na=Number(r.nb_automatisations)||0;
    pousser('automatisation',0,'Automatisations','(option : à la brique, après l’audit)');
    if(r.ia==='Oui')pousser('sm_ia',0,'Intelligence artificielle','(option)');
    if(na)notes.push(na+' tâches déjà en tête : l’audit les chiffrera une par une, par gain annuel. '
      +'L’automatisation est proposée à zéro, passez la quantité après l’audit.');
    pousser('pilotage',0,'Maintenance','(option, par mois, pour les automatisations livrées)');
  }
  else{
    notes.push('Besoin pas encore arrêté : devis de base sur un outil métier ciblé, à reprendre après la maquette.');
    pousser('sm_outil',1,'Outil métier ciblé');
    maintenance();
  }

  /* Un prix provisoire se signale une fois, pas ligne par ligne : une
     liste de huit avertissements identiques ne se lit plus. */
  if(L.some(function(x){ return x.unite==='mois'&&x.qte; }))
    notes.push('Maintenance chiffrée sur douze mois : le prix unitaire est le montant mensuel. Le PDF sépare le projet de la maintenance dans les conditions de paiement.');
  if(provisoires.length)
    notes.unshift('Prix provisoire au catalogue pour '+provisoires.join(' · ')
      +' : à confirmer avant l’envoi, ou à arrêter une fois pour toutes dans Catalogue.');
  var ht=L.reduce(function(a,x){ return a+(x.total||0); },0);
  var tva=20;
  return {lignes:L, ht:Math.round(ht*100)/100, tva:tva,
          ttc:Math.round(ht*(1+tva/100)*100)/100,
          manques:manques, notes:notes,
          complet:manques.length===0,
          offre:offreConseillee(r), utilisateurs:users};
}

/* La réserve écrite au bas de chaque devis. Un seul endroit pour la
   modifier : elle part sur le PDF et s'affiche à l'écran avant
   l'envoi, pour que le commercial sache ce que le client va lire. */
var RESERVE_DEVIS='Prix ferme pour le périmètre décrit ci-dessus. Toute demande hors périmètre '
  +'fait l’objet d’un avenant chiffré avant réalisation, jamais d’une facturation au temps passé. '
  +'Sur un projet sur mesure, le code livré appartient au client, documenté et transmissible.';

/* Le chiffrage propose, le commercial dispose. Chaque ligne se
   decoche, sa quantite et son prix se corrigent. Un moteur qui
   n'accepte pas d'etre contredit finit contourne : le commercial
   refait son devis dans Excel, et on a perdu l'interet.

   Les totaux se recalculent a la frappe, sans redessiner le tableau —
   sinon le curseur saute hors du champ des qu'on tape un chiffre. */
function blocChiffrage(c){
  if(!c.lignes.length)return '';
  /* Ce que le chiffrage n'a pas prévu, le commercial l'ajoute : un
     article du catalogue en un clic, ou une ligne libre pour ce qui
     n'y est pas encore. Un devis qu'on ne peut pas compléter finit
     dans Excel. */
  var cat=CATALOGUE||[];
  var choix=cat.filter(function(a){ return a.actif!==false; })
    .sort(function(a,b){ return String(a.designation).localeCompare(String(b.designation),'fr'); })
    .map(function(a){ return '<option value="'+ech(a.reference||a.role||'')+'">'
      +ech(a.designation)+(Number(a.pv_ht)?' · '+eur(Number(a.pv_ht))+(a.unite==='m'?'/m':''):' · prix à saisir')
      +'</option>'; }).join('');
  return '<div class="panneau" id="dv-bloc" style="margin:0 0 14px">'
    +'<header><h2>Devis proposé</h2><span class="aide">'
    +'décochez ce qui ne sert pas, corrigez ce qui ne va pas</span></header>'
    +'<div class="tbl-scroll"><table><thead><tr><th style="width:34px"></th><th>Poste</th>'
    +'<th class="n" style="width:92px">Qté</th>'
    +'<th class="n" style="width:118px">P.U. HT</th>'
    +'<th class="n" style="width:112px">Total HT</th></tr></thead><tbody>'
    +c.lignes.map(function(x,i){
      return '<tr data-l="'+i+'"'+(x.on===false?' style="opacity:.42"':'')+'>'
        +'<td><input type="checkbox" data-on="'+i+'"'+(x.on===false?'':' checked')+'></td>'
        +'<td>'+ech(x.designation)
          +(x.a_chiffrer?' <span style="color:var(--retard)">— prix à saisir</span>':'')
          +(x.a_confirmer?' <span class="sec">(prix provisoire)</span>':'')+'</td>'
        +'<td class="n"><input class="mini-n" type="number" step="0.5" min="0" data-q="'+i+'" '
          +'value="'+ech(String(x.qte))+'">'+(x.unite==='m'?' m':'')+'</td>'
        +'<td class="n"><input class="mini-n" type="number" step="0.01" min="0" data-p="'+i+'" '
          +'value="'+ech(String(x.pu||0))+'"> €</td>'
        +'<td class="n" data-t="'+i+'">'+eur(x.on===false?0:(x.total||0))+'</td></tr>';
    }).join('')
    +'</tbody></table></div>'
    +'<div style="padding:10px 16px;border-top:1px solid var(--filet);display:flex;gap:8px;'
    +'align-items:center;flex-wrap:wrap">'
    +'<select id="dv-ajout" class="mini-sel" style="max-width:none;flex:1;min-width:220px;'
    +'padding:6px 10px;font-size:12.5px"><option value="">Ajouter un article du catalogue…</option>'
    +choix+'</select>'
    +'<button type="button" class="btn mini" id="dv-libre">Ligne libre</button></div>'
    +'<div style="padding:12px 16px;border-top:1px solid var(--filet);display:flex;'
    +'justify-content:flex-end;gap:26px;font-size:14px">'
    +'<span>Total HT <b class="mono" id="dv-ht">'+eur(c.ht)+'</b></span>'
    +'<span>TTC ('+c.tva+' %) <b class="mono" id="dv-ttc">'+eur(c.ttc)+'</b></span></div>'
    +'<div id="dv-manque">'+blocManques(c)+'</div>'
    +(c.notes.length?'<div class="sec" style="padding:0 16px 14px;font-size:12.5px;line-height:1.7">'
      +c.notes.map(ech).join('<br>')+'</div>':'')
    +'</div>';
}

/* Un prix qui manque avertit, il n'interdit pas. Une ligne « à
   chiffrer » dit au client qu'elle sera arrêtée à la maquette. Bloquer
   l'envoi pousserait le commercial à refaire son devis dans Excel. */
function blocManques(c){
  /* Une option proposée à zéro exemplaire attend une quantité, pas un
     prix : elle n'a rien à faire dans la liste des postes à chiffrer. */
  var m=c.lignes.filter(function(x){
    return x.on!==false && !Number(x.pu) && Number(x.qte)!==0; });
  if(!m.length)return '';
  return '<div class="q-alerte" style="margin:0 16px 14px">'
    +'<b>'+m.length+' poste'+(m.length>1?'s partiront':' partira')+' sans prix,'
    +' avec la mention « à chiffrer » :</b><br>'
    +m.map(function(x){ return ech(x.designation)
      +(x.unite==='m'?' (prix au mètre)':''); }).join('<br>')
    +'<div style="margin-top:8px">Saisissez le prix ici pour ce devis, dans le catalogue '
    +'pour tous les suivants, ou décochez la ligne si le poste ne s’applique pas.</div></div>';
}

/* Recalcule et repeint les seuls nombres qui bougent. */
function majChiffrage(c,f){
  c.lignes.forEach(function(x,i){
    x.total=(x.on===false)?0:Math.round((Number(x.pu)||0)*(Number(x.qte)||0)*100)/100;
    var t=$('[data-t="'+i+'"]',f);
    if(t)t.textContent=eur(x.total);
    var tr=$('[data-l="'+i+'"]',f);
    if(tr)tr.style.opacity=(x.on===false)?'.42':'';
  });
  c.ht=Math.round(c.lignes.reduce(function(a,x){ return a+(x.total||0); },0)*100)/100;
  c.ttc=Math.round(c.ht*(1+c.tva/100)*100)/100;
  c.complet=!c.lignes.some(function(x){ return x.on!==false && !Number(x.pu); });
  var h=$('#dv-ht',f), t2=$('#dv-ttc',f), mq=$('#dv-manque',f);
  if(h)h.textContent=eur(c.ht);
  if(t2)t2.textContent=eur(c.ttc);
  if(mq)mq.innerHTML=blocManques(c);
}

function brancherChiffrage(c,f){
  /* Ajouter une ligne : on redessine le bloc seul, pas la fenêtre,
     pour ne pas perdre ce qui est tapé dans le message au-dessus. */
  function redessiner(){
    var bloc=$('#dv-bloc',f); if(!bloc)return;
    var tmp=document.createElement('div'); tmp.innerHTML=blocChiffrage(c);
    bloc.replaceWith(tmp.firstChild);
    brancherChiffrage(c,f);
  }
  var sel=$('#dv-ajout',f);
  if(sel)sel.onchange=function(){
    var ref=sel.value; if(!ref)return;
    var a=(CATALOGUE||[]).filter(function(x){ return (x.reference||x.role)===ref; })[0];
    if(!a)return;
    var pu=Number(a.pv_ht)||0;
    c.lignes.push({designation:a.designation,reference:a.reference,unite:a.unite,
      qte:1,pu:pu,total:pu,a_chiffrer:!pu,on:true});
    majChiffrage(c,f); redessiner();
  };
  var lib=$('#dv-libre',f);
  if(lib)lib.onclick=function(){
    var d=prompt('Libellé de la ligne (tel qu’il apparaîtra sur le devis) :');
    if(!d||!d.trim())return;
    c.lignes.push({designation:d.trim(),reference:'',unite:'u',qte:1,pu:0,total:0,a_chiffrer:true,on:true});
    majChiffrage(c,f); redessiner();
    var derniers=$$('[data-p]',f); var el=derniers[derniers.length-1]; if(el)el.focus();
  };
  $$('[data-on]',f).forEach(function(b){
    b.onchange=function(){ c.lignes[+b.dataset.on].on=b.checked; majChiffrage(c,f); };
  });
  $$('[data-q]',f).forEach(function(b){
    b.oninput=function(){ c.lignes[+b.dataset.q].qte=Number(b.value)||0; majChiffrage(c,f); };
  });
  $$('[data-p]',f).forEach(function(b){
    b.oninput=function(){
      var l=c.lignes[+b.dataset.p];
      l.pu=Number(b.value)||0;
      if(l.pu)l.a_chiffrer=false;
      majChiffrage(c,f);
    };
  });
}

/* Le mot de la fin. L'ordre compte : on confirme l'adresse d'abord —
   c'est la seule information qu'on ne peut pas retrouver seul —, on
   annonce ce qui arrive ensuite, et on redit le rendez-vous calé. Un
   client qui raccroche sans savoir ce qui va se passer oublie l'appel
   dans l'heure. */
function motDeFin(r,p){
  var mail=p.email
    ? 'Je vous écris à ' + p.email + ' — je vous confirme l’adresse ?'
    : 'Vous me donnez votre adresse e-mail, que je vous écrive ?';
  var rdv=r.creneau?'On se retrouve donc '+r.creneau+'. ':'';
  var fin='Si quelque chose vous semble bizarre en le lisant, vous m’appelez directement '
    +'sur ce numéro, on le reprend ensemble.\n\n'
    +'Je vous remercie du temps que vous m’avez accordé. À très vite.';

  if(veutLogiciel(r))
    return 'Parfait, j’ai ce qu’il me faut. ' + mail + '\n\n'
      + rdv + 'Je vous montrerai le logiciel sur un de vos vrais dossiers : c’est là que vous '
      +'verrez s’il vous fait gagner du temps, et ce qu’il faudrait adapter pour vous.\n\n'
      +'Le logiciel lui-même ne vous coûte rien. Ce qu’on chiffre ensuite, c’est son adaptation '
      +'à votre entreprise et sa maintenance, avec un prix ferme écrit avant de commencer.\n\n' + fin;

  if(r.maquette==='Non'||r.maquette==='Il hésite')
    return 'On fait comme ça. ' + mail + '\n\n'
      +'Je vous envoie un récapitulatif de ce qu’on s’est dit, avec un premier ordre de prix. '
      +'Nos tarifs sont publics, vous pourrez comparer.\n\n'
      +'Et la maquette reste proposée : quinze minutes de votre temps, et vous voyez votre outil '
      +'avant d’avoir payé quoi que ce soit. Le jour où vous voulez, vous me le dites.\n\n' + fin;

  return 'Parfait, j’ai tout ce qu’il me faut pour préparer votre maquette. ' + mail + '\n\n'
    +'Vous recevrez d’abord un récapitulatif de ce qu’on s’est dit. ' + rdv
    +'Quelques jours après l’échange, vous aurez une maquette cliquable de votre outil.\n\n'
    +'Le devis ferme vient ensuite, une fois que vous l’aurez manipulée : prix fixe, périmètre '
    +'écrit, délai annoncé. Rien n’est facturé au temps passé.\n\n' + fin;
}

/* ══ Les documents à joindre ═══════════════════════════════════════
   Plaquette, catalogues, présentations. Ils sont déposés une fois
   dans le stockage Supabase et vivent ensuite dans la bibliothèque :
   les modèles les nomment, la fenêtre d'envoi les propose cochés, le
   commercial en retire ce qu'il veut. */
async function deposerDocument(fichier,apres){
  var nom=fichier.name;
  var chemin=Date.now()+'-'+nom.replace(/[^A-Za-z0-9._-]/g,'_');
  var r=await appelle(URL_BASE+'/storage/v1/object/documents/'+encodeURIComponent(chemin),{
    method:'POST',
    headers:{'apikey':CLE,'Authorization':'Bearer '+(jeton||CLE),
             'Content-Type':fichier.type||'application/octet-stream','x-upsert':'true'},
    body:fichier});
  if(!r.ok)throw new Error(await r.text());
  var url=URL_BASE+'/storage/v1/object/public/documents/'+encodeURIComponent(chemin);
  await ecrire('ls_documents',{nom:nom,fichier:url,taille:fichier.size||0,
    activite:(MAISON==='les_deux'?'les_deux':MAISON)});
  DOCS=null;
  await tracer('document.depose',nom);
  if(apres)apres();
}

function panneauDocuments(docs){
  return '<div class="panneau"><header><h2>Documents joignables</h2>'
    +'<span class="aide">déposés une fois, proposés à chaque envoi</span></header>'
    +'<div class="corps" style="padding-bottom:8px">'
      +'<label class="btn" style="cursor:pointer;display:inline-block">'
      +'Déposer un document<input type="file" id="doc-fichier" hidden '
      +'accept=".pdf,.png,.jpg,.jpeg,.docx,.xlsx"></label>'
      +'<span class="sec" style="margin-left:12px;font-size:12.5px">'
      +'PDF de préférence, et le plus léger possible : au-delà de 4 Mo de pièces jointes, '
      +'beaucoup de messageries refusent le message.</span>'
      +'<div id="doc-etat" style="margin-top:10px"></div>'
    +'</div>'
    +(docs.length?('<div>'+docs.map(function(x){
      return '<div class="tache"><div style="width:0"></div><div>'
        +'<b>'+ech(x.nom)+'</b>'
        +'<div class="meta">'+etat(poids(x.taille),(+x.taille>4*1048576)?'att':'neu')
        +' '+pastilleMaison(x.activite)+'</div></div>'
        +'<div class="cmd"><a class="btn mini" href="'+ech(x.fichier)+'" target="_blank" '
        +'rel="noopener">Voir</a>'
        +'<button class="btn mini" data-docsuppr="'+x.id+'">Retirer</button></div></div>';
    }).join('')+'</div>')
    :vide('Aucun document',
      'Déposez la plaquette et les catalogues : ils seront proposés en pièce jointe à chaque '
      +'e-mail, cochés d’avance selon le modèle choisi.'))
    +'</div>';
}

function brancherDocuments(apres){
  var inp=$('#doc-fichier');
  if(inp)inp.onchange=async function(){
    var fi=inp.files&&inp.files[0]; if(!fi)return;
    var e=$('#doc-etat');
    if(e)e.innerHTML='<div class="sec">Dépôt de '+ech(fi.name)+'…</div>';
    try{ await deposerDocument(fi,apres); }
    catch(err){
      if(e)e.innerHTML='<div class="erreur">Dépôt refusé : '+ech(String(err.message||err).slice(0,200))+'</div>';
    }
  };
  $$('[data-docsuppr]').forEach(function(b){
    b.onclick=async function(){
      if(b.dataset.sur!=='1'){ b.dataset.sur='1'; b.textContent='Confirmer'; return; }
      try{ await supprimer('ls_documents','id=eq.'+b.dataset.docsuppr); DOCS=null; if(apres)apres(); }
      catch(e){}
    };
  });
}

/* ══ L'habillage des mails ═════════════════════════════════════════
   Le commercial écrit du texte ; le client reçoit un mail aux
   couleurs de la maison, signé, avec les coordonnées. Le texte reste
   la matière première — c'est ce qu'on relit pendant un appel — et
   l'habillage se pose autour au moment de l'envoi.

   Construction en tableaux imbriqués, styles en ligne, aucune police
   ni image distante : c'est la seule structure qu'Outlook rende
   correctement. (La règle « uniquement des div » notée le 3 septembre
   valait pour les mails destinés au copier-coller dans un webmail ;
   ici c'est le fournisseur d'envoi qui livre le HTML.) */
var CHARTE={
  bornistes:{nuit:'#08090C',vert:'#2B5FD9',fond:'#f5f6f8',doux:'#F3F4F7',
    gris:'#586274',filet:'#E5E8ED',nom:'ONIQ',
    baseline:'Logiciels et applications sur mesure',
    adresse:'ONIQ Software SAS, Marsanne (26)',
    tel:'06 24 08 19 10',mail:'contact@oniq.online',site:'oniq.online',
    preuves:'Code livré et documenté · Prix ferme · Maquette offerte'},
  tiimizy:{nuit:'#08090C',vert:'#2B5FD9',fond:'#f5f6f8',doux:'#F3F4F7',
    gris:'#586274',filet:'#E5E8ED',nom:'ONIQ',
    baseline:'Logiciels métier pour les PME',
    adresse:'ONIQ Software SAS, Marsanne (26)',
    tel:'06 24 08 19 10',mail:'contact@oniq.online',site:'oniq.online',
    preuves:'BatiManager · OniMetri · OniPilote · OniPromail · OniBoost'}
};
function charteDe(a){ return CHARTE[a]||CHARTE.bornistes; }

/* Le texte brut devient des paragraphes. Une ligne isolée qui se
   termine sans ponctuation forte reste une ligne : c'est ce qui
   permet aux listes écrites à la main de ne pas être recollées. */
/* Les paragraphes du message. Un bloc qui commence par « > » devient
   un encadré à filet vert : c'est ainsi qu'on met en avant ce que le
   client doit retenir — les pièces jointes, une échéance, un montant —
   sans casser l'écriture au fil de l'eau du commercial. */
/* Les paragraphes du message, et deux encadrés repris du modèle de
   référence : « > » pour un rappel neutre (filet bleu nuit, fond gris
   bleuté), « >> » pour ce qui doit sauter aux yeux — un geste
   commercial, une échéance — en vert, avec sa première ligne en
   étiquette majuscule.

   Ce qui précède les deux points passe en gras et la suite en gris :
   « Ce qui change : deux poses au lieu d'une » se met en forme seul. */
function paragraphes(txt,c){
  return String(txt||'').split(/\n\s*\n/).map(function(bloc){
    var brut=bloc.trim(), type='';
    if(/^>>\s?/.test(brut)){ type='vert'; brut=brut.replace(/^>>\s?/gm,''); }
    else if(/^>\s?/.test(brut)){ type='gris'; brut=brut.replace(/^>\s?/gm,''); }

    var lignes=brut.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
    if(!lignes.length)return '';

    function orne(t){
      var m=t.match(/^([^:<]{2,44}) : ([\s\S]+)$/);
      if(m)return '<span style="font-weight:600;color:'+c.nuit+'">'+ech(m[1])+' :</span>'
        +'<span style="color:'+c.gris+'"> '+ech(m[2])+'</span>';
      return ech(t);
    }

    if(type==='vert'){
      var etiq=lignes.length>1?lignes.shift():'';
      return '<div style="margin:0 0 20px;border:1px solid #C9D6F5;border-left:3px solid '
        +c.vert+';border-radius:10px;background-color:#F3F6FD;padding:16px 18px;'
        +'font-size:15px;line-height:1.6;color:#0B0E13">'
        +(etiq?'<div style="font-size:11px;font-weight:700;letter-spacing:1.5px;'
          +'text-transform:uppercase;color:#2B5FD9;margin-bottom:6px">'+ech(etiq)+'</div>':'')
        +lignes.map(ech).join('<br>')+'</div>';
    }
    if(type==='gris')
      return '<div style="margin:2px 0 20px;border:1px solid '+c.filet+';'
        +'border-left:3px solid '+c.nuit+';border-radius:10px;background-color:'+c.doux+';'
        +'padding:14px 18px;font-size:14px;line-height:1.9;color:#0B0E13">'
        +lignes.map(function(l){ return '<div>'+orne(l)+'</div>'; }).join('')+'</div>';

    return '<p style="margin:0 0 16px;font-size:15px;line-height:1.65;color:#0B0E13">'
      +lignes.map(ech).join('<br>')+'</p>';
  }).join('');
}


/* Le tableau du devis, en HTML d'e-mail : des tableaux imbriques et
   des styles en ligne, parce que la moitie des messageries jettent le
   CSS. Un client qui doit ouvrir une piece jointe pour connaitre son
   prix repousse la lecture, et un devis repousse est un devis perdu. */
/* Le devis, dans le corps du message.

   Repris sur le PDF Henrri que le client reçoit déjà : mêmes colonnes,
   même ordre, même bloc de totaux gris en bas à droite, mêmes
   conditions de paiement. Un client qui a vu l'un reconnaît l'autre —
   et quand le devis définitif arrivera d'Henrri, il n'aura pas
   l'impression de découvrir un autre chiffrage.

   Tableaux imbriqués et styles en ligne : la moitié des messageries
   jettent le CSS, aucune ne jette un attribut style. */

/* L'habillage d'un message écrit à une personne.

   Il a d'abord été dessiné comme une newsletter : bandeau sombre,
   logo, baseline, filet de couleur, carte arrondie. C'était joli et
   c'était une faute. Gmail classe ça en Promotions — l'onglet que
   personne n'ouvre — parce qu'aucun humain n'envoie un bandeau de
   marque à quelqu'un qu'il vient d'avoir au téléphone.

   Donc : fond blanc, texte noir, une seule police, aucune image, un
   filet gris avant la signature. Ce que produirait un commercial qui
   écrit depuis Outlook. La marque tient dans le nom de l'expéditeur
   et dans ce qui est écrit, pas dans un cartouche. */
/* L'habillage d'un message écrit à une personne.

   L'arbitrage, en une phrase : le décor de newsletter — bandeau de
   couleur pleine largeur, bloc logo en tête, cartouche arrondi — fait
   classer le message en Promotions. Une signature soignée, non : tous
   les commerciaux du monde en ont une, et elle se lit en bas, pas en
   haut. Le logo est donc dans la signature, en 34 pixels, pas en
   bannière. Même charte, place différente.

   Aucune image distante : le nom suffit, écrit en capitales. Gmail bloque les images des expéditeurs inconnus, et
   un logo cassé fait plus de mal que pas de logo du tout. */
function mailHabille(corps,p,sig,activite,pied){
  var c=charteDe(activite);
  /* Segoe UI d'abord : c'est la police du modèle de référence, celle
     de Windows, et elle ne se télécharge pas — donc elle s'affiche
     partout, Gmail compris. Sur Mac et iPhone, où elle n'existe pas,
     la pile descend sur San Francisco. Aucune police web : les
     messageries les suppriment, et un e-mail ne doit jamais dépendre
     d'un fichier que le lecteur refusera de charger. */
  var pol="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif";
  var tel=sig&&sig.tel?String(sig.tel).replace(/[^0-9+]/g,'').replace(/^0/,'+33'):'';

  return '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">'
    +'<meta name="viewport" content="width=device-width,initial-scale=1"></head>'
    +'<body style="margin:0;padding:0;background:'+c.fond+'">'
    +'<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" '
      +'style="background:'+c.fond+';padding:28px 16px"><tr><td align="center">'

    +'<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" '
      +'style="width:600px;max-width:100%;background-color:#ffffff;border:1px solid '
      +c.filet+';border-radius:14px;overflow:hidden;font-family:'+pol+';color:'+c.nuit+'">'

    /* Le bandeau : le nom en capitales largement espacées. Pas
       d'image — le texte suffit et ne casse pas. */
    +'<tr><td style="background-color:'+c.nuit+';padding:24px 32px 20px">'
      +'<div style="font-size:13px;font-weight:700;letter-spacing:3.5px;color:#f3faff;'
        +'text-transform:uppercase;line-height:1.3">'
        +ech(c.nom).toUpperCase().replace(/ /g,'&nbsp;')+'</div>'
      +(c.baseline?'<div style="font-size:10px;font-weight:600;letter-spacing:2px;color:'
        +c.vert+';text-transform:uppercase;margin-top:6px">'+ech(c.baseline)+'</div>':'')
    +'</td></tr>'
    +'<tr><td style="height:3px;background-color:'+c.vert+';font-size:0;line-height:0">'
      +'&nbsp;</td></tr>'

    +'<tr><td style="padding:30px 32px 4px">'+paragraphes(corps,c)+'</td></tr>'


    /* La signature, en paragraphes simples comme dans le modèle : le
       nom en gras, la fonction et le téléphone en dessous. Le numéro
       est cliquable — sur un téléphone, c'est un appel à un doigt. */
    +'<tr><td style="padding:6px 32px 0;font-size:15px;line-height:1.65;color:#0B0E13">'
      +(sig&&sig.nom?'<p style="margin:0 0 3px;font-weight:600;color:'+c.nuit+'">'
        +ech(sig.nom)+'</p>':'')
      +(sig&&sig.fonction?'<p style="margin:0 0 2px;font-size:12px;color:'+c.gris+'">'
        +ech(sig.fonction)+', '+ech(c.nom)+'</p>':'')
      +(tel?'<p style="margin:0 0 24px;font-size:12px"><a href="tel:'+ech(tel)
        +'" style="color:'+c.vert+';font-weight:600;text-decoration:none">'
        +ech(sig.tel)+'</a></p>':'<div style="height:22px"></div>')
    +'</td></tr>'

    +'<tr><td style="padding:0 32px 26px">'
      +'<div style="height:1px;background-color:'+c.filet+';font-size:0;line-height:0">'
        +'&nbsp;</div>'
      +'<div style="margin-top:14px;font-size:11px;line-height:1.75;color:'+c.gris+'">'
        +(c.adresse?ech(c.adresse)+'<br>':'')
        +(c.preuves?ech(c.preuves)+'&nbsp;&nbsp;·&nbsp;&nbsp;':'')
        +[c.tel,c.site].filter(Boolean).map(ech).join('&nbsp;&nbsp;·&nbsp;&nbsp;')
        /* Le pied d'opposition n'existe que sur les campagnes : un
           devis attendu n'a pas à porter une ligne de désabonnement. */
        +(pied?'<br>'+ech(pied):'')
      +'</div>'
    +'</td></tr>'

    +'</table></td></tr></table></body></html>';
}

/* ══ Les pièces jointes ════════════════════════════════════════════
   La plaquette part avec une présentation, les catalogues avec un
   devis. Le modèle propose, le commercial dispose : chaque pièce a
   sa case, décochable avant l'envoi. */
var DOCS=null;
async function documents(activite){
  if(DOCS)return DOCS;
  try{
    DOCS=await lire('ls_documents','select=*&order=ordre.asc,nom.asc&limit=100');
  }catch(e){ DOCS=[]; }
  return DOCS;
}
function poids(o){
  if(!o)return '';
  return o>=1048576 ? (o/1048576).toFixed(1).replace('.',',')+' Mo'
       : Math.round(o/1024)+' Ko';
}

/* ══ Écrire à un partenaire ════════════════════════════════════════
   Le cas le plus fréquent : on n'a pas eu la bonne personne, ou elle
   n'a pas le temps, et on veut lui laisser une trace qui donne envie
   de rappeler. Deux lignes sur ce qu'on propose, une sur ce qu'elle y
   gagne, et un numéro à composer. Rien d'autre : un partenaire qu'on
   n'a pas encore convaincu ne lit pas un long mail. */
function texteMailPartenaire(p,sig){
  var c=(p.contact&&String(p.contact).trim())?String(p.contact).trim().split(' ')[0]:'';
  var commission=(p.commission_taux&&p.commission_type)
    ? (p.commission_type==='pourcentage'
        ? p.commission_taux+' % du montant hors taxes de chaque affaire signée grâce à vous'
        : p.commission_type==='fixe_lead'

          : euro(p.commission_taux)+' par affaire signée grâce à vous')
    : 'une commission sur chaque affaire signée grâce à vous';
  var tel=sig.tel?' au '+sig.tel:'';
  if(p.activite==='tiimizy') return {
    objet:'Partenariat ONIQ Logiciels · '+(p.nom||''),
    corps:'Bonjour'+(c?' '+c:'')+',\n\n'
      +'Suite à mon appel, voici en deux lignes ce que je vous proposais.\n\n'
      +'ONIQ édite des logiciels pour les entreprises du bâtiment : BatiManager pour suivre '
      +'chaque chantier et sa marge, OniMetri pour faire le métré depuis les plans. Vos '
      +'clients vous parlent de ces sujets toute l’année, et ce n’est pas votre métier de '
      +'leur trouver un outil.\n\n'

      +'on fait la démonstration et la mise en place, et vous touchez '+commission+'. '
      +'Vous n’avez rien à installer ni à gérer.\n\n'
      +'Le plus simple est qu’on en parle cinq minutes : répondez à ce message ou '
      +'appelez-moi directement'+tel+', je vous rappelle dans la journée.\n\n'
      +'À bientôt,'
  };
  return {
    objet:'Partenariat ONIQ · '+(p.nom||''),
    corps:'Bonjour'+(c?' '+c:'')+',\n\n'
      +'Suite à mon appel, voici en deux lignes ce que je vous proposais.\n\n'
      +'ONIQ construit des logiciels sur mesure pour les PME : devis, suivi de dossiers, '
      +'plannings, facturation. Une maquette cliquable offerte d’abord, un prix ferme ensuite, '
      +'et un outil en service en quelques semaines, pour environ le quart du prix d’une agence.\n\n'
      +'Le partenariat est simple : quand un client vous parle de sa gestion ou d’un outil qui '
      +'lui manque, vous nous passez le contact, on fait la maquette, le devis et la livraison, '
      +'et vous touchez '+commission+'. Vous n’avez rien d’autre à faire.\n\n'
      +'Le plus simple est qu’on en parle cinq minutes : répondez à ce message ou '
      +'appelez-moi directement'+tel+', je vous rappelle dans la journée.\n\n'
      +'À bientôt,'
  };
}

        +'<div style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap">'
        +'<label for="mp-dest" class="sec" style="font-size:12px">À</label>'

      +'<div class="corps">'
      +(mods.length
        ?'<div class="champ large" style="margin-bottom:14px"><label for="mp-mod">Modèle</label>'
         +'<select id="mp-mod"><option value="">Le message de recontact</option>'
         +mods.map(function(m){ return '<option value="'+m.id+'"'

         +'<div class="champ large"><label for="mp-corps">Message</label>'
         +'<textarea id="mp-corps" style="min-height:250px">'+ech(CORPS)+'</textarea>'
         +'<div class="aide">votre signature, l’habillage et le pied d’opposition sont ajoutés '

        :'<div class="champ large" style="margin-bottom:6px"><label>Objet</label>'
         +'<div style="font-weight:600;font-size:15px;padding:4px 0">'+ech(OBJ||'(sans objet)')+'</div></div>'

      +'</div>'

    $$('[data-vue]',f).forEach(function(b){ b.onclick=function(){ memoriser(); vue=b.dataset.vue; peindre(); }; });

      else { OBJ=defaut.objet; CORPS=defaut.corps; }
      peindre();

    var dst=$('#mp-dest',f);
    if(dst)dst.oninput=function(){

        partenaire_id:p.id,societe:p.nom,activite:p.activite},ferme);
      await tracer('partenaire.mail',p.nom,p.id);
    };
  }
  peindre();
  var d0=$('#mp-dest',f); if(d0&&!DEST)d0.focus();
}

/* ══ Envoyer un mail pendant l'appel ═══════════════════════════════
   Le commercial a la personne au téléphone : c'est la seule seconde
   où l'adresse se vérifie et où le message a une chance d'être
   attendu. On choisit un modèle, on relit, on envoie. Ça part par la
   même file que tout le reste, donc sous cinq minutes. */
async function mailRapide(p,avecDevis,etat){
  var mods=[], docs=[];
  var DEVIS=null;
  try{
    mods=await lire('ls_modeles','select=*&canal=eq.email&activite=in.('
      +(p.activite||'bornistes')+',les_deux)&order=nom.asc&limit=60');
  }catch(e){}
  try{ docs=await documents(p.activite); }catch(e){}
  await monNom();
  var mf={}; try{ mf=await maFiche(); }catch(e){}
  var sig={nom:(mf.nom||MON_NOM||''),fonction:mf.fonction||'',
           tel:mf.tel||'',mail:mf.repondre_a||moi||''};

  function parNom(n){ return mods.filter(function(m){ return m.nom===n; })[0]; }
  var choix=(avecDevis?parNom('Le devis, expliqué'):null)
    || (p.appel_resultat==='absent'?parNom('Je vous ai appelé'):null)
    || mods.filter(function(m){ return m.contexte==='lead'; })[0]
    || (mods.length?mods[0]:null);
  var vue='texte';
  var jointes={};
  function poserPieces(){
    jointes={};
    var d=(choix&&choix.pieces)||[];
    (Array.isArray(d)?d:[]).forEach(function(nom){ jointes[String(nom)]=true; });
  }
  poserPieces();

  var f=document.createElement('div');
  f.className='fond-modale';
  document.body.appendChild(f);
  var ferme=function(){ f.remove(); };

  async function chargerDevis(){
    var r={};
    try{
      var dq=await lire('ls_qualif','select=reponses&prospect_id=eq.'+p.id+'&limit=1');
      if(dq.length)r=dq[0].reponses||{};
    }catch(e){}
    if(!Object.keys(r).length)return null;
    var cat=[]; try{ cat=await catalogue(); }catch(e){}
    var c=chiffrer(r,cat);
    c.lignes.forEach(function(x){ x.on=true; });
    return c;
  }

  var OBJ=(etat&&etat.obj!=null)?etat.obj:null, CORPS=(etat&&etat.corps!=null)?etat.corps:null,
      DEST=(etat&&etat.dest!=null)?etat.dest:(p.email||'');
  function memoriser(){
    var a=$('#m-obj',f), b=$('#m-corps',f), d=$('#m-dest',f);
    if(a)OBJ=a.value;
    if(b)CORPS=b.value;
    if(d)DEST=d.value.trim();
  }
  function duModele(quoi){ return choix?remplir(choix[quoi]||'',p):''; }
  function objetActuel(){ return OBJ!==null?OBJ:duModele('objet'); }
  function corpsActuel(){ return CORPS!==null?CORPS:duModele('corps'); }
  function retenues(){ return docs.filter(function(x){ return jointes[x.nom]; }); }
  function poidsTotal(){ return retenues().reduce(function(a,x){ return a+(+x.taille||0); },0); }

  function blocPoids(tot){
    if(tot>4*1048576)
      return '<div class="q-alerte" style="margin-top:11px">'+ech(poids(tot))
        +' de pièces jointes : au-delà de 4 Mo, beaucoup de messageries refusent ou '
        +'classent en indésirable. Retirez-en une.</div>';
    return tot?'<div class="sec" style="margin-top:9px;font-size:12px">'
      +ech(poids(tot))+' au total</div>':'';
  }
  function majPoids(){
    var z=$('#m-poids',f);
    if(z)z.innerHTML=blocPoids(poidsTotal());
  }

  function peindre(){
    var o=objetActuel(), c=corpsActuel(), tot=poidsTotal();
    f.innerHTML='<div class="modale" style="width:min(760px,100%)">'
      +'<header><div style="flex:1"><h3>Écrire à '+ech(p.societe||'')+'</h3>'
        +'<div style="margin-top:5px;display:flex;gap:7px;align-items:center">'
        +'<input id="m-dest" type="email" value="'+ech(DEST)+'" '
          +'placeholder="son adresse e-mail" '
          +'style="flex:1;max-width:340px;padding:5px 9px;border:1px solid var(--filet);'
          +'border-radius:7px;background:var(--fond);color:var(--texte);font-size:13px">'
        +'<span class="sec" id="m-dest-etat" style="font-size:11.5px"></span>'
        +'</div></div>'
        +'<button class="fermer" data-x>&times;</button></header>'
      +'<div class="corps">'
        +(mods.length
          ?'<div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:16px">'
           +'<div class="champ large" style="flex:1;margin:0"><label for="m-mod">Modèle</label>'
           +'<select id="m-mod">'+mods.map(function(m){
               return '<option value="'+m.id+'"'+(choix&&m.id===choix.id?' selected':'')+'>'
                 +ech(m.nom)+'</option>'; }).join('')+'</select></div>'
           +'<button class="btn" data-neuf>Nouveau modèle</button></div>'
          :'<div class="q-alerte" style="margin-top:0">Aucun modèle d’e-mail pour cette activité.'
           +'<div style="margin-top:10px"><button class="btn mini" data-neuf>Créer un modèle</button></div></div>')

        +'<div class="maisons" style="display:inline-flex;margin-bottom:14px">'
        +'<button data-vue="texte" aria-pressed="'+(vue==='texte')+'">Écrire</button>'
        +'<button data-vue="apercu" aria-pressed="'+(vue==='apercu')+'">Aperçu</button>'
        +'</div>'

        +(vue==='texte'
          ?'<div class="champ large"><label for="m-obj">Objet</label>'
           +'<input id="m-obj" value="'+ech(o)+'"></div>'
           +'<div class="champ large"><label for="m-corps">Message</label>'
           +'<textarea id="m-corps" style="min-height:230px">'+ech(c)+'</textarea>'
           +'<div class="aide">écrivez au fil de l’eau : l’habillage, la signature et le pied '
           +'d’opposition sont ajoutés à l’envoi</div></div>'
          :'<div class="champ large" style="margin-bottom:6px"><label>Objet</label>'
           +'<div style="font-weight:600;font-size:15px;padding:4px 0">'+ech(o||'(sans objet)')+'</div></div>'
           +'<iframe id="m-vue" title="Aperçu du message" style="width:100%;height:420px;border:'
           +'1px solid var(--filet);border-radius:10px;background:#fff" '
           +'srcdoc="'+ech(mailHabille(c,p,sig,p.activite))+'"></iframe>')

        +(DEVIS?'<div style="margin-top:18px">'+blocChiffrage(DEVIS)
           +'<div class="sec" style="margin:-6px 0 0;font-size:12.5px">'
           +'Ce chiffrage part en pièce jointe, sous forme de devis PDF. '
           +'Le message, lui, reste un message.</div>'
           +'<div class="sec" style="margin-top:8px;font-size:12px;line-height:1.55;'
           +'border-left:2px solid var(--filet);padding-left:10px">'
           +ech(RESERVE_DEVIS)+'<br><span style="opacity:.7">écrit au bas du devis, sur tous les devis</span></div></div>'
          :'<div style="margin-top:18px"><button class="btn" data-devis>Joindre le chiffrage</button>'
           +'<span class="aide" style="margin-left:9px">le devis calculé depuis la qualification, '
           +'dans le corps du message</span></div>')

        +(docs.length
          ?'<div style="margin-top:18px"><div class="titre-apercu">Pièces jointes</div>'
           +'<div style="display:flex;flex-direction:column;gap:7px">'
           +docs.map(function(x){
             return '<label style="display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer">'
               +'<input type="checkbox" data-doc="'+ech(x.nom)+'"'+(jointes[x.nom]?' checked':'')+'>'
               +'<span style="flex:1">'+ech(x.nom)+'</span>'
               +'<span class="sec mono" style="font-size:11px">'+ech(poids(x.taille))+'</span></label>';
           }).join('')+'</div>'
           +'<div id="m-poids">'+blocPoids(tot)+'</div></div>'
          :'')

        +(DEST?'':'<div class="q-alerte">Pas encore d’adresse : demandez-la maintenant, '
          +'faites-la répéter lettre par lettre, et tapez-la en haut de cette fenêtre. '
          +'Elle sera gardée sur la fiche.</div>')
      +'</div>'
      +'<footer><span style="display:flex;gap:7px">'
      +'<button class="btn" data-x>Fermer</button>'
      +'<button class="btn" data-vue="'+(vue==='texte'?'apercu':'texte')+'">'
        +(vue==='texte'?'Voir l’aperçu':'Revenir au texte')+'</button></span>'
      +'<span style="display:flex;gap:7px">'
      +'<button class="btn" data-copier>Copier le texte</button>'
      +'<button class="btn fort" data-env data-lib="Envoyer"'+(DEST?'':' disabled')+'>Envoyer</button>'
      +'</span></footer></div>';
    brancher();
  }

  function brancher(){
    $$('[data-x]',f).forEach(function(b){ b.onclick=ferme; });
    var sel=$('#m-mod',f);
    if(sel)sel.onchange=function(){
      choix=mods.filter(function(m){ return m.id===sel.value; })[0]||null;
      /* Changer de modèle remplace le texte : c'est le but. */
      OBJ=null; CORPS=null; poserPieces(); peindre();
    };
    $$('[data-vue]',f).forEach(function(b){
      b.onclick=function(){ memoriser(); vue=b.dataset.vue; peindre(); };
    });
    if(DEVIS)brancherChiffrage(DEVIS,f);
    var bd=$('[data-devis]',f);
    if(bd)bd.onclick=async function(){
      var b=this; b.disabled=true; b.textContent='Chiffrage…';
      DEVIS=await chargerDevis();
      if(!DEVIS){
        b.disabled=false; b.textContent='Joindre le chiffrage';
        /* Plutôt que d'expliquer où aller, on y va. */
        memoriser(); ferme();
        qualifier(p,function(){ mailRapide(p,true); });
        return;
      }
      memoriser(); peindre();
    };
    $$('[data-doc]',f).forEach(function(cb){
      cb.onchange=function(){
        if(cb.checked)jointes[cb.dataset.doc]=true; else delete jointes[cb.dataset.doc];
        majPoids();
      };
    });
    var neuf=$('[data-neuf]',f);
    if(neuf)neuf.onclick=function(){
      ferme();
      memoriser();
      var garde={obj:OBJ,corps:CORPS,dest:DEST};
      ficheModele({canal:'email',activite:p.activite,contexte:'tous'},
        function(){ mailRapide(p,avecDevis,garde); });
    };
    var dst=$('#m-dest',f);
    if(dst)dst.oninput=function(){
      DEST=dst.value.trim();
      var e=$('#m-dest-etat',f);
      if(e)e.textContent=(DEST&&DEST!==(p.email||''))?'sera enregistrée sur la fiche':'';
      var b=$('[data-env]',f); if(b)b.disabled=!DEST;
    };
    var cp=$('[data-copier]',f);
    if(cp)cp.onclick=function(){ memoriser(); copier(corpsActuel(),this); };
    var en=$('[data-env]',f);
    if(en)en.onclick=async function(){
      memoriser();
      var o=objetActuel(), c=corpsActuel(), b=this;
      /* Le devis part avec le message : on l'enregistre d'abord, pour
         qu'il existe dans le suivi même si l'envoi échoue ensuite. */
      var pieces=retenues().map(function(x){ return {nom:x.nom,url:x.fichier}; });
      if(DEVIS){
        try{
          var gardees=DEVIS.lignes.filter(function(x){ return x.on!==false; });
          /* Le PDF d'abord : s'il ne se fabrique pas, autant le savoir
             avant d'avoir enregistré un devis que le client ne recevra
             jamais. */
          b.disabled=true; b.textContent='Devis en cours…';
          var pdf=devisPdf(p,DEVIS,sig,p.activite);
          var url=await deposerDevisPdf(pdf.blob,pdf.nom);
          pieces.unshift({nom:pdf.nom,url:url});
          await ecrire('ls_devis',{
            prospect_id:p.id, societe:p.societe, activite:p.activite||'bornistes',
            objet:(DEVIS.offre||'Proposition ONIQ').split(' — ')[0]
              +' — '+DEVIS.utilisateurs+' utilisateur'+(DEVIS.utilisateurs>1?'s':''),
            montant_ht:DEVIS.ht, statut:'envoye',
            envoye_le:new Date().toISOString().slice(0,10),
            /* Le devis part : les pièces ont donc été réunies, sinon on
               n'aurait rien pu chiffrer. Le suivi part d'un état vrai. */
            elements_demandes_le:new Date().toISOString().slice(0,10),
            elements_recus_le:new Date().toISOString().slice(0,10),
            pdf_url:url,
            lignes:gardees,
            chiffrage:{notes:DEVIS.notes,offre:DEVIS.offre,utilisateurs:DEVIS.utilisateurs},
            note:DEVIS.notes.join(' · '), owner_email:moi||''});
          await tracer('devis.chiffre',p.societe+' · '+eur(DEVIS.ht),p.id);
        }catch(e){
          b.disabled=false; b.textContent=libelleInitial(b);
          alerteCopiable('Devis impossible à joindre',
            'Le message n’a pas été envoyé : le devis n’a pas pu être produit ou déposé. '
            +String(e.message||e).slice(0,250));
          return;
        }
      }
      /* L'adresse obtenue au téléphone vaut pour tous les messages
         suivants : on la garde sur la fiche sans le demander. */
      if(DEST&&DEST!==(p.email||'')){
        p.email=DEST;
        modifier('ls_prospects','id=eq.'+p.id,{email:DEST}).catch(function(){});
      }
      faireEnvoi(b,{dest:DEST,objet:o,corps:c,
        html:mailHabille(c,p,sig,p.activite),
        pieces:pieces,
        prospect_id:p.id,societe:p.societe,activite:p.activite},ferme);
    };
  }

  /* « Envoyer le devis » doit ouvrir une fenêtre où le devis est déjà
     là. Avant, il fallait encore cliquer « Joindre le chiffrage », et
     beaucoup envoyaient le mail sans rien dedans. */
  if(avecDevis){
    f.innerHTML='<div class="modale"><div class="corps"><p class="sec">Chiffrage en cours…</p></div></div>';
    try{ DEVIS=await chargerDevis(); }catch(e){ DEVIS=null; }
    if(!DEVIS){
      ferme();
      /* Pas de qualification, donc rien à chiffrer : on l'ouvre au lieu
         de renvoyer le commercial la chercher ailleurs. */
      alerteCopiable('Rien à chiffrer pour l’instant',
        'Le devis se calcule à partir de la qualification, et cette fiche n’en a pas encore. '
        +'Elle s’ouvre maintenant : remplissez-la, le devis suivra.');
      setTimeout(function(){ qualifier(p,function(){ mailRapide(p,true); }); },250);
      return;
    }
  }
  peindre();
}

/* ══ L'invitation d'un partenaire ══════════════════════════════════
   Un partenaire ne se crée pas un compte tout seul : on l'invite. Le
   lien porte un jeton tiré au hasard qui ne donne accès qu'à sa fiche
   à lui. Il reste ouvert tant que le partenaire n'a pas créé son
   compte, et meurt à cet instant précis : la sécurité tient au jeton,
   pas à une date d'expiration qui ne protégeait rien et n'obligeait
   qu'à rappeler son commercial. Tant qu'il n'a pas signé, il ne
   voit rien d'autre que le contrat. */
function jetonNeuf(){
  var a=new Uint8Array(24);
  (window.crypto||window.msCrypto).getRandomValues(a);
  return [].map.call(a,function(x){ return ('0'+x.toString(16)).slice(-2); }).join('');
}
function lienInvitation(j){
  return location.origin+location.pathname+'#bienvenue='+j;
}
function texteRemuneration(p){
  return p.commission_type==='pourcentage'
    ? p.commission_taux+' % du montant hors taxes de chaque affaire signée grâce à vous'
    : p.commission_type==='fixe_lead'
      ? euro(p.commission_taux)+' par contact qualifié transmis et accepté'
      : euro(p.commission_taux)+' par affaire signée grâce à vous';
}

async function inviterPartenaire(p,apres){
  if(!p.email){
    formulaire('Son adresse e-mail',[
      {id:'email',nom:'E-mail du partenaire',type:'email',requis:true,large:true,valeur:'',
       aide:'c’est là que part l’invitation — faites-la répéter lettre par lettre'}
    ],async function(v){
      await modifier('ls_prescripteurs','id=eq.'+p.id,{email:v.email});
      inviterPartenaire(Object.assign({},p,{email:v.email}),apres);
    });
    return;
  }
  /* Attention : fabriquer un jeton neuf à chaque ouverture de cette
     fenêtre tuait le lien déjà parti par mail. Le commercial rouvrait
     la fiche pour vérifier, et le partenaire lisait « lien expiré ».
     On réutilise donc le jeton en cours tant qu'il est valable ; on
     n'en fabrique un nouveau que s'il n'y en a pas, ou s'il est
     périmé, ou si on le demande explicitement. */
  var j=null;
  try{
    var act=await lire('ls_prescripteurs',
      'select=invite_jeton,invite_expire&id=eq.'+p.id);
    var a=act&&act[0];
    /* Le jeton vaut tant qu'aucun compte n'a été créé — pas trente
       jours, pas un clic. C'est le rattachement du compte qui le tue,
       et rien d'autre. */
    if(a&&a.invite_jeton&&String(a.invite_jeton).length>=20) j=a.invite_jeton;
  }catch(e){}
  if(!j){
    j=jetonNeuf();
    try{
      await modifier('ls_prescripteurs','id=eq.'+p.id,{
        invite_jeton:j, invite_le:new Date().toISOString(), invite_expire:null});
    }catch(e){ alerteCopiable('Invitation impossible',String(e.message||e).slice(0,300)); return; }
  }
  var lien=lienInvitation(j);
  var maisonNom=LAB[p.activite]||'ONIQ';
  var objet='Votre espace partenaire : '+maisonNom;
  var corps='Bonjour '+(p.contact||'')+',\n\n'
    +'Comme convenu, voici votre accès à l’espace partenaire.\n\n'
    +'En quelques minutes, vous y créez votre mot de passe, vous signez le contrat '
    +'d’apport d’affaires, et vous installez l’application sur votre téléphone.\n\n'
    +'Ensuite, vous suivez en direct chaque contact que vous nous transmettez et chaque '
    +'commission qui vous revient — sans avoir à nous appeler pour savoir où ça en est.\n\n'
    +'Votre rémunération convenue : '+texteRemuneration(p)+'.\n\n'
    +'Votre lien personnel :\n'+lien+'\n\n'
    +'À très vite,\n'+(MON_NOM||'')+'\n'+maisonNom;

  var f=document.createElement('div');
  f.className='fond-modale';
  f.innerHTML='<div class="modale" style="width:min(680px,100%)">'
    +'<header><div><h3>Inviter '+ech(p.nom)+'</h3>'
      +'<div class="sec" style="margin-top:2px">'+ech(p.email)+'</div></div>'
      +'<button class="fermer" data-x>&times;</button></header>'
    +'<div class="corps">'
      +'<div class="rangee" style="padding-top:0"><div style="width:100%">'
        +'<b>Son lien personnel</b>'
        +'<p class="sec" style="margin:5px 0 9px">Valable tant qu’il n’a pas créé son '
        +'compte : il peut le rouvrir autant de fois qu’il veut, depuis n’importe quel '
        +'appareil. Il ne donne accès qu’à sa fiche.</p>'
        +'<div style="display:flex;gap:8px;align-items:center">'
        +'<input readonly id="inv-lien" value="'+ech(lien)+'" style="flex:1;font-family:'
        +'\'JetBrains Mono\',monospace;font-size:11.5px">'
        +'<button class="btn mini" data-cl>Copier</button></div></div></div>'
      +'<div class="rangee"><div style="width:100%"><b>Le message à lui envoyer</b>'
        +'<textarea id="inv-corps" style="margin-top:9px;min-height:230px;width:100%;'
        +'background:var(--surface-2);border:1px solid var(--filet);border-radius:8px;'
        +'padding:11px;font-size:13.5px;line-height:1.6">'+ech(corps)+'</textarea></div></div>'
    +'</div>'
    +'<footer><button class="btn" data-x>Fermer</button>'
    +'<span style="display:flex;gap:7px">'
    +'<button class="btn" data-nv>Nouveau lien</button>'
    +'<button class="btn" data-cm>Copier</button>'
    +'<button class="btn" data-ml>Ma messagerie</button>'
    +'<button class="btn fort" data-env data-lib="Envoyer l’invitation">Envoyer l’invitation</button>'
    +'</span></footer></div>';
  document.body.appendChild(f);
  var ferme=function(){ f.remove(); if(apres)apres(); };
  $$('[data-x]',f).forEach(function(b){ b.onclick=ferme; });
  $('[data-cl]',f).onclick=function(){ copier(lien,this); };
  $('[data-nv]',f).onclick=async function(){
    if(!confirm('Fabriquer un nouveau lien ? L’ancien, s’il est déjà parti par mail, '
      +'cessera aussitôt de fonctionner.')) return;
    var nj=jetonNeuf();
    try{
      await modifier('ls_prescripteurs','id=eq.'+p.id,{
        invite_jeton:nj, invite_le:new Date().toISOString(), invite_expire:null});
    }catch(e){ alerteCopiable('Impossible',String(e.message||e).slice(0,300)); return; }
    f.remove(); inviterPartenaire(p,apres);
  };
  $('[data-cm]',f).onclick=function(){ copier($('#inv-corps',f).value,this); };
  $('[data-ml]',f).onclick=function(){
    location.href='mailto:'+encodeURIComponent(p.email)
      +'?subject='+encodeURIComponent(objet)
      +'&body='+encodeURIComponent($('#inv-corps',f).value);
  };
  $('[data-env]',f).onclick=function(){
    /* La trace part à l'envoi, pas à l'ouverture de la fenêtre : on
       journalisait des invitations jamais parties. */
    tracer('partenaire.invite',p.nom,p.id);
    faireEnvoi(this,{dest:p.email,objet:objet,corps:$('#inv-corps',f).value,
      partenaire_id:p.id,societe:p.nom,activite:p.activite},ferme);
  };
}

/* ══ Ce que voit le partenaire invité ══════════════════════════════
   Quatre écrans, dans cet ordre, sans possibilité d'en sauter un :
   son mot de passe, le contrat, l'application, son tableau de bord.
   Le contrat avant l'accès, parce qu'un espace ouvert à quelqu'un qui
   n'a rien signé n'a pas de valeur — ni pour lui, ni pour vous. */
/* Un appel anonyme qui échoue ne doit pas ressembler à un appel qui
   réussit et ne rend rien. Les deux se soldaient par « lien expiré »,
   et on cherchait une expiration là où il y avait un problème de
   droits ou de réseau. On rend donc l'erreur, et l'appelant décide. */
async function rpcAnon(nom,corps){
  var r;
  try{
    r=await fetch(URL_BASE+'/rest/v1/rpc/'+nom,{method:'POST',
      headers:{'apikey':CLE,'Authorization':'Bearer '+CLE,'Content-Type':'application/json'},
      body:JSON.stringify(corps||{})});
  }catch(e){
    var x=new Error('Pas de réseau, ou le serveur ne répond pas.');
    x.reseau=true; throw x;
  }
  if(!r.ok){
    var t=''; try{ t=await r.text(); }catch(e2){}
    var er=new Error('Le serveur a refusé l’appel ('+r.status+'). '+String(t).slice(0,240));
    er.http=r.status; throw er;
  }
  return await r.json();
}
function contratRempli(inv){
  var t=inv.contrat_texte||inv.contrat_modele||'';
  return t.replace(/\{NOM_PARTENAIRE\}/g,inv.nom||'')
          .replace(/\{REMUNERATION\}/g,texteRemuneration(inv));
}

async function ecranBienvenue(j){

  var inv=(r&&r.length)?r[0]:null;

  if(!inv){
    /* Trois situations très différentes se cachaient derrière un seul

       serveur est en panne rappelle son commercial pour rien, et le

      titre='Ce lien n’est plus valable';

        +'lisez ceci, c’est que votre mot de passe existe déjà : connectez-vous '
        +'simplement. Si vous n’en avez jamais créé, demandez un nouveau lien à votre '
        +'interlocuteur.';

    $('#sous-vue').textContent='';

      +(tech?'<div class="q-alerte" style="margin:0 20px 18px;font-family:monospace;'
        +'font-size:12px;white-space:pre-wrap">'+ech(tech)+'</div>':'')
      +'<div style="text-align:center;padding:0 0 26px">'
      +(panne?'<button class="btn" id="v-rec" style="margin-right:8px">Réessayer</button>':'')
      +'<button class="btn fort" id="v-conn">Aller à la connexion</button></div></div>';
    var rc=$('#v-rec'); if(rc)rc.onclick=function(){ location.reload(); };
    $('#v-conn').onclick=function(){ location.hash=''; location.reload(); };
    return;
  }

  var etape=inv.deja_lie?'contrat':'mdp';
  peindreBienvenue();

  function cadre(titre,sous,dedans,pas){
    $('#titre-vue').textContent=titre;
    $('#sous-vue').textContent=sous;
    $('#vue').innerHTML='<div class="panneau" style="max-width:640px;margin:0 auto">'
      +'<div class="corps" style="padding:30px 32px">'

      +'margin-bottom:16px">Étape '+pas+' sur 3</div>'

  }

  function peindreBienvenue(){
    if(etape==='mdp')return ecranMdp();
    if(etape==='contrat')return ecranContrat();

    location.hash=''; location.reload();
  }

  function ecranMdp(){
    cadre('Bienvenue, '+inv.nom,'Créez votre mot de passe',
      '<h2 style="font-size:22px;letter-spacing:-.02em;margin:0 0 10px">Votre espace partenaire</h2>'
      +'<p style="color:var(--attenue);line-height:1.65;margin:0 0 20px">Vous y suivrez chaque '

      +'Votre rémunération convenue : <b style="color:var(--texte)">'
      +ech(texteRemuneration(inv))+'</b>.</p>'
      +'<div class="champ large"><label>Votre adresse e-mail</label>'
      +'<input id="b-mail" type="email" value="'+ech(inv.email||'')+'" autocomplete="username"></div>'
      +'<div class="champ large"><label>Choisissez un mot de passe</label>'
      +'<input id="b-mdp" type="password" autocomplete="new-password" placeholder="au moins 8 caractères">'
      +'<div class="aide">huit caractères au minimum</div></div>'
      +'<div class="champ large"><label>Retapez-le</label>'
      +'<input id="b-mdp2" type="password" autocomplete="new-password"></div>'
      +'<div id="b-err"></div>'
      +'<button class="btn fort" id="b-go" style="margin-top:14px;padding:12px 22px;font-size:15px">'
      +'Créer mon compte</button>'
      +'<p class="sec" style="margin-top:16px">Vous avez déjà un mot de passe ? '
      +'<a href="#" id="b-deja" style="color:var(--signal)">Connectez-vous</a>.</p>', 1);

    $('#b-deja').onclick=function(e){ e.preventDefault(); ecranDejaLa(); };
    $('#b-go').onclick=async function(){
      var b=this, m=$('#b-mail').value.trim(), p1=$('#b-mdp').value, p2=$('#b-mdp2').value;
      var err=$('#b-err');
      err.innerHTML='';
      if(!m||p1.length<8||p1!==p2){
        err.innerHTML='<div class="erreur">'+(p1.length<8
          ? 'Le mot de passe doit faire au moins huit caractères.'
          : 'Les deux mots de passe ne sont pas identiques.')+'</div>';
        return;
      }
      b.disabled=true; b.textContent='Création…';
      try{
        var rp=await fetch(URL_BASE+'/auth/v1/signup',{method:'POST',
          headers:{'apikey':CLE,'Content-Type':'application/json'},

        if(!rp.ok && !/already/i.test(js.msg||js.error_description||'')) 
          throw new Error(js.msg||js.error_description||'Création refusée');
        if(!js.access_token){
          var rc=await fetch(URL_BASE+'/auth/v1/token?grant_type=password',{method:'POST',
            headers:{'apikey':CLE,'Content-Type':'application/json'},
            body:JSON.stringify({email:m,password:p1})});

          if(!rc.ok||!js.access_token)

        }
        jeton=js.access_token; moi=m; RT=js.refresh_token||null; garder();
        var lie=await rpc('ls_lier_compte',{p_jeton:j});
        if(lie!==true) throw new Error('Le lien ne correspond plus à votre fiche. Demandez-en un nouveau.');
        etape='contrat'; peindreBienvenue();

  function ecranContrat(){
    if(inv.contrat_statut==='signe'){ etape='appli'; return peindreBienvenue(); }

var ONGLET_P='bord';
/* ══ Les notifications push ════════════════════════════════════════
   Le partenaire s'abonne auprès du fabricant de son navigateur —
   Google, Apple, Mozilla — qui lui rend une adresse d'envoi. On garde
   cette adresse, et le moteur y dépose les messages. Aucun service
   tiers, aucun coût, aucune limite.

   Deux contraintes qu'il faut connaître avant de promettre quoi que ce
   soit à un partenaire :

   — sur iPhone, le push n'existe QUE si l'application a été ajoutée à
     l'écran d'accueil. Dans Safari, le bouton ne sert à rien ;
   — la permission ne se redemande pas. Un partenaire qui refuse une
     fois doit passer par les réglages de son téléphone. D'où le texte
     qui explique avant de demander, plutôt qu'une fenêtre surgissante
     dès l'ouverture. */

function pushPossible(){
  return 'serviceWorker' in navigator && 'PushManager' in window
      && 'Notification' in window;
}
function pushEtat(){
  if(!pushPossible())return 'impossible';
  if(ESTIOS()&&!INSTALLE())return 'ios-non-installe';
  return Notification.permission;   /* default | granted | denied */
}
function b64Vers8(base64){
  var p='='.repeat((4-base64.length%4)%4);
  var b=(base64+p).replace(/-/g,'+').replace(/_/g,'/');
  var brut=atob(b), t=new Uint8Array(brut.length);
  for(var i=0;i<brut.length;i++)t[i]=brut.charCodeAt(i);
  return t;
}
function versB64(buf){
  var b='', t=new Uint8Array(buf);
  for(var i=0;i<t.length;i++)b+=String.fromCharCode(t[i]);
  return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function activerPush(partenaireId){
  if(!pushPossible())throw new Error('Ce navigateur ne sait pas recevoir de notifications.');
  if(ESTIOS()&&!INSTALLE())
    throw new Error('Sur iPhone, ajoutez d’abord l’application à votre écran d’accueil : '
      +'bouton Partager, puis « Sur l’écran d’accueil ». Les notifications ne sont possibles '
      +'qu’après.');

  var perm=await Notification.requestPermission();
  if(perm!=='granted')
    throw new Error('Notifications refusées. Pour les réactiver, il faut passer par les '
      +'réglages de votre téléphone : le navigateur ne redemande jamais.');

  var reg=await navigator.serviceWorker.ready;
  /* La clé publique vit dans ls_reglages, table réservée à l'équipe :
     un partenaire y lit zéro ligne sans la moindre erreur. On passe
     donc par une petite fonction qui ne rend que cette clé-là. */
  var cle='';
  try{ cle=await rpc('ls_cle_push',{}); }catch(e){}
  if(!cle){
    try{
      var rg=await lire('ls_reglages','select=valeur&cle=eq.vapid_public&limit=1');
      cle=rg.length?rg[0].valeur:'';
    }catch(e){}
  }
  if(!cle)throw new Error('La clé de notification n’est pas encore posée sur le serveur. '
    +'Prévenez votre interlocuteur : il lui manque la mise à jour v3h.');

  var ab=await reg.pushManager.getSubscription();
  if(!ab)ab=await reg.pushManager.subscribe({
    userVisibleOnly:true, applicationServerKey:b64Vers8(cle)});

  var j=ab.toJSON();
  await appelle(URL_BASE+'/rest/v1/ls_push?on_conflict=endpoint',
    {method:'POST',headers:entetes({'Prefer':'resolution=merge-duplicates'}),
     body:JSON.stringify({partenaire_id:partenaireId||null,email:moi||'',
       endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,
       appareil:(navigator.userAgent||'').slice(0,120),actif:true})});

  /* Une notification de bienvenue, envoyée par le navigateur lui-même :
     le partenaire voit tout de suite à quoi ça ressemble, sans attendre
     une commission. */
  reg.showNotification('Notifications activées',{
    body:'Vous serez prévenu dès qu’une commission est validée.',
    icon:'crm-icone-192.png',badge:'crm-icone-192.png',tag:'bienvenue'});
  return true;
}

function SURORDI(){
  return !/Android|iPhone|iPad|iPod|Mobile|Opera Mini|IEMobile/i.test(navigator.userAgent||'');
}

function blocPush(p){
  var e=pushEtat();
  /* Sur un ordinateur, proposer « Activer » serait un piège : le
     partenaire accepterait, puis fermerait l'onglet, et n'aurait
     jamais rien. La notification vit sur le téléphone. */
  if(SURORDI()&&e!=='granted')
    return '<div class="panneau" style="margin-bottom:16px"><div class="corps" '
      +'style="padding:16px 20px">'
      +'<div style="background:#FFF7E6;border:1px solid #F0C674;border-left:4px solid #E0A106;'

  if(e==='granted')
    return '<div class="panneau" style="margin-bottom:16px"><div class="corps" '
      +'style="display:flex;align-items:center;justify-content:space-between;gap:16px;'
      +'flex-wrap:wrap;padding:14px 20px">'
      +'<div><b style="font-size:14px">Notifications activées</b>'

      +'dès qu’une commission est validée.</div></div>'
      +'<button class="btn mini" id="p-push-off">Ne plus recevoir</button></div></div>';
  if(e==='denied')
    return '<div class="panneau" style="margin-bottom:16px"><div class="corps" style="padding:14px 20px">'
      +'<b style="font-size:14px">Notifications bloquées</b>'

      +'Pour les réactiver, ouvrez les réglages de votre navigateur, cherchez ce site, '
      +'et autorisez les notifications.</div></div></div>';
  if(e==='ios-non-installe')
    return '<div class="panneau" style="margin-bottom:16px"><div class="corps" style="padding:14px 20px">'
      +'<b style="font-size:14px">Installez d’abord l’application</b>'
      +'<div class="sec" style="margin-top:3px">Sur iPhone, les notifications ne fonctionnent '
      +'qu’une fois l’application ajoutée à l’écran d’accueil : bouton <b>Partager</b> en bas '
      +'de l’écran, puis <b>Sur l’écran d’accueil</b>. Revenez ensuite ici.</div></div></div>';
  if(e==='impossible')return '';
  return '<div class="panneau" style="margin-bottom:16px"><div class="corps" '
    +'style="display:flex;align-items:center;justify-content:space-between;gap:16px;'
    +'flex-wrap:wrap;padding:16px 20px">'
    +'<div><b style="font-size:14.5px">Être prévenu de vos commissions</b>'
    +'<div class="sec" style="margin-top:3px">Une notification sur votre téléphone dès qu’une '
    +'commission est validée, ou qu’une de vos affaires avance. Rien d’autre.</div></div>'
    +'<button class="btn mini fort" id="p-push">Activer</button></div></div>';
}

    +'<div class="cmd"><span class="sec">'+date(x.updated_at||x.created_at)+'</span></div></div>';
}

/* iOS a ses propres règles pour le push : rien en dehors d'une
   application ajoutée à l'écran d'accueil. On le détecte une fois. */
function ESTIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function INSTALLE(){
  try{ return window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone===true; }catch(e){ return false; }
}
function commentInstaller(){
  var ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
  if(INSTALL){ try{ INSTALL.prompt(); }catch(e){} return; }
  alerteCopiable('Installer l’application',
    ios ? 'Sur iPhone : touchez le bouton Partager en bas de l’écran, puis « Sur l’écran d’accueil ».'
        : 'Sur Android : ouvrez le menu de votre navigateur (les trois points en haut à droite), '
          +'puis « Installer l’application » ou « Ajouter à l’écran d’accueil ».');
}

/* Un partenaire dont le contrat n'est pas signé ne voit que ça. */
async function ecranSignature(p){
  var r=null;
  try{ r=await lire('ls_reglages','select=cle,valeur&cle=in.(contrat_modele,contrat_version)'); }catch(e){}
  var reg={}; (r||[]).forEach(function(x){ reg[x.cle]=x.valeur; });
  var inv=Object.assign({},p,{contrat_modele:reg.contrat_modele||'',
                              contrat_version:reg.contrat_version||''});
  var texte=contratRempli(inv);
  $('#vue').innerHTML='<div class="panneau" style="max-width:640px;margin:0 auto">'
    +'<div class="corps" style="padding:30px 32px">'
    +'<h2 style="font-size:22px;letter-spacing:-.02em;margin:0 0 10px">Il reste le contrat à signer</h2>'
    +'<p style="color:var(--attenue);line-height:1.65;margin:0 0 16px">Votre espace s’ouvre dès '
    +'que c’est fait. Rémunération convenue : <b style="color:var(--texte)">'
    +ech(texteRemuneration(p))+'</b>.</p>'
    +(texte?'<div style="max-height:300px;overflow-y:auto;background:var(--surface-2);'
      +'border:1px solid var(--filet);border-radius:10px;padding:16px 18px;font-size:13.5px;'
      +'line-height:1.7;white-space:pre-wrap">'+ech(texte)+'</div>'
      :'<div class="erreur">Le texte du contrat n’est pas encore disponible. Prévenez votre interlocuteur.</div>')
    +'<label style="display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:14.5px;'
    +'line-height:1.55;cursor:pointer"><input type="checkbox" id="s-lu" style="margin-top:3px">'
    +'<span>J’ai lu et j’accepte les termes de ce contrat.</span></label>'
    +'<div class="champ large" style="margin-top:16px"><label>Signez en tapant vos nom et prénom</label>'
    +'<input id="s-sign" placeholder="Prénom Nom" autocomplete="name"></div>'
    +'<div id="s-err"></div>'
    +'<button class="btn fort" id="s-go" style="margin-top:12px;padding:12px 22px;font-size:15px">'
    +'Signer le contrat</button></div></div>';
  $('#s-go').onclick=async function(){
    var b=this, err=$('#s-err'); err.innerHTML='';
    if(!$('#s-lu').checked||$('#s-sign').value.trim().length<3){
      err.innerHTML='<div class="erreur">Cochez la case et saisissez vos nom et prénom.</div>'; return; }
    b.disabled=true; b.textContent='Signature…';
    try{
      var ok=await rpc('ls_signer_contrat',
        {p_nom:$('#s-sign').value.trim(),p_version:inv.contrat_version||''});
      if(ok!==true)throw new Error('Signature refusée. Reconnectez-vous et réessayez.');
      ecranPortail();
    }catch(e){
      err.innerHTML='<div class="erreur">'+ech(e.message)+'</div>';
      b.disabled=false; b.textContent='Signer le contrat';
    }
  };
}

/* L'application s'installe sur le téléphone du partenaire. Le petit
   service worker ne sert qu'à ça : sans lui, le navigateur refuse
   l'installation. Il ne met rien en cache — un CRM doit toujours
   afficher l'état réel, jamais une copie d'hier. */
if('serviceWorker' in navigator)
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('crm-sw.js',{scope:'/crm'}).catch(function(){});
  });

/* ══ Démarrage ═════════════════════════════════════════════════════ */
(async function(){
  /* Un lien d'invitation passe avant tout : la personne qui arrive
     dessus n'a pas encore de compte, lui montrer un écran de
     connexion serait une impasse. */
  var h=location.hash||'';
  if(h.indexOf('#bienvenue=')===0){
    /* Le jeton traverse une messagerie avant d'arriver ici. Gmail,
       Outlook et les redirections de suivi lui collent parfois un
       caractère de ponctuation, un %0A ou un espace. On ne garde donc
       que ce qu'un jeton peut contenir : des lettres et des chiffres. */
    var brut=h.slice(11);
    try{ brut=decodeURIComponent(brut); }catch(e){}
    var propre=(brut||'').replace(/[^A-Za-z0-9]/g,'');
    try{ await ecranBienvenue(propre); }catch(e){
      $('#vue').innerHTML='<div class="erreur">'+ech(String(e.message||e))+'</div>'; }
    return;
  }
  try{
    var g=JSON.parse(sessionStorage.getItem('ls_adm')||'null');
    if(g&&g.j){ jeton=g.j; moi=g.m; RT=g.r||null; await ouvrir(); return; }
  }catch(e){}
})();
})();
</script>
