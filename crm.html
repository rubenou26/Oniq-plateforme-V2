        +'<button class="btn" id="go-part" style="padding:12px 24px;font-size:14.5px"'
          +(parts?'':' disabled')+'>Appeler des partenaires</button></div>'
      +'</div></div>'

      /* La quatrième file, et la plus rentable : un devis envoyé a déjà
         coûté un lead, un appel et une qualification. Le relancer coûte
         trois minutes. C'est là que se perdent les affaires — pas faute
         d'intérêt, faute de nouvelles. */
      +'<div class="panneau'+(relances?' vif':'')+'" style="margin:0"><div class="corps" '
        +'style="text-align:center;padding:34px 22px">'
        +'<div class="l" style="font-family:\'JetBrains Mono\',monospace;font-size:10px;letter-spacing:.14em;'
        +'text-transform:uppercase;color:var(--faible)">Relancer les devis</div>'
        +'<div style="font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1.1;margin:10px 0 6px'
        +(relances?';color:var(--signal)':'')+'">'+nb(relances)+'</div>'
        +'<p class="sec" style="max-width:38ch;margin:0 auto 20px;line-height:1.65">'
        +(relances?'Des devis partis sans réponse. Vous arrivez avec le dossier sous les yeux : '
                  +'le montant, ce qui a été dit, et depuis quand ça dort.'
                 :'Aucun devis n’attend. Ils arriveront ici trois jours après leur envoi.')+'</p>'
        +'<button class="btn'+(relances&&!leads?' fort':'')+'" id="go-rel" '
          +'style="padding:12px 24px;font-size:14.5px"'+(relances?'':' disabled')+'>'
          +'Relancer les devis</button>'
      +'</div></div></div>'
      +'<div class="sec" style="text-align:center;margin-top:16px">Raccourcis clavier : '
      +RESULTATS.map(function(x){return '<b>'+x.touche+'</b> '+x.lab;}).join(' · ')
      +' — pendant que vous notez une réponse, ajoutez <b>Alt</b></div>';
    $('#vue').innerHTML=h;
    var vf=$('#vider-filtre');
    if(vf)vf.onclick=function(){ poserFiltre(Object.assign({},FILTRE_DEFAUT)); VUES.appels(); };
    var lancer=function(mode){
      SESSION={debut:Date.now(),faits:0,interesses:0,fiche:null,mode:mode};
      ecranSession();
    };
    var b=$('#go'); if(b&&!b.disabled)b.onclick=function(){ lancer('froid'); };
    var bl=$('#go-lead'); if(bl&&!bl.disabled)bl.onclick=function(){ lancer('lead'); };
    var br=$('#go-rel'); if(br&&!br.disabled)br.onclick=function(){ lancer('relance'); };
    var be=$('#go-part-eng'); if(be)be.onclick=engrenagePartenaires;
    var bp=$('#go-part'); if(bp&&!bp.disabled)bp.onclick=function(){
      SESSION={debut:Date.now(),faits:0,interesses:0,fiche:null,mode:'partenaire'};
      ecranAppelPartenaire();
    };
    var bc=$('#go-chaud'); if(bc&&!bc.disabled)bc.onclick=function(){
      SESSION={debut:Date.now(),faits:0,interesses:0,fiche:null,mode:'partenaire',chaud:true};
      ecranAppelPartenaire();
    };
  }catch(e){
    $('#vue').innerHTML='<div class="erreur">Lecture impossible : '+ech(e.message)+'</div>';
  }
}

/* Appeler une fiche précise, avec la conduite d'appel complète :
   l'ouverture, les questions, les objections, les résultats. Le
   commercial n'a pas à lancer une session d'une heure pour passer un
   appel qu'il a décidé de passer maintenant. */
function appelerFiche(p){
  if(!p||!p.id)return;
  clearInterval(MINUTEUR);
  SESSION={debut:Date.now(),faits:0,interesses:0,fiche:p,pile:[],
           mode:p.est_lead?'lead':'froid',solo:p.id};
  courante='appels';
  $$('#menu a').forEach(function(a){ a.classList.toggle('actif',a.dataset.id==='appels'); });
  var sec=SECTIONS.filter(function(x){ return x.id==='appels'; })[0];
  if(sec){ $('#titre-vue').textContent=sec.nom; $('#sous-vue').textContent=sec.sous||''; }
  outils('');
  ecranSession();
}

async function ecranSession(){
  /* La session a pu s'achever pendant qu'on notait le dernier appel :
     le compte à rebours tombe, ou quelqu'un a cliqué sur Arrêter. Ce
     n'est pas une panne, c'est la fin. On rend la main à l'écran de
     départ plutôt que de chercher une fiche qui n'existe plus. */
  if(!SESSION){ VUES.appels(); return; }
  /* L'heure est passée pendant un appel : on s'arrête maintenant que la
     fiche est notée, pas au milieu d'une phrase. */
  if(SESSION&&SESSION.finirApres&&!SESSION.fiche){
    SESSION.finirApres=false;
    clearInterval(MINUTEUR); finSession('L’heure est écoulée.'); return;
  }
  /* Une session ouverte depuis une fiche ne tire pas la file : elle
     s'occupe de cette fiche-là, et rend la main à la fiche une fois
     l'appel noté. C'est le même écran, le même script, le même
     enregistrement qu'en session normale. */
  if(SESSION&&SESSION.solo&&!SESSION.fiche){
    var retour=SESSION.solo; SESSION=null; clearInterval(MINUTEUR);
    ficheClient(retour); return;
  }
  /* La file arrive par paquets de dix : entre deux appels, plus d'attente
     pendant que le serveur répond. Et chaque fiche est réservée le temps
     de l'appel — à quinze dans l'outil, deux commerciaux tombaient sur le
     même numéro dès la première heure. */
  if(!SESSION.fiche){
    await aV2L();
    var pris=null, tours=0;
    while(!pris&&tours<3){
      if(!SESSION.pile||!SESSION.pile.length){ SESSION.pile=await fileAppels(10,SESSION.mode); tours++; }
      if(SESSION.sautes)SESSION.pile=SESSION.pile.filter(function(x){ return !SESSION.sautes[x.id]; });
      if(!SESSION.pile.length)continue;
      var cand=SESSION.pile.shift();
      var ok=A_V2L?await rpc('ls_prendre_fiche',{p_id:cand.id}):true;
      if(ok===null||ok===true)pris=cand;
    }
    if(!pris){ finSession(SESSION.mode==='lead'
      ?'Plus aucun lead à rappeler. Bien joué.':'La file est vide.'); return; }
    SESSION.fiche=pris;
  }
  /* Un mot laissé par l'appel précédent — une fiche sortie de la file,
     par exemple. Il s'affiche une fois, sur l'écran suivant. */
  if(SESSION.messageFiche){
    var msg=SESSION.messageFiche; SESSION.messageFiche=null;
    setTimeout(function(){ alerteCopiable('Fiche retirée de la file',msg); },80);
  }
  var p=SESSION.fiche;
  marquerVue(SESSION.mode==='partenaire'?'ls_prescripteurs':'ls_prospects',p.id);
  await monNom();
  ACCROCHES=await accroches(p.activite);
  /* On ne propose que les accroches du moment : dans une file de leads
     on n’a rien à faire d’un script d’appel à froid, et l’inverse est
     encore plus vrai. */
  var CTX=(SESSION.mode==='lead'?'lead':'froid');
  var DISPOS=ACCROCHES.filter(function(m){
    return !m.contexte||m.contexte==='tous'||m.contexte===CTX; });
  if(!DISPOS.length)DISPOS=ACCROCHES.filter(function(m){ return m.contexte!=='partenaire'; });
  var choisie=choisirAccroche(DISPOS,CTX);
  var mod=choisie?remplir(choisie.corps,p):'';
  var reste=Math.max(0,3600-Math.floor((Date.now()-SESSION.debut)/1000));

  $('#vue').innerHTML='<div class="chrono" style="margin-bottom:14px">'
    +(SESSION.mode==='lead'?'<span class="etat e-ok">File des leads</span>'
                           :SESSION.mode==='relance'?'<span class="etat e-att">Relance de devis</span>'
                           :'<span class="etat e-neu">Appels à froid</span>')+'<span>·</span>'
    +'<b id="reste">'+String(Math.floor(reste/60)).padStart(2,'0')+':'+String(reste%60).padStart(2,'0')+'</b> restantes'
    +'<span>·</span><span>'+SESSION.faits+' appel'+(SESSION.faits>1?'s':'')+' dans la session</span>'
    +'<span>·</span><span>'+SESSION.interesses+' intéressé'+(SESSION.interesses>1?'s':'')+'</span>'
    +'<span style="flex:1"></span>'
    +(SESSION.dernier?'<button class="btn mini" id="annuler">Annuler : '
      +ech(SESSION.dernier.societe)+' — '+ech(SESSION.dernier.lab)+'</button>':'')
    +'<button class="btn mini" id="sauter">Passer cette fiche</button>'
    +'<button class="btn mini" id="stop">Arrêter la session</button></div>'
    +(p.campagne_etiquette?'<div class="bandeau-seq"><span>A répondu à la campagne <b>'+ech(p.campagne_etiquette)+'</b> : il vous attend, allez droit au but.</span></div>':'')
    +'<div class="fiche">'
      +'<div class="soc">'+ech(p.societe)+'</div>'
      +'<div class="det">'+pastilleMaison(p.activite)
        +(p.ville?etat(p.ville,'neu'):'')
        +(p.effectif_num?etat(p.effectif_num+' salariés et plus','neu'):p.effectif?etat(p.effectif+' salariés','neu'):'')
        +(p.ca?etat('CA '+euro(p.ca),'neu'):'')
        +(p.source?etat(p.source,'neu'):'')
        +(p.etape?etat(joli(p.etape),'neu'):'')+'</div>'
      +'<a class="tel" href="tel:'+ech(p.tel||'')+'">'+ech(p.tel||'numéro inconnu')+'</a>'
      +'<div class="sec">'+ech(p.dirigeant||'dirigeant non identifié')
        +(p.note?' — '+ech(p.note):'')+'</div>'
      +(DISPOS.length>1
        ?'<div style="margin-top:14px"><select id="pick-accroche" class="mini-sel" '
          +'style="max-width:none;padding:5px 10px;font-size:11px">'
          +DISPOS.map(function(m){
            return '<option value="'+m.id+'"'+(choisie&&m.id===choisie.id?' selected':'')+'>'
              +ech(m.nom)+'</option>';
          }).join('')+'</select></div>':'')
      +(SESSION.mode==='relance'?'<div id="dossier"></div>':'')
      +'<div class="ouverture" id="conduite"></div>'
      +'<div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">'
        +'<button class="btn fort" data-qual>Remplir la qualification</button>'
        +'<button class="btn" data-devis>Envoyer le devis</button>'
        +'<button class="btn" data-pieces>Demander les pièces</button>'
        +'<button class="btn" data-mail>Envoyer un mail</button>'
        +'<button class="btn" data-part>Inviter comme partenaire</button>'
        +'<button class="btn" data-fiche>Voir la fiche client</button>'
        +'<button class="btn fort" data-fin style="margin-left:auto">Fin d’appel : rendez-vous à préparer</button></div>'
    +'</div>'
    +'<div class="resultats">'+resultatsPour(SESSION.mode).map(function(x){
      return '<button data-r="'+x.id+'"'+(x.id==='interesse'?' class="ok"':'')+'>'
        +'<kbd>'+x.touche+'</kbd><b>'+ech(x.lab)+'</b><span>'+ech(x.aide)+'</span></button>';
    }).join('')+'</div>';

  clearInterval(MINUTEUR);
  MINUTEUR=setInterval(function(){
    var s=Math.max(0,3600-Math.floor((Date.now()-SESSION.debut)/1000));
    var e=$('#reste'); if(!e){clearInterval(MINUTEUR);return;}
    e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
    if(s<=300&&s>294&&!SESSION.prevenu){
      SESSION.prevenu=true;
      var b=$('#reste'); if(b)b.style.color='var(--attente)';
    }
    if(s<=0){
      /* Une fiche ouverte veut dire quelqu'un au bout du fil. On laisse
         finir, la session s'arrêtera au résultat d'appel suivant. */
      if(SESSION.fiche){ SESSION.finirApres=true; return; }
      clearInterval(MINUTEUR); finSession('L’heure est écoulée.');
    }
  },1000);

  $('#stop').onclick=function(){ finSession('Session arrêtée.'); };
  var sa=$('#sauter'); if(sa)sa.onclick=sauterFiche;
  var an=$('#annuler'); if(an)an.onclick=annulerDernier;
  /* ══ La conduite d'appel ═════════════════════════════════════════
     L'ouverture puis les questions, dans le même fil : un temps de
     parole à l'écran, la case pour noter la réponse juste dessous, et
     on avance. Séparer le script de la saisie oblige à tout retaper
     après l'appel, de mémoire, donc mal. */
  var OUVERTURE=[], REP={}, ETAPES=[], POS=0, ENREG=null, DEJA={};
  try{
    var dq=await lire('ls_qualif','select=reponses&prospect_id=eq.'+p.id+'&limit=1');
    if(dq.length)REP=dq[0].reponses||{};
  }catch(e){}
  DEJA=prerempliesDe(p,REP);

  function poserOuverture(txt){
    OUVERTURE=String(txt||'').split(/\n\s*\n/).map(function(x){return x.trim();}).filter(Boolean);
  }
  poserOuverture(mod);

  /* Un lead a levé la main : on qualifie à fond, il s'y attend. Quelqu'un
     qu'on dérange, non — cinq questions pour savoir s'il y a une affaire,
     et on ne déroule le reste que s'il dit oui. Poser vingt-six questions
     à un inconnu, c'est se faire raccrocher au nez à la sixième. */
  var COURT=['besoin','nb_utilisateurs','secteur','delai','decideur'];
  var AFOND=(SESSION.mode==='lead');
  function construire(){
    ETAPES=OUVERTURE.map(function(t){ return {dire:t}; });
    /* Companeo pose déjà des questions avant de vendre le lead. Les
       reposer au téléphone, c'est annoncer qu'on n'a pas lu la demande. */
    if(REP.companeo&&REP.companeo.length)
      ETAPES.push({dire:'Il a déjà répondu à ceci — ne le redemandez pas :\n'
        +REP.companeo.map(function(x){ return '· '+x.q+' : '+(x.r||'—'); }).join('\n')});
    /* Ce que la fiche donne — le dirigeant — se rappelle au commercial,
       mais ne se redemande pas au client. */
    var su=[];
    if(DEJA.decideur&&REP.decideur)su.push('Interlocuteur : '+REP.decideur);
    if(su.length)ETAPES.push({dire:'Déjà connu, à confirmer seulement si besoin :\n'
      +su.map(function(t){ return '· '+t; }).join('\n')});
    questionsVisibles(REP,DEJA).forEach(function(x){
      if(!AFOND&&COURT.indexOf(x.q.id)<0)return;
      ETAPES.push({dire:x.q.q,q:x.q,s:x.s});
    });
    /* On ne raccroche pas sur une question. La dernière étape dit au
       client quoi faire, quand il aura son devis, et comment joindre
       son interlocuteur. */
    if(AFOND) ETAPES.push({dire:motDeFin(REP,p),fin:true});
  }
  function lireRep(){
    var e=ETAPES[POS]; if(!e||!e.q)return;
    var q=e.q, z=$('#conduite');
    if(q.type==='multi'){
      var v=$$('[name="q-'+q.id+'"]:checked',z).map(function(i2){return i2.value;});
      if(v.length)REP[q.id]=v; else delete REP[q.id];
    }else{
      var el=$('#q-'+q.id,z);
      if(el){ var v2=String(el.value).trim(); if(v2!=='')REP[q.id]=v2; else delete REP[q.id]; }
    }
  }
  /* La fiche client se remplit au fil de l'appel, pas à la fin : si la
     conversation tourne court, ce qui a été dit est déjà gardé. */
  function enregistrer(){
    clearTimeout(ENREG);
    ENREG=setTimeout(async function(){
      /* On relit avant d'écrire : la fenêtre de qualification a pu
         remplir des réponses depuis, et un remplacement aveugle les
         effacerait sans un mot. Ce qui vient d'être tapé ici gagne,
         le reste est conservé. */
      var relu=false;
      try{
        var av=await lire('ls_qualif','select=reponses&prospect_id=eq.'+p.id+'&limit=1');
        relu=true;
        if(av.length&&av[0].reponses){
          var fond=av[0].reponses, fusion={};
          for(var k in fond)fusion[k]=fond[k];
          for(var k2 in REP)fusion[k2]=REP[k2];
          REP=fusion;
        }
      }catch(e){}
      /* Si la relecture a échoué, on n'écrit pas : on effacerait ce que
         la fenêtre de qualification a pu remplir entre-temps. On
         réessaiera au prochain changement. */
      var zc=$('#conduite');
      if(!relu){
        if(zc&&!$('#q-hors-ligne',zc))
          zc.insertAdjacentHTML('beforeend','<div id="q-hors-ligne" class="q-alerte">'
            +'Connexion perdue : les réponses ne sont pas encore enregistrées. Elles le seront '
            +'dès que le réseau revient.</div>');
        return;
      }
      var v=lireQualif(REP), l=questionsToutes(REP).filter(function(x){ return !x.q.opt; });
      var faits=l.filter(function(x){ return REP[x.q.id]!==undefined&&REP[x.q.id]!==''; }).length;
      appelle(URL_BASE+'/rest/v1/ls_qualif?on_conflict=prospect_id',
        {method:'POST',headers:entetes({'Prefer':'resolution=merge-duplicates'}),
         body:JSON.stringify(Object.assign({prospect_id:p.id,societe:p.societe},colonnesQualif(REP),
           {complet:Math.round(faits/Math.max(1,l.length)*100),
           alertes:v.alertes.join(' · '),recap:recapQualif(p,REP),reponses:REP,par:moi,
           maj_le:new Date().toISOString()}))})
        .then(function(r){
          var h=$('#q-hors-ligne',$('#conduite'));
          if(r&&r.ok){ if(h)h.remove();
            if(REP.echeance)poserEcheance('ls_prospects',p.id,REP.echeance);
            return; }
          if(!h&&$('#conduite'))$('#conduite').insertAdjacentHTML('beforeend',
            '<div id="q-hors-ligne" class="q-alerte">La base a refusé l’enregistrement des '
            +'réponses. Notez-les à part avant de raccrocher.</div>');
        })
        .catch(function(){
          var z2=$('#conduite');
          if(z2&&!$('#q-hors-ligne',z2))z2.insertAdjacentHTML('beforeend',
            '<div id="q-hors-ligne" class="q-alerte">Connexion perdue : les réponses ne sont '
            +'pas encore enregistrées.</div>');
        });
    },600);
  }
  function peindreEtape(){
    var z=$('#conduite'); if(!z)return;
    construire();
    if(POS>=ETAPES.length)POS=ETAPES.length-1;
    var e=ETAPES[POS], v=lireQualif(REP);
    var faits=ETAPES.filter(function(x){ return x.q&&REP[x.q.id]!==undefined&&REP[x.q.id]!==''; }).length;
    var nbq=ETAPES.filter(function(x){return x.q;}).length;
    z.innerHTML='<div class="cond-dire">'+ech(e.dire)+'</div>'
      +(e.q?'<div class="cond-rep">'+champQ(e.q,REP[e.q.id])+'</div>':'')
      +(e.q&&e.q.a?'<p class="sec" style="margin:9px 0 0;line-height:1.55">'+ech(e.q.a)+'</p>':'')
      +(e.q?blocPrecision(e.q):'')
      +(v.alertes.length&&e.q?'<div class="q-alerte">'+ech(v.alertes[v.alertes.length-1])+'</div>':'')
      +'<div class="etape-barre">'
        +'<button class="btn mini" id="et-prec"'+(POS===0?' disabled':'')+'>Précédent</button>'
        +'<span class="sec mono">'+(POS+1)+' / '+ETAPES.length
          +(nbq?' · '+faits+' réponse'+(faits>1?'s':'')+' notée'+(faits>1?'s':''):'')+'</span>'
        +'<span style="display:flex;gap:7px">'
        +(!AFOND
          ?'<button class="btn mini" id="et-fond">Qualifier à fond</button>':'')
        +(e.q?'<button class="btn mini" id="et-passer">Passer</button>':'')
        +'<button class="btn mini fort" id="et-suiv">'
          +(POS>=ETAPES.length-1?'Terminer':'Suivant')+'</button></span>'
      +'</div>';
    brancherPrecision(z);
    var ep=$('#et-prec',z); if(ep)ep.onclick=function(){ lireRep(); if(POS>0)POS--; peindreEtape(); };
    var pa=$('#et-passer',z); if(pa)pa.onclick=function(){ POS++; peindreEtape(); };
    var ef=$('#et-fond',z); if(ef)ef.onclick=function(){ lireRep(); AFOND=true; peindreEtape(); };
    var es=$('#et-suiv',z);
    if(es)es.onclick=function(){
      lireRep(); enregistrer();
      if(POS>=ETAPES.length-1){ es.textContent='Enregistré'; return; }
      POS++; peindreEtape();
    };
    var champ=$('.cond-rep select,.cond-rep input,.cond-rep textarea',z);
    if(champ){
      champ.focus();
      champ.onchange=function(){ lireRep(); enregistrer(); };
      champ.onkeydown=function(ev){
        if(ev.key==='Enter'&&champ.tagName!=='TEXTAREA'){ ev.preventDefault(); es.click(); }
      };
    }
  }
  construire(); POS=0; peindreEtape();

  var pk=$('#pick-accroche');
  if(pk)pk.onchange=function(){
    var m=DISPOS.filter(function(x){return x.id===pk.value;})[0];
    if(m){ poserOuverture(remplir(m.corps,p)); POS=0; peindreEtape(); }
  };
  if(SESSION.mode==='relance'){
    var z=$('#dossier');
    if(z){ z.innerHTML='<div class="panneau" style="margin:0 0 14px"><div class="corps">'
      +'Lecture du dossier…</div></div>';
      dossierRelance(p).then(function(h){ var z2=$('#dossier'); if(z2)z2.innerHTML=h; })
        .catch(function(){ var z2=$('#dossier'); if(z2)z2.innerHTML=''; }); }
  }
  var bq=$('[data-qual]'); if(bq)bq.onclick=function(){ qualifier(p); };
  /* La fin d'un appel qui s'est bien passé. Un seul bouton : la fiche
     passe dans « Demandes », la prochaine action est le devis, et la
     fiche suivante s'affiche. Pas de fenêtre à remplir : tout a été
     noté pendant l'appel. */
  var bfin=$('[data-fin]');
  if(bfin)bfin.onclick=async function(){
    var b=this; b.disabled=true; b.textContent='…';
    try{

        avant:{appel_resultat:p.appel_resultat||null,etape:p.etape,rappel_le:p.rappel_le||null,

  /* Un prospect qui refuse notre offre peut très bien accepter de nous
     apporter des affaires. Ce bouton crée sa fiche partenaire à partir

  var bp2=$('[data-part]');
  if(bp2)bp2.onclick=async function(){

        +'&nom=eq.'+encodeURIComponent(p.societe||'')+'&limit=1');
      var fp=l[0];

        var r=await ecrire('ls_prescripteurs',{
          nom:p.societe||'', activite:act, type:p.type||'', statut:'En discussion',
          contact:p.dirigeant||'', tel:p.tel||'', email:p.email||'',
          ville:p.ville||'', adresse:p.adresse||'', code_postal:p.code_postal||'',
          siren:p.siren||null, source:'appel', owner_email:moi||''});
        fp=(r&&r[0])||null;
        if(!fp){ l=await lire('ls_prescripteurs','select=*&activite=eq.'+encodeURIComponent(act)
          +'&nom=eq.'+encodeURIComponent(p.societe||'')+'&limit=1'); fp=l[0]; }
        await tracer('partenaire.cree',p.societe||'');

document.addEventListener('keydown',function(e){
  if(!SESSION||!SESSION.fiche)return;
  if(document.querySelector('.fond-modale'))return;
  /* La conduite d'appel garde un champ de saisie sous le curseur en
     permanence. Sans ce garde-fou, taper « 3 » pour trois utilisateurs notait
     l'appel « absent » et faisait disparaître la fiche. Dans un champ,
     il faut donc Alt + le chiffre. */
  var t=e.target, dedans=!!(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'
    ||t.tagName==='TEXTAREA'||t.isContentEditable));
  if(dedans&&!e.altKey)return;
  /* Sur un clavier AZERTY, la rangée du haut donne & é " ' ( sans
     Shift : comparer la lettre affichée ne marchait qu'avec le pavé
     numérique. Le code physique de la touche, lui, est le même
     partout. */
  var chiffre=(/^(Digit|Numpad)([1-9])$/.exec(e.code||'')||[])[2]||e.key;
  var r=RESULTATS.filter(function(x){return x.touche===chiffre;})[0];
  if(r){ e.preventDefault();
    /* SESSION.rep est l'objet de réponses vivant de l'écran de
       recrutement. Lire fiche.qualif à la place rouvrait « Intéressé »
       vide et écrasait ce qui venait d'être saisi. */
    if(SESSION.mode==='partenaire')noterPartenaire(r.id,SESSION.rep||(SESSION.fiche&&SESSION.fiche.qualif)||{});
    else noter(r.id); }
});

/* La bonne accroche au bon moment : on n'ouvre pas de la même façon
   quelqu'un qui a rempli un formulaire et quelqu'un qu'on dérange.
   Le modèle porte son contexte, la file dit lequel servir. */
var ACCROCHES=null, CACHE_ACCROCHES={};
async function accroches(a){
  if(CACHE_ACCROCHES[a])return CACHE_ACCROCHES[a];
  try{
    var l=await lire('ls_modeles',
      'select=id,nom,corps,contexte,activite&canal=eq.appel&activite=in.('+a+',les_deux)&limit=50');
    CACHE_ACCROCHES[a]=l; return l;
  }catch(e){ return []; }
}
/* Les colonnes de v2l ne sont peut-être pas encore posées : on regarde
   une fois, et tout continue de marcher si elles manquent. */
var A_V2L=null;
async function aV2L(){
  if(A_V2L!==null)return A_V2L;
  try{ await lire('ls_prospects','select=en_cours_le&limit=1'); A_V2L=true; }
  catch(e){ A_V2L=false; }
  return A_V2L;
}
function bribeLibre(){
  if(!A_V2L)return '';
  var t=new Date(Date.now()-20*60000).toISOString();
  return '&or=(en_cours_le.is.null,en_cours_le.lt.'+t+',en_cours_par.eq.'+encodeURIComponent(moi||'')+')';
}
function choisirAccroche(liste,mode){
  if(!liste.length)return null;
  var exact=liste.filter(function(m){ return m.contexte===mode; });
  if(exact.length)return exact[0];
  var tous=liste.filter(function(m){ return !m.contexte||m.contexte==='tous'; });
  return tous.length?tous[0]:liste[0];
}
async function monObjectif(){
  try{
    var o=await lire('ls_objectifs','select=*&owner_email=eq.'+encodeURIComponent(moi||'')+'&limit=2');
    if(o.length)return o[0];
  }catch(e){}
  return {appels_jour:30,rdv_semaine:3,devis_semaine:3};
}

/* Passer la fiche : elle n'est pas appelée, donc rien n'est écrit —
   ni résultat, ni tentative. Elle reste dans le fichier, exactement
   comme avant, mais on ne la reverra plus de la session : sans ça elle
   remonterait aussitôt en tête de file et on tournerait en rond. */
async function sauterFiche(){
  var p=SESSION&&SESSION.fiche; if(!p)return;
  SESSION.sautes=SESSION.sautes||{};
  SESSION.sautes[p.id]=true;
  SESSION.fiche=null;
  if(A_V2L){ try{ await rpc('ls_liberer_fiche',{p_id:p.id}); }catch(e){} }
  ecranSession();
}

async function noter(res){
  var p=SESSION&&SESSION.fiche; if(!p)return;
  /* La session peut s'achever pendant qu'on écrit — le compte à rebours
     tombe, ou la file se vide. Ce qui est décidé au téléphone doit
     s'enregistrer quand même : on retient le mode ici, une fois pour
     toutes, et on ne relit plus SESSION que prudemment. */
  var MODE=(SESSION&&SESSION.mode)||'froid';
  SESSION.fiche=null; SESSION.faits++;
  /* Une touche mal visée ne doit pas coûter une fiche : on garde l'état
     d'avant, et la barre du haut propose de revenir dessus. */
  if(SESSION)SESSION.dernier={id:p.id,societe:p.societe,fiche:p,appel_id:null,
    interesse:(res==='interesse'),
    lab:(RESULTATS.filter(function(x){return x.id===res;})[0]||{}).lab||res,
    avant:{appel_resultat:p.appel_resultat||null,etape:p.etape,rappel_le:p.rappel_le||null,
           prochaine:p.prochaine||null,tel:p.tel||null,perdu_motif:p.perdu_motif||null}};
  if(SESSION&&SESSION.dernier&&('tentatives' in p))SESSION.dernier.avant.tentatives=p.tentatives||0;

  var maj={appel_resultat:res};
  if(res==='interesse'){ if(SESSION)SESSION.interesses++; maj.etape=(p.activite==='tiimizy')?'Contacte':'Qualifie';
    maj.rappel_le=null; maj.prochaine='Recontacter, il est intéressé'; }
  if(res==='absent'){
    /* Rappeler trois jours plus tard à la même heure, c'est retomber sur
       la même absence. On décale l'heure, on espace, et au bout de quatre
       essais on rend la file à ceux qui décrochent. */
    var t=(+(p.tentatives||0))+1;
    if('tentatives' in p)maj.tentatives=t;
    if(t>=4){ maj.etape='Perdu'; maj.rappel_le=null; maj.prochaine='Injoignable';
      maj.perdu_motif='Injoignable après 4 tentatives';
      /* Le quatrième « Absent » sort la fiche du fichier. C'est la seule
         action de cet écran qui détruit du travail, et rien ne le disait. */
      if(SESSION)SESSION.messageFiche=p.societe+' sort de la file : quatre tentatives sans réponse. '
        +'« Annuler » en haut la remet.'; }
    else{ /* Plus de rappel automatique : la fiche sort de la file, et ne
             revient que si quelqu'un choisit « Rappeler » avec une date. */
      maj.rappel_le=null;
      maj.prochaine='Absent ('+t+' tentative'+(t>1?'s':'')+'), à rappeler à la main'; }
  }
  if(res==='pas_interesse'){ maj.etape='Perdu'; maj.rappel_le=null; maj.perdu_motif='Pas intéressé au téléphone'; }
  if(res==='faux_numero'){ maj.tel=null; maj.rappel_le=null; maj.prochaine='Retrouver un numéro'; }
  try{
    var tr=await ecrire('ls_appels',{prospect_id:p.id,societe:p.societe,activite:p.activite,
      owner_email:moi,resultat:res});
    if(tr&&tr[0]&&tr[0].id&&SESSION&&SESSION.dernier)SESSION.dernier.appel_id=tr[0].id;
    if(res==='rappeler'){
      /* On pose le rappel tout de suite, avant d'ouvrir quoi que ce
         soit : un clic à côté de la fenêtre ne doit pas effacer une
         promesse faite au téléphone. Le formulaire ne fait que la
         préciser. */
      var demain=new Date(Date.now()+864e5); demain.setHours(9,0,0,0);
      if(MODE==='relance'){
        /* Quatre jours ouvrés entre deux relances : assez pour ne pas
           harceler, assez peu pour que le devis reste présent. Le
           rythme est constant — c'est une cadence, pas un abandon
           progressif. Une date donnée par le client remplace toujours
           celle-ci : le formulaire s'ouvre juste après. */
        demain=joursOuvres(4);
        maj.etape='Relance';
        if('tentatives' in p)maj.tentatives=(+(p.tentatives||0))+1;
      }
      await modifier('ls_prospects','id=eq.'+p.id,{appel_resultat:'rappeler',
        rappel_le:null,prochaine:'Rappel promis, date à préciser'});
      ecranSession();
      formulaire('Quand le rappeler ?',[
        {id:'quand',nom:'Date',type:'date',requis:true,
          valeur:MODE==='relance'?demain.toISOString().slice(0,10):aujourdhui(),
          aide:MODE==='relance'
            ?'quatre jours ouvrés proposés. S’il vous a donné une date, mettez la sienne'
            :''},
        {id:'heure',nom:'Heure',type:'select',valeur:'14:00',
          options:['08:00','09:00','10:00','11:00','12:00','14:00','15:00','16:00','17:00','18:00']
            .map(function(h){ return {v:h,l:h.replace(':','h')}; }),
          aide:'« rappelez-moi à 15 h » est la réponse la plus fréquente : notez-la ici, '
            +'pas dans le texte libre'},
        {id:'quoi',nom:'À lui dire',large:true,valeur:'',ph:'il voulait en parler à son associé'}
      ],async function(v){
        await modifier('ls_prospects','id=eq.'+p.id,{appel_resultat:'rappeler',
          rappel_le:new Date(v.quand+'T'+(v.heure||'09:00')+':00').toISOString(),
          prochaine:v.quoi||'Rappel promis'});
        ecranSession();
      });
      return;
    }
    await modifier('ls_prospects','id=eq.'+p.id,maj);
    if(res==='interesse'){
      formulaire('Intéressé — qu’avez-vous obtenu ?',[
        {id:'dirigeant',nom:'Son nom',valeur:p.dirigeant,large:true},
        {id:'email',nom:'Son e-mail',type:'email',valeur:p.email,aide:'faites-le répéter, lettre par lettre'},
        {id:'montant',nom:'Montant estimé (€)',type:'number',valeur:p.montant||''},
        {id:'prochaine',nom:'La suite',large:true,valeur:'Envoyer la proposition'},
        {id:'quand',nom:'Le rappeler le',type:'date',valeur:'',aide:'vide : pas de rappel, la fiche vit dans Demandes'}
      ],async function(v){
        await modifier('ls_prospects','id=eq.'+p.id,{dirigeant:v.dirigeant,email:v.email||null,
          montant:+v.montant||0,prochaine:v.prochaine,
          rappel_le:v.quand?new Date(v.quand+'T09:00:00').toISOString():null});
        await tracer('appel.interesse',p.societe,p.id);
        /* Tout se joue maintenant : le client est encore au téléphone,
           et c'est le meilleur moment pour cadrer son besoin et caler la
           maquette. La qualification s'ouvre donc d'elle-même. */
        /* Sauf si la conduite d'appel a déjà tout recueilli : rouvrir le
           même questionnaire par-dessus, c'est demander deux fois. */
        var deja=0;
        try{ var dq=await lire('ls_qualif','select=complet&prospect_id=eq.'+p.id+'&limit=1');
             if(dq.length)deja=+dq[0].complet||0; }catch(e2){}
        if(deja<60&&MODE!=='relance')
          qualifier(Object.assign({},p,{dirigeant:v.dirigeant,email:v.email}),
            function(){ ecranSession(); });
        else ecranSession();
      },null,null,function(){ ecranSession(); });
      return;
    }
  }catch(e){
    /* Sans ce message, un appel perdu par le réseau ressemble en tout
       point à un appel enregistré : la fiche suivante s'affiche, le
       commercial passe à autre chose, et la fiche ressortira dans la
       file des jamais appelés la semaine d'après. */
    alerteCopiable('Résultat d’appel non enregistré',
      'Le résultat n’a pas pu être écrit : '+String(e.message||e).slice(0,220)
      +'\n\nNotez la société et le résultat, et vérifiez votre connexion avant de continuer.');
  }
  ecranSession();
}

/* Revenir sur le dernier appel : la fiche retrouve son état d'avant, la
   trace fautive disparaît, et elle repasse devant. */
async function annulerDernier(){
  var d=SESSION&&SESSION.dernier; if(!d)return;
  SESSION.dernier=null;
  try{ await modifier('ls_prospects','id=eq.'+d.id,d.avant); }catch(e){}
  if(d.appel_id){ try{ await supprimer('ls_appels','id=eq.'+d.appel_id); }catch(e){} }
  SESSION.faits=Math.max(0,SESSION.faits-1);
  if(d.interesse)SESSION.interesses=Math.max(0,SESSION.interesses-1);
  SESSION.fiche=Object.assign({},d.fiche,d.avant);
  ecranSession();
}

/* ══ La session de recrutement de partenaires ══════════════════════
   Même mécanique que la session d’appels, mais sur les fiches de
   l’écran Affiliation : on n’appelle pas un client, on appelle
   quelqu’un qui refuse des demandes et qui l’ignore. Ce qui est
   recueilli pendant l’appel remplit sa fiche partenaire — la
   commission discutée au téléphone est celle qui partira au contrat. */
var RESULTATS_PART=[
  {id:'interesse',    lab:'Intéressé',     touche:'1', aide:'passe en discussion, contrat à envoyer'},
  {id:'rappeler',     lab:'Rappeler',      touche:'2', aide:'date ET heure du rappel'},
  {id:'absent',       lab:'Absent',        touche:'3',
   aide:'sort de la file ; « Rappeler » si vous voulez le revoir'},
  {id:'pas_interesse',lab:'Pas intéressé', touche:'4', aide:'sort de la file'},
  {id:'faux_numero',  lab:'Faux numéro',   touche:'5', aide:'retire le numéro de la fiche'}
];

/* ══ L'engrenage à partenaires ══════════════════════════════════════
   Recruter un partenaire est le seul appel dont l'effet ne s'arrête
   pas quand on raccroche. Encore faut-il avoir qui appeler.

   L'engrenage va chercher les bonnes entreprises dans le registre
   public de l'État, filtrées par métier et par département. C'est
   gratuit et ouvert. Ce que le registre ne donne pas, c'est le
   téléphone : l'INSEE ne le collecte pas. On le complète ensuite chez
   Google, qui le publie légalement contre paiement, et seulement pour
   les fiches que le commercial garde. Aspirer Pages Jaunes ou Maps
   serait interdit, et déjà sanctionné en justice. */

var PRIX_NUMERO = 0.035;   /* dollars par numéro trouvé chez Google */

/* La recherche de numéros tourne pendant que le commercial appelle.
   Elle vit dans l'onglet : tant qu'il reste ouvert, elle avance, même
   la fenêtre de l'engrenage fermée. Encore faut-il le savoir, sinon on
   rafraîchit par réflexe et on croit avoir tout perdu. D'où ce bandeau
   qui suit partout, et l'avertissement avant de fermer. */
var MOTEUR_TOURNE=false;

function bandeauMoteur(texte,fini){
  var b=document.getElementById('bandeau-moteur');
  if(!b){
    b=document.createElement('div');
    b.id='bandeau-moteur';
    b.style.cssText='position:fixed;right:18px;bottom:18px;z-index:9000;'
      +'background:var(--surface,#fff);border:1px solid var(--filet,#e2e5e9);'
      +'border-radius:11px;box-shadow:0 6px 26px rgba(16,22,28,.14);'
      +'padding:12px 15px;max-width:330px;font-size:13px;line-height:1.5;'
      +'display:flex;gap:10px;align-items:flex-start';
    document.body.appendChild(b);
  }
  b.innerHTML='<span id="bm-point" style="flex:none;width:9px;height:9px;border-radius:50%;'
    +'margin-top:5px;background:'+(fini?'var(--ok,#1f9d55)':'var(--signal,#2563eb)')+';'
    +(fini?'':'animation:bmPulse 1.1s ease-in-out infinite')+'"></span>'
    +'<span style="flex:1">'+texte+'</span>'
    +'<button id="bm-x" title="Masquer" style="flex:none;border:0;background:none;'
    +'cursor:pointer;font-size:16px;line-height:1;color:var(--faible,#8a9099);'
    +'padding:0 0 0 4px">&times;</button>';
  document.getElementById('bm-x').onclick=function(){ b.remove(); };
  if(!document.getElementById('bm-css')){
    var st=document.createElement('style');
    st.id='bm-css';
    st.textContent='@keyframes bmPulse{0%,100%{opacity:1}50%{opacity:.25}}';
    document.head.appendChild(st);
  }
  if(fini) setTimeout(function(){ var e=document.getElementById('bandeau-moteur');
    if(e&&e===b)e.remove(); },25000);
}
function finBandeau(texte){ MOTEUR_TOURNE=false; bandeauMoteur(texte,true); }

/* Un rafraîchissement en pleine recherche fait perdre le travail en
   cours, pas celui déjà enregistré. Le navigateur ne montre qu'un
   message générique, mais il montre quelque chose, et ça suffit à
   arrêter le geste. */
window.addEventListener('beforeunload',function(e){
  if(!MOTEUR_TOURNE)return;
  e.preventDefault(); e.returnValue='';
});

async function engrenageAppel(corps){
  var r=await appelle(URL_BASE+'/functions/v1/prospection',
    {method:'POST',headers:entetes(),body:JSON.stringify(corps||{})});
  var j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok||(j&&j.erreur))
    throw new Error((j&&j.erreur)||('Le moteur a répondu '+r.status+'.'));
  return j;
}

async function sansNumero(activite){

/* Le registre ne donne pas les numéros, et Google les fait payer.
   Entre les deux, il reste la façon la plus bête et la plus immédiate :
   le commercial cherche, il colle. Vingt fiches en cinq minutes, zéro
   euro, et il découvre l'entreprise au passage — ce qu'aucune API ne
   lui apprend. */
async function ecranNumerosMain(activite,apres){
  var l=await sansNumero(activite);
  var f=document.createElement('div');
  f.className='fond-modale';
  f.innerHTML='<div class="modale" style="width:min(780px,100%)">'
    +'<header><div><h3>Les numéros, à la main</h3>'
      +'<div class="sec" style="margin-top:2px">'+nb(l.length)+' fiche'+(l.length>1?'s':'')
      +' en attente. Cherchez, collez, passez à la suivante.</div></div>'
      +'<button class="fermer" data-x>&times;</button></header>'
    +'<div class="corps">'
    +(l.length?l.map(function(x){
        var q=encodeURIComponent((x.nom||'')+' '+(x.ville||'')+' téléphone');
        return '<div class="rangee" data-l="'+x.id+'">'
          +'<div style="flex:1;min-width:0"><b>'+ech(x.nom)+'</b>'
          +'<div class="sec">'+ech(x.ville||'')+'</div></div>'
          +'<div style="display:flex;gap:7px;align-items:center">'
          +'<a class="btn mini" target="_blank" rel="noopener" '
          +'href="https://www.google.com/search?q='+q+'">Chercher</a>'
          +'<input data-tel="'+x.id+'" placeholder="04 …" '
          +'style="width:150px;font-family:\'JetBrains Mono\',monospace">'
          +'</div></div>';
      }).join('')
     :vide('Aucune fiche en attente','Toutes les fiches de cette maison ont déjà un numéro.'))
    +'</div>'
    +'<footer><span class="sec" id="n-etat">Le numéro s’enregistre dès que vous quittez la case.</span>'
    +'<button class="btn fort" data-x>Terminé</button></footer></div>';
  document.body.appendChild(f);

  $('#e-num',f).onclick=async function(){

/* Deux fiches de la même entreprise ne doivent pas se travailler deux
   fois. Elles n'ont pourtant presque jamais le même libellé : le
   registre écrit « SYMBOL CARS MOBILITY », un fournisseur « Symbol
   Cars Mobility SAS », un autre « Symbol Cars ». On rapproche donc sur
   un nom débarrassé de sa forme juridique et de sa ponctuation, et sur
   les neuf derniers chiffres du numéro, qui ne mentent pas. */
var FORMES=/\b(sas|sasu|sarl|eurl|sa|snc|scop|sci|scm|selarl|selas|gie|association|asso|groupe|holding|france|sarlu|ei|eirl)\b/g;
function cleSociete(nom){
  return String(nom||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,' ')
    .replace(FORMES,' ')
    .replace(/\s+/g,'').trim();
}
function cleTel(t){
  var d=String(t||'').replace(/[^0-9]/g,'');
  return d.length>=9?d.slice(-9):'';
}

/* ══ Les chauds ════════════════════════════════════════════════════
   Appeler un nom tiré du registre, c'est deux pour cent d'appels
   utiles. Appeler quelqu'un qui vient d'ouvrir trois fois votre mail,
   c'est un autre métier : il connaît déjà votre nom, et vous avez une
   raison d'appeler. Le fichier ne sert plus à faire du volume, il sert
   à trier — et ce qui trie, ce sont les signaux. */
function nomInterlocuteur(x){
  var c=String(x&&x.contact||'').split('—')[0].trim();
  return /[a-zA-ZÀ-ÿ]{2,}/.test(c)?c:'';
}
function posteInterlocuteur(x){
  var p=String(x&&x.contact||'').split('—').slice(1).join(' — ').trim();
  return p;
}
function chaleurFiche(x){
  var ouv=+x.ouvertures||0;
  /* Une réponse passe avant tout : elle a demandé qu'on la rappelle.
     Un clic dit l'intérêt, pas la demande. */
  return (x.campagne_repondu_id?200:0)
    + ((+x.clics||0)>0?60:0)
    + (ouv>=3?45:ouv===2?35:ouv===1?25:0)
    + ((x.source==='Pharow'&&nomInterlocuteur(x))?15:0)
    + ((String(x.email_origine||'')==='direction'||String(x.email_origine||'')==='personne')?5:0);
}
/* Pourquoi cette fiche est dans la file. On ne fait pas confiance à un
   commercial pour deviner : on l'écrit en haut de l'écran d'appel. */
function raisonChaleur(x){
  var l=[];
  if(x.campagne_repondu_id)l.push('a répondu à la campagne');
  if((+x.clics||0)>0)l.push('a cliqué sur le lien'+(x.clique_le?' le '+date(x.clique_le):''));
  var ouv=+x.ouvertures||0;
  if(ouv>1)l.push('a ouvert le mail '+ouv+' fois'+(x.ouvert_le?', la dernière le '+date(x.ouvert_le):''));
  else if(ouv===1)l.push('a ouvert le mail'+(x.ouvert_le?' le '+date(x.ouvert_le):''));
  if(x.source==='Pharow'&&nomInterlocuteur(x))l.push('contact de direction identifié');
  return l;
}
/* ══ Client ou apporteur d’affaires ════════════════════════════════
   La file des chauds mélange les deux : une fiche qui a ouvert le mail
   « recruter des clients » n’attend pas qu’on lui propose une
   commission, et l’inverse est vrai aussi. On devine donc d’où vient
   la fiche, et le commercial peut corriger d’un clic si on s’est
   trompé. */
var CAMPS_LEGERES=null;
async function campagnesLegeres(){
  if(CAMPS_LEGERES)return CAMPS_LEGERES;
  try{
    CAMPS_LEGERES=await lire('ls_campagnes','select=id,nom,modele,cible&limit=60');
  }catch(e){ CAMPS_LEGERES=[]; }
  return CAMPS_LEGERES;
}
function styleFiche(p,camps){
  var e=String(p&&p.campagne_etiquette||'').trim();
  var t=String(p&&p.type||'').trim();
  for(var i=0;i<(camps||[]).length;i++){
    var c=camps[i], m=String(c.modele||'');
    if(!m)continue;
    var types=((c.cible||{}).types)||[];
    var touche=(p.campagne_repondu_id&&p.campagne_repondu_id===c.id)
      || (e&&(e===c.nom||types.indexOf(e)>-1||e.indexOf(c.nom)>-1))
      || (t&&types.indexOf(t)>-1);
    if(touche)return /_clients$/.test(m)?'client':'partenaire';
  }
  return '';
}
async function fileChauds(n){
  var l=[];
  try{
    l=await lire('ls_prescripteurs','select=*'
      +'&or=(clics.gt.0,ouvertures.gt.0,campagne_repondu_id.not.is.null,source.eq.Pharow)'
      +'&limit=600'+filtreMaison());
  }catch(e){
    /* Les colonnes de signaux n'existent pas encore : on retombe sur ce
       qu'on sait déjà, les fiches nominatives d'un fournisseur. */
    try{ l=await lire('ls_prescripteurs','select=*&source=eq.Pharow&limit=600'+filtreMaison()); }
    catch(e2){ return []; }
  }
  return triFichier(l,n,true);
}
async function filePartenaires(n){
  var l=[];
  try{ l=await lire('ls_prescripteurs','select=*&order=cree_le.asc&limit=600'+filtreMaison()); }catch(e){ return []; }
  return triFichier(l,n,false);

/* Le tri commun aux deux files : les morts sortent, les jumelles
   sortent, le repos se respecte, et l'ordre va du plus chaud au plus
   froid. */
function triFichier(l,n,chaud){
  var t=new Date().toISOString();
  var repos=new Date(); repos.setMonth(repos.getMonth()-REPOS_MOIS);
  var repIso=repos.toISOString();
  /* Premier passage : qui a déjà dit non, et sous quels noms. Un refus
     vaut pour l'entreprise, pas pour la ligne du fichier. Sans cela on
     rappelle la même société trois fois parce qu'elle existe en trois
     exemplaires, et c'est le meilleur moyen de se faire raccrocher au
     nez. */
  var morts={}, mortsTel={};
  l.forEach(function(x){
    var fini=['Signé','Abandonné'].indexOf(x.statut)>-1
      || x.appel_resultat==='pas_interesse' || x.appel_resultat==='faux_numero';
    if(!fini)return;
    var c=cleSociete(x.nom), d=cleTel(x.tel);
    if(c)morts[c]=true;
    if(d)mortsTel[d]=true;
  });
  var vus={}, tels={};
  var pret=l.filter(function(x){
    if(!x.tel)return false;
    if(['Signé','Abandonné'].indexOf(x.statut)>-1)return false;
    var cle=cleSociete(x.nom), d=cleTel(x.tel);
    if(cle&&morts[cle])return false;          /* une jumelle a déjà dit non */
    if(d&&mortsTel[d])return false;
    if(cle){ if(vus[cle])return false; vus[cle]=true; }
    if(d){ if(tels[d])return false; tels[d]=true; }
    if(x.rappel_le)return x.rappel_le<=t;      /* une promesse revient toujours */
    if(x.appel_resultat)return false;
    return !x.vu_le || x.vu_le < repIso;       /* le repos de six mois */
  });
  /* L'ordre de passage, du plus chaud au plus froid. Une réponse à une
     campagne d'abord : laissée refroidir, elle ne vaut plus rien.
     Ensuite les fiches dont un fournisseur a payé l'adresse et le nom
     du dirigeant : on sait à qui demander, et elles ont coûté de
     l'argent. Le reste du fichier après. */
  if(chaud) pret=pret.filter(function(x){ return chaleurFiche(x)>0; });
  pret.sort(function(a,b){ return chaleurFiche(b)-chaleurFiche(a); });
  return pret.slice(0,n||1);
}

  clearInterval(MINUTEUR);

  var sp=$('#sauter-p'); if(sp)sp.onclick=function(){ SESSION.fiche=null; ecranAppelPartenaire(); };
  var ap=$('#annuler-p'); if(ap)ap.onclick=async function(){

  };

  OUV=String(mod||'').split(/\n\s*\n/).map(function(x){return x.trim();}).filter(Boolean);
  /* Changer de pitch en cours d’appel : l’ouverture, l’argumentaire et
     les questions basculent ensemble. Ce qui est déjà noté reste. */
  var selPitch=$('#pitch');
  if(selPitch)selPitch.onchange=function(){
    STYLE=selPitch.value; SESSION.style=STYLE;
    /* L’invitation partenaire n’a de sens que dans un appel
       partenaire : elle suit le pitch. */
    var binv=$('[data-invp]'); if(binv)binv.hidden=(STYLE!=='partenaire');
    OUV=String(accrocheDuStyle()||'').split(/\n\s*\n/)
      .map(function(x){return x.trim();}).filter(Boolean);
    POS=0; peindre();
  };
  function construire(){
    /* L'ordre est le nerf de cet appel. Une phrase d'ouverture de dix
       mots, la question « êtes-vous la bonne personne », et seulement
       ensuite l'argumentaire. Dérouler le pitch au standard, c'est le
       gaspiller : il ne le répétera pas. */
    ETAPES=[{dire:ouvertureCourte(p,STYLE)}];
    var qs=(STYLE==='client')
      ? questionsClient(REP,p.activite)
      : questionsPartenaire(REP,p.activite);
    qs.forEach(function(x){ if(x.q.id==='pt_qui')
      ETAPES.push({dire:x.q.q,q:x.q,s:x.s}); });
    if(BONNE(REP)) OUV.forEach(function(t){ ETAPES.push({dire:t}); });
    qs.forEach(function(x){
      if(x.q.id==='pt_qui')return;
      /* Une étape « dire » n'attend aucune réponse : c'est une phrase
         à prononcer, pas un champ à remplir. */
      if(x.q.type==='dire') ETAPES.push({dire:remplir(x.q.q,{expediteur:MON_NOM||''}),s:x.s});
      else ETAPES.push({dire:x.q.q,q:x.q,s:x.s});

  function lireRep(){

    if(el){ var v=String(el.value).trim(); if(v!=='')REP[e.q.id]=v; else delete REP[e.q.id]; }
  }

  function enregistrer(){

      if(REP.pt_contact)maj.contact=REP.pt_contact;
      if(REP.pt_email)maj.email=REP.pt_email;
      /* Ce que le standard a lâché vaut de l'or : la prochaine fois, on
         ne repasse pas par lui. La ligne directe remplace donc le
         numéro de la fiche, et l'ancien part dans la note. */
      if(REP.pt_bon_nom&&!REP.pt_contact)maj.contact=REP.pt_bon_nom;
      if(REP.pt_bon_mail&&!REP.pt_email)maj.email=REP.pt_bon_mail;
      if(REP.pt_bon_tel&&String(REP.pt_bon_tel).replace(/\D/g,'').length>=9){
        var direct=String(REP.pt_bon_tel).trim();
        if(direct!==(p.tel||'')){
          maj.tel=direct;
          maj.note=((p.note?p.note+'\n':'')
            +'Standard : '+(p.tel||'—')
            +(REP.pt_bon_nom?' · ligne directe de '+REP.pt_bon_nom:'')
            +(REP.pt_bon_quand?' · joignable '+REP.pt_bon_quand:'')).slice(0,900);
        }

      if(REP.pt_volume)maj.volume_estime=+REP.pt_volume||0;
      if(REP.pt_taux&&!isNaN(parseFloat(REP.pt_taux)))maj.commission_taux=parseFloat(REP.pt_taux);
      if(REP.pt_remuneration==='Pourcentage du montant signé')maj.commission_type='pourcentage';
      if(REP.pt_remuneration==='Montant fixe par contact transmis')maj.commission_type='fixe_lead';
      if(REP.pt_remuneration==='Montant fixe par affaire signée')maj.commission_type='fixe_signe';
      modifier('ls_prescripteurs','id=eq.'+p.id,maj).catch(function(){});
    },600);
  }
  function peindre(){
    var z=$('#conduite'); if(!z)return;
    try{ construire(); }catch(e){
      z.innerHTML='<div class="erreur">Le script a buté : '+ech(String(e.message||e))+'</div>';
      return;

    if(POS>=ETAPES.length)POS=ETAPES.length-1;

    var faits=ETAPES.filter(function(x){ return x.q&&REP[x.q.id]!==undefined&&REP[x.q.id]!==''; }).length;
    /* Ce qu'on dit, en grand. Ce qu'on fait si ça se passe autrement,
       en petit dessous : la consigne ne doit pas se lire au téléphone. */
    var parts=String(e.dire||'').split(/\n\s*\n/);

      +(e.q&&e.q.a?'<p class="sec" style="margin:9px 0 0;line-height:1.55">'+ech(e.q.a)+'</p>':'')
      +(e.q?blocPrecision(e.q):'')
      +(v.alertes.length&&e.q?'<div class="q-alerte">'+ech(v.alertes[v.alertes.length-1])+'</div>':'')
      +'<div class="etape-barre">'
        +'<button class="btn mini" id="et-prec"'+(POS===0?' disabled':'')+'>Précédent</button>'
        +'<span class="sec mono">'+(POS+1)+' / '+ETAPES.length
          +' · '+faits+' réponse'+(faits>1?'s':'')+' notée'+(faits>1?'s':'')+'</span>'
        +'<span style="display:flex;gap:7px">'
        +(e.q?'<button class="btn mini" id="et-passer">Passer</button>':'')
        +'<button class="btn mini fort" id="et-suiv">'
          +(POS>=ETAPES.length-1?'Terminer':'Suivant')+'</button></span>'
      +'</div>';
    brancherPrecision(z);
    var ep=$('#et-prec',z); if(ep)ep.onclick=function(){ lireRep(); if(POS>0)POS--; peindre(); };
    var pa=$('#et-passer',z); if(pa)pa.onclick=function(){ POS++; peindre(); };
    var es=$('#et-suiv',z);
    if(es)es.onclick=function(){
      lireRep(); enregistrer();
      /* Une réponse peut ouvrir des questions qui n'existaient pas
         encore : « oui, c'est moi » fait apparaître tout le reste de la
         conduite. Si le script vient de s'allonger, on continue au lieu
         de s'arrêter sur « Enregistré ». */
      var avant=ETAPES.length;
      try{ construire(); }catch(e){}
      if(POS>=ETAPES.length-1 && ETAPES.length<=avant){ es.textContent='Enregistré'; return; }
      POS++; peindre();
    };
    var ch=$('.cond-rep select,.cond-rep input,.cond-rep textarea',z);
    if(ch){
      ch.focus();

      };

  /* Les boutons de résultat et d'invitation se branchent AVANT de
     dessiner la conduite. Si une étape du script plante, le commercial
     doit quand même pouvoir noter son appel et passer au suivant : un
     script cassé ne doit jamais bloquer un appel. */
  var bf=$('[data-fp]'); if(bf)bf.onclick=function(){ ecranPartenaire(p); };
  /* Pas eu la bonne personne, ou pas le temps : on laisse une trace
     qui donne envie de rappeler, avec l'adresse tapée à chaud. */
  var bmp=$('[data-mailp]'); if(bmp)bmp.onclick=function(){ mailPartenaire(p,null); };
  /* Le moment où il dit oui est le seul où il est disponible. Lui

  var bi=$('[data-invp]');
  if(bi)bi.onclick=async function(){

  $$('[data-rp]').forEach(function(b){ b.onclick=function(){ noterPartenaire(b.dataset.rp,REP); }; });

  try{ construire(); POS=0; peindre(); }
  catch(e){
    var zc=$('#conduite');
    if(zc)zc.innerHTML='<div class="erreur">Le script n’a pas pu s’afficher : '
      +ech(String(e.message||e))+'. Les boutons de résultat fonctionnent quand même.</div>';
  }
}

async function noterPartenaire(res,REP){
  var p=SESSION&&SESSION.fiche; if(!p)return;
  SESSION.fiche=null; SESSION.faits++;
  /* De quoi revenir en arrière sur une touche mal visée. */
  if(SESSION)SESSION.dernierP={id:p.id,nom:p.nom,fiche:p,interesse:(res==='interesse'),
    lab:(RESULTATS_PART.filter(function(x){return x.id===res;})[0]||{}).lab||res,
    avant:{appel_resultat:p.appel_resultat||null,statut:p.statut||'A contacter',
           rappel_le:p.rappel_le||null,tel:p.tel||'',dernier_appel:p.dernier_appel||null}};
  var maj={appel_resultat:res,dernier_appel:new Date().toISOString(),qualif:REP||p.qualif||{}};
  if(res==='absent'){ maj.rappel_le=null; }   /* pas de rappel automatique */
  if(res==='pas_interesse'){ maj.statut='Abandonné'; maj.rappel_le=null; }
  if(res==='faux_numero'){ maj.tel=''; maj.rappel_le=null; }
  /* Si l'écriture échoue, la fiche revient à l'écran et le commercial
     le sait. Un refus de la base qui ressemble à un succès, c'est un
     appel perdu que personne ne refera. */
  function rate(e){
    if(SESSION){ SESSION.fiche=p; SESSION.faits=Math.max(0,SESSION.faits-1); }
    alerteCopiable('Résultat d’appel non enregistré',
      'Le résultat n’a pas pu être écrit : '+String(e.message||e).slice(0,300)
      +'\n\nNotez la société et le résultat, et vérifiez votre connexion avant de continuer.');
    ecranAppelPartenaire();
  }
  try{
    await tracer('partenaire.appel',p.nom+' — '+res,p.id);
    if(res==='rappeler'){
      /* Le rappel s'écrit AVANT d'ouvrir la fenêtre, à J+2 9 h. Fermer
         la fenêtre sans valider ne perd donc rien : elle ne sert qu'à
         préciser la date, l'heure et le mot à se dire. */
      var defaut=new Date(Date.now()+2*864e5); defaut.setHours(9,0,0,0);
      await modifier('ls_prescripteurs','id=eq.'+p.id,
        Object.assign({},maj,{rappel_le:null}));   /* la date vient de la fenêtre, jamais d'office */
      var loc=new Date(defaut.getTime()-defaut.getTimezoneOffset()*60000).toISOString().slice(0,16);
      formulaire('Quand le rappeler ?',[
        {id:'quand',nom:'Date et heure du rappel',type:'datetime-local',requis:true,valeur:loc},
        {id:'quoi',nom:'À lui dire',large:true,valeur:'',ph:'il en parle à son associé jeudi'}
      ],async function(v){
        await modifier('ls_prescripteurs','id=eq.'+p.id,{
          rappel_le:new Date(v.quand).toISOString(),
          note:v.quoi||p.note||''});
        ecranAppelPartenaire();
      },null,null,function(){ ecranAppelPartenaire(); });
      return;
    }
    if(res==='interesse'){
      if(SESSION)SESSION.interesses++;
      maj.statut='En discussion'; maj.rappel_le=null;
      await modifier('ls_prescripteurs','id=eq.'+p.id,maj);
      /* Ce qui a été dit au téléphone devient le contrat : la fiche
         s’ouvre pré-remplie, on ne retape rien. */
      var r=REP||{};
      formulaire('Intéressé — ce qu’on lui envoie',[
        {id:'contact',nom:'Interlocuteur',large:true,valeur:r.pt_contact||p.contact||''},
        {id:'email',nom:'Son e-mail',type:'email',valeur:r.pt_email||p.email||'',
          aide:'sans ça, rien ne part'},
        {id:'commission_type',nom:'Rémunération convenue',type:'select',
          valeur:(r.pt_remuneration==='Montant fixe par contact transmis'?'fixe_lead'
                 :r.pt_remuneration==='Montant fixe par affaire signée'?'fixe_signe':'pourcentage'),
          options:[{v:'pourcentage',l:'Pourcentage du montant HT signé'},
                   {v:'fixe_lead',l:'Montant fixe par contact transmis'},
                   {v:'fixe_signe',l:'Montant fixe par affaire signée'}]},
        {id:'commission_taux',nom:'Taux ou montant',type:'number',
          valeur:(r.pt_taux&&!isNaN(parseFloat(r.pt_taux)))?parseFloat(r.pt_taux):(p.commission_taux||10)},
        {id:'contrat_statut',nom:'Contrat',type:'select',valeur:'aucun',
          options:[{v:'aucun',l:'À rédiger'},{v:'envoye',l:'Envoyé aujourd’hui'}]},
        {id:'commission_note',nom:'Conditions particulières',type:'textarea',large:true,
          valeur:r.pt_suite||''},
        {id:'envoi',nom:'Lui envoyer le récapitulatif tout de suite',type:'check',valeur:true,
          aide:'part dans les cinq minutes, pendant qu’il a encore l’appel en tête'},
        {id:'invit',nom:'Et son accès à l’espace partenaire',type:'check',valeur:false,
          aide:'à cocher seulement si la commission est arrêtée : le lien mène au contrat à signer'}
      ],async function(v){
        var maj2={contact:v.contact,email:v.email||null,commission_type:v.commission_type,
          commission_taux:+v.commission_taux||0,contrat_statut:v.contrat_statut,
          contrat_le:v.contrat_statut==='envoye'?aujourdhui():null,
          commission_note:v.commission_note};
        await modifier('ls_prescripteurs','id=eq.'+p.id,maj2);
        await tracer('partenaire.interesse',p.nom,p.id);
        var maj3=Object.assign({},p,maj2,{id:p.id});
        /* Le récapitulatif part tout seul : c'est le moment où il a
           encore la conversation en tête, pas trois jours plus tard
           quand le commercial y repense. */
        if(v.envoi&&v.email){
          try{
            var m=await modeleParNom('Partenariat — après l’appel');
            if(m) await envoyer({dest:v.email,
              objet:remplir(m.objet||'Notre partenariat',{societe:p.nom,dirigeant:v.contact}),
              corps:remplir(m.corps,{societe:p.nom,dirigeant:v.contact,activite:p.activite}),
              partenaire_id:p.id,societe:p.nom,activite:p.activite});
          }catch(e){}
        }
        if(v.invit&&v.email){ await monNom(); inviterPartenaire(maj3,function(){ ecranAppelPartenaire(); }); return; }
        ecranAppelPartenaire();
      },null,null,function(){ ecranAppelPartenaire(); });
      return;
    }
    await modifier('ls_prescripteurs','id=eq.'+p.id,maj);
    /* Un refus vaut pour l'entreprise, pas pour la ligne du fichier.
       On abandonne aussi ses jumelles, sinon la campagne continue de
       leur écrire et la file les rappelle sous un autre nom. */
    if(res==='pas_interesse'||res==='faux_numero'){
      try{ var j=await abandonnerJumelles(p,res);
           if(j)await tracer('partenaire.jumelles',p.nom+' · '+j+' doublon'+(j>1?'s':'')+' écarté'+(j>1?'s':''),p.id);
      }catch(e){}
    }
  }catch(e){ rate(e); return; }
  ecranAppelPartenaire();
}

/* Les autres fiches de la même entreprise, reconnues à leur numéro :
   c'est la seule clé qui ne se réécrit pas d'une source à l'autre. Le
   nom, lui, change de forme juridique et d'orthographe. */
async function abandonnerJumelles(p,res){
  var d=cleTel(p.tel);
  if(!d)return 0;
  var q='tel=like.*'+d+'*&id=neq.'+p.id
    +'&statut=not.in.("Signé","Abandonné")'
    +(p.activite?'&activite=eq.'+encodeURIComponent(p.activite):'');
  var r=await appelle(URL_BASE+'/rest/v1/ls_prescripteurs?'+q,{method:'PATCH',
    headers:entetes({'Prefer':'return=representation'}),
    body:JSON.stringify({statut:'Abandonné',appel_resultat:res,rappel_le:null})});
  if(!r.ok)return 0;
  return ((await r.json())||[]).length;
}

/* ══ Le rappel posé à la main ══════════════════════════════════════
   La session d'appels pose les rappels toute seule, mais la vie ne se
   passe pas toujours dans la session : on croise quelqu'un, on raccroche
   d'un appel entrant, on relit une fiche le soir. La même fenêtre sert
   partout, et elle écrit exactement ce que la file d'appels lit :
   la date, et la phrase qu'on se dira en rappelant. */
function poserRappel(p,apres){
  var partenaire=!!(p&&p.nom&&!p.societe);
  var table=partenaire?'ls_prescripteurs':'ls_prospects';
  var nom=p.societe||p.nom||'ce compte';
  var d=p.rappel_le?new Date(p.rappel_le):new Date(Date.now()+2*864e5);
  if(!p.rappel_le)d.setHours(9,0,0,0);
  var loc=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  formulaire('Rappeler '+nom,[
    {id:'quand',nom:'Date et heure du rappel',type:'datetime-local',requis:true,valeur:loc,
      aide:'la fiche remonte en tête de file à cette heure-là'},
    {id:'quoi',nom:'À lui dire',large:true,valeur:p.prochaine||'',
      ph:'il en parle à son associé jeudi'}
  ],async function(v){
    var maj={rappel_le:new Date(v.quand).toISOString()};
    if(v.quoi)maj.prochaine=v.quoi;
    await modifier(table,'id=eq.'+p.id,maj);
    await tracer('rappel.pose',nom+' — '+date(maj.rappel_le),p.id);
    if(apres)apres();
  },
  p.rappel_le?async function(){
    await modifier(table,'id=eq.'+p.id,{rappel_le:null});
    await tracer('rappel.efface',nom,p.id);
    if(apres)apres();
  }:null,
  p.rappel_le?'Effacer le rappel':null,
  function(){ if(apres)apres(); });
}

/* ══ Campagnes ═════════════════════════════════════════════════════
   Une campagne, c'est trois mails, une audience, un jeu de boîtes et
   un rythme. Elle n'a pas son propre moteur : elle dépose ses
   messages dans la file commune, échelonnés, et le moteur fait le
   reste, avec ses propres garde-fous : la fenêtre du lundi au
   vendredi, le plafond de chaque boîte, le rythme par passage.

   La délivrabilité se joue avant le lancement : une boîte en chauffe,
   un lien dans le premier mail, un pied sans ligne de désabonnement,
   et le bouton Lancer reste gris, avec la raison écrite en clair. */

function modeleDe(c){ return (c&&c.modele&&MODELES[c.modele])||null; }

/* Les adresses de standard : contact@, info@, accueil@ et leurs
   cousines. Un mail qui arrive là est lu par personne, ou par la
   mauvaise personne. Écartées par défaut. */
var GENERIQUES=['contact','info','infos','accueil','standard','bonjour','hello','secretariat',
  'administration','compta','comptabilite','rh','commercial','communication','marketing','support',
  'noreply','no-reply','nepasrepondre','ne-pas-repondre','postmaster','webmaster','admin','office',
  'courrier','mail','reception','sav','service','services','facturation','recrutement','candidature'];
function estGenerique(m){
  var loc=String(m||'').toLowerCase().split('@')[0].trim();
  return GENERIQUES.indexOf(loc)>-1;
}

/* ══ L’habillage d’un mail de campagne ═════════════════════════════
   Trois niveaux, du plus discret au plus habillé, et le choix n’est
   pas cosmétique : il décide de l’onglet dans lequel le message
   atterrit.

   sobre   — du texte, rien d’autre. Ce qu’écrit quelqu’un depuis son
             clavier. C’est ce qui passe le mieux quand personne ne
             vous connaît encore.
   maison  — le même texte, avec une signature d’entreprise en règle :
             le nom de la maison, la fonction, le numéro cliquable, le
             filet vert, les preuves et l’adresse en pied. Aucune
             image, aucun bandeau, aucune carte. C’est un mail
             professionnel, pas une newsletter, et c’est le réglage
             par défaut d’une campagne.
   charte  — l’habillage complet des mails transactionnels : bandeau
             sombre, nom en capitales espacées, carte arrondie. Sur un
             devis attendu, c’est parfait. Sur un premier message à un
             inconnu, Gmail y voit une publicité et le range dans
             Promotions, où il ne sera pas lu.

   Le moteur produit exactement la même chose pour les mails 2 et 3 :
   un contact ne doit pas recevoir deux mises en page différentes. */
function paragraphesSimples(corps){
  return String(corps||'').split(/\n{2,}/).map(function(p){
    return '<p style="margin:0 0 14px">'+ech(p).replace(/\n/g,'<br>')+'</p>'; }).join('');
}
function mailSobre(corps,pied){
  return '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"></head>'
    +'<body style="margin:0;padding:18px 16px;background:#ffffff">'
    +'<div style="max-width:620px;font-family:\'Segoe UI\',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;'
    +'font-size:15px;line-height:1.6;color:#1a1a1a">'+paragraphesSimples(corps)
    +(pied?'<p style="margin:22px 0 0;font-size:12px;color:#6b7280">'+ech(pied)+'</p>':'')
    +'</div></body></html>';
}
/* La signature maison : ce qu’un commercial a au bas de ses mails
   depuis toujours. Le filet vert donne la couleur de la maison sans
   qu’aucune image ne soit chargée. */
function mailMaison(corps,sig,activite,pied){
  var c=charteDe(activite);
  /* Segoe UI d’abord, comme sur les mails de devis : c’est la police
     de la maison, elle ne se télécharge pas, et sur Mac la pile
     descend sur San Francisco sans que personne ne le remarque. */
  var pol="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif";
  var tel=sig&&sig.tel?String(sig.tel).replace(/[^0-9+]/g,'').replace(/^0/,'+33'):'';
  return '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">'
    +'<meta name="viewport" content="width=device-width,initial-scale=1"></head>'
    +'<body style="margin:0;padding:20px 16px;background:#ffffff">'
    +'<div style="max-width:620px;font-family:'+pol+';font-size:15px;line-height:1.6;color:#1a1a1a">'
    +paragraphesSimples(corps)
    +'<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:22px">'
      +'<tr><td style="border-top:2px solid '+c.vert+';padding-top:12px;font-family:'+pol+'">'
      +(sig&&sig.nom?'<div style="font-size:14px;font-weight:700;color:'+c.nuit+'">'+ech(sig.nom)+'</div>':'')
      +'<div style="font-size:12.5px;color:'+c.gris+';margin-top:2px">'
        +(sig&&sig.fonction?ech(sig.fonction)+', ':'')
        +'<span style="color:'+c.nuit+';font-weight:600">'+ech(c.nom)+'</span></div>'
      +(c.baseline?'<div style="font-size:11.5px;color:'+c.gris+';margin-top:1px">'+ech(c.baseline)+'</div>':'')
      +(tel?'<div style="font-size:12.5px;margin-top:6px"><a href="tel:'+ech(tel)+'" '
        +'style="color:'+c.vert+';font-weight:600;text-decoration:none">'+ech(sig.tel)+'</a></div>':'')
      +'</td></tr></table>'
    +'<div style="margin-top:16px;border-top:1px solid '+c.filet+';padding-top:10px;'
      +'font-size:11px;line-height:1.7;color:'+c.gris+'">'
      +[c.adresse,c.site].filter(Boolean).map(ech).join('&nbsp;&nbsp;·&nbsp;&nbsp;')
      +(c.preuves?'<br>'+ech(c.preuves):'')
      +(pied?'<br>'+ech(pied):'')
    +'</div></div></body></html>';
}
function mailCampagne(corps,sig,activite,habillage,pied){
  if(habillage==='charte')
    return mailHabille(String(corps||''),{activite:activite},sig,activite,pied);
  if(habillage==='sobre')
    return mailSobre(String(corps||'')+(sig&&sig.texte?'\n\n'+sig.texte:''),pied);
  return mailMaison(corps,sig,activite,pied);
}
/* La signature d’une campagne, en texte : le nom, la fonction et la
   maison, le téléphone en clair. Pas de lien, pas d’image. */
function signatureTexte(sig,activite){
  var c=charteDe(activite);
  var l=[];
  if(sig&&sig.nom)l.push(sig.nom);
  l.push((sig&&sig.fonction?sig.fonction+', ':'')+c.nom);
  if(sig&&sig.tel)l.push(sig.tel);
  if(c.site)l.push(c.site);
  return l.join('\n');
}
function texteBrutMail(corps,signature,pied){
  return String(corps||'').trim()+(signature?'\n\n'+signature:'')+(pied?'\n\n'+pied:'');
}
function boiteLib(b){
  if(!b)return '';
  return b.etat==='prete'?'Prête, '+b.plafond+' par jour'
    :'En chauffe, jour '+((+b.jours||0)+1)+' sur 14, '+b.plafond+' par jour';
}

async function ficheBoite(b){
