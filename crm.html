                  +'<button class="btn" data-annuler>Arrêter</button>':''))
      +'<button class="btn" data-supprimer title="Supprimer la campagne">Supprimer</button>'
      +'</span></footer></div>';
    f.innerHTML=h;
    brancher();
    if(vue==='suivi'&&!sequences){
      lire('ls_sequences','select=*&campagne_id=eq.'+c.id+'&order=statut.asc,cree_le.asc&limit=400')
        .then(function(l){ sequences=l; if(vue==='suivi')peindre(); })
        .catch(function(){ sequences=[]; if(vue==='suivi')peindre(); });
    }
  }
  function localDT(d){
    var x=new Date(d); return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,16);
  }
  function memoriser(){
    var o=$('#c-obj',f), t=$('#c-corps',f), d=$('#c-debut',f);
    if(vue==='m1'||vue==='m2'||vue==='m3'){
      var n=+vue.slice(1);
      if(o&&!o.disabled){ if(n===1)c.objet=o.value; else c['objet'+n]=o.value; }
      if(t&&!t.disabled){ if(n===1)c.corps=t.value; else c['corps'+n]=t.value; }
    }
    if(d&&d.value)c.debut_le=new Date(d.value).toISOString();
  }
  async function sauver(){
    memoriser();
    var corps={objet2:c.objet2||'',corps2:c.corps2||'',objet3:c.objet3||'',corps3:c.corps3||'',maj_le:new Date().toISOString()};
    if(brouillon){ corps.objet=c.objet||''; corps.corps=c.corps||''; corps.debut_le=c.debut_le||null; }
    await modifier('ls_campagnes','id=eq.'+c.id,corps);
  }
  function brancher(){
    var ferme=function(){ f.remove(); VUES.campagnes(); };
    $$('[data-x]',f).forEach(function(x){ x.onclick=ferme; });
    $$('[data-vue]',f).forEach(function(x){ x.onclick=function(){ memoriser(); vue=x.dataset.vue; peindre(); }; });
    $$('[data-apercu]',f).forEach(function(x){ x.onclick=function(){ apercuN=+x.dataset.apercu; peindre(); }; });
    var bm=$('[data-modif]',f); if(bm)bm.onclick=async function(){ await sauver(); f.remove(); ficheCampagne(c); };
    var bs=$('[data-sauver]',f); if(bs)bs.onclick=async function(){
      var bt=this, lib=bt.textContent; bt.disabled=true; bt.textContent='…';
      try{ await sauver(); bt.textContent='Enregistré'; }catch(e){ alerteCopiable('Impossible',String(e.message||e)); }
      setTimeout(function(){ bt.disabled=false; bt.textContent=lib; peindre(); },900);
    };
    var btst=$('[data-test]',f); if(btst)btst.onclick=async function(){
      memoriser();
      var n=(vue==='m2'||vue==='m3')?+vue.slice(1):(vue==='apercu'?apercuN:1);
      var m=mailN(n);
      if(!(m.objet||'').trim()||!(m.corps||'').trim()){ alerteCopiable('Message vide','Écrivez l’objet et le texte du mail '+n+' avant le test.'); return; }
      var bx=boitesChoisies[0];
      if(!bx){ alerteCopiable('Pas de boîte','Cochez au moins une boîte d’envoi dans Audience et réglages : le test part de là.'); return; }
      var dest=mf.repondre_a||moi;
      var bt=this; bt.disabled=true; bt.textContent='Envoi…';
      try{
        var corps=corpsTexte(remplir(m.corps,exemple));
        await ecrire('ls_envois',{canal:'email',destinataire:dest,objet:'[TEST mail '+n+'] '+remplir(m.objet,exemple),
          corps:corps,corps_html:mailCampagne(remplir(m.corps,exemple),sigMail,c.activite,hab,rg.pied_email||''),
          societe:'Test campagne',activite:c.activite,
          expediteur_nom:bx.nom_expediteur||'',expediteur_email:bx.adresse_envoi||bx.adresse,repondre_a:bx.adresse,
          pieces:[],prioritaire:true,declenche_par:moi||'',owner_email:moi||'',a_envoyer_le:new Date().toISOString()});
        modifier('ls_campagnes','id=eq.'+c.id,{test_envoye_le:new Date().toISOString()}).catch(function(){});
        c.test_envoye_le=new Date().toISOString();
        bt.textContent='Test parti';
        alerteCopiable('Test déposé','Le mail '+n+' part vers '+dest+' depuis '+(bx.adresse_envoi||bx.adresse)+' dans les minutes qui viennent. Regardez aussi les indésirables.');
      }catch(e){ alerteCopiable('Impossible',String(e.message||e)); }
      setTimeout(function(){ bt.disabled=false; bt.textContent='M’envoyer un test'; },1500);
    };
    var bl=$('[data-lancer]',f); if(bl)bl.onclick=async function(){
      /* Lancer ne fabrique plus rien ici. On enregistre les textes, on
         bascule le statut, et c'est le moteur qui fait entrer les
         contacts et qui envoie, toutes les cinq minutes, navigateur
         ouvert ou fermé. Une audience qui grossit après le lancement
         entre toute seule : plus besoin de relancer quoi que ce soit. */
      memoriser();
      var v=verifierCampagne(c,boites,rg,audience);
      if(v.bloquants.length){ vue='verif'; peindre(); return; }
      if(!c.test_envoye_le&&!confirm('Vous n’avez pas encore reçu de test. Lancer quand même ?'))return;
      if(v.alertes.length&&!confirm('La vérification signale '+v.alertes.length+' point'
        +(v.alertes.length>1?'s':'')+' à regarder. Lancer quand même ?'))return;
      var bt=this; bt.disabled=true; bt.textContent='Lancement…';
      try{
        await sauver();
        await modifier('ls_campagnes','id=eq.'+c.id,{statut:'programmee',signature:signature,
          debut_le:c.debut_le||new Date().toISOString(),lance_le:new Date().toISOString(),
          maj_le:new Date().toISOString()});
        await tracer('campagne.lancee',c.nom,c.id);
        alerteCopiable('Campagne lancée',
          'Le moteur passe toutes les cinq minutes. Il fait entrer les contacts qui passent le filtre, dans la '
          +'limite de ce que vos boîtes peuvent envoyer dans la journée, et les mails partent du lundi au '
          +'vendredi, de 8 h 30 à 12 h et de 14 h à 18 h.\n\n'
          +'Les mails 2 et 3 suivront à '+jourN(2)+' et '+jourN(3)+' pour ceux qui n’ont pas répondu. '
          +'Une réponse sort le contact de la séquence et remonte sa fiche en tête de file d’appel.\n\n'
          +'Vous n’avez plus rien à faire : ce qui arrivera au fichier ensuite entrera tout seul.');
        f.remove(); VUES.campagnes();
      }catch(e){
        bt.disabled=false; bt.textContent='Lancer';
        alerteCopiable('Lancement impossible',String(e.message||e).slice(0,300));
      }
    };
    var brp=$('[data-remplir]',f); if(brp)brp.onclick=function(){
      if(!((cible.nafs||[]).length)){
        alerteCopiable('Aucun métier à chercher',
          'Ouvrez « Audience et réglages », cochez les métiers voulus, et enregistrez : la recherche part toute seule.');
        return;
      }
      f.remove(); VUES.campagnes(); remplirAudience(c);
    };
    var bp=$('[data-pause]',f); if(bp)bp.onclick=async function(){
      try{ await modifier('ls_campagnes','id=eq.'+c.id,{statut:'en_pause',maj_le:new Date().toISOString()}); await tracer('campagne.pause',c.nom,c.id); }
      catch(e){ alerteCopiable('Impossible',String(e.message||e)); return; }
      alerteCopiable('Campagne en pause','Plus rien ne part, ni mail 1 ni suites, jusqu’à « Reprendre ». Les délais des séquences continuent de courir : à la reprise, les mails 2 et 3 dus partent dans l’ordre.');
      f.remove(); VUES.campagnes();
    };
    var br=$('[data-reprendre]',f); if(br)br.onclick=async function(){
      try{ await modifier('ls_campagnes','id=eq.'+c.id,{statut:'en_cours',maj_le:new Date().toISOString()}); await tracer('campagne.reprise',c.nom,c.id); }
      catch(e){ alerteCopiable('Impossible',String(e.message||e)); return; }
      f.remove(); VUES.campagnes();
    };
    var bsup=$('[data-supprimer]',f); if(bsup)bsup.onclick=async function(){
      if(!confirm('Supprimer la campagne « '+c.nom+' » ?'+(brouillon?'':' Ce qui attend est annulé, les séquences s’arrêtent. Les mails déjà partis restent partis.')+'\n\nCette action ne se rattrape pas.'))return;
      try{
        if(brouillon) await supprimer('ls_campagnes','id=eq.'+c.id);
        else await rpc('ls_campagne_supprimer',{p_id:c.id});
        await tracer('campagne.supprimee',c.nom);
      }catch(e){ alerteCopiable('Impossible',String(e.message||e)); return; }
      f.remove(); VUES.campagnes();
    };
    var ba=$('[data-annuler]',f); if(ba)ba.onclick=async function(){
      if(!confirm('Arrêter la campagne ? Les mails déjà partis le restent, ceux en attente sont annulés, et plus aucun mail 2 ou 3 ne partira.'))return;
      try{ var n=await rpc('ls_campagne_annuler',{p_id:c.id}); await tracer('campagne.arretee',c.nom+' · '+n,c.id); }
      catch(e){ alerteCopiable('Impossible',String(e.message||e)); return; }
      f.remove(); VUES.campagnes();
    };
    $$('[data-sortie]',f).forEach(function(x){
      x.onclick=async function(){
        var lib={mail:'a répondu par mail',appel:'nous a appelés',stop:'a demandé à ne plus recevoir de mail'}[x.dataset.sortie];
        if(x.dataset.sortie==='stop'&&!confirm('Le contact ne recevra plus jamais de campagne. Confirmer ?'))return;
        x.disabled=true;
        try{
          await rpc('ls_sequence_sortie',{p_id:x.dataset.seq,p_sortie:x.dataset.sortie});
          await tracer('campagne.sortie',lib,c.id);
          sequences=null;
          try{ var bb2=await rpc('ls_campagne_bilan',{p_id:c.id}); b=(bb2&&bb2[0])||b; }catch(e){}
          peindre();
        }catch(e){ x.disabled=false; alerteCopiable('Impossible',String(e.message||e)); }
      };
    });
  }
  document.body.appendChild(f);
  peindre();
}

/* ══ Le chantier d'une campagne ════════════════════════════════════
   Deux travaux tournent en parallèle et n'ont rien à voir : d'un côté
   on ramasse des adresses dans le registre et sur les sites, de
   l'autre le moteur envoie ce qui est déjà prêt. Les montrer sur une
   seule ligne, c'était laisser croire que l'un attendait l'autre.

   Deux barres, donc, et un chiffre au milieu : combien de contacts
   sont entrés dans la campagne. C'est lui qui fait le lien entre les
   deux, et c'est le seul qui compte. */
var CHANTIER=null;
function chantierOuvrir(nom){
  var b=document.getElementById('chantier');
  if(!b){
    b=document.createElement('div');
    b.id='chantier';
    document.body.appendChild(b);
  }
  if(!document.getElementById('ch-css')){
    var st=document.createElement('style');
    st.id='ch-css';
    st.textContent='#chantier{position:fixed;right:18px;bottom:18px;z-index:9000;width:min(360px,calc(100vw - 36px));'
      +'background:var(--surface,#fff);border:1px solid var(--filet,#e2e5e9);border-radius:13px;'
      +'box-shadow:0 8px 30px rgba(16,22,28,.16);padding:14px 16px;font-size:13px;line-height:1.5}'
      +'#chantier h4{margin:0 0 2px;font-size:13.5px;font-weight:600}'
      +'#chantier .ch-x{position:absolute;top:10px;right:12px;border:0;background:none;cursor:pointer;'
      +'font-size:17px;line-height:1;color:var(--faible,#8a9099)}'
      +'.ch-bloc{margin-top:12px}'
      +'.ch-tete{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}'
      +'.ch-tete b{font-size:12.5px;font-weight:600}'
      +'.ch-tete span{font-size:11.5px;color:var(--faible,#8a9099);font-variant-numeric:tabular-nums}'
      +'.ch-rail{height:6px;border-radius:99px;background:var(--filet,#e6e9ed);overflow:hidden}'
      +'.ch-jauge{height:100%;border-radius:99px;transition:width .4s ease;width:0}'
      +'.ch-jauge.cherche{background:var(--signal,#2563eb)}'
      +'.ch-jauge.envoie{background:var(--ok,#1f9d55)}'
      +'.ch-jauge.pulse{background-image:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);'
      +'background-size:180px 100%;animation:chGlisse 1.2s linear infinite}'
      +'.ch-note{margin-top:4px;font-size:11.5px;color:var(--faible,#8a9099)}'
      +'.ch-pivot{margin-top:13px;padding-top:11px;border-top:1px solid var(--filet,#e6e9ed);'
      +'display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px}'
      +'.ch-pivot b{font-size:16px;font-weight:600}'
      +'@keyframes chGlisse{0%{background-position:-180px 0}100%{background-position:340px 0}}';
    document.head.appendChild(st);
  }
  CHANTIER={nom:nom,
    cherche:{fait:0,total:0,texte:'En attente',fini:false},
    envoie:{fait:0,total:0,texte:'En attente',fini:false},
    entres:0, adresses:0};
  chantierPeindre();
  return CHANTIER;
}
function chantierPeindre(){
  var b=document.getElementById('chantier'), c=CHANTIER;
  if(!b||!c)return;
  function barre(cle,titre,classe){
    var d=c[cle];
    var pct=d.total>0?Math.min(100,Math.round(d.fait/d.total*100)):(d.fini?100:0);
    /* Sans total connu, une barre pleine à moitié qui scintille dit
       mieux « ça travaille » qu'une barre vide qui dit « rien ne se
       passe ». */
    var large=d.total>0?pct:(d.fini?100:45);
    return '<div class="ch-bloc"><div class="ch-tete"><b>'+ech(titre)+'</b>'
      +'<span>'+(d.total>0?nb(d.fait)+' / '+nb(d.total):(d.fini?'terminé':''))+'</span></div>'
      +'<div class="ch-rail"><div class="ch-jauge '+classe+(d.fini||d.total>0?'':' pulse')
      +'" style="width:'+large+'%"></div></div>'
      +'<div class="ch-note">'+ech(d.texte)+'</div></div>';
  }
  b.innerHTML='<button class="ch-x" title="Masquer">&times;</button>'
    +'<h4>'+ech(c.nom)+'</h4>'
    +'<div class="ch-note">la recherche et l’envoi avancent en même temps</div>'
    +barre('cherche','Recherche des contacts','cherche')
    +barre('envoie','Envoi de la séquence','envoie')
    +'<div class="ch-pivot"><span>Entrés dans la campagne</span><b>'+nb(c.entres)+'</b></div>';
  b.querySelector('.ch-x').onclick=function(){ b.remove(); };
}
function chantierMaj(cle,o){
  if(!CHANTIER)return;
  for(var k in o)CHANTIER[cle][k]=o[k];
  chantierPeindre();
}
function chantierFin(){
  MOTEUR_TOURNE=false;
  if(!CHANTIER)return;
  CHANTIER.cherche.fini=true;
  chantierPeindre();
  var b=document.getElementById('chantier');
  setTimeout(function(){ var e=document.getElementById('chantier');
    if(e&&e===b)e.remove(); },30000);
}

/* ══ Remplir l'audience, puis la verser dans la campagne ═══════════
   Le commercial coche des métiers et enregistre. Tout le reste se
   fait sans lui : le registre est interrogé pour chaque métier et
   chaque département, les sites sont lus pour en tirer les adresses,
   et les contacts trouvés entrent dans la séquence de la campagne si
   elle tourne déjà. Pendant ce temps le moteur envoie ce qui est
   prêt, dans la limite du plafond du jour de chaque boîte : les deux
   ne s'attendent pas.

   Rien n'est envoyé plus vite pour autant. La chauffe et le rythme
   sont dans le moteur, pas ici : cette fonction ne fait que fournir
   la matière. */
async function remplirAudience(c){
  var cible=c.cible||{}, act=c.activite;
  var nafs=(cible.nafs||[]).filter(function(x){ return x&&x.naf; });
  if(!nafs.length)return;
  var deps=String(cible.departements||'').split(/[\s,;]+/).filter(Boolean);
  if(!deps.length)deps=[''];      /* pas de département : la France entière, métier par métier */
  if(MOTEUR_TOURNE){
    alerteCopiable('Une recherche tourne déjà',
      'Laissez-la finir avant d’en lancer une autre : deux recherches en même temps se ralentissent l’une l’autre.');
    return;
  }
  MOTEUR_TOURNE=true;
  var crees=0, mails=0, souci='', verses=0;
  chantierOuvrir(c.nom);
  chantierMaj('cherche',{total:nafs.length*deps.length,fait:0,
    texte:nb(nafs.length)+' métier'+(nafs.length>1?'s':'')+', '+nb(deps.length)
      +' département'+(deps.length>1?'s':'')});
  chantierMaj('envoie',{texte:'la campagne n’est pas encore lancée'});

  /* L'envoi se suit tout seul, en interrogeant la campagne toutes les
     vingt secondes. Il n'attend pas la fin de la recherche : dès que
     des contacts sont entrés, le moteur les traite. */
  var suivi=setInterval(async function(){
    try{
      var b=(await rpc('ls_campagne_bilan',{p_id:c.id}))||[];
      b=b[0]||{};
      var tot=+b.contacts||0, faits=+b.envoyes1||0;
      var etat=(await lire('ls_campagnes','select=statut&id=eq.'+c.id+'&limit=1'))[0]||{};
      chantierMaj('envoie',{total:tot,fait:faits,
        texte:etat.statut==='brouillon'?'la campagne n’est pas encore lancée'
             :etat.statut==='en_pause'?'campagne en pause'
             :tot?nb(faits)+' premiers mails partis sur '+nb(tot)+' contacts'
                 :'en attente de contacts'});
      if(CHANTIER)CHANTIER.entres=tot;
      chantierPeindre();
    }catch(e){}
  },20000);

  /* Verser au fil de l'eau plutôt qu'à la fin : une campagne lancée
     doit se remplir pendant qu'elle tourne, sinon les premiers
     contacts partent seuls et les autres attendent des heures. */
  async function verser(){
    try{
      var frais=(await lire('ls_campagnes','select=*&id=eq.'+c.id+'&limit=1'))[0];
      if(!frais)return;
      if(frais.statut!=='programmee'&&frais.statut!=='en_cours')return;
      var n=await verserDansCampagne(frais);
      if(n){ verses+=n; if(CHANTIER){ CHANTIER.entres+=n; chantierPeindre(); } }
    }catch(e){ if(!souci)souci=String(e.message||e); }
  }

  try{
    var faits=0;
    for(var i=0;i<nafs.length;i++){
      for(var j=0;j<deps.length;j++){
        var dep=deps[j]?String(deps[j]).padStart(2,'0'):'';
        /* Le registre en donne bien plus qu'une invocation ne peut en
           avaler : on redemande tant qu'il annonce une page suivante.
           S'arrêter à la première tranche, c'est croire qu'un métier ne
           compte que deux cents entreprises dans un département. */
        var page=1, tours=0;
        while(page&&tours<60){
          tours++;
          chantierMaj('cherche',{fait:faits,
            texte:nafs[i].nom+(dep?', dép. '+dep:'')+' — le registre'
              +(tours>1?', tranche '+tours:'')+' · '+nb(crees)+' fiches'});
          try{
            var g=await engrenageAppel({action:'chercher',activite:act,naf:nafs[i].naf,
              metier:nafs[i].nom,departement:dep,source:'registre',page:page,par:moi||''});
            crees+=g.crees||0;
            page=g.page_suivante||0;
          }catch(e){ if(!souci)souci=String(e.message||e); page=0; }
        }
        faits++;
        chantierMaj('cherche',{fait:faits});
      }
    }
    /* Les adresses : on lit les sites connus, puis on devine les
       domaines à partir des noms. C'est la partie longue, et c'est
       elle qui fait la valeur du fichier. Le total n'est connu qu'au
       premier passage, quand la fonction dit combien il reste. */
    var reste0=0;
    for(var a=0;a<600;a++){
      var k=await engrenageAppel({action:'tel_depuis_site',activite:act,viser:'email',limite:120});
      mails+=k.mails||0;
      if(!reste0)reste0=(k.restants||0)+(k.traites||0);
      chantierMaj('cherche',{total:reste0||0,fait:Math.max(0,reste0-(k.restants||0)),
        texte:'lecture des sites connus · '+nb(mails)+' adresses trouvées'});
      if(a%3===2) await verser();
      if(!k.traites||!k.restants) break;
    }
    var reste1=0;
    for(var b2=0;b2<600;b2++){
      var d=await engrenageAppel({action:'tel_par_domaine',activite:act,viser:'email',limite:100});
      mails+=d.mails||0;
      if(!reste1)reste1=(d.restants||0)+(d.traites||0);
      chantierMaj('cherche',{total:reste1||0,fait:Math.max(0,reste1-(d.restants||0)),
        texte:'on retrouve les sites à partir des noms · '+nb(mails)+' adresses'});
      if(b2%3===2) await verser();
      if(!d.traites||!d.restants) break;
    }
  }catch(e){ souci=String(e.message||e); }

  await verser();
  clearInterval(suivi);
  chantierMaj('cherche',{fini:true,
    texte:souci?String(souci).slice(0,110)
      :nb(crees)+' fiches ajoutées, '+nb(mails)+' adresses trouvées'});
  chantierFin();
  await tracer('campagne.audience',c.nom+' · '+crees+' fiches, '+mails+' adresses, '+verses+' entrés');
  try{ if(courante==='campagnes')VUES.campagnes(); }catch(e){}
}

/* Verser dans une campagne qui tourne les contacts de son audience
   qui n'y sont pas encore. Une adresse déjà en séquence n'est jamais
   reprise : la contrainte d'unicité de la base le garantit, et on
   filtre avant pour ne pas fabriquer des lignes pour rien. */
async function verserDansCampagne(c){
  var cible=c.cible||{};
  var l=await listerCible(cible,c.activite);
  if(!l.length)return 0;
  var deja={};
  try{ (await lire('ls_sequences','select=email&campagne_id=eq.'+c.id+'&limit=5000'))
        .forEach(function(x){ deja[String(x.email).toLowerCase().trim()]=true; }); }catch(e){}
  var neufs=l.filter(function(x){ return !deja[String(x.email).toLowerCase().trim()]; });
  if(!neufs.length)return 0;

  var boites=[];
  /* Une boîte en chauffe envoie, simplement moins : c'est le plafond
     du jour qui protège la réputation, pas l'interdiction de partir.
     Exiger « prête » ici revenait à ne jamais rien verser pendant les
     quatorze premiers jours d'une boîte neuve. */
  try{ boites=(await rpc('ls_boites_bilan')||[]).filter(function(b){
        return (c.boites||[]).indexOf(b.id)>-1 && b.actif; }); }catch(e){}
  if(!boites.length)return 0;

  await monNom();
  var mf={}; try{ mf=await maFiche(); }catch(e){}
  var sig={nom:(mf.nom||MON_NOM||''),fonction:mf.fonction||'',tel:mf.tel||''};
  var signature=c.signature||signatureTexte(sig,c.activite);
  var sigMail=Object.assign({},sig,{texte:signature});
  var hab=c.habillage||'maison';
  var rg={}; try{ (await lire('ls_reglages','select=cle,valeur&limit=60')).forEach(function(x){ rg[x.cle]=x.valeur; }); }catch(e){}

  /* Le plan reprend là où la campagne en est : on part de maintenant,
     et les plafonds du jour déjà consommés sont dans le bilan des
     boîtes. Le moteur revérifiera de toute façon avant chaque envoi. */
  var plan=planifier(neufs.length,new Date().toISOString(),boites,c.espacement_min||90,c.espacement_max||400);
  var seqs=neufs.map(function(x,i){
    return {campagne_id:c.id,email:String(x.email).toLowerCase().trim(),
      prospect_id:(cible.qui==='partenaires')?null:x.id,
      partenaire_id:(cible.qui==='partenaires')?x.id:null,
      boite_id:plan[i]?plan[i].boite.id:null,
      societe:x.societe||x.nom||'',dirigeant:x.dirigeant||x.contact||'',ville:x.ville||'',activite:c.activite};
  });
  var ids={};
  for(var i=0;i<seqs.length;i+=100){
    var r=await appelle(URL_BASE+'/rest/v1/ls_sequences',{method:'POST',
      headers:entetes({'Prefer':'return=representation,resolution=ignore-duplicates'}),
      body:JSON.stringify(seqs.slice(i,i+100))});
    if(!r.ok)throw new Error(await r.text());
    ((await r.json())||[]).forEach(function(s){ ids[s.email]=s; });
  }
  var lignes=[];
  neufs.forEach(function(x,i){
    var s=ids[String(x.email).toLowerCase().trim()]; if(!s||!plan[i])return;
    var bx=plan[i].boite;
    var d={societe:x.societe||x.nom||'',dirigeant:x.dirigeant||x.contact||'',ville:x.ville||'',
           activite:c.activite,expediteur:bx.nom_expediteur||''};
    var corps=remplir(c.corps,d).trim()+(hab==='sobre'&&signature?'\n\n'+signature:'');
    lignes.push({canal:'email',destinataire:s.email,objet:remplir(c.objet,d),corps:corps,
      corps_html:mailCampagne(remplir(c.corps,d),sigMail,c.activite,hab,rg.pied_email||''),
      prospect_id:s.prospect_id||null,partenaire_id:s.partenaire_id||null,
      societe:d.societe,activite:c.activite,
      expediteur_nom:bx.nom_expediteur||'',expediteur_email:bx.adresse_envoi||bx.adresse,repondre_a:bx.adresse,
      pieces:[],prioritaire:false,declenche_par:moi||'',owner_email:moi||'',
      campagne_id:c.id,boite_id:bx.id,sequence_id:s.id,etape_seq:1,a_envoyer_le:plan[i].quand,
      cle:'seq:'+s.id+':1'});
  });
  var poses=0;
  for(var k=0;k<lignes.length;k+=100){
    var r2=await appelle(URL_BASE+'/rest/v1/ls_envois',{method:'POST',
      headers:entetes({'Prefer':'return=representation,resolution=ignore-duplicates'}),
      body:JSON.stringify(lignes.slice(k,k+100))});
    if(!r2.ok)throw new Error(await r2.text());
    poses+=((await r2.json())||[]).length;
  }
  if(poses) await tracer('campagne.rallonge',c.nom+' · '+poses,c.id);
  return poses;
}

/* ══ L'engrenage à adresses ════════════════════════════════════════
   Le même principe que l'engrenage à partenaires, mais l'objectif est
   inverse : ici on cherche des adresses e-mail, pas des numéros. Une
   fiche sans numéro mais avec une adresse est parfaitement utile à une
   campagne ; l'engrenage des appels l'écartait. Métier précis, un ou
   plusieurs départements, et on lit les sites jusqu'à trouver l'adresse
   la plus proche de la direction. */
async function engrenageMails(opts){
  opts=opts||{};
  var maison=opts.activite||(MAISON==='les_deux'?'bornistes':MAISON);
  var cibles=[];
  try{ cibles=await lire('ls_cibles','select=*&order=activite.asc,nom.asc'); }catch(e){}

  var f=document.createElement('div');
  f.className='fond-modale';
  f.dataset.echap='non';
  function options(m){
    return cibles.filter(function(c){ return c.activite===m; }).map(function(c){
      return '<option value="'+ech(c.naf)+'">'+ech(c.nom)+' — '+ech(c.naf)+'</option>';
    }).join('')+'<option value="_autre">Un autre métier (code NAF)</option>';
  }
  f.innerHTML='<div class="modale" style="width:min(700px,100%)">'
    +'<header><div><h3>Chercher des adresses</h3>'
      +'<div class="sec" style="margin-top:2px">Un métier, des départements, et les adresses '
      +'lues sur les sites des entreprises</div></div>'
      +'<button class="fermer" data-x>&times;</button></header>'
    +'<div class="corps">'
      +'<div class="grille2">'
      +'<div class="champ" hidden><label for="g-maison">Maison</label><select id="g-maison">'
        +'<option value="bornistes" selected>ONIQ</option></select></div>'
      +'<div class="champ"><label for="g-dep">Départements</label>'
        +'<input id="g-dep" value="'+ech(opts.departements||'69')+'" placeholder="69, 01, 38">'
        +'<div class="aide">séparés par des virgules. Ils sont traités l’un après l’autre</div></div>'
      +'<div class="champ large"><label for="g-naf">Métier</label><select id="g-naf">'+options(maison)+'</select>'
        +'<div class="sec" id="g-pourquoi" style="margin-top:8px;line-height:1.6"></div></div>'
      +'<div class="champ large" id="g-libre" style="display:none"><label for="g-naf2">Code NAF et libellé</label>'
        +'<div style="display:flex;gap:8px"><input id="g-naf2" placeholder="4321A" style="width:120px">'
        +'<input id="g-lib" placeholder="Électriciens du bâtiment"></div>'
        +'<div class="aide">le code NAF de l’INSEE, à cinq caractères. Le libellé sert d’étiquette sur les fiches, '
        +'c’est lui que vous cocherez ensuite dans l’audience</div></div>'
      +'</div>'
      +'<div id="g-etat" style="margin-top:8px"></div>'
    +'</div>'
    +'<footer><button class="btn" data-x>Fermer</button>'
    +'<span style="display:flex;gap:7px">'
    +'<button class="btn" id="g-compl">Compléter les adresses manquantes</button>'
    +'<button class="btn fort" id="g-go">Lancer la recherche</button>'
    +'</span></footer></div>';
  document.body.appendChild(f);
  var ferme=function(){ f.remove(); if(opts.apres)opts.apres(); };
  $$('[data-x]',f).forEach(function(b){ b.onclick=ferme; });

  var et=$('#g-etat',f);
  function cibleChoisie(){
    var m=$('#g-maison',f).value, n=$('#g-naf',f).value;
    return cibles.filter(function(x){ return x.activite===m&&x.naf===n; })[0]||null;
  }
  function pourquoi(){
    var c=cibleChoisie();
    var libre=$('#g-naf',f).value==='_autre';
    $('#g-libre',f).style.display=libre?'':'none';
    $('#g-pourquoi',f).textContent=c?c.pourquoi:'';
  }
  $('#g-maison',f).onchange=function(){ $('#g-naf',f).innerHTML=options(this.value); pourquoi(); };
  $('#g-naf',f).onchange=pourquoi;
  pourquoi();
  if(opts.metier){
    var pre=cibles.filter(function(x){ return x.activite===maison&&x.nom===opts.metier; })[0];
    if(pre){ $('#g-naf',f).value=pre.naf; pourquoi(); }
  }

  async function comptes(m){
    var o={fiches:0,mails:0};
    try{ o.fiches=await compter('ls_prescripteurs','activite=eq.'+encodeURIComponent(m)); }catch(e){}
    try{ o.mails=await compter('ls_prescripteurs','activite=eq.'+encodeURIComponent(m)+'&email=neq.&email=not.is.null'); }catch(e){}
    return o;
  }

  /* Lire les sites jusqu'à épuisement, en visant l'adresse. Deux
     passes : les fiches qui portent déjà un site, puis celles dont on
     devine le domaine à partir du nom. */
  async function ramasserMails(m,dire){
    var mails=0;
    for(var a=0;a<600;a++){
      var k=await engrenageAppel({action:'tel_depuis_site',activite:m,viser:'email',limite:120});
      mails+=k.mails||0; dire(mails,k.restants||0,'on lit les sites connus');
      if(!k.traites||!k.restants) break;
    }
    for(var b2=0;b2<600;b2++){
      var d=await engrenageAppel({action:'tel_par_domaine',activite:m,viser:'email',limite:100});
      mails+=d.mails||0; dire(mails,d.restants||0,'on retrouve les sites à partir des noms');
      if(!d.traites||!d.restants) break;
    }
    return mails;
  }

  $('#g-go',f).onclick=async function(){
    var b=this, m=$('#g-maison',f).value;
    var c=cibleChoisie(), libre=$('#g-naf',f).value==='_autre';
    var naf=libre?String($('#g-naf2',f).value||'').trim().toUpperCase():$('#g-naf',f).value;
    var lib=libre?String($('#g-lib',f).value||'').trim():(c?c.nom:'');
    if(libre&&!/^[0-9]{4}[A-Z]$/.test(naf)){
      et.innerHTML='<div class="erreur">Le code NAF s’écrit avec quatre chiffres et une lettre, par exemple 4321A.</div>'; return; }
    if(libre&&!lib){
      et.innerHTML='<div class="erreur">Donnez un libellé : c’est l’étiquette que vous cocherez dans l’audience.</div>'; return; }
    var deps=String($('#g-dep',f).value||'').split(/[\s,;]+/).filter(Boolean);
    if(!deps.length){ et.innerHTML='<div class="erreur">Indiquez au moins un département.</div>'; return; }

    var av=await comptes(m);
    b.disabled=true; b.textContent='Recherche…';
    MOTEUR_TOURNE=true;
    bandeauMoteur('<b>Recherche d’adresses en cours</b><br>Vous pouvez fermer cette fenêtre. '
      +'Ne rafraîchissez pas la page.');
    var t0=Date.now(), crees=0, trouves=0, mails=0, souci='';
    function dire(txt){
      var sec=Math.round((Date.now()-t0)/1000), min=Math.floor(sec/60);
      et.innerHTML='<div class="bandeau-compte ok">'+txt
        +'<div class="sec" style="margin-top:4px">Depuis '
        +(min?min+' min '+(sec%60)+' s':sec+' seconde'+(sec>1?'s':''))+'.</div></div>';
    }
    try{
      for(var i=0;i<deps.length;i++){
        var dep=deps[i].padStart(2,'0');
        dire('<b>Département '+ech(dep)+', le registre officiel</b>');
        try{
          var g=await engrenageAppel({action:'chercher',activite:m,naf:naf,metier:lib,
            departement:dep,source:'registre',par:moi||''});
          crees+=g.crees||0; trouves+=g.trouves||0;
        }catch(e){ if(!souci)souci=String(e.message||e); }
        if(c){
          dire('<b>Département '+ech(dep)+', la cartographie ouverte</b>'
            +'<div class="sec">'+nb(crees)+' fiches ajoutées pour l’instant.</div>');
          try{
            var j=await engrenageAppel({action:'chercher',activite:m,naf:naf,metier:lib,
              departement:dep,source:'annuaire',par:moi||''});
            crees+=j.crees||0; trouves+=j.trouves||0;
          }catch(e){ if(!souci)souci=String(e.message||e); }
        }
        bandeauMoteur('<b>'+nb(crees)+' fiches</b><br>Département '+ech(dep)+' dépouillé.');
      }
      mails=await ramasserMails(m,function(n,reste,quoi){
        dire('<b>'+nb(n)+' adresse'+(n>1?'s':'')+' trouvée'+(n>1?'s':'')+'</b>'
          +'<div class="sec">'+ech(quoi)+', '+nb(reste)+' fiches encore à vérifier.</div>');
        bandeauMoteur('<b>'+nb(n)+' adresses</b><br>'+nb(reste)+' fiches encore à vérifier.');
      });
    }catch(e){ souci=String(e.message||e); }
    b.disabled=false; b.textContent='Lancer la recherche';
    var ap=await comptes(m);
    finBandeau(souci?'<b>Recherche interrompue</b><br>'+ech(String(souci).slice(0,120))
      :'<b>Recherche terminée</b><br>'+nb(ap.mails-av.mails)+' nouvelles adresses.');
    et.innerHTML='<div class="bandeau-compte '+(ap.mails>av.mails?'ok':'vide')+'">'
      +'<b>'+nb(ap.mails-av.mails)+' nouvelle'+((ap.mails-av.mails)>1?'s':'')+' adresse'
      +((ap.mails-av.mails)>1?'s':'')+'</b>'
      +'<div class="sec" style="margin-top:4px;line-height:1.6">'
      +nb(trouves)+' établissements vus, '+nb(crees)+' fiches ajoutées. '
      +'Au total '+nb(ap.mails)+' fiches avec adresse sur '+nb(ap.fiches)+' pour '+ech(LAB[m]||m)+'. '
      +(lib?'Elles portent l’étiquette « '+ech(lib)+' » : cochez-la dans l’audience de la campagne.':'')
      +'</div>'+(souci?'<div class="erreur" style="margin-top:8px">'+ech(souci)+'</div>':'')+'</div>';
    await tracer('mails.recherche',lib+' · '+deps.join(' ')+' · '+(ap.mails-av.mails));
  };

  /* Reprendre le fichier existant sans rien chercher de neuf : toutes
     les fiches de cette maison à qui il manque encore une adresse. */
  $('#g-compl',f).onclick=async function(){
    var b=this, m=$('#g-maison',f).value;
    var av=await comptes(m);
    b.disabled=true; b.textContent='Lecture…';
    MOTEUR_TOURNE=true;
    bandeauMoteur('<b>Lecture des sites en cours</b><br>Vous pouvez fermer cette fenêtre.');
    var t0=Date.now(), souci='';
    try{
      await ramasserMails(m,function(n,reste,quoi){
        var sec=Math.round((Date.now()-t0)/1000);
        et.innerHTML='<div class="bandeau-compte ok"><b>'+nb(n)+' adresse'+(n>1?'s':'')+' trouvée'+(n>1?'s':'')+'</b>'
          +'<div class="sec" style="margin-top:4px">'+ech(quoi)+', '+nb(reste)+' fiches à vérifier. '
          +'Depuis '+sec+' s.</div></div>';
        bandeauMoteur('<b>'+nb(n)+' adresses</b><br>'+nb(reste)+' fiches encore à vérifier.');
      });
    }catch(e){ souci=String(e.message||e); }
    b.disabled=false; b.textContent='Compléter les adresses manquantes';
    var ap=await comptes(m);
    finBandeau(souci?'<b>Lecture interrompue</b><br>'+ech(String(souci).slice(0,120))
      :'<b>Lecture terminée</b><br>'+nb(ap.mails-av.mails)+' nouvelles adresses.');
    et.innerHTML='<div class="bandeau-compte '+(ap.mails>av.mails?'ok':'vide')+'">'
      +'<b>'+nb(ap.mails-av.mails)+' nouvelle'+((ap.mails-av.mails)>1?'s':'')+' adresse'+((ap.mails-av.mails)>1?'s':'')+'</b>'
      +'<div class="sec" style="margin-top:4px">Au total '+nb(ap.mails)+' fiches avec adresse sur '
      +nb(ap.fiches)+' pour '+ech(LAB[m]||m)+'.</div>'
      +(souci?'<div class="erreur" style="margin-top:8px">'+ech(souci)+'</div>':'')+'</div>';
  };
}

/* Les séquences actives d'une adresse, pour qu'une fiche sache dire
   « il a répondu » sans passer par l'onglet Campagnes. */
async function blocSequences(email,apres){
  if(!email)return '';
  var l=[]; try{ l=await rpc('ls_sequences_de',{p_email:email}); }catch(e){ return ''; }
  l=(l||[]).filter(function(s){ return s.statut==='en_cours'; });
  if(!l.length)return '';
  var s=l[0];
  return '<div class="bandeau-seq"><span>En séquence de la campagne <b>'+ech(s.campagne)+'</b>'
    +(s.etape?', mail '+s.etape+' parti':', premier mail à venir')+'</span>'
    +'<span style="display:flex;gap:6px"><button class="btn mini" data-seqx="mail" data-seqid="'+s.id+'">A répondu</button>'
    +'<button class="btn mini" data-seqx="appel" data-seqid="'+s.id+'">Nous a appelés</button>'
    +'<button class="btn mini" data-seqx="stop" data-seqid="'+s.id+'">STOP</button></span></div>';
}
function brancherSequences(racine,apres){
  $$('[data-seqx]',racine).forEach(function(x){
    x.onclick=async function(){

      x.disabled=true;
      try{ await rpc('ls_sequence_sortie',{p_id:x.dataset.seqid,p_sortie:x.dataset.seqx}); if(apres)apres(); }
      catch(e){ x.disabled=false; alerteCopiable('Impossible',String(e.message||e)); }
    };
  });
}

/* ══ Affiliation ═══════════════════════════════════════════════════
   Le parcours d'un partenaire, de l'appel au premier virement, tient
   en quatre gestes : on règle sa commission, on lui envoie son
   contrat, on lui ouvre un compte, et il voit ensuite tout seul ce
   qu'on lui doit. C'est cette dernière étape qui évite les relances
   téléphoniques du vendredi soir. */
var VOIR_PROSPECTION=false;
var CONTRAT={aucun:'Aucun contrat',envoye:'Contrat envoyé',signe:'Contrat signé',rompu:'Rompu'};
var COMTYPE={pourcentage:'% du montant HT signé',fixe_lead:'€ par lead transmis',fixe_signe:'€ par affaire signée'};

VUES.affiliation=async function(){
  outils('');
  bouton('+ Partenaire',function(){ fichePartenaire(null); },true);
  try{
    /* Le fichier de prospection compte des dizaines de milliers de
       lignes depuis que la moisson tourne. Lire les trois cents plus
       récentes, c'était ne lire que des cibles fraîches et noyer les
       vrais partenaires ; et le tri sur toute la table finissait par
       dépasser le temps imparti. On ne demande donc que les colonnes
       utiles, et on écarte les fiches de pure prospection côté base
       plutôt qu'après coup. */
    var COLS='select=id,nom,type,activite,contact,tel,email,source,statut,'
      +'commission_taux,commission_type,contrat_statut,compte_email,invite_le,leads,cree_le';
    /* Un partenaire, c'est quelqu'un qui a dit oui, ou à qui on l'a
       demandé. Pas une entreprise que la moisson a ramenée et que
       personne n'a encore appelée : celle-là est une cible, sa place
       est dans la file d'appels. On ne liste donc que ce qui a avancé,
       et on le demande à la base plutôt que de trier après coup. */
    var vraisPartenaires='&or=(compte_email.not.is.null,invite_le.not.is.null,'
      +'contrat_statut.not.in.("aucun"),statut.in.("En discussion","Signé"),leads.gt.0)';
    var res=await Promise.all([
      lire('ls_prescripteurs',COLS+'&order=cree_le.desc&limit=300'
        +(VOIR_PROSPECTION?'':vraisPartenaires)+filtreMaison()),
      lire('ls_commissions','select=*&limit=2000'),
      compter('ls_prescripteurs','statut=in.("A contacter","Abandonné")'
        +'&compte_email=is.null&invite_le=is.null&leads=eq.0'
        +'&or=(contrat_statut.is.null,contrat_statut.eq.aucun)'+filtreMaison())
        .catch(function(){ return 0; })
    ]);
    var tous=res[0], cs=res[1], enFile=res[2];
    /* L'engrenage remplit ce fichier de centaines d'entreprises qu'on
       n'a pas encore appelées. Ce sont des cibles de prospection, pas
       des partenaires : les afficher ici noierait les vrais. Une fiche
       devient un partenaire quand quelqu'un l'a fait avancer, ou
       qu'elle a un contrat ou un compte. */
    function enProspection(p){
      return !p.compte_email && !p.invite_le
        && (p.contrat_statut||'aucun')==='aucun'
        && !(+p.leads||0)
        && ['En discussion','Signé'].indexOf(p.statut||'A contacter')===-1;
    }
    var caches=VOIR_PROSPECTION?tous.filter(enProspection).length:enFile;
    var ps=VOIR_PROSPECTION?tous:tous.filter(function(p){ return !enProspection(p); });
    var parP={};
    cs.forEach(function(c){ (parP[c.partenaire_id]=parP[c.partenaire_id]||[]).push(c); });
    var somme=function(l,st){ return (l||[]).filter(function(c){return !st||c.statut===st;})
      .reduce(function(a,c){return a+(+c.montant||0);},0); };

    var duTotal=somme(cs,'validee'), payeTotal=somme(cs,'payee');
    var h='<div class="kpis">'
      +kpi('Partenaires',nb(ps.length),'','')
      +kpi('Contrats signés',nb(ps.filter(function(p){return p.contrat_statut==='signe';}).length),'vert','')
      +kpi('Comptes ouverts',nb(ps.filter(function(p){return p.compte_email;}).length),'','ils voient leurs commissions')
      +kpi('À payer',euro(duTotal),duTotal?'ambre':'','commissions validées')
      +kpi('Déjà versé',euro(payeTotal),'','')
      +'</div>';

    h+='<div class="panneau"><header><h2>Les partenaires</h2>'
      +'<span class="aide">'
      +(caches
        ? nb(caches)+' entreprise'+(caches>1?'s':'')+' démarchée'+(caches>1?'s':'')+' mais pas encore partenaire'+(caches>1?'s':'')+' '
          +(VOIR_PROSPECTION?'affichée'+(caches>1?'s':''):'masquée'+(caches>1?'s':''))
          +' · <a href="#" id="bascule-prosp">'
          +(VOIR_PROSPECTION?'ne montrer que les partenaires':'les voir')+'</a>'
        : 'un contrat signé et un compte ouvert, et le partenaire se suit tout seul')
      +'</span></header>';
    if(!ps.length){
      h+=vide(caches?'Aucun partenaire pour l’instant':'Aucun partenaire',
        (caches?'Vos '+nb(caches)+' entreprises démarchées sont dans la file d’appels, pas ici. '
               +'Une fiche arrive sur cette page le jour où elle dit oui : quand vous la passez '
               +'en « En discussion », quand vous l’invitez, ou dès qu’elle a un contrat, un '
               +'compte ou un lead apporté. ':'')
        +'Après un appel qui a bien marché, créez la fiche : commission, contrat, compte. '
        +'Le partenaire voit ensuite ses leads et ses commissions sans vous appeler.');
    }else{
      h+='<div class="tbl-scroll"><table><thead><tr><th>Partenaire</th><th>Rémunération</th>'
        +'<th>Contrat</th><th>Compte</th><th class="n">Leads</th><th class="n">À payer</th><th></th>'
        +'</tr></thead><tbody>'
        +ps.map(function(p){
          var l=parP[p.id]||[];
          return '<tr><td><b>'+ech(p.nom)+'</b><br><span class="sec">'+ech(p.type||'—')
              +' · '+ech(LAB[p.activite]||'')+'</span>'
            +(p.contact||p.tel
              ?'<br><span class="sec">'+ech(p.contact||'')
                +(p.contact&&p.tel?' · ':'')
                +(p.tel?'<a href="tel:'+ech(String(p.tel).replace(/\s/g,''))+'" class="mono">'
                   +ech(p.tel)+'</a>':'')+'</span>'
              :'')+'</td>'
            +'<td>'+ech(p.commission_taux)+(p.commission_type==='pourcentage'?' %':' €')
              +'<br><span class="sec">'+ech(COMTYPE[p.commission_type]||'')+'</span></td>'
            +'<td>'+etat(CONTRAT[p.contrat_statut]||'—',
                p.contrat_statut==='signe'?'ok':p.contrat_statut==='envoye'?'att':'neu')+'</td>'
            +'<td>'+(p.compte_email
                ?'<span class="sec mono">'+ech(p.compte_email)+'</span>'
                :'<button class="btn mini" data-inv="'+p.id+'">Inviter</button>')+'</td>'
            +'<td class="n">'+nb(p.leads)+'</td>'
            +'<td class="n">'+euro(somme(l,'validee'))+'</td>'
            +'<td class="n">'
            +(p.tel?'<button class="btn mini" data-appel="'+p.id+'">Appeler</button> ':'')
            +'<button class="btn mini" data-p="'+p.id+'">Ouvrir</button></td></tr>';
        }).join('')+'</tbody></table></div>';
    }
    h+='</div>';
    $('#vue').innerHTML=h;
    var bb=$('#bascule-prosp');
    if(bb)bb.onclick=function(e){ e.preventDefault(); VOIR_PROSPECTION=!VOIR_PROSPECTION; VUES.affiliation(); };
    $$('[data-p]').forEach(function(b){
      b.onclick=async function(){
        var r=await lire('ls_prescripteurs','select=*&id=eq.'+b.dataset.p+'&limit=1');
        if(r.length)ecranPartenaire(r[0]);
      };
    });
    /* Appeler depuis la liste : la conduite de recrutement s’ouvre sur
       cette fiche-là, et ce qui se dit au téléphone la remplit. */
    /* Inviter : le lien, le message tout prêt, et la fiche passe en
       « compte à ouvrir » jusqu'à ce qu'il ait signé. */
    $$('[data-inv]').forEach(function(b){
      b.onclick=async function(){
        var r=await lire('ls_prescripteurs','select=*&id=eq.'+b.dataset.inv+'&limit=1');
        if(r.length){ await monNom(); inviterPartenaire(r[0],function(){ VUES.affiliation(); }); }
      };
    });
    $$('[data-appel]').forEach(function(b){
      b.onclick=async function(){
        var r=await lire('ls_prescripteurs','select=*&id=eq.'+b.dataset.appel+'&limit=1');
        if(!r.length)return;
        SESSION={debut:Date.now(),faits:0,interesses:0,fiche:r[0],pile:[],mode:'partenaire'};
        location.hash='#appels';
        setTimeout(function(){ ecranAppelPartenaire(); },60);
      };
    });
  }catch(e){ $('#vue').innerHTML='<div class="erreur">'+ech(e.message)+'</div>'; }
};

/* Où revenir après une action sur un partenaire. Pendant un appel, à
   l'écran d'appel : le partenaire est au bout du fil, la liste
   attendra. Sinon, à sa fiche, relue. La liste ne reprend la main que
   si la fiche n'existe plus. */
async function retourPartenaire(p){
  if(SESSION&&SESSION.mode==='partenaire'&&SESSION.fiche){ ecranAppelPartenaire(); return; }
  if(p&&p.id){
    try{
      var r=await lire('ls_prescripteurs','select=*&id=eq.'+p.id+'&limit=1');
      if(r.length){ ecranPartenaire(r[0]); return; }
    }catch(e){}
  }
  VUES.affiliation();
}

function fichePartenaire(p){
  p=p||{};
  formulaire(p.id?'Modifier '+p.nom:'Nouveau partenaire',[
    {id:'nom',nom:'Nom',requis:true,large:true,valeur:p.nom,ph:'Nom du partenaire'},
    {id:'activite',nom:'Activité',type:'select',valeur:p.activite||(MAISON==='les_deux'?'bornistes':MAISON),
      options:[{v:'bornistes',l:'ONIQ'}]},
    {id:'type',nom:'Type',valeur:p.type,ph:'Concessionnaire, expert-comptable…'},
    {id:'statut',nom:'Statut',type:'select',valeur:p.statut||'A contacter',
      options:['A contacter','En discussion','Signé','Abandonné']},
    {id:'contact',nom:'Interlocuteur',valeur:p.contact},
    {id:'tel',nom:'Téléphone',valeur:p.tel},
    {id:'email',nom:'E-mail',type:'email',valeur:p.email,large:true},
    {id:'site',nom:'Site web',valeur:p.site,large:true,ph:'www.exemple.fr'},
    {id:'commission_type',nom:'Rémunération',type:'select',valeur:p.commission_type||'pourcentage',
      options:[{v:'pourcentage',l:'Pourcentage du montant HT signé'},
               {v:'fixe_lead',l:'Montant fixe par lead transmis'},
               {v:'fixe_signe',l:'Montant fixe par affaire signée'}]},
    {id:'commission_taux',nom:'Taux ou montant',type:'number',valeur:p.commission_taux||10,
      aide:'10 pour 10 %, ou 150 pour 150 € par affaire'},
    {id:'commission_note',nom:'Conditions particulières',type:'textarea',large:true,valeur:p.commission_note,
      aide:'plafond, exclusivité, durée — ce qui ira dans le contrat'},
    {id:'note',nom:'Notes internes',type:'textarea',large:true,valeur:p.note}
  ],async function(v){
    var corps={nom:v.nom,activite:v.activite,type:v.type,statut:v.statut,contact:v.contact,
      tel:v.tel,email:v.email,site:(v.site||'').trim(),commission_type:v.commission_type,
      commission_taux:+v.commission_taux||0,commission_note:v.commission_note,note:v.note};
    if(p.id){ await modifier('ls_prescripteurs','id=eq.'+p.id,corps); retourPartenaire(p); }
    else { await ecrire('ls_prescripteurs',corps); await tracer('partenaire.cree',v.nom); VUES.affiliation(); }
  }, p.id?async function(){ await supprimer('ls_prescripteurs','id=eq.'+p.id); VUES.affiliation(); }:null,
  null, p.id?function(){ retourPartenaire(p); }:null);
}

/* Qui on appelle, et sur quel numéro. C'est la première chose qu'un
   commercial cherche en ouvrant une fiche, et c'était justement la
   seule qui n'y figurait pas : il fallait passer par « Modifier »
   pour voir un numéro de téléphone. */
function coordonneesPartenaire(p){
  var l=[];
  function ligne(lab,val,brut){
    l.push('<div style="min-width:180px"><div style="font-family:\'JetBrains Mono\',monospace;'
      +'font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faible);'
      +'margin-bottom:3px">'+lab+'</div><div style="font-size:14.5px;line-height:1.45">'
      +(brut||ech(val))+'</div></div>');
  }
  ligne('Interlocuteur', p.contact||'— pas encore identifié —');
  ligne('Téléphone', '', p.tel
    ? '<a href="tel:'+ech(String(p.tel).replace(/\s/g,''))+'" style="font-weight:600;'
      +'font-size:16px;letter-spacing:.01em">'+ech(p.tel)+'</a>'
    : '<span class="sec">aucun numéro</span> '
      +'<button class="btn mini" data-numero style="margin-left:6px">Le chercher</button>');
  var ORIG={direction:'adresse de direction ou partenariats',personne:'adresse nominative',
            generique:'adresse générique du standard'};
  ligne('E-mail', '', p.email
    ? '<a href="mailto:'+ech(p.email)+'">'+ech(p.email)+'</a>'
      +(p.email_origine&&ORIG[p.email_origine]
        ?' <span class="sec" style="font-size:12px">· '+ORIG[p.email_origine]+'</span>':'')
    : '<span class="sec">aucune adresse</span>');
  if(p.site){
    var u=String(p.site).trim(); if(!/^https?:\/\//i.test(u))u='https://'+u;
    ligne('Site web', '', '<a href="'+ech(u)+'" target="_blank" rel="noopener">'
      +ech(u.replace(/^https?:\/\/(www\.)?/i,'').replace(/\/$/,''))+'</a>');
  }
  if(p.adresse||p.ville)
    ligne('Adresse', '', ech([p.adresse,[p.code_postal,p.ville].filter(Boolean).join(' ')]
      .filter(Boolean).join(', ')));
  ligne('Métier', (p.type||'—')+(p.effectif?' · '+p.effectif:''));
  if(p.siren)
    ligne('SIREN', '', '<span class="mono">'+ech(p.siren)+'</span>'
      +(p.naf?' <span class="sec">· NAF '+ech(p.naf)+'</span>':''));
  ligne('Où on en est', p.statut||'—');
  if(p.rappel_le) ligne('À rappeler le','',etat(date(p.rappel_le),
    new Date(p.rappel_le)<=new Date()?'ret':'neu'));

  return '<div class="rangee" style="padding-top:0"><div style="width:100%">'
    +'<div style="display:flex;flex-wrap:wrap;gap:18px 26px">'+l.join('')+'</div>'
    +(p.note?'<div style="margin-top:16px;padding:12px 14px;background:var(--surface-2);'
      +'border-radius:8px;font-size:14px;line-height:1.6;white-space:pre-wrap">'
      +ech(p.note)+'</div>':'')
    +'</div></div>';
}

async function ecranPartenaire(p){
  var cs=await lire('ls_commissions','select=*&partenaire_id=eq.'+p.id+'&order=cree_le.desc&limit=200');
  var du=cs.filter(function(c){return c.statut==='validee';}).reduce(function(a,c){return a+(+c.montant||0);},0);
  var seq=''; try{ seq=await blocSequences(p.email,null); }catch(e){}
  var f=document.createElement('div');
  f.className='fond-modale';
  f.innerHTML='<div class="modale" style="width:min(760px,100%)">'
    +'<header><div><h3>'+ech(p.nom)+'</h3>'
      +'<div class="sec" style="margin-top:2px">'+ech(p.type||'partenaire')+' · '
      +ech(LAB[p.activite]||'')+(p.ville?' · '+ech(p.ville):'')+'</div></div>'
      +'<button class="fermer" data-x>&times;</button></header>'
    +'<div class="corps">'
      +seq
      +coordonneesPartenaire(p)
      +'<div class="bilan" style="margin-bottom:18px">'
        +'<div class="b"><div class="l">Rémunération</div><div class="v">'+ech(p.commission_taux)
          +(p.commission_type==='pourcentage'?' %':' €')+'</div>'
          +'<div class="sec">'+ech(COMTYPE[p.commission_type]||'')+'</div></div>'
        +'<div class="b"><div class="l">À payer</div><div class="v">'+euro(du)+'</div>'
          +'<div class="sec">'+nb(cs.filter(function(c){return c.statut==='validee';}).length)+' commissions validées</div></div>'
        +'<div class="b"><div class="l">Contrat</div><div class="v" style="font-size:17px">'
          +ech(CONTRAT[p.contrat_statut]||'—')+'</div>'
          +'<div class="sec">'+(p.contrat_le?date(p.contrat_le):'pas encore daté')+'</div></div>'
      +'</div>'
      +'<div class="rangee"><div><b>Le contrat d’apport d’affaires</b>'
        +'<p>Généré à partir de la rémunération réglée ci-dessus. À copier dans un e-mail ou un document, '
        +'à faire signer, puis à marquer comme signé ici.</p></div>'
        +'<div style="display:flex;gap:7px"><button class="btn mini" data-contrat>Voir le contrat</button>'
        +'<button class="btn mini" data-modifier>Modifier</button></div></div>'
      +'<div class="rangee"><div><b>Le compte partenaire</b>'
        +'<p>'+(p.compte_email
          ? 'Ouvert au nom de <span class="mono">'+ech(p.compte_email)+'</span>. Il voit ses leads, ses commissions et ses notifications, et rien d’autre.'
          : 'Pas encore ouvert. Une fois ouvert, le partenaire suit ses commissions lui-même au lieu de vous appeler.')+'</p></div>'
        +'<button class="btn mini" data-compte>'+(p.compte_email?'Changer':'Ouvrir un compte')+'</button></div>'
      +'<div class="rangee"><div><b>Prévenir le partenaire</b>'
        +'<p>Un message déposé dans son espace. Il le voit à sa prochaine connexion.</p></div>'
        +'<button class="btn mini" data-notif'+(p.compte_email?'':' disabled')+'>Écrire</button></div>'
      +'<div style="margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:12px">'
        +'<b style="font-size:14px">Les commissions</b>'
        +'<button class="btn mini" data-comm>+ Commission</button></div>'
      +(cs.length?('<div class="tbl-scroll" style="margin-top:10px"><table><thead><tr>'
        +'<th>Libellé</th><th>Statut</th><th class="n">Montant</th><th></th></tr></thead><tbody>'
        +cs.map(function(c){
          return '<tr><td>'+ech(c.libelle||'—')+'<br><span class="sec">'+date(c.cree_le)+'</span></td>'
            +'<td>'+etat(c.statut==='payee'?'payée':c.statut==='validee'?'à payer':c.statut==='annulee'?'annulée':'à valider',
                c.statut==='payee'?'ok':c.statut==='validee'?'att':'neu')+'</td>'
            +'<td class="n">'+euro(c.montant)+'</td>'
            +'<td class="n">'+(c.statut!=='payee'?'<button class="btn mini" data-suite="'+c.id+'">Avancer</button>':'')+'</td></tr>';
        }).join('')+'</tbody></table></div>')
        :'<p class="sec" style="margin-top:10px">Aucune commission enregistrée pour l’instant.</p>')
    +'</div><footer>'
    +'<button class="btn" data-x>Fermer</button>'
    +'<span style="display:flex;gap:7px">'
    +'<button class="btn" data-rappelp>'+(p.rappel_le?'Changer le rappel':'Rappeler plus tard')+'</button>'
    +(p.tel?'<button class="btn" data-appeler>Appeler</button>':'')
    +'<button class="btn" data-mailp2>Envoyer un mail</button>'
    +'<button class="btn" data-modifier2>Modifier</button>'
    +'<button class="btn'+(p.compte_email?'':' fort')+'" data-inviter>'
      +(p.compte_email?'Renvoyer l’invitation':'Inviter dans l’espace partenaire')+'</button>'
    +'</span></footer></div>';
  document.body.appendChild(f);
  brancherSequences(f,function(){ f.remove(); lire('ls_prescripteurs','select=*&id=eq.'+p.id+'&limit=1').then(function(r){ if(r.length)ecranPartenaire(r[0]); }); });
  var ferme=function(){ f.remove(); };
  $$('[data-x]',f).forEach(function(b){ b.onclick=ferme; });
  f.addEventListener('click',function(e){ if(e.target===f)ferme(); });

  $('[data-modifier]',f).onclick=function(){ ferme(); fichePartenaire(p); };
  $('[data-modifier2]',f).onclick=function(){ ferme(); fichePartenaire(p); };
  $('[data-mailp2]',f).onclick=function(){ ferme(); mailPartenaire(p,function(){ ecranPartenaire(p); }); };
  $('[data-rappelp]',f).onclick=function(){
    ferme();
    poserRappel(p,function(){
      lire('ls_prescripteurs','select=*&id=eq.'+p.id+'&limit=1')
        .then(function(r){ if(r.length)ecranPartenaire(r[0]); });
    });
  };
  var ba=$('[data-appeler]',f);
  if(ba)ba.onclick=function(){
    ferme();
    SESSION={debut:Date.now(),faits:0,interesses:0,fiche:p,pile:[],mode:'partenaire'};
    location.hash='#appels';
    setTimeout(function(){ ecranAppelPartenaire(); },60);
  };
  /* Chercher le numéro d'une seule fiche, sur demande : c'est payant,
     donc jamais automatique. */
  var bnum=$('[data-numero]',f);
  if(bnum)bnum.onclick=async function(){
    var b=this; b.disabled=true; b.textContent='Recherche…';
    try{
      var j=await engrenageAppel({action:'numero',id:p.id});
      if(j.tel){
        ferme();
        ecranPartenaire((await lire('ls_prescripteurs','select=*&id=eq.'+p.id+'&limit=1'))[0]);
      }else{
        b.disabled=false; b.textContent='Aucun numéro public';
      }
    }catch(e){
      b.disabled=false; b.textContent='Le chercher';
      alerteCopiable('Numéro introuvable',String(e.message||e));
    }
  };
  $('[data-inviter]',f).onclick=async function(){
    await monNom(); ferme(); inviterPartenaire(p,function(){ retourPartenaire(p); });
  };
  $('[data-contrat]',f).onclick=function(){ ferme(); voirContrat(p); };
  $('[data-compte]',f).onclick=function(){ ferme(); ouvrirCompte(p); };
  /* Un bouton « Fermer » sur la fiche pendant un appel : retour à
     l'appel, pas à la liste. Hors appel, on ferme simplement. */
  if(SESSION&&SESSION.mode==='partenaire'&&SESSION.fiche)
    $$('[data-x]',f).forEach(function(b){ b.onclick=function(){ f.remove(); ecranAppelPartenaire(); }; });
  var bn=$('[data-notif]',f); if(bn&&!bn.disabled)bn.onclick=function(){ ferme(); ecrireNotif(p); };
  $('[data-comm]',f).onclick=function(){ ferme(); ficheCommission(p); };
  $$('[data-suite]',f).forEach(function(b){
    b.onclick=async function(){
      var c=cs.filter(function(x){return x.id===b.dataset.suite;})[0];
      var vers=c.statut==='a_valider'?'validee':'payee';
      await modifier('ls_commissions','id=eq.'+c.id,
        {statut:vers,paye_le:vers==='payee'?aujourdhui():null});
      if(p.compte_email)await ecrire('ls_notifications',{destinataire:p.compte_email,partenaire_id:p.id,
        genre:'commission',titre:vers==='payee'?'Commission versée':'Commission validée',
        corps:(c.libelle||'Commission')+' — '+euro(c.montant)+(vers==='payee'?', virement effectué.':', elle sera versée à la prochaine échéance.')});
      await tracer('commission.'+vers,p.nom);
      ferme(); ecranPartenaire((await lire('ls_prescripteurs','select=*&id=eq.'+p.id+'&limit=1'))[0]);
    };
  });
}

function texteContrat(p){
  var remu = p.commission_type==='pourcentage'
    ? p.commission_taux+' % du montant hors taxes de chaque affaire signée grâce à son intervention'
    : p.commission_type==='fixe_lead'
      ? euro(p.commission_taux)+' par contact qualifié transmis et accepté'
      : euro(p.commission_taux)+' par affaire signée grâce à son intervention';
  return 'CONTRAT D’APPORT D’AFFAIRES\n\n'
    +'Entre les soussignés :\n\n'
    +'La société — ci-après « la Société »,\n'
    +'et '+p.nom+(p.contact?', représenté par '+p.contact:'')+' — ci-après « l’Apporteur ».\n\n'
    +'ARTICLE 1 — OBJET\n'
    +'L’Apporteur met en relation la Société avec des clients potentiels. Il n’a ni mandat de '
    +'représentation, ni pouvoir d’engager la Société, et n’est pas agent commercial.\n\n'
    +'ARTICLE 2 — RÉMUNÉRATION\n'
    +'L’Apporteur perçoit '+remu+'.\n'
    +(p.commission_note?'Conditions particulières : '+p.commission_note+'\n':'')
    +'La commission est due après encaissement effectif du règlement client, et versée sur facture '
    +'de l’Apporteur dans les trente jours.\n\n'
    +'ARTICLE 3 — SUIVI\n'
    +'L’Apporteur dispose d’un accès personnel lui permettant de consulter à tout moment les affaires '
    +'qu’il a apportées et l’état de ses commissions.\n\n'
    +'ARTICLE 4 — EXCLUSIVITÉ\n'
    +'Le présent contrat est conclu sans exclusivité de part ni d’autre.\n\n'
    +'ARTICLE 5 — DURÉE\n'
    +'Le contrat est conclu pour un an, renouvelable par tacite reconduction, résiliable par chacune '

function copier(txt,btn){
  var fini=function(){ if(btn){ var v=btn.textContent; btn.textContent='Copié'; setTimeout(function(){btn.textContent=v;},1400); } };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(fini,manuel); return; }
  }catch(e){}
  manuel();
  function manuel(){
    var z=document.createElement('textarea'); z.value=txt; z.style.position='fixed'; z.style.opacity='0';
    document.body.appendChild(z); z.select();
    try{ document.execCommand('copy'); fini(); }catch(e){}
    z.remove();
  }
}

function motDePasse(){
  /* Un mot de passe provisoire, mais tiré au sort par le navigateur et
     non par Math.random, dont la suite se devine. Quatorze caractères
     sans ambiguïté de lecture : pas de l, de I, de O ni de 0. */
  var a='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', s='';
  var t=new Uint32Array(14); (window.crypto||window.msCrypto).getRandomValues(t);
  for(var i=0;i<14;i++)s+=a[t[i]%a.length];
  return s;
}

VUES.catalogue=async function(){

       qui disparaît des devis sans prévenir. On le montre. */
    var porte={};
    actifs.forEach(function(x){ if(x.role)(porte[x.role]=porte[x.role]||[]).push(x); });
    var trous=ROLES.filter(function(r){ return !porte[r.v]; });

    var h='<div class="kpis">'

        trous.length?'le chiffrage les signalera comme manquants':'le chiffrage a tout ce qu’il lui faut')
      +kpi('Éteints',nb(l.length-actifs.length),'','jamais proposés')
      +'</div>';
    if(trous.length)
      h+='<div class="panneau" style="border-color:rgba(232,121,107,.4)"><header>'
        +'<h2>Ce que le chiffrage cherche sans le trouver</h2>'
        +'<span class="aide">ces postes n’apparaîtront pas sur les devis</span></header>'
        +'<div class="corps"><ul style="margin:0;padding-left:20px;line-height:1.7;font-size:13.5px">'
        +trous.map(function(r){ return '<li><b>'+ech(r.l)+'</b>'+(r.d?' — '+ech(r.d):'')
          +' <span class="sec mono" style="font-size:11px">'+ech(r.v)+'</span></li>'; }).join('')

/* La démo prend tout l'écran : en rendez-vous, le client regarde le
   logiciel, pas le CRM autour. Échap ramène au CRM. */
async function ouvrirDemo(d){
  var ok=await demoPresente(d);
  var f=document.createElement('div');
  f.className='demo-plein';
  f.innerHTML='<div class="demo-barre"><b>'+ech(d.nom)+'</b><span class="sec">démonstration · données fictives</span>'
      +'<span style="flex:1"></span>'
      +(ok?'<button class="btn mini" data-ecran>Plein écran</button>':'')
      +'<button class="btn mini fort" data-x>Quitter la démo</button></div>'
    +(ok?'<iframe title="Démo '+ech(d.nom)+'" src="demo-'+d.id+'.html"></iframe>'
       :'<div class="demo-vide"><div class="gros">'+ech(d.nom)+' est en cours de refonte</div>'
        +'<p>La nouvelle version, au design ONIQ, se dépose à côté de l’application '
        +'sous le nom <span class="mono">demo-'+ech(d.id)+'.html</span>. '
        +'Elle apparaîtra ici toute seule au prochain chargement.</p></div>');
  document.body.appendChild(f);
  var ferme=function(){ document.removeEventListener('keydown',echap); if(document.fullscreenElement)document.exitFullscreen().catch(function(){}); f.remove(); };
  var echap=function(e){ if(e.key==='Escape'&&!document.fullscreenElement)ferme(); };
  document.addEventListener('keydown',echap);
  /* Certaines démos ont leur propre bouton « Fermer » : elles le
     signalent par un message, qu'on n'accepte que de nos propres pages. */
  var msg=function(ev){
    if(ev.origin!==location.origin)return;
    if(ev.data==='oniq-demo-close'||(ev.data&&ev.data.type==='oniq-demo-close'))ferme();
  };
  window.addEventListener('message',msg);
  var ferme0=ferme;
  ferme=function(){ window.removeEventListener('message',msg); ferme0(); };
  $('[data-x]',f).onclick=ferme;
  var pe=$('[data-ecran]',f);
  if(pe)pe.onclick=function(){ if(f.requestFullscreen)f.requestFullscreen().catch(function(){}); };
  tracer('demo.ouverte',d.nom).catch(function(){});
}

/* ══ Leads ═════════════════════════════════════════════════════════
   Tous les robinets au même endroit : les plateformes payantes,
   l'entrant, les prescripteurs, le sortant. Ce qui compte n'est pas
   d'en avoir beaucoup mais de savoir ce que chacun coûte par affaire
   signée — et de rappeler avant les autres. */
var SGENRE={plateforme:'Plateforme payante',entrant:'Entrant',prescripteur:'Prescripteur',sortant:'Sortant'};
var SSTAT={a_brancher:'À brancher',en_test:'En test',actif:'Actif',coupe:'Coupé'};
var SRECEP={manuel:'Saisie manuelle',email:'Par e-mail',webhook:'Automatique'};

/* ══ Importer un fichier de leads ══════════════════════════════════
   Tous les fournisseurs ne savent pas pousser un webhook. Beaucoup
   n'offrent qu'un bouton « Exporter ». Plutôt que de recopier des
   lignes à la main, on lit leur fichier : les colonnes sont
   reconnues par leur nom, les doublons de numéro sont écartés, et
   chaque ligne devient une fiche à rappeler tout de suite.

   Le découpage tient compte des guillemets : une virgule à
   l'intérieur d'un champ ne coupe pas la ligne en deux. */
function lireCsv(txt){
  txt=String(txt||'').replace(/^﻿/,'');
  /* Le séparateur se devine sur la première ligne : les exports
     français sont en points-virgules, les anglais en virgules. */
  var tete=txt.split(/\r?\n/)[0]||'';
  var sep=[';',',','\t'].map(function(s){ return {s:s,n:tete.split(s).length}; })
    .sort(function(a,b){ return b.n-a.n; })[0].s;
  var lignes=[], champ='', ligne=[], guill=false;
  for(var i=0;i<txt.length;i++){
    var ch=txt[i];
    if(guill){
      if(ch==='"'){ if(txt[i+1]==='"'){ champ+='"'; i++; } else guill=false; }
      else champ+=ch;
    }else if(ch==='"')guill=true;
    else if(ch===sep){ ligne.push(champ); champ=''; }
    else if(ch==='\n'){ ligne.push(champ); lignes.push(ligne); ligne=[]; champ=''; }
    else if(ch!=='\r')champ+=ch;
  }
  if(champ!==''||ligne.length){ ligne.push(champ); lignes.push(ligne); }
  return lignes.filter(function(l){ return l.some(function(c){ return String(c).trim(); }); });
}
/* Les fournisseurs ne nomment pas leurs colonnes de la même façon.
   Même table de correspondance que la fonction de réception : ce qui
   arrive par webhook et ce qui arrive par fichier doivent donner la
   même fiche. */
var COLONNES={
  societe:['societe','société','society','company','raisonsociale','entreprise','nom','name','client'],
  tel:['telephone','téléphone','tel','tél','phone','mobile','portable','numero','numéro'],
  email:['email','e-mail','mail','courriel','adresseemail'],
  dirigeant:['contact','dirigeant','nomcontact','fullname','prenomnom','interlocuteur','prenom','prénom'],
  ville:['ville','city','commune','localite','localité'],
  code_postal:['codepostal','code postal','cp','zip','postalcode'],
  note:['besoin','message','commentaire','projet','description','demande','produitservice','produit/service','produit','service','notes','note','statut'],
  /* Les exports d'outils de prospection comme Pharow portent en plus
     le site, le SIREN, le métier et le poste de la personne. On les
     lit : ce sont eux qui rendent le fichier utilisable en campagne. */
  site:['site','siteweb','website','url','domaine','domain','siteinternet'],
  siren:['siren','siret','identifiant','numerosiren'],
  metier:['metier','métier','activite','activité','secteur','industry','naf','categorie','catégorie'],
  poste:['poste','fonction','titre','jobtitle','title','role']
};
function cleColonne(n){
  return String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]/g,'');
}
function reconnaitre(entetes){
  var m={};
  Object.keys(COLONNES).forEach(function(champ){
    var syn=COLONNES[champ].map(cleColonne);
    for(var i=0;i<entetes.length;i++){
      if(m[champ]!=null)break;
      var k=cleColonne(entetes[i]);
      if(!k)continue;
      if(syn.indexOf(k)>-1)m[champ]=i;
    }
    if(m[champ]==null){
      /* Rien d'exact : on accepte une colonne qui contient le mot,
         « Téléphone mobile » pour « telephone » par exemple. */
      for(var j=0;j<entetes.length;j++){
        if(m[champ]!=null)break;
        var k2=cleColonne(entetes[j]);
        for(var s=0;s<syn.length;s++){
          if(syn[s].length>3&&k2.indexOf(syn[s])>-1){ m[champ]=j; break; }
        }
      }
    }
  });
  return m;
}
function telNorme(t){
  var s=String(t||'').trim();
  return /^\+33/.test(s)?'0'+s.replace(/^\+33\s*(\(0\))?/,'').replace(/[^0-9]/g,'')
                        :s.replace(/[^0-9]/g,'');
}

      f.remove(); if(partenaires)VUES.affiliation(); else VUES.leads();
    };

}

   chemin ils arrivent. Le jeton affiché est le nôtre — celui qu'on
   donne au fournisseur pour qu'il s'annonce. Une clé appartenant au

function jetonNeuf(){

function delaiMot(m){
  if(m<60)return m+' minutes';
  if(m<1440)return Math.round(m/60)+' heures';
  return Math.round(m/1440)+' jours';
}
/* == L'apercu d'une regle =========================================
   Ecrire un message a trous et l'allumer sans l'avoir vu rempli, c'est
   decouvrir « Bonjour , » sur deux cents envois. L'apercu montre donc
   le message tel qu'il partira : sur une vraie fiche de la base quand
   il y en a une, avec l'expediteur reel, le pied obligatoire, et pour
   un SMS le decompte qui decide du prix. */
var EXEMPLE_FICHE=null;
async function ficheExemple(activite){
  var cle=activite||'les_deux';
  if(EXEMPLE_FICHE&&EXEMPLE_FICHE.__cle===cle)return EXEMPLE_FICHE;
  var d=[];
  try{
    d=await lire('ls_prospects','select=societe,dirigeant,ville,effectif,source,montant,origine_lead'
      +'&order=updated_at.desc&limit=1'
      +(activite&&activite!=='les_deux'?'&activite=eq.'+activite:''));
  }catch(e){}
  EXEMPLE_FICHE = d.length
    ? Object.assign({__cle:cle,__vrai:true},d[0])
    : {__cle:cle,__vrai:false,societe:'Garage Weber',dirigeant:'Anne Weber',ville:'Nancy',
       effectif:'12',source:'Companeo',montant:4820,origine_lead:'formulaire'};
  return EXEMPLE_FICHE;
}
/* Un SMS se facture au segment, pas au message. Un emoji fait tomber
   la limite de 160 a 70 caracteres : c'est le genre de detail qui
   triple une facture sans que personne ne comprenne pourquoi. */
function segmentsSms(t){
  var uni=false, n=t.length;
  for(var i=0;i<n;i++){ if(t.charCodeAt(i)>255){ uni=true; break; } }
  if(uni)return {n:n,seg:n<=70?1:Math.ceil(n/67),uni:true};
  return {n:n,seg:n<=160?1:Math.ceil(n/153),uni:false};
}
/* Une clé vide pour une maison veut dire « prends celle du dessus ».
   Le même arbitrage que dans le moteur, écrit une fois de plus ici :
   un aperçu qui montre autre chose que ce qui partira ne sert à rien. */
function reglagesMaison(rg,activite){
  if(activite!=='bornistes'&&activite!=='tiimizy')return rg;
  var o={}; for(var k in rg)o[k]=rg[k];
  ['expediteur_nom','expediteur_email','repondre_a','sms_expediteur'].forEach(function(c){
    var v=rg[c+'_'+activite];
    if(v&&String(v).trim())o[c]=String(v).trim();
  });
  return o;
}
function blocApercu(canal,objet,corps,rg,ex){
  var o=remplir(objet,ex), c=remplir(corps,ex);
  var vides=(c+' '+o).match(/\{[a-z_]+\}/g);
  var alerte='';
  if(vides) alerte='<div class="q-alerte" style="margin-top:12px">Repère inconnu : '
    +ech(vides.join(' '))+' — il partira tel quel, entre accolades.</div>';
  else if(/[Bb]onjour\s*[,.]/.test(c))
    alerte='<div class="q-alerte" style="margin-top:12px">Le nom manque après « Bonjour » : '
      +'sur une fiche sans dirigeant, votre message dira « Bonjour , ».</div>';

  if(canal==='sms'){
    var m=segmentsSms(c);
    var cher=m.seg>1;
    return '<div class="apercu-sms"><div class="bulle">'+ech(c||'(message vide)')+'</div>'
      +'<div class="sec" style="margin-top:9px">De <b>'+ech((rg.sms_expediteur||'Standard').slice(0,11))
      +'</b> · '+m.n+' caractère'+(m.n>1?'s':'')+' · <b'+(cher?' style="color:var(--retard)"':'')+'>'
      +m.seg+' SMS'+(m.seg>1?' facturés':' facturé')+'</b>'
      +(m.uni?' · un emoji fait tomber la limite à 70 caractères':'')+'</div>'
      +alerte+'</div>';
  }
  var pied=rg.pied_email?'\n\n—\n'+rg.pied_email:'';
  var exp=(rg.expediteur_nom||'ONIQ')+' <'+(rg.expediteur_email||'adresse non renseignée')+'>';
  return '<div class="apercu-mail">'
    +'<div class="entete">'
      +'<div><span>De</span>'+ech(exp)+'</div>'
      +(rg.repondre_a?'<div><span>Réponse</span>'+ech(rg.repondre_a)+'</div>':'')
      +'<div><span>À</span>'+ech(ex.dirigeant||'')+' — '+ech(ex.societe||'')+'</div>'
      +'<div><span>Objet</span><b>'+ech(o||'(sans objet)')+'</b></div>'
    +'</div>'
    +'<div class="corps-mail">'+ech(c||'(message vide)')
    +(pied?'<span class="pied">'+ech(pied)+'</span>':'')+'</div>'
    +(rg.expediteur_email?'':'<div class="q-alerte" style="margin-top:12px">'
      +'Aucune adresse d’expédition : tous les envois échoueront. Ouvrez « Réglages d’envoi ».</div>')
    +(rg.repondre_a||!rg.expediteur_email?'':'<div class="q-alerte" style="margin-top:12px">'
      +'Aucune adresse de réponse : si le domaine d’envoi n’a pas de boîte aux lettres, '
      +'les réponses de vos clients — y compris les STOP — seront perdues.</div>')
    +alerte+'</div>';
}
async function brancherApercu(f){
  var l=[]; try{ l=await lire('ls_reglages','select=*&limit=50'); }catch(e){}
  var rg={}; l.forEach(function(x){ rg[x.cle]=x.valeur; });
  await monNom();
  var mf={}; try{ mf=await maFiche(); }catch(e){}

  var zone=document.createElement('div');
  zone.className='zone-apercu';
  zone.innerHTML='<div class="titre-apercu">Ce que le destinataire recevra</div><div id="ap-vue"></div>';
  var corps=$('.corps',f); if(!corps)return;
  corps.appendChild(zone);

  var dessiner=async function(){
    var canal=($('#f-canal',f)||{}).value||'email';
    var act=($('#f-activite',f)||{}).value||'les_deux';
    var ex=await ficheExemple(act);
    var vue=$('#ap-vue',f); if(!vue)return;
    /* L'aperçu montre l'expéditeur qui signera vraiment : celui du
       commercial à qui la fiche appartient, pas l'adresse de service. */
    var rm=reglagesMaison(rg,act);
    var vu={}; for(var k in rm)vu[k]=rm[k];
    var id=identiteEnvoi(mf,moi,rm,MON_NOM,act);
    if(id.mail)vu.expediteur_email=id.mail;
    if(id.nom)vu.expediteur_nom=id.nom;
    if(id.rep)vu.repondre_a=id.rep;
    vue.innerHTML=blocApercu(canal,
      ($('#f-objet',f)||{}).value||'', ($('#f-corps',f)||{}).value||'', vu, ex)
      +'<div class="sec" style="margin-top:10px;font-size:11.5px">'
      +(ex.__vrai?'Rempli avec '+ech(ex.societe)+', la dernière fiche modifiée.'
                 :'Aucune fiche dans la base : rempli avec un exemple.')
      +(act==='les_deux'?' Réglé sur « les deux » : c’est l’expéditeur par défaut qui signe, '
        +'quelle que soit la maison du destinataire.':'')+'</div>';
  };
  ['f-objet','f-corps'].forEach(function(id){
    var el=$('#'+id,f); if(el)el.addEventListener('input',dessiner); });
  ['f-canal','f-activite'].forEach(function(id){
    var el=$('#'+id,f); if(el)el.addEventListener('change',dessiner); });
  dessiner();
}

function ficheRegle(r){
  r=r||{};
  var F=formulaire(r.id?'Modifier la règle':'Nouvelle règle',[
    {id:'nom',nom:'Nom de la règle',requis:true,large:true,valeur:r.nom,
      ph:'Relance d’un devis sans réponse'},
    {id:'declencheur',nom:'Quand',type:'select',valeur:r.declencheur||'lead_recu',large:true,
      options:Object.keys(DECLENCHEURS).map(function(k){return {v:k,l:DECLENCHEURS[k]};})},
    {id:'delai_min',nom:'Attendre (minutes)',type:'number',valeur:r.delai_min||0,
      aide:'0 pour partir tout de suite · 2880 pour deux jours · 7200 pour cinq jours'},
    {id:'canal',nom:'Par quel canal',type:'select',valeur:r.canal||'email',

var MON_NOM=null, MOI_FICHE=null;
/* Un message doit avoir un auteur. On déduit l'adresse d'envoi de
   celle de connexion : ruben@oniq.online devient
   ruben@mail.oniq.online, qui est le domaine authentifié — et
   les réponses reviennent sur la boîte d'origine, celle qui est
   vraiment relevée. Aucune saisie, aucune boîte à créer. */
/* Qui signe, et ou repondra le client.

   L'identifiant d'une personne, c'est la partie avant le @ de son
   adresse professionnelle — pas celle de son compte de connexion :
   quelqu'un peut se connecter avec un Gmail sans qu'un client le voie
   jamais. Le domaine, lui, vient de la maison du destinataire, pour
   qu'un client des logiciels ne reçoive rien qui parle du sur-mesure.

   L'ordre : l'adresse professionnelle de la fiche, sinon l'adresse de
   connexion. Et `envoi_email` reste le passe-droit, pour la personne
   dont l'adresse ne suit aucune regle. */
function localDe(adresse){
  return String(adresse||'').split('@')[0].trim();
}
function surLeDomaineDe(local, modele){
  var d=String(modele||'').split('@')[1];
  return (local&&d)?local+'@'+d:'';
}
function identiteEnvoi(fiche, moiMail, rm, monNomAffiche, activite){
  var f=fiche||{}, r=rm||{};
  /* Une adresse écrite noir sur blanc sur la fiche du commercial, pour
     cette maison-là, passe avant toute déduction. La déduction ne
     reste que pour ceux qui n'ont rien rempli. */
  var m=(activite==='bornistes'||activite==='tiimizy')?activite:'';
  var sienne=m?String(f['mail_'+m]||'').trim():'';
  var pro=(f.repondre_a&&f.repondre_a.trim())||'';
  var local=localDe(sienne)||localDe(pro)||localDe(moiMail);
  var mail=sienne
    || (f.envoi_email&&f.envoi_email.trim())
    || surLeDomaineDe(local, r.expediteur_email)
    || r.expediteur_email || '';
  var rep=sienne || surLeDomaineDe(local, r.repondre_a) || pro || r.repondre_a || moiMail || '';
  var nom=(f.envoi_nom&&f.envoi_nom.trim())
    || ((f.nom||monNomAffiche||'')+(r.expediteur_nom?' — '+r.expediteur_nom:''));
  return {mail:mail, rep:rep, nom:nom.trim()};
}
function expediteurDe(moiMail, reglagesMaison){
  var base=(reglagesMaison&&reglagesMaison.expediteur_email)||'';
  var local=String(moiMail||'').split('@')[0];
  var domaine=base.split('@')[1]||'';
  if(!local||!domaine)return '';
  return local+'@'+domaine;
}

var ORIGINES={
  formulaire:{l:'Un formulaire rempli',dit:'Vous avez répondu à un formulaire chez nous'},
  appel:{l:'Il nous a appelés',dit:'Vous nous avez appelés'},
  partenaire:{l:'Un partenaire nous l’a envoyé',dit:'Notre partenaire vous a mis en relation avec nous'},
  salon:{l:'Rencontré sur un salon',dit:'Nous nous sommes rencontrés récemment'},

/* ══ Les noms tels qu'on les écrit à la main ═══════════════════════
   Le registre écrit « URBAN 5 (URBAN 5) », « LA RAVOIRE », « SAIDOUN
   SALIM ». Recopié tel quel dans un mail, ça donne « Je ne sais pas où
   en est URBAN 5 (URBAN 5) sur ce sujet », et le lecteur comprend en
   trois lignes qu'aucune main humaine n'est passée par là.

   On ne corrige que ce qui est manifestement du fichier : un nom
   entièrement en capitales, ou une enseigne répétée entre
   parenthèses. Un nom déjà écrit normalement n'est jamais touché,
   parce qu'on ne sait pas mieux que celui qui l'a écrit. */
var PETITS_MOTS=['de','du','des','la','le','les','et','à','au','aux','en','sur','sous','d','l'];
function jolieCasse(t){
  var s=String(t||'').trim();
  if(!s)return '';
  if(/[a-zà-ÿ]/.test(s))return s;         /* déjà en casse mélangée */
  return s.toLowerCase().split(/(\s+|-|’|')/).map(function(m,i){
    if(!/[a-zà-ÿ0-9]/i.test(m))return m;
    /* Un sigle sans voyelle reste un sigle : SNCF, BTP, SNC. */
    if(/^[bcdfghjklmnpqrstvwxz]{2,5}$/i.test(m))return m.toUpperCase();
    if(i>0&&PETITS_MOTS.indexOf(m)>-1)return m;
    return m.charAt(0).toUpperCase()+m.slice(1);
  }).join('');
}
function nomPropre(t){
  var s=String(t||'').trim().replace(/\s+/g,' ');
  if(!s)return '';
  /* « URBAN 5 (URBAN 5) » : le registre répète l'enseigne. */
  s=s.replace(/^(.*?)\s*\(\s*\1\s*\)$/i,'$1');
  /* La forme juridique ne se dit pas à l'oral, elle ne s'écrit pas
     dans un mail non plus. */
  s=s.replace(/[\s,]+(SAS|SASU|SARL|EURL|SNC|SCI|SCM|EI|EIRL)\.?$/i,'');
  return jolieCasse(s);
}

function remplir(txt,p){
  var n=MON_NOM||(moi||'').split('@')[0];
  return String(txt||'')
    .replace(/\{societe\}/g,nomPropre(p.societe||''))
    .replace(/\{dirigeant\}/g,jolieCasse(p.dirigeant||''))
    .replace(/\{ville\}/g,jolieCasse(p.ville||''))
    .replace(/\{effectif\}/g,p.effectif||'')
    .replace(/\{source\}/g,p.source||'')
    .replace(/\{origine\}/g,(ORIGINES[p.origine_lead]||ORIGINES.formulaire).dit)
    .replace(/\{montant\}/g,p.montant?euro(p.montant):'')
    .replace(/\{expediteur\}/g,n)
    .replace(/\{moi\}/g,n);
}

      +'à un partenaire, elle peut se connecter mais ne voit rien.</p></div></div>';
    $$('[data-m]').forEach(function(b){
      b.onclick=function(){
        var x=e.filter(function(y){return y.email===decodeURIComponent(b.dataset.m);})[0];
        ficheMembre(x);
      };
    });
  }catch(e){ $('#vue').innerHTML='<div class="erreur">'+ech(e.message)+'</div>'; }
};
function ficheMembre(x){
  x=x||{};
  formulaire(x.email?'Modifier '+(x.nom||x.email):'Nouveau membre',[
    {id:'email',nom:'Adresse',type:'email',requis:true,large:true,valeur:x.email,
     aide:x.email?'l’adresse ne se change pas ici':'la même que son compte de connexion'},

     aide:'apparaît sous son nom dans la signature'},
