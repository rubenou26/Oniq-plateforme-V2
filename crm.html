      options:[{v:'commercial',l:'Commercial'},{v:'direction',l:'Direction'}]},
    {id:'telephone',nom:'Téléphone',valeur:x.telephone||x.tel,
     aide:'le numéro sur lequel le client rappellera'},
    {id:'repondre_a',nom:'Adresse professionnelle',type:'email',large:true,
     valeur:x.repondre_a,
     aide:'celle que le client voit et à laquelle il répond. Si elle est vide, '
        +'c’est l’adresse de connexion qui sert — et un Gmail se verrait.'},
    {id:'mail_bornistes',nom:'Son adresse ONIQ Sur mesure',type:'email',large:true,
     valeur:x.mail_bornistes,
     aide:'l’adresse qui signe les messages aux clients du sur-mesure. '
        +'Vide, elle se déduit du domaine de la maison.'},
    {id:'mail_tiimizy',nom:'Son adresse ONIQ Logiciels',type:'email',large:true,
     valeur:x.mail_tiimizy,
     aide:'l’adresse qui signe les messages aux clients de nos logiciels. '
        +'Le domaine doit être authentifié chez Brevo, sinon l’envoi part en spam.'},
    {id:'actif',nom:'Accès',type:'check',valeur:x.actif===undefined?true:x.actif,ph:'actif'}
  ],async function(v){
    /* On écrit les deux jeux de colonnes : le formulaire d'avant remplit
       poste/telephone, la signature lit fonction/tel. Tant que les deux
       existent, les tenir d'accord vaut mieux qu'une migration risquée. */
    var corps={nom:v.nom,poste:v.poste,fonction:v.poste,role:v.role,
      telephone:v.telephone,tel:v.telephone,
      repondre_a:(v.repondre_a||'').trim(),

      mail_tiimizy:(v.mail_tiimizy||'').trim(),
      actif:!!v.actif};
    /* La fiche en mémoire devient fausse dès qu'on la modifie : la
       vider force la relecture, sinon l'aperçu montre l'ancienne
       adresse jusqu'à la prochaine ouverture du CRM. */
    if(x.email&&String(x.email).toLowerCase()===String(moi||'').toLowerCase()) MOI_FICHE=null;
    if(x.email) await modifier('ls_equipe','email=eq.'+encodeURIComponent(x.email),corps);
    else { corps.email=String(v.email||'').trim().toLowerCase(); await ecrire('ls_equipe',corps); await tracer('equipe.ajout',corps.email); }
    VUES.equipe();
  });
}

/* Les colonnes historiques de ls_qualif, réemployées : elles servent
   aux listes et à la fiche client, le détail reste dans « reponses ».
   Un seul endroit pour la correspondance, trois écrans qui écrivent. */
function colonnesQualif(r){
  return {type_site:r.secteur||'', nb_bornes:Math.max(1,+r.nb_utilisateurs||1),
    puissance:offreConseillee(r,true), reseau:r.outil_actuel||'',
    montage:(Array.isArray(r.logiciels)?r.logiciels.join(', '):''),
    tranchee:false, distance_m:0, advenir:false};
}

/* Ce que les réponses disent, une fois mises bout à bout. C'est là que
   la fiche cesse d'être un formulaire : elle prévient le commercial
   pendant qu'il a encore le client au téléphone. */
/* Écrire la qualification, d'où qu'elle vienne. La règle qui compte
   est la relecture préalable : deux écrans saisissent le même
   questionnaire, et un remplacement aveugle de la colonne efface le
   travail de l'autre sans le moindre message. */
async function poserQualif(p,r,trace){
  var av={};
  try{
    var d=await lire('ls_qualif','select=reponses&prospect_id=eq.'+p.id+'&limit=1');
    if(d.length&&d[0].reponses)av=d[0].reponses;
  }catch(e){}
  var fusion={};
  for(var k in av)fusion[k]=av[k];
  for(var k2 in r)fusion[k2]=r[k2];

  var v=lireQualif(fusion), l=questionsVisibles(fusion);
  /* Une question facultative ne compte pas dans l'avancement : sinon
     une qualification complète plafonne à quatre-vingt-quinze pour
     cent et personne ne sait ce qui manque. */
  var lc=l.filter(function(x){ return !x.q.opt; });
  var faits=lc.filter(function(x){
    return fusion[x.q.id]!==undefined&&fusion[x.q.id]!==''; }).length;
  var corps={prospect_id:p.id,societe:p.societe,
       complet:Math.round(faits/Math.max(1,lc.length)*100),
       alertes:v.alertes.join(' · '),recap:recapQualif(p,fusion),reponses:fusion,par:moi,
       maj_le:new Date().toISOString()};
  var cq=colonnesQualif(fusion); for(var k3 in cq)corps[k3]=cq[k3];
  var rp=await appelle(URL_BASE+'/rest/v1/ls_qualif?on_conflict=prospect_id',
    {method:'POST',headers:entetes({'Prefer':'resolution=merge-duplicates'}),
     body:JSON.stringify(corps)});
  if(!rp.ok)throw new Error(await rp.text());
  if(fusion.echeance)await poserEcheance('ls_prospects',p.id,fusion.echeance);
  if(trace)await tracer('qualification',p.societe,p.id);
  return fusion;
}

/* Le budget annoncé, en euros, quelle que soit la façon de le dire :
   « 15k », « 15 000 », « 15 000 € HT ». Zéro quand on ne sait pas. */
function budgetEuros(t){
  var s=String(t||'').toLowerCase().replace(/\s/g,'').replace(',','.');
  var m=/(\d+(?:\.\d+)?)(k|m)?/.exec(s); if(!m)return 0;
  var n=parseFloat(m[1]); if(m[2]==='k')n*=1000; if(m[2]==='m')n*=1e6;
  return n;
}
/* Le type de projet retenu. « Je ne sais pas » n'est pas une réponse
   de devis : on tranche avec le nombre de domaines à couvrir. */
function projetRetenu(r){
  var t=r.type_projet, m=Number(r.nb_modules)||1;
  if(t&&t!=='Je ne sais pas')return t;
  if(m>=6)return 'ERP par modules';
  if(m>=3)return 'Application de gestion';
  return 'Outil métier ciblé';
}
var FOURCHETTES={
  'Outil métier ciblé':{bas:4000,txt:'4 à 10 k€ HT, en service en 3 à 5 semaines'},
  'Application de gestion':{bas:10000,txt:'10 à 22 k€ HT, en service en 6 à 10 semaines'},
  'ERP par modules':{bas:22000,txt:'22 à 60 k€ HT, livré par vagues'},
  'Application mobile ou portail':{bas:8000,txt:'à chiffrer après la maquette'},
  'Site vitrine':{bas:2000,txt:'2 à 6 k€ HT, en ligne en 2 à 4 semaines'},
  'Site e-commerce':{bas:4000,txt:'à partir de 6 k€ HT, selon le catalogue'},
  'Refonte d’un site existant':{bas:2000,txt:'2 à 6 k€ HT, en ligne en 2 à 4 semaines'},
  'Audit d’automatisation':{bas:900,txt:'900 à 1 800 € HT, un à deux jours'}
};
function offreConseillee(r,court){
  if(veutLogiciel(r)){
    var l=Array.isArray(r.logiciels)&&r.logiciels.length?r.logiciels.join(' + '):'un de nos logiciels, à préciser';
    return court?l:l+' adapté — démonstration, adaptation, puis maintenance mensuelle';
  }
  var t=veutSurMesure(r)?projetRetenu(r):veutSite(r)?(r.type_site_web||'Site vitrine')
       :veutAuto(r)?'Audit d’automatisation':'';
  if(!t)return court?'':'à décider une fois le besoin connu';
  var f=FOURCHETTES[t];
  return court||!f?t:t+' — '+f.txt;
}

function lireQualif(r){
  var al=[], co=[];
  var u=Number(r.nb_utilisateurs)||0, m=Number(r.nb_modules)||0;
  var itf=Array.isArray(r.interfaces)?r.interfaces:[];
  var lg=Array.isArray(r.logiciels)?r.logiciels:[];
  if(!r.besoin && (r.secteur||r.irritant))
    co.push('Le besoin n’est pas encore clair : c’est la question à poser avant tout le reste.');
  if(veutLogiciel(r) && r.secteur && r.secteur!=='Bâtiment et travaux'
     && (lg.indexOf('BatiManager')>-1||lg.indexOf('OniMetri')>-1))
    al.push('BatiManager et OniMetri sont faits pour le bâtiment : hors de ce secteur, orientez vers OniPilote ou vers le sur-mesure.');
  if(veutLogiciel(r) && r.secteur==='Bâtiment et travaux' && lg.length===1 && lg[0]==='BatiManager')
    co.push('Il répond à des consultations ? OniMetri fait le métré depuis les plans : proposez-le avec BatiManager.');
  if(veutLogiciel(r) && lg.indexOf('OniPilote')>-1 && lg.indexOf('OniPromail')<0)
    co.push('OniPilote seul : montrez aussi OniPromail pendant la démo, il alimente le pipeline tout seul.');
  if(r.outil_actuel==='Un logiciel du marché' && veutSurMesure(r))
    co.push('Il a déjà un logiciel du marché : demandez ce qui ne va pas. S’il lui convient à quatre-vingts pour cent, '
      +'dites-le-lui — c’est notre règle, et c’est ce qui fait qu’on nous rappelle.');
  if(veutSurMesure(r) && projetRetenu(r)==='ERP par modules')
    co.push('ERP : on ne livre pas tout d’un coup. Proposez de commencer par le domaine le plus douloureux, en première vague.');
  if(r.type_projet==='Outil métier ciblé' && m>=4)
    al.push(m+' domaines pour un outil ciblé : c’est une application de gestion. Le devis doit le dire, sinon il faudra un avenant.');
  if(r.reprise==='Oui, beaucoup')
    co.push('Reprise importante : demandez un export de l’existant dès maintenant, il servira aussi à la maquette.');
  if(itf.length>=3)
    al.push(itf.length+' outils à connecter : vérifiez qu’ils ouvrent une API avant de chiffrer les interfaçages.');
  if(r.mobile==='Oui')
    co.push('Équipes terrain : prévoir l’usage sur téléphone et le hors connexion dès la maquette.');
  if(r.ia==='Oui')
    co.push('Documents lus à la main : proposez une brique d’intelligence artificielle, c’est souvent la ligne qui rembourse le projet.');
  if(u>=10)
    co.push(u+' utilisateurs : prévoyez une demi-journée de formation par groupe de dix, et un référent chez le client.');
  var suite=veutLogiciel(r)?r.demo:r.maquette, quoi=veutLogiciel(r)?'La démonstration':'La maquette';
  if(suite==='Non')
    al.push((veutLogiciel(r)?'Démonstration':'Maquette')+' refusée : sans elle, le devis se discute dans le vide. Proposez au moins un exemple d’outil proche, '
      +'envoyé par mail avant de raccrocher.');
  else if(suite==='Il hésite')
    co.push(veutLogiciel(r)
      ? 'Il hésite : rappelez que la démonstration dure une demi-heure, sur ses propres dossiers, et ne l’engage à rien.'
      : 'Il hésite : rappelez que la maquette ne l’engage à rien, et qu’il voit son outil avant d’avoir payé quoi que ce soit.');
  else if(!suite && r.besoin)
    co.push(quoi+' n’est pas encore proposée : c’est la seule chose à ne pas rater de cet appel.');
  var b=budgetEuros(r.budget), f=FOURCHETTES[offreConseillee(r,true)];
  if(b>0 && f && b<f.bas)
    al.push('Budget annoncé sous notre fourchette pour ce type de projet : réduisez le périmètre à une première vague '
      +'plutôt que de baisser le prix.');
  if(r.delai==='Le plus vite possible' && veutSurMesure(r) && projetRetenu(r)==='ERP par modules')
    al.push('Un ERP « le plus vite possible » : fixez tout de suite le périmètre de la première vague, sinon le délai ne tiendra pas.');
  if(!r.decideur && (suite||r.delai||r.budget||r.notes))
    al.push('Décideur non identifié : la question à poser avant de raccrocher.');
  return {alertes:al,conseils:co};
}
function recapQualif(p,r){
  var l=[];
  l.push('QUALIFICATION — '+(p.societe||''));
  l.push(new Date().toLocaleDateString('fr-FR'));
  l.push('');
  if(r.companeo&&r.companeo.length){
    l.push('CE QUE LE FOURNISSEUR A DÉJÀ DEMANDÉ');
    r.companeo.forEach(function(x){ l.push('  '+x.q+' : '+(x.r||'—')); });
    l.push('');
  }
  QUALIF.forEach(function(s){
    var lignes=s.q.filter(function(q){ return r[q.id]!==undefined && r[q.id]!==''; });
    if(!lignes.length)return;
    l.push(s.t.toUpperCase());
    lignes.forEach(function(q){ l.push('  '+q.q+' : '+(Array.isArray(r[q.id])?r[q.id].join(', '):r[q.id])); });
    l.push('');
  });
  l.push('OFFRE CONSEILLÉE : '+offreConseillee(r));
  var v=lireQualif(r);
  if(v.alertes.length){ l.push(''); l.push('POINTS À TRAITER'); v.alertes.forEach(function(a){ l.push('  - '+a); }); }
  if(v.conseils.length){ l.push(''); l.push('À PROPOSER'); v.conseils.forEach(function(a){ l.push('  - '+a); }); }
  return l.join('\n');
}

/* Le questionnaire ne s'affiche pas d'un bloc : une question à la fois,
   et on avance quand la réponse est donnée. C'est la seule forme qui
   tienne pendant un appel — un formulaire de trente-six champs se
   remplit après, de mémoire, donc mal. Et certaines questions ne se
   posent que si la précédente les appelle : on ne demande pas le
   nombre de modules à quelqu'un qui veut un abonnement BatiManager. */
/* ══ Recruter un partenaire ════════════════════════════════════════
   Un partenaire ne se qualifie pas comme un client. On ne lui vend
   rien : on lui propose de gagner de l’argent sur des demandes qu’il
   refuse déjà. Les questions servent donc à mesurer un gisement — ce
   qu’il voit passer, ce qu’il en fait aujourd’hui — avant de parler
   d’argent. */
/* Un appel de recrutement se joue en trois temps, et les mélanger le
   fait échouer. D'abord on dit qui on est et pourquoi on appelle, en
   deux phrases : personne n'écoute au-delà. Ensuite on vérifie qu'on
   parle à la bonne personne, parce qu'un excellent argumentaire servi
   à un standard ne vaut rien. Et seulement là, une fois le décideur au
   bout du fil, on parle sérieusement.

   Tant que la deuxième étape n'a pas répondu « c'est moi », aucune
   question de fond ne s'affiche : le commercial ne doit pas dérouler
   son gisement et sa commission devant une secrétaire. */
/* Trois issues à la question du standard, et non deux. Il peut être la
   bonne personne, il peut vous la passer tout de suite — et dans ce
   cas l'appel continue, on ne raccroche pas pour rappeler dans deux
   jours —, ou il faut noter ses coordonnées et revenir. */
var PASSE_MOI='On me la passe tout de suite';

/* Comment on dit la commission. Si elle a déjà été convenue pendant
   l'appel, on la répète telle quelle : un chiffre qu'on a dit deux
   fois est un chiffre qu'on ne renégocie pas. Sinon, la formule
   générale, qui laisse la porte ouverte. */
function ditCommission(r,act){
  var t=String(r.pt_taux||'').trim();
  if(r.pt_remuneration==='Pourcentage du montant signé'&&t)
    return t+' % du montant hors taxes de chaque affaire signée grâce à vous';
  if(r.pt_remuneration==='Montant fixe par contact transmis'&&t)
    return t+' € par contact qualifié que vous nous transmettez';
  if(r.pt_remuneration==='Montant fixe par affaire signée'&&t)
    return t+' € par affaire signée grâce à vous';
  return act==='tiimizy'
    ? 'une commission sur chaque abonnement signé grâce à vous, en pourcentage ou en montant fixe, au choix'
    : 'une commission sur chaque projet signé grâce à vous, en pourcentage ou en montant fixe, au choix';
}

/* Les objections qu'on entend vraiment, et ce qu'on y répond. Une
   objection n'est pas un refus : c'est la question que la personne
   n'a pas osé poser. On y répond en une respiration, puis on repose
   une question, sinon on laisse un silence qui se referme. */
var OBJECTIONS=[
 'Rien, il est d’accord pour continuer',
 'On a déjà un partenaire',
 'Je n’ai pas le temps',
 'Envoyez-moi un mail',
 'Ça n’intéresse pas mes clients',
 'Combien ça me rapporte ?',
 'Je ne veux pas engager ma responsabilité',
 'Ce n’est pas le moment'
];
function repliqueObjection(r,act){
  var o=r.pt_objection||'', c=ditCommission(r,act);
  var T2=act==='tiimizy';
  switch(o){
   case 'On a déjà un partenaire':
    return '« Très bien, je ne cherche pas à prendre sa place. Deux questions, juste pour '
      +'situer : il vous reverse combien, et il vous tient au courant de ce qui se passe '
      +'avec vos clients ? Si l’une des deux réponses vous fait hésiter, on vaut la peine '
      +'d’être comparés. » Puis laissez-le répondre.';
   case 'Je n’ai pas le temps':
    return '« C’est précisément pour ça que je vous appelle : vous n’avez rien à faire. Un '
      +'nom, un numéro, et on prend le relais. Le temps, c’est nous qui le mettons, pas '
      +'vous. Vous en avez combien, des clients dans ce cas, à la louche ? »';
   case 'Envoyez-moi un mail':
    return '« Avec plaisir, je vous l’envoie pendant qu’on parle. Je peux juste vous poser '
      +'deux questions avant, pour qu’il soit utile et pas générique ? » Prenez son '
      +'adresse tout de suite, puis continuez : un mail promis sans échange derrière '
      +'ne se lit pas.';
   case 'Ça n’intéresse pas mes clients':
    return T2
      ? '« Vous seriez surpris : dans le bâtiment, la plupart des entreprises de dix salariés '
        +'suivent encore leurs chantiers sur un tableur et font leurs métrés à la main. Ce n’est '
        +'pas qu’elles n’en ont pas besoin, c’est qu’elles ne savent pas que ça existe à ce prix. '
        +'Vous en avez combien, des clients dans le bâtiment ? »'
      : '« Il y a quelques années, je vous aurais donné raison : un logiciel sur mesure coûtait '
        +'le prix d’un camion. Aujourd’hui on livre un outil de gestion en quelques semaines, '
        +'pour environ le quart du prix d’une agence. Vos clients qui pestent contre leurs '
        +'tableurs se posent déjà la question, ils ne savent juste pas à qui la poser. »';
   case 'Combien ça me rapporte ?':
    return (r.pt_taux&&r.pt_remuneration&&r.pt_remuneration!=='Il n’a pas d’avis')
      ? '« '+c.charAt(0).toUpperCase()+c.slice(1)+'. C’est ce qu’on vient de dire, et '
        +'c’est ce qui sera écrit noir sur blanc dans le contrat. Rien de caché. »'
      : '« '+c.charAt(0).toUpperCase()+c.slice(1)+'. Et c’est vous qui choisissez la '
        +'forme. On peut le fixer ensemble maintenant, en deux minutes, et ça sera écrit '
        +'noir sur blanc dans le contrat. Vous préférez un pourcentage ou un fixe ? »';
   case 'Je ne veux pas engager ma responsabilité':
    return '« Vous n’engagez rien, et c’est écrit. Vous n’êtes ni vendeur, ni garant, ni '
      +'mandataire : vous mettez en relation, point. C’est nous qui portons la '
      +'prestation'+(T2?', la mise en service et le support':', la livraison et la maintenance')+'. Le contrat tient '
      +'sur une page, et je vous l’envoie pour que vous le lisiez tranquillement. »';
   case 'Ce n’est pas le moment':
    return '« Je comprends. Je vous envoie le lien, il reste ouvert sans limite, et je vous '
      +'rappelle quand ? » Obtenez une date précise, notez « Rappeler » avec cette date. '
      +'Un « je vous rappelle un de ces jours » ne revient jamais.';
   default:
    return 'Aucune objection : passez à la suite sans en inventer une.';
  }
}
function BONNE(r){ return r.pt_qui==='Oui, c’est moi' || r.pt_qui===PASSE_MOI; }
function PASBONNE(r){ return !!r.pt_qui && !BONNE(r); }

/* Un texte peut dépendre de la maison. On l'écrit alors comme un objet
   à deux entrées, et c'est la fiche appelée qui choisit. Sans ça, un
   commercial qui vend nos logiciels se retrouvait à parler de
   sur-mesure à un économiste de la construction. */
function T(v,act){
  if(v&&typeof v==='object'&&!Array.isArray(v)) return v[act]||v.bornistes||v.tiimizy||'';
  return v;
}

/* La toute première phrase, celle qui sera dite neuf fois sur dix à un
   standard. Elle ne vend rien, ne présente rien : elle demande la
   bonne personne, et c'est tout. Un standard ne transmet pas un
   argumentaire, il transmet une demande claire. */
function ouvertureCourte(p,style){
  var moi=(MON_NOM||'').split(' ')[0]||MON_NOM||'';
  var qui=(p.type&&String(p.type).trim())?String(p.type).trim().toLowerCase():'';
  /* Deux appels, deux premières phrases. On ne propose pas un contrat
     d’apport d’affaires à un hôtelier qu’on veut équiper : c’est le
     meilleur moyen de se faire raccrocher au nez dès la dixième
     seconde. Quand un fournisseur nous a donné le nom du dirigeant, on
     le demande par son nom : le standard passe, sans poser de
     question. */
  if(style==='client'){
    var nom=nomInterlocuteur(p);
    var demande=nom
      ? 'Je souhaite parler à '+nom+(posteInterlocuteur(p)?', '+posteInterlocuteur(p).toLowerCase():'')+'.'
      : (p.activite==='tiimizy'
          ? 'Je cherche la personne qui suit les chantiers et les chiffrages.'
          : 'Je cherche le dirigeant, ou la personne qui s’occupe de l’organisation.');
    var c=p.activite==='tiimizy'
      ? '« Bonjour, '+moi+', d’ONIQ. On édite des logiciels pour les entreprises du bâtiment, '
        +'le suivi de chantier et le métré. '+demande+' »'
      : '« Bonjour, '+moi+', d’ONIQ. On construit des logiciels sur mesure pour les PME. '
        +demande+' »';
    return c+'\n\nSi on vous demande « c’est à quel sujet ? » : '
      +(p.activite==='tiimizy'
        ? '« Le suivi des chantiers et le temps passé sur les métrés. Deux minutes, pas plus. »'
        : '« Les outils de gestion de l’entreprise : devis, planning, facturation. Deux minutes, pas plus. »')
      +' Rien de plus au standard. S’il hésite : « Je peux avoir son nom, que je le rappelle '
      +'directement ? »';
  }
  var t=p.activite==='tiimizy'
    ? '« Bonjour, '+moi+', d’ONIQ. On édite des logiciels pour les entreprises du bâtiment, et '
      +'on monte des partenariats avec des '+(qui||'cabinets comme le vôtre')+'. Je cherche '
      +'la personne qui s’occupe de ça chez vous, vous pouvez me la passer ? »'
    : '« Bonjour, '+moi+', d’ONIQ. On construit des logiciels sur mesure pour les PME, '
      +'et on travaille en apport d’affaires avec des '+(qui||'professionnels '
      +'qui, comme vous, conseillent les entreprises')+'. Je cherche la personne qui s’occupe des '
      +'partenariats, vous pouvez me la passer ? »';
  return t+'\n\nSi on vous demande « c’est à quel sujet ? » : « Un partenariat commercial : '
    +'on reverse une commission sur les clients qu’on nous présente. » Rien de plus au '
    +'standard. S’il hésite : « Je peux avoir son nom, que je le rappelle directement ? »';
}

function questionsPartenaire(r,act){
  var a=(act==='tiimizy'||act==='bornistes')?act:'bornistes';
  var l=[];
  QUALIF_PARTENAIRE.forEach(function(sec){
    sec.q.forEach(function(q){
      if(q.si&&!q.si(r))return;
      /* On rend une copie avec les textes de la bonne maison : le
         tableau d'origine reste intact pour l'appel suivant. */
      var c={}; for(var k in q)c[k]=q[k];
      /* Un texte peut dépendre des réponses déjà données : la réplique
         à une objection, le rappel de la commission convenue. Il est
         alors écrit comme une fonction, appelée ici. */
      c.q=(typeof q.q==='function')?q.q(r,a):T(q.q,a);
      c.a=T(q.a,a); if(q.o)c.o=T(q.o,a);
      l.push({s:sec.t,q:c});
    });
  });
  return l;
}

      c.q=(typeof q.q==='function')?q.q(r,a):T(q.q,a);
      c.a=T(q.a,a); if(q.o)c.o=T(q.o,a);

/* ══ Le mois annoncé ═══════════════════════════════════════════════
   « Ce sera pour décembre » est la réponse la plus utile d'un appel, et
   celle qu'on perd le plus souvent. Notée comme un mois, elle fait
   trois choses toute seule : elle pose le rappel au premier du mois
   d'avant, elle arrête les relances de devis d'ici là, et elle écrit
   sur la fiche pourquoi on ne fait rien en attendant. */
var MOIS_FR=['janvier','février','mars','avril','mai','juin','juillet','août',
  'septembre','octobre','novembre','décembre'];
function moisVise(v){
  var m=/^(\d{4})-(\d{2})$/.exec(String(v||'').trim());
  if(!m)return null;
  var an=+m[1], mo=+m[2];
  if(mo<1||mo>12)return null;
  var debut=new Date(Date.UTC(an,mo-1,1));
  /* Le premier du mois précédent, à 8 h UTC : neuf heures à Paris en
     hiver, dix en été. Assez tôt pour que la fiche soit dans la file du
     matin. */
  var rap=new Date(Date.UTC(an,mo-2,1,8,0,0));
  var demain=new Date(Date.now()+864e5);
  if(rap.getTime()<demain.getTime())rap=demain;   /* mois déjà proche : on rappelle demain */
  return {echeance:debut.toISOString().slice(0,10), rappel:rap.toISOString(),
          libelle:(MOIS_FR[mo-1]||'')+' '+an};
}
async function poserEcheance(table,id,v){
  var e=moisVise(v); if(!e||!id)return null;
  try{
    await modifier(table,'id=eq.'+id,{echeance_le:e.echeance,rappel_le:e.rappel,
      prochaine:'Projet annoncé pour '+e.libelle+' : reprendre contact'});
  }catch(err){ return null; }
  return e;
}

/* Ce que les réponses disent d’un partenaire. Le but n’est pas de
   chiffrer un devis mais de savoir s’il faut un contrat, un simple
   accord verbal, ou rien du tout. */
function lireQualifPartenaire(r){
  var al=[], co=[];
  if(r.pt_qui&&r.pt_qui!=='Oui, c’est moi')
    al.push('Ce n’est pas la bonne personne : ne déroulez pas l’argumentaire. Prenez le nom, '
      +'la ligne directe et le bon moment, remerciez, et notez « Rappeler ».');
  var d=Number(r.pt_demandes||0), v=Number(r.pt_volume||0);
  if(r.pt_aujourdhui==='Il les refuse' && d>0)
    co.push('Il refuse ' + d + ' demande' + (d>1?'s':'') + ' par mois : c’est exactement l’argent qu’on lui propose de récupérer. Reprenez son chiffre.');
  if(r.pt_aujourdhui==='Il les fait lui-même')
    al.push('Il les fait lui-même : ce n’est pas un apporteur, c’est un confrère. Proposez-lui la sous-traitance des projets qu’il ne peut pas prendre, en marque blanche.');
  if(r.pt_deja==='Oui, un seul'||r.pt_deja==='Oui, plusieurs')
    al.push('Il a déjà un prestataire : demandez ce qui ne va pas chez l’autre, sinon vous serez le numéro deux qu’on appelle quand le premier ne répond pas.');
  if(d>0 && d<2)
    al.push('Moins de deux demandes par mois : un contrat d’affiliation coûtera plus cher à suivre qu’il ne rapportera. Gardez-le en apport ponctuel.');
  if(d>=5)
    co.push('Cinq demandes par mois ou plus : c’est un vrai gisement, allez jusqu’au contrat signé et au compte partenaire.');
  if(v>0 && d>0 && v>d*3)
    al.push('Il annonce ' + v + ' dossiers sur trois mois pour ' + d + ' demandes par mois : le chiffre est optimiste, ne calez pas la commission dessus.');
  if(r.pt_remuneration==='Montant fixe par contact transmis' && d<5)
    al.push('Fixe par contact avec un volume faible : vous payez des contacts qui ne signent pas. Proposez plutôt un pourcentage.');
  if(r.pt_decideur==='C’est le siège / le groupe')
    al.push('La décision est au siège : votre interlocuteur ne peut pas signer. Demandez-lui le nom de la bonne personne avant de raccrocher.');
  if(r.pt_decideur==='Il doit en parler à un associé')
    co.push('Proposez de rappeler ensemble avec l’associé : un contrat qui attend une discussion interne ne revient jamais.');
  if(!r.pt_email && (r.pt_taux||r.pt_suite))
    al.push('Pas d’adresse e-mail : vous ne pourrez rien lui envoyer. C’est la seule chose à ne pas rater.');
  return {alertes:al,conseils:co};
}

/* Ce que la fiche répond à notre place.

   Un lead arrive souvent avec le nom du dirigeant. Poser la question
   au téléphone, la réponse déjà affichée à l'écran, dit au client
   qu'on n'a pas lu sa demande.

   Les questions ainsi remplies sortent du questionnaire guidé mais
   restent dans « Tout voir » : une adresse reprise d'un fournisseur
   peut être fausse, et il faut pouvoir la corriger. */
function prerempliesDe(p,r){
  var d={};
  if(!p)return d;
  if(!r.decideur && p.dirigeant){ r.decideur=p.dirigeant; d.decideur=true; }
  else if(r.decideur && p.dirigeant && r.decideur===p.dirigeant) d.decideur=true;
  return d;
}

function questionsVisibles(r,sauf){
  var l=[];
  QUALIF.forEach(function(sec){
    sec.q.forEach(function(q){
      if(q.si && !q.si(r))return;
      if(sauf && sauf[q.id])return;
      l.push({s:sec.t,q:q});
    });
  });
  return l;
}
function questionsToutes(r){
  return questionsVisibles(r);
}
async function qualifier(p,apres){
  var r={};
  try{
    var d=await lire('ls_qualif','select=*&prospect_id=eq.'+p.id+'&limit=1');
    if(d.length)r=d[0].reponses||{};
  }catch(e){}
  var DEJA=prerempliesDe(p,r);
  var pos=0, tout=false;

  var f=document.createElement('div');
  f.className='fond-modale';
  document.body.appendChild(f);

  /* Fermer ne doit jamais effacer. Dix-sept questions posees au
     telephone ne peuvent pas disparaitre parce que le client a dit
     « je vous rappelle » et qu'on a appuye sur Echap. On enregistre
     ce qui est saisi, en silence, et on ferme. */
  var SAUVE=null;
  function sauverVite(){
    clearTimeout(SAUVE);
    SAUVE=setTimeout(function(){ poserQualif(p,r,false).catch(function(){}); },500);
  }
  var ferme=function(){
    if(!tout)lireCourant(); else lireTout();
    clearTimeout(SAUVE);
    if(Object.keys(r).length)poserQualif(p,r,false).catch(function(){});
    f.remove();
  };

  function total(){ return questionsVisibles(r,DEJA).length; }
  function faits(){ var l=questionsVisibles(r,DEJA);
    return l.filter(function(x){ return r[x.q.id]!==undefined&&r[x.q.id]!==''; }).length; }

  function lireCourant(){
    var l=questionsVisibles(r,DEJA); var e=l[pos]; if(!e)return;
    var q=e.q;
    if(q.type==='multi'){
      var v=$$('[name="q-'+q.id+'"]:checked',f).map(function(i2){return i2.value;});
      if(v.length)r[q.id]=v; else delete r[q.id];
    }else{
      var el=$('#q-'+q.id,f);
      if(el){ var v2=String(el.value).trim(); if(v2!=='')r[q.id]=v2; else delete r[q.id]; }
    }
  }

  function peindre(){
    var l=questionsVisibles(r,DEJA);
    if(pos>=l.length){ peindreFin(); return; }
    var e=l[pos], q=e.q, pct=Math.round(faits()/Math.max(1,l.length)*100);
    var v=lireQualif(r);
    f.innerHTML='<div class="modale" style="width:min(660px,100%)">'
      +'<header><div><h3>'+ech(p.societe)+'</h3>'
        +'<div class="sec" style="margin-top:2px">'+ech(e.s)+' · question '+(pos+1)+' sur '+l.length+'</div></div>'
        +'<button class="fermer" data-x>&times;</button></header>'
      +'<div class="barre-p" style="border-radius:0"><i style="width:'+pct+'%"></i></div>'
      +'<div class="corps">'
        +'<div class="q-grande">'+ech(q.q)+'</div>'
        +(q.a?'<p class="sec" style="margin:8px 0 16px;line-height:1.6;max-width:60ch">'+ech(q.a)+'</p>':'<div style="height:12px"></div>')
        +'<div class="q-rep">'+champQ(q,r[q.id])+'</div>'
        +blocPrecision(q)
        +(v.alertes.length?'<div class="q-alerte">'+v.alertes.slice(-2).map(ech).join('<br>')+'</div>':'')
      +'</div>'
      +'<footer><span style="display:flex;gap:7px">'
        +'<button class="btn" data-prec'+(pos===0?' disabled':'')+'>Précédent</button>'
        +'<button class="btn" data-tout>Tout voir</button></span>'
      +'<span style="display:flex;gap:7px">'
        +'<button class="btn" data-passer>Passer</button>'
        +'<button class="btn fort" data-suiv>Suivant</button></span></footer></div>';
    brancher();
    brancherPrecision(f);
    var prem=$('.q-rep select,.q-rep input,.q-rep textarea',f);
    if(prem)prem.focus();
  }

  function peindreFin(){
    var v=lireQualif(r), l=questionsVisibles(r,DEJA);
    f.innerHTML='<div class="modale" style="width:min(700px,100%)">'
      +'<header><div><h3>'+ech(p.societe)+' — c’est fini</h3>'

        +'<button class="fermer" data-x>&times;</button></header>'
      +'<div class="corps">'
        +'<div class="rangee" style="padding-top:0"><div><b>Offre conseillée</b>'
          +'<p>'+ech(offreConseillee(r))+'</p></div></div>'
        +(v.alertes.length?('<div class="rangee"><div style="width:100%">'
          +'<b style="color:var(--retard)">À traiter avant de chiffrer</b>'
          +'<p>'+v.alertes.map(ech).join('<br>')+'</p></div></div>'):'')
        +(v.conseils.length?('<div class="rangee"><div style="width:100%">'
          +'<b style="color:var(--ok)">À proposer</b>'
          +'<p>'+v.conseils.map(ech).join('<br>')+'</p></div></div>'):'')
      +'</div>'
      +'<footer><span style="display:flex;gap:7px">'
        +'<button class="btn" data-prec>Revenir</button>'
        +'<button class="btn" data-tout>Tout voir</button>'

      +'<button class="btn" data-ok data-puis="devis">Enregistrer et chiffrer</button>'
      +'<button class="btn fort" data-ok>Enregistrer</button></span></footer></div>';
    brancher();

  function peindreTout(){
    var l=questionsVisibles(r);
    f.innerHTML='<div class="modale" style="width:min(880px,100%)">'
      +'<header><div><h3>'+ech(p.societe)+'</h3>'
        +'<div class="sec" style="margin-top:2px">Toutes les questions retenues, d’un coup</div></div>'
        +'<button class="fermer" data-x>&times;</button></header>'
      +'<div class="corps">'
      +QUALIF.map(function(sec){
        var dedans=l.filter(function(x){return x.s===sec.t;});
        if(!dedans.length)return '';
        return '<div style="margin-bottom:20px"><div class="groupe" style="margin:0 0 10px;padding:0">'
          +ech(sec.t)+'</div><div class="grille2">'
          +dedans.map(function(x){ return champQ(x.q,r[x.q.id]); }).join('')+'</div></div>';
      }).join('')
      +'</div>'
      +'<footer><button class="btn" data-guide>Reprendre question par question</button>'
      +'<span><button class="btn" data-copier>Copier</button> '
      +'<button class="btn fort" data-ok>Enregistrer</button></span></footer></div>';
    brancher();
  }

  function lireTout(){
    questionsVisibles(r).forEach(function(x){
      var q=x.q;
      if(q.type==='multi'){
        var v=$$('[name="q-'+q.id+'"]:checked',f).map(function(i2){return i2.value;});
        if(v.length)r[q.id]=v; else delete r[q.id];
      }else{
        var el=$('#q-'+q.id,f);
        if(el){ var v2=String(el.value).trim(); if(v2!=='')r[q.id]=v2; else delete r[q.id]; }
      }
    });
  }

  function brancher(){
    $$('[data-x]',f).forEach(function(b){ b.onclick=ferme; });
    var pr=$('[data-prec]',f);
    if(pr)pr.onclick=function(){ if(!tout)lireCourant(); pos=Math.max(0,pos-1); peindre(); };
    var su=$('[data-suiv]',f);
    if(su)su.onclick=function(){ lireCourant(); sauverVite(); pos++; peindre(); };
    var pa=$('[data-passer]',f);
    if(pa)pa.onclick=function(){ pos++; peindre(); };
    var tt=$('[data-tout]',f);
    if(tt)tt.onclick=function(){ if(!tout)lireCourant(); tout=true; peindreTout(); };
    var gd=$('[data-guide]',f);
    if(gd)gd.onclick=function(){ lireTout(); tout=false; pos=0; peindre(); };
    var cp=$('[data-copier]',f);
    if(cp)cp.onclick=function(){ if(tout)lireTout(); copier(recapQualif(p,r),this); };
    $$('[data-ok]',f).forEach(function(ok){ ok.onclick=async function(){
      if(tout)lireTout();
      var b=this, versDevis=b.dataset.puis==='devis';
      b.disabled=true; b.textContent='Enregistrement…';
      try{
        await poserQualif(p,r,true);
        clearTimeout(SAUVE);
        f.remove();
        if(versDevis)devisAuto(p);
        else if(apres)apres();
      }catch(e){
        b.disabled=false; b.textContent=versDevis?'Enregistrer et chiffrer':'Enregistrer';
        alerteCopiable('Enregistrement refusé',String(e.message||e).slice(0,300));
      }
    }; });
    /* Entrée pour avancer : les mains restent sur le clavier. */
    f.onkeydown=function(e){
      if(e.key==='Enter'&&!tout&&e.target.tagName!=='TEXTAREA'){ e.preventDefault();
        var b=$('[data-suiv]',f); if(b)b.click(); }
      if(e.key==='Escape')ferme();
    };
  }
  peindre();
}

function champQ(q,v){
  var large=(q.type==='zone'||q.type==='multi'||q.type==='texte'&&q.id==='adresse')?' large':'';
  var inn;
  if(q.type==='radio'||q.type==='ouinon'){
    var o=q.type==='ouinon'?['Oui','Non','Je ne sais pas']:q.o;
    /* Jusqu'à six choix, des boutons : un clic note la réponse et
       passe à la suite. Une liste déroulante, c'est trois gestes par
       question, dix-sept fois, au téléphone. */
    if(o.length<=6){
      inn='<input type="hidden" id="q-'+q.id+'" value="'+ech(v||'')+'">'
        +'<div class="choix" role="radiogroup">'+o.map(function(x){
          return '<button type="button" class="btn'+(v===x?' fort':'')+'" data-choix="'+ech(x)
            +'" data-pour="q-'+q.id+'">'+ech(x)+'</button>';
        }).join('')+'</div>';
    }else{
      inn='<select id="q-'+q.id+'"><option value="">—</option>'
        +o.map(function(x){ return '<option'+(v===x?' selected':'')+'>'+ech(x)+'</option>'; }).join('')+'</select>';
    }
  }else if(q.type==='multi'){
    inn='<div style="display:flex;flex-wrap:wrap;gap:12px;padding:4px 0">'+q.o.map(function(x){
      var c=Array.isArray(v)&&v.indexOf(x)>-1;
      return '<label style="display:flex;gap:7px;align-items:center;font-size:13.5px">'
        +'<input type="checkbox" name="q-'+q.id+'" value="'+ech(x)+'"'+(c?' checked':'')+'> '+ech(x)+'</label>';
    }).join('')+'</div>';
  }else if(q.type==='zone'){
    inn='<textarea id="q-'+q.id+'">'+ech(v||'')+'</textarea>';
  }else if(q.type==='nombre'){
    inn='<input id="q-'+q.id+'" type="number" min="0" value="'+ech(v!==undefined?v:(q.valeur!==undefined?q.valeur:''))+'">';
  }else if(q.type==='mois'){
    /* Un mois, pas une date : personne ne connaît le jour six mois à
       l'avance, et demander plus précis fait répondre « je ne sais
       pas », ce qui ne vaut rien. */
    inn='<input id="q-'+q.id+'" type="month" value="'+ech(v||'')+'">';
  }else{
    inn='<input id="q-'+q.id+'" value="'+ech(v||'')+'">';
  }
  return '<div class="champ'+large+'"><label for="q-'+q.id+'">'+ech(q.q)
    +(q.opt?'<span class="sec" style="font-weight:400"> · facultatif</span>':'')+'</label>'+inn
    +(q.a?'<div class="aide">'+ech(q.a)+'</div>':'')+'</div>';
}

/* ══ La fiche client ═══════════════════════════════════════════════
   Tout ce que la maison sait d'un compte sur un seul écran : ses
   coordonnées, sa qualification, ses appels, ses devis, ses projets,
   son abonnement, et les messages partis chez lui. Chercher trois
   informations dans trois onglets, c'est ne pas les regarder. */
async function ficheClient(id){
  var p;
  try{ p=(await lire('ls_prospects','select=*&id=eq.'+id+'&limit=1'))[0]; }catch(e){}
  if(!p)return;
  var res=await Promise.all([
    lire('ls_qualif','select=*&prospect_id=eq.'+id+'&limit=1').catch(function(){return [];}),
    lire('ls_appels','select=*&prospect_id=eq.'+id+'&order=created_at.desc&limit=30').catch(function(){return [];}),
    lire('ls_devis','select=*&societe=eq.'+encodeURIComponent(p.societe)+'&order=cree_le.desc&limit=20').catch(function(){return [];}),
    lire('ls_chantiers','select=*&societe=eq.'+encodeURIComponent(p.societe)+'&limit=20').catch(function(){return [];}),
    lire('ls_abonnements','select=*&societe=eq.'+encodeURIComponent(p.societe)+'&limit=10').catch(function(){return [];}),
    lire('ls_envois','select=*&prospect_id=eq.'+id+'&order=cree_le.desc&limit=20').catch(function(){return [];})
  ]);
  var qu=res[0][0], appels=res[1], devis=res[2], chantiers=res[3], abos=res[4], envois=res[5];
  var seq=''; try{ seq=await blocSequences(p.email,null); }catch(e){}

  var f=document.createElement('div');
  f.className='fond-modale';
  f.innerHTML='<div class="modale" style="width:min(920px,100%)">'
    +'<header><div><h3>'+ech(p.societe)+'</h3><div class="sec" style="margin-top:2px">'
      +ech([p.ville,p.effectif&&p.effectif+' salariés',p.ca&&('CA '+euro(p.ca))].filter(Boolean).join(' · '))
      +'</div></div><button class="fermer" data-x>&times;</button></header>'
    +'<div class="corps">'
      +seq
      +'<div class="bilan" style="margin-bottom:18px">'
        +'<div class="b"><div class="l">Étape</div><div class="v" style="font-size:17px">'+ech(joli(p.etape))+'</div>'
          +'<div class="sec">'+ech(LAB[p.activite]||'')+'</div></div>'
        +'<div class="b"><div class="l">Qualification</div><div class="v">'+(qu?nb(qu.complet)+' %':'—')+'</div>'
          +'<div class="sec">'+(qu?('mise à jour '+depuis(qu.maj_le)):'jamais faite')+'</div></div>'
        +'<div class="b"><div class="l">Appels</div><div class="v">'+nb(appels.length)+'</div>'
          +'<div class="sec">'+(appels.length?depuis(appels[0].created_at):'aucun')+'</div></div>'
        +'<div class="b"><div class="l">Devis</div><div class="v">'
          +euro(devis.reduce(function(s,d){return s+(+d.montant_ht||0);},0))+'</div>'
          +'<div class="sec">'+nb(devis.length)+' au total</div></div>'
      +'</div>'
      +'<div class="rangee"><div><b>Coordonnées</b><p>'
        +ech(p.dirigeant||'dirigeant non identifié')
        +(p.tel?' · <a class="mono" href="tel:'+ech(String(p.tel).replace(/\s/g,''))+'">'+ech(p.tel)+'</a>':'')
        +(p.email?' · <a href="mailto:'+ech(p.email)+'">'+ech(p.email)+'</a>':'')
        +(p.source?'<br>Origine : '+ech(p.source):'')
        +(p.owner_email?' · Suivi par '+ech(p.owner_email.split('@')[0]):'')
        +'</p></div><button class="btn mini" data-mod>Modifier</button></div>'
      +(p.prochaine?'<div class="rangee"><div><b>Prochaine action</b><p>'+ech(p.prochaine)
        +(p.rappel_le?' — '+date(p.rappel_le):'')+'</p></div></div>':'')
      +(p.note?'<div class="rangee"><div><b>Notes</b><p style="white-space:pre-wrap">'+ech(p.note)+'</p></div></div>':'')
      +'<div class="rangee"><div><b>Qualification</b><p>'
        +(qu?ech([qu.type_site,qu.nb_bornes+' utilisateur'+(qu.nb_bornes>1?'s':''),qu.puissance,qu.reseau]
            .filter(Boolean).join(' · '))
          +(qu.alertes?'<br><span style="color:var(--retard)">'+ech(qu.alertes)+'</span>':'')
         :'Pas encore faite. C’est elle qui permet d’envoyer un devis sans rappeler.')+'</p></div>'
        +'<div style="display:flex;gap:7px">'
        +(qu?'<button class="btn mini" data-recap>Copier</button>':'')
        +'<button class="btn mini" data-pieces>Pièces</button>'
        +'<button class="btn mini" data-quest>'+(qu?'Reprendre':'Le questionnaire')+'</button></div></div>'
      +blocHisto('Les appels',appels.map(function(a){
          return {t:(RESULTATS.filter(function(r){return r.id===a.resultat;})[0]||{lab:a.resultat}).lab,
                  s:(a.owner_email||'').split('@')[0],d:a.created_at}; }))
      +blocHisto('Les devis',devis.map(function(d){
          return {t:(DSTAT[d.statut]||d.statut)+' — '+euro(d.montant_ht)+(d.objet?' · '+d.objet:''),
                  s:'',d:d.cree_le}; }))
      +blocHisto('Projets et déploiements',chantiers.map(function(c){
          var L=LIVRAISON[c.activite]||LIVRAISON.bornistes;
          return {t:(L.etapes[c.statut]||c.statut)+(c.titre?' — '+c.titre:''),s:'',d:c.cree_le}; }))
      +blocHisto('Les abonnements',abos.map(function(a){
          return {t:(ASTAT[a.statut]||a.statut)+' — '+euro(a.montant_mois)+' par mois, '+a.utilisateurs+' utilisateurs',
                  s:'',d:a.cree_le}; }))
      +blocHisto('Les messages partis',envois.map(function(e){
          return {t:(ESTAT[e.statut]||e.statut)+' — '+(e.canal==='sms'?'SMS':'e-mail')+' · '+(e.objet||String(e.corps).slice(0,60)),
                  s:'',d:e.cree_le}; }))
    +'</div>'
    +'<footer><span style="display:flex;gap:7px">'
    +'<button class="btn" data-devis>+ Devis</button>'
    +'<button class="btn" data-mailc>Envoyer un mail</button>'
    +'<button class="btn" data-suppr>Supprimer</button></span>'
    +'<span style="display:flex;gap:7px"><button class="btn" data-x>Fermer</button>'
    +'<button class="btn" data-rappel>'+(p.rappel_le?'Changer le rappel':'Rappeler plus tard')+'</button>'
    +'<button class="btn fort" data-qualif>Appeler '+ech((p.dirigeant||'').split(' ')[0]||'ce compte')+'</button></span></footer></div>';
  document.body.appendChild(f);
  brancherSequences(f,function(){ f.remove(); ficheClient(id); });
  var ferme=function(){ f.remove(); };
  $$('[data-x]',f).forEach(function(b){ b.onclick=ferme; });
  f.addEventListener('click',function(e){ if(e.target===f)ferme(); });
  $('[data-mod]',f).onclick=function(){ ferme(); ficheCompte(p); };
  /* Poser un rappel sans être en session d'appels. Un numéro qu'on
     compose depuis sa fiche, une promesse faite dans un couloir : la
     date doit pouvoir s'écrire là, tout de suite, sans démarrer une
     heure d'appels pour ça. */
  $('[data-rappel]',f).onclick=function(){ ferme(); poserRappel(p,function(){ ficheClient(id); }); };
  /* Supprimer efface aussi la qualification et les appels liés. On
     demande donc une deuxième fois : dans un CRM partagé à quinze,
     une suppression par erreur ne se rattrape pas. */
  $('[data-suppr]',f).onclick=function(){
    var b=this;
    if(b.dataset.sur!=='1'){
      b.dataset.sur='1'; b.classList.add('danger');
      b.textContent='Confirmer la suppression';
      setTimeout(function(){
        if(b.dataset.sur==='1'){ b.dataset.sur=''; b.classList.remove('danger');
          b.textContent='Supprimer'; }
      },5000);
      return;
    }
    b.disabled=true; b.textContent='Suppression…';
    (async function(){
      try{
        await tracer('compte.supprime',p.societe,p.id);
        await supprimer('ls_prospects','id=eq.'+p.id);
        ferme();
        if(SESSION&&SESSION.fiche&&SESSION.fiche.id===p.id){ SESSION.fiche=null; ecranSession(); }
        else aller(courante);
      }catch(e){
        b.disabled=false; b.textContent='Supprimer';
        alerteCopiable('Suppression refusée',String(e.message||e).slice(0,300));
      }
    })();
  };
  /* Deux gestes différents : « Le questionnaire » rouvre la
     qualification technique seule, « Appeler » ouvre la conduite
     d'appel entière, comme en session. */
  $$('[data-quest]',f).forEach(function(b){
    b.onclick=function(){ ferme(); qualifier(p,function(){ ficheClient(id); }); };
  });
  $$('[data-qualif]',f).forEach(function(b){
    b.onclick=function(){ ferme(); appelerFiche(p); };
  });
  var br=$('[data-recap]',f);
  if(br)br.onclick=function(){ copier(qu.recap||recapQualif(p,qu.reponses||{}),this); };
  var bp=$('[data-pieces]',f);
  if(bp)bp.onclick=function(){ ferme(); ecranPieces(p); };
  var bmc=$('[data-mailc]',f);
  if(bmc)bmc.onclick=function(){ ferme(); mailRapide(p); };
  $('[data-devis]',f).onclick=function(){
    ferme();
    ficheDevis({societe:p.societe,activite:p.activite,prospect_id:p.id,retourFiche:true,
      montant_ht:p.montant||0,acompte_pct:30,statut:'brouillon',owner_email:moi});
  };
}
function blocHisto(titre,lignes){
  if(!lignes.length)return '';
  return '<div class="rangee"><div style="width:100%"><b>'+ech(titre)+'</b>'
    +'<ul class="journal" style="margin-top:8px">'
    +lignes.slice(0,12).map(function(l){
      return '<li style="padding:8px 0"><span class="qd mono">'+heure(l.d)+'</span>'
        +(l.s?'<span class="qui">'+ech(l.s)+'</span>':'')
        +'<span>'+ech(l.t)+'</span></li>';
    }).join('')+'</ul></div></div>';
}

/* ══ Les pièces du dossier ═════════════════════════════════════════
   Quelques éléments, et la maquette peut partir en quelques jours. Il
   en manque un, et le dossier dort. D'où la liste : elle dit ce qu'on
   a, ce qu'il manque, et elle écrit toute seule le message qui
   réclame — uniquement ce qui manque, jamais la liste entière à
   quelqu'un qui a déjà répondu à la moitié. */
var PIECES=[
 {id:'processus', l:'Quelques lignes sur votre façon de travailler aujourd’hui : qui fait quoi, dans quel ordre', q:'irritant'},
 {id:'documents', l:'Des exemples de vos documents actuels : devis, factures, bons de commande, fichiers Excel'},
 {id:'utilisateurs', l:'La liste des personnes qui utiliseront l’outil, avec leur rôle'},
 {id:'export',    l:'Un export des données à reprendre (clients, articles, historiques), si vous en avez'},
 {id:'outils',    l:'Le nom des outils à connecter : logiciel comptable, banque, site internet', q:'interfaces'},
 {id:'charte',    l:'Votre logo et, si vous en avez une, votre charte graphique'},
 {id:'exemples',  l:'Un ou deux outils ou sites que vous trouvez bien faits, pour nous donner le ton'},
 {id:'plans',     l:'Pour OniMetri : les plans d’un chantier récent, en PDF'},
 {id:'decideur',  l:'Le nom de la personne qui validera la maquette', q:'decideur'}
];
/* Une pièce est acquise si elle a été cochée à la main, ou si la
   qualification y a déjà répondu. Redemander ce qu'on a déjà obtenu
   est la meilleure façon de perdre un dossier. */
function pieceAcquise(p,rep,pieces){
  if(pieces && pieces[p.id]) return true;
  if(p.q && rep && rep[p.q]!==undefined && rep[p.q]!=='' && rep[p.q]!=='Je ne sais pas'
     && !(Array.isArray(rep[p.q]) && !rep[p.q].length)) return true;
  return false;
}
/* Les plans ne se demandent qu'à qui a choisi OniMetri : les réclamer
   à un négociant qui veut un outil de devis n'aurait aucun sens. */
function piecesDe(rep){
  var lg=rep&&Array.isArray(rep.logiciels)?rep.logiciels:[];
  return PIECES.filter(function(x){ return x.id!=='plans'||lg.indexOf('OniMetri')>-1; });
}
function messagePieces(p,rep,pieces,source){
  var manque=piecesDe(rep).filter(function(x){ return !pieceAcquise(x,rep,pieces); });
  var liste=manque.map(function(x){ return '• '+x.l; }).join('\n');
  return 'Bonjour,\n\n'
    +'Vous nous avez récemment contactés'+(source?' via '+source:'')
    +' au sujet de votre projet.\n\n'
    +'Suite à notre échange, afin de préparer une maquette et un devis qui vous ressemblent, '
    +'pourriez-vous me transmettre les éléments suivants :\n\n'+liste+'\n\n'
    +'Rien n’a besoin d’être mis au propre : une photo, un fichier tel qu’il est, un message '
    +'de quelques lignes suffisent.\n\n'
    +'Dès réception, nous préparons votre maquette et revenons vers vous sous quelques jours.\n\n'
    +'Je reste bien entendu à votre disposition pour toute question.\n\n'
    +'Cordialement,\n'+(MON_NOM||(moi||'').split('@')[0]);
}
async function ecranPieces(p){
  var qu={},rep={},pieces={};
  try{
    var q=await lire('ls_qualif','select=*&prospect_id=eq.'+p.id+'&limit=1');
    if(q.length){ qu=q[0]; rep=qu.reponses||{}; pieces=qu.pieces||{}; }
  }catch(e){}
  var f=document.createElement('div');
  f.className='fond-modale';
  var dessine=function(){
    var manque=piecesDe(rep).filter(function(x){ return !pieceAcquise(x,rep,pieces); }).length;
    return '<div class="modale" style="width:min(760px,100%)">'
      +'<header><div><h3>Pièces du dossier — '+ech(p.societe)+'</h3>'
      +'<div class="sec" style="margin-top:2px">'+(manque
        ? manque+' élément'+(manque>1?'s':'')+' manquant'+(manque>1?'s':'')+' avant de préparer la maquette'
        : 'Dossier complet : la maquette peut démarrer')+'</div></div>'
      +'<button class="fermer" data-x>&times;</button></header>'
      +'<div class="corps"><div id="p-liste">'
      +piecesDe(rep).map(function(x){
        var ok=pieceAcquise(x,rep,pieces);
        var auto=ok && !pieces[x.id];
        return '<div class="tache'+(ok?' finie':'')+'">'
          +'<input class="coche" type="checkbox" data-p="'+x.id+'"'+(ok?' checked':'')
            +(auto?' disabled':'')+' aria-label="Reçu">'
          +'<div><b style="font-weight:500">'+ech(x.l)+'</b>'
          +(auto?'<div class="meta"><span class="etat e-ok">déjà dans la qualification</span></div>':'')
          +'</div><div class="cmd"></div></div>';
      }).join('')+'</div>'
      +'<div class="champ" style="margin-top:18px"><label>Le message à envoyer, avec seulement ce qui manque</label>'
      +'<textarea id="p-msg" style="min-height:260px">'+ech(messagePieces(p,rep,pieces,p.source))+'</textarea></div>'
      +'</div>'
      +'<footer><button class="btn" data-copier>Copier</button>'
      +'<span style="display:flex;gap:7px"><button class="btn" data-x>Fermer</button>'
      +'<button class="btn" data-ok>Marquer comme demandé</button>'
      +'<button class="btn fort" data-env data-lib="Envoyer la demande">Envoyer la demande</button>'
      +'</span></footer></div>';
  };
  f.innerHTML=dessine();
  document.body.appendChild(f);
  var ferme=function(){ f.remove(); };
  var brancher=function(){
    $$('[data-x]',f).forEach(function(b){ b.onclick=ferme; });
    $('[data-copier]',f).onclick=function(){ copier($('#p-msg',f).value,this); };
    var be=$('[data-env]',f);
    if(be)be.onclick=function(){
      var b=this;
      faireEnvoi(b,{dest:p.email,objet:'Votre projet — '+(p.societe||''),
        corps:$('#p-msg',f).value,prospect_id:p.id,societe:p.societe,activite:p.activite},
        function(){ var ok=$('[data-ok]',f); if(ok)ok.click(); });
    };
    $$('[data-p]',f).forEach(function(c){
      c.onchange=function(){
        pieces[c.dataset.p]=c.checked; if(!c.checked)delete pieces[c.dataset.p];
        var t=$('#p-msg',f).value, garde=t!==messagePieces(p,rep,pieces,p.source);
        f.innerHTML=dessine(); brancher();
      };
    });
    $('[data-ok]',f).onclick=async function(){
      var b=this; b.disabled=true; b.textContent='Enregistrement…';
      try{
        var rp=await appelle(URL_BASE+'/rest/v1/ls_qualif?on_conflict=prospect_id',
          {method:'POST',headers:entetes({'Prefer':'resolution=merge-duplicates'}),
           body:JSON.stringify({prospect_id:p.id,societe:p.societe,pieces:pieces,
             reponses:rep,par:moi,maj_le:new Date().toISOString()})});
        if(!rp.ok)throw new Error(await rp.text());
        var d=await lire('ls_devis','select=id&societe=eq.'+encodeURIComponent(p.societe)+'&limit=1');
        if(d.length) await modifier('ls_devis','id=eq.'+d[0].id,{elements_demandes_le:aujourdhui()});
        await modifier('ls_prospects','id=eq.'+p.id,
          {prochaine:'Attendre les pièces demandées'});
        await tracer('pieces.demandees',p.societe,p.id);
        ferme();
      }catch(e){ b.disabled=false; b.textContent='Enregistrer et marquer comme demandé'; }
    };
  };
  brancher();
}

/* ══ Le suivi ══════════════════════════════════════════════════════
   La question n'est jamais « où en est ce devis » mais « depuis combien
   de temps il n'a pas bougé ». Cet écran range donc par âge du silence,
   et chaque ligne porte le geste suivant à faire, pas seulement un
   statut. */
var ETAPES_SUIVI=[
  {id:'elements_demandes_le', l:'Éléments demandés',   geste:'Demander les pièces'},
  {id:'elements_recus_le',    l:'Éléments reçus',      geste:'Marquer les pièces reçues'},

/* Une étape franchie prouve celles d'avant : on n'envoie pas un devis
   sans avoir réuni les pièces, on ne relance pas un devis jamais
   envoyé. Les trous sont donc comblés à la date de l'étape suivante
   connue — jamais après elle, pour que la chronologie tienne. */
function comblerEtapes(d){
  var suite=null, change=false;
  for(var i=ETAPES_SUIVI.length-1;i>=0;i--){
    var v=d[ETAPES_SUIVI[i].id];
    if(v) suite=v;
    else if(suite){ d[ETAPES_SUIVI[i].id]=suite; change=true; }
  }
  return change;
}
function etapeCourante(d){
  comblerEtapes(d);
  var derniere=null, suivante=null;
  for(var i=0;i<ETAPES_SUIVI.length;i++){
    if(d[ETAPES_SUIVI[i].id]) derniere=ETAPES_SUIVI[i];
    else { suivante=ETAPES_SUIVI[i]; break; }
  }
  return {derniere:derniere,suivante:suivante};
}
function silence(d){
  var dates=ETAPES_SUIVI.map(function(e){ return d[e.id]; }).filter(Boolean).sort();
  var ref=dates.length?dates[dates.length-1]:d.cree_le;
  return Math.floor((Date.now()-new Date(ref).getTime())/864e5);
}

async function ecranSuivi(d){
  /* Si la base porte encore des trous (un devis chiffré part « envoyé »
     sans que personne ait coché les pièces), on les comble ici, pour de
     bon : l'écran et la base disent alors la même chose. */
  if(comblerEtapes(d)){
    var rattrap={};
    ETAPES_SUIVI.forEach(function(s){ rattrap[s.id]=d[s.id]||null; });
    try{ await modifier('ls_devis','id=eq.'+d.id,rattrap); }catch(e){}
  }
  var p=null;
  try{
    var r=await lire('ls_prospects','select=*&societe=eq.'+encodeURIComponent(d.societe)+'&limit=1');
    if(r.length)p=r[0];
  }catch(e){}
  var f=document.createElement('div');
  f.className='fond-modale';
  f.innerHTML='<div class="modale" style="width:min(720px,100%)">'
    +'<header><div><h3>'+ech(d.societe)+'</h3>'
      +'<div class="sec" style="margin-top:2px">'+euro(d.montant_ht)+' · '
      +ech(DSTAT[d.statut]||d.statut)+' · sans nouvelle depuis '+silence(d)+' jours</div></div>'
      +'<button class="fermer" data-x>&times;</button></header>'
    +'<div class="corps">'
    +ETAPES_SUIVI.map(function(s){
      var fait=d[s.id];
      return '<div class="rangee"><div><b'+(fait?'':' style="color:var(--faible)"')+'>'+ech(s.l)+'</b>'
        +'<p>'+(fait?'le '+date(fait):'pas encore')+'</p></div>'
        +'<div style="display:flex;gap:7px">'
        +(fait?'<button class="btn mini" data-eff="'+s.id+'">Effacer</button>'
             :'<button class="btn mini" data-fait="'+s.id+'">'+ech(s.geste)+'</button>')
        +'</div></div>';
    }).join('')
    +'<div class="rangee"><div style="width:100%"><b>Prochaine action</b>'
      +'<div class="grille2" style="margin-top:9px">'
      +'<div class="champ large"><input id="s-proch" value="'+ech(d.prochaine||'')
        +'" placeholder="Rappeler pour expliquer le poste tranchée"></div>'
      +'<div class="champ"><input id="s-proch-le" type="date" value="'+ech(d.prochaine_le||'')+'"></div>'
      +'<div class="champ"><select id="s-statut">'
        +Object.keys(DSTAT).map(function(k){
          return '<option value="'+k+'"'+(d.statut===k?' selected':'')+'>'+ech(DSTAT[k])+'</option>'; }).join('')
      +'</select></div></div></div></div>'
    +'</div>'
    +'<footer><span style="display:flex;gap:7px">'
      +(p?'<button class="btn" data-pieces>Pièces du dossier</button>':'')
      +(p?'<button class="btn" data-fiche>Fiche client</button>':'')+'</span>'
    +'<span><button class="btn" data-x>Fermer</button>'
    +'<button class="btn fort" data-ok>Enregistrer</button></span></footer></div>';
  document.body.appendChild(f);
  var ferme=function(){ f.remove(); };
  $$('[data-x]',f).forEach(function(b){ b.onclick=ferme; });
  var rafraichir=async function(){
    var r=await lire('ls_devis','select=*&id=eq.'+d.id+'&limit=1');
    ferme(); if(r.length)ecranSuivi(r[0]); VUES.suivi();
  };
  $$('[data-fait]',f).forEach(function(b){
    b.onclick=async function(){
      /* Cocher une étape coche tout ce qui la précède : sinon le suivi
         affiche « rien de fait » sur un devis déjà parti. */
      var maj={}, dt=aujourdhui(), ix=0;
      ETAPES_SUIVI.forEach(function(s,i){ if(s.id===b.dataset.fait) ix=i; });
      for(var i=0;i<=ix;i++) if(!d[ETAPES_SUIVI[i].id]) maj[ETAPES_SUIVI[i].id]=dt;
      if(b.dataset.fait==='envoye_le' && d.statut==='brouillon') maj.statut='envoye';
      if(b.dataset.fait.indexOf('relance')===0) maj.statut='relance';

      rafraichir();

  $$('[data-eff]',f).forEach(function(b){
    b.onclick=async function(){
      /* Et l'effacer efface ce qui la suit : on ne peut pas avoir
         relancé un devis qu'on n'a jamais envoyé. */
      var maj={}, ix=0, apres=[];
      ETAPES_SUIVI.forEach(function(s,i){ if(s.id===b.dataset.eff) ix=i; });
      for(var i=ix;i<ETAPES_SUIVI.length;i++)

    ferme(); VUES.suivi();
  };
}

/* ══ L'espace partenaire ═══════════════════════════════════════════
   Un partenaire se connecte à la même adresse que l'équipe, et
   n'atteint que sa fiche, ses commissions et ses messages : c'est la
   base qui l'impose, pas cet écran. Il n'a donc ni rail, ni filtre,
   ni le reste du CRM. */
/* ══ Envoyer, pour de bon ══════════════════════════════════════════
   Un message qu'il faut copier-coller dans sa messagerie n'est pas
   envoyé : il est envoyé une fois sur deux, le lendemain, sans qu'on
   sache lequel. Tout part donc par la même file que les règles
   automatiques — le CRM y dépose, le moteur vide. La seule chose que
   le commercial voit, c'est un bouton « Envoyer ». */
async function modeleParNom(nom){
  try{
    var l=await lire('ls_modeles','select=*&nom=eq.'+encodeURIComponent(nom)+'&limit=1');
    return l.length?l[0]:null;

var MOTEUR_VU=null;
async function moteurVivant(){

  try{
    var d=await lire('ls_moteur','select=cree_le&order=cree_le.desc&limit=1');
    MOTEUR_VU = d.length && (Date.now()-new Date(d[0].cree_le).getTime()) < 20*60000;
  }catch(e){ MOTEUR_VU=false; }
  return MOTEUR_VU;
}

/* Dépose un message dans la file. Prioritaire par défaut : ce que
   déclenche une personne est attendu par quelqu'un, et n'a rien à
   faire dans la file de prospection qui attend 9 h du matin. */
async function envoyer(m){
  /* Le message part au nom de celui qui l'envoie, pas d'une adresse
     de service. Le client répond, et la réponse arrive chez lui. */
  var rg={}, f={};
  try{
    var l0=await lire('ls_reglages','select=cle,valeur&limit=60');
    l0.forEach(function(x){ rg[x.cle]=x.valeur; });
  }catch(e){}
  var rm=reglagesMaison(rg,m.activite||'');
  try{ f=await maFiche(); }catch(e){}
  await monNom();
  var id=identiteEnvoi(f,moi,rm,MON_NOM,m.activite||'');
  var expMail=id.mail, expNom=id.nom, rep=id.rep;

  var l=await ecrire('ls_envois',{
    canal:m.canal||'email',
    destinataire:String(m.dest||'').trim(),
    objet:m.objet||'', corps:m.corps||'',
    prospect_id:m.prospect_id||null, partenaire_id:m.partenaire_id||null,
    societe:m.societe||'', activite:m.activite||'',
    expediteur_nom:expNom, expediteur_email:expMail, repondre_a:rep,
    corps_html:m.html||'', pieces:m.pieces||[],
    prioritaire:m.prioritaire===false?false:true,
    declenche_par:moi||'', owner_email:moi||'',
    a_envoyer_le:new Date().toISOString()});
  await tracer('envoi.'+(m.canal||'email'),(m.societe||m.dest||'')+' — '+(m.objet||''),
    m.prospect_id||m.partenaire_id||null);
  return l;
}

/* Le bouton d'envoi, avec la vérité sur ce qui va se passer. Tant que
   le moteur n'est pas branché, un message déposé dans la file ne part
   pas : il faut le dire, pas le laisser croire. */
function boutonEnvoi(id,libelle){
  return '<button class="btn fort" id="'+id+'">'+ech(libelle)+'</button>';
}
async function faireEnvoi(bouton,m,apres){
  var b=bouton; if(!b)return;
  if(!m.dest){
    alerteCopiable('Pas d’adresse',
      'Cette fiche n’a pas d’adresse e-mail. Ajoutez-la, puis réessayez.');
    return;
  }
  b.disabled=true; b.textContent='Envoi…';
  try{
    await envoyer(m);
    var vif=await moteurVivant();
    b.textContent=vif?'Envoyé':'Mis en file';
    if(!vif) alerteCopiable('Le moteur d’envoi n’est pas branché',
      'Votre message est en file d’attente et partira dès que la fonction « moteur » sera '
      +'déployée dans Supabase. En attendant, rien ne sort. Le guide est dans Automatisations.');
    if(apres)setTimeout(apres,700);
  }catch(e){
    b.disabled=false; b.textContent=libelleInitial(b);
    alerteCopiable('Envoi refusé',String(e.message||e).slice(0,300));
  }
}
function libelleInitial(b){ return b.getAttribute('data-lib')||'Envoyer'; }

/* ══ Le dossier d'une relance ══════════════════════════════════════
   On ne relance pas à froid une affaire qu'on a soi-même chiffrée. Le
   commercial doit retrouver, en une seconde : le montant envoyé, la
   date, ce qui s'est dit aux appels précédents, et ce qu'il avait noté.

async function dossierRelance(p){

  var dv=d[0];

    ? Math.round((Date.now()-new Date(dv.envoye_le).getTime())/864e5) : null;

  var h='<div class="panneau" style="margin:0 0 14px"><header><h2>Le dossier</h2>'

  if(dv){
    h+='<div class="rangee" style="padding-top:0"><div style="width:100%">'
      +'<b>Devis envoyé</b><p>'+ech(dv.objet||'—')+'<br>'
      +'<b style="font-size:16px">'+ech(euro(dv.montant_ht||0))+' HT</b>'
      +(jours!==null?' <span class="sec">— il y a '+jours+' jour'+(jours>1?'s':'')+'</span>':'')
      +'</p></div></div>';
    if(jours!==null&&jours>21)
      h+='<div class="q-alerte">'+jours+' jours sans réponse. Au-delà de trois semaines, '
        +'un devis ne se relance plus : il se refait. Proposez de le revoir ensemble, '
        +'ou demandez franchement si le projet tient toujours.</div>';
  }else{
    h+='<div class="rangee" style="padding-top:0"><div><b>Aucun devis enregistré</b>'
      +'<p>Cette fiche est en relance sans devis dans le suivi. Vérifiez avant d’appeler.</p>'
      +'</div></div>';
  }

  if(p.prochaine)
    h+='<div class="rangee"><div style="width:100%"><b>Ce qui était prévu</b>'
      +'<p>'+ech(p.prochaine)+'</p></div></div>';

  if(p.note)
    h+='<div class="rangee"><div style="width:100%"><b>Vos notes</b>'
      +'<p style="white-space:pre-wrap">'+ech(p.note)+'</p></div></div>';

  if(a.length)
    h+='<div class="rangee"><div style="width:100%"><b>Les appels précédents</b><p>'
      +a.map(function(x){
        var r=(RESULTATS.filter(function(y){return y.id===x.resultat;})[0]||{}).lab||x.resultat;
        return date(x.created_at)+' — '+ech(r);
      }).join('<br>')+'</p></div></div>';

  if(q&&q.recap)
    h+='<div class="rangee"><div style="width:100%"><b>Ce qu’il avait dit</b>'
      +'<p style="white-space:pre-wrap;font-size:13px;color:var(--faible)">'
      +ech(String(q.recap).slice(0,700))+'</p></div></div>';

  return h+'</div></div>';
}

/* ══ Le mot de la fin ══════════════════════════════════════════════
   Un appel qui s'arrête sur « autre chose à savoir ? » laisse le
   client sans consigne : il raccroche, il oublie, et la maquette
   ne démarre jamais. La dernière étape lui dit donc exactement ce qui
   arrive, quand, et par où le joindre. Elle s'adapte à ce qui a été
   répondu — on ne conclut pas de la même façon avec quelqu'un qui a
   calé sa maquette et quelqu'un qui l'a refusée. */



/* ══ Le devis en PDF ═══════════════════════════════════════════════
   Un devis est un document, pas un paragraphe. Il part en pièce
   jointe, se classe, s'imprime, se signe — et le corps du mail
   redevient ce qu'il doit être : quelques phrases écrites à une
   personne.

   La mise en page suit le devis Henrri que le client recevra ensuite :
   mêmes colonnes, même bloc de totaux, mêmes conditions de paiement.
   Recevoir deux fois la même chose ne doit pas donner l'impression de
   recevoir deux chiffrages différents. */

/* Les montants du PDF.

   `toLocaleString('fr-FR')` sépare les milliers par une espace fine
   insécable (U+202F). Le PDF est encodé en WinAnsi, qui ne connaît pas
   ce caractère : jsPDF le remplace par une barre oblique, et « 5 088 »
   s'imprime « 5 /088 ». Il faut donc une espace ordinaire, invisible à
   la lecture et présente dans l'encodage. */
function eurPdf(n){
  return (Math.round(n*100)/100)
    .toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})
    .replace(/[\u202f\u00a0\u2009]/g,' ')+' EUR';
}

/* La marque du logo, tracée plutôt qu'écrite : un carré sombre et
   trois traits, comme l'icône de l'application. Les polices de base
   d'un PDF n'ont pas de glyphe de fantaisie, et un caractère absent
   s'imprime en carré ou en lettre au hasard. */
function marquePdf(doc,x,y,cote,fond,trait){
  doc.setFillColor(fond[0],fond[1],fond[2]);
  doc.roundedRect(x,y,cote,cote,2.4,2.4,'F');
  doc.setDrawColor(trait[0],trait[1],trait[2]); doc.setLineWidth(1.1); doc.setLineCap('round');
  var u=cote/11;
  doc.line(x+3*u,y+3.6*u,x+8*u,y+3.6*u);
  doc.line(x+3*u,y+5.5*u,x+6.6*u,y+5.5*u);
  doc.line(x+3*u,y+7.4*u,x+7.4*u,y+7.4*u);
}

function numeroDevis(){
  var d=new Date();
  return 'OQ-'+String(d.getFullYear()).slice(2)+'-'
    +String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function devisPdfDoc(p,c,sig,activite){
  if(!window.jspdf||!window.jspdf.jsPDF)
    throw new Error('Le générateur de PDF n’est pas chargé. Rechargez la page.');
  var ch=charteDe(activite);
  var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  var G=18, L=210, num=numeroDevis();
  var nuit=[8,9,12], vert=[43,95,217], gris=[88,98,116], filet=[229,232,237];

  /* ── L'en-tête : logo à gauche, DEVIS à droite ─────────────────── */
  marquePdf(doc,G,14,11,nuit,[127,168,255]);
  doc.setTextColor(nuit[0],nuit[1],nuit[2]);
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text(ch.nom+(activite==='tiimizy'?' Logiciels':' Sur mesure'),G+15,22);
  doc.setFontSize(17);
  doc.text('DEVIS',L-G,22,{align:'right'});

  /* ── Les deux blocs d'adresse ──────────────────────────────────── */
  var y=40;
  doc.setFontSize(9.5); doc.setFont('helvetica','bold');
  doc.text(ch.nom.toUpperCase(),G,y);
  doc.text(String(p.societe||'').toUpperCase(),L/2,y);
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.setTextColor(60,70,82);
  var gauche=[ch.adresse,ch.mail].filter(Boolean);
  var droite=[p.adresse||p.ville||'',p.dirigeant||'',p.tel||'',p.email||''].filter(Boolean);
  gauche.forEach(function(t,i){ doc.text(String(t),G,y+6+i*4.6); });
  droite.forEach(function(t,i){ doc.text(String(t),L/2,y+6+i*4.6); });

  y=y+6+Math.max(gauche.length,droite.length)*4.6+9;
  doc.setTextColor(nuit[0],nuit[1],nuit[2]);
  doc.setFont('helvetica','bold'); doc.setFontSize(12.5);
  doc.text('DEVIS N° '+num,G,y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  doc.setTextColor(gris[0],gris[1],gris[2]);
  doc.text(new Date().toLocaleDateString('fr-FR',
    {weekday:'long',day:'numeric',month:'long',year:'numeric'}),G,y+5);

  /* ── Le tableau ────────────────────────────────────────────────── */
  var lignes=c.lignes.filter(function(x){ return x.on!==false; });
  doc.autoTable({
    startY:y+11,
    margin:{left:G,right:G},
    /* « TVA % » plutôt que « TVA » : la colonne porte un taux, pas un
       montant, et l'intitulé nu se lit comme une somme à additionner —
       on croit alors payer la taxe deux fois. */
    head:[['Désignation','Qté','PU HT','TVA %','Montant HT']],
    body:lignes.map(function(x){
      var chiffre=Number(x.pu)>0;
      return [x.designation,
        String(x.qte)+(x.unite==='mois'?' mois':''),
        chiffre?eurPdf(x.pu):'-',
        c.tva+' %',
        chiffre?eurPdf(x.total):'à chiffrer'];
    }),
    styles:{font:'helvetica',fontSize:8.5,cellPadding:2.6,lineColor:filet,lineWidth:.2,
            textColor:[26,32,41],valign:'top'},
    headStyles:{fillColor:[243,244,247],textColor:nuit,fontStyle:'bold',fontSize:8.5},
    columnStyles:{0:{cellWidth:88},1:{halign:'right',cellWidth:18},
                  2:{halign:'right',cellWidth:24},3:{halign:'right',cellWidth:16},
                  4:{halign:'right',cellWidth:28}},
    theme:'grid'
  });

  /* ── Les totaux et les conditions ──────────────────────────────── */
  var yt=doc.lastAutoTable.finalY+10;
  if(yt>250){ doc.addPage(); yt=28; }
  var largeur=72, x0=L-G-largeur;
  doc.setFillColor(243,244,247);
  doc.rect(x0,yt,largeur,26,'F');
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.setTextColor(gris[0],gris[1],gris[2]);
  doc.text('Total HT',x0+5,yt+7);
  doc.text('TVA ('+c.tva+' %)',x0+5,yt+13.5);
  doc.setTextColor(26,32,41);
  doc.text(eurPdf(c.ht),x0+largeur-5,yt+7,{align:'right'});
  doc.text(eurPdf(c.ttc-c.ht),x0+largeur-5,yt+13.5,{align:'right'});
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.setTextColor(nuit[0],nuit[1],nuit[2]);
  doc.text('Total TTC',x0+5,yt+22);
  doc.text(eurPdf(c.ttc),x0+largeur-5,yt+22,{align:'right'});

  doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
  doc.setTextColor(gris[0],gris[1],gris[2]);
  doc.text('Montants exprimés hors taxes. La TVA est ajoutée une seule fois, au total.',
    G,yt-4);
  doc.setFontSize(8.5); doc.setTextColor(60,70,82);
  doc.text('Conditions de paiement :',G,yt+5);
  /* Deux choses différentes sur un même devis : le logiciel, payé une
     fois, et sa maintenance, payée chaque mois. Les mélanger dans un
     acompte ferait payer d'avance un an de maintenance. */
  var mensuel=lignes.filter(function(x){ return x.unite==='mois'&&Number(x.qte)>0; })
    .reduce(function(a,x){ return a+(Number(x.pu)||0); },0)*(1+c.tva/100);
  var recurrent=lignes.filter(function(x){ return x.unite==='mois'; })
    .reduce(function(a,x){ return a+(Number(x.total)||0); },0)*(1+c.tva/100);
  var projet=c.ttc-recurrent;
  doc.text('50 % du logiciel soit '+eurPdf(projet/2)+' : à la commande',G,yt+10.5);
  doc.text('50 % soit '+eurPdf(projet/2)+' : à la mise en service',G,yt+15.5);
  if(mensuel>0)doc.text('Maintenance : '+eurPdf(mensuel)+' TTC par mois, dès la mise en service',G,yt+20.5);
  /* La validité engage ; le délai de réalisation se fixe au devis
     ferme, après la maquette, pas sur un premier chiffrage. */
  var fin=new Date(Date.now()+30*864e5);
  doc.setTextColor(gris[0],gris[1],gris[2]); doc.setFontSize(8);
  doc.text('Devis valable un mois, jusqu’au '
    +fin.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+'.',
    G,yt+(mensuel>0?26:22));
  doc.setTextColor(60,70,82); doc.setFontSize(8.5);

  /* Une option proposée à zéro exemplaire n'est pas un poste manquant :
     elle attend une quantité, pas un prix. */
  var manques=lignes.filter(function(x){ return !Number(x.pu)&&Number(x.qte)!==0; });
  var yn=yt+34;
  if(manques.length){
    doc.setTextColor(gris[0],gris[1],gris[2]); doc.setFontSize(8);
    doc.text(doc.splitTextToSize(
      'Les postes marqués « à chiffrer » seront arrêtés à la validation de la maquette. '
      +'Le reste du devis est ferme.',L-2*G),G,yn);
    yn+=10;
  }
  /* La réserve de périmètre. Elle protège le projet autant que le
     client : ce qui n'est pas écrit se discute à la livraison, au pire
     moment. Elle est sur tous les devis, sans exception. */
  doc.setTextColor(gris[0],gris[1],gris[2]); doc.setFont('helvetica','normal'); doc.setFontSize(8);
  var reserve=doc.splitTextToSize(RESERVE_DEVIS,L-2*G);
  if(yn+reserve.length*3.6>262){ doc.addPage(); yn=28; }
  doc.text(reserve,G,yn);
  yn+=reserve.length*3.6+4;

  doc.setTextColor(nuit[0],nuit[1],nuit[2]); doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('Bon pour accord',G,yn+8);

  /* ── Le pied de page, sur chaque page ──────────────────────────── */
  var n=doc.internal.getNumberOfPages();
  for(var i=1;i<=n;i++){
    doc.setPage(i);
    doc.setDrawColor(filet[0],filet[1],filet[2]); doc.setLineWidth(.2);
    doc.line(G,282,L-G,282);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.setTextColor(gris[0],gris[1],gris[2]);
    doc.text([ch.adresse,ch.tel,ch.site].filter(Boolean).join('  ·  '),G,287);
    doc.text('Page '+i+' / '+n,L-G,287,{align:'right'});
    if(ch.preuves)doc.text(ch.preuves,G,291);
  }
  return doc;
}
function devisPdf(p,c,sig,activite){
  var doc=devisPdfDoc(p,c,sig,activite);
  return {blob:doc.output('blob'),
          nom:'Devis '+numeroDevis()+' — '
             +String(p.societe||'client').replace(/[^\w\s.-]/g,'')+'.pdf'};
