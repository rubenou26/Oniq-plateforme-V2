<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONIQ Pilotage</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2308090C'/%3E%3Cpath d='M18 20h28M18 32h20M18 44h24' stroke='%237FA8FF' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script>(function(){try{var t=localStorage.getItem("oq-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>
  /* ══════════════════════════════════════════════════════════════════
     ONIQ PILOTAGE — le CRM commercial d'ONIQ.
     Même langage que oniq.online : fond bleu-noir, filets d'un pixel,
     monochrome sauf pour le sens. Deux activités cohabitent, donc deux
     teintes d'identité — le bleu pour ONIQ Logiciels, le lilas pour
     ONIQ Sur mesure. Elles ne servent qu'à dire de quelle activité
     relève une ligne, jamais à décorer.
     ══════════════════════════════════════════════════════════════════ */
  :root{
    --fond:#08090C; --surface:#0E1116; --surface-2:#141922; --survol:#171D26;
    --filet:#1B212B; --filet-fort:#2A3341;
    --texte:#EAEDF2; --attenue:#8B94A5; --faible:#59616F;
    --signal:#7FA8FF; --signal-r:127,168,255;
    --ok:#5FD3A6; --ok-r:95,211,166;
    --attente:#E0B15C; --retard:#E8796B;
    --tii:#7FA8FF; --tii-r:127,168,255;
    --bor:#B69CFF; --bor-r:182,156,255;
    --rail:242px;
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --fond:#F7F8FA; --surface:#FFFFFF; --surface-2:#F1F3F6; --survol:#EDF0F4;
      --filet:#E3E7ED; --filet-fort:#CFD5DE;
      --texte:#0B0E13; --attenue:#586274; --faible:#8B94A5;
      --signal:#2B5FD9; --signal-r:43,95,217;
      --ok:#17805C; --ok-r:23,128,92;
      --attente:#96701C; --retard:#B5443A;
      --tii:#2B5FD9; --tii-r:43,95,217;
      --bor:#6B4BD6; --bor-r:107,75,214;
    }
  }
  :root[data-theme="light"]{
    --fond:#F7F8FA; --surface:#FFFFFF; --surface-2:#F1F3F6; --survol:#EDF0F4;
    --filet:#E3E7ED; --filet-fort:#CFD5DE;
    --texte:#0B0E13; --attenue:#586274; --faible:#8B94A5;
    --signal:#2B5FD9; --signal-r:43,95,217;
    --ok:#17805C; --ok-r:23,128,92;
    --attente:#96701C; --retard:#B5443A;
    --tii:#2B5FD9; --tii-r:43,95,217;
    --bor:#6B4BD6; --bor-r:107,75,214;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--fond);color:var(--texte);
    font:400 15px/1.55 "Instrument Sans",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;letter-spacing:-.004em}
  .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--signal);text-decoration:none}
  img{max-width:100%}

  /* ── Connexion ─────────────────────────────────────────────────── */
  .porte{min-height:100vh;display:grid;place-items:center;padding:24px}
  .porte form{width:min(390px,100%);background:var(--surface);border:1px solid var(--filet);
    border-radius:14px;padding:32px}
  .porte h1{font-size:21px;font-weight:600;letter-spacing:-.025em;margin:0 0 6px}
  .porte p{color:var(--attenue);font-size:13.5px;margin:0 0 24px}
  .champ{margin-bottom:14px}
  .champ label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faible);margin-bottom:6px}
  .champ input,.champ select,.champ textarea{width:100%;background:var(--surface-2);
    border:1px solid var(--filet);border-radius:8px;padding:10px 12px;font-size:14px}
  .champ textarea{min-height:80px;resize:vertical}
  .champ input:focus,.champ select:focus,.champ textarea:focus{outline:none;border-color:var(--signal)}
  .champ .aide{font-size:12px;color:var(--faible);margin-top:5px}
  .plein{width:100%;background:var(--texte);color:var(--fond);border:none;border-radius:8px;
    padding:12px;font-weight:600;font-size:14.5px;cursor:pointer;transition:opacity .15s}
  .plein:hover{opacity:.88}
  .plein:disabled{opacity:.45;cursor:default}
  .erreur{background:rgba(232,121,107,.1);border:1px solid rgba(232,121,107,.35);
    color:var(--retard);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}

  /* ── Charpente ─────────────────────────────────────────────────── */
  .app{display:none;min-height:100vh}
  .app.ouvert{display:grid;grid-template-columns:var(--rail) minmax(0,1fr)}
  .rail{border-right:1px solid var(--filet);position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;overflow-y:auto;
    background:linear-gradient(180deg,var(--surface),var(--fond) 62%)}
  .rail::-webkit-scrollbar{width:6px}
  .rail::-webkit-scrollbar-thumb{background:var(--filet-fort);border-radius:3px}
  .marque{padding:18px 18px 15px;display:flex;flex-direction:column;align-items:flex-start;
    gap:9px;border-bottom:1px solid var(--filet);min-width:0}
  .marque .mot{font-size:15.5px;font-weight:700;letter-spacing:-.03em;
    display:inline-flex;align-items:center;gap:9px;min-width:0}
  .marque .mot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .marque .mot i{font-style:normal}
  .etat-moteur{display:inline-flex;align-items:center;gap:6px;flex:none;
    font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--faible);
    border:1px solid var(--filet);border-radius:20px;padding:3px 8px}
  .pastille{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none;
    box-shadow:0 0 0 0 rgba(var(--ok-r),.6);animation:respire 2.6s ease-out infinite}
  @keyframes respire{
    0%{box-shadow:0 0 0 0 rgba(var(--ok-r),.5)}
    70%{box-shadow:0 0 0 7px rgba(var(--ok-r),0)}
    100%{box-shadow:0 0 0 0 rgba(var(--ok-r),0)}
  }
  .menu{padding:8px 12px 18px;flex:1}
  .groupe{display:flex;align-items:center;gap:9px;margin-top:16px;padding:14px 8px 8px;
    font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--faible)}
  .groupe:first-child{margin-top:0}
  .groupe:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--filet),transparent)}
  .menu a{position:relative;display:flex;align-items:center;gap:12px;padding:9px 11px;
    border-radius:10px;color:var(--attenue);font-size:14px;border:1px solid transparent;
    transition:background .16s,color .16s,border-color .16s}
  .menu a .ico{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;
    stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.62;
    transition:opacity .16s,color .16s,transform .3s cubic-bezier(.22,1,.36,1)}
  .menu a .lib{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .menu a:hover{background:var(--survol);color:var(--texte)}
  .menu a:hover .ico{opacity:1;transform:scale(1.08)}
  .menu a.actif{color:var(--texte);font-weight:500;
    border-color:rgba(var(--signal-r),.22);
    background:linear-gradient(90deg,rgba(var(--signal-r),.16),rgba(var(--signal-r),.04))}
  .menu a.actif:before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;
    border-radius:0 3px 3px 0;background:var(--signal);box-shadow:0 0 12px rgba(var(--signal-r),.65)}
  .menu a.actif .ico{opacity:1;color:var(--signal)}
  .menu a .badge{flex:none;font-size:11px;font-variant-numeric:tabular-nums;
    background:rgba(var(--signal-r),.16);border:1px solid rgba(var(--signal-r),.32);
    border-radius:20px;padding:1px 8px;color:var(--signal)}
  .menu a .badge:empty{display:none}
  .menu a .badge.chaud{background:rgba(232,121,107,.16);border-color:rgba(232,121,107,.4);color:var(--retard)}
  .pied{padding:14px 14px 16px;border-top:1px solid var(--filet);font-size:12.5px;
    color:var(--faible);display:flex;flex-direction:column;gap:9px}
  .carte-moi{display:flex;align-items:center;gap:10px;min-width:0;
    background:var(--surface-2);border:1px solid var(--filet);border-radius:11px;padding:9px 11px}
  .carte-moi .rond{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;
    font-size:12px;font-weight:600;color:var(--fond);background:var(--signal)}
  .carte-moi span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--attenue);font-size:12.5px}
  .pied button{width:100%;cursor:pointer;font:inherit;font-size:12.5px;text-align:left;
    color:var(--attenue);background:transparent;border:1px solid var(--filet);
    border-radius:9px;padding:8px 11px;transition:color .2s,border-color .2s}
  .pied button:hover{color:var(--texte);border-color:var(--filet-fort)}
  .habit{display:flex;align-items:center;gap:9px}
  .habit svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
  .habit .i-lune{fill:currentColor;stroke:none;display:none}
  :root[data-theme="light"] .habit .i-lune{display:block}
  :root[data-theme="light"] .habit .i-soleil{display:none}
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]) .habit .i-lune{display:block}
    :root:not([data-theme="dark"]) .habit .i-soleil{display:none}
  }

  .barre{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--fond) 84%,transparent);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--filet);
    padding:0 28px;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .barre h1{font-size:17px;font-weight:600;letter-spacing:-.02em;margin:0}
  .barre .sous{font-size:12.5px;color:var(--faible);margin-top:1px}
  .outils{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  /* Le champ des appels entrants. Il est dans la barre du haut et
     nulle part ailleurs : quand le téléphone sonne, on n'a pas le
     temps de chercher dans quel écran se trouve la recherche. */
  .entrant{position:relative;display:flex;align-items:center;min-width:230px;max-width:300px;flex:1}
  .entrant svg{position:absolute;left:11px;width:15px;height:15px;fill:none;
    stroke:var(--faible);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .entrant input{width:100%;background:var(--surface);border:1px solid var(--filet);border-radius:8px;
    padding:9px 12px 9px 33px;font-size:13.5px;color:var(--texte)}
  .entrant input:focus{outline:none;border-color:var(--signal);background:var(--surface-2)}
  .entrant input::placeholder{color:var(--faible)}
  @media(max-width:820px){.entrant{min-width:0;order:3;max-width:none;width:100%}}
  .btn{background:var(--surface);border:1px solid var(--filet);border-radius:8px;
    padding:8px 14px;font-size:13.5px;cursor:pointer;transition:border-color .15s,background .15s}
  .btn:hover{border-color:var(--filet-fort);background:var(--survol)}
  .btn.fort{background:var(--texte);color:var(--fond);border-color:var(--texte);font-weight:600}
  .btn.fort:hover{opacity:.88}
  .btn.mini{padding:5px 10px;font-size:12.5px}
  .btn:disabled{opacity:.45;cursor:default}
  .vue{padding:26px 28px 60px}

  /* ── Le sélecteur d'activité ───────────────────────────────────── */
  .maisons{display:inline-flex;background:var(--surface-2);border:1px solid var(--filet);
    border-radius:9px;padding:3px;gap:2px}
  .maisons button{border:0;background:none;cursor:pointer;padding:5px 12px;border-radius:6px;
    font-size:13px;color:var(--attenue);display:inline-flex;align-items:center;gap:7px}
  .maisons button .pt{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5}
  .marque .version{display:block;margin-top:7px;font-family:"JetBrains Mono",monospace;
    font-size:9.5px;letter-spacing:.06em;color:var(--faible);cursor:default}
  .btn.danger{background:var(--retard);border-color:var(--retard);color:#fff}
  .maisons button[aria-pressed="true"]{background:var(--surface);color:var(--texte);font-weight:500}
  .maisons button[data-a="tiimizy"][aria-pressed="true"]{color:var(--tii)}
  .maisons button[data-a="bornistes"][aria-pressed="true"]{color:var(--bor)}
  .maisons button[aria-pressed="true"] .pt{opacity:1}

  /* ── Blocs ─────────────────────────────────────────────────────── */
  .kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));margin-bottom:24px}
  .kpi{background:var(--surface);border:1px solid var(--filet);border-radius:12px;padding:18px}
  .kpi .lib{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faible)}
  .kpi .val{font-size:29px;font-weight:600;letter-spacing:-.035em;margin-top:8px;
    font-variant-numeric:tabular-nums;line-height:1}
  .kpi .note{font-size:12.5px;color:var(--attenue);margin-top:8px}
  .kpi.vert .val{color:var(--ok)} .kpi.ambre .val{color:var(--attente)}
  .kpi.rouge .val{color:var(--retard)} .kpi.bleu .val{color:var(--signal)}
  .rouge{color:var(--retard)}
  .choix-liste{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;padding:8px 10px;
    border:1px solid var(--filet);border-radius:10px;background:var(--surface)}
  .champ .choix-liste label{display:flex;gap:9px;align-items:center;justify-content:flex-start;font-size:13.5px;
    letter-spacing:0;text-transform:none;color:var(--texte);font-weight:500;margin:0;cursor:pointer}
  .champ .choix-liste label input{width:auto;margin:0;flex:none}
  .choix-liste label .sec{font-size:12px}
  .bandeau-compte{margin-top:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--filet);
    background:var(--surface);font-size:14px}
  .bandeau-compte.ok{border-color:rgba(var(--ok-r),.45)} .bandeau-compte.vide{border-color:rgba(232,121,107,.45)}
  .verif ul{margin:8px 0 0;padding-left:20px;font-size:13.5px;line-height:1.55} .verif li{margin:4px 0}
  .verif .v-bloc,.verif .v-att,.verif .v-ok{padding:12px 16px;border-radius:10px;margin-bottom:10px;border:1px solid var(--filet)}
  .verif .v-bloc{background:rgba(232,121,107,.1);border-color:rgba(232,121,107,.4)}
  .verif .v-att{background:rgba(224,177,92,.1);border-color:rgba(224,177,92,.4)}
  .verif .v-ok{background:rgba(var(--ok-r),.08);border-color:rgba(var(--ok-r),.35)}
  .modeles{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:12px;padding:18px}
  .mod{border:1px solid var(--filet);border-radius:12px;padding:15px 16px;background:var(--fond);
    display:flex;flex-direction:column;gap:8px}
  .mod .maison{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--faible)}
  .mod h3{margin:0;font-size:15px;font-weight:600}
  .mod .sous{font-size:12.5px;color:var(--faible);line-height:1.5;flex:1}
  .mod .chiffres{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;line-height:1.4}
  .mod .chiffres b{display:block;font-size:18px;font-weight:600;color:var(--texte)}
  .mod footer{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
  .mod .champ{margin:0}
  .mod .champ label{font-size:10.5px}
  .mod .champ input{padding:7px 10px;font-size:13.5px}
  .mod .champ .aide{font-size:11px;margin-top:3px}
  .bloc-copie{white-space:pre-wrap;word-break:break-all;margin:0;padding:12px 14px;border-radius:10px;
    border:1px solid var(--filet);background:var(--fond);font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace}
  .bandeau-seq{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:13.5px;
    background:rgba(var(--signal-r),.08);border:1px solid rgba(var(--signal-r),.35)}
  .alertes-mail{padding:12px 16px;border-radius:12px;margin-bottom:16px;font-size:13.5px;line-height:1.55;
    background:rgba(232,121,107,.08);border:1px solid rgba(232,121,107,.4)}
  .alertes-mail b{display:block;margin-bottom:4px}

  .panneau{background:var(--surface);border:1px solid var(--filet);border-radius:12px;margin-bottom:18px}
  .demos{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start}
  .demos .panneau{margin:0}
  .demo-carte > header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .demo-carte > header .aide{display:block;margin-top:2px}
  .demo-plein{position:fixed;inset:0;z-index:9500;background:var(--fond);display:flex;flex-direction:column}
  .demo-barre{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--filet);background:var(--surface)}
  .demo-plein iframe{flex:1;width:100%;border:0;background:#fff}
  .demo-vide{margin:auto;max-width:520px;text-align:center;padding:24px;line-height:1.6}
  .demo-vide .gros{font-size:19px;font-weight:600;margin-bottom:8px}
  .panneau > header{padding:15px 18px;border-bottom:1px solid var(--filet);
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .panneau > header h2{font-size:14.5px;font-weight:600;margin:0}
  .panneau > header .aide{font-size:12.5px;color:var(--faible)}
  .corps{padding:18px}
  .duo{display:grid;gap:18px}
  .duo>*{min-width:0}
  @media(min-width:1080px){.duo{grid-template-columns:1.5fr 1fr}}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:11px 18px;text-align:left;border-bottom:1px solid var(--filet);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .14s}
  tbody tr:hover{background:var(--survol)}
  th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faible);font-weight:500}
  td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;
    font-family:"JetBrains Mono",monospace;font-size:13px}
  .tbl-scroll{overflow-x:auto}
  .mini-n{width:74px;padding:5px 7px;text-align:right;border:1px solid var(--filet);
    border-radius:7px;background:var(--fond);color:var(--texte);
    font-family:"JetBrains Mono",monospace;font-size:12.5px}
  .mini-n:focus{outline:none;border-color:var(--filet-fort)}
  .sec{font-size:12.5px;color:var(--faible)}

  .etat{display:inline-block;font-size:10.5px;font-weight:500;letter-spacing:.06em;
    padding:3px 9px;border-radius:20px;border:1px solid;white-space:nowrap;text-transform:uppercase}
  .e-ok{color:var(--ok);border-color:rgba(var(--ok-r),.4);background:rgba(var(--ok-r),.1)}
  .e-att{color:var(--attente);border-color:rgba(224,177,92,.4);background:rgba(224,177,92,.1)}
  .e-ret{color:var(--retard);border-color:rgba(232,121,107,.4);background:rgba(232,121,107,.1)}
  .e-neu{color:var(--attenue);border-color:var(--filet);background:var(--surface-2)}
  .e-tii{color:var(--tii);border-color:rgba(var(--tii-r),.4);background:rgba(var(--tii-r),.1)}
  .e-bor{color:var(--bor);border-color:rgba(var(--bor-r),.4);background:rgba(var(--bor-r),.1)}

  .vide{padding:44px 20px;text-align:center;color:var(--faible)}
  .vide .gros{font-size:15px;color:var(--attenue);margin-bottom:6px;font-weight:500}
  .vide .pt{font-size:13px;max-width:46ch;margin:0 auto;line-height:1.6}

  .journal{list-style:none;margin:0;padding:0}
  .journal li{display:flex;gap:12px;padding:11px 18px;border-bottom:1px solid var(--filet);font-size:13.5px}
  .journal li:last-child{border-bottom:none}
  .journal .qd{color:var(--faible);font-size:12px;white-space:nowrap;min-width:120px}
  .journal .qui{color:var(--attenue)}

  .rangee{display:flex;align-items:center;justify-content:space-between;gap:18px;

<script>
(function(){
'use strict';

/* ══ RÉGLAGE ════════════════════════════════════════════════════════
   Les deux valeurs du projet Supabase. La clé publique est faite pour
   être exposée : ce sont les règles de sécurité de la base qui
   protègent les données, pas le secret de cette clé. */
var URL_BASE = 'https://kxdxxhepewziazfnfnkq.supabase.co';
var CLE      = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4ZHh4aGVwZXd6aWF6Zm5mbmtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MjkyMDMsImV4cCI6MjA4OTIwNTIwM30.erlLC8zLX3rucPE7-CzJyLGwCljWpzIeGwa6oWXfbMM';

var jeton=null, moi=null, RT=null, ROLE='commercial';
var MAISON='les_deux';                 /* filtre d'activité global */
/* ONIQ n'a qu'une activité : elle vit sous la clé technique
   « bornistes », figée dans les contraintes de la base. La seconde clé,
   « tiimizy », dort : rien ne s'y range, et le sélecteur d'activité ne
   s'affiche plus. Pour rouvrir une seconde activité un jour, passer
   UNE_SEULE à false et redonner des libellés. */
var UNE_SEULE=true;
var LAB={tiimizy:'ONIQ', bornistes:'ONIQ'};

var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s));};

/* ══ Accès aux données ═════════════════════════════════════════════
   Pas de bibliothèque : authentification et requêtes en fetch direct
   sur l'API REST. Le jeton se renouvelle en silence, et tout appel
   refusé en 401 est rejoué une fois après renouvellement. */
async function rafraichir(){
  if(!RT)return false;
  try{
    var r=await fetch(URL_BASE+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:{'apikey':CLE,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:RT})});
    var j=await r.json();
    if(!r.ok||!j.access_token)return false;
    jeton=j.access_token; if(j.refresh_token)RT=j.refresh_token;
    garder();
    return true;
  }catch(e){ return false; }
}
setInterval(function(){ if(RT)rafraichir(); },40*60*1000);
function garder(){ try{ sessionStorage.setItem('ls_adm',JSON.stringify({j:jeton,m:moi,r:RT})); }catch(x){} }

async function appelle(url,opts){
  opts=opts||{};
  var r=await fetch(url,opts);
  if(r.status===401&&await rafraichir()){
    if(opts.headers)opts.headers['Authorization']='Bearer '+(jeton||CLE);
    r=await fetch(url,opts);
  }
  return r;
}
function entetes(extra){
  var h={'apikey':CLE,'Authorization':'Bearer '+(jeton||CLE),'Content-Type':'application/json'};
  if(extra)for(var k in extra)h[k]=extra[k];
  return h;
}
async function lire(table,requete){
  var r=await appelle(URL_BASE+'/rest/v1/'+table+'?'+(requete||'select=*'),{headers:entetes()});
  if(!r.ok)throw new Error(table+' : '+r.status);
  return r.json();
}
async function compter(table,filtre){
  var r=await appelle(URL_BASE+'/rest/v1/'+table+'?select=id&limit=1'+(filtre?'&'+filtre:''),
    {headers:entetes({'Prefer':'count=exact'})});
  var cr=r.headers.get('content-range')||'0/0';
  return parseInt(cr.split('/')[1],10)||0;
}
async function ecrire(table,corps){
  var r=await appelle(URL_BASE+'/rest/v1/'+table,
    {method:'POST',headers:entetes({'Prefer':'return=representation'}),body:JSON.stringify(corps)});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function modifier(table,filtre,corps){
  var r=await appelle(URL_BASE+'/rest/v1/'+table+'?'+filtre,
    {method:'PATCH',headers:entetes(),body:JSON.stringify(corps)});
  if(!r.ok)throw new Error(await r.text());
}
async function supprimer(table,filtre){
  var r=await appelle(URL_BASE+'/rest/v1/'+table+'?'+filtre,{method:'DELETE',headers:entetes()});
  if(!r.ok)throw new Error(await r.text());
}
async function rpc(nom,corps){
  var r=await appelle(URL_BASE+'/rest/v1/rpc/'+nom,
    {method:'POST',headers:entetes(),body:JSON.stringify(corps||{})});
  if(!r.ok)return null;
  return r.json();
}
async function tracer(action,cible,id){
  try{ await ecrire('ls_activite',{acteur:moi||'inconnu',action:action,cible:cible||'',cible_id:id||null}); }catch(e){}
}

/* ══ Mise en forme ═════════════════════════════════════════════════ */
var fEuro=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
var euro=function(n){return fEuro.format(n||0);};
var nb=function(n){return new Intl.NumberFormat('fr-FR').format(n||0);};
/* Ajoute n jours ouvrés à aujourd'hui. Un rappel posé un samedi n'est
   pas un rappel : la fiche remonte le lundi, en retard, et le compteur
   de relances est faussé. */
function joursOuvres(n){
  var d=new Date(Date.now()); d.setHours(9,0,0,0);
  var reste=Math.max(0,n|0);
  while(reste>0){
    d.setDate(d.getDate()+1);
    var j=d.getDay();
    if(j!==0&&j!==6)reste--;
  }
  /* Si le compte tombe quand même un week-end — cas d'un n à zéro —
     on glisse au lundi. */
  while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);
  return d;
}

function date(d){ if(!d)return '—'; try{return new Date(d).toLocaleDateString('fr-FR');}catch(e){return '—';} }
function heure(d){ if(!d)return '—'; try{return new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return '—';} }
function depuis(d){
  if(!d)return '';
  var s=Math.floor((Date.now()-new Date(d).getTime())/1000);
  if(s<60)return 'à l’instant';
  if(s<3600)return 'il y a '+Math.floor(s/60)+' min';
  if(s<86400)return 'il y a '+Math.floor(s/3600)+' h';
  return 'il y a '+Math.floor(s/86400)+' j';
}
function ech(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function vide(titre,pt){return '<div class="vide"><div class="gros">'+ech(titre)+'</div><div class="pt">'+ech(pt)+'</div></div>';}
function kpi(lib,val,genre,note){
  return '<div class="kpi '+(genre||'')+'"><div class="lib">'+ech(lib)+'</div>'

/* ══ L'appel entrant ═══════════════════════════════════════════════
   Le téléphone sonne, un numéro s'affiche, et il faut savoir en trois
   secondes qui c'est. Le champ est dans la barre du haut, visible
   depuis n'importe quel écran : on tape ou on colle le numéro, et la
   fiche s'ouvre. Elle peut être un compte, un lead ou un partenaire :
   on cherche dans les deux fichiers, sans demander lequel.

   Si personne ne correspond, ce n'est pas une impasse : c'est un
   prospect qui appelle de lui-même, le meilleur qui soit, et on lui
   ouvre une fiche avec son numéro déjà rempli. */
function telCles(t){
  var d=String(t||'').replace(/[^0-9+]/g,'');
  if(/^\+33/.test(d))d='0'+d.slice(3);
  d=d.replace(/[^0-9]/g,'');
  if(d.length>10)d=d.slice(-9);      /* un indicatif traîne devant */
  var cles=[d];
  if(d.length===9)cles.push('0'+d);
  if(d.length===10)cles.push(d.slice(1));
  return cles.filter(function(x){ return x.length>=6; });
}

async function chercherEntrant(brut){
  var cles=telCles(brut);
  if(!cles.length)return {prospects:[],partenaires:[]};
  /* Les numéros sont saisis de vingt façons : espaces, points, +33,
     parenthèses. On cherche donc sur la fin du numéro, qui est ce qui
     ne change pas, et on compare ensuite chiffre à chiffre. */
  var fin=cles[0].slice(-6);
  var motif='*'+fin+'*';
  var pr=[], pa=[];
  try{ pr=await lire('ls_prospects',
    'select=id,societe,dirigeant,tel,ville,activite,etape,prochaine,rappel_le,email,est_lead,source'
    +'&tel=like.'+encodeURIComponent(motif)+'&limit=20'); }catch(e){}
  try{ pa=await lire('ls_prescripteurs',
    'select=id,nom,contact,tel,ville,activite,statut,type,email'
    +'&tel=like.'+encodeURIComponent(motif)+'&limit=20'); }catch(e){}
  function garde(t){
    var c=telCles(t);
    return c.length&&cles.some(function(k){ return c.some(function(x){
      return x===k||x.slice(-9)===k.slice(-9); }); });
  }
  return {prospects:pr.filter(function(x){ return garde(x.tel); }),
          partenaires:pa.filter(function(x){ return garde(x.tel); })};
}

async function ecranEntrant(brut){
  var num=String(brut||'').trim();
  var f=document.createElement('div');
  f.className='fond-modale';
  f.innerHTML='<div class="modale" style="width:min(640px,100%)">'
    +'<header><div><h3>'+ech(num)+'</h3>'
      +'<div class="sec" style="margin-top:2px">Recherche dans les comptes et les partenaires…</div></div>'
      +'<button class="fermer" data-x>&times;</button></header>'
    +'<div class="corps"><p class="sec">Un instant.</p></div></div>';
  document.body.appendChild(f);
  var ferme=function(){ f.remove(); };
  $$('[data-x]',f).forEach(function(b){ b.onclick=ferme; });

  var r;
  try{ r=await chercherEntrant(num); }
  catch(e){
    $('.corps',f).innerHTML='<div class="erreur">'+ech(String(e.message||e).slice(0,200))+'</div>';
    return;
  }
  var tout=r.prospects.length+r.partenaires.length;

  var h='<div class="corps">';
  if(!tout){
    h+=vide('Ce numéro n’est dans aucun fichier',
      'Personne ne l’a jamais appelé, et personne ne l’a saisi. Si c’est un client qui vous appelle '
      +'de lui-même, c’est le meilleur lead qui existe : ouvrez-lui une fiche tout de suite, '
      +'son numéro y est déjà.');
  }else{
    h+='<div class="sec" style="margin-bottom:10px">'+nb(tout)+' fiche'+(tout>1?'s':'')
      +' avec ce numéro</div><div style="display:flex;flex-direction:column;gap:8px">';
    r.prospects.forEach(function(x){
      var du=x.rappel_le&&new Date(x.rappel_le)<=new Date();
      h+='<button class="btn" data-fic="'+x.id+'" style="text-align:left;padding:12px 14px">'
        +'<b>'+ech(x.societe||'Sans nom')+'</b> '+pastilleMaison(x.activite)
        +(x.est_lead?etat('lead','ok'):'')
        +(x.etape?etat(joli(x.etape),'neu'):'')
        +(du?etat('rappel dû','ret'):'')
        +'<br><span class="sec">'+ech([x.dirigeant,x.ville,x.tel].filter(Boolean).join(' · '))+'</span>'
        +(x.prochaine?'<br><span class="sec">'+ech(x.prochaine)+'</span>':'')
        +'</button>';
    });
    r.partenaires.forEach(function(x){
      h+='<button class="btn" data-part="'+x.id+'" style="text-align:left;padding:12px 14px">'
        +'<b>'+ech(x.nom||'Sans nom')+'</b> '+pastilleMaison(x.activite)+etat('partenaire','tii')
        +(x.type?etat(x.type,'neu'):'')
        +'<br><span class="sec">'+ech([x.contact,x.ville,x.tel].filter(Boolean).join(' · '))+'</span>'
        +'</button>';
    });
    h+='</div>';
  }
  h+='</div><footer><button class="btn" data-x>Fermer</button>'
    +'<button class="btn'+(tout?'':' fort')+'" data-neuf>Créer une fiche avec ce numéro</button></footer>';
  f.querySelector('.modale').innerHTML=
    '<header><div><h3>'+ech(num)+'</h3><div class="sec" style="margin-top:2px">'
    +(tout?'Cliquez sur la bonne fiche : vous pourrez tout y faire, noter, rappeler, chiffrer.'
          :'Aucune correspondance')+'</div></div>'
    +'<button class="fermer" data-x>&times;</button></header>'+h;

  $$('[data-x]',f).forEach(function(b){ b.onclick=ferme; });
  $$('[data-fic]',f).forEach(function(b){
    b.onclick=function(){ ferme(); ficheClient(b.dataset.fic); };
  });
  $$('[data-part]',f).forEach(function(b){
    b.onclick=async function(){
      var l=await lire('ls_prescripteurs','select=*&id=eq.'+b.dataset.part+'&limit=1');
      ferme(); if(l.length)ecranPartenaire(l[0]);
    };
  });
  $('[data-neuf]',f).onclick=function(){
    ferme();
    ficheCompte({tel:num,activite:(MAISON==='les_deux'?'bornistes':MAISON),
      est_lead:true,origine_lead:'appel entrant',source:'Appel entrant',
      etape:'A contacter',prochaine:'Il a appelé : rappeler ou traiter tout de suite',
      owner_email:moi||''});
  };
}

function brancherEntrant(){
  var e=$('#q-entrant');
  if(!e)return;
  e.addEventListener('keydown',function(ev){
    if(ev.key!=='Enter')return;
    var v=this.value.trim();
    if(v.replace(/[^0-9]/g,'').length<6)return;
    ecranEntrant(v);
    this.value='';
  });
  /* Un numéro collé se cherche tout seul : au téléphone, on n'a pas
     une main pour la souris et une pour le combiné. */
  e.addEventListener('paste',function(){
    var el=this;
    setTimeout(function(){
      var v=el.value.trim();
      if(v.replace(/[^0-9]/g,'').length>=9){ ecranEntrant(v); el.value=''; }
    },30);
  });
}

/* La barre d'onglets d'un écran, posée dans la barre du haut à côté
   du sélecteur de maison. Elle change le sous-titre en même temps :
   un onglet qui ne dit pas ce qu'il montre ne sert à rien. */
function sousOnglet(id){
  var sec=SECTIONS.filter(function(s){ return s.id===id; })[0];
  if(!sec||!sec.onglets)return '';
  var cur=SOUS[id]||sec.onglets[0][0];
  if(!sec.onglets.filter(function(o){ return o[0]===cur; }).length)cur=sec.onglets[0][0];
  var d=document.createElement('div');
  d.className='maisons';
  d.innerHTML=sec.onglets.map(function(o){
    return '<button data-s="'+o[0]+'" aria-pressed="'+(cur===o[0]?'true':'false')+'">'+ech(o[1])+'</button>';
  }).join('');
  $('#outils').appendChild(d);
  $$('[data-s]',d).forEach(function(b){
    b.onclick=function(){ SOUS[id]=b.dataset.s; VUES[id](); };
  });
  var o=sec.onglets.filter(function(x){ return x[0]===cur; })[0];
  if(o&&o[2])$('#sous-vue').textContent=o[2];
  return cur;
}

function aller(id){
  /* Un ancien écran devenu onglet : on ouvre le nouvel écran, au bon
     onglet, sans que personne s'aperçoive du déménagement. */
  if(ANCIENS[id]){ SOUS[ANCIENS[id][0]]=ANCIENS[id][1]; id=ANCIENS[id][0]; }
  var sec=SECTIONS.filter(function(s){return s.id===id;})[0];
  if(!sec){ id='pilotage'; }
  else if(sec.seulement && MAISON!=='les_deux' && MAISON!==sec.seulement){
    /* On ouvre un ecran propre a une maison : on bascule sur cette maison
       plutot que d'afficher un ecran vide. */
    MAISON=sec.seulement;
    try{localStorage.setItem('ls-maison',MAISON);}catch(e){}
    dessinerMarque(); dessinerMenu();
  }
  courante=id;
  $$('#menu a').forEach(function(a){a.classList.toggle('actif',a.dataset.id===id);});
  var s=SECTIONS.filter(function(x){return x.id===id;})[0];
  $('#titre-vue').textContent=s.nom; $('#sous-vue').textContent=s.sous||'';
  outils('');
  $('#vue').innerHTML='<div class="vide"><div class="pt">Chargement…</div></div>';
  (VUES[id]||function(){})();
}

/* ══ Fenêtres de saisie ════════════════════════════════════════════
   Un formulaire se décrit, il ne se dessine pas : un tableau de champs
   en entrée, un objet en sortie. Tous les écrans passent par là. */
/* supprLib : le bouton secondaire ne supprime pas toujours. Dans une
   fenêtre de réglages, un bouton nommé « Supprimer » fait hésiter tout
   le monde et le réglage reste mal fait. */
function formulaire(titre,champs,onOk,supprFn,supprLib,onAnnuler){
  var f=document.createElement('div');
  f.className='fond-modale';
  f.innerHTML='<div class="modale" role="dialog" aria-modal="true">'
    +'<header><h3>'+ech(titre)+'</h3><button class="fermer" data-x aria-label="Fermer">&times;</button></header>'
    +'<div class="corps"><div id="err-f"></div><div class="grille2">'
    +champs.map(function(c){
      var v=c.valeur==null?'':c.valeur;
      var inn;
      /* Un choix qui n'en est pas un ne s'affiche pas : ONIQ n'a qu'une
         activité, le champ garde sa valeur sans encombrer la fenêtre. */
      if(c.type==='select'&&c.options&&c.options.length===1){
        var o1=c.options[0];
        return '<input type="hidden" id="f-'+c.id+'" value="'+ech(v||(o1.v!==undefined?o1.v:o1))+'">';
      }
      if(c.type==='textarea') inn='<textarea id="f-'+c.id+'" placeholder="'+ech(c.ph||'')+'">'+ech(v)+'</textarea>';
      else if(c.type==='select') inn='<select id="f-'+c.id+'">'+c.options.map(function(o){
        var val=o.v!==undefined?o.v:o, lab=o.l!==undefined?o.l:o;
        return '<option value="'+ech(val)+'"'+(String(v)===String(val)?' selected':'')+'>'+ech(lab)+'</option>';
      }).join('')+'</select>';
      else if(c.type==='check') inn='<label style="display:flex;gap:9px;align-items:center;font-size:13.5px">'
        +'<input type="checkbox" id="f-'+c.id+'"'+(v?' checked':'')+'> '+ech(c.ph||'oui')+'</label>';
      else inn='<input id="f-'+c.id+'" type="'+(c.type||'text')+'" value="'+ech(v)+'" placeholder="'+ech(c.ph||'')+'">';
      return '<div class="champ'+(c.large?' large':'')+'"><label for="f-'+c.id+'">'+ech(c.nom)+'</label>'
        +inn+(c.aide?'<div class="aide">'+ech(c.aide)+'</div>':'')+'</div>';
    }).join('')
    +'</div></div><footer>'
    +(supprFn?'<button class="btn" data-suppr>'+ech(supprLib||'Supprimer')+'</button>':'<span></span>')
    +'<span><button class="btn" data-x>Annuler</button> <button class="btn fort" data-ok>Enregistrer</button></span>'
    +'</footer></div>';
  document.body.appendChild(f);

  /* Ce que valaient les champs à l'ouverture. Sert à savoir si l'on
     peut fermer sans rien perdre : un clic à côté de la fenêtre ne
     doit jamais effacer trois minutes de saisie. */
  function lireTout(){
    var val={};
    champs.forEach(function(c){
      var el=$('#f-'+c.id,f); if(!el)return;
      val[c.id]= c.type==='check' ? !!el.checked : String(el.value);
    });
    return val;
  }
  var initial=JSON.stringify(lireTout());
  function modifie(){ return JSON.stringify(lireTout())!==initial; }

  var fini=false;
  var ferme=function(valide){
    if(fini)return; fini=true;
    f.remove();
    /* Fermer sans enregistrer n'est pas un non-événement : l'écran qui
       a ouvert la fenêtre a souvent quelque chose à redessiner. */
    if(!valide&&onAnnuler){ try{ onAnnuler(); }catch(e){} }
  };
  $$('[data-x]',f).forEach(function(b){ b.onclick=function(){ ferme(false); }; });
  f.addEventListener('click',function(e){
    if(e.target!==f)return;
    if(modifie()){
      var er=$('#err-f',f);
      if(er)er.innerHTML='<div class="erreur">Des champs ont été modifiés : Enregistrer, ou Annuler.</div>';
      return;
    }
    ferme(false);
  });

  /* Supprimer ne se fait pas en un clic. Le premier arme le bouton,
     le second exécute ; quatre secondes sans second clic, et il se
     désarme. Une erreur se voit, elle ne se tait plus. */
  if(supprFn){
    var bs=$('[data-suppr]',f), arme=null;
    bs.onclick=async function(){
      if(!arme){
        bs.textContent='Confirmer la suppression';
        bs.style.color='var(--retard)'; bs.style.borderColor='var(--retard)';
        arme=setTimeout(function(){ arme=null; bs.textContent=supprLib||'Supprimer';
          bs.style.color=''; bs.style.borderColor=''; },4000);
        return;
      }
      clearTimeout(arme); arme=null;
      bs.disabled=true; bs.textContent='Suppression…';
      try{ await supprFn(); ferme(true); }
      catch(e){
        bs.disabled=false; bs.textContent=supprLib||'Supprimer';
        bs.style.color=''; bs.style.borderColor='';
        alerteCopiable('Suppression impossible',String(e.message||e).slice(0,300));
      }
    };
  }
  var ok=$('[data-ok]',f);
  ok.onclick=async function(){
    var val={};
    champs.forEach(function(c){
      var el=$('#f-'+c.id,f);
      val[c.id]= c.type==='check' ? !!el.checked : el.value.trim();
    });
    var manque=champs.filter(function(c){ return c.requis && !val[c.id]; });
    if(manque.length){ $('#err-f',f).innerHTML='<div class="erreur">'+ech(manque[0].nom)+' : ce champ est nécessaire.</div>'; return; }
    ok.disabled=true; ok.textContent='Enregistrement…';
    try{ await onOk(val); ferme(true); }
    catch(e){
      $('#err-f',f).innerHTML='<div class="erreur">'+ech(String(e.message||e).slice(0,240))+'</div>';
      ok.disabled=false; ok.textContent='Enregistrer';
    }
  };
  var p=$('.champ input,.champ select,.champ textarea',f); if(p)p.focus();
  return f;
}

/* Un choix cliqué : la valeur va dans le champ caché, le bouton se
   marque, et la conduite d'appel avance d'elle-même. Dans une fenêtre
   de qualification complète, on ne bouge pas : la personne lit tout. */
document.addEventListener('click',function(e){
  var b=e.target&&e.target.closest?e.target.closest('[data-choix]'):null;
  if(!b)return;
  var inp=document.getElementById(b.dataset.pour); if(!inp)return;
  inp.value=b.dataset.choix;
  $$('[data-choix]',b.parentNode).forEach(function(x){ x.classList.toggle('fort',x===b); });
  inp.dispatchEvent(new Event('change',{bubbles:true}));
  var cond=b.closest('#conduite');
  if(cond){ var s=cond.querySelector('#et-suiv'); if(s)setTimeout(function(){ s.click(); },140); return; }
  /* Fenêtre de qualification, une question à la fois : même geste.
     En mode « Tout voir », plusieurs questions sont visibles : on ne
     bouge pas, la personne lit et clique à son rythme. */
  var mod=b.closest('.modale');
  if(mod&&mod.querySelectorAll('.champ').length===1){
    var sv=mod.querySelector('[data-suiv]'); if(sv)setTimeout(function(){ sv.click(); },140);
  }
});

/* Échap ferme la fenêtre la plus récente, sauf si elle contient une
   saisie en cours : là, on ne décide pas à la place de la personne.
   Un seul gestionnaire pour tout le CRM, plutôt qu'un par fenêtre. */
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  var fonds=document.querySelectorAll('.fond-modale');
  if(!fonds.length)return;
  var f=fonds[fonds.length-1];
  if(f.dataset.echap==='non')return;   /* la qualification gère le sien */
  var touche=false;
  $$('input,textarea,select',f).forEach(function(el){
    if(el.type==='checkbox'||el.type==='radio'||el.type==='hidden')return;
    if(el.dataset.init===undefined)return;
    if(String(el.value)!==el.dataset.init)touche=true;
  });
  if(touche)return;
  var x=f.querySelector('[data-x]'); if(x)x.click(); else f.remove();
});
/* Pour que le gestionnaire ci-dessus sache ce qui a changé, chaque
   champ note sa valeur d'ouverture la première fois qu'il reçoit le
   focus. Aucune fenêtre n'a à s'en occuper. */
document.addEventListener('focusin',function(e){
  var el=e.target;
  if(!el||!el.closest||!el.closest('.fond-modale'))return;
  if(!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))return;
  if(el.dataset.init===undefined)el.dataset.init=String(el.value);
});

/* ══ Tableau de bord ═══════════════════════════════════════════════
   Sept indicateurs, pas un de plus. Un tableau de bord qui affiche
   tout n'affiche rien : chaque chiffre doit pouvoir déclencher une
   décision dans la journée. */
async function vueJour(){
  outils('');
  try{
    var fm=filtreMaison();
    var res=await Promise.all([
      compter('ls_prospects','etape=not.in.(Gagne,Perdu)'+fm),
      compter('ls_prospects','rappel_le=lte.'+new Date().toISOString()
        +'&etape=not.in.(Gagne,Perdu)'+fm),
      compter('ls_appels','created_at=gte.'+jourZero()),
      lire('ls_devis','select=montant_ht,statut,activite&limit=1000'+fm),
      compter('ls_taches','fait=is.false'+fm),
      compter('ls_taches','fait=is.false&priorite=eq.1'+fm),
      lire('ls_activite','select=*&order=cree_le.desc&limit=10'),
      lire('ls_prospects','select=id,societe,activite,etape,prochaine,rappel_le,tel,dirigeant'
        +'&order=rappel_le.asc&rappel_le=not.is.null&limit=8'+fm)
    ]);
    var ouverts=res[0], rappels=res[1], appelsJour=res[2], devis=res[3],
        taches=res[4], chaudes=res[5], journal=res[6], file=res[7];
    /* Les alertes du mailing : une boîte qui rebondit trop, une
       campagne qui ne fait pas répondre. Elles s'affichent ici parce
       que c'est ici qu'on regarde le matin. */
    var alertes=[]; try{ alertes=(await rpc('ls_alertes_mailing'))||[]; }catch(e){}

    var dv=devis.filter(garde);
    var enCours=dv.filter(function(d){return d.statut==='envoye'||d.statut==='relance';})
                  .reduce(function(a,d){return a+(+d.montant_ht||0);},0);
    var gagne=dv.filter(function(d){return d.statut==='accepte';})
                .reduce(function(a,d){return a+(+d.montant_ht||0);},0);

    var h='<div class="kpis">'
      +kpi('Rappels dus',nb(rappels),rappels?'rouge':'', 'vous aviez promis de rappeler')
      +kpi('Appels aujourd’hui',nb(appelsJour),'','toute l’équipe, depuis minuit')
      +kpi('Comptes ouverts',nb(ouverts),'','en cours dans le pipeline')
      +kpi('Devis en attente',euro(enCours),enCours?'ambre':'','envoyés, pas encore décidés')
      +kpi('Signé',euro(gagne),gagne?'vert':'','devis acceptés')
      +kpi('À faire',nb(taches),chaudes?'ambre':'',chaudes?nb(chaudes)+' en priorité haute':'rien d’urgent')
      +'</div>';
    if(alertes.length){
      h+='<div class="alertes-mail"><b>Mailing : à regarder aujourd’hui</b>'
        +alertes.map(function(x){
          var v=String(x.valeur||0).replace('.',',');
          return '<div>'+(x.genre==='boite'?'La boîte '+ech(x.libelle)+' est à '+v+' % de rebond sur 30 jours (seuil 3 %). Suspendez ses campagnes et vérifiez les adresses.'
            :x.genre==='plainte'?'La boîte '+ech(x.libelle)+' est à '+v+' % de plaintes sur 30 jours (seuil 0,3 %). Arrêtez ses campagnes.'
            :'La campagne '+ech(x.libelle)+' est à '+v+' % de réponse (seuil 2 %). Relisez le mail 1, ou changez d’audience.')+'</div>';
        }).join('')+'</div>';
    }

    h+='<div class="duo"><div>';
    h+='<div class="panneau"><header><h2>À rappeler en premier</h2>'
      +'<span class="aide">une promesse tenue vaut mieux qu’un appel de plus</span></header>';
    if(file.length){
      h+='<div class="tbl-scroll"><table><thead><tr><th>Compte</th><th>Quand</th>'
        +'<th>Prochaine action</th><th></th></tr></thead><tbody>'
        +file.map(function(p){
          var due=p.rappel_le && new Date(p.rappel_le)<=new Date();
          return '<tr><td><b>'+ech(p.societe)+'</b><br><span class="sec">'+ech(p.dirigeant||'—')+'</span></td>'
            +'<td>'+(due?etat('en retard','ret'):etat(date(p.rappel_le),'neu'))+'</td>'
            +'<td>'+ech(p.prochaine||p.etape)+'</td>'
            +'<td class="n">'+pastilleMaison(p.activite)+'</td></tr>';
        }).join('')+'</tbody></table></div>';
    }else h+=vide('Aucun rappel promis','Dans la session d’appels, « Rappeler » repose la fiche à la date choisie et elle réapparaît ici.');

    h+='</div><div>';

      +'<br>Le fichier <b>schema-v2.sql</b> a-t-il bien été exécuté dans Supabase ?</div>';
  }

/* ══ À faire ═══════════════════════════════════════════════════════
   Deux colonnes de nature différente, et c'est tout l'intérêt : le one
   shot se fait une fois et enlève du travail futur, le récurrent
   revient chaque semaine et prend la place qu'on lui laisse. Les
   mélanger, c'est se condamner à faire le récurrent d'abord — parce
   qu'il crie plus fort — et à ne jamais toucher au one shot. */
var TACHES_FINIES=false;
VUES.taches=async function(){
  outils('');
  bouton('+ Tâche',function(){ ficheTache(null); },true);
  bouton(TACHES_FINIES?'Masquer les terminées':'Voir les terminées',function(){
    TACHES_FINIES=!TACHES_FINIES; VUES.taches();
  });
  try{
    var t=await lire('ls_taches','select=*&order=ordre.asc&limit=500');
    var vis=t.filter(garde).filter(function(x){ return TACHES_FINIES || !x.fait; });
    var ouvertes=t.filter(garde).filter(function(x){ return !x.fait; });

    var oneShot=vis.filter(function(x){return x.nature==='one_shot';});
    var recur  =vis.filter(function(x){return x.nature==='recurrent';});
    var faites =t.filter(garde).filter(function(x){return x.fait;}).length;
    var total  =t.filter(garde).length;
    var pct    = total?Math.round(faites/total*100):0;

    var h='<div class="bilan">'
      +'<div class="b"><div class="l">Avancement</div><div class="v">'+pct+' %</div>'
        +'<div class="barre-p vert"><i style="width:'+pct+'%"></i></div></div>'
      +'<div class="b"><div class="l">One shot restants</div><div class="v">'
        +nb(ouvertes.filter(function(x){return x.nature==='one_shot';}).length)+'</div>'
        +'<div class="sec">chacun enlève du travail futur</div></div>'
      +'<div class="b"><div class="l">Récurrents actifs</div><div class="v">'
        +nb(ouvertes.filter(function(x){return x.nature==='recurrent';}).length)+'</div>'
        +'<div class="sec">ils reviennent toutes les semaines</div></div>'
      +'<div class="b"><div class="l">Priorité haute</div><div class="v">'
        +nb(ouvertes.filter(function(x){return x.priorite===1;}).length)+'</div>'
        +'<div class="sec">à protéger si la semaine déraille</div></div>'
      +'</div>';

    h+=blocTaches('One shot','Fait une fois, fait pour de bon. C’est le seul endroit de la liste '
      +'où le temps investi diminue la charge future — donc c’est ce qu’on absorbe en premier.',oneShot);
    h+=blocTaches('Chronophage','Ça revient chaque semaine et ça prend la place qu’on lui laisse. '
      +'Le seul moyen de le tenir est de lui donner un créneau fixe, et de refuser qu’il déborde.',recur);

    $('#vue').innerHTML=h;
    brancherTaches();
  }catch(e){
    $('#vue').innerHTML='<div class="erreur">Lecture impossible : '+ech(e.message)+'</div>';
  }
};

function brancherTaches(){
  $$('[data-coche]').forEach(function(c){
    c.onchange=async function(){
      var id=c.dataset.coche, on=c.checked;
      c.closest('.tache').classList.toggle('finie',on);
      try{
        await modifier('ls_taches','id=eq.'+id,{fait:on,fait_le:on?new Date().toISOString():null,
          fait_par:on?moi:''});
        if(on)await tracer('tache.terminee',c.closest('.tache').querySelector('b').textContent);
        compteurs();
      }catch(e){ c.checked=!on; }
    };
  });
  /* L'édition sur place : on écrit dans la ligne, on sort du champ,
     c'est enregistré. Pas de fenêtre, pas de bouton Enregistrer — un
     aller-retour de moins à chaque correction. */
  var poser=async function(id,champ,valeur,el){
    try{
      var maj={}; maj[champ]=valeur;
      await modifier('ls_taches','id=eq.'+id,maj);
      if(el){ el.classList.add('enregistre'); setTimeout(function(){ el.classList.remove('enregistre'); },900); }
      if(champ==='priorite'||champ==='nature'||champ==='activite') VUES.taches();
      compteurs();
    }catch(e){ if(el)el.classList.add('rate'); }
  };
  $$('.tache .ed').forEach(function(el){
    el.dataset.avant=el.textContent;
    el.onblur=function(){
      var v=el.textContent.trim();
      if(v===el.dataset.avant)return;
      el.dataset.avant=v;
      poser(el.dataset.id,el.dataset.champ,v,el);
    };
    el.onkeydown=function(e){
      if(e.key==='Enter'&&el.dataset.champ!=='detail'){ e.preventDefault(); el.blur(); }
      if(e.key==='Escape'){ el.textContent=el.dataset.avant; el.blur(); }
    };
  });
  $$('.tache .mini-sel').forEach(function(el){
    el.onchange=function(){
      var v=el.value;
      poser(el.dataset.id,el.dataset.champ,
        el.dataset.champ==='priorite'?+v:(el.dataset.champ==='echeance'?(v||null):v),el);
    };
  });
  $$('[data-suppr]').forEach(function(b){
    b.onclick=async function(){
      if(b.dataset.sur!=='1'){ b.dataset.sur='1'; b.textContent='Sûr ?'; b.classList.add('fort');
        setTimeout(function(){ b.dataset.sur=''; b.textContent='×'; b.classList.remove('fort'); },2600);
        return; }
      await supprimer('ls_taches','id=eq.'+b.dataset.suppr);
      await tracer('tache.supprimee','');
      VUES.taches(); compteurs();
    };
  });
}

/* L'import : le registre officiel des entreprises est ouvert et
   gratuit. Il donne la société, l'activité, l'effectif et l'adresse —
   jamais le téléphone ni l'e-mail, qui restent à trouver. */
function importSirene(){
  formulaire('Importer depuis le registre des entreprises',[
    {id:'naf',nom:'Code d’activité (NAF)',requis:true,valeur:'43.21A',
     aide:'43.21A travaux électriques · 55.10Z hôtels · 56.10A restaurants · 62.01Z informatique'},
    {id:'dep',nom:'Département',requis:true,valeur:'69',ph:'69'},
    {id:'tranche',nom:'Tranche d’effectif',type:'select',valeur:'12',options:[
      {v:'11',l:'10 à 19 salariés'},{v:'12',l:'20 à 49 salariés'},
      {v:'21',l:'50 à 99 salariés'},{v:'22',l:'100 à 199 salariés'}]},
    {id:'activite',nom:'Pour quelle activité',type:'select',
      valeur:MAISON==='les_deux'?'tiimizy':MAISON,options:[
      {v:'bornistes',l:'ONIQ'}]},
    {id:'nombre',nom:'Combien en importer',type:'number',valeur:'50'},
    {id:'jeton',nom:'Jeton de l’API Sirene',large:true,valeur:reglageLocal('sirene')||'',
     aide:'gratuit, à créer une fois sur portail-api.insee.fr — il est gardé dans ce navigateur'}
  ],async function(v){
    if(!v.jeton) throw new Error('Sans jeton, le registre refuse la requête. Créez-en un sur portail-api.insee.fr, c’est gratuit.');
    reglageLocal('sirene',v.jeton);
    var q='activitePrincipaleUniteLegale:'+v.naf
      +' AND trancheEffectifsUniteLegale:'+v.tranche
      +' AND etatAdministratifUniteLegale:A';
    var url='https://api.insee.fr/api-sirene/3.11/siret?q='
      +encodeURIComponent(q+' AND codePostalEtablissement:'+v.dep+'*')
      +'&nombre='+(Math.min(+v.nombre||50,200));
    var r=await fetch(url,{headers:{'X-INSEE-Api-Key-Integration':v.jeton,'Accept':'application/json'}});
    if(!r.ok) throw new Error('Le registre a répondu '+r.status+'. Vérifiez le jeton et le code NAF.');
    var j=await r.json();
    var lignes=(j.etablissements||[]).map(function(e){
      var u=e.uniteLegale||{}, a=e.adresseEtablissement||{};
      var tr=u.trancheEffectifsUniteLegale||'';
      return {societe:(u.denominationUniteLegale||[u.prenom1UniteLegale,u.nomUniteLegale].filter(Boolean).join(' ')||'Sans nom'),
        activite:v.activite, siren:e.siren, naf:u.activitePrincipaleUniteLegale||'',
        effectif:TRANCHE[tr]?TRANCHE[tr].lab:tr, effectif_num:TRANCHE[tr]?TRANCHE[tr].n:0,
        code_postal:a.codePostalEtablissement||'',
        ville:[a.codePostalEtablissement,a.libelleCommuneEtablissement].filter(Boolean).join(' '),
        source:'Registre Sirene', etape:'A contacter', owner_email:moi};
    });
    if(!lignes.length) throw new Error('Aucun établissement trouvé pour ce filtre.');
    var dejala=await lire('ls_prospects','select=siren&siren=not.is.null&limit=5000');
    var vus={}; dejala.forEach(function(d){ vus[d.siren]=1; });
    var neufs=lignes.filter(function(l){ if(vus[l.siren])return false; vus[l.siren]=1; return true; });
    if(!neufs.length) throw new Error('Les '+lignes.length+' établissements trouvés sont déjà dans le fichier.');
    await ecrire('ls_prospects',neufs);
    await tracer('comptes.importes',neufs.length+' depuis le registre');
    VUES.comptes();
  });
}

/* ══ Session d'appels ══════════════════════════════════════════════
   Le principe tient en une phrase : la personne qui décroche ne doit
   rien préparer, rien chercher et rien saisir. Elle clique sur
   Commencer, elle appelle, elle clique sur ce qui s'est passé, la
   fiche suivante arrive. */
var RESULTATS=[
  {id:'interesse',    lab:'Intéressé',     touche:'1', aide:'on note le contact et la suite'},
  {id:'rappeler',     lab:'Rappeler',      touche:'2', aide:'date ET heure du rappel'},
  {id:'absent',       lab:'Absent',        touche:'3',
   aide:'sort de la file ; « Rappeler » si vous voulez le revoir'},
  {id:'pas_interesse',lab:'Pas intéressé', touche:'4', aide:'sort de la file'},
  {id:'faux_numero',  lab:'Faux numéro',   touche:'5', aide:'retire le numéro de la fiche'}
];
/* En relance de devis, les mêmes boutons n'ont pas les mêmes suites :
   « Absent » relance dans quatre jours ouvrés, « Pas intéressé » passe
   le devis en Perdu. Le dire sous le bouton, plutôt que de laisser
   l'aide des appels à froid qui ne s'applique pas. */
function resultatsPour(mode){
  if(mode!=='relance')return RESULTATS;
  var aides={interesse:'il donne suite : on note ce qui a été convenu',
             rappeler:'à la date qu’il vous donne',
             absent:'sort de la file, à relancer à la main',
             pas_interesse:'le devis passe en Perdu, avec le motif',
             faux_numero:'retire le numéro de la fiche'};
  return RESULTATS.map(function(x){ var c={}; for(var k in x)c[k]=x[k]; if(aides[x.id])c.aide=aides[x.id]; return c; });
}
var SESSION=null, MINUTEUR=null;

/* ══ Les réglages de la file ═══════════════════════════════════════
   Appeler dans l'ordre du fichier, c'est appeler au hasard. L'engrenage
   décide qui remonte : la taille, le chiffre d'affaires, le secteur, le
   territoire — et dans quel ordre. Le réglage est gardé par personne et
   par navigateur : chacun sa file. */
var FILTRE_DEFAUT={eff_min:'',eff_max:'',ca_min:'',ca_max:'',cp:'',naf:'',source:'',
  jamais:true,rappels:true,tri:'anciennete'};
function filtreFile(){
  try{ return Object.assign({},FILTRE_DEFAUT,JSON.parse(localStorage.getItem('ls-file')||'{}')); }
  catch(e){ return Object.assign({},FILTRE_DEFAUT); }
}
function poserFiltre(f){ try{ localStorage.setItem('ls-file',JSON.stringify(f)); }catch(e){} }
function filtreActif(){
  var f=filtreFile();
  return !!(f.eff_min||f.eff_max||f.ca_min||f.ca_max||f.cp||f.naf||f.source
    ||!f.jamais||!f.rappels||f.tri!=='anciennete');
}
/* Traduit le réglage en morceau de requête. */
function bribeFiltre(){
  var f=filtreFile(), q='';
  if(f.eff_min) q+='&effectif_num=gte.'+(+f.eff_min);
  if(f.eff_max) q+='&effectif_num=lte.'+(+f.eff_max);
  if(f.ca_min)  q+='&ca=gte.'+(+f.ca_min);
  if(f.ca_max)  q+='&ca=lte.'+(+f.ca_max);
  if(f.cp)      q+='&code_postal=like.'+encodeURIComponent(f.cp.trim())+'*';

  if(f.source)  q+='&source=eq.'+encodeURIComponent(f.source.trim());
  return q;
}
function triFile(){
  var t=filtreFile().tri;
  if(t==='ca')       return '&order=ca.desc.nullslast';
  if(t==='effectif') return '&order=effectif_num.desc.nullslast';
  return '&order=created_at.asc';
}
function resumeFiltre(){
  var f=filtreFile(), m=[];
  if(f.eff_min||f.eff_max) m.push((f.eff_min||'0')+' à '+(f.eff_max||'∞')+' salariés');
  if(f.ca_min||f.ca_max)   m.push('CA '+(f.ca_min?euro(f.ca_min):'0')+' à '+(f.ca_max?euro(f.ca_max):'∞'));
  if(f.cp)     m.push('code postal '+f.cp+'…');
  if(f.naf)    m.push('NAF '+f.naf+'…');
  if(f.source) m.push('origine : '+f.source);
  if(!f.jamais)  m.push('rappels seulement');
  if(!f.rappels) m.push('sans les rappels');
  if(f.tri==='ca')       m.push('plus gros CA en premier');
  if(f.tri==='effectif') m.push('plus gros effectifs en premier');
  return m.join(' · ');
}

/* Les fournisseurs de leads, et lesquels me reviennent. Un lead sans
   commercial attitré revient à tout le monde : mieux vaut être rappelé
   deux fois que pas du tout. */
var SOURCES_CACHE=null;
async function sourcesLeads(){
  if(SOURCES_CACHE)return SOURCES_CACHE;
  var l=[];
  try{ l=await lire('ls_sources','select=nom,genre,owner_email,delai_min&limit=200'); }catch(e){}
  var lead=l.filter(function(x){ return x.genre!=='sortant'; });
  SOURCES_CACHE={
    toutes:lead.map(function(x){return x.nom;}),
    miennes:lead.filter(function(x){ return !x.owner_email || x.owner_email===moi; })
                .map(function(x){return x.nom;})
  };
  return SOURCES_CACHE;
}
function listeIn(noms){ return '("'+noms.map(function(n){return String(n).replace(/"/g,'');}).join('","')+'")'; }

/* La nature d'une fiche ne dépend plus d'une chaîne de caractères qui
   doit tomber juste : elle est marquée sur la fiche. Un lead saisi à la
   main est un lead, même si le nom du fournisseur ne correspond à rien. */
function bribeNature(mode){ return mode==='lead' ? '&est_lead=is.true' : '&est_lead=is.false'; }

/* Une entreprise passée devant un commercial est mise au repos six
   mois. Deux exceptions, et deux seulement : une promesse de rappel,
   qui doit toujours revenir à la date dite, et une relance de devis,
   qui n'est pas de la prospection. */
var REPOS_MOIS=6;
function bribeRepos(){
  var d=new Date(); d.setMonth(d.getMonth()-REPOS_MOIS);
  return '&vu_le=lt.'+d.toISOString();
}
/* Marquer la fiche à l'instant où elle s'affiche, pas quand on note le
   résultat : un appel qui n'aboutit pas ne se note pas, et c'est
   précisément celui-là qui revenait chez le collègue le lendemain. */
function marquerVue(table,id){
  if(!id)return;
  try{ modifier(table,'id=eq.'+id,{vu_le:new Date().toISOString()}).catch(function(){}); }
  catch(e){}
}

/* Une seule écriture de la question « quels devis attendent une
   réponse ? ». Le compteur de la carte et la file d'appels la
   partagent : c'est la seule façon d'être sûr que le chiffre affiché
   corresponde à ce qui s'ouvre au clic. */
/* Les deux réglages de la file, « jamais appelés » et « rappels
   promis », s'appliquent au compteur comme à la file. Sans ça, une
   carte annonce des appels que le clic n'ouvrira pas. */
function bribeDue(ff,maintenant){
  if(ff.jamais&&ff.rappels)
    return '&or=(appel_resultat.is.null,rappel_le.lte.'+maintenant+')';
  if(ff.rappels) return '&rappel_le=lte.'+maintenant;
  if(ff.jamais)  return '&appel_resultat=is.null';
  return '&id=is.null';   /* les deux coupés : la file est vide, disons-le */
}

/* Ce que la file servira vraiment, écrit une fois pour les compteurs
   comme pour la file. Le repos de six mois ne s'applique qu'aux fiches
   jamais appelées : une promesse de rappel revient toujours à la date
   dite, c'est tout l'intérêt d'une promesse. Mélanger les deux faisait
   annoncer « 1 lead » à une carte qui en ouvrait ensuite trente. */
function bribeFile(ff,maintenant){
  var d=new Date(); d.setMonth(d.getMonth()-REPOS_MOIS);
  var repos=d.toISOString();
  if(ff.jamais&&ff.rappels)
    return '&or=(and(appel_resultat.is.null,vu_le.lt.'+repos+'),rappel_le.lte.'+maintenant+')';
  if(ff.rappels) return '&rappel_le=lte.'+maintenant;
  if(ff.jamais)  return '&appel_resultat=is.null&vu_le=lt.'+repos;
  return '&id=is.null';
}

function bribeRelance(){
  /* Un devis parti ne revient pas tout seul : il revient à la date que
     le commercial a posée. Sans date, il vit dans Suivi des devis. */
  return 'tel=not.is.null&etape=in.(Devis envoye,Relance)'
    +'&rappel_le=lte.'+new Date().toISOString()
    +filtreMaison()+bribeLibre();
}
function fileRelances(n){
  /* Le plus ancien d'abord : un devis qui dort depuis trois semaines
     passe avant celui d'hier. C'est l'inverse des leads, et c'est
     voulu — un devis vieillit mal, un lead se périme. */
  return lire('ls_prospects','select=*&'+bribeRelance()
    +'&order=rappel_le.asc.nullsfirst&limit='+(n||1));
}

async function fileAppels(n,mode){
  mode=mode||(SESSION&&SESSION.mode)||'froid';
  var fm=filtreMaison(), fb=bribeFiltre(), f=filtreFile(), nat=bribeNature(mode);
  var mien = mode==='lead' ? '&owner_email=eq.'+encodeURIComponent(moi||'') : '';
  nat+=bribeLibre();

  /* La relance se calcule à part, et c'est volontaire. Un devis parti
     est un devis parti, qu'il vienne d'un lead acheté ou d'un appel à
     froid : le filtrer par nature ou par les réglages du fichier
     revenait à compter des relances qu'on ne servait jamais. */
  if(mode==='relance') return fileRelances(n);

  /* Une promesse de rappel passe avant tout, dans les deux files. */
  if(f.rappels){
    var q='select=*&rappel_le=lte.'+new Date().toISOString()
      +'&etape=not.in.(Gagne,Perdu)&order=rappel_le.asc&limit='+(n||1)+fm+fb+nat;
    var duS=await lire('ls_prospects',q+mien);
    if(!duS.length && mien) duS=await lire('ls_prospects',q);   /* leads sans commercial attitré */
    if(duS.length)return duS;
  }
  if(!f.jamais)return [];

  if(mode==='lead'){
    /* Le plus frais d'abord : le délai court depuis l'instant où le
       formulaire est parti, pas depuis notre saisie. */
    var ql='select=*&tel=not.is.null&appel_resultat=is.null&etape=not.in.(Gagne,Perdu)'
      +bribeRepos()+'&order=created_at.desc&limit='+(n||1)+fm+fb+nat;
    var l=await lire('ls_prospects',ql+mien);
    if(!l.length && mien) l=await lire('ls_prospects',ql);
    return l;
  }
  /* À froid : le fichier, dans l'ordre choisi dans l'engrenage. */
  return lire('ls_prospects','select=*&tel=not.is.null&appel_resultat=is.null'
    +'&etape=not.in.(Gagne,Perdu)'+bribeRepos()+'&limit='+(n||1)+fm+fb+nat+triFile());
}

      /* 1 — à froid, rappels promis */

      /* 2 — mes appels du jour */

      /* 6 — la file des leads, sans compter deux fois la même fiche.

                ? '<b>'+nb(sansTel)+' fiche'+(sansTel>1?'s':'')+' attend'+(sansTel>1?'ent':'')
                  +' un numéro.</b> Le registre ne publie pas les téléphones, et sans numéro '
                  +'une fiche ne peut pas entrer dans une file d’appels. Ouvrez l’engrenage, '
                  +'bouton « À la main ».'
                : 'Aucun partenaire à appeler. Ouvrez l’engrenage : il va chercher les bons '

        +'<button class="btn'+(parts?'':' fort')+'" id="go-part-eng" '
