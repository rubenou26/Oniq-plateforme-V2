    {id:'adresse',nom:'Adresse de réponse (la vraie boîte)',type:'email',requis:true,large:true,valeur:b.adresse||'',ph:'ruben@oniq.online',
      aide:'une vraie boîte, que quelqu’un lit : les réponses arrivent là. Elle n’envoie rien'},
    {id:'adresse_envoi',nom:'Adresse d’envoi (sous-domaine)',type:'email',large:true,valeur:b.adresse_envoi||'',
      ph:domaineEnvoi?'ruben@'+domaineEnvoi:'ruben@mail.oniq.online',
      aide:domaineEnvoi?'vide : la même partie avant le @, sur '+domaineEnvoi+', le domaine d’envoi réglé dans Automatisations'
        :'le domaine d’envoi de la maison n’est pas réglé dans Automatisations : indiquez l’adresse complète'},
    {id:'activite',nom:'Maison',type:'select',valeur:act,
      options:[{v:'bornistes',l:'ONIQ'}]},
    {id:'nom_expediteur',nom:'Nom d’expéditeur',requis:true,valeur:b.nom_expediteur||'',ph:'Ruben Hammarlebiod'},
    {id:'proprietaire_email',nom:'Commercial (compte du Standard)',type:'email',valeur:b.proprietaire_email||(moi||''),
      aide:'la personne qui lit cette boîte'},
    {id:'mise_en_service_le',nom:'Mise en service',type:'date',requis:true,
      valeur:b.mise_en_service_le||new Date().toISOString().slice(0,10),
      aide:'la date à laquelle cette adresse a commencé à envoyer des mails, même à la main. Le plafond du jour en découle : 15, 25, 40, puis 50'},
    {id:'actif',nom:'Active',type:'check',valeur:b.id?!!b.actif:true,ph:'cette boîte peut envoyer'},
    {id:'note',nom:'Note',type:'textarea',large:true,valeur:b.note||''}
  ],async function(v){
    var adresse=String(v.adresse||'').toLowerCase().trim();
    var envoi=String(v.adresse_envoi||'').toLowerCase().trim();
    if(!envoi&&domaineEnvoi)envoi=adresse.split('@')[0]+'@'+domaineEnvoi;
    if(!envoi)throw new Error('Il faut une adresse d’envoi sur le sous-domaine, ou régler le domaine d’envoi de la maison dans Automatisations.');
    if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(envoi))throw new Error('L’adresse d’envoi n’a pas la forme d’un e-mail.');
    if(envoi===adresse&&!confirm('L’adresse d’envoi est la même que la vraie boîte : la réputation du domaine principal portera les campagnes. Continuer quand même ?'))throw new Error('Choisissez une adresse d’envoi sur le sous-domaine.');
    var corps={adresse:adresse,adresse_envoi:envoi,activite:v.activite,
      nom_expediteur:v.nom_expediteur,proprietaire_email:String(v.proprietaire_email||'').toLowerCase().trim(),
      mise_en_service_le:v.mise_en_service_le,actif:!!v.actif,note:v.note||'',maj_le:new Date().toISOString()};
    if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(corps.adresse))throw new Error('L’adresse n’a pas la forme d’un e-mail.');
    if(b.id) await modifier('ls_boites','id=eq.'+b.id,corps);
    else { await ecrire('ls_boites',corps); await tracer('boite.creee',corps.adresse); }
    VUES.boites();
  }, b.id?async function(){ await supprimer('ls_boites','id=eq.'+b.id); VUES.boites(); }:null);
}

/* ── La liste des campagnes ─────────────────────────────────────── */
/* ── L’écran des campagnes ───────────────────────────────────────
   Quatre cartes, un champ par carte, et rien d’autre à toucher.

   Les quatre campagnes se créent toutes seules au premier passage.
   Le moteur, qui tourne toutes les cinq minutes chez Supabase, fait
   le reste sans que personne regarde : il moissonne le registre
   métier par métier, cherche les adresses, et fait entrer en
   campagne ceux qui passent le filtre. Fermer le navigateur ne
   l’arrête pas.

   Le seul geste qui reste est celui qu’on ne peut pas prendre à la
   place de quelqu’un : le premier envoi. Un mail parti ne revient
   pas. Après, plus rien à cliquer. */
async function vueLesCampagnes(){
  outils('');
  bouton('Campagne libre',function(){ ficheCampagne(null); });
  try{
    var cles=Object.keys(MODELES)
      .filter(function(k){ return MAISON==='les_deux'||MODELES[k].maison===MAISON; })
      .sort(function(a,b){ return MODELES[a].ordre-MODELES[b].ordre; });

    var cs=await lire('ls_campagnes','select=*&order=cree_le.desc&limit=100'+filtreMaison());
    var parModele={}, libres=[];
    cs.forEach(function(c){
      var k=c.modele||'';
      if(k&&MODELES[k]&&['terminee','annulee'].indexOf(c.statut)<0&&!parModele[k]){ parModele[k]=c; return; }
      libres.push(c);
    });

    /* Ce qui manque se crée maintenant. Personne ne devrait avoir à
       demander l’existence de quelque chose qui est toujours voulu. */
    var neuves=cles.filter(function(k){ return !parModele[k]; });
    if(neuves.length){
      $('#vue').innerHTML='<div class="panneau"><div class="corps">'
        +'<p class="sec">Préparation des campagnes…</p></div></div>';
      for(var i=0;i<neuves.length;i++){
        try{ parModele[neuves[i]]=await creerModele(neuves[i]); }catch(e){
          $('#vue').innerHTML='<div class="panneau">'+vide('Mise à jour à passer',
            'Les quatre campagnes ont besoin du correctif « campagnes-modeles » dans Supabase. '
            +'Détail : '+String(e.message||e).slice(0,200))+'</div>';
          return;
        }
      }
    }

    var bilans={}, moissons={}, fichiers={};
    await Promise.all(cles.map(async function(k){
      var c=parModele[k]; if(!c)return;
      try{ var b=await rpc('ls_campagne_bilan',{p_id:c.id}); bilans[c.id]=(b&&b[0])||{}; }catch(e){ bilans[c.id]={}; }
      try{ var m=await rpc('ls_moisson_bilan',{p_id:c.id}); moissons[c.id]=(m&&m[0])||{}; }catch(e){ moissons[c.id]={}; }
      try{ fichiers[c.id]=await compterCible(c.cible||{},c.activite); }catch(e){ fichiers[c.id]=null; }
    }));
    await Promise.all(libres.map(async function(c){
      try{ var b=await rpc('ls_campagne_bilan',{p_id:c.id}); bilans[c.id]=(b&&b[0])||{}; }catch(e){ bilans[c.id]={}; }
    }));

    var h=bandePharow(null);
    h+='<div class="panneau"><header><h2>Les quatre campagnes</h2>'
      +'<span class="aide">tout tourne côté serveur. Vous ne réglez que vos départements</span></header>'
      +'<div class="modeles">'
      +cles.map(function(k){
        var m=MODELES[k], c=parModele[k]; if(!c)return '';
        var b=bilans[c.id]||{}, mo=moissons[c.id]||{}, au=fichiers[c.id];
        var st=CSTAT[c.statut]||[c.statut,'neu'];
        var brouillon=c.statut==='brouillon';
        var tr=+mo.tranches||0, fin=+mo.finies||0;
        return '<div class="mod">'
          +'<div class="maison">'+ech(UNE_SEULE?m.nom.split(' · ')[0]:(LAB[m.maison]||m.maison))+'</div>'
          +'<h3>'+ech(m.titre)+'</h3>'
          +'<div class="sous">'+ech(m.sous)+'</div>'
          +'<div class="champ" style="margin:2px 0 0"><label for="dep-'+k+'">Départements</label>'
            +'<input id="dep-'+k+'" data-dep="'+c.id+'" value="'+ech((c.cible||{}).departements||'')+'" '
            +'placeholder="69, 01, 38" autocomplete="off">'
            +'<div class="aide">un nom de région suffit : AURA, IDF, PACA, OCC, NA, BFC, BRE, '
            +'CVL, GE, HDF, NOR, PDL, COR. FR pour la France entière</div></div>'
          +'<div class="champ" style="margin:0"><label for="src-'+k+'">Fichier</label>'
            +'<select id="src-'+k+'" data-src="'+c.id+'">'
            +[['','Tout le fichier'],['pharow','Pharow seulement'],['gratuit','Moisson gratuite seulement']]
              .map(function(o){ return '<option value="'+o[0]+'"'
                +(((c.cible||{}).source||'')===o[0]?' selected':'')+'>'+ech(o[1])+'</option>'; }).join('')
            +'</select>'
            +'<div class="aide">les deux seuls réglages. Le reste suit tout seul</div></div>'
          +'<div class="chiffres">'
            +'<div><b>'+(au==null?'…':nb(au))+'</b><span class="sec">au fichier</span></div>'
            +'<div><b>'+nb(b.contacts||0)+'</b><span class="sec">en campagne</span></div>'
            +'<div><b>'+nb(b.envoyes||0)+'</b><span class="sec">partis</span></div>'
            +'<div><b>'+nb(b.repondus||0)+'</b><span class="sec">réponses</span></div>'
            +'<div><b>'+nb(b.appels_entrants||0)+'</b><span class="sec">appels</span></div>'
          +'</div>'
          +'<div class="sec" style="font-size:12px">'
            +(tr?'Moisson : '+nb(fin)+' tranche'+(fin>1?'s':'')+' finie'+(fin>1?'s':'')+' sur '+nb(tr)
                +(mo.tourne_le?', dernière '+depuis(mo.tourne_le):', pas encore commencée')
              :'Moisson à préparer')
          +'</div>'
          /* La fenêtre d'envoi, écrite noir sur blanc : c'est elle qui
             explique pourquoi une campagne de cent contacts met une
             semaine à partir, et le samedi n'a de sens que pour les
             métiers qui travaillent le samedi. */
          +'<div class="sec" style="font-size:12px">Envoi du lundi au vendredi'
            +(c.samedi?', <b>et le samedi matin</b>':'')
            +' · <a href="#" data-sam="'+c.id+'">'
            +(c.samedi?'ne plus écrire le samedi':'écrire aussi le samedi matin')+'</a></div>'
          +'<footer style="gap:7px">'
            +'<button class="btn mini" data-detail="'+c.id+'">Détail</button>'
            +(brouillon
              ?'<button class="btn fort" data-lancer="'+c.id+'">Lancer</button>'
              :etat(st[0],st[1]))
          +'</footer></div>';
      }).join('')
      +'</div></div>';

    if(libres.length){
      h+='<div class="panneau"><header><h2>Les autres campagnes</h2>'
        +'<span class="aide">celles montées à la main, et les anciennes</span></header>'
        +'<div class="tbl-scroll"><table><thead><tr><th>Campagne</th><th>Audience</th>'
        +'<th>État</th><th class="n">Contacts</th><th class="n">Partis</th><th class="n">Réponses</th>'
        +'<th class="n">Appels</th><th></th></tr></thead><tbody>'
        +libres.map(function(c){
          var b=bilans[c.id]||{}, st=CSTAT[c.statut]||[c.statut,'neu'];
          return '<tr><td><b>'+ech(c.nom)+'</b><br><span class="sec">'+ech(LAB[c.activite]||'')+'</span></td>'
            +'<td>'+ech(resumeCible(c.cible||{}))+'</td>'
            +'<td>'+etat(st[0],st[1])+'</td>'
            +'<td class="n">'+nb(b.contacts||c.nb_cibles||0)+'</td>'
            +'<td class="n">'+nb(b.envoyes||0)+'</td>'
            +'<td class="n">'+nb(b.repondus||0)+'</td>'
            +'<td class="n">'+nb(b.appels_entrants||0)+'</td>'
            +'<td class="n"><button class="btn mini" data-detail="'+c.id+'">Ouvrir</button></td></tr>';
        }).join('')+'</tbody></table></div></div>';
    }
    $('#vue').innerHTML=h;

    chargerPharow().then(function(ph){
      var z=$('#bande-pharow'); if(!z)return;
      z.outerHTML=bandePharow(ph);
      var bp=$('[data-pharow]'); if(bp)bp.onclick=function(){ ecranPharow(); };
    }).catch(function(){});

    $$('[data-detail]').forEach(function(b){
      b.onclick=async function(){
        var r=await lire('ls_campagnes','select=*&id=eq.'+b.dataset.detail+'&limit=1');
        if(r.length)ecranCampagne(r[0]);
      };
    });
    /* Le champ des départements : on enregistre quand il perd le
       focus, on resème la moisson, et l’écran se refait. */
    $$('[data-dep]').forEach(function(inp){
      var avant=inp.value;
      function poser(){
        if(inp.value===avant)return;
        avant=inp.value;
        inp.disabled=true;
        majDepartements(inp.dataset.dep,inp.value)
          .then(function(){ VUES.campagnes(); })
          .catch(function(e){ inp.disabled=false; alerteCopiable('Impossible',String(e.message||e).slice(0,200)); });
      }
      inp.onblur=poser;
      inp.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } };
    });
    /* Le samedi matin, campagne par campagne. Un hôtelier est à son
       poste, un expert-comptable non : ça ne se règle pas en bloc. */
    $$('[data-sam]').forEach(function(a){
      a.onclick=async function(e){
        e.preventDefault();
        a.textContent='…';
        try{
          var c0=(await lire('ls_campagnes','select=id,samedi&id=eq.'+a.dataset.sam+'&limit=1'))[0];
          await modifier('ls_campagnes','id=eq.'+a.dataset.sam,
            {samedi:!(c0&&c0.samedi===true),maj_le:new Date().toISOString()});
          VUES.campagnes();
        }catch(err){
          alerteCopiable('Réglage impossible',
            'La colonne « samedi » manque peut-être : le fichier correctif-samedi.sql '
            +'a-t-il été exécuté ?\n\n'+String(err.message||err).slice(0,200));
          VUES.campagnes();
        }
      };
    });
    $$('[data-src]').forEach(function(sel){
      sel.onchange=function(){
        sel.disabled=true;
        majSource(sel.dataset.src,sel.value)
          .then(function(){ VUES.campagnes(); })
          .catch(function(e){ sel.disabled=false; alerteCopiable('Impossible',String(e.message||e).slice(0,200)); });
      };
    });
    $$('[data-lancer]').forEach(function(b){
      b.onclick=function(){ lancerCampagne(b.dataset.lancer,b); };
    });
  }catch(e){
    $('#vue').innerHTML='<div class="panneau">'+vide('Campagnes indisponibles',
      String(e.message||e).indexOf('ls_campagnes')>-1
        ? 'La table des campagnes n’existe pas encore. Passez la mise à jour v3w dans Supabase.'
        : String(e.message||e).slice(0,300))+'</div>';
  }
};

/* Combien de fiches correspondent au ciblage, sans les exclusions
   fines : un ordre de grandeur, obtenu d’un seul comptage au lieu de
   trois mille lignes lues. */
async function compterCible(cible,activite){
  var r=requeteCible(cible,activite,1);
  /* compter() pose son propre select et sa propre limite : garder
     ceux de la requête d'audience ferait deux fois le même paramètre,
     et PostgREST n'en garde qu'un. */
  var q=r.q.replace(/^select=[^&]*&?/,'').replace(/&order=[^&]*/,'').replace(/&limit=[^&]*/,'');
  return await compter(r.table,q);
}

/* Créer la campagne d’un modèle : tout est déjà décidé. */
async function creerModele(cle){
  var m=MODELES[cle];
  /* Un code NAF déjà au catalogue porte peut-être un autre libellé.
     C’est le sien qui gagne : les fiches le porteront, et l’audience
     filtre là-dessus. */
  var catalogue=[];
  try{ catalogue=(await lire('ls_cibles','select=nom,naf,activite')).filter(function(x){ return x.activite===m.maison; }); }catch(e){}
  var nafs=m.metiers.map(function(t){
    var connu=catalogue.filter(function(x){ return String(x.naf||'').toUpperCase()===t.naf; })[0];
    return {nom:connu?connu.nom:t.nom,naf:t.naf};
  });
  var boites=[];
  try{ boites=(await rpc('ls_boites_bilan')||[]).filter(function(b){ return b.activite===m.maison&&b.actif; }); }catch(e){}
  var corps={nom:m.nom,activite:m.maison,modele:cle,
    objet:m.objet,corps:m.corps,objet2:m.objet2,corps2:m.corps2,objet3:m.objet3,corps3:m.corps3,
    habillage:'maison',cadence_h:12,delai2:8,delai3:18,samedi:m.samedi===true,
    boites:boites.map(function(b){ return b.id; }),
    cible:{qui:'partenaires',
      types:nafs.map(function(x){ return x.nom; }).concat([etiquettePharow(cle)]),
      nafs:nafs,chercher:true,
      departements:m.departements,source:'',nominatif:false,jamais_appeles:false,
      exclure_generiques:true,exclure_lies:true,exclure_jours:90,
      /* Une adresse de standard redevient utilisable dès qu'on sait à
         qui écrire, et le registre public donne le nom du dirigeant
         gratuitement. C'est ce réglage qui multiplie le volume sans
         dépenser un euro. */
      generiques_nominatifs:true,
      effectifs_hors:m.effectifs_hors||[]},
    owner_email:moi||'',maj_le:new Date().toISOString()};
  var r=await ecrire('ls_campagnes',corps);
  var c=r&&r[0];
  if(!c)throw new Error('Campagne non créée.');
  await semerMoisson(c);
  await tracer('campagne.creee',m.nom+' · modèle');
  return c;
}

/* Semer la moisson : une ligne par métier et par département. Le
   moteur les prendra une par une, la plus ancienne d’abord, et
   reprendra là où il s’est arrêté si une invocation est coupée. */
/* ══ Les départements, en un mot ═══════════════════════════════════
   Taper quatre-vingt-seize nombres pour dire « la France » n'a aucun
   sens, et c'est pour cette raison qu'on reste sur quatre
   départements sans jamais élargir. Un nom de région suffit donc, et
   FR vaut la France entière. */
var REGIONS={
  AURA:['01','03','07','15','26','38','42','43','63','69','73','74'],
  IDF: ['75','77','78','91','92','93','94','95'],
  PACA:['04','05','06','13','83','84'],
  OCC: ['09','11','12','30','31','32','34','46','48','65','66','81','82'],
  NA:  ['16','17','19','23','24','33','40','47','64','79','86','87'],
  BFC: ['21','25','39','58','70','71','89','90'],
  BRE: ['22','29','35','56'],
  CVL: ['18','28','36','37','41','45'],
  GE:  ['08','10','51','52','54','55','57','67','68','88'],
  HDF: ['02','59','60','62','80'],
  NOR: ['14','27','50','61','76'],
  PDL: ['44','49','53','72','85'],
  COR: ['2A','2B']
};
REGIONS.FR=Object.keys(REGIONS).reduce(function(t,k){ return t.concat(REGIONS[k]); },[]).sort();
var ALIAS_REGION={FRANCE:'FR',TOUT:'FR',PARTOUT:'FR',AUVERGNE:'AURA','RHONE-ALPES':'AURA',
  RHONEALPES:'AURA','ILE-DE-FRANCE':'IDF',IDF75:'IDF',PARIS:'IDF',SUD:'PACA',
  OCCITANIE:'OCC',AQUITAINE:'NA',BOURGOGNE:'BFC',BRETAGNE:'BRE',CENTRE:'CVL',
  'GRAND-EST':'GE',NORD:'HDF',NORMANDIE:'NOR',LOIRE:'PDL',CORSE:'COR'};
function listeDepartements(valeur){
  var out=[], vus={};
  String(valeur||'').toUpperCase().split(/[\s,;]+/).filter(Boolean).forEach(function(t){
    var cle=t.replace(/[^A-Z0-9-]/g,'');
    var r=REGIONS[cle]||REGIONS[ALIAS_REGION[cle]||''];
    (r||[t.replace(/[^0-9AB]/g,'')]).forEach(function(d){
      if(/^[0-9]$/.test(d))d='0'+d;
      if(d&&!vus[d]){ vus[d]=1; out.push(d); }
    });
  });
  return out;
}
async function semerMoisson(c){
  var cible=c.cible||{};
  var nafs=(cible.nafs||[]).filter(function(x){ return x&&x.naf; });
  var deps=String(cible.departements||'').split(/[\s,;]+/).filter(Boolean)
    .map(function(d){ return d.padStart(2,'0'); });
  if(!nafs.length||!deps.length)return 0;
  /* Ce qui ne correspond plus au filtre s’en va : sinon on continuerait
     de moissonner un département qu’on ne vise plus. */
  try{
    await supprimer('ls_moisson','campagne_id=eq.'+c.id
      +'&departement=not.in.('+deps.map(function(d){ return '"'+d+'"'; }).join(',')+')');
  }catch(e){}
  var lignes=[];
  nafs.forEach(function(t){
    deps.forEach(function(d){
      lignes.push({campagne_id:c.id,activite:c.activite,naf:t.naf,metier:t.nom,departement:d});
    });
  });
  var poses=0;
  for(var i=0;i<lignes.length;i+=100){
    var r=await appelle(URL_BASE+'/rest/v1/ls_moisson',{method:'POST',
      headers:entetes({'Prefer':'return=representation,resolution=ignore-duplicates'}),
      body:JSON.stringify(lignes.slice(i,i+100))});
    if(!r.ok)throw new Error(await r.text());
    poses+=((await r.json())||[]).length;
  }
  return poses;
}

/* Changer les départements d’une campagne : le filtre, et rien que le
   filtre. La moisson se resème, l’audience se recalcule au prochain
   passage du moteur. */
async function majDepartements(id,valeur){
  var deps=listeDepartements(valeur);
  var c=(await lire('ls_campagnes','select=*&id=eq.'+id+'&limit=1'))[0];
  if(!c)return;
  var cible=Object.assign({},c.cible||{},{departements:deps.join(', ')});
  await modifier('ls_campagnes','id=eq.'+id,{cible:cible,maj_le:new Date().toISOString()});
  c.cible=cible;
  await semerMoisson(c);
  await tracer('campagne.filtre',c.nom+' · '+(deps.join(', ')||'partout'));
}

/* Ne travailler que sur le fichier acheté, ou au contraire que sur la
   moisson gratuite. C'est ce qui permet de comparer les deux sur la
   même campagne, les mêmes mails et la même semaine. */
async function majSource(id,valeur){
  var c=(await lire('ls_campagnes','select=*&id=eq.'+id+'&limit=1'))[0];
  if(!c)return;
  var cible=Object.assign({},c.cible||{},{source:valeur||''});
  await modifier('ls_campagnes','id=eq.'+id,{cible:cible,maj_le:new Date().toISOString()});
  await tracer('campagne.fichier',c.nom+' · '+(valeur||'tout le fichier'));
}

/* Lancer : la seule décision qui reste. On vérifie, on demande une
   fois, et on bascule le statut. C’est le moteur qui compose et qui
   envoie, cinq minutes plus tard, que le navigateur soit ouvert ou
   non. */
async function lancerCampagne(id,bouton){
  var c=(await lire('ls_campagnes','select=*&id=eq.'+id+'&limit=1'))[0];
  if(!c)return;
  var boites=[]; try{ boites=(await rpc('ls_boites_bilan')||[]); }catch(e){}
  var rg={}; try{ (await lire('ls_reglages','select=cle,valeur&limit=60')).forEach(function(x){ rg[x.cle]=x.valeur; }); }catch(e){}
  var v=verifierCampagne(c,boites,rg,null);
  if(v.bloquants.length){
    alerteCopiable('Lancement bloqué',v.bloquants.join('\n\n')
      +'\n\nOuvrez « Détail », onglet Vérification, pour le détail.');
    return;
  }
  var au=0; try{ au=await compterCible(c.cible||{},c.activite); }catch(e){}
  if(!confirm('Lancer « '+c.nom+' » ?\n\n'
    +'Le moteur écrira à tous ceux qui passent le filtre, '+nb(au)+' fiches au fichier pour l’instant, '
    +'et à ceux qui arriveront ensuite, en trois mails espacés, depuis '
    +v.boites.map(function(x){ return x.adresse; }).join(' et ')+'.\n\n'
    +'Il continue même navigateur fermé. Ce qui part ne se rappelle pas.'))return;
  if(bouton){ bouton.disabled=true; bouton.textContent='…'; }
  try{
    await modifier('ls_campagnes','id=eq.'+c.id,{statut:'programmee',
      signature:c.signature||'',debut_le:new Date().toISOString(),
      lance_le:new Date().toISOString(),maj_le:new Date().toISOString()});
    await tracer('campagne.lancee',c.nom,c.id);
    alerteCopiable('Campagne lancée',
      'Le moteur passe toutes les cinq minutes. Il fait entrer les contacts qui passent le filtre, dans la '
      +'limite de ce que vos boîtes peuvent envoyer dans la journée, et les mails partent du lundi au '
      +'vendredi, de 8 h 30 à 12 h et de 14 h à 18 h.\n\n'
      +'Les mails 2 et 3 suivront à J+8 et J+18 pour ceux qui n’ont pas répondu. Une réponse sort le contact '
      +'de la séquence et remonte sa fiche en tête de file d’appel.\n\n'
      +'Vous n’avez plus rien à faire.');
    VUES.campagnes();
  }catch(e){
    if(bouton){ bouton.disabled=false; bouton.textContent='Lancer'; }
    alerteCopiable('Impossible',String(e.message||e).slice(0,300));
  }
}

/* ══ Pharow ════════════════════════════════════════════════════════
   Pharow est un outil de ciblage B2B français : il sait dire quelles
   entreprises ont vingt à cent cinquante salariés, plusieurs sites,
   et qui les dirige, ce que le registre public ne dit pas. Il n’a pas
   d’interface de programmation ouverte : on ne peut pas l’interroger
   depuis le CRM. Il livre, lui, et ce qu’il livre entre directement
   dans la campagne qui le cherche. */

/* La source Pharow, créée à la demande. Le jeton garde la porte de la
   fonction lead : sans lui, personne n’écrit dans le fichier. */
async function sourcePharow(){
  var l=[];
  try{ l=await lire('ls_sources','select=*&nom=eq.Pharow&limit=1'); }catch(e){}
  if(l.length){
    var maj={};
    if(!l[0].jeton)maj.jeton=jetonNeuf();
    if(l[0].destination!=='prospection'){ maj.destination='prospection'; maj.reception='webhook'; }
    if(Object.keys(maj).length){
      await modifier('ls_sources','id=eq.'+l[0].id,maj);
      Object.assign(l[0],maj);
    }
    return l[0];
  }
  var r=await ecrire('ls_sources',{nom:'Pharow',activite:'les_deux',genre:'plateforme',
    statut:'en_test',reception:'webhook',destination:'prospection',jeton:jetonNeuf(),
    url:'https://pharow.com',
    note:'Ciblage B2B. Livre dans le fichier de prospection, jamais dans la file d’appels.'});
  return r&&r[0];
}

/* ══ L’adresse de dépôt ═══════════════════════════════════════════
   Deux pièges, et il a fallu les deux pour comprendre.

   Le nom. Supabase ne laisse pas toujours choisir le nom d’une
   fonction : déployée depuis le tableau de bord, elle s’appelle
   « swift-handler » alors qu’elle porte le titre « lead ». C’est le
   nom de l’URL qui compte, pas le titre. On le retient dans les
   réglages, et l’écran Pharow permet de le corriger.

   La clé publique. Le portail de Supabase réclame une clé d’API sur
   toute requête, même quand la vérification de jeton est éteinte sur
   la fonction : sans elle, 401 avant que le code démarre. Cette clé
   publiable n’est pas un secret, elle est déjà dans cette page et
   dans le navigateur de chaque commercial ; elle ouvre seulement la
   porte du portail. Ce qui garde vraiment la fonction, c’est notre
   propre jeton, celui qui suit « jeton= ». */
var FONCTION_LEAD=null;
async function fonctionLead(){
  if(FONCTION_LEAD)return FONCTION_LEAD;
  try{
    var r=await lire('ls_reglages','select=valeur&cle=eq.fonction_lead&limit=1');
    FONCTION_LEAD=String((r[0]||{}).valeur||'').trim()||'lead';
  }catch(e){ FONCTION_LEAD='lead'; }
  return FONCTION_LEAD;
}
async function poserFonctionLead(nom){
  nom=String(nom||'').trim().replace(/^\/+|\/+$/g,'').replace(/[^A-Za-z0-9_-]/g,'')||'lead';
  var r=await appelle(URL_BASE+'/rest/v1/ls_reglages',{method:'POST',
    headers:entetes({'Prefer':'resolution=merge-duplicates'}),
    body:JSON.stringify({cle:'fonction_lead',valeur:nom,maj_le:new Date().toISOString()})});
  if(!r.ok)throw new Error(await r.text());
  FONCTION_LEAD=nom;
  return nom;
}
/* Essayer l’adresse pour de bon. La fonction répond « POST attendu »
   à une visite en GET : c’est une preuve de vie qui n’écrit rien. */
async function essayerFonctionLead(nom){
  var u=URL_BASE+'/functions/v1/'+encodeURIComponent(nom)+'?apikey='+encodeURIComponent(CLE);
  try{
    var r=await fetch(u,{method:'GET'});
    var t=await r.text();
    if(r.status===404)return {ok:false,dit:'Aucune fonction ne porte ce nom. Vérifiez l’adresse affichée dans Supabase, onglet Edge Functions.'};
    if(t.indexOf('POST attendu')>-1||r.status===405)return {ok:true,dit:'L’adresse répond. Pharow pourra déposer ses contacts ici.'};
    if(r.status===401)return {ok:false,dit:'Le portail Supabase a refusé l’appel. Vérifiez que « Verify JWT with legacy secret » est bien éteint dans les réglages de la fonction.'};
    return {ok:false,dit:'Réponse inattendue ('+r.status+') : '+String(t).slice(0,160)};
  }catch(e){
    return {ok:false,dit:'Aucune réponse. Soit le nom est faux, soit la fonction demande encore un jeton Supabase (« Verify JWT » à couper dans ses réglages).'};
  }
}

/* Une seule adresse pour les quatre campagnes : c’est le code NAF de
   la fiche qui dit à quelle campagne elle appartient, et la fonction
   lead s’en charge. Quatre adresses à ne pas confondre, c’était une
   erreur de plus à commettre un jour. */
/* L'étiquette que porte une fiche envoyée à l'adresse d'une campagne
   précise. Elle fait partie de l'audience de cette campagne, comme
   n'importe quel métier : c'est ce qui permet de cibler librement
   dans Pharow sans que la fiche se perde. */
function etiquettePharow(cle){
  var m=MODELES[cle]; return m?('Pharow · '+m.nom):'';
}
/* Deux façons de brancher, et la deuxième est celle qu'on utilise en
   vrai. Sans « campagne », c'est le code NAF de la fiche qui décide
   où elle va : pratique pour une liste bien cadrée. Avec « campagne »,
   la fiche entre là où on l'a dit, quel que soit son code : c'est ce
   qu'il faut quand on cible sur un signal plutôt que sur un secteur,
   par exemple les entreprises qui recrutent. */
function lienPharow(src,fonction,cle){
  if(!src||!src.jeton)return '';
  return URL_BASE+'/functions/v1/'+encodeURIComponent(fonction||'lead')
    +'?jeton='+encodeURIComponent(src.jeton)+'&vers=prospection'
    +(cle?'&campagne='+encodeURIComponent(cle):'')
    +'&apikey='+encodeURIComponent(CLE);
}
/* Les campagnes créées avant cette adresse n'ont pas l'étiquette dans
   leur audience. On la leur pose sans rien demander : sinon les
   premières fiches de Pharow arriveraient et n'entreraient nulle
   part. */
async function reparerEtiquettes(){
  var cs=[];
  try{ cs=await lire('ls_campagnes','select=id,modele,cible&modele=neq.&limit=50'); }catch(e){ return; }
  for(var i=0;i<cs.length;i++){
    var c=cs[i], m=MODELES[c.modele]; if(!m)continue;
    var et=etiquettePharow(c.modele);
    var cible=c.cible||{}, types=(cible.types||[]).slice();
    if(types.indexOf(et)>-1)continue;
    types.push(et);
    try{ await modifier('ls_campagnes','id=eq.'+c.id,
      {cible:Object.assign({},cible,{types:types}),maj_le:new Date().toISOString()}); }catch(e){}
  }
}

/* Les critères d’un modèle, écrits comme on les recopie dans Pharow. */
function criteresModele(cle){
  var m=MODELES[cle]; if(!m)return '';
  var l=[];
  l.push('Pays : France');
  l.push('Départements : '+m.departements);
  l.push('Codes NAF : '+m.metiers.map(function(x){ return x.naf; }).join(', '));
  l.push('(soit : '+m.metiers.map(function(x){ return x.nom; }).join(', ')+')');
  l.push('Effectif : '+m.pharow.effectif);
  l.push('Fonctions à extraire : '+m.pharow.fonctions);
  l.push('Signaux : '+m.pharow.signaux);
  l.push('Enrichissement : e-mail professionnel vérifié, nom et fonction du contact');
  l.push('Ne pas prendre : les adresses génériques du type contact@ ou info@');
  l.push('');
  l.push('Colonnes à envoyer : société, contact, fonction, e-mail, téléphone, ville, code postal, SIREN, code NAF, effectif');
  l.push('Envoyez le code NAF si vous l’avez : sans lui, l’adresse propre à cette campagne suffit.');
  return l.join('\n');
}

/* Ce que Pharow a livré, tous modèles confondus. Le lien est unique :
   c’est le code NAF de chaque fiche qui la range dans la bonne
   campagne, pas quatre liens à ne pas confondre. */
async function chargerPharow(){
  var ph={src:null,lien:'',fonction:'lead',fiches:0,avecMail:0,nominatives:0,entres:0};
  ph.fonction=await fonctionLead();
  try{ var l=await lire('ls_sources','select=*&nom=eq.Pharow&limit=1'); ph.src=l[0]||null; }catch(e){}
  if(ph.src&&ph.src.jeton)ph.lien=lienPharow(ph.src,ph.fonction);
  try{ ph.fiches=await compter('ls_prescripteurs','source=eq.Pharow'); }catch(e){}
  if(!ph.fiches)return ph;
  try{ ph.avecMail=await compter('ls_prescripteurs','source=eq.Pharow&email=neq.&email=not.is.null'); }catch(e){}
  try{ ph.nominatives=await compter('ls_prescripteurs','source=eq.Pharow&email_origine=in.(direction,personne)'); }catch(e){}
  try{
    var vus={};
    (await lire('ls_prescripteurs','select=email&source=eq.Pharow&email=neq.&limit=5000'))
      .forEach(function(x){ var m=String(x.email||'').toLowerCase().trim(); if(m)vus[m]=true; });
    var n=0;
    (await lire('ls_sequences','select=email&limit=5000'))
      .forEach(function(x){ if(vus[String(x.email||'').toLowerCase().trim()])n++; });
    ph.entres=n;
  }catch(e){}
  return ph;
}

/* La bande en haut de l’écran des campagnes. Deux états, pas plus :
   branché, ou pas encore. */
function bandePharow(ph){
  if(!ph)return '<div class="bandeau-compte" id="bande-pharow">Pharow…</div>';
  if(!ph.lien)
    return '<div class="bandeau-compte" id="bande-pharow">'
      +'<b>Pharow n’est pas encore branché.</b>'
      +'<div class="sec" style="margin-top:4px;line-height:1.6">Le registre public donne les entreprises et leur '
      +'code d’activité. Il ne dit ni combien elles ont de salariés, ni qui les dirige, ni quand elles bougent. '
      +'Pharow le dit, et il l’envoie ici tout seul : la fiche arrive, son code NAF la range dans la bonne '
      +'campagne, et le mail part au prochain passage du moteur. Un branchement, une fois, et plus rien à faire.</div>'
      +'<div style="margin-top:10px"><button class="btn fort" data-pharow>Brancher Pharow</button></div></div>';
  /* « Complétées » et non « reçues » : la moisson gratuite a presque
     toujours déjà la fiche, puisqu'elle ratisse le registre entier. Ce
     que Pharow apporte, c'est l'adresse du dirigeant, que le registre
     ne donne jamais. C'est ce chiffre-là qu'il faut regarder pour
     savoir si l'abonnement vaut son prix. */
  return '<div class="bandeau-compte ok" id="bande-pharow">'
    +'<b>Pharow est branché.</b> '+nb(ph.fiches)+' fiche'+(ph.fiches>1?'s':'')
    +' complétée'+(ph.fiches>1?'s':'')+' par Pharow'
    +(ph.fiches?', dont '+nb(ph.nominatives)+' avec une adresse nominative':'')
    +'. '+nb(ph.entres)+' entrée'+(ph.entres>1?'s':'')+' en campagne toute'+(ph.entres>1?'s':'')+' seule'+(ph.entres>1?'s':'')+'.'
    +(ph.fiches?'<div class="sec" style="margin-top:4px;line-height:1.6">La moisson gratuite avait déjà '
      +'trouvé ces entreprises : elle ratisse le registre entier. Ce que Pharow ajoute, c\u2019est le nom et '
      +'l\u2019adresse du dirigeant, que le registre ne donne jamais.</div>':'')
    +'<div style="margin-top:9px"><button class="btn" data-pharow>Le lien et les recherches à faire</button></div></div>';
}

/* L’écran de branchement : le lien unique, et les quatre recherches à
   construire dans Pharow. C’est la seule chose à faire à la main, et
   une seule fois. */
async function ecranPharow(){
  await reparerEtiquettes();
  var ph=await chargerPharow();
  var f=document.createElement('div');
  f.className='fond-modale';
  var cles=Object.keys(MODELES).sort(function(a,b){ return MODELES[a].ordre-MODELES[b].ordre; });
  function peindre(){
    var h='<div class="modale" style="width:min(880px,100%)">'
      +'<header><div><h3>Pharow</h3><div class="sec" style="margin-top:2px">'
      +'à brancher une fois, ensuite tout arrive tout seul</div></div>'
      +'<button class="fermer" data-x>&times;</button></header><div class="corps">'
      +'<p class="sec" style="margin-top:0;line-height:1.6">Pharow ne se laisse pas interroger de l’extérieur : '
      +'aucune de ses données ne se lit depuis ici. C’est lui qui pousse. On lui donne une fois l’adresse où '
      +'écrire, et chaque contact qu’il ajoute à une liste arrive dans le fichier, avec son code NAF, son '
      +'effectif et le nom de son dirigeant. Ce code NAF le range dans la campagne qui le cherche, et le moteur '
      +'l’envoie au passage suivant. Personne ne clique sur rien.</p>';

    h+='<div class="panneau"><header><h2>1. L’adresse à donner à Pharow</h2>'
      +'<span class="aide">une seule, pour les quatre campagnes</span></header><div class="corps">';
    if(!ph.lien){
      h+='<p class="sec">Elle n’existe pas encore. Elle porte un jeton secret : Pharow, et lui seul, peut écrire.</p>'
        +'<button class="btn fort" data-creer>Créer l’adresse</button>';
    }else{
      h+='<pre class="bloc-copie" id="ph-lien">'+ech(ph.lien)+'</pre>'
        +'<div style="margin-top:10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center">'
        +'<button class="btn" data-copier="ph-lien">Copier</button>'
        +'<span class="sec" style="font-size:12.5px">Nom de la fonction dans Supabase</span>'
        +'<input id="ph-fn" value="'+ech(ph.fonction)+'" style="width:170px;padding:6px 9px;font-size:13px">'
        +'<button class="btn" data-essai>Essayer l’adresse</button></div>'
        +'<div id="ph-essai"></div>'
        +'<p class="sec" style="margin-top:12px;line-height:1.6">Le nom à écrire est celui de l’URL affichée dans '
        +'Supabase, onglet Edge Functions, pas le titre de la fonction : une fonction déployée depuis le tableau '
        +'de bord garde souvent un nom tiré au hasard.<br>'
        +'Dans Pharow : Intégrations, Paramétrage, section Webhooks, et cette adresse. Ensuite l’export part en '
        +'un clic depuis chaque liste. <b>C’est un mot de passe</b> : ni dans un mail, ni dans un document partagé.</p>';
    }
    h+='</div></div>';

    h+='<div class="panneau"><header><h2>2. Une adresse et des critères par campagne</h2>'
      +'<span class="aide">une liste Pharow par campagne, chacune son webhook</span></header><div class="corps">'
      +'<p class="sec" style="margin-top:0;line-height:1.6">L’adresse du haut range la fiche d’après son code '
      +'NAF. Celles qui suivent forcent la campagne : la fiche y entre quel que soit son code. C’est ce qu’il '
      +'faut dès que vous ciblez sur autre chose qu’un secteur, un signal de recrutement par exemple. '
      +'Dans Pharow, créez un webhook par campagne, avec ces adresses.</p>';
    cles.forEach(function(k){
      var m=MODELES[k], l=ph.lien?lienPharow(ph.src,ph.fonction,k):'';
      h+='<div style="margin-bottom:20px;padding-top:14px;border-top:1px solid var(--filet)">'
        +'<div style="font-weight:600;font-size:14px;margin-bottom:8px">'+ech(m.nom)+'</div>'
        +(l?'<pre class="bloc-copie" id="lien-'+k+'">'+ech(l)+'</pre>'
            +'<div style="margin:8px 0 12px"><button class="btn mini" data-copier="lien-'+k+'">Copier l’adresse</button>'
            +' <span class="sec" style="font-size:12px">webhook Pharow à nommer « '+ech(m.nom)+' »</span></div>'
          :'<p class="sec">Créez d’abord l’adresse, au-dessus.</p>')
        +'<pre class="bloc-copie" id="crit-'+k+'">'+ech(criteresModele(k))+'</pre>'
        +'<div style="margin-top:8px"><button class="btn mini" data-copier="crit-'+k+'">Copier ces critères</button></div>'
        +'</div>';
    });
    h+='</div></div>';

    h+='<div class="panneau"><header><h2>Ce que ça a rapporté</h2></header><div class="corps"><div class="bilan">'
      +'<div class="b"><div class="l">Fiches complétées</div><div class="v">'+nb(ph.fiches)+'</div>'
        +'<div class="sec">l’entreprise était déjà au fichier</div></div>'
      +'<div class="b"><div class="l">Avec une adresse</div><div class="v">'+nb(ph.avecMail)+'</div>'
        +'<div class="sec">'+(ph.fiches?Math.round(100*ph.avecMail/ph.fiches)+' % du lot':'—')+'</div></div>'
      +'<div class="b"><div class="l">Nominatives</div><div class="v">'+nb(ph.nominatives)+'</div>'
        +'<div class="sec">une personne, pas un standard</div></div>'
      +'<div class="b"><div class="l">Entrées en campagne</div><div class="v">'+nb(ph.entres)+'</div>'
        +'<div class="sec">sans que personne y touche</div></div>'
      +'</div><p class="sec" style="margin-top:12px">De quoi comparer, dans quinze jours, ce que Pharow rapporte '
      +'face au fichier gratuit : taux de réponse et taux de rebond, sur les mêmes campagnes.</p>'
      +'</div></div>';

    h+='</div><footer><span></span><button class="btn fort" data-x>Fermer</button></footer></div>';
    f.innerHTML=h;
    $$('[data-x]',f).forEach(function(x){ x.onclick=function(){ f.remove(); VUES.campagnes(); }; });
    $$('[data-copier]',f).forEach(function(x){
      x.onclick=function(){ var z=$('#'+x.dataset.copier,f); if(z)copier(z.textContent,x); };
    });
    var be=$('[data-essai]',f); if(be)be.onclick=async function(){
      var z=$('#ph-essai',f), nom=String(($('#ph-fn',f)||{}).value||'').trim();
      this.disabled=true; this.textContent='Essai…';
      if(z)z.innerHTML='<div class="bandeau-compte">On appelle l’adresse…</div>';
      try{
        await poserFonctionLead(nom);
        var r=await essayerFonctionLead(await fonctionLead());
        ph=await chargerPharow();
        peindre();
        var z2=$('#ph-essai',f);
        if(z2)z2.innerHTML='<div class="bandeau-compte '+(r.ok?'ok':'vide')+'">'+ech(r.dit)+'</div>';
      }catch(e){
        if(z)z.innerHTML='<div class="erreur">'+ech(String(e.message||e).slice(0,240))+'</div>';
        this.disabled=false; this.textContent='Essayer l’adresse';
      }
    };
    var bc=$('[data-creer]',f); if(bc)bc.onclick=async function(){
      this.disabled=true; this.textContent='Création…';
      try{ await sourcePharow(); ph=await chargerPharow(); peindre(); }
      catch(e){ alerteCopiable('Impossible',String(e.message||e).slice(0,300)); }
    };
  }
  document.body.appendChild(f);
  peindre();
}

function resumeCible(c){
  var m=[];
  m.push(c.qui==='prospects'?'leads et prospects':c.qui==='comptes'?'comptes':'partenaires en prospection');
  if(c.types&&c.types.length)m.push(c.types.length>2?c.types.length+' métiers':c.types.join(', '));
  if(c.departements)m.push('dép. '+c.departements);
  if(c.source==='pharow')m.push('Pharow seulement');
  else if(c.source==='gratuit')m.push('moisson gratuite seulement');
  if(c.nominatif)m.push('nominatives');
  if(c.jamais_appeles)m.push('jamais appelés');
  return m.join(' · ');
}

/* L'audience, traduite en requête. Une seule fonction pour compter et
   pour lister : ce qu'on annonce est exactement ce qui partira. */
function requeteCible(c,activite,limite){
  var q='';
  if(c.qui==='prospects'||c.qui==='comptes'){
    q='select=id,societe,dirigeant,email,ville,code_postal,activite,tel'
      +'&email=neq.&email=not.is.null&email_invalide=is.false&activite=eq.'+encodeURIComponent(activite)
      +'&etape=not.in.(Gagne,Perdu)'
      +(c.qui==='prospects'?'&est_lead=is.true':'&est_lead=is.false');
    if(c.jamais_appeles)q+='&appel_resultat=is.null';
    if(c.exclure_lies!==false)q+='&partenaire_id=is.null';
  }else{
    q='select=id,nom,contact,email,ville,code_postal,activite,type,email_origine,tel,compte_email,contrat_statut'
      +'&email=neq.&email=not.is.null&email_invalide=is.false&activite=eq.'+encodeURIComponent(activite)
      +'&statut=not.in.(Signé,Abandonné)';
    if(c.jamais_appeles)q+='&appel_resultat=is.null';
    if(c.nominatif)q+='&email_origine=in.(direction,personne)';
    if(c.exclure_lies!==false)q+='&compte_email=is.null&or=(contrat_statut.is.null,contrat_statut.eq.aucun)';
    if(c.types&&c.types.length)q+='&type=in.('+c.types.map(function(t){ return '"'+String(t).replace(/"/g,'')+'"'; }).join(',')+')';
    /* D'où vient la fiche. « Pharow » veut dire : c'est lui qui a
       fourni l'adresse. Deux campagnes identiques, l'une sur le
       fichier acheté et l'autre sur la moisson gratuite, et on saura
       en quinze jours lequel des deux rapporte. */
    if(c.source==='pharow')q+='&source=eq.Pharow';
    else if(c.source==='gratuit')q+='&or=(source.is.null,source.neq.Pharow)';
  }
  /* Les tranches d'effectif écartées. On garde les fiches dont
     l'effectif est inconnu : le registre ne le donne pas toujours, et
     jeter l'inconnu reviendrait à jeter la moitié du fichier. */
  if(c.effectifs_hors&&c.effectifs_hors.length)
    q+='&or=(effectif.is.null,effectif.eq.,effectif.not.in.('
      +c.effectifs_hors.map(function(t){ return '"'+String(t).replace(/"/g,'')+'"'; }).join(',')+'))';
  if(c.departements){
    var deps=String(c.departements).split(/[\s,;]+/).filter(Boolean);
    if(deps.length===1)q+='&code_postal=like.'+encodeURIComponent(deps[0].padStart(2,'0')+'*');
    else if(deps.length>1)q+='&or=('+deps.map(function(d){ return 'code_postal.like.'+encodeURIComponent(d.padStart(2,'0')+'*'); }).join(',')+')';
  }
  return {table:(c.qui==='prospects'||c.qui==='comptes')?'ls_prospects':'ls_prescripteurs',
          q:q+'&order=cree_le.desc&limit='+(limite||2000)};
}

async function listerCible(c,activite){
  var r=requeteCible(c,activite,3000);
  var l=await lire(r.table, r.q.replace('&order=cree_le.desc', r.table==='ls_prospects'?'&order=created_at.desc':'&order=cree_le.desc'));
  /* Une adresse, une fois. Personne qui a reçu une campagne depuis N
     jours, personne sur la liste d'opposition, et pas les adresses de
     standard si la case est cochée. */
  var vus={}, out=[];
  var stop={};
  try{ (await lire('ls_desinscrits','select=adresse&canal=eq.email&limit=5000'))
        .forEach(function(x){ stop[String(x.adresse).toLowerCase().trim()]=true; }); }catch(e){}
  var recents={};
  var jours=c.exclure_jours!=null?+c.exclure_jours:90;
  if(jours>0){
    var dep=new Date(Date.now()-jours*864e5).toISOString();
    try{ (await lire('ls_sequences','select=email&cree_le=gte.'+dep+'&limit=5000'))
          .forEach(function(x){ recents[String(x.email).toLowerCase().trim()]=true; }); }catch(e){}
    try{ (await lire('ls_envois','select=destinataire&campagne_id=not.is.null&cree_le=gte.'+dep+'&limit=5000'))
          .forEach(function(x){ recents[String(x.destinataire).toLowerCase().trim()]=true; }); }catch(e){}
  }
  var sansGeneriques=c.exclure_generiques!==false;
  /* On compte ce qu'on écarte, et pourquoi. Une audience à zéro sans
     explication est une énigme ; avec le détail, c'est une case à
     décocher. */
  var motifs={total:l.length,sans_email:0,doublon:0,opposition:0,recent:0,generique:0};
  l.forEach(function(x){
    var m=String(x.email||'').toLowerCase().trim();
    if(!m||!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(m)){ motifs.sans_email++; return; }
    if(vus[m]){ motifs.doublon++; return; }
    if(stop[m]){ motifs.opposition++; return; }
    if(recents[m]){ motifs.recent++; return; }
    if(sansGeneriques&&estGenerique(m)){ motifs.generique++; return; }
    vus[m]=true; out.push(x);
  });
  out.motifs=motifs;
  return out;
}

/* Le détail des rejets, en une phrase lisible. */
function pourquoiVide(m){
  if(!m)return '';
  if(!m.total)return 'Aucune fiche ne correspond aux métiers, aux départements et aux cases cochées. '
    +'Élargissez les critères, ou lancez la recherche depuis Audience et réglages.';
  var d=[];
  if(m.generique)d.push(nb(m.generique)+' adresse'+(m.generique>1?'s':'')+' générique'+(m.generique>1?'s':'')
    +' (contact@, info@…), écartée'+(m.generique>1?'s':'')+' par la case « Écarter les adresses génériques »');
  if(m.sans_email)d.push(nb(m.sans_email)+' fiche'+(m.sans_email>1?'s':'')+' sans adresse valide');
  if(m.recent)d.push(nb(m.recent)+' déjà écrit'+(m.recent>1?'s':'')+' récemment, écarté'+(m.recent>1?'s':'')+' par le délai en jours');
  if(m.opposition)d.push(nb(m.opposition)+' sur la liste d’opposition');
  if(m.doublon)d.push(nb(m.doublon)+' en double');
  return nb(m.total)+' fiche'+(m.total>1?'s':'')+' correspondent au ciblage, mais toutes sont écartées : '
    +d.join(', ')+'.';
}

/* Le plan d'envoi : du lundi au vendredi, de 8 h 30 à 12 h et de
   14 h à 18 h, un espacement au hasard entre deux mails, et les
   boîtes servies à tour de rôle, chacune dans son plafond du jour.
   Le moteur revérifie tout cela au moment de partir : ce plan est
   l'intention, le moteur est la règle. */
function planifier(n,debut,boites,emin,emax){
  emin=Math.max(30,+emin||90); emax=Math.max(emin,+emax||400);
  var t=new Date(Math.max(Date.now()+60000,new Date(debut).getTime()));
  function minutes(d){ return d.getHours()*60+d.getMinutes(); }
  function ouvre(d){ return d.getDay()>=1&&d.getDay()<=5; }
  function enFenetre(d){ var m=minutes(d); return ouvre(d)&&((m>=510&&m<720)||(m>=840&&m<1080)); }
  function suivant(d){
    var x=new Date(d), m=minutes(x);
    if(!ouvre(x)||m>=1080){ x.setDate(x.getDate()+1); x.setHours(8,30,0,0); }
    else if(m<510){ x.setHours(8,30,0,0); }
    else if(m>=720&&m<840){ x.setHours(14,0,0,0); }
    while(!ouvre(x)){ x.setDate(x.getDate()+1); x.setHours(8,30,0,0); }
    return x;
  }
  function cle(d){ return d.toISOString().slice(0,10); }
  var compte={}, out=[], tour=0, garde=0;
  while(out.length<n&&garde<n*40){
    garde++;
    if(!enFenetre(t)){ t=suivant(t); continue; }
    var j=cle(t), b=null;
    for(var k=0;k<boites.length;k++){
      var cand=boites[(tour+k)%boites.length];
      var fait=(compte[cand.id]||{})[j]||0;
      if(fait<(+cand.plafond||50)){ b=cand; tour=(tour+k+1)%boites.length; break; }
    }
    if(!b){ t=new Date(t); t.setDate(t.getDate()+1); t.setHours(8,30,0,0); continue; }
    compte[b.id]=compte[b.id]||{}; compte[b.id][j]=((compte[b.id][j])||0)+1;
    out.push({quand:new Date(t).toISOString(),boite:b});
    t=new Date(t.getTime()+(emin+Math.random()*(emax-emin))*1000);
  }
  return out;
}

async function ficheCampagne(c){

  if(cible.exclure_generiques==null)cible.exclure_generiques=true;
  if(cible.exclure_lies==null)cible.exclure_lies=true;
  if(cible.exclure_jours==null)cible.exclure_jours=90;
  var act=c.activite||(MAISON==='les_deux'?'bornistes':MAISON);
  var choisies=(c.boites||[]).slice();
  var types=[], boites=[], catalogue=[];
  async function charger(){
    try{ types=await rpc('ls_cible_types',{p_activite:act}); }catch(e){ types=[]; }
    try{ boites=(await rpc('ls_boites_bilan')||[]).filter(function(b){ return b.activite===act; }); }catch(e){ boites=[]; }
    try{ catalogue=(await lire('ls_cibles','select=*&order=nom.asc')).filter(function(x){ return x.activite===act; }); }catch(e){ catalogue=[]; }
  }
  await charger();

  /* Un métier, c'est soit une étiquette déjà portée par des fiches,
     soit un métier du catalogue qu'on n'a pas encore cherché. Les deux
     se cochent de la même façon : le commercial ne devrait pas avoir à
     savoir lequel est déjà en base. Ce qui manque, l'engrenage ira le
     chercher au moment d'enregistrer. */
  /* « Expert comptable » saisi à la main et « Experts-comptables » du
     catalogue désignent le même métier : accents, tirets et pluriels
     tombent, et les deux se rejoignent sur une seule ligne. */
  function cleMetier(n){
    return String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .split(/[^a-z0-9]+/).filter(Boolean)
      .map(function(m){ return m.length>3?m.replace(/s$/,''):m; }).join(' ');
  }
  function metiers(){
    var par={}, l=[];
    function ajoute(nom,naf,mails,fiches){
      var k=cleMetier(nom);
      if(!k)return;
      if(par[k]){
        if(naf&&!par[k].naf)par[k].naf=naf;
        par[k].mails=Math.max(par[k].mails,mails||0);
        par[k].fiches=Math.max(par[k].fiches,fiches||0);
        return;
      }
      par[k]={nom:nom,naf:naf||'',mails:mails||0,fiches:fiches||0};
      l.push(par[k]);
    }
    /* Les étiquettes déjà portées par des fiches d'abord : c'est leur
       orthographe qui compte, puisque c'est elle qui filtre. */
    (types||[]).forEach(function(t){ ajoute(t.type,'',+t.avec_email||0,+t.fiches||0); });
    (catalogue||[]).forEach(function(x){ ajoute(x.nom,x.naf,0,0); });
    (((c.cible||{}).nafs)||[]).forEach(function(x){ ajoute(x.nom,x.naf,0,0); });
    return l.sort(function(a,b){ return (b.mails-a.mails)||String(a.nom).localeCompare(String(b.nom),'fr'); });
  }

  var f=document.createElement('div');
  f.className='fond-modale';

        ?'<div class="champ large"><label>Métiers</label>'

  var minuteur=null;

    $('#k-act',f).onchange=async function(){ act=this.value; cible=lireCible(); choisies=[]; await charger(); peindre(); };
    ['k-neuf-nom','k-neuf-naf'].forEach(function(i){
      var el=$('#'+i,f); if(el)el.addEventListener('input',compter);
    });
    $('#k-qui',f).onchange=function(){ cible=lireCible(); peindre(); };
    $('#k-hab',f).onchange=function(){ $('#k-hab-aide',f).textContent=HABILLAGE[this.value][1]; };

      if(i.id==='k-nom'||i.id==='k-cad'||i.id==='k-d2'||i.id==='k-d3'||i.dataset.boite!=null)return;

    var bs=$('[data-suppr]',f); if(bs)bs.onclick=async function(){

      var cad=Math.min(20,Math.max(1,+val('k-cad')||12));
      var d2=Math.max(2,+val('k-d2')||8), d3=Math.max(d2+1,+val('k-d3')||18);
      var corps={nom:nom,activite:act,cadence_h:cad,delai2:d2,delai3:d3,cible:lireCible(),
        habillage:val('k-hab')||'maison',
        boites:$$('[data-boite]:checked',f).map(function(x){ return x.dataset.boite; }),
        owner_email:c.owner_email||moi||'',maj_le:new Date().toISOString()};
      /* Un métier tapé à la main compte comme coché : sinon il faudrait
         penser à cocher une case pour un champ qu'on vient de remplir. */
      var nNom=String(val('k-neuf-nom')||'').trim(), nNaf=String(val('k-neuf-naf')||'').trim().toUpperCase();
      if(nNom&&nNaf){
        if(!/^[0-9]{4}[A-Z]$/.test(nNaf)){ err.innerHTML='<div class="erreur">Le code NAF s’écrit avec quatre chiffres et une lettre, par exemple 4321A.</div>'; return; }
        /* Ce code existe peut-être déjà au catalogue sous un autre nom.
           Dans ce cas c'est l'étiquette du catalogue que les fiches
           porteront : on prend la sienne, sinon la campagne filtrerait
           sur un libellé que personne ne porte. */
        var connu=(catalogue||[]).filter(function(x){ return String(x.naf).toUpperCase()===nNaf; })[0];
        if(connu&&cleMetier(connu.nom)!==cleMetier(nNom)){
          if(!confirm('Le code '+nNaf+' est déjà au catalogue sous le nom « '+connu.nom+' ».\n\n'
            +'Les fiches porteront cette étiquette, pas « '+nNom+' ». On garde « '+connu.nom+' » ?')) return;
          nNom=connu.nom;
        }
        if(corps.cible.types.indexOf(nNom)<0)corps.cible.types.push(nNom);
        corps.cible.nafs.push({nom:nNom,naf:nNaf});
      }else if(nNom||nNaf){
        err.innerHTML='<div class="erreur">Pour un nouveau métier, il faut le libellé et le code NAF.</div>'; return;
      }
      var bt=this; bt.disabled=true;
      try{
        var id=c.id;
        if(id) await modifier('ls_campagnes','id=eq.'+id,corps);
        else { var r=await ecrire('ls_campagnes',Object.assign({objet:'',corps:''},corps)); id=r&&r[0]&&r[0].id; await tracer('campagne.creee',nom); }
        var lu=await lire('ls_campagnes','select=*&id=eq.'+id+'&limit=1');
        var cc=lu.length?lu[0]:null;
        /* La moisson se resème : le moteur reprendra la liste des
           métiers et des départements telle qu'elle vient d'être
           enregistrée, et cherchera pendant que la campagne tourne. */
        if(cc&&cc.cible&&cc.cible.chercher)try{ await semerMoisson(cc); }catch(e){}
        f.remove();
        if(cc)ecranCampagne(cc); else { VUES.campagnes(); return; }
      }catch(e){ bt.disabled=false; err.innerHTML='<div class="erreur">'+ech(String(e.message||e).slice(0,300))+'</div>'; }
    };
  }
  document.body.appendChild(f);
  peindre();
}

/* ── La vérification avant envoi ────────────────────────────────── */
var MOTS_SPAM=/\b(gratuit\w*|offre\w*|opportunit\w*|promotion\w*|garanti\w*)\b/i;
var RELANCE=/(je me permets de revenir|relance|suite [àa] mon pr[ée]c[ée]dent (mail|message|e-mail|courriel))/i;
function verifierCampagne(c,boites,rg,audience){
  var b=[], a=[], ok=[];
  var o1=String(c.objet||'').trim(), c1=String(c.corps||'').trim();
  if(!o1||!c1)b.push('Le mail 1 n’a pas d’objet ou pas de texte.');
  if(/https?:\/\/|www\.|<a\s/i.test(c1))b.push('Le mail 1 contient un lien cliquable. Le premier mail part sans lien : c’est lui qui fait la réputation de la boîte.');
  if(/<img|\.(png|jpe?g|gif|webp)\b/i.test(c1))b.push('Le mail 1 contient une image. Le premier mail part en texte seul.');
  if(/pi[èe]ce jointe|ci-joint|\.pdf\b/i.test(c1))b.push('Le mail 1 parle d’une pièce jointe. Aucune pièce jointe dans une campagne, on l’envoie après la réponse.');
  var pied=String((rg&&rg.pied_email)||'');
  if(!/stop|d[ée]sabonn|ne plus (en )?recevoir|ne plus être contact/i.test(pied))
    b.push('Le pied de page n’a pas de ligne de désabonnement. Réglez-le dans Automatisations, par exemple : « Pour ne plus recevoir nos messages, répondez STOP ».');
  else ok.push('Le pied de page porte la ligne de désabonnement.');
  var ch=(c.boites||[]).map(function(id){ return boites.filter(function(x){ return x.id===id; })[0]; }).filter(Boolean);
  if(!ch.length)b.push('Aucune boîte d’envoi n’est cochée. Ouvrez Audience et réglages.');
  ch.forEach(function(x){
    if(!x.actif)b.push('La boîte '+x.adresse+' est coupée.');
    else if(x.etat!=='prete'){
      /* Une boîte en chauffe envoie, simplement moins. C'est le
         plafond du jour qui protège la réputation, pas l'interdiction
         de partir : bloquer ici reviendrait à interdire la montée en
         puissance qu'on vient d'organiser. */
      var reste=audience?Math.ceil(audience.length/Math.max(1,x.plafond)):0;
      a.push('La boîte '+x.adresse+' est en chauffe : '+x.plafond+' mails par jour au lieu de 50'
        +(reste>1?', soit environ '+reste+' jours pour cette audience':'')
        +'. Le rythme monte tout seul, et elle sera à pleine vitesse le '
        +date(new Date(new Date(x.mise_en_service_le).getTime()+14*864e5))+'.');
      ok.push('La boîte '+x.adresse+' peut envoyer, '+x.plafond+' par jour pendant la chauffe.');
    }
    else ok.push('La boîte '+x.adresse+' est prête, '+x.plafond+' par jour.');
    if(x.envoyes_30j>=20&&+x.taux_rebond>3)b.push('La boîte '+x.adresse+' a '+String(x.taux_rebond).replace('.',',')+' % de rebond sur 30 jours, au-dessus des 3 % tolérés.');
    if(x.envoyes_30j>=20&&+x.taux_plainte>0.3)b.push('La boîte '+x.adresse+' a '+String(x.taux_plainte).replace('.',',')+' % de plaintes sur 30 jours, au-dessus des 0,3 % tolérés.');
  });
  if(audience&&!audience.length)
    b.push('Aucune adresse ne passe le filtre. '+pourquoiVide(audience.motifs));
  if(c.habillage==='charte')a.push('Habillage « charte complète » : le bandeau et la carte font souvent classer un premier message en Promotions, et pèsent sur la réputation d’une boîte neuve. La signature maison porte les mêmes couleurs sans ce risque.');
  [1,2,3].forEach(function(n){
    var o=String(n===1?c.objet:c['objet'+n]||'').trim(), t=String(n===1?c.corps:c['corps'+n]||'').trim();
    if(n>1&&!t){ a.push('Le mail '+n+' est vide : le contact sortira après le mail '+(n-1)+'.'); return; }
    if(o.length>55)a.push('Objet du mail '+n+' : '+o.length+' caractères, plus de 55. Il sera coupé sur téléphone.');
    if(/[A-ZÀ-Ý]{3,}/.test(o))a.push('Objet du mail '+n+' : des majuscules. Les filtres n’aiment pas, les gens non plus.');
    if(o.indexOf('!')>-1)a.push('Objet du mail '+n+' : un point d’exclamation.');
    var mots=(o+' '+t).match(MOTS_SPAM);
    if(mots)a.push('Mail '+n+' : le mot « '+mots[1]+' » attire les filtres.');
    if(/€/.test(o+' '+t))a.push('Mail '+n+' : un symbole euro. Écrivez le montant en toutes lettres, ou gardez-le pour le devis.');
    if(t.length>900)a.push('Mail '+n+' : '+t.length+' caractères, plus de 900. Un mail court se lit, un mail long s’archive.');
    if(n>1&&RELANCE.test(t))a.push('Mail '+n+' : il se présente comme une relance (« je me permets de revenir », « relance », « suite à mon précédent mail »). Chaque mail doit tenir seul, comme si c’était le premier.');
    if(n>1&&/https?:\/\/|www\./i.test(t))a.push('Mail '+n+' : un lien. Toléré, mais un lien dans une séquence froide coûte en délivrabilité.');
  });
  return {bloquants:b,alertes:a,ok:ok,boites:ch};
}

        +'<button class="fermer" data-x>&times;</button></header>'
