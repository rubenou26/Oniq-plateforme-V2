<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OniMarketer — Suite marketing 360° du bâtiment</title>
<!--
  OniMarketer — App autonome ONIQ (iframe).
  v0.2 — Sidebar harmonisée avec OniPilote :
    · Wordmark ONIQ + séparateur doré
    · Sections "ACQUISITION / CONVERSION / ACTIVATION / PILOTAGE"
      en label doré uppercase + ligne décorative
    · Icônes SVG monoline (plus d'emojis)
    · Items actifs : fond doré transparent + bordure dorée + glow
    · Footer Sync / Aide / Export (3 boutons verticaux)
    · Carte user en bas (avatar carré doré + nom + rôle)
  + Onglets : "Oni" retiré du libellé (réservé au nom du LOGICIEL).
-->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --ink:#0A0A08; --ink-2:#1F1A14; --ink-3:#2A2218; --deep:#060504;
    --paper:#F5F2EC; --dim:#EFEBE3; --linen:#E8E2D8; --ivory:#FAF8F4;
    --stone:#8C8070; --sand:#B5A898;
    --gold:#B89A5A; --gold-d:#A06D2E; --gold-l:#D4B87A; --gold-xl:#E8C474;
    --gold-dim:rgba(184,154,90,.13);
    --green:#4A7C59; --amber:#C47B2B; --red:#A63C3C; --blue:#3E5C76;
    --SF:'Playfair Display', Georgia, serif;
    --SS:'DM Sans','Helvetica Neue',sans-serif;
    --SC:'Cormorant Garamond', Georgia, serif;
    --sb-w:230px;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--SS); color:var(--ink); background:var(--dim);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(184,154,90,.35);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:13px}
  .app{display:flex;height:100vh;overflow:hidden}

  /* ════════════════════════════════════════════════════════════
     SIDEBAR — fond sombre + accents dorés (harmonisé ONIQ)
     ════════════════════════════════════════════════════════════ */
  .side{
    width:var(--sb-w); flex:0 0 var(--sb-w);
    background:linear-gradient(180deg,#1A140E 0%,#241B12 50%,#1F1810 100%);
    color:#E8DFD0;
    display:flex; flex-direction:column;
    position:relative; z-index:5;
    box-shadow:inset -1px 0 0 rgba(232,196,116,.10);
  }
  .side::before{
    content:''; position:absolute; top:0; right:0; bottom:0; width:1px;
    background:linear-gradient(180deg,transparent 0%,rgba(184,154,90,.42) 30%,rgba(184,154,90,.42) 70%,transparent 100%);
    pointer-events:none;
  }

  /* Header : wordmark ONIQ */
  .side-head{
    padding:24px 22px 18px; text-align:center;
    border-bottom:1px solid rgba(212,162,76,.18);
    position:relative;
  }
  .side-head::after{
    content:''; position:absolute; left:18px; right:18px; bottom:-1px; height:1px;
    background:linear-gradient(90deg,transparent 0%,rgba(232,196,116,.55) 50%,transparent 100%);
  }
  .wordmark{
    font-family:var(--SF); font-style:italic; font-weight:700;
    font-size:28px; letter-spacing:4px; color:#F4E9D5;
    line-height:1; text-shadow:0 0 22px rgba(232,196,116,.40);
  }
  .wordmark-sub{
    margin-top:7px;
    font-family:var(--SS); font-size:9px; font-weight:700;
    letter-spacing:.22em; text-transform:uppercase; color:var(--gold-xl);
  }

  /* Nav */
  .side-nav{
    flex:1; padding:14px 12px 10px;
    display:flex; flex-direction:column; gap:1px; overflow-y:auto;
  }
  .nav-section{
    font-family:var(--SS); font-size:9.5px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--gold-xl); font-weight:700;
    padding:14px 10px 6px; display:flex; align-items:center; gap:8px;
    text-shadow:0 0 10px rgba(212,162,76,.25);
  }
  .nav-section::after{
    content:''; flex:1; height:1px;
    background:linear-gradient(90deg,rgba(232,196,116,.30),transparent);
  }
  .nav-section:first-child{padding-top:6px}

  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:9px 12px; border-radius:8px;
    color:#D8CDB8; font-family:var(--SS); font-size:13px; font-weight:500;
    border:1px solid transparent; background:transparent;
    cursor:pointer; text-align:left; width:100%;
    letter-spacing:.005em; position:relative;
    transition:background .18s var(--ease), color .18s var(--ease),
               border-color .18s var(--ease), box-shadow .22s var(--ease),
               transform .18s var(--ease);
  }
  .nav-item:hover{
    background:rgba(184,154,90,.10);
    color:#F4E9D5;
    border-color:rgba(184,154,90,.20);
  }
  .nav-item.active{
    color:#FFFAEC; font-weight:700;
    background:linear-gradient(135deg,rgba(212,162,76,.26) 0%,rgba(199,121,58,.16) 50%,rgba(212,162,76,.10) 100%);
    border-color:rgba(232,196,116,.42);
    box-shadow:inset 4px 0 0 var(--gold-xl), inset 0 1px 0 rgba(255,255,255,.10),
               0 4px 18px rgba(10,8,5,.5), 0 0 28px rgba(212,162,76,.18);
  }
  .nav-item .ico{
    width:18px; height:18px; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    color:currentColor; opacity:.88;
  }
  .nav-item.active .ico{color:var(--gold-xl); opacity:1}
  .nav-item.active .ico svg{filter:drop-shadow(0 0 6px rgba(232,196,116,.55))}
  .nav-item .lbl{flex:1; min-width:0}
  .nav-item .soon{
    font-size:8.5px; letter-spacing:.08em; text-transform:uppercase;
    font-weight:700; padding:2px 6px; border-radius:20px;
    background:rgba(232,196,116,.10); color:var(--gold-xl);
    border:1px solid rgba(232,196,116,.22);
  }
  .nav-item.active .soon{background:rgba(255,234,176,.18); color:#FFE9A8; border-color:rgba(255,234,176,.36)}

  /* Footer actions : SYNC / AIDE / EXPORT */
  .side-actions{
    display:flex; align-items:stretch; gap:1px;
    padding:8px 10px 6px;
    border-top:1px solid rgba(232,196,116,.18);
    background:rgba(10,8,5,.30);
  }
  .side-action{
    flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:5px; padding:9px 4px; border-radius:8px;
    background:transparent; border:1px solid transparent;
    color:#C2B59A;
    font-family:var(--SS); font-size:9.5px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; cursor:pointer;
    transition:background .18s var(--ease), color .18s var(--ease),
               border-color .18s var(--ease), transform .18s var(--ease);
  }
  .side-action svg{opacity:.85; transition:transform .25s var(--ease), color .18s}
  .side-action:hover{
    background:rgba(184,154,90,.10); color:#F4E9D5;
    border-color:rgba(184,154,90,.28); transform:translateY(-1px);
  }
  .side-action:hover svg{opacity:1; color:var(--gold-xl); transform:scale(1.06)}

  /* User card en bas */
  .side-foot{
    padding:10px 12px 14px;
    border-top:1px solid rgba(232,196,116,.18);
    background:linear-gradient(180deg,transparent 0%,rgba(10,8,5,.45) 100%);
  }
  .user-card{
    display:flex; align-items:center; gap:11px;
    padding:10px 12px;
    background:linear-gradient(135deg,rgba(244,233,213,.05) 0%,rgba(212,162,76,.12) 100%);
    border:1px solid rgba(232,196,116,.32); border-radius:10px;
    box-shadow:0 4px 14px rgba(10,8,5,.40), inset 0 1px 0 rgba(255,255,255,.05);
    position:relative; overflow:hidden;
  }
  .user-card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg,transparent,rgba(232,196,116,.7),transparent);
  }
  .avatar{
    width:32px; height:32px; border-radius:7px;
    background:linear-gradient(135deg,var(--gold-xl) 0%,var(--gold) 45%,#8B5E2A 100%);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--SF); font-weight:800; font-size:12px; color:#1F1A14;
    flex-shrink:0;
    box-shadow:0 3px 10px rgba(184,154,90,.35), inset 0 1px 0 rgba(255,255,255,.30);
    letter-spacing:.02em;
  }
  .user-info{flex:1; min-width:0; overflow:hidden}
  .user-name{
    font-family:var(--SS); font-size:12.5px; font-weight:700; color:#F4E9D5;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .user-role{
    font-family:var(--SS); font-size:9px; letter-spacing:.16em;
    color:var(--gold-xl); text-transform:uppercase; font-weight:700;
    margin-top:2px;
  }

  /* ════════════════════════════════════════════════════════════
     MAIN
     ════════════════════════════════════════════════════════════ */
  .main{flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--dim)}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:18px 30px; background:var(--ivory);
    border-bottom:1px solid var(--linen); flex-wrap:wrap;
  }
  .tb-eyebrow{
    font-family:var(--SS); font-size:10.5px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:3px;
  }
  .tb-title{
    font-family:var(--SF); font-style:italic; font-weight:700;
    font-size:27px; color:var(--ink); letter-spacing:-.4px; line-height:1.1;
  }
  .content{flex:1; overflow-y:auto; padding:28px 30px 60px}
  .wrap{max-width:1180px; margin:0 auto}

  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:9px 16px;
    border-radius:8px; font-size:13px; font-weight:600;
    transition:.13s; white-space:nowrap;
  }
  .btn-gold{background:var(--ink); color:var(--gold-l)}
  .btn-gold:hover{background:#000; transform:translateY(-1px)}
  .btn-ghost{background:transparent; border:1px solid var(--linen); color:var(--ink)}
  .btn-ghost:hover{border-color:var(--gold); background:var(--gold-dim)}

  /* KPI cards */
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px}
  .kpi{background:var(--ivory); border:1px solid var(--linen); border-radius:12px; padding:18px 20px; box-shadow:0 1px 2px #0a0a0809}
  .kpi-l{font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--stone); font-weight:600; margin-bottom:9px}
  .kpi-v{font-family:var(--SF); font-weight:700; font-size:30px; color:var(--ink); line-height:1}
  .kpi-v.gold{color:var(--gold)}
  .kpi-t{font-size:11.5px; margin-top:8px; font-weight:600}
  .up{color:var(--green)} .down{color:var(--red)}

  .grid2{display:grid; grid-template-columns:1.5fr 1fr; gap:18px}
  .card{background:var(--ivory); border:1px solid var(--linen); border-radius:12px; padding:20px 22px; box-shadow:0 1px 2px #0a0a0809}
  .card-t{font-family:var(--SF); font-weight:600; font-size:17px; color:var(--ink); margin-bottom:3px}
  .card-sub{font-size:12px; color:var(--stone); margin-bottom:16px}

  /* bar chart */
  .bars{display:flex; flex-direction:column; gap:11px}
  .bar-row{display:grid; grid-template-columns:138px 1fr 42px; align-items:center; gap:11px}
  .bar-lab{font-size:12.5px; color:var(--ink); font-weight:500}
  .bar-track{height:9px; background:var(--dim); border-radius:20px; overflow:hidden}
  .bar-fill{height:100%; border-radius:20px; background:linear-gradient(90deg,var(--gold),var(--gold-l))}
  .bar-val{font-size:12px; color:var(--stone); font-weight:600; text-align:right}

  .feed{display:flex; flex-direction:column; gap:2px}
  .feed-i{display:flex; gap:11px; padding:9px 0; border-bottom:1px solid var(--linen)}
  .feed-i:last-child{border-bottom:none}
  .feed-dot{width:8px; height:8px; border-radius:50%; margin-top:5px; flex:0 0 8px}
  .feed-tx{font-size:12.5px; color:var(--ink)}
  .feed-tx b{font-weight:600}
  .feed-ti{font-size:11px; color:var(--stone); margin-top:1px}

  /* Pipeline */
  .pipe-stats{display:flex; gap:22px; margin-bottom:20px; flex-wrap:wrap}
  .pstat b{font-family:var(--SF); font-size:22px; color:var(--ink); font-weight:700}
  .pstat span{font-size:11px; color:var(--stone); text-transform:uppercase; letter-spacing:.05em; font-weight:600; display:block; margin-top:2px}
  .board{display:flex; gap:14px; overflow-x:auto; padding-bottom:14px; align-items:flex-start}
  .col{flex:0 0 248px; background:var(--paper); border:1px solid var(--linen); border-radius:11px; padding:10px; min-height:120px}
  .col-h{display:flex; align-items:center; justify-content:space-between; padding:4px 6px 10px}
  .col-h .nm{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:7px}
  .col-h .ct{font-size:11px; color:var(--stone); font-weight:600; background:var(--dim); padding:2px 8px; border-radius:20px}
  .col-stripe{width:7px; height:7px; border-radius:50%}
  .lead{
    background:var(--ivory); border:1px solid var(--linen); border-radius:9px;
    padding:11px 12px; margin-bottom:9px; cursor:grab; transition:.12s;
    box-shadow:0 1px 1px #0a0a0808;
  }
  .lead:hover{border-color:var(--gold); box-shadow:0 3px 10px #0a0a0814}
  .lead.dragging{opacity:.4}
  .lead-nm{font-weight:600; font-size:13.5px; color:var(--ink); display:flex; align-items:center; justify-content:space-between; gap:6px}
  .lead-meta{font-size:11.5px; color:var(--stone); margin-top:3px}
  .lead-tags{display:flex; gap:5px; margin-top:8px; flex-wrap:wrap}
  .tag{font-size:10px; font-weight:600; padding:2px 7px; border-radius:20px; background:var(--gold-dim); color:#8a6d2e; text-transform:uppercase; letter-spacing:.03em}
  .tag.bud{background:#4a7c5918; color:var(--green)}
  .lead-mv{display:flex; gap:4px; margin-top:9px}
  .mv{font-size:15px; line-height:1; color:var(--stone); padding:2px 7px; border-radius:5px; background:var(--dim); cursor:pointer}
  .mv:hover{background:var(--gold); color:var(--ink)}
  .col.drop{outline:2px dashed var(--gold); outline-offset:-3px; background:var(--gold-dim)}

  /* "coming soon" module panel */
  .soon-panel{
    text-align:center; max-width:620px; margin:30px auto; padding:44px 30px;
    background:var(--ivory); border:1px solid var(--linen); border-radius:16px;
  }
  .soon-ic-wrap{
    width:64px; height:64px; margin:0 auto 14px;
    background:linear-gradient(135deg,var(--ink),var(--ink-3));
    border-radius:16px; display:flex; align-items:center; justify-content:center;
    color:var(--gold-xl);
    box-shadow:0 6px 22px -4px rgba(10,10,8,.30), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .soon-panel h2{font-family:var(--SF); font-style:italic; font-size:28px; color:var(--ink); margin-bottom:6px}
  .soon-tag{
    display:inline-block; font-size:10.5px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--amber); font-weight:700;
    background:#c47b2b16; padding:4px 12px; border-radius:20px; margin-bottom:18px;
  }
  .soon-panel p{font-size:14px; color:var(--stone); line-height:1.65; margin-bottom:20px}
  .soon-feats{display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:left; margin-top:10px}
  .soon-feat{display:flex; gap:9px; align-items:flex-start; font-size:12.5px; color:var(--ink)}
  .soon-feat .ck{color:var(--gold); font-weight:700; flex:0 0 auto}

  /* Modal */
  .ov{position:fixed; inset:0; background:rgba(10,10,8,.55); backdrop-filter:blur(7px); display:none; align-items:center; justify-content:center; padding:20px; z-index:9999}
  .ov.show{display:flex}
  .modal{background:var(--ivory); border-radius:16px; width:min(480px,96vw); box-shadow:0 30px 80px rgba(10,10,8,.4); overflow:hidden; animation:pop .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{from{opacity:0; transform:translateY(16px) scale(.97)} to{opacity:1; transform:none}}
  .modal-h{padding:20px 24px 14px; border-bottom:1px solid var(--linen)}
  .modal-h h3{font-family:var(--SF); font-style:italic; font-size:21px; color:var(--ink)}
  .modal-b{padding:20px 24px}
  .fld{margin-bottom:13px}
  .fld label{display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--stone); margin-bottom:5px}
  .fld input,.fld select{width:100%; padding:9px 11px; border:1px solid var(--linen); border-radius:8px; background:#fff; color:var(--ink)}
  .fld input:focus,.fld select:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-dim)}
  .fld-row{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  .modal-f{padding:14px 24px 20px; display:flex; gap:10px; justify-content:flex-end}

  @media(max-width:880px){
    :root{--sb-w:0px}
    .side{display:none}
    .kpis{grid-template-columns:1fr 1fr}
    .grid2{grid-template-columns:1fr}
    .content{padding:20px 16px 50px}
    .topbar{padding:16px}
    .bar-row{grid-template-columns:110px 1fr 36px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-head">
      <div class="wordmark">ONIQ</div>
      <div class="wordmark-sub">Marketer · Bâtiment</div>
    </div>
    <nav class="side-nav" id="nav"></nav>

    <div class="side-actions" role="toolbar" aria-label="Actions rapides">
      <button class="side-action" title="Synchronisation entre logiciels ONIQ">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        <span>Sync</span>
      </button>
      <button class="side-action" title="Aide / Support">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Aide</span>
      </button>
      <button class="side-action" title="Exporter les données">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Export</span>
      </button>
    </div>

    <div class="side-foot">
      <div class="user-card">
        <div class="avatar" id="av">MD</div>
        <div class="user-info">
          <div class="user-name" id="uname">Mon entreprise</div>
          <div class="user-role" id="urole">Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="tb-eyebrow" id="tbEye">Pilotage</div>
        <div class="tb-title" id="tbTitle">Tableau de bord</div>
      </div>
      <div id="tbActions"></div>
    </div>
    <div class="content"><div class="wrap" id="view"></div></div>
  </div>
</div>

<!-- Modal : nouvel apporteur -->
<div class="ov" id="ovApp">
  <div class="modal">
    <div class="modal-h"><h3>Nouvel apporteur d'affaires</h3></div>
    <div class="modal-b">
      <div class="fld"><label>Nom complet</label><input id="a-nm" placeholder="Jean Marchand"/></div>
      <div class="fld-row">
        <div class="fld"><label>Organisation</label><input id="a-org" placeholder="Century 21 Vannes"/></div>
        <div class="fld"><label>Type</label>
          <select id="a-type">
            <option>Agent immo</option><option>Courtier prêt</option><option>Mandataire</option>
            <option>Notaire</option><option>Client parrain</option><option>Indépendant</option>
          </select>
        </div>
      </div>
      <div class="fld-row">
        <div class="fld"><label>Email</label><input id="a-email" placeholder="contact@..."/></div>
        <div class="fld"><label>Téléphone</label><input id="a-tel" placeholder="06 ..."/></div>
      </div>
      <div class="fld"><label>Commission convenue</label><input id="a-com" placeholder='Ex : "1.0 %" ou "500 €/signature"'/></div>

/* ════════════════════════ TOPBAR + VUES ════════════════════════ */
function renderView(){
  const item = FLAT[current];
  document.getElementById('tbEye').textContent = item.eye;
  document.getElementById('tbTitle').textContent = item.nm;
  const actions = document.getElementById('tbActions');
  const view = document.getElementById('view');

  /* Routing : chaque module a sa view dédiée. */
  const r = ROUTES[current];
  if (r){
    actions.innerHTML = r.actions || '';
    view.innerHTML = r.render();
    if (r.bind) r.bind();
  } else {
    actions.innerHTML = '';
    view.innerHTML = viewSoon(item);
  }
}

function viewLeads(){
  const total = LEADS.length;
  const active = LEADS.filter(l=>!['sign','lost'].includes(l.stage)).length;
  const signed = LEADS.filter(l=>l.stage==='sign').length;
  const conv = total? Math.round(signed/total*100):0;
  const stats = `
    <div class="pipe-stats">
      <div class="pstat"><b>${total}</b><span>Total leads</span></div>
      <div class="pstat"><b>${active}</b><span>En cours</span></div>
      <div class="pstat"><b>${signed}</b><span>Signés</span></div>
      <div class="pstat"><b>${conv}%</b><span>Conversion</span></div>
    </div>`;
  const cols = STAGES.map(s=>{
    const list = LEADS.filter(l=>l.stage===s.id);
    const cards = list.map(l=>leadCard(l)).join('') || `<div style="font-size:12px;color:var(--stone);padding:10px 6px;text-align:center">—</div>`;
    return `
      <div class="col" data-stage="${s.id}">
        <div class="col-h">
          <div class="nm"><span class="col-stripe" style="background:${s.c}"></span>${s.nm}</div>
          <div class="ct">${list.length}</div>
        </div>
        ${cards}
      </div>`;
  }).join('');
  return stats + `<div class="board">${cols}</div>`;
}

function leadCard(l){
  const idx = STAGES.findIndex(s=>s.id===l.stage);
  const prev = idx>0 ? `<span class="mv" title="Reculer" onclick="move(${l.id},-1)">←</span>` : '';
  const next = idx<STAGES.length-1 ? `<span class="mv" title="Avancer" onclick="move(${l.id},1)">→</span>` : '';
  return `
  <div class="lead" draggable="true" data-id="${l.id}">
    <div class="lead-nm">${l.name}</div>
    <div class="lead-meta">${l.zone}</div>
    <div class="lead-tags"><span class="tag">${l.src}</span><span class="tag bud">${l.bud}</span></div>
    <div class="lead-mv">${prev}${next}</div>
  </div>`;
}
function move(id, dir){
  const l = LEADS.find(x=>x.id===id); if(!l) return;
  const idx = STAGES.findIndex(s=>s.id===l.stage);
  const ni = Math.min(Math.max(idx+dir,0),STAGES.length-1);
  l.stage = STAGES[ni].id;
  renderView();
}

let dragId = null;
function bindDnD(){
  document.querySelectorAll('.lead').forEach(el=>{
    el.addEventListener('dragstart',e=>{ dragId=+el.dataset.id; el.classList.add('dragging'); });
    el.addEventListener('dragend',e=>{ el.classList.remove('dragging'); dragId=null; });
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{ e.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave',e=>col.classList.remove('drop'));
    col.addEventListener('drop',e=>{
      e.preventDefault(); col.classList.remove('drop');
      const l = LEADS.find(x=>x.id===dragId);
      if(l){ l.stage = col.dataset.stage; renderView(); }
    });
  });
}

const fmtEur = n => (n||0).toLocaleString('fr-FR') + ' €';
const fmtNum = n => (n||0).toLocaleString('fr-FR');

function kpiRow(items){
  return `<div class="kpis">` + items.map(k=>`
    <div class="kpi">
      <div class="kpi-l">${k.l}</div>
      <div class="kpi-v ${k.gold?'gold':''}">${k.v}</div>
      ${k.t?`<div class="kpi-t ${k.tCls||'up'}">${k.t}</div>`:''}

}

function chip(label, color){
  const colors = {
    green:'#4a7c5918;color:var(--green)',
    red:'#a63c3c18;color:var(--red)',
    gold:'var(--gold-dim);color:#8a6d2e',
    blue:'#3e5c7618;color:var(--blue)',
    amber:'#c47b2b18;color:var(--amber)',
    stone:'#8c807018;color:var(--stone)',
  };
  return `<span class="tag" style="background:${colors[color]||colors.gold}">${label}</span>`;
}

function sectionTitle(title, sub){

}

/* — Simulateur PTZ + capacité d’emprunt ——————————————— */
let SIMU = { revenus:3800, apport:25000, duree:25, taux:3.5, zone:'B1' };
function viewSimu(){
  /* Capacité d’emprunt simplifiée : taux d’endettement max 33 % → mensualité max
     → capital empruntable via formule de calcul. */
  const mensMax = SIMU.revenus * 0.33;
  const r = SIMU.taux / 100 / 12;
  const n = SIMU.duree * 12;
  const capital = mensMax * (1 - Math.pow(1+r, -n)) / r;
  /* PTZ 2025 simplifié : montant = 30 % du coût du projet en zones B1/B2/C
     pour primo-accédant, plafonné selon revenus. Ici approximation lisible. */
  const projet = capital + SIMU.apport;
  const ptzPct = ({A:0.50,B1:0.40,B2:0.40,C:0.20})[SIMU.zone] || 0.30;
  const ptz = Math.min(projet * ptzPct, 100000);
  const kpis = kpiRow([
    {l:'Capacité d’emprunt', v:fmtEur(Math.round(capital/1000)*1000), gold:true},
    {l:'Projet total max', v:fmtEur(Math.round(projet/1000)*1000), t:'apport inclus'},
    {l:'Mensualité', v:fmtEur(Math.round(mensMax))+' /mois', t:'taux d’endettement 33 %'},
    {l:'PTZ 2025 estimé', v:fmtEur(Math.round(ptz/1000)*1000), t:`zone ${SIMU.zone}`},
  ]);
  return kpis + `
  <div class="grid2">
    <div class="card">

          <div style="display:flex;align-items:center;gap:10px">
            <input id="simu-rev" type="range" min="1500" max="10000" step="100" value="${SIMU.revenus}" style="flex:1"/>
            <div style="font-family:var(--SF);font-weight:700;font-size:18px;color:var(--ink);min-width:90px;text-align:right">${fmtEur(SIMU.revenus)}</div>
          </div>
        </div>
        <div>
          <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--stone);display:block;margin-bottom:5px">Apport personnel</label>
          <div style="display:flex;align-items:center;gap:10px">
            <input id="simu-app" type="range" min="0" max="150000" step="1000" value="${SIMU.apport}" style="flex:1"/>
            <div style="font-family:var(--SF);font-weight:700;font-size:18px;color:var(--ink);min-width:90px;text-align:right">${fmtEur(SIMU.apport)}</div>
          </div>
        </div>
        <div>
          <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--stone);display:block;margin-bottom:5px">Durée du prêt (années)</label>
          <div style="display:flex;align-items:center;gap:10px">
            <input id="simu-dur" type="range" min="10" max="30" step="1" value="${SIMU.duree}" style="flex:1"/>
            <div style="font-family:var(--SF);font-weight:700;font-size:18px;color:var(--ink);min-width:90px;text-align:right">${SIMU.duree} ans</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div>
            <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--stone);display:block;margin-bottom:5px">Taux estimé</label>
            <input id="simu-tx" type="number" step="0.1" value="${SIMU.taux}" style="width:100%;padding:9px 11px;border:1px solid var(--linen);border-radius:8px"/>
          </div>
          <div>
            <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--stone);display:block;margin-bottom:5px">Zone PTZ 2025</label>

              <option value="B1" ${SIMU.zone==='B1'?'selected':''}>B1 — Vannes/Lorient</option>

function bindSimu(){

/* — Lead scoring : score prédictif ———————————————————— */
function viewScore(){
  /* Scoring simulé sur les LEADS existants : on génère un score basé sur stage + source. */
  const scoreOf = l => {
    let s = 30;
    if (l.stage==='qual') s += 35;
    if (l.stage==='rdv')  s += 50;
    if (l.stage==='sign') s += 70;
    if (l.stage==='cont') s += 15;
    if (l.bud==='> 400 k€') s += 12;
    if (l.bud==='300–400 k€') s += 8;
    if (l.src==='Configurateur' || l.src==='Simulateur PTZ') s += 7;
    return Math.min(s, 99);
  };
  const scored = LEADS.map(l => ({...l, score:scoreOf(l)})).filter(l=>!['sign','lost'].includes(l.stage)).sort((a,b)=>b.score-a.score);
  const chauds = scored.filter(l=>l.score>=70).length;
  const tiedes = scored.filter(l=>l.score>=40 && l.score<70).length;
  const froids = scored.filter(l=>l.score<40).length;
  const kpis = kpiRow([
    {l:'Leads scorés', v:scored.length},
    {l:'Chauds (≥70)', v:chauds, gold:true, t:'à appeler aujourd’hui'},
    {l:'Tièdes (40-69)', v:tiedes, t:'à nourrir'},
    {l:'Froids (<40)', v:froids, t:'à requalifier'},
  ]);
  const rows = scored.map(l=>{
    const c = l.score>=70?'red':l.score>=40?'amber':'stone';
    return `
    <div style="background:var(--ivory);border:1px solid var(--linen);border-radius:11px;padding:12px 16px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto auto auto;gap:14px;align-items:center">

      <div style="display:flex;gap:6px">${chip(l.src,'gold')}${chip(l.bud,'green')}</div>
      <div style="text-align:right"><div style="font-size:10px;color:var(--stone);text-transform:uppercase;letter-spacing:.04em">Score</div>
        <div style="display:flex;align-items:center;gap:8px"><div style="width:60px;height:6px;background:var(--dim);border-radius:20px;overflow:hidden"><div style="width:${l.score}%;height:100%;background:${c==='red'?'var(--red)':c==='amber'?'var(--amber)':'var(--stone)'}"></div></div><b style="font-family:var(--SF);font-size:16px;color:${c==='red'?'var(--red)':c==='amber'?'var(--amber)':'var(--stone)'}">${l.score}</b></div>
      </div>
      ${chip(l.score>=70?'CHAUD — RAPPELER MAINTENANT':l.score>=40?'tiède':'froid', c)}
    </div>`;
  }).join('');
  return kpis + sectionTitle('Top des leads à activer', 'Modèle IA entraîné sur vos signatures précédentes — alerte « moment idéal »') + rows;

      <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--linen)">
        <div><div style="font-weight:500;font-size:13px">${f.nm}</div><div style="font-size:11px;color:var(--stone)">${f.date}</div></div>
        <div style="display:flex;gap:7px;align-items:center">${chip(f.etat, etatColor(f.etat))}${f.prime?`<span style="font-weight:700;color:var(--gold);font-size:13px">+${fmtEur(f.prime)}</span>`:''}</div>
      </div>`).join('');
    return `
    <div style="background:var(--ivory);border:1px solid var(--linen);border-radius:12px;padding:16px 18px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px">
        <div>
          <div style="font-family:var(--SF);font-weight:600;font-size:16px">${p.nm}</div>
          <div style="font-size:11.5px;color:var(--stone);margin-top:2px">Livré ${p.livre} · ${p.filleuls.length} filleul(s)</div>
        </div>
        <button class="btn btn-ghost" style="font-size:11.5px;padding:6px 12px" onclick="alert('Lien parrain copié — partagez-le par email/SMS')">⤴ Lien parrain</button>
      </div>
      ${filleulsHtml}
    </div>`;
  }).join('');
  return kpis + sectionTitle('Vos meilleurs parrains', 'Vos clients livrés deviennent vos meilleurs apporteurs — prime à la signature du CCMI parrainé') + cards;
}

/* ════════════════════════ PILOTAGE ════════════════════════ */

/* — Attribution multi-touch ——————————————————————— */
const ATTRIB_CONV = [
  {nm:'Famille Bernard',  sign:'2026-01-22', valeur:248000, parcours:[{c:'SEO local',j:'-184j'},{c:'Configurateur',j:'-167j'},{c:'Email nurturing',j:'-141j'},{c:'JPO Vannes',j:'-89j'},{c:'RDV agence',j:'-32j'}], canalPrim:'SEO local'},
  {nm:'M. & Mme Petit',   sign:'2026-01-15', valeur:215000, parcours:[{c:'Google Ads',j:'-220j'},{c:'Simulateur PTZ',j:'-198j'},{c:'Email nurturing',j:'-156j'},{c:'Apporteur (Jean M.)',j:'-78j'},{c:'RDV agence',j:'-24j'}], canalPrim:'Google Ads'},
  {nm:'Léa & Hugo Moreau',sign:'2025-12-18', valeur:289000, parcours:[{c:'Parrainage',j:'-156j'},{c:'Configurateur',j:'-134j'},{c:'WhatsApp',j:'-91j'},{c:'Visite chantier',j:'-31j'}], canalPrim:'Parrainage'},
  {nm:'Karim Benali',     sign:'2025-12-05', valeur:198000, parcours:[{c:'Meta/Insta',j:'-187j'},{c:'Reel terrain',j:'-176j'},{c:'Chatbot IA',j:'-145j'},{c:'JPO Auray',j:'-67j'}], canalPrim:'Meta/Insta'},
];
function viewAttrib(){
  const total = ATTRIB_CONV.length;
  const ca = ATTRIB_CONV.reduce((s,c)=>s+c.valeur,0);
  const touchAvg = (ATTRIB_CONV.reduce((s,c)=>s+c.parcours.length,0)/total).toFixed(1);
  const cycleAvg = Math.round(ATTRIB_CONV.reduce((s,c)=>{
    const first = parseInt(c.parcours[0].j); return s + Math.abs(first);
  },0)/total);
  const byCanal = {};
  ATTRIB_CONV.forEach(c=>c.parcours.forEach(p=>{byCanal[p.c]=(byCanal[p.c]||0)+c.valeur/c.parcours.length;}));
  const sorted = Object.entries(byCanal).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxC = sorted[0][1];
  const kpis = kpiRow([
    {l:'Signatures attribuées', v:total},
    {l:'CA attribué', v:fmtEur(ca/1000)+' k€', gold:true},
    {l:'Touchpoints moyens', v:touchAvg, t:'avant signature'},
    {l:'Cycle moyen', v:cycleAvg+' j', t:'≈ '+(cycleAvg/30).toFixed(0)+' mois'},
  ]);
  const bars = sorted.map(([k,v])=>`
    <div class="bar-row">
      <div class="bar-lab">${k}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxC*100)}%"></div></div>
      <div class="bar-val">${fmtEur(Math.round(v/1000))}k€</div>
    </div>`).join('');
  const journeys = ATTRIB_CONV.map(c=>`
    <div style="background:var(--ivory);border:1px solid var(--linen);border-radius:11px;padding:14px 18px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px">
        <div><b>${c.nm}</b> <span style="font-size:11.5px;color:var(--stone);margin-left:8px">signé ${c.sign}</span></div>
        <div style="display:flex;gap:8px;align-items:center">${chip(c.canalPrim,'gold')}<b style="color:var(--gold);font-family:var(--SF)">${fmtEur(c.valeur)}</b></div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${c.parcours.map((p,i)=>`<span style="display:inline-flex;align-items:center;gap:6px;background:var(--dim);padding:4px 9px;border-radius:20px;font-size:11.5px"><b style="color:var(--ink)">${p.c}</b><span style="color:var(--stone);font-size:10px">${p.j}</span></span>${i<c.parcours.length-1?'<span style="color:var(--stone);font-size:14px">→</span>':''}`).join('')}</div>
    </div>`).join('');
  return kpis + `
  <div class="grid2">
    <div class="card">
      <div class="card-t">CA attribué par canal</div>
      <div class="card-sub">Modèle multi-touch — chaque canal du parcours reçoit sa part du CA signé</div>
      <div class="bars" style="margin-top:14px">${bars}</div>
    </div>
    <div class="card">
      <div class="card-t">Méthodologie</div>
      <div class="card-sub">Le cycle CCMI dure 6 à 18 mois — l’attribution au « dernier clic » classique est aveugle. Ici, on garde la trace de TOUTES les interactions pour donner sa juste valeur à chaque canal.</div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:14px;font-size:12.5px">
        <div><b style="color:var(--ink)">Premier touch</b> · ${ATTRIB_CONV[0].parcours[0].c}</div>
        <div><b style="color:var(--ink)">Dernier touch</b> · ${ATTRIB_CONV[0].parcours[ATTRIB_CONV[0].parcours.length-1].c}</div>
        <div><b style="color:var(--ink)">Modèle utilisé</b> · linéaire (uniforme entre touchpoints)</div>
        <div><b style="color:var(--ink)">Cycle moyen</b> · ${cycleAvg} jours</div>
      </div>
    </div>
  </div>
  ${sectionTitle('Parcours détaillés des signataires')}
  ${journeys}`;
}

/* — ROI marketing par canal ——————————————————————— */
const ROI_CANAUX = [
  {canal:'SEO local',     invest:1200,  leads:48, signes:6, ca:1488000, panMoy:248000},
  {canal:'Google Ads',    invest:14500, leads:73, signes:8, ca:1720000, panMoy:215000},
  {canal:'Meta / Insta',  invest:8400,  leads:47, signes:4, ca:856000,  panMoy:214000},
  {canal:'TikTok',        invest:2200,  leads:14, signes:1, ca:198000,  panMoy:198000},
  {canal:'Apporteurs',    invest:11200, leads:21, signes:6, ca:1430000, panMoy:238000},
  {canal:'Parrainage',    invest:2000,  leads:9,  signes:3, ca:740000,  panMoy:247000},
  {canal:'Salons / JPO',  invest:6500,  leads:38, signes:5, ca:1180000, panMoy:236000},
  {canal:'Chatbot IA',    invest:880,   leads:62, signes:4, ca:920000,  panMoy:230000},
];
function viewRoi(){
  const t = ROI_CANAUX.reduce((a,r)=>({inv:a.inv+r.invest, l:a.l+r.leads, s:a.s+r.signes, ca:a.ca+r.ca}),{inv:0,l:0,s:0,ca:0});
  const cpl = t.l? Math.round(t.inv/t.l):0;
  const cpa = t.s? Math.round(t.inv/t.s):0;
  const roas = (t.ca/t.inv).toFixed(0);
  const kpis = kpiRow([
    {l:'Investissement marketing', v:fmtEur(t.inv)},
    {l:'CA généré', v:fmtEur(t.ca/1000)+' k€', gold:true},
    {l:'ROAS portefeuille', v:roas+'×', t:'▲ +5× vs M-3'},
    {l:'Coût par signature', v:fmtEur(cpa), t:'CPL : '+fmtEur(cpl)},
  ]);
  const enriched = ROI_CANAUX.map(r=>({
    ...r,
    cpl: r.leads? Math.round(r.invest/r.leads) : 0,
    cps: r.signes? Math.round(r.invest/r.signes) : 0,
    roas: r.invest? (r.ca/r.invest).toFixed(0) : 0,
  })).sort((a,b)=>b.roas-a.roas);
  const rows = enriched.map(r=>`
    <tr style="border-bottom:1px solid var(--linen)">
      <td style="padding:11px 8px;font-weight:600">${r.canal}</td>
      <td style="padding:11px 8px;text-align:right;font-variant-numeric:tabular-nums">${fmtEur(r.invest)}</td>
      <td style="padding:11px 8px;text-align:right;font-variant-numeric:tabular-nums">${r.leads}</td>
      <td style="padding:11px 8px;text-align:right;font-variant-numeric:tabular-nums">${fmtEur(r.cpl)}</td>
      <td style="padding:11px 8px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold)">${r.signes}</td>
      <td style="padding:11px 8px;text-align:right;font-variant-numeric:tabular-nums">${fmtEur(r.cps)}</td>
      <td style="padding:11px 8px;text-align:right;font-variant-numeric:tabular-nums">${fmtEur(r.ca/1000)}k€</td>
      <td style="padding:11px 8px;text-align:right;font-weight:700;color:${r.roas>=50?'var(--green)':r.roas>=20?'var(--gold)':'var(--amber)'}">${r.roas}×</td>
    </tr>`).join('');
  return kpis + `
  <div class="card" style="overflow-x:auto">
    <div class="card-t">ROI par canal d’acquisition</div>
    <div class="card-sub">Triés par ROAS décroissant — sur la base des 30 derniers jours d’investissement et des signatures attribuées sur 12-18 mois.</div>
    <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:8px">
      <thead><tr style="text-align:left;border-bottom:1px solid var(--linen)">
        <th style="padding:9px 8px;font-size:11px;color:var(--stone);text-transform:uppercase;letter-spacing:.04em">Canal</th>
        <th style="padding:9px 8px;font-size:11px;color:var(--stone);text-transform:uppercase;letter-spacing:.04em;text-align:right">Invest.</th>
        <th style="padding:9px 8px;font-size:11px;color:var(--stone);text-transform:uppercase;letter-spacing:.04em;text-align:right">Leads</th>
        <th style="padding:9px 8px;font-size:11px;color:var(--stone);text-transform:uppercase;letter-spacing:.04em;text-align:right">CPL</th>
        <th style="padding:9px 8px;font-size:11px;color:var(--stone);text-transform:uppercase;letter-spacing:.04em;text-align:right">Signés</th>
        <th style="padding:9px 8px;font-size:11px;color:var(--stone);text-transform:uppercase;letter-spacing:.04em;text-align:right">CPS</th>
        <th style="padding:9px 8px;font-size:11px;color:var(--stone);text-transform:uppercase;letter-spacing:.04em;text-align:right">CA</th>
        <th style="padding:9px 8px;font-size:11px;color:var(--stone);text-transform:uppercase;letter-spacing:.04em;text-align:right">ROAS</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function viewSoon(item){
  const feats = (item.feats||[]).map(f=>`<div class="soon-feat"><span class="ck">✦</span><span>${f}</span></div>`).join('');
  return `
  <div class="soon-panel">
    <div class="soon-ic-wrap">${item.ic}</div>
    <div class="soon-tag">${item.eye||'Module'}</div>
    <h2>${item.nm}</h2>
    <p>${item.long||item.desc}</p>
    <div class="soon-feats">${feats}</div>
  </div>`;
}

/* ════════════════════════ MODAL ════════════════════════ */
function openModal(){ document.getElementById('ov').classList.add('show'); }
function closeModal(){ document.getElementById('ov').classList.remove('show'); }
function saveLead(){
  const v = id=>document.getElementById(id).value.trim();
  const name = v('f-name');
  if(!name){ document.getElementById('f-name').focus(); return; }
  LEADS.unshift({
    id:++seq, name, email:v('f-email'), tel:v('f-tel'),
    src:v('f-src'), bud:v('f-bud'), zone:v('f-zone')||'Projet à préciser', stage:'new'
  });
  ['f-name','f-email','f-tel','f-zone'].forEach(i=>document.getElementById(i).value='');
  closeModal();
  if(current!=='leads') go('leads'); else renderView();
}
document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeModal(); });
document.getElementById('ovApp').addEventListener('click',e=>{ if(e.target.id==='ovApp') closeAppModal(); });
