function jourZero(){ var d=new Date(); d.setHours(0,0,0,0); return d.toISOString(); }

/* La file : d'abord ce qu'on a promis de rappeler, ensuite les fiches
   jamais appelées. Une promesse tenue vaut mieux qu'un appel de plus. */
/* La file : d'abord ce qu'on a promis de rappeler, ensuite les fiches
   jamais appelees. La colonne de date des prospects s'appelle created_at,
   pas cree_le : la difference coutait une erreur 400 a chaque appel. */
async function ficheSuivante(){
  /* La base sert la fiche et la verrouille quinze minutes : deux
     commerciaux en session ne recoivent jamais la meme entreprise.
     Fonction pas encore posee en base : ancien chemin. */
  try{
    var v=await rpc('oq_fiche_suivante',{p_owner:moi||''});
    return (v&&v.length)?v[0]:null;
  }catch(e){}
  var due=await lire('oq_prospects',
    'select=*&tel=not.is.null&rappel_le=lte.'+new Date().toISOString()+'&order=rappel_le.asc&limit=1');
  if(due.length)return due[0];
  var neuf=await lire('oq_prospects',
    'select=*&tel=not.is.null&appel_resultat=is.null&order=created_at.desc&limit=1')
    .catch(function(){return lire('oq_prospects','select=*&tel=not.is.null&appel_resultat=is.null&limit=1');});
  return neuf[0]||null;
}

/* L'ouverture : on ne récite pas un argumentaire, on part de ce que la
   machine a vu sur leur site. C'est la différence entre un démarchage et
   un appel qui a une raison d'être. */
/* Le nom sous lequel le commercial se presente : sa fiche expéditeur
   d'abord, sinon l'équipe, sinon son identifiant nettoyé. On ne se
   présente jamais « rubelectro26 » au téléphone. */
var NOM_PARLE=null;
async function nomParle(){
  if(NOM_PARLE)return NOM_PARLE;
  var brut=String(moi||'').split('@')[0].replace(/[0-9._-]+/g,' ').trim();
  NOM_PARLE=brut?brut.charAt(0).toUpperCase()+brut.slice(1):'';
  try{
    var e=await lire('oq_expediteurs','select=from_nom&owner_email=eq.'+encodeURIComponent(moi||'')+'&limit=1');
    if(e[0]&&e[0].from_nom)NOM_PARLE=e[0].from_nom;
    else{
      var q=await lire('oq_equipe','select=nom&email=eq.'+encodeURIComponent(moi||'')+'&limit=1');
      if(q[0]&&q[0].nom)NOM_PARLE=q[0].nom;
    }
  }catch(x){}
  return NOM_PARLE;
}

/* Le but de l'appel : repartir avec le contact du responsable logiciel.
   Deux regles d'ecriture : on se presente completement des la premiere
   seconde (nom, societe, metier) — c'est ce qui fait professionnel — et
   chaque mot doit etre compris du standard sans effort. On dit
   « une demonstration gratuite de logiciel », jamais « la maquette de
   votre futur outil de gestion ». */
function raisonParlee(p){
  var s=Array.isArray(p.signaux)?p.signaux.join(' | '):String(p.signaux||'');
  return {chaud:/écrit spontanément|lead entrant/i.test(s)};
}

function parle(p,nom){
  var pre=p.dirigeant?String(p.dirigeant).split(' ')[0]:'';
  return {
    accroche:'Bonjour. '+nom+', de la société ONIQ — nous créons des logiciels, des applications et des automatisations pour les entreprises. '
      +(pre?'Je cherche à joindre '+pre+' : c’est bien lui qui s’occupe des logiciels chez vous ?'
            :'Pourriez-vous me dire qui s’occupe des logiciels et des outils informatiques dans votre entreprise ?'),
    pourquoi:'Nous avons préparé pour votre entreprise une démonstration gratuite : '
      +'un exemple de logiciel ou d’application, fait pour votre métier — et si des tâches se répètent chez vous, on montre aussi comment les automatiser. Il n’y a rien à payer et rien à installer — '
      +'c’est simplement à regarder. Je souhaite la faire parvenir à la bonne personne.',
    question:'Quelle est la meilleure adresse email pour la lui envoyer ? '
      +'Et si vous avez sa ligne directe, je la note.',
    barrage:'« C’est à quel sujet ? » : Une démonstration de logiciel préparée pour votre entreprise — c’est offert. '
      +'— « Envoyez au standard » : Bien sûr. À quel nom est-ce que je l’adresse, pour qu’elle arrive à la bonne personne ? '
      +'— « Pas le temps » : Je comprends. Juste le nom de la personne qui s’en occupe, et je ne vous dérange plus.'
  };
}

/* ── Le bilan de l'heure ────────────────────────────────────────────
   Une session qui s'arrete sans rien dire ne donne pas envie d'en
   refaire une. Celle-ci se termine par trois chiffres et une phrase. */
async function bilanSession(){
  clearInterval(MINUTEUR);
  var s=SESSION; SESSION=null;
  if(!s){ ecranDepart(); return; }

  var o=await objectifs();
  var cible=Math.max(5,Math.round(o.appels/2));
  var minutes=Math.max(1,Math.round((Date.now()-s.debut)/60000));
  var parAppel=s.faits?Math.round(minutes*60/s.faits):0;
  var part=cible?s.faits/cible:0;
  var phrase = part>=1 ? 'Heure pleine. C’est exactement le rythme qu’il faut tenir.'
    : part>=0.7 ? 'Bonne heure. Il manquait peu de choses.'
    : part>=0.4 ? 'Heure correcte. Le prochain bloc ira plus vite, les fiches sont déjà chaudes.'
    : s.faits ? 'Petite heure. Ça arrive : les barrages, les absents, les rappels.'
    : 'Aucun appel enregistré sur cette heure.';

  $('#vue').innerHTML='<div class="panneau vif"><div class="corps bilan">'
    +'<div class="bilan-tete">'+visage(part,84)
      +'<div><div class="obj-titre">Bilan de l’heure</div>'
      +'<div class="obj-mot">'+ech(phrase)+'</div></div></div>'
    +'<div class="faits-d">'
      +fait('Appels passés',nb(s.faits))
      +fait('Intéressés',nb(s.interesses),s.interesses>0)
      +fait('Durée',nb(minutes)+' min')
      +fait('Temps par appel',parAppel?(parAppel+' s'):'—')
    +'</div>'
    +'<div class="bilan-actes">'
      +'<button class="btn fort" id="encore">Enchaîner une heure</button>'
      +'<button class="btn" id="fini">Terminer pour aujourd’hui</button>'
    +'</div></div></div>';

  $('#encore').onclick=async function(){
    var r=await compter('oq_appels','owner_email=eq.'+encodeURIComponent(moi||'')
      +'&created_at=gte.'+jourZero()).catch(function(){return 0;});
    SESSION={debut:Date.now(),faits:0,interesses:0,fiche:null,depart:r};
    SESSION.nom=await nomParle();
    ecranSession();
  };
  $('#fini').onclick=function(){ ecranDepart(); };
}

async function ecranSession(){
  $('#vue').innerHTML='<div class="panneau"><div class="corps">'
    +'<div class="vide"><div class="pt">Recherche de la prochaine fiche…</div></div></div></div>';
  var p;
  try{ p=await ficheSuivante(); }
  catch(e){ $('#vue').innerHTML='<div class="erreur">'+ech(e.message)+'</div>'; return; }

  if(!p){
    $('#vue').innerHTML='<div class="panneau"><div class="corps">'
      +vide('La file est vide','Vous avez appelé tout le monde. Lancez une campagne dans Prospection pour en ramener d’autres.')
      +'</div></div>';
    bilanSession(); return;
  }
  SESSION.fiche=p;

  var o=await objectifs();
  var cible=Math.max(5,Math.round(o.appels/2));     /* une heure = la moitie du jour */
  var reste=resteSession();
  var ecoule=DUREE_SESSION-reste;
  /* Le rythme attendu a cet instant : sert a dire « dans les temps » ou
     « il faut accelerer » sans jamais culpabiliser. */
  var attendu=Math.floor(cible*ecoule/DUREE_SESSION);
  var avance=SESSION.faits-attendu;
  var partT=Math.round(100*ecoule/DUREE_SESSION);
  var partA=Math.min(100,Math.round(100*SESSION.faits/cible));

  var h='<div class="bandeau-session">'
    +'<span class="chrono"><b id="chrono">'+mmss(reste)+'</b> restantes</span>'
    +'<span><b>'+nb(SESSION.faits)+'</b> / '+nb(cible)+' appels</span>'
    +'<span><b>'+nb(SESSION.interesses)+'</b> intéressé'+(SESSION.interesses>1?'s':'')+'</span>'
    +'<span class="rythme '+(avance>=0?'ok':'mou')+'">'
      +(SESSION.faits?(avance>=0?'dans les temps':'un peu lent'):'à lancer')+'</span>'
    +((SESSION.histo&&SESSION.histo.length)
      ?'<button class="btn" id="annuler-appel" title="Le dernier résultat s’annule, la fiche revient">↩ Annuler le dernier</button>':'')
    +'<button class="btn" id="stop-session">Terminer</button>'
    +'</div>'
    +'<div class="jauge-obj"><i style="width:'+partA+'%"></i>'
      +'<span>'+nb(SESSION.faits)+' / '+nb(cible)+' sur cette heure</span>'
      +'<em style="left:'+partT+'%"></em></div>';

  h+='<div class="fiche-appel"><div class="corps">'
    +'<div class="tete-f">'
      +'<div><div class="ent">'+ech(p.entreprise||'Entreprise inconnue')+'</div>'
        +'<div class="meta">'+[p.ville,p.dirigeant].filter(Boolean).map(ech).join(' · ')+'</div></div>'
      +(p.rappel_le?'<span class="etat e-att">rappel promis</span>':'')
    +'</div>'
    +'<a class="numero" href="tel:'+ech(String(p.tel).replace(/\s/g,''))+'">'+ech(p.tel)+'</a>'
    +(function(){
      var s=parle(p,SESSION.nom||'');
      return '<div class="script">'
        +'<div class="pas-s"><i>1</i><div><span class="lab">La présentation — nom, société, métier, puis une seule question</span>'+ech(s.accroche)+'</div></div>'
        +'<div class="pas-s"><i>2</i><div><span class="lab">Le prétexte — une démonstration gratuite à transmettre</span>'+ech(s.pourquoi)+'</div></div>'
        +'<div class="pas-s"><i>3</i><div><span class="lab">Le but — son email et sa ligne directe</span>'+ech(s.question)+'</div></div>'
        +'<div class="pas-s barrage"><i>!</i><div><span class="lab">Si ça résiste</span>'+ech(s.barrage)+'</div></div>'
        +'</div>';
    })()
    +'<div class="liens-f">'
      +(p.site?'<a href="'+ech(p.site)+'" target="_blank" rel="noopener">Leur site</a>':'')
      +(p.linkedin_url?'<a href="'+ech(p.linkedin_url)+'" target="_blank" rel="noopener">LinkedIn</a>':'')
      +(p.email?'<a href="mailto:'+ech(p.email)+'">'+ech(p.email)+'</a>':'')
    +'</div>'
    +(function(){
      var s=Array.isArray(p.signaux)?p.signaux:(p.signaux?[p.signaux]:[]);
      s=s.map(function(x){return String(x).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'').trim();}).filter(Boolean);
      return s.length?'<div class="signaux"><span class="lab">Ce que la machine a vu</span>'+s.map(ech).join(' · ')+'</div>':'';
    })()
    +'<div class="resultats">'
      +RESULTATS.map(function(x){
        return '<button class="res '+(x.genre?'r-'+x.genre:'')+'" data-res="'+x.id+'">'
          +'<b>'+x.lab+'</b><span>'+x.aide+'</span><i>'+x.touche+'</i></button>';}).join('')
    +'</div>'
    +'<div class="champ-note"><input id="note-appel" placeholder="Une note, si vous en avez une (facultatif)"></div>'
  +'</div></div>';

  $('#vue').innerHTML=h;
  $('#stop-session').onclick=function(){ bilanSession(); };
  var ba=$('#annuler-appel'); if(ba)ba.onclick=annulerDernier;

  /* Le compte a rebours se met a jour tout seul, sans redessiner la fiche :
     le commercial est peut-etre en train de taper une note. */
  clearInterval(MINUTEUR);
  MINUTEUR=setInterval(function(){
    if(courante!=='appels'||!SESSION){ clearInterval(MINUTEUR); return; }
    var r=resteSession(), c=$('#chrono');
    if(c)c.textContent=mmss(r);
    if(r<=0){ clearInterval(MINUTEUR); bilanSession(); }
  },1000);
  $$('[data-res]').forEach(function(b){ b.onclick=function(){ noter(b.dataset.res); }; });
  var n=$('#note-appel'); if(n)setTimeout(function(){n.focus();},80);
}

/* Le clavier : les cinq touches valent les cinq boutons. Au bout de
   trente appels, la main ne quitte plus le pavé numérique. */
document.addEventListener('keydown',function(e){
  if(courante!=='appels'||!SESSION||!SESSION.fiche)return;
  if(e.target&&e.target.tagName==='INPUT'&&e.key!=='Enter')return;
  var r=RESULTATS.filter(function(x){return x.touche===e.key;})[0];
  if(r){ e.preventDefault(); noter(r.id); }
});

async function noter(resultat){
  var p=SESSION&&SESSION.fiche; if(!p)return;
  /* Un intéressé ne se clique pas, il se verrouille : email, rendez-vous,
     besoin. Tout le reste passe par le chemin court. */
  if(resultat==='interesse'){ choixInteresse(p); return; }
  var note=($('#note-appel')||{}).value||'';
  var rappel=null;
  if(resultat==='rappeler'){
    /* Notre fenetre, pas celle du navigateur : la charte tient jusque
       dans les petites questions. */
    formulaire('Vous le rappelez quand ?',[
      {id:'jours',nom:'Le rappel',type:'select',valeur:'2',options:[
        ['1','Demain'],['2','Dans deux jours'],['3','Dans trois jours'],
        ['7','La semaine prochaine'],['14','Dans deux semaines'],['30','Dans un mois']]}
    ],async function(v){
      var rap=new Date(Date.now()+(parseFloat(v.jours)||2)*86400000).toISOString();
      await enregistrer(p,'rappeler',note,rap,
        {appel_resultat:'rappeler',appel_le:new Date().toISOString(),rappel_le:rap},false);
    });
    return;
  }
  if(resultat==='absent') rappel=new Date(Date.now()+3*86400000).toISOString();
  var maj={appel_resultat:resultat,appel_le:new Date().toISOString(),rappel_le:rappel};
  if(resultat==='pas_interesse')maj.statut='perdu';
  if(resultat==='faux_numero')maj.tel=null;
  await enregistrer(p,resultat,note,rappel,maj,false);
}

/* ── L'intéressé : le moment le plus précieux de la journée ─────────
   Le commercial l'a en ligne, c'est maintenant que tout se joue. Le
   formulaire lui dicte les trois choses à obtenir avant de raccrocher :
   l'email confirmé à voix haute, le rendez-vous posé, et le besoin
   avec les mots du prospect. Le rendez-vous et l'email atterrissent
   sur la fiche : c'est là que l'automatisation de confirmation viendra
   les chercher. */
/* ── L'aiguillage de l'intéressé ────────────────────────────────────
   « Intéressé » recouvre quatre situations qui n'appellent pas la même
   suite. Le commercial choisit ce qu'il a réellement obtenu, et
   l'écran le guide vers la bonne action — chaque branche enregistre
   proprement, et tout reste annulable. */
/* La salle de visio du rendez-vous : une adresse Jitsi dediee, gratuite,
   sans compte ni installation des deux cotes. L'identifiant derive de la
   fiche : impossible a deviner, toujours le meme pour ce prospect. */
function salleVisio(p){
  var g=String(p.id||Math.random()).replace(/[^a-z0-9]/gi,'').slice(0,10);
  return 'https://meet.jit.si/ONIQ-'+g+Math.random().toString(36).slice(2,6);
}

function choixInteresse(p){
  var f=document.createElement('div');
  f.className='fond-modale';
  f.innerHTML='<div class="modale" role="dialog" aria-modal="true"><header>'
    +'<h3>Intéressé — qu’avez-vous obtenu ?</h3>'
    +'<button class="fermer" aria-label="Fermer">×</button></header>'
    +'<div class="corps"><div class="choix-suite">'
    +'<button data-suite="contact"><b>Le contact du responsable</b>'
      +'<span>La personne au bout du fil vous a donné son email — on lui envoie la démonstration</span></button>'
    +'<button data-suite="cdc"><b>Le responsable est en ligne</b>'
      +'<span>Il est partant — notez le cahier des charges de sa démonstration maintenant</span></button>'
    +'<button data-suite="rdv"><b>Il veut un rendez-vous</b>'
      +'<span>Pas le temps là, mais d’accord pour un créneau — posez-le</span></button>'
    +'</div></div></div>';
  document.body.appendChild(f);
  var partir=function(){ f.remove(); };
  f.querySelector('.fermer').onclick=partir;
  f.addEventListener('click',function(e){ if(e.target===f)partir(); });
  f.querySelectorAll('[data-suite]').forEach(function(b){
    b.onclick=function(){
      partir();
      ({contact:formContact,cdc:ficheCDC,rdv:formRdv})[b.dataset.suite](p);
    };
  });
}

/* 1. Le standard a donné le contact : on enregistre, et la démonstration
   part tout de suite — l'email s'ouvre prérempli dans la messagerie du
   commercial, il n'a qu'à cliquer Envoyer. */
function formContact(p){
  formulaire('Le contact du responsable',[
    {id:'nom_resp',nom:'Son nom',requis:true,valeur:p.dirigeant,aide:'prénom et nom si possible'},
    {id:'email',nom:'Son email',type:'email',requis:true,aide:'faites-le répéter, lettre par lettre'},
    {id:'tel_resp',nom:'Sa ligne directe',aide:'si on vous l’a donnée'}
  ],async function(v){
    /* La machine envoie la démonstration dans les cinq minutes, avec
       l'expéditeur du commercial. Rien à faire de plus. */
    var maj={appel_resultat:'interesse',appel_le:new Date().toISOString(),
      statut:'repondu',email:v.email,demo_a_envoyer:true,
      rappel_le:new Date(Date.now()+2*86400000).toISOString()};
    if(v.nom_resp)maj.dirigeant=v.nom_resp;
    if(v.tel_resp)maj.tel=v.tel_resp;
    var note='CONTACT RESPONSABLE\nNom : '+(v.nom_resp||'')+'\nEmail : '+(v.email||'')
      +(v.tel_resp?'\nLigne directe : '+v.tel_resp:'')
      +'\nDémonstration : envoi automatique dans les 5 minutes.';
    await enregistrer(p,'interesse',note,maj.rappel_le,maj,true);
    bravo('Contact noté — la démonstration part toute seule dans les 5 minutes.');
  });
}

/* 2. Le responsable est en ligne : le mini cahier des charges,
   directement. */
function ficheCDC(p){
  var heures=[];
  for(var h9=9;h9<=18;h9++){ heures.push([('0'+h9).slice(-2)+':00',h9+' h']); heures.push([('0'+h9).slice(-2)+':30',h9+' h 30']); }
  var demain=new Date(Date.now()+86400000).toISOString().slice(0,10);
  formulaire('Le mini cahier des charges de sa maquette',[
    {id:'besoin_type',nom:'Ce qui lui prend le plus de temps',type:'select',requis:true,options:[
      ['','À choisir'],
      ['Devis et facturation','Devis et facturation'],
      ['Planning et interventions','Planning et interventions'],
      ['Suivi des clients','Suivi des clients'],
      ['Stock et commandes','Stock et commandes'],
      ['Paperasse et documents','Paperasse et documents'],
      ['Autre','Autre, précisé ci-dessous']]},
    {id:'outil_actuel',nom:'Comment il fait aujourd’hui',type:'select',requis:true,options:[
      ['','À choisir'],
      ['Papier et carnet','Papier et carnet'],
      ['Excel ou tableurs','Excel ou tableurs'],
      ['Un logiciel qui ne convient plus','Un logiciel qui ne convient plus'],
      ['Plusieurs outils qui ne se parlent pas','Plusieurs outils qui ne se parlent pas']]},
    {id:'besoin',nom:'Avec ses mots — ce que la maquette doit montrer',type:'textarea',large:true,requis:true,
     aide:'ex. « il veut faire un devis depuis le chantier et que la facture parte toute seule »'},
    {id:'email',nom:'Son adresse email',type:'email',requis:true,valeur:p.email,
     aide:'faites-la répéter, lettre par lettre — la maquette part dessus'},
    {id:'tel',nom:'Sa ligne directe',valeur:p.tel},
    {id:'rdv_date',nom:'Présentation de la maquette, le jour',type:'date',requis:true,valeur:demain},
    {id:'rdv_heure',nom:'Présentation, l’heure',type:'select',options:heures,valeur:'10:00'}
  ],async function(v){
    var rdv=null;
    try{ rdv=new Date(v.rdv_date+'T'+(v.rdv_heure||'10:00')+':00').toISOString(); }catch(x){}
    var maj={appel_resultat:'interesse',appel_le:new Date().toISOString(),
      statut:'repondu',rappel_le:null};
    if(v.email)maj.email=v.email;
    if(v.tel)maj.tel=v.tel;
    if(rdv)maj.rdv_le=rdv;
    maj.visio_url=p.visio_url||salleVisio(p);
    /* La note est le cahier des charges : celui qui fabrique la maquette
       n'a besoin de rien d'autre. */
    var note='CAHIER DES CHARGES MAQUETTE'
      +'\nBesoin principal : '+(v.besoin_type||'')
      +'\nAujourd’hui : '+(v.outil_actuel||'')
      +'\nÀ montrer : '+(v.besoin||'')
      +'\nPrésentation : '+(rdv?date(rdv)+' à '+(v.rdv_heure||'10:00'):'à fixer');
    await enregistrer(p,'interesse',note,null,maj,true);
  });
}


/* 3. Le rendez-vous : un créneau, un contact pour la confirmation. */
function formRdv(p){
  var heures=[];
  for(var h9=9;h9<=18;h9++){ heures.push([('0'+h9).slice(-2)+':00',h9+' h']); heures.push([('0'+h9).slice(-2)+':30',h9+' h 30']); }
  var demain=new Date(Date.now()+86400000).toISOString().slice(0,10);
  formulaire('Le rendez-vous',[
    {id:'avec',nom:'Avec qui',requis:true,valeur:p.dirigeant,aide:'la personne qui sera au rendez-vous'},
    {id:'rdv_date',nom:'Le jour',type:'date',requis:true,valeur:demain},
    {id:'rdv_heure',nom:'L’heure',type:'select',options:heures,valeur:'10:00'},
    {id:'email',nom:'Son email',type:'email',valeur:p.email,aide:'pour la confirmation — fortement conseillé'},
    {id:'note_rdv',nom:'À savoir avant le rendez-vous',type:'textarea',large:true}
  ],async function(v){
    var rdv=null;
    try{ rdv=new Date(v.rdv_date+'T'+(v.rdv_heure||'10:00')+':00').toISOString(); }catch(x){}
    var maj={appel_resultat:'interesse',appel_le:new Date().toISOString(),
      statut:'repondu',rappel_le:null};
    if(v.email)maj.email=v.email;
    if(v.avec)maj.dirigeant=v.avec;
    if(rdv)maj.rdv_le=rdv;
    maj.visio_url=p.visio_url||salleVisio(p);
    var note='RENDEZ-VOUS\nAvec : '+(v.avec||'')+'\nLe : '+(rdv?date(rdv)+' à '+(v.rdv_heure||'10:00'):'à fixer')
      +'\nVisio : '+maj.visio_url
      +(v.email?'\nEmail : '+v.email:'')+(v.note_rdv?'\nNotes : '+v.note_rdv:'');
    await enregistrer(p,'interesse',note,null,maj,true);
  });
}


/* Le tronc commun : la ligne d'appel, la fiche, la trace, et de quoi
   tout défaire si le doigt a glissé. */
async function enregistrer(p,resultat,note,rappel,maj,interesse){
  try{
    var lig=await ecrire('oq_appels',{prospect_id:p.id,owner_email:moi,resultat:resultat,
      note:note||null,rappel_le:rappel});
    await modifier('oq_prospects','id=eq.'+p.id,maj);
    await tracer('appel.'+resultat,p.entreprise,p.id);
    SESSION.histo=SESSION.histo||[];
    SESSION.histo.push({appel:lig[0]&&lig[0].id,prospect:p.id,entreprise:p.entreprise,
      interesse:!!interesse,
      avant:{statut:p.statut||'nouveau',appel_resultat:p.appel_resultat||null,
        appel_le:p.appel_le||null,rappel_le:p.rappel_le||null,
        tel:p.tel||null,email:p.email||null,rdv_le:p.rdv_le||null}});
  }catch(e){
    alert('Enregistrement impossible : '+e.message);
    return;
  }
  SESSION.faits++;
  if(interesse)SESSION.interesses++;
  /* Un mot au passage des paliers, jamais deux fois le meme. */
  var o=await objectifs(), tot=(SESSION.depart||0)+SESSION.faits;
  SESSION.paliers=SESSION.paliers||{};
  [[o.appels,'Objectif du jour tenu.'],
   [Math.ceil(o.appels/2),'La moitié est faite.'],
   [Math.ceil(o.appels/4),'Un quart de fait.']].forEach(function(pp){
    if(tot>=pp[0]&&!SESSION.paliers[pp[0]]){ SESSION.paliers[pp[0]]=1; bravo(pp[1]); }
  });
  ecranSession();
}

/* ── L'erreur se répare ─────────────────────────────────────────────
   Le dernier résultat s'annule : la ligne d'appel est supprimée, la
   fiche revient exactement à son état d'avant, les compteurs
   redescendent. On peut remonter toute la session, appel par appel. */
async function annulerDernier(){
  var h=SESSION&&SESSION.histo&&SESSION.histo.pop();
  if(!h)return;
  try{
    if(h.appel){
      var r=await appelle(URL_BASE+'/rest/v1/oq_appels?id=eq.'+h.appel,
        {method:'DELETE',headers:entetes()});
      if(!r.ok)throw new Error('oq_appels : '+r.status);
    }
    await modifier('oq_prospects','id=eq.'+h.prospect,h.avant);
    await tracer('appel.annule',h.entreprise,h.prospect);
  }catch(e){
    alert('Annulation impossible : '+e.message);
    SESSION.histo.push(h);
    return;
  }
  SESSION.faits=Math.max(0,SESSION.faits-1);
  if(h.interesse)SESSION.interesses=Math.max(0,SESSION.interesses-1);
  bravo('Annulé — la fiche '+(h.entreprise||'')+' est revenue dans la file.');
  ecranSession();
}

/* Une ligne qui monte, trois secondes, et disparait. Ni confettis ni
   son : le commercial est peut-etre au telephone. */
function bravo(texte){
  var d=document.createElement('div');
  d.className='bravo'; d.textContent=texte;
  document.body.appendChild(d);
  setTimeout(function(){ d.classList.add('parti'); },2600);
  setTimeout(function(){ d.remove(); },3200);
}

/* ── Pipeline ──────────────────────────────────────────────────────── */
VUES.pipeline=async function(){
  try{
    var etapes=[
      ['nouveau','Jamais contactés',''],
      ['en_cours','Contactés',''],
      ['repondu','Ont répondu','ok'],
      ['perdu','Sortis','ret']
    ];
    var comptes=await Promise.all(etapes.map(function(e){
      return compter('oq_prospects','statut=eq.'+e[0]);
    }));
    var h='<div class="kpis">'+etapes.map(function(e,i){
      return kpi(e[2],nb(comptes[i]),e[2]==='ok'?'vert':(e[2]==='ret'?'':''),'');
    }).join('')+'</div>';
    /* On affiche les fiches qui méritent une action, pas la base entière :
       mille lignes ne se travaillent pas, dix se rappellent. */
    var chauds=await lire('oq_prospects',
      'select=*&statut=eq.repondu&order=appel_le.desc.nullslast&limit=40');
    h+='<div class="panneau"><header><h2>À traiter en priorité</h2>'
      +'<span class="aide">ceux qui ont répondu ou se sont dits intéressés</span></header>';
    h+=chauds.length?('<div class="tbl-scroll"><table><thead><tr><th>Entreprise</th><th>Ville</th>'
      +'<th>Contact</th><th>Dernier appel</th><th></th></tr></thead><tbody>'
      +chauds.map(function(p){
        return '<tr><td><b>'+ech(p.entreprise||'—')+'</b>'
          +(p.rdv_le?'<div style="font-size:12px;color:var(--ok)">RDV le '+date(p.rdv_le)
            +(p.visio_url?' · <a href="'+ech(p.visio_url)+'" target="_blank" rel="noopener" style="color:var(--signal)">ouvrir la visio</a>':'')
            +'</div>':'')
          +'</td><td>'+ech(p.ville||'—')+'</td>'
          +'<td>'+ech(p.dirigeant||p.email||'—')+'</td>'
          +'<td>'+(p.appel_le?date(p.appel_le):'—')+'</td>'
          +'<td class="n">'+(p.tel?'<a class="btn" href="tel:'+ech(String(p.tel).replace(/\s/g,''))+'">Appeler</a>':'')
          +(p.email?'<a class="btn" href="mailto:'+ech(p.email)+'">Écrire</a>':'')+'</td></tr>';
      }).join('')+'</tbody></table></div>')
      :vide('Rien à traiter pour le moment','Les fiches passent ici dès qu’un prospect répond ou se dit intéressé au téléphone.');
    h+='</div>';
    $('#vue').innerHTML=h;
  }catch(e){ $('#vue').innerHTML='<div class="erreur">'+ech(e.message)+'</div>'; }
};

/* ── Performance ───────────────────────────────────────────────────── */
VUES.performance=async function(){
  try{
    /* On ne telecharge plus tous les appels de la maison : seulement
       les miens (moyenne, record), et l'equipe arrive deja comptee par
       la base (oq_perf) - quelques centaines d'octets a 10 000 appels. */
    var r=await Promise.all([
      lire('oq_appels','select=owner_email,resultat,created_at&owner_email=eq.'
        +encodeURIComponent(moi||'')+'&order=created_at.desc&limit=2000'),
      lire('oq_equipe','select=email,nom,objectif_appels,objectif_interesses&order=email')
        .catch(function(){return [];}),
      rpc('oq_perf').catch(function(){return null;})
    ]);
    var app=r[0], equipe=r[1], perf=r[2];

    bouton('Objectifs',function(){
      if(!equipe.length){ alert('Aucun membre d’équipe enregistré.'); return; }
      formulaire('Objectifs quotidiens',equipe.map(function(g){
        return {id:'o_'+g.email.replace(/[^a-z0-9]/gi,'_'),nom:g.email+' — appels par jour',
          type:'number',valeur:g.objectif_appels||40};
      }),async function(v){
        for(var i=0;i<equipe.length;i++){
          var k='o_'+equipe[i].email.replace(/[^a-z0-9]/gi,'_');
          if(v[k]!=null)await modifier('oq_equipe','email=eq.'+encodeURIComponent(equipe[i].email),
            {objectif_appels:v[k]});
        }
        await tracer('objectifs.modifies',''); OBJ=null; VUES.performance();
      });
    });

    if(!app.length&&!(perf&&perf.length)){
      $('#vue').innerHTML='<div class="panneau"><div class="corps">'
        +vide('Aucun appel enregistré','Les chiffres apparaîtront dès la première session d’appels.')
        +'</div></div>';
      return;
    }

    var o=await objectifs();
    var t0=jourZero(), sem=new Date(Date.now()-7*86400000).toISOString(),
        sem2=new Date(Date.now()-14*86400000).toISOString();

    /* Ce qui me concerne, moi seul : aucune ligne ne compare deux
       personnes entre elles. */
    var moiApp=app;
    var jour=moiApp.filter(function(a){return a.created_at>=t0;});
    var s1=moiApp.filter(function(a){return a.created_at>=sem;});
    var s0=moiApp.filter(function(a){return a.created_at>=sem2&&a.created_at<sem;});
    var parJour={};
    moiApp.forEach(function(a){ var j=String(a.created_at).slice(0,10); parJour[j]=(parJour[j]||0)+1; });
    var jours=Object.keys(parJour);
    var record=jours.length?Math.max.apply(null,jours.map(function(k){return parJour[k];})):0;
    var moyenne=jours.length?Math.round(moiApp.length/jours.length):0;
    var interS1=s1.filter(function(a){return a.resultat==='interesse';}).length;
    var tx=tauxOuAttente(interS1,s1.length);
    var evol=s0.length?Math.round(100*(s1.length-s0.length)/s0.length):null;
    var part=o.appels?jour.length/o.appels:0;

    var phrase = part>=1 ? 'Objectif tenu aujourd’hui.'
      : part>=0.75 ? 'Vous y êtes presque.'
      : part>=0.4 ? 'La journée est lancée, il reste de la marge.'
      : jour.length ? 'Le plus dur est fait, la première est passée.'
      : 'Rien de fait aujourd’hui. Une session de vingt minutes suffit à lancer la journée.';

    var h='<div class="panneau vif"><div class="corps">'
      +'<div class="moi-grille">'
        +'<div class="moi-visage">'+visage(part,96)+'</div>'
        +'<div class="moi-dit">'
          +'<div class="obj-titre">Où vous en êtes</div>'
          +'<div class="obj-mot">'+ech(phrase)+'</div>'
          +'<div class="obj-faits">'
            +'<div><span>Aujourd’hui</span><b>'+nb(jour.length)+' / '+nb(o.appels)+'</b></div>'
            +'<div><span>Votre moyenne</span><b>'+nb(moyenne)+' par jour</b></div>'
            +'<div><span>Votre record</span><b>'+nb(record)+'</b></div>'
            +'<div><span>Cette semaine</span><b>'+nb(s1.length)
              +(evol!==null?' <i class="'+(evol>=0?'up':'down')+'">'
                +(evol>=0?'+':'')+evol+' %</i>':'')+'</b></div>'
          +'</div>'
        +'</div>'
      +'</div></div></div>';

    /* Le taux : affiche seulement quand il repose sur assez d'appels. */
    h+='<div class="panneau"><header><h2>Votre conversion</h2>'
      +'<span class="aide">sur les sept derniers jours</span></header><div class="corps">'
      +'<div class="conv">'
        +'<div class="conv-n">'+ech(tx.texte)+'</div>'
        +'<div class="conv-a">'+ech(tx.aide)+'</div>'
      +'</div>'
      +'<p class="conv-p">Sous '+SEUIL_FIABLE+' appels, un taux ne prédit rien : deux intéressés '
      +'sur cinq font 40 %, et ce chiffre ne tiendra pas. Il devient solide vers '+SEUIL_SOLIDE+' appels, '
      +'soit environ trois jours à '+nb(o.appels)+' par jour. Le repère du métier est de 8 intéressés '
      +'pour 100 appels.</p>'
      +'</div></div>';

    /* La table de l'équipe : des faits, sans rang ni médaille. */
    var par={};
    if(perf&&perf.length){
      perf.forEach(function(x){ par[x.owner_email||'inconnu']=
        {jour:+x.jour||0,sem:+x.sem||0,tot:+x.tot||0,
         interesse:+x.interesse||0,joint:+x.joint||0}; });
    }else{
      /* oq_perf pas encore posee : on retombe sur mes seuls appels. */
      app.forEach(function(a){
        var k=a.owner_email||'inconnu';
        par[k]=par[k]||{jour:0,sem:0,tot:0,interesse:0,joint:0};
        par[k].tot++;
        if(a.created_at>=t0)par[k].jour++;
        if(a.created_at>=sem)par[k].sem++;
        if(a.resultat==='interesse')par[k].interesse++;
        if(a.resultat!=='absent'&&a.resultat!=='faux_numero')par[k].joint++;
      });
    }
    var obj={}; equipe.forEach(function(g){ obj[g.email]=g.objectif_appels||40; });
    var noms=Object.keys(par).sort();
    h+='<div class="panneau"><header><h2>L’équipe</h2>'
      +'<span class="aide">des faits, pas un classement</span></header>'
      +'<div class="tbl-scroll"><table><thead><tr><th>Commercial</th><th class="n">Aujourd’hui</th>'
      +'<th class="n">Objectif</th><th class="n">7 jours</th><th class="n">Total</th>'
      +'<th class="n">Joints</th><th class="n">Intéressés</th><th class="n">Taux</th></tr></thead><tbody>'
      +noms.map(function(k){
        var d=par[k], ob=obj[k]||40, ta=tauxOuAttente(d.interesse,d.tot);
        return '<tr><td>'+ech(k===moi?k+' (vous)':k)+'</td>'
          +'<td class="n">'+nb(d.jour)+'</td>'
          +'<td class="n">'+(d.jour>=ob?etat(nb(ob),'ok'):nb(ob))+'</td>'
          +'<td class="n">'+nb(d.sem)+'</td><td class="n">'+nb(d.tot)+'</td>'
          +'<td class="n">'+nb(d.joint)+'</td><td class="n">'+nb(d.interesse)+'</td>'
          +'<td class="n">'+ech(ta.texte)+'</td></tr>';
      }).join('')+'</tbody></table></div></div>';

    $('#vue').innerHTML=h;
  }catch(e){ $('#vue').innerHTML='<div class="erreur">'+ech(e.message)+'</div>'; }
};

/* ── Campagnes ─────────────────────────────────────────────────────
   C'est ici que se decide QUI la machine va demarcher. Elle interroge
   le registre officiel des entreprises : on lui donne un metier, une
   zone, une taille, et elle pioche, trouve les contacts et enchaine.

   Les quatre reglages ne sont pas decoratifs, ce sont exactement les
   parametres envoyes au registre a chaque passage. */

var TAILLES=[
  ['02,03','Très petites, 3 à 9 salariés'],
  ['11,12','Petites, 10 à 49 salariés'],
  ['21,22,31','Moyennes, 50 à 249 salariés'],
  ['32,41,42','Grandes, 250 salariés et plus'],
  ['02,03,11,12,21,22,31,32,41,42','Toutes tailles, à partir de 3 salariés']
];

function formulaireCampagne(c,gens,apres){
  formulaire(c?('Campagne « '+c.nom+' »'):'Nouvelle campagne',[
    {id:'nom',nom:'Nom de la campagne',requis:true,large:true,valeur:c&&c.nom,
     aide:'Ex. Charpentiers Drôme Ardèche'},
    {id:'owner_email',nom:'Commercial',type:'select',valeur:c&&c.owner_email,
     options:gens.map(function(g){return [g,g];})},
    {id:'secteur',nom:'Métier recherché',valeur:c&&c.secteur,
     aide:'charpentier, garage, cabinet comptable…'},
    {id:'departements',nom:'Départements',valeur:c&&c.departements,
     aide:'26,07,84 — vide = France entière'},
    {id:'effectif',nom:'Taille des entreprises',type:'select',valeur:c&&c.effectif,
     options:TAILLES},
    {id:'ca_min',nom:'Chiffre d’affaires minimum',type:'number',valeur:c&&c.ca_min,
     aide:'en euros, laissez vide pour ne pas filtrer'},
    {id:'naf',nom:'Code NAF précis',valeur:c&&c.naf,
     aide:'facultatif, remplace le métier recherché'}
  ],async function(v){
    v.statut=(c&&c.statut)||'active';
    if(!c){ v.epuisee=false; v.page_courante=1; v.dep_index=0; }
    if(c){ await modifier('oq_campagnes','id=eq.'+c.id,v); await tracer('campagne.modifiee',v.nom,c.id); }
    else { var n=await ecrire('oq_campagnes',v); await tracer('campagne.creee',v.nom,n[0]&&n[0].id); }
    apres();
  });
}

VUES.prospection=async function(){
  var gens=[];
  try{
    var eq=await lire('oq_equipe','select=email&order=email');
    gens=eq.map(function(x){return x.email;});
  }catch(e){}
  if(!gens.length)gens=[moi||'moi@oniq.online'];

  bouton('+ Campagne',function(){ formulaireCampagne(null,gens,VUES.prospection); });

  try{
    var r=await Promise.all([
      compter('oq_prospects'), compter('oq_prospects','statut=neq.nouveau'),
      compter('oq_messages','sens=eq.out'), compter('oq_messages','sens=eq.in&auto=is.false'),
      compter('oq_desinscrits'),
      lire('oq_campagnes','select=*&order=cree_le.desc')
        .catch(function(){return lire('oq_campagnes','select=*');})
    ]);
    var tx=r[1]?Math.round(1000*r[3]/r[1])/10:0;
    var camps=r[5];

    var h='<div class="kpis">'
      +kpi('Prospects',nb(r[0]),'','entreprises en base')
      +kpi('Contactés',nb(r[1]),'','au moins un message parti')
      +kpi('Messages envoyés',nb(r[2]),'','tous canaux confondus')
      +kpi('Réponses réelles',nb(r[3]),r[3]?'vert':'',tx+' % des contactés')
      +kpi('Désinscrits',nb(r[4]),'','ne seront jamais recontactés')
      +'</div>';

    h+='<div class="panneau"><header><h2>Qui la machine démarche</h2>'
      +'<span class="aide">le moteur pioche au registre officiel toutes les cinq minutes</span>'
      +'</header><div class="corps">';

    if(!camps.length){
      h+=vide('Aucune campagne',
        'Créez-en une : donnez un métier, des départements et une taille d’entreprise. La machine se charge du reste, elle trouve les contacts et enchaîne toute seule.');
    }else{
      h+=camps.map(function(c){
        var taille=(TAILLES.filter(function(t){return t[0]===c.effectif;})[0]||[])[1]
          ||(c.effectif?'sélection personnalisée':'toutes tailles');
        var cible=[
          c.naf?('NAF '+c.naf):(c.secteur||'tous métiers'),
          c.departements?('dép. '+c.departements):'France entière',
          taille,
          c.ca_min?('CA ≥ '+euro(c.ca_min)):null
        ].filter(Boolean);
        return '<div class="camp'+(c.statut==='active'?' vive':'')+'">'
          +'<div class="camp-tete">'
            +'<div><b>'+ech(c.nom||'Sans nom')+'</b>'
              +'<div class="camp-qui">'+ech(c.owner_email||'—')+'</div></div>'
            +etat(c.epuisee?'épuisée':(c.statut==='active'?'active':'en pause'),
                  c.epuisee?'ret':(c.statut==='active'?'ok':'neu'))
          +'</div>'
          +'<div class="camp-cible">'+cible.map(function(x){
              return '<span>'+ech(x)+'</span>';}).join('')+'</div>'
          +'<div class="camp-actes">'
            +'<button class="btn" data-mod="'+c.id+'">Modifier la cible</button>'
            +'<button class="btn" data-bascule="'+c.id+'" data-vers="'
              +(c.statut==='active'?'pause':'active')+'">'
              +(c.statut==='active'?'Mettre en pause':'Activer')+'</button>'
            +(c.epuisee?'<button class="btn" data-relance="'+c.id+'">Repartir du début</button>':'')
          +'</div></div>';
      }).join('');
    }
    h+='</div></div>';
    $('#vue').innerHTML=h;

    $$('[data-mod]').forEach(function(b){
      b.onclick=function(){
        var c=camps.filter(function(x){return x.id===b.dataset.mod;})[0];
        formulaireCampagne(c,gens,VUES.prospection);
      };
    });
    $$('[data-bascule]').forEach(function(b){
      b.onclick=async function(){
        b.disabled=true;
        await modifier('oq_campagnes','id=eq.'+b.dataset.bascule,{statut:b.dataset.vers});
        await tracer('campagne.'+b.dataset.vers,'');
        VUES.prospection();
      };
    });
    /* Une campagne « epuisee » a fait le tour de sa zone. La relancer la
       fait repartir au premier departement : utile quand de nouvelles
       entreprises ont ete immatriculees depuis. */
    $$('[data-relance]').forEach(function(b){
      b.onclick=async function(){
        b.disabled=true;
        await modifier('oq_campagnes','id=eq.'+b.dataset.relance,
          {epuisee:false,page_courante:1,dep_index:0});
        await tracer('campagne.relancee','');
        VUES.prospection();
      };
    });
  }catch(e){ $('#vue').innerHTML='<div class="erreur">'+ech(e.message)+'</div>'; }
};

/* ── Demandes reçues ───────────────────────────────────────────────
   Une demande de maquette n'est pas une ligne de tableau : c'est un
   dossier commercial. On montre donc tout ce que le visiteur a pris la
   peine d'écrire, et l'action qui suit est à un clic. */
var filtreDemandes='nouveau';   /* 'nouveau' ou 'tout' */
VUES.demandes=async function(){
  try{
    var d=await lire('demandes_surmesure','select=*&order=created_at.desc&limit=200');
    var neuves=d.filter(function(x){return (x.statut||'nouveau')==='nouveau';}).length;
    var h='<div class="kpis">'
      +kpi('Demandes reçues',nb(d.length),'','depuis le formulaire du site')
      +kpi('À traiter',nb(neuves),neuves?'ambre':'','sans réponse de notre part')
      +kpi('Ce mois-ci',nb(d.filter(function(x){
          var t=new Date(x.created_at||0), n=new Date();
          return t.getMonth()===n.getMonth()&&t.getFullYear()===n.getFullYear();}).length),'','arrivées ce mois')
      +'</div>';

    var vues=(filtreDemandes==='nouveau')
      ? d.filter(function(x){return (x.statut||'nouveau')==='nouveau';}) : d;

    h+='<div class="segment">'
      +'<button data-filtre="nouveau" class="'+(filtreDemandes==='nouveau'?'actif':'')+'">'
        +'À traiter'+(neuves?' <i>'+nb(neuves)+'</i>':'')+'</button>'
      +'<button data-filtre="tout" class="'+(filtreDemandes==='tout'?'actif':'')+'">'
        +'Toutes <i>'+nb(d.length)+'</i></button>'
      +'</div>';

    if(!vues.length){
      h+='<div class="panneau">'+vide(
        d.length?'Tout est traité':'Aucune demande pour le moment',
        d.length?'Aucune demande n’attend de réponse. Basculez sur « Toutes » pour relire les précédentes.'
        :'Le formulaire de la vitrine écrit directement ici. Vérifiez que la page est bien en ligne, puis faites un essai vous-même : la demande doit apparaître dans la minute.')+'</div>';
      $('#vue').innerHTML=h; brancherFiltre(); return;
    }

    h+=vues.map(function(x,i){
      var etat_=(x.statut||'nouveau');
      var lignes=[
        ['Métier',x.sector],['Utilisateurs',x.team_size],['Échéance',x.timeline],
        ['Budget annoncé',x.dev_budget],['Abonnement',x.monthly_budget]
      ].filter(function(l){return l[1];});
      return '<div class="panneau dossier-d"><header>'
        +'<h2>'+ech(x.company||'Sans nom')+'</h2>'
        +'<span class="aide mono">'+date(x.created_at)+' · '+depuis(x.created_at)+'</span>'
        +'</header><div class="corps">'
        +'<div class="tete-d">'
          +'<div><b>'+ech(x.contact||'—')+'</b>'
          +(x.email?' · <a href="mailto:'+ech(x.email)+'">'+ech(x.email)+'</a>':'')+'</div>'
          +'<div>'+etat(etat_,etat_==='nouveau'?'att':'ok')+'</div>'
        +'</div>'
        +(lignes.length?('<div class="faits">'+lignes.map(function(l){
            return '<div><span>'+ech(l[0])+'</span><b>'+ech(l[1])+'</b></div>';}).join('')+'</div>'):'')
        +'<pre class="besoin-d">'+ech(x.need||x.besoin||x.message||'')+'</pre>'
        +'<div class="actes">'
          +(x.email?'<a class="btn fort" href="mailto:'+ech(x.email)+'?subject='
            +encodeURIComponent('Votre maquette ONIQ')+'">Répondre</a>':'')
          +(etat_==='nouveau'?'<button class="btn" data-traite="'+ech(x.id)+'">Marquer traitée</button>':'')
        +'</div></div></div>';
    }).join('');

    $('#vue').innerHTML=h;
    brancherFiltre();
    $$('[data-traite]').forEach(function(b){
      b.onclick=async function(){
        b.disabled=true;
        await modifier('demandes_surmesure','id=eq.'+b.dataset.traite,{statut:'traitee'});
        await tracer('demande.traitee','');
        VUES.demandes();
      };
    });
  }catch(e){ $('#vue').innerHTML='<div class="erreur">'+ech(e.message)+'</div>'; }
};

/* ══ Fenêtre de saisie générique ═════════════════════════════════════
   Un seul composant pour toutes les créations : moins de code, et
   surtout un comportement identique partout. */
function formulaire(titre,champs,onValide){
  var f=document.createElement('div');
  f.className='fond-modale';
  f.innerHTML='<div class="modale" role="dialog" aria-modal="true"><header><h3>'+ech(titre)+'</h3>'
    +'<button class="fermer" aria-label="Fermer">×</button></header><div class="corps">'
    +'<div id="err-modale"></div><div class="grille2">'
    +champs.map(function(c){
      var large=c.large?' style="grid-column:1/-1"':'';
      var ctrl;
      if(c.type==='select')
        ctrl='<select id="c-'+c.id+'">'+c.options.map(function(o){
          var pris=(c.valeur!=null&&String(c.valeur)===String(o[0]))?' selected':'';
          return '<option value="'+ech(o[0])+'"'+pris+'>'+ech(o[1])+'</option>';}).join('')+'</select>';
      else if(c.type==='textarea')
        ctrl='<textarea id="c-'+c.id+'" rows="3"'+(c.aide?' placeholder="'+ech(c.aide)+'"':'')+'>'
          +ech(c.valeur==null?'':c.valeur)+'</textarea>';
      else ctrl='<input id="c-'+c.id+'" type="'+(c.type||'text')+'"'
        +(c.valeur!=null?' value="'+ech(c.valeur)+'"':'')
        +(c.aide?' placeholder="'+ech(c.aide)+'"':'')+'>';
      return '<div class="champ"'+large+'><label for="c-'+c.id+'">'+ech(c.nom)+'</label>'+ctrl+'</div>';
    }).join('')
    +'</div></div><footer><button class="btn" data-annuler>Annuler</button>'
    +'<button class="btn fort" data-ok>Enregistrer</button></footer></div>';
  document.body.appendChild(f);
  var partir=function(){f.remove();};
  f.querySelector('.fermer').onclick=partir;
  f.querySelector('[data-annuler]').onclick=partir;
  f.addEventListener('click',function(e){if(e.target===f)partir();});
  document.addEventListener('keydown',function esc(e){
    if(e.key==='Escape'){partir();document.removeEventListener('keydown',esc);}});
  var ok=f.querySelector('[data-ok]');
  ok.onclick=async function(){
    var v={};
    champs.forEach(function(c){
      var el=f.querySelector('#c-'+c.id);
      var val=el.value.trim();
      v[c.id]=(c.type==='number')?(val===''?null:parseFloat(val)):(val===''?null:val);
    });
    var manque=champs.filter(function(c){return c.requis&&!v[c.id];});
    if(manque.length){
      f.querySelector('#err-modale').innerHTML='<div class="erreur">Champ obligatoire : '
        +ech(manque[0].nom)+'</div>';
      return;
    }
    ok.disabled=true; ok.textContent='Enregistrement…';
    try{ await onValide(v); partir(); }
    catch(err){
      f.querySelector('#err-modale').innerHTML='<div class="erreur">'+ech(String(err.message||err).slice(0,220))+'</div>';
      ok.disabled=false; ok.textContent='Enregistrer';
    }
  };
  setTimeout(function(){var p=f.querySelector('input,select,textarea'); if(p)p.focus();},40);
}
function bouton(libelle,action){
  var b=document.createElement('button');
  b.className='btn fort'; b.textContent=libelle; b.onclick=action;
  $('#outils').appendChild(b);
}

/* La sauvegarde : toutes les tables, paginees par mille, dans un seul
   fichier JSON date. Ce que la lecture refuse (droits) est note tel quel. */
async function sauvegarde(){
  bravo('Sauvegarde en cours, quelques secondes…');
  var tables=['oq_clients','oq_projets','oq_devis','oq_devis_lignes','oq_factures',
    'oq_abonnements','oq_prospects','oq_appels','oq_campagnes','oq_messages',

    'demandes_surmesure','oq_activite'];
  var tout={faite_le:new Date().toISOString(),par:moi||''};
  for(var k=0;k<tables.length;k++){
    var tb=tables[k], lignes=[], page=0;
    try{
      while(page<20){
        var l=await lire(tb,'select=*&limit=1000&offset='+(page*1000));
        lignes=lignes.concat(l); page++;
        if(l.length<1000)break;
      }
      tout[tb]=lignes;
    }catch(err){ tout[tb]='inaccessible : '+String(err.message||err).slice(0,120); }
  }
  var b=new Blob([JSON.stringify(tout)],{type:'application/json'});
  var a=document.createElement('a');

  a.download='oniq-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
  bravo('Sauvegarde téléchargée : '+a.download);
}


/* ══ Ressources de marque ════════════════════════════════════════════
   Tout est fabriqué ici, dans la page. Aucun fichier à héberger, aucun
   dossier à retrouver dans six mois : les images sont dessinées à la
   demande et téléchargées au clic, toujours identiques. */

/* La marque, un seul jeu de valeurs dont tout le reste découle. */
var MARQUE={
  nom:'ONIQ',
  bapteme:'Logiciels et applications sur mesure',
  ancre:'#0B0E13', encre:'#EAEDF2', signal:'#7FA8FF', signalClair:'#2B5FD9',
  papier:'#FAFAFB', gris:'#8B94A5', signalR:'127,168,255',
  titre:'"Instrument Sans", system-ui, sans-serif'
};

/* ── Le symbole ──────────────────────────────────────────────────────
   ONIQ se termine par un Q, et un Q est un O qui déborde. Le symbole
   est donc cette lettre-là : un anneau à graisse modulée, plus fin en
   haut qu'en bas comme dans une vraie typographie, ouvert en bas à
   droite par une entaille nette, que traverse une queue effilée.
   L'anneau dit la rigueur, la queue dit que l'on sort du cadre.

   Un seul jeu de tracés sert partout : le SVG les pose tels quels, le
   canevas les rejoue avec Path2D. L'image téléchargée et l'image à
   l'écran ne peuvent donc jamais diverger. */
var TRACE={
  /* Anneau : cercle extérieur, cercle intérieur remonté de huit
     unités. La graisse est donc plus fine en haut qu'en bas, comme
     dans une lettre dessinée. Rempli en règle pair-impair, le second
     tracé creuse le premier. */
  anneau:'M80,256 A176,176 0 1,0 432,256 A176,176 0 1,0 80,256 Z'
        +'M137,248 A119,119 0 1,0 375,248 A119,119 0 1,0 137,248 Z',
  queue:'M366,315.6 C416,338 456,392 474,458 C424,424 376,396 315.6,366 Z'
};

function symboleSVG(fond,trait,accent,taille,cle){
  var t=taille||512, id=cle||('g'+Math.round(t*97));
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="'+t+'" height="'+t+'">'
    +'<defs>'
    +'<linearGradient id="a'+id+'" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="'+trait+'"/>'
      +'<stop offset="1" stop-color="'+trait+'" stop-opacity=".72"/></linearGradient>'
    +'<linearGradient id="q'+id+'" x1="0" y1="0" x2="1" y2="1">'
      +'<stop offset="0" stop-color="'+accent+'" stop-opacity=".55"/>'
      +'<stop offset="1" stop-color="'+accent+'"/></linearGradient>'
    +'</defs>'
    +(fond?'<rect width="512" height="512" rx="116" fill="'+fond+'"/>':'')
    +'<path d="'+TRACE.anneau+'" fill="url(#a'+id+')" fill-rule="evenodd"/>'
    +'<path d="'+TRACE.queue+'" fill="url(#q'+id+')"/>'
    +'</svg>';
}
/* Silhouette pleine : sert de masque aux effets, jamais d'export. */
function symboleMasque(part){
  var d='';
  if(part!=='queue') d+='<path d="'+TRACE.anneau+'" fill="#000" fill-rule="evenodd"/>';
  if(part!=='anneau') d+='<path d="'+TRACE.queue+'" fill="#000"/>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">'+d+'</svg>');
}
/* ── Le logotype ─────────────────────────────────────────────────────
   Les quatre lettres sont dessinées, aucune n'est composée. Toutes
   partagent la même boîte : hauteur de capitale de 80 à 432, graisse
   de 57 unités pour les fûts, anneau modulé de 49 en haut à 65 en bas.
   Le mot ne dépend donc d'aucune police : il s'affiche à l'identique
   partout, y compris ouvert dans un logiciel de dessin ou chez un
   imprimeur qui n'a pas Instrument Sans. */
var LETTRES={
  O:{d:TRACE.anneau, avance:352},
  /* Le N : deux fûts et une diagonale de même graisse, les arêtes de
     la diagonale décalées de 96 unités en hauteur pour retrouver 57
     mesurés perpendiculairement. */
  N:{d:'M80,80 H137 L323,336 V80 H380 V432 H323 L137,176 V432 H80 Z', avance:300},
  I:{d:'M80,80 H137 V432 H80 Z', avance:57},
  Q:{d:TRACE.anneau, q:TRACE.queue, avance:352}
};
var CHASSE=100;                  /* l'approche entre deux lettres */
var LARGEUR_MOT=352+CHASSE+300+CHASSE+57+CHASSE+352;   /* 1361 unités */

function motSVG(gauche,ligneBase,cap,encre,accent){
  var s=cap/352, x=gauche, out='';
  'ONIQ'.split('').forEach(function(c){
    var L=LETTRES[c];
    out+='<g transform="translate('+(x-80*s).toFixed(2)+','+(ligneBase-432*s).toFixed(2)+') '
      +'scale('+s.toFixed(5)+')"><path d="'+L.d+'" fill="'+encre+'" fill-rule="evenodd"/>'
      +(L.q?'<path d="'+L.q+'" fill="'+accent+'"/>':'')+'</g>';
    x+=(L.avance+CHASSE)*s;
  });
  return out;
}
function largeurMot(cap){ return LARGEUR_MOT*cap/352; }

function logoSVG(fond,encre,accent){
  var cap=58;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">'
    +(fond?'<rect width="600" height="200" fill="'+fond+'"/>':'')
    +motSVG(40,110,cap,encre,accent)
    +'<text x="42" y="162" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="19" '
    +'letter-spacing="1.3" fill="'+MARQUE.gris+'">Logiciels et applications sur mesure</text>'
    +'</svg>';
}
/* Le mot seul, cadré au plus juste : c'est cette version qui part dans
   les en-têtes de site et les signatures. */
function motSVGSeul(encre,accent){
  var cap=352, l=largeurMot(cap)+42;   /* la queue du Q deborde de sa chasse */
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 76 '+Math.round(l)+' 386" '
    +'width="'+Math.round(l)+'" height="386">'+motSVG(80,432,cap,encre,accent)+'</svg>';
}

/* Dessin des images matricielles. Le texte passe par le canevas et non
   par le SVG : la police y est celle réellement chargée, donc le rendu
   est identique à celui du site. */
function peindre(l,h,fn){
  var c=document.createElement('canvas');
  var d=Math.min(2,window.devicePixelRatio||1);
  c.width=l*d; c.height=h*d;
  var x=c.getContext('2d'); x.scale(d,d);
  fn(x,l,h);
  return c;
}
function fondSombre(x,l,h){
  var f=x.createLinearGradient(0,0,l,h);
  f.addColorStop(0,'#0E1218'); f.addColorStop(.55,MARQUE.ancre); f.addColorStop(1,'#080A0E');
  x.fillStyle=f; x.fillRect(0,0,l,h);
  x.strokeStyle='rgba(255,255,255,.035)'; x.lineWidth=1;
  for(var i=32;i<l;i+=32){ x.beginPath(); x.moveTo(i+.5,0); x.lineTo(i+.5,h); x.stroke(); }
  /* Une lueur froide dans l'angle, comme sur la vitrine. */
  var lu=x.createRadialGradient(l*.82,0,0,l*.82,0,h*1.5);
  lu.addColorStop(0,'rgba('+MARQUE.signalR+',.13)'); lu.addColorStop(1,'rgba('+MARQUE.signalR+',0)');
  x.fillStyle=lu; x.fillRect(0,0,l,h);
}
/* Le symbole au canevas, exactement les mêmes tracés qu'en SVG. */
function symboleCanevas(x,cx,cy,r,trait,accent){
  var e=r/176;                       /* r = rayon extérieur voulu */
  x.save(); x.translate(cx-256*e,cy-256*e); x.scale(e,e);
  var ga=x.createLinearGradient(0,80,0,432);
  ga.addColorStop(0,trait); ga.addColorStop(1,teinter(trait,.72));
  x.fillStyle=ga; x.fill(new Path2D(TRACE.anneau),'evenodd');
  var gq=x.createLinearGradient(340,322,474,458);
  gq.addColorStop(0,teinter(accent,.55)); gq.addColorStop(1,accent);
  x.fillStyle=gq; x.fill(new Path2D(TRACE.queue));
  x.restore();
}
function teinter(hex,opacite){
  var n=parseInt(hex.slice(1),16);
  return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+opacite+')';
}
/* Le meme logotype au canevas : memes traces, meme boite, donc le PNG
   telecharge et le SVG sont superposables au pixel pres. */
function motCanevas(x,px,ligneBase,taille,encre,accent,centre){
  var cap=taille*0.72, s=cap/352;
  var largeur=largeurMot(cap);
  var d=centre?px-largeur/2:px;
  'ONIQ'.split('').forEach(function(c){
    var L=LETTRES[c];
    x.save(); x.translate(d-80*s,ligneBase-432*s); x.scale(s,s);
    var ga=x.createLinearGradient(0,80,0,432);
    ga.addColorStop(0,encre); ga.addColorStop(1,teinter(encre,.86));
    x.fillStyle=ga; x.fill(new Path2D(L.d),'evenodd');
    if(L.q){
      var gq=x.createLinearGradient(340,322,474,458);
      gq.addColorStop(0,teinter(accent,.72)); gq.addColorStop(1,accent);
      x.fillStyle=gq; x.fill(new Path2D(L.q));
    }
    x.restore();
    d+=(L.avance+CHASSE)*s;
  });
  return largeur;
}

var IMAGES={

/* ── Le cadre d'email ────────────────────────────────────────────────
