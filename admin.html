<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONIQ, administration</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script>/* L'habillage choisi est applique avant le rendu : sans cela l'ecran
   clignote une fraction de seconde dans l'autre habillage. */
(function(){try{var t=localStorage.getItem("oq-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>

  /* ══════════════════════════════════════════════════════════════════
     ONIQ, administration.
     Meme langage que la vitrine : fond bleu-noir, filets d'un pixel,
     monochrome sauf pour le sens (vert = encaisse, ambre = attente,
     rouge = retard). Un outil de pilotage se lit d'un coup d'oeil, il
     ne se contemple pas : la couleur y porte une information, jamais
     une decoration.
     Aucune bibliotheque : l'authentification et les donnees passent par
     l'API REST en fetch direct.
     ══════════════════════════════════════════════════════════════════ */
  :root{
    --fond:#08090C; --surface:#0E1116; --surface-2:#141922; --survol:#171D26;
    --filet:#1B212B; --filet-fort:#2A3341;
    --texte:#EAEDF2; --attenue:#8B94A5; --faible:#59616F;
    --signal:#7FA8FF; --signal-r:127,168,255;
    --ok:#5FD3A6; --ok-r:95,211,166;
    --attente:#E0B15C; --retard:#E8796B;
    --rail:238px;
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --fond:#F7F8FA; --surface:#FFFFFF; --surface-2:#F1F3F6; --survol:#EDF0F4;
      --filet:#E3E7ED; --filet-fort:#CFD5DE;
      --texte:#0B0E13; --attenue:#586274; --faible:#8B94A5;
      --signal:#2B5FD9; --signal-r:43,95,217;
      --ok:#17805C; --ok-r:23,128,92;
      --attente:#96701C; --retard:#B5443A;
    }
  }
  :root[data-theme="light"]{
    --fond:#F7F8FA; --surface:#FFFFFF; --surface-2:#F1F3F6; --survol:#EDF0F4;
    --filet:#E3E7ED; --filet-fort:#CFD5DE;
    --texte:#0B0E13; --attenue:#586274; --faible:#8B94A5;
    --signal:#2B5FD9; --signal-r:43,95,217;
    --ok:#17805C; --ok-r:23,128,92;
    --attente:#96701C; --retard:#B5443A;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--fond);color:var(--texte);
    font:400 15px/1.55 "Instrument Sans",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;letter-spacing:-.004em}
  .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--signal);text-decoration:none}

  /* ── Connexion ─────────────────────────────────────────────────── */
  .porte{min-height:100vh;display:grid;place-items:center;padding:24px}
  .porte form{width:min(380px,100%);background:var(--surface);border:1px solid var(--filet);
    border-radius:14px;padding:32px}
  .porte h1{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
  .porte p{color:var(--attenue);font-size:13.5px;margin:0 0 24px}
  .champ{margin-bottom:14px}
  .champ label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faible);margin-bottom:6px}
  .champ input,.champ select,.champ textarea{width:100%;background:var(--surface-2);
    border:1px solid var(--filet);border-radius:8px;padding:10px 12px;font-size:14px}
  .champ input:focus,.champ select:focus,.champ textarea:focus{outline:none;border-color:var(--signal)}
  .plein{width:100%;background:var(--texte);color:var(--fond);border:none;border-radius:8px;
    padding:12px;font-weight:600;font-size:14.5px;cursor:pointer;transition:opacity .15s}
  .plein:hover{opacity:.88}
  .plein:disabled{opacity:.45;cursor:default}
  .erreur{background:rgba(232,121,107,.1);border:1px solid rgba(232,121,107,.35);
    color:var(--retard);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}

  /* ── Charpente ─────────────────────────────────────────────────── */
  .app{display:none;min-height:100vh}
  .app.ouvert{display:grid;grid-template-columns:var(--rail) minmax(0,1fr)}
  /* ══ Le rail ═══════════════════════════════════════════════════════
     Onze entrees, quatre familles, une seule colonne. Ce qui les rend
     lisibles n'est pas la separation mais le repere : une icone par
     entree, un liseré et une teinte pour celle qui est ouverte. */
  .rail{border-right:1px solid var(--filet);position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;overflow-y:auto;
    background:linear-gradient(180deg,var(--surface),var(--fond) 62%)}
  .rail::-webkit-scrollbar{width:6px}
  .rail::-webkit-scrollbar-thumb{background:var(--filet-fort);border-radius:3px}

  .marque{padding:22px 20px 18px;display:flex;align-items:center;justify-content:space-between;
    gap:12px;border-bottom:1px solid var(--filet)}
  .marque .mot{height:19px;width:auto;color:var(--texte);display:block}
  .marque .mot .q{fill:var(--signal)}
  .etat-moteur{display:inline-flex;align-items:center;gap:6px;flex:none;
    font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--faible);
    border:1px solid var(--filet);border-radius:20px;padding:3px 8px}
  .pastille{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none;
    box-shadow:0 0 0 0 rgba(var(--ok-r),.6);animation:respire 2.6s ease-out infinite}
  @keyframes respire{
    0%{box-shadow:0 0 0 0 rgba(var(--ok-r),.5)}
    70%{box-shadow:0 0 0 7px rgba(var(--ok-r),0)}
    100%{box-shadow:0 0 0 0 rgba(var(--ok-r),0)}
  }

  .menu{padding:8px 12px 18px;flex:1}
  .groupe{display:flex;align-items:center;gap:9px;margin-top:16px;padding:14px 8px 8px;
    font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--faible)}
  .groupe:first-child{margin-top:0}
  .groupe:after{content:"";flex:1;height:1px;
    background:linear-gradient(90deg,var(--filet),transparent)}

  .menu a{position:relative;display:flex;align-items:center;gap:12px;padding:9px 11px;
    border-radius:10px;color:var(--attenue);font-size:14px;border:1px solid transparent;
    transition:background .16s,color .16s,border-color .16s}
  .menu a .ico{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;
    stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.62;
    transition:opacity .16s,color .16s,transform .3s cubic-bezier(.22,1,.36,1)}
  .menu a .lib{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .menu a:hover{background:var(--survol);color:var(--texte)}
  .menu a:hover .ico{opacity:1;transform:scale(1.08)}

  /* L'ecran ouvert : fond teinte, liseré a gauche, icone au signal. */
  .menu a.actif{color:var(--texte);font-weight:500;
    border-color:rgba(var(--signal-r),.22);
    background:linear-gradient(90deg,rgba(var(--signal-r),.16),rgba(var(--signal-r),.04))}
  .menu a.actif:before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;
    border-radius:0 3px 3px 0;background:var(--signal);
    box-shadow:0 0 12px rgba(var(--signal-r),.65)}
  .menu a.actif .ico{opacity:1;color:var(--signal)}

  .menu a .badge{flex:none;font-size:11px;font-variant-numeric:tabular-nums;
    background:rgba(var(--signal-r),.16);border:1px solid rgba(var(--signal-r),.32);
    border-radius:20px;padding:1px 8px;color:var(--signal)}
  .menu a .badge:empty{display:none}

  .pied{padding:14px 14px 16px;border-top:1px solid var(--filet);font-size:12.5px;
    color:var(--faible);display:flex;flex-direction:column;gap:9px}
  .carte-moi{display:flex;align-items:center;gap:10px;min-width:0;
    background:var(--surface-2);border:1px solid var(--filet);border-radius:11px;padding:9px 11px}
  .carte-moi .rond{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;
    font-size:12px;font-weight:600;color:var(--fond);background:var(--signal)}
  .carte-moi span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--attenue);font-size:12.5px}
  .pied button{width:100%;cursor:pointer;font:inherit;font-size:12.5px;text-align:left;
    color:var(--attenue);background:transparent;border:1px solid var(--filet);
    border-radius:9px;padding:8px 11px;transition:color .2s,border-color .2s}
  .pied button:hover{color:var(--texte);border-color:var(--filet-fort)}
  .habit{display:flex;align-items:center;gap:9px}
  .habit svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round}
  .habit .i-lune{fill:currentColor;stroke:none;display:none}
  :root[data-theme="light"] .habit .i-lune{display:block}
  :root[data-theme="light"] .habit .i-soleil{display:none}
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]) .habit .i-lune{display:block}
    :root:not([data-theme="dark"]) .habit .i-soleil{display:none}
  }
  .barre{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--fond) 84%,transparent);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--filet);
    padding:0 28px;height:62px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .barre h1{font-size:17px;font-weight:600;letter-spacing:-.02em;margin:0}
  .barre .sous{font-size:12.5px;color:var(--faible);margin-top:1px}
  .outils{display:flex;gap:8px;align-items:center}
  .btn{background:var(--surface);border:1px solid var(--filet);border-radius:8px;
    padding:8px 14px;font-size:13.5px;cursor:pointer;transition:border-color .15s,background .15s}
  .btn:hover{border-color:var(--filet-fort);background:var(--survol)}
  .btn.fort{background:var(--texte);color:var(--fond);border-color:var(--texte);font-weight:600}
  .btn.fort:hover{opacity:.88}
  .vue{padding:28px}

  /* ── Blocs ─────────────────────────────────────────────────────── */
  /* ── Le direct ─────────────────────────────────────────────────────
     Le seul endroit de l'ecran ou quelque chose bouge tout seul. Il est
     donc pose en haut, et il est le seul a porter la couleur du signal. */
  .panneau.vif{border-color:rgba(var(--signal-r),.28);
    background:linear-gradient(140deg,rgba(var(--signal-r),.07),transparent 62%),var(--surface)}
  .panneau.vif h2{display:flex;align-items:center;gap:10px}
  .battement{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;
    box-shadow:0 0 0 0 rgba(var(--ok-r),.6);animation:pulse-d 2.4s ease-out infinite}
  @keyframes pulse-d{
    0%{box-shadow:0 0 0 0 rgba(var(--ok-r),.55)}
    70%{box-shadow:0 0 0 10px rgba(var(--ok-r),0)}
    100%{box-shadow:0 0 0 0 rgba(var(--ok-r),0)}
  }
  .direct-grille{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;
    padding-bottom:22px;border-bottom:1px solid var(--filet);margin-bottom:20px}
  .gros-chiffre .n{font-size:clamp(44px,6vw,68px);font-weight:600;letter-spacing:-.04em;
    line-height:1;font-variant-numeric:tabular-nums}
  .gros-chiffre .l{color:var(--attenue);font-size:13.5px;margin-top:6px}
  .barres{position:relative;display:flex;align-items:flex-end;gap:5px;height:74px;padding-bottom:18px}
  .barres i{flex:1;border-radius:4px 4px 2px 2px;min-height:6px;
    background:linear-gradient(180deg,rgba(var(--signal-r),.85),rgba(var(--signal-r),.28));
    transition:height .6s cubic-bezier(.22,1,.36,1)}
  .barres .legende{position:absolute;left:0;right:0;bottom:0;display:flex;
    justify-content:space-between;font-family:"JetBrains Mono",monospace;
    font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faible)}
  .faits-d{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .fait-d{border:1px solid var(--filet);border-radius:11px;padding:12px 14px;background:var(--surface-2)}
  .fait-d span{display:block;font-family:"JetBrains Mono",monospace;font-size:9.5px;
    letter-spacing:.13em;text-transform:uppercase;color:var(--faible);margin-bottom:5px}
  .fait-d b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .fait-d.vif{border-color:rgba(var(--signal-r),.35)}
  .fait-d.vif b{color:var(--signal)}
  .pages-d{margin-top:18px}
  .pages-d .lab{display:block;font-family:"JetBrains Mono",monospace;font-size:9.5px;
    letter-spacing:.13em;text-transform:uppercase;color:var(--faible);margin-bottom:9px}
  .pages-d div{display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:7px 0;border-bottom:1px solid var(--filet);font-size:13.5px}
  .pages-d div:last-child{border-bottom:none}
  .pages-d b{font-weight:400;color:var(--attenue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pages-d i{font-style:normal;font-family:"JetBrains Mono",monospace;color:var(--texte);flex:none}
  @media(max-width:720px){ .direct-grille{grid-template-columns:1fr;gap:18px} }
  .kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:26px}
  .kpi{background:var(--surface);border:1px solid var(--filet);border-radius:12px;padding:18px}
  .kpi .lib{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faible)}
  .kpi .val{font-size:29px;font-weight:600;letter-spacing:-.035em;margin-top:8px;
    font-variant-numeric:tabular-nums;line-height:1}
  .kpi .note{font-size:12.5px;color:var(--attenue);margin-top:8px}
  .kpi.vert .val{color:var(--ok)} .kpi.ambre .val{color:var(--attente)}
  .kpi.rouge .val{color:var(--retard)} .kpi.bleu .val{color:var(--signal)}

  .panneau{background:var(--surface);border:1px solid var(--filet);border-radius:12px;margin-bottom:18px}
  .panneau > header{padding:15px 18px;border-bottom:1px solid var(--filet);
    display:flex;align-items:center;justify-content:space-between;gap:12px}
  .panneau > header h2{font-size:14.5px;font-weight:600;margin:0}
  .panneau > header .aide{font-size:12.5px;color:var(--faible)}
  .corps{padding:18px}
  .duo{display:grid;gap:18px}
  .duo>*{min-width:0}
  @media(min-width:1080px){.duo{grid-template-columns:1.5fr 1fr}}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:11px 18px;text-align:left;border-bottom:1px solid var(--filet)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .14s}
  tbody tr:hover{background:var(--survol)}
  th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faible);font-weight:500}
  td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;
    font-family:"JetBrains Mono",monospace;font-size:13px}
  .tbl-scroll{overflow-x:auto}

  .etat{display:inline-block;font-size:10.5px;font-weight:500;letter-spacing:.06em;
    padding:3px 9px;border-radius:20px;border:1px solid;white-space:nowrap;text-transform:uppercase}
  .e-ok{color:var(--ok);border-color:rgba(var(--ok-r),.4);background:rgba(var(--ok-r),.1)}
  .e-att{color:var(--attente);border-color:rgba(224,177,92,.4);background:rgba(224,177,92,.1)}
  .e-ret{color:var(--retard);border-color:rgba(232,121,107,.4);background:rgba(232,121,107,.1)}
  .e-neu{color:var(--attenue);border-color:var(--filet);background:var(--surface-2)}

  .vide{padding:46px 20px;text-align:center;color:var(--faible)}
  .vide .gros{font-size:15px;color:var(--attenue);margin-bottom:6px;font-weight:500}
  .vide .pt{font-size:13px;max-width:44ch;margin:0 auto;line-height:1.6}

  .journal{list-style:none;margin:0;padding:0}
  .journal li{display:flex;gap:12px;padding:11px 18px;border-bottom:1px solid var(--filet);font-size:13.5px}
  .journal li:last-child{border-bottom:none}
  .journal .qd{color:var(--faible);font-size:12px;white-space:nowrap;min-width:82px}
  .journal .qui{color:var(--attenue)}

  /* Une ligne d'ecran : un texte a gauche, une commande a droite. */
  .rangee{display:flex;align-items:center;justify-content:space-between;gap:18px;
    padding:15px 0;border-bottom:1px solid var(--filet)}
  .rangee:last-child{border-bottom:none;padding-bottom:0}
  .rangee > div{min-width:0}
  .rangee b{font-size:14px}
  /* L'interrupteur, lui, reste un interrupteur. */
  .bascule{position:relative;width:38px;height:21px;border-radius:20px;background:var(--filet-fort);
    border:none;cursor:pointer;transition:background .18s;flex:none}
  .bascule:after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;
    border-radius:50%;background:#fff;transition:transform .18s}
  .bascule[aria-pressed="true"]{background:var(--ok)}
  .bascule[aria-pressed="true"]:after{transform:translateX(17px)}

  /* Fenetre de saisie */
  .fond-modale{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);
    display:grid;place-items:center;padding:22px;z-index:50}
  .modale{width:min(560px,100%);max-height:88vh;overflow-y:auto;background:var(--surface);
    border:1px solid var(--filet-fort);border-radius:14px}
  .modale header{padding:17px 20px;border-bottom:1px solid var(--filet);
    display:flex;justify-content:space-between;align-items:center}
  .modale header h3{margin:0;font-size:15.5px;font-weight:600}
  .modale .corps{padding:20px}
  .modale footer{padding:15px 20px;border-top:1px solid var(--filet);display:flex;gap:9px;justify-content:flex-end}
  .fermer{background:none;border:none;color:var(--faible);font-size:19px;cursor:pointer;line-height:1}
  .grille2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
  @media(max-width:560px){.grille2{grid-template-columns:1fr}}

  @media(max-width:900px){
    .app.ouvert{grid-template-columns:1fr}
    .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;
      border-right:none;border-bottom:1px solid var(--filet)}
    .marque{border-bottom:none;border-right:1px solid var(--filet);white-space:nowrap}
    .menu{display:flex;gap:6px;padding:10px;flex:1}
    .menu a{white-space:nowrap}
    .groupe,.pied,.menu a .badge{display:none}
    .vue{padding:18px}
    .barre{padding:0 18px}
  }
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
  /* ── La scène du symbole ──────────────────────────────────────────
     Le dégradé tourne parce que son angle est une vraie propriété
     typée, donc interpolable. Le masque découpe la silhouette : rien
     n'est redessiné image par image, tout se joue à la composition,
     donc sur la carte graphique. Trois mouvements décalés et de durées
     premières entre elles : ils ne se resynchronisent jamais, l'oeil
     ne trouve pas la boucle. */
  @property --tour{syntax:'<angle>';inherits:false;initial-value:0deg}
  @property --contre{syntax:'<angle>';inherits:false;initial-value:180deg}
  .vitrine{position:relative;display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;
    padding:34px 30px;margin-bottom:18px;border:1px solid var(--filet);border-radius:16px;
    background:radial-gradient(120% 140% at 82% -10%,rgba(var(--signal-r),.10),transparent 58%),
      linear-gradient(160deg,#10151D,#08090C 62%);overflow:hidden;isolation:isolate}
  .vitrine .halo{position:absolute;inset:-40% -10% auto auto;width:520px;height:520px;pointer-events:none;
    background:radial-gradient(circle,rgba(var(--signal-r),.18),transparent 62%);filter:blur(28px);
    animation:respirer 13s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes respirer{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.09)}}
  .astre{position:relative;width:168px;height:168px;flex:none;
    animation:flotter 11s cubic-bezier(.37,0,.63,1) infinite;will-change:transform}
  @keyframes flotter{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-7px,0)}}
  .astre .chair,.astre .eclat,.astre .voile,.astre .trait{position:absolute;inset:0;
    -webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
  .astre .chair,.astre .eclat,.astre .voile{-webkit-mask-image:var(--anneau);mask-image:var(--anneau)}
  .astre .chair{background:linear-gradient(168deg,#FFFFFF,#D3DBE9 38%,#96A0B4 68%,#6E7889)}
  /* Le balayage : une lumière large qui fait le tour de la lettre.
     Les paliers sont nombreux et rapprochés, c'est ce qui remplace le
     flou : une bande franche donnerait un éclair de gyrophare. */
  .astre .eclat{background:conic-gradient(from var(--tour),
      rgba(255,255,255,0) 0deg,rgba(var(--signal-r),.10) 22deg,rgba(var(--signal-r),.34) 40deg,
      rgba(214,230,255,.72) 56deg,#FFFFFF 66deg,rgba(214,230,255,.70) 76deg,
      rgba(var(--signal-r),.30) 96deg,rgba(var(--signal-r),.08) 118deg,rgba(255,255,255,0) 150deg);
    mix-blend-mode:screen;animation:tourner 9s linear infinite}
  /* Un second passage, plus lent et à contresens, pour que la surface
     garde du relief entre deux balayages. */
  .astre .voile{background:conic-gradient(from var(--contre),
      rgba(255,255,255,0) 0deg,rgba(var(--signal-r),.16) 60deg,rgba(255,255,255,.10) 96deg,
      rgba(var(--signal-r),.14) 130deg,rgba(255,255,255,0) 200deg);
    mix-blend-mode:screen;animation:contourner 23s linear infinite}
  @keyframes tourner{to{--tour:360deg}}
  @keyframes contourner{to{--contre:-180deg}}
  .astre .trait{-webkit-mask-image:var(--queue);mask-image:var(--queue);
    background:linear-gradient(135deg,rgba(var(--signal-r),.78),#B6CDFF);
    filter:drop-shadow(0 0 16px rgba(var(--signal-r),.5));
    animation:pulser 9s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes pulser{0%,100%{filter:drop-shadow(0 0 10px rgba(var(--signal-r),.34))}
    50%{filter:drop-shadow(0 0 22px rgba(var(--signal-r),.62))}}
  /* La carte est sombre quel que soit l'habillage : son texte l'est donc
     aussi, sinon il devient illisible en mode jour. */
  .vitrine .dit b{display:block;font-size:29px;font-weight:600;letter-spacing:.22em;color:#EAEDF2}
  .vitrine .dit b i{font-style:normal;color:var(--signal)}
  .vitrine .dit span{display:block;margin-top:10px;max-width:52ch;color:rgba(234,237,242,.62);
    font-size:13.5px;line-height:1.7}
  @media(max-width:760px){
    .vitrine{grid-template-columns:1fr;justify-items:center;text-align:center;gap:22px;padding:28px 20px}
    .astre{width:132px;height:132px}
  }
  @media(prefers-reduced-motion:reduce){
    .astre,.astre .eclat,.astre .voile,.astre .trait,.vitrine .halo{animation:none}
    .astre .eclat{opacity:.45}
  }
  /* Une campagne se lit comme une consigne : qui, quoi, où, quelle taille. */
  .camp{border:1px solid var(--filet);border-radius:13px;padding:16px 18px;margin-bottom:12px;
    background:var(--surface-2)}
  .camp.vive{border-color:rgba(var(--signal-r),.28);
    background:linear-gradient(120deg,rgba(var(--signal-r),.07),transparent 60%),var(--surface-2)}
  .camp-tete{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
  .camp-tete b{font-size:15px}
  .camp-qui{color:var(--faible);font-size:12.5px;margin-top:2px}
  .camp-cible{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .camp-cible span{font-size:12px;color:var(--attenue);background:var(--fond);
    border:1px solid var(--filet);border-radius:20px;padding:4px 11px}
  .camp-actes{display:flex;gap:8px;flex-wrap:wrap}


  /* ── L'objectif du jour ─
───────────────────────────────────────────
     Un anneau plutot qu'une barre : on y lit ce qui reste autant que ce
     qui est fait, et c'est ce qui reste qui fait decrocher le telephone. */
  /* Le visage : quatre expressions, tracees au trait comme les icones du
     rail. Il ne remplace pas le chiffre, il le fait ressentir. */
  .visage{flex:none}
  .visage .tete{fill:none;stroke:var(--filet-fort);stroke-width:2}
  .visage .traits{fill:currentColor;stroke:currentColor;stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round}
  .visage .traits path{fill:none}
  .visage.v-rayonne{color:var(--ok)}
  .visage.v-rayonne .tete{stroke:color-mix(in srgb,var(--ok) 55%,transparent)}
  .visage.v-content{color:var(--signal)}
  .visage.v-content .tete{stroke:color-mix(in srgb,var(--signal) 45%,transparent)}
  .visage.v-neutre{color:var(--attenue)}
  .visage.v-soucieux{color:var(--attente)}
  .visage.v-soucieux .tete{stroke:color-mix(in srgb,var(--attente) 45%,transparent)}
  .obj-anneau{display:flex;align-items:center;gap:14px}
  .moi-grille{display:flex;align-items:center;gap:30px;flex-wrap:wrap}
  .moi-visage{flex:none}
  .moi-dit{flex:1;min-width:240px}
  .obj-faits b i{font-style:normal;font-size:12px;margin-left:6px}
  .obj-faits b i.up{color:var(--ok)}
  .obj-faits b i.down{color:var(--attente)}
  /* La conversion : un seul chiffre, et ce qu'il vaut. */
  .conv{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .conv-n{font-size:clamp(34px,5vw,50px);font-weight:600;letter-spacing:-.04em;
    font-variant-numeric:tabular-nums}
  .conv-a{color:var(--faible);font-size:13.5px}
  .conv-p{color:var(--faible);font-size:13px;line-height:1.8;max-width:70ch;margin:0}
  .objectif .corps{padding:26px 28px}
  .obj-grille{display:flex;align-items:center;gap:30px;flex-wrap:wrap}
  .anneau{flex:none;transform:rotate(-90deg)}
  .anneau .piste-a{fill:none;stroke:var(--filet);stroke-width:9}
  .anneau .trace-a{fill:none;stroke:var(--signal);stroke-width:9;stroke-linecap:round;
    transition:stroke-dashoffset .9s cubic-bezier(.22,1,.36,1);
    filter:drop-shadow(0 0 8px rgba(var(--signal-r),.45))}
  .anneau text{transform:rotate(90deg);transform-origin:center;text-anchor:middle;
    font-family:"Instrument Sans",system-ui,sans-serif;fill:var(--texte)}
  .anneau .a-n{font-size:34px;font-weight:600;letter-spacing:-.03em}
  .anneau .a-l{font-size:12px;fill:var(--faible)}
  .obj-dit{flex:1;min-width:220px}
  .obj-titre{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9.5px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--faible);margin-bottom:8px}
  .obj-mot{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-bottom:18px}
  .obj-faits{display:flex;gap:26px;flex-wrap:wrap}
  .obj-faits span{display:block;font-family:"JetBrains Mono",monospace;font-size:9.5px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--faible);margin-bottom:4px}
  .obj-faits b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

  /* La progression pendant la session : discrete, toujours visible. */
  .jauge-obj{position:relative;height:26px;border:1px solid var(--filet);border-radius:9px;
    background:var(--surface);overflow:hidden;margin-bottom:16px}
  .jauge-obj i{display:block;height:100%;
    background:linear-gradient(90deg,rgba(var(--signal-r),.35),rgba(var(--signal-r),.7));
    transition:width .7s cubic-bezier(.22,1,.36,1)}
  .jauge-obj span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--texte)}

  /* Le palier franchi : une ligne, trois secondes, puis plus rien. */
  .bravo{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:9500;
    background:var(--texte);color:var(--fond);font-size:14px;font-weight:600;
    padding:12px 22px;border-radius:11px;box-shadow:0 18px 40px rgba(0,0,0,.35);
    animation:monte-b .4s cubic-bezier(.22,1,.36,1);transition:opacity .5s,transform .5s}
  .bravo.parti{opacity:0;transform:translateX(-50%) translateY(10px)}
  @keyframes monte-b{from{opacity:0;transform:translateX(-50%) translateY(14px)}}

  /* L'aiguillage : quatre grandes cartes, une par situation reelle. */
  .choix-suite{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){ .choix-suite{grid-template-columns:1fr} }
  .choix-suite button{cursor:pointer;text-align:left;font:inherit;color:var(--texte);
    background:var(--surface-2);border:1px solid var(--filet);border-radius:12px;
    padding:15px 16px;transition:border-color .16s,transform .16s}
  .choix-suite button:hover{transform:translateY(-2px);border-color:rgba(var(--signal-r),.45)}
  .choix-suite b{display:block;font-size:14.5px;font-weight:600;margin-bottom:4px}
  .choix-suite span{display:block;font-size:12.5px;color:var(--faible);line-height:1.55}

  /* ── Session d'appels ─

─────────────────────────────────────────────
     Un ecran qui ne demande qu'une chose a la fois. Le numero est le
     plus gros element de la page : c'est lui qu'on lit en decrochant. */
  .depart{text-align:center}
  .depart .corps{padding:44px 24px 40px}
  .gd-titre{font-size:clamp(24px,3.4vw,34px);font-weight:600;letter-spacing:-.03em;margin-bottom:12px}
  .gd-sous{color:var(--faible);font-size:14.5px;line-height:1.8;max-width:56ch;margin:0 auto 26px}
  .gros-btn{font-size:15.5px;padding:14px 30px;border-radius:12px}
  .rappel-clavier{margin-top:20px;font-family:"JetBrains Mono",monospace;font-size:11px;
    color:var(--faible);letter-spacing:.04em}
  .rappel-clavier b{display:inline-block;min-width:18px;text-align:center;color:var(--attenue);
    border:1px solid var(--filet);border-radius:5px;padding:1px 5px;margin-right:3px}

  .duree-dit{margin-top:14px;color:var(--faible);font-size:13px}
  .chrono b{font-variant-numeric:tabular-nums}
  .rythme{font-size:12px;border:1px solid var(--filet);border-radius:20px;padding:3px 10px}
  .rythme.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
  .rythme.mou{color:var(--attente);border-color:color-mix(in srgb,var(--attente) 40%,transparent)}
  /* Le trait vertical sur la jauge : ou l'on devrait en etre a cet
     instant. Etre devant est visible sans qu'on ait a le dire. */
  .jauge-obj em{position:absolute;top:0;bottom:0;width:2px;background:var(--filet-fort);
    transition:left 1s linear}
  .bilan{padding:30px 28px}
  .bilan-tete{display:flex;align-items:center;gap:20px;margin-bottom:22px;flex-wrap:wrap}
  .bilan-actes{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
  .bandeau-session{
display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:16px;
    padding:12px 18px;border:1px solid var(--filet);border-radius:12px;background:var(--surface);
    font-size:13px;color:var(--faible)}
  .bandeau-session b{color:var(--texte);font-size:16px;font-variant-numeric:tabular-nums;margin-right:4px}
  .bandeau-session button{margin-left:auto}

  .fiche-appel{background:var(--surface);border:1px solid var(--filet);border-radius:16px;
    background-image:linear-gradient(150deg,rgba(var(--signal-r),.06),transparent 55%)}
  .fiche-appel .corps{padding:26px 28px 24px}
  .tete-f{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
  .tete-f .ent{font-size:22px;font-weight:600;letter-spacing:-.02em}
  .tete-f .meta{color:var(--faible);font-size:13.5px;margin-top:4px}
  .numero{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:clamp(28px,4vw,38px);
    letter-spacing:.02em;color:var(--texte);text-decoration:none;
    border-bottom:2px solid rgba(var(--signal-r),.45);padding-bottom:3px;margin-bottom:20px}
  .numero:hover{border-bottom-color:var(--signal)}
  .script{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
  .pas-s{display:flex;gap:12px;align-items:flex-start;
    border-left:2px solid var(--signal);padding:2px 0 2px 14px;
    color:var(--attenue);font-size:14.5px;line-height:1.7}
  .pas-s i{flex:none;width:20px;height:20px;margin-top:2px;border-radius:50%;
    display:grid;place-items:center;font-style:normal;
    font-family:"JetBrains Mono",monospace;font-size:10.5px;
    color:var(--signal);border:1px solid rgba(var(--signal-r),.4)}
  .pas-s.barrage{border-left-color:var(--attente)}
  .pas-s.barrage i{color:var(--attente);border-color:color-mix(in srgb,var(--attente) 45%,transparent)}
  .script .lab,.signaux .lab{display:block;font-family:"JetBrains Mono",monospace;font-size:9.5px;
    letter-spacing:.13em;text-transform:uppercase;color:var(--faible);margin-bottom:6px}
  .signaux{margin-bottom:18px;color:var(--faible);font-size:13px;line-height:1.7}
  .liens-f{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px;font-size:13.5px}
  .liens-f a{color:var(--signal);text-decoration:none}
  .liens-f a:hover{text-decoration:underline}

  .resultats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .res{position:relative;cursor:pointer;font:inherit;text-align:left;color:var(--texte);
    background:var(--surface-2);border:1px solid var(--filet);border-radius:12px;padding:13px 14px;
    transition:border-color .16s,transform .16s,background .16s}
  .res:hover{transform:translateY(-2px);border-color:var(--filet-fort)}
  .res b{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
  .res span{display:block;font-size:11.5px;color:var(--faible);line-height:1.5}
  .res i{position:absolute;top:10px;right:11px;font-style:normal;font-family:"JetBrains Mono",monospace;
    font-size:10px;color:var(--faible);border:1px solid var(--filet);border-radius:5px;padding:0 5px}
  .res.r-ok:hover{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
  .res.r-att:hover{border-color:color-mix(in srgb,var(--attente) 55%,transparent)}
  .res.r-ret:hover{border-color:color-mix(in srgb,var(--retard) 55%,transparent)}
  .champ-note input{width:100%;font:inherit;font-size:13.5px;color:var(--texte);
    background:var(--fond);border:1px solid var(--filet);border-radius:10px;padding:10px 13px;outline:none}
  .champ-note input:focus{border-color:var(--signal)}

  /* Un segment plutot qu'une liste deroulante : deux choix se montrent,
     ils ne se cherchent pas. */
  .segment{display:inline-flex;gap:4px;padding:4px;margin-bottom:16px;
    border:1px solid var(--filet);border-radius:11px;background:var(--surface)}
  .segment button{cursor:pointer;font:inherit;font-size:13px;color:var(--attenue);
    background:transparent;border:0;border-radius:8px;padding:7px 14px;
    display:inline-flex;align-items:center;gap:7px;transition:background .16s,color .16s}
  .segment button:hover{color:var(--texte)}
  .segment button.actif{background:var(--surface-2);color:var(--texte)}
  .segment button i{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:11px;
    color:var(--faible)}
  .segment button.actif i{color:var(--signal)}
  .dossier-d .tete-d{
display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding-bottom:12px;border-bottom:1px solid var(--filet);margin-bottom:14px;font-size:14px}
  .dossier-d .tete-d a{color:var(--signal);text-decoration:none}
  .dossier-d .faits{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .dossier-d .faits div{border:1px solid var(--filet);border-radius:10px;padding:9px 11px}
  .dossier-d .faits span{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faible)}
  .dossier-d .faits b{font-size:13.5px;font-weight:500}
  .dossier-d .besoin-d{margin:0 0 14px;padding:14px;border-radius:11px;background:var(--fond);
    border:1px solid var(--filet);white-space:pre-wrap;font:400 13.5px/1.7 inherit;color:var(--attenue)}
  .dossier-d .actes{display:flex;gap:9px;flex-wrap:wrap}

  function brancherFiltre(){
  $$('[data-filtre]').forEach(function(b){
    b.onclick=function(){ filtreDemandes=b.dataset.filtre; VUES.demandes(); };
  });
}

/* ── Ressources de marque─────────────────────────────────────────── */
  .res{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .ress{border:1px solid var(--filet);border-radius:12px;background:var(--surface-2);
    padding:14px;display:flex;flex-direction:column;gap:12px;text-align:left;font:inherit;color:inherit}
  .ress.large{grid-column:span 2}
  @media(max-width:900px){ .ress.large{grid-column:span 1} }
  .ress .quoi b{display:block;font-size:14px}
  .ress .quoi span{display:block;color:var(--faible);font-size:12.5px;line-height:1.5;margin-top:3px}
  .ress .actes{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
  .apercu{border-radius:10px;padding:18px;display:flex;align-items:center;justify-content:center;
    min-height:112px;overflow:hidden}
  .apercu.sombre{background:#0B0E13;border:1px solid var(--filet)}
  .apercu.clair{background:#FAFAFB;border:1px solid var(--filet)}
  .apercu.petit{min-height:72px}
  .apercu svg{max-width:100%;height:auto}
  .toile{width:100%;height:auto;border-radius:10px;border:1px solid var(--filet);display:block}
  button.ress{cursor:pointer}
  button.ress:hover{border-color:var(--filet-fort);background:var(--survol)}
  .apercu-mail{background:var(--fond);border-radius:12px;padding:0;overflow:hidden}
  .jetons{margin-top:18px;border-top:1px solid var(--filet);padding-top:16px}
  .jetons .lab{display:block;font-family:"JetBrains Mono",monospace;font-size:9.5px;
    letter-spacing:.13em;text-transform:uppercase;color:var(--faible);margin-bottom:10px}
  .jetons div{display:flex;align-items:baseline;gap:12px;padding:5px 0;font-size:13px}
  .jetons code{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--signal);
    background:rgba(var(--signal-r),.1);border:1px solid rgba(var(--signal-r),.22);
    border-radius:6px;padding:2px 7px;flex:none}
  .jetons span{color:var(--faible)}
  .extrait{min-width:0;border:1px solid var(--filet);border-radius:12px;margin-top:14px;overflow:hidden}
  .extrait header{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--filet);
    font-size:12.5px;color:var(--attenue)}
  .extrait pre{margin:0;padding:14px;overflow-x:auto;background:var(--fond);
    font:400 12.5px/1.7 "JetBrains Mono",ui-monospace,monospace;color:var(--texte)}
  .nuancier{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .teinte{display:flex;flex-direction:column;gap:6px;align-items:flex-start;cursor:pointer;
    border:1px solid var(--filet);border-radius:10px;padding:10px;background:var(--surface-2);
    color:inherit;font:inherit;text-align:left}
  .teinte:hover{border-color:var(--filet-fort)}
  .teinte span{width:100%;height:34px;border-radius:7px;border:1px solid var(--filet)}
  .teinte b{font-size:13px}
  .teinte i{font-style:normal;font-size:12px;color:var(--attenue)}
  .teinte em{font-style:normal;font-size:11.5px;color:var(--faible)}
  .apercu table{width:auto;border-collapse:separate;font-size:inherit}
  .apercu table td{border:0;padding:0}
  .specimen .gd{font-size:30px;font-weight:600;letter-spacing:-.01em}
  .specimen .attn{color:var(--faible);font-size:13px;margin-top:4px}
</style>
</head>
<body>

<div class="porte" id="porte">
  <form id="form-connexion">
    <h1>Administration ONIQ</h1>
    <p>Accès réservé à l'équipe.</p>
    <div id="err-connexion"></div>
    <div class="champ"><label for="mail">Adresse</label>
      <input id="mail" type="email" autocomplete="username" required placeholder="vous@oniq.online"></div>
    <div class="champ"><label for="mdp">Mot de passe</label>
      <input id="mdp" type="password" autocomplete="current-password" required></div>
    <button class="plein" type="submit" id="btn-connexion">Se connecter</button>
  </form>
</div>

<div class="app" id="app">
  <aside class="rail">
    <div class="marque">
      <svg class="mot" viewBox="80 76 1407 386" aria-hidden="true"><g><path d="M80,256 A176,176 0 1,0 432,256 A176,176 0 1,0 80,256 ZM137,248 A119,119 0 1,0 375,248 A119,119 0 1,0 137,248 Z" fill="currentColor" fill-rule="evenodd"/></g><g transform="translate(452,0)"><path d="M80,80 H137 L323,336 V80 H380 V432 H323 L137,176 V432 H80 Z" fill="currentColor"/></g><g transform="translate(852,0)"><path d="M80,80 H137 V432 H80 Z" fill="currentColor"/></g><g transform="translate(1009,0)"><path d="M80,256 A176,176 0 1,0 432,256 A176,176 0 1,0 80,256 ZM137,248 A119,119 0 1,0 375,248 A119,119 0 1,0 137,248 Z" fill="currentColor" fill-rule="evenodd"/><path class="q" d="M366,315.6 C416,338 456,392 474,458 C424,424 376,396 315.6,366 Z"/></g></svg>
      <span class="etat-moteur" title="Le moteur de prospection passe toutes les cinq minutes"><span class="pastille"></span>En service</span>
    </div>

var URL_BASE='https://kxdxxhepewziazfnfnkq.supabase.co';
var CLE='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4ZHh4aGVwZXd6aWF6Zm5mbmtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MjkyMDMsImV4cCI6MjA4OTIwNTIwM30.erlLC8zLX3rucPE7-CzJyLGwCljWpzIeGwa6oWXfbMM';

/* La session ne coupe plus au bout d'une heure : le refresh token est
   garde, le jeton d'acces se renouvelle en silence toutes les 40 min,
   et tout appel refuse en 401 est rejoue une fois apres renouvellement. */
var RT=null;
async function rafraichir(){
  if(!RT)return false;
  try{
    var r=await fetch(URL_BASE+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:{'apikey':CLE,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:RT})});
    var j=await r.json();
    if(!r.ok||!j.access_token)return false;
    jeton=j.access_token; if(j.refresh_token)RT=j.refresh_token;
    try{ sessionStorage.setItem('oq_adm',JSON.stringify({j:jeton,m:moi,r:RT})); }catch(x){}
    return true;
  }catch(e){ return false; }
}
setInterval(function(){ if(RT)rafraichir(); },40*60*1000);
async function appelle(url,opts){
  opts=opts||{};
  var r=await fetch(url,opts);
  if(r.status===401&&await rafraichir()){
    if(opts.headers)opts.headers['Authorization']='Bearer '+(jeton||CLE);
    r=await fetch(url,opts);
  }
  return r;
}

function entetes(extra){
  var h={'apikey':CLE,'Authorization':'Bearer '+(jeton||CLE),'Content-Type':'application/json'};
  if(extra)for(var k in extra)h[k]=extra[k];
  return h;
}
async function lire(table,requete){
  var r=await appelle(URL_BASE+'/rest/v1/'+table+'?'+(requete||'select=*'),{headers:entetes()});
  if(!r.ok)throw new Error(table+' : '+r.status);
  return r.json();
}
async function compter(table,filtre){
  var r=await appelle(URL_BASE+'/rest/v1/'+table+'?select=id&limit=1'+(filtre?'&'+filtre:''),
    {headers:entetes({'Prefer':'count=exact'})});
  var cr=r.headers.get('content-range')||'0/0';
  return parseInt(cr.split('/')[1],10)||0;
}
async function ecrire(table,corps){
  var r=await appelle(URL_BASE+'/rest/v1/'+table,
    {method:'POST',headers:entetes({'Prefer':'return=representation'}),body:JSON.stringify(corps)});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function modifier(table,filtre,corps){
  var r=await appelle(URL_BASE+'/rest/v1/'+table+'?'+filtre,
    {method:'PATCH',headers:entetes(),body:JSON.stringify(corps)});
  if(!r.ok)throw new Error(await r.text());
}
async function tracer(action,cible,id){

function depuis(d){
  if(!d)return '';
  var s=Math.floor((Date.now()-new Date(d).getTime())/1000);
  if(s<60)return 'à l’instant';
  if(s<3600)return 'il y a '+Math.floor(s/60)+' min';
  if(s<86400)return 'il y a '+Math.floor(s/3600)+' h';
  return 'il y a '+Math.floor(s/86400)+' j';
}
function ech(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function etat(txt,genre){return '<span class="etat e-'+genre+'">'+ech(txt)+'</span>';}

})();

/* Le portail de premiere connexion : sans fiche expediteur (nom +
   alias), les emails automatiques n'ont pas de signature et attendent.
   Alors on la demande d'office, une seule fois, avant d'entrer. */
function accueilExpediteur(suite){
  var f=document.createElement('div');
  f.className='fond-modale';
  f.innerHTML='<div class="modale" role="dialog" aria-modal="true"><header>'
    +'<h3>Bienvenue. Une minute, et tout est prêt.</h3></header><div class="corps">'
    +'<p style="margin:0 0 14px;color:var(--faible);font-size:13.5px;line-height:1.6">'
    +'Les emails que la machine envoie pour vous (démonstration, confirmation de '
    +'rendez-vous, rappel de la veille) partent signés à votre nom. '
    +'Remplissez votre fiche une fois, et tout part tout seul ensuite.</p>'
    +'<div id="err-modale"></div><div class="grille2">'
    +'<div class="champ"><label for="c-pnom">Votre nom complet</label>'
      +'<input id="c-pnom" placeholder="Prénom Nom"></div>'
    +'<div class="champ"><label for="c-palias">Votre adresse d’envoi</label>'
      +'<input id="c-palias" placeholder="prenom@oniq.online"></div>'
    +'<div class="champ"><label for="c-pposte">Votre poste</label>'
      +'<input id="c-pposte" placeholder="Conseiller logiciels"></div>'
    +'<div class="champ"><label for="c-ptel">Votre téléphone</label>'
      +'<input id="c-ptel" placeholder="06 12 34 56 78"></div>'
    +'</div></div><footer>'
    +'<button class="btn fort" data-ok>C’est parti</button></footer></div>';
  document.body.appendChild(f);
  var ok=f.querySelector('[data-ok]');
  ok.onclick=async function(){
    var nom=f.querySelector('#c-pnom').value.trim(),
        alias=f.querySelector('#c-palias').value.trim().toLowerCase(),
        poste=f.querySelector('#c-pposte').value.trim(),
        tel=f.querySelector('#c-ptel').value.trim(),
        err=f.querySelector('#err-modale');
    if(!nom){ err.innerHTML='<div class="erreur">Votre nom, pour signer les emails.</div>'; return; }
    if(!/^[a-z0-9._-]+@oniq\.online$/.test(alias)){
      err.innerHTML='<div class="erreur">L’adresse d’envoi doit finir par @oniq.online '
        +'(par exemple '+ech((nom.split(' ')[0]||'prenom').toLowerCase())+'@oniq.online).</div>'; return; }
    ok.disabled=true; ok.textContent='Enregistrement…';
    try{
      var r=await appelle(URL_BASE+'/rest/v1/oq_expediteurs?on_conflict=owner_email',
        {method:'POST',headers:entetes({'Prefer':'resolution=merge-duplicates'}),
         body:JSON.stringify({owner_email:moi,from_nom:nom,from_alias:alias,
           poste:poste||null,telephone:tel||null})});
      if(!r.ok)throw new Error(await r.text());
      NOM_PARLE=null;
      await tracer('expediteur.premiere',moi);
      f.remove(); suite();
    }catch(e2){
      err.innerHTML='<div class="erreur">'+ech(String(e2.message||e2).slice(0,200))+'</div>';
      ok.disabled=false; ok.textContent='C’est parti';
    }
  };
}

async function ouvrir(){
  $('#porte').style.display='none';
  $('#app').classList.add('ouvert');
  $('#qui-suis-je').textContent=moi||'';
  $('#initiale').textContent=(moi||'?').trim().charAt(0).toUpperCase();

    aller((location.hash||(ROLE==='direction'?'#pilotage':'#appels')).slice(1));
    compteurs();
  };
  /* Premiere connexion : la fiche expediteur d'abord, le CRM ensuite.
     Si la lecture echoue (reseau), on n'enferme personne dehors. */
  try{
    var exp=await lire('oq_expediteurs',
      'select=from_nom,from_alias&owner_email=eq.'+encodeURIComponent(moi||'')+'&limit=1');
    if(!exp.length||!exp[0].from_nom||!exp[0].from_alias){ accueilExpediteur(entrer); return; }
  }catch(e){}
  entrer();
}

var VUES={};

/* ── Tableau de bord ─────────────────────────────────────────────────
   Six indicateurs seulement. Un tableau de bord qui affiche tout
   n'affiche rien : chaque chiffre ici doit pouvoir declencher une
   decision dans la journee. */
VUES.pilotage=async function(){
  try{
    var res=await Promise.all([
      lire('oq_factures','select=montant_ht,tva,statut,echeance_le,payee_le&limit=1000'),
      lire('oq_devis','select=montant_ht,statut,cree_le&limit=1000'),
      lire('oq_abonnements','select=montant_mois,statut&limit=500'),
      compter('oq_clients','statut=eq.actif'),
      compter('oq_prospects'),
      compter('oq_prospects','statut=neq.nouveau'),
      compter('oq_messages','sens=eq.in&auto=is.false'),
      lire('oq_activite','select=*&order=cree_le.desc&limit=12'),
      lire('oq_projets','select=titre,statut,budget_ht,client_id&order=cree_le.desc&limit=8')
    ]);
    var fac=res[0],dev=res[1],abo=res[2],clients=res[3],prospects=res[4],
        contactes=res[5],reponses=res[6],journal=res[7],projets=res[8];

    var ttc=function(f){return (+f.montant_ht||0)*(1+(+f.tva||0)/100);};
    var encaisse=fac.filter(function(f){return f.statut==='payee';}).reduce(function(a,f){return a+ttc(f);},0);
    var attente =fac.filter(function(f){return f.statut==='envoyee';}).reduce(function(a,f){return a+ttc(f);},0);
    var retard  =fac.filter(function(f){return f.statut==='retard';}).reduce(function(a,f){return a+ttc(f);},0);
    var mrr     =abo.filter(function(a){return a.statut==='actif';}).reduce(function(a,b){return a+(+b.montant_mois||0);},0);
    var enCours =dev.filter(function(d){return d.statut==='envoye';}).reduce(function(a,d){return a+(+d.montant_ht||0);},0);
    var envoyes =dev.filter(function(d){return d.statut!=='brouillon';}).length;
    var gagnes  =dev.filter(function(d){return d.statut==='accepte';}).length;
    var taux    =envoyes?Math.round(100*gagnes/envoyes):0;
    var partRec =(encaisse+mrr*12)>0?Math.round(100*(mrr*12)/(encaisse+mrr*12)):0;

    var h='<div id="direct"></div><div class="kpis">'
      +kpi('Encaissé',euro(encaisse),'vert',fac.filter(function(f){return f.statut==='payee';}).length+' facture(s) réglée(s)')
      +kpi('En attente',euro(attente),'ambre','factures envoyées, non réglées')
      +kpi('En retard',euro(retard),retard>0?'rouge':'', retard>0?'à relancer aujourd’hui':'rien en souffrance')
      +kpi('Récurrent mensuel',euro(mrr),'bleu',partRec+' % du chiffre annuel')
      +kpi('Devis en cours',euro(enCours),'','taux de transformation '+taux+' %')
      +kpi('Clients actifs',nb(clients),'',nb(prospects)+' prospects en base')
      +'</div>';

    /* Entonnoir : du prospect au client, en une ligne lisible. */
    var etapes=[['Prospects',prospects],['Contactés',contactes],['Réponses',reponses],
                ['Devis envoyés',envoyes],['Signés',gagnes],['Clients',clients]];
    h+='<div class="panneau"><header><h2>De la prospection au client</h2>'
      +'<span class="aide">chaque étape, et ce qui reste</span></header><div class="corps">'
      +'<div class="kpis" style="margin:0">';
    etapes.forEach(function(e,i){
      var prec=i>0?etapes[i-1][1]:0;

      :vide('Rien à afficher','Le journal se remplit dès que vous créez un client, envoyez un devis ou encaissez une facture.');

    $('#vue').innerHTML=h;

    /* Le direct se rafraichit tant qu'on reste sur le tableau de bord,

/* ── Le direct ──────────────────────────────────────────────────────
   Un tableau de bord qui ne montre que des cumuls est un bilan
   comptable. Ce qui donne envie de l'ouvrir le matin, c'est ce qui
   bouge : qui est sur le site maintenant, ce que la machine a envoyé
   depuis minuit, la dernière demande arrivée. Les chiffres viennent de
   nos propres tables, aucun mouchard tiers n'est branché. */
/* Appel d'une fonction posee cote base : c'est elle qui compte, qui
   verrouille, qui tranche. Le navigateur ne fait que demander. */
async function rpc(nom,corps){
  var r=await appelle(URL_BASE+'/rest/v1/rpc/'+nom,
    {method:'POST',headers:entetes(),body:JSON.stringify(corps||{})});
  if(!r.ok)throw new Error(nom+' : '+r.status);
  return r.json();
}

/* Le role, lu a l'ouverture : un commercial ne voit que l'acquisition.
   Tant que oq_mon_role n'est pas posee en base, tout le monde voit

var ROLE='direction';
var HORS_COMMERCIAL={pilotage:1,activite:1,clients:1,projets:1,devis:1,

    var r=await appelle(URL_BASE+'/rest/v1/rpc/oq_direct',{method:'POST',headers:entetes(),body:'{}'});

      +((d.pages&&d.pages.length)?('<div class="pages-d"><span class="lab">Les pages regardées aujourd’hui</span>'
        +d.pages.map(function(p){
          return '<div><b>'+ech(p.page)+'</b><i>'+nb(p.n)+'</i></div>';}).join('')+'</div>'):'')

/* ══ Commercial ═════════════════════════════════════════════════════
   Trois écrans pour la personne qui décroche le téléphone. Le principe
   tient en une phrase : elle ne doit rien préparer, rien chercher et
   rien saisir. Elle clique sur Commencer, elle appelle, elle clique sur
   ce qui s'est passé, la fiche suivante arrive. */

var RESULTATS=[
  {id:'interesse',    lab:'Intéressé',      touche:'1', genre:'ok',  aide:'contact obtenu — notez email et rendez-vous'},
  {id:'rappeler',     lab:'Rappeler',       touche:'2', genre:'att', aide:'revient dans la file à la date choisie'},
  {id:'absent',       lab:'Absent',         touche:'3', genre:'',    aide:'repropose dans trois jours'},
  {id:'pas_interesse',lab:'Pas intéressé',  touche:'4', genre:'ret', aide:'sort de la file'},
  {id:'faux_numero',  lab:'Faux numéro',    touche:'5', genre:'ret', aide:'retire le numéro de la fiche'}
];

/* La session vit en mémoire : on ne veut pas d'un compteur qui repart à
   zéro parce que le commercial a changé d'onglet. */
/* Une heure : la duree pendant laquelle un commercial garde de la voix
   et de l'attention. Deux blocs d'une heure font la journee. */
var DUREE_SESSION=60*60*1000;
var SESSION=null, MINUTEUR=null;

function resteSession(){
  if(!SESSION)return 0;
  return Math.max(0,DUREE_SESSION-(Date.now()-SESSION.debut));
}
function mmss(ms){
  var s=Math.round(ms/1000), m=Math.floor(s/60);
  return m+' min'+(m<5?' '+String(s%60).padStart(2,'0')+' s':'');
}

/* ── L'objectif du jour ─────────────────────────────────────────────
   Un commercial sans objectif chiffré appelle jusqu'à ce qu'il en ait
   assez. Avec un objectif visible, il appelle jusqu'à l'avoir atteint.
   Trois ressorts, et pas un de plus : une jauge qui se remplit, une
   série de jours tenus qu'on ne veut pas casser, et sa propre moyenne
   à battre. Aucun classement entre commerciaux : se comparer aux autres
   pousse à bâcler pour faire du chiffre. */
  /* ── Le visage ──────────────────────────────────────────────────────
   Un chiffre se lit, un visage se ressent. Il n'y a pas de classement
   entre commerciaux : chacun se compare à lui-même, à sa propre moyenne
   et à son objectif. La comparaison aux autres pousse à bâcler pour
   faire du chiffre, la comparaison à soi pousse à recommencer demain.

   Quatre expressions, quatre seuils, et rien entre les deux. */
function visage(part,taille){
  var t=taille||64, r=t/2-3, c=t/2;
  var etat = part>=1 ? 'rayonne' : part>=0.75 ? 'content'
           : part>=0.4 ? 'neutre' : 'soucieux';
  var bouche = {
    rayonne : 'M'+(c-13)+' '+(c+4)+' Q'+c+' '+(c+18)+' '+(c+13)+' '+(c+4),
    content : 'M'+(c-11)+' '+(c+5)+' Q'+c+' '+(c+13)+' '+(c+11)+' '+(c+5),
    neutre  : 'M'+(c-10)+' '+(c+8)+' L'+(c+10)+' '+(c+8),
    soucieux: 'M'+(c-11)+' '+(c+11)+' Q'+c+' '+(c+2)+' '+(c+11)+' '+(c+11)
  }[etat];
  var oeil = (x)=>'<circle cx="'+x+'" cy="'+(c-6)+'" r="'+(etat==='rayonne'?2.6:2.2)+'"/>';
  return '<svg class="visage v-'+etat+'" viewBox="0 0 '+t+' '+t+'" width="'+t+'" height="'+t+'" aria-hidden="true">'
    +'<circle class="tete" cx="'+c+'" cy="'+c+'" r="'+r+'"/>'
    +'<g class="traits">'+oeil(c-9)+oeil(c+9)+'<path d="'+bouche+'"/></g>'
    +'</svg>';
}

/* Deux seuils, parce qu'un taux ne devient pas fiable d'un coup.
   . moins de 30 appels : deux intéressés sur cinq font 40 %, et ce
     chiffre ne prédit rien. On n'affiche pas.
   . de 30 à 100 : une estimation, annoncée comme telle.
   . au-delà de 100 : l'ordre de grandeur tient, à quelques points près.
   Avec 40 appels par jour, la barre des 100 tombe le troisième jour :
   le commercial voit son vrai taux dès le milieu de sa première semaine. */
var SEUIL_FIABLE=30, SEUIL_SOLIDE=100;

function tauxOuAttente(interesses,appels){
  if(appels<SEUIL_FIABLE){
    return {texte:'—',
      aide:'encore '+(SEUIL_FIABLE-appels)+' appels avant que le taux veuille dire quelque chose'};
  }
  var v=(Math.round(1000*interesses/appels)/10)+' %';
  if(appels<SEUIL_SOLIDE){
    return {texte:v,aide:'estimation sur '+nb(appels)+' appels, à confirmer vers '+SEUIL_SOLIDE};
  }
  return {texte:v,aide:'sur '+nb(appels)+' appels, l’ordre de grandeur tient'};
}

var OBJ=null;      /* {appels, interesses} du commercial connecté */

async function objectifs(){
  if(OBJ)return OBJ;
  OBJ={appels:40,interesses:3};
  try{
    var e=await lire('oq_equipe','select=objectif_appels,objectif_interesses&email=eq.'
      +encodeURIComponent(moi||''));
    if(e[0]){
      OBJ.appels=e[0].objectif_appels||40;
      OBJ.interesses=e[0].objectif_interesses||3;
    }
  }catch(x){}
  return OBJ;
}

/* La série : le nombre de jours d'affilée où l'objectif a été tenu. On
   remonte à partir d'hier, aujourd'hui ne compte que s'il est déjà
   atteint, sinon la série paraîtrait cassée dès le matin. */
async function serie(cible){
  try{
    var d0=new Date(); d0.setDate(d0.getDate()-30); d0.setHours(0,0,0,0);
    var app=await lire('oq_appels','select=created_at&owner_email=eq.'
      +encodeURIComponent(moi||'')+'&created_at=gte.'+d0.toISOString()+'&limit=3000');
    var parJour={};
    app.forEach(function(a){ var j=String(a.created_at).slice(0,10); parJour[j]=(parJour[j]||0)+1; });
    var n=0, d=new Date();
    if((parJour[d.toISOString().slice(0,10)]||0)<cible) d.setDate(d.getDate()-1);
    for(var i=0;i<30;i++){
      var k=d.toISOString().slice(0,10);
      if((parJour[k]||0)>=cible){ n++; d.setDate(d.getDate()-1); } else break;
    }
    return n;
  }catch(x){ return 0; }
}

/* L'anneau : plus lisible qu'une barre pour un objectif à atteindre,
   parce qu'on voit ce qui reste autant que ce qui est fait. */
function anneau(fait,cible,taille){
  var t=taille||132, r=(t/2)-9, c=2*Math.PI*r;
  var part=Math.max(0,Math.min(1,cible?fait/cible:0));
  return '<svg class="anneau" viewBox="0 0 '+t+' '+t+'" width="'+t+'" height="'+t+'">'
    +'<circle cx="'+(t/2)+'" cy="'+(t/2)+'" r="'+r+'" class="piste-a"/>'
    +'<circle cx="'+(t/2)+'" cy="'+(t/2)+'" r="'+r+'" class="trace-a" '
      +'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-part)).toFixed(1)+'"/>'
    +'<text x="'+(t/2)+'" y="'+(t/2-2)+'" class="a-n">'+nb(fait)+'</text>'
    +'<text x="'+(t/2)+'" y="'+(t/2+16)+'" class="a-l">sur '+nb(cible)+'</text>'
    +'</svg>';
}

function mot(fait,cible){
  if(!fait)return 'La première est toujours la plus dure. Après, ça roule.';
  if(fait>=cible)return 'Objectif tenu. Chaque appel de plus est du bonus.';
  var reste=cible-fait;
  if(reste<=3)return 'Plus que '+reste+' pour tenir la journée.';
  if(fait/cible>=0.5)return 'La moitié est faite, la seconde va plus vite.';
  return 'Encore '+reste+' appels. À votre rythme.';
}
