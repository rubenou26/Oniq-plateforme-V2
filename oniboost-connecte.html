<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OniBoost · Connexion de votre boîte mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',system-ui,sans-serif;background:radial-gradient(circle at 18% 0%,rgba(212,162,76,.14),transparent 55%),linear-gradient(180deg,#1F1A14,#25201A,#1A150F);color:#F4E9D5;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center}
  .card{max-width:460px;padding:48px 36px;background:rgba(26,21,16,.55);border:1px solid rgba(212,162,76,.25);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .logo{font-family:'Playfair Display',Georgia,serif;font-size:26px;letter-spacing:.04em;color:#E8C474;margin-bottom:18px}
  .logo small{display:block;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.28em;color:#C6A765;margin-top:4px;text-transform:uppercase}
  h2{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:22px;margin:10px 0 8px}
  .g{color:#E8C474}
  p{color:#CDBFA6;font-size:14px;line-height:1.6;margin:0}
  .ico{font-size:42px;margin-bottom:6px}
  .err{color:#E08A7A;font-size:13px;word-break:break-word}
</style>
</head>
<body>
<div class="card">
  <div class="logo">ONIQ<small>OniBoost</small></div>
  <div id="box"><div class="ico">⏳</div><p>Vérification…</p></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var ok = q.get('ok') === '1';
  var email = q.get('email') || '';
  var err = q.get('err') || '';
  var box = document.getElementById('box');
  if (ok) {
    box.innerHTML = '<div class="ico">✅</div><h2><span class="g">' + email.replace(/[<>&]/g,'') + '</span> connectée à OniBoost</h2>' +
      '<p>L\'IA peut maintenant lire et répondre à vos emails.<br>Cette fenêtre va se fermer toute seule.</p>';
    try { window.opener && window.opener.postMessage({ oniboost: 'connected', email: email }, '*'); } catch (e) {}
    setTimeout(function(){ window.close(); }, 2200);
  } else {
    box.innerHTML = '<div class="ico">⚠️</div><h2>Échec de connexion</h2>' +
      '<p>La boîte n\'a pas pu être connectée.</p>' +
      (err ? '<p class="err" style="margin-top:10px">' + err.replace(/[<>&]/g,'') + '</p>' : '') +
      '<p style="margin-top:14px">Fermez cette fenêtre et réessayez.</p>';
  }
</script>
</body>
</html>
